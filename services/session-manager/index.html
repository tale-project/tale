<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      id="theme-color"
      name="theme-color"
      content="#fcfcfc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      id="theme-color-dark"
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Local manager for isolated Camoufox browser sessions, each with its own profile, fingerprint and proxy"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      id="favicon-light"
      rel="icon"
      type="image/png"
      href="/favicon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      id="favicon-dark"
      rel="icon"
      type="image/png"
      href="/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <title>Session Manager</title>
  </head>
  <body class="font-sans antialiased">
    <script>
      // Applies the theme before the first paint, so a person on Dark never
      // sees the light palette while the app loads. Mirrors the ThemeProvider
      // of @tale/ui (storage key, system fallback) and services/ui-docs, and
      // pins the tab icon and the theme-color to the resolved theme as
      // ThemeAssets does once the app is running.
      (function () {
        try {
          var stored = localStorage.getItem('tale-theme');
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system';
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          var root = document.documentElement;
          if (resolved === 'dark') root.classList.add('dark');
          root.style.colorScheme = resolved;
          var pin = function (id, show) {
            var element = document.getElementById(id);
            // An attribute, as ThemeAssets sets it: not every browser has a
            // `media` property on a <meta>.
            if (element)
              element.setAttribute('media', show ? 'all' : 'not all');
          };
          pin('favicon-light', resolved === 'light');
          pin('favicon-dark', resolved === 'dark');
          pin('theme-color', resolved === 'light');
          pin('theme-color-dark', resolved === 'dark');
        } catch (error) {
          // A browser that blocks its storage: the app picks the theme itself.
          console.warn(
            'Failed to apply the theme before the first paint',
            error,
          );
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
