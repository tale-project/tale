# The Secrets section. The server words the kinds of secret and their starting
# fields in English only; `kinds` and `fields` are what the person reads for
# them. A field label no catalog knows is shown as it was typed.
kinds:
  personal: Personal information
  credentials: Credentials
  card: Credit card
  note: Note
kindHints:
  personal: Name, email, phone, address and company.
  credentials: A website with its username and password.
  card: Cardholder, card number, expiration date and CVC.
  note: Any text you want to keep at hand.
titleExamples:
  personal: e.g. My details
  credentials: e.g. Shop login
  card: e.g. Visa ending 4242
  note: e.g. Recovery codes
fields:
  name: Name
  email: Email
  phone: Phone
  address: Address
  company: Company
  companyAddress: Company address
  website: Website
  username: Username
  password: Password
  cardholder: Cardholder
  cardNumber: Card number
  expiry: Expiration date
  cvc: CVC
  note: Note
scope:
  label: Available to
  all: All secrets
  global: Every session
  everySession: Every session
  session: "Session \"{name}\""
  search: Search sessions
  none: No sessions found
  loading: Loading sessions…
  loadFailed: Couldn't load the sessions.
  capped: "Only the newest {count, number} of {total, number} sessions are listed."
summary: "{kind} · {scope}"
filters:
  type: Type
  all: All
  scope: Available to
  active: Active filters
  chip: "{filter}: {value}"
  remove: "Remove filter {chip}"
  clearAll: Clear filters
actions:
  add: Add secret
  view: View
  edit: Edit
table:
  caption: Secrets
  searchPlaceholder: Search secrets
  entityOne: secret
  entityOther: secrets
  columns:
    title: Title
    type: Type
    scope: Available to
    details: Details
    updated: Updated
  noDetails: No details
  actionsFor: "Actions for {title}"
empty:
  title: No secrets yet
  description: Add logins, cards, personal details and notes to fill in pages with a click. Connected AI assistants can use them too.
noMatches:
  showAll: Show all secrets
refreshFailed: Couldn't load the latest secrets. What's listed may be incomplete or out of date.
listFailed: Couldn't load the secrets.
loadFailed: Couldn't load the secret.
kindsFailed: Couldn't load the secret types.
form:
  createTitle: Add secret
  createSubmit: Add secret
  editTitle: Edit secret
  kind: Type
  title: Title
  values: Values
  addField: Add field
  hiddenHint: Hidden values show as dots here and are left out of the list.
row:
  name: "Field {position}"
  label: Label
  value: Value
  keepHidden: Keep hidden
  keepHiddenFor: "Keep hidden: {label}"
  remove: "Remove {label}"
  show: "Show {label}"
  hide: "Hide {label}"
  copy: "Copy {label}"
  copied: "{label} copied"
validation:
  titleRequired: Enter a title.
  titleTooLong: "Shorten the title to {max, number} characters or fewer."
  labelRequired: "Enter a label for this value (e.g. Username)."
  labelTooLong: "Shorten the label to {max, number} characters or fewer."
  valueTooLong: 'Shorten "{label}" to {max, number} characters or fewer.'
  noValues: Enter at least one value.
  tooMany: "A secret can have at most {max, number} values. Remove one to continue."
view:
  title: Secret details
  hidden: Hidden
delete:
  title: 'Delete "{title}"?'
  confirm: Delete secret
  description: Sessions and connected AI assistants lose access to it immediately. This can't be undone.
toasts:
  created: Secret added
  saved: Secret updated
  deleted: Secret deleted
  createFailed: Couldn't add the secret
  saveFailed: Couldn't save the secret
  deleteFailed: Couldn't delete the secret
