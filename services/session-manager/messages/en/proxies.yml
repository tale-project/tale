parseErrors:
  empty: The line is empty.
  whitespace: A proxy can't contain spaces or control characters.
  unsupported_socks4: SOCKS4 proxies aren't supported (no authentication, IPv4 only). Use SOCKS5 or HTTP.
  unsupported_socks4a: SOCKS4a proxies aren't supported. Use SOCKS5 or HTTP.
  unsupported_scheme: This proxy type isn't supported. Use HTTP, HTTPS or SOCKS5.
  invalid_port_value: Invalid port {port}. A port is a number from 1 to 65535.
  url_has_path: A proxy address can't have a path, query or fragment.
  bracketed_ipv6_unparsed: "Couldn't read the IPv6 proxy. Write it as [ipv6]:port or [ipv6]:port:user:pass."
  missing_port: The port is missing. Write the proxy as host:port.
  missing_port_ipv6: "The port is missing. Write the proxy as [ipv6]:port."
  ipv6_needs_brackets: "Put an IPv6 address in brackets, for example [2001:db8::1]:8080."
  unparsed_form: "Couldn't read this proxy. Use host:port, host:port:user:pass or user:pass:host:port."
  unparsed_url_form: "Couldn't read this proxy. Use host:port, host:port:user:pass or scheme://user:pass@host:port."
  ambiguous: "Can't tell the host from the username and password. Write it as scheme://user:pass@host:port."
  invalid_port: The port must be a number from 1 to 65535.
  host_port_not_found: Couldn't find a host and port.
  unterminated_bracket: The bracket of the IPv6 address isn't closed.
  invalid_after_ipv6: There are unexpected characters after the IPv6 address.
  invalid_ipv6: This isn't a valid IPv6 address.
  missing_host: The host is missing.
  invalid_ipv4: This isn't a valid IPv4 address.
  invalid_hostname: This isn't a valid host name.
  password_without_username: A password needs a username.
  username_has_colon: A username can't contain a colon.
  credentials_control_chars: The username and password can't contain control characters.
  socks_credentials_too_long: A SOCKS5 username and password are limited to 255 bytes each.
  line_too_long: "The line is too long (over {max, number} characters)."
