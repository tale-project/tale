  renameFailed: Couldn't rename the session
  startFailed: Couldn't start the session
  stopFailed: Couldn't stop the session
  restartFailed: Couldn't restart the session
  rotateFailed: Couldn't rotate the IP
  checkIpFailed: Couldn't check the IP
  deleteFailed: Couldn't delete the session
  exportFailed: Couldn't export the proxies
status:
  stopped: Stopped
  assigning: Assigning proxy
  starting: Starting
  running: Running
  stopping: Stopping
  error: Error
# A session's name inside a sentence, quoted the way the language quotes.
quoted: '"{text}"'
addProxies: Add proxies
panel:
  title: Sessions
  add: Add session
  more: More actions
  export: Export session proxies as JSON
  exportNote: Includes the proxy passwords.
list:
  label: Session list
  loadFailed: "Couldn't load the sessions."
  refreshFailed: Couldn't load the latest sessions. What's listed may be incomplete or out of date.
  loadingMore: Loading more…
  total: "{count, plural, one {Showing all # session} other {Showing all # sessions}}"
  partial: "Showing {loaded, number} of {count, plural, one {# session} other {# sessions}}"
empty:
  title: No sessions yet
  description: Add a session to get an isolated browser with a profile and proxy of its own.
  noProxies: Add proxies first. Every session needs one of its own.
index:
  title: No session open
  choose: Choose a session from the list to open it.
  # With no sessions the panel carries the way to add one: this says where they will be.
  addFirst: Sessions you add appear on the left.
row:
  start: Start {name}
  stop: Stop {name}
  menu: Actions for {name}
  ipChanged: IP changed · restart recommended
block:
  installing: The browser is being installed.
  missing: The browser isn't installed yet.
  busy: The session is busy.
  stopping: The session is already stopping.
menu:
  rename: Rename
  restart: Restart
  restartOnlyRunning: Only a running session can be restarted.
  rotate: Rotate IP
  rotateEffect: Switches to another working proxy.
  rotateBusy: Wait until the session has finished starting or stopping.
  checkIp: Check IP
  checkIpOnlyRunning: Only a running session can be checked.
  checkIpNoProxy: The session has no proxy.
rename:
  title: Rename session
  label: Name
  submit: Rename session
restart:
  title: Restart {name}?
  description: The browser closes and opens again with the same tabs. The time zone and location are updated to match the proxy's current exit IP.
  confirm: Restart session
rotate:
  title: Rotate the IP of {name}?
  description: The browser restarts with another working proxy. Cookies and logins are kept.
  confirm: Rotate IP
delete:
  title: Delete {name}?
  description: The session's browser profile (cookies, site data, history) and its own secrets are deleted permanently. Its proxy becomes free.
  descriptionBrowserOpen: The session's browser profile (cookies, site data, history) and its own secrets are deleted permanently. Its proxy becomes free. The browser is closed first.
  secrets: "{count, plural, one {# secret is deleted with the session.} other {# secrets are deleted with the session.}}"
  confirm: Delete session
add:
  title: Add session
  description: The session starts right away, with a proxy of its own.
  name: Name
  nameHint: Leave blank to use the next free number.
  system: Operating system
  os:
    random: Random (Windows or macOS)
    windows: Windows
    macos: macOS
    linux: Linux
  submit: Add session
sharedIp:
  title: Same exit IP as another session
  running: "{count, plural, one {The running session {names} already uses the exit IP {ip}.} other {The running sessions {names} already use the exit IP {ip}.}}"
  consequence: If the session {name} starts with the same exit IP too, websites can tell that these sessions belong together.
  hint: Rotate IP switches the session {name} to another working proxy and starts it.
  confirm: Start anyway
  rotate: Rotate IP
brokenProxy:
  title: The proxy of {name} isn't working
  reason: "The last check failed: {reason}."
  hint: Rotate IP switches the session {name} to another working proxy and starts it.
  rotate: Rotate IP
noProxy:
  title: No free proxy available
  intro:
    start: Every session needs a proxy of its own, and none is free right now. Add proxies and the session will start automatically.
    rotate: Every session needs a proxy of its own, and none is free right now. Add proxies and the session will switch to one of them automatically.
    create: Every session needs a proxy of its own, and none is free right now. Add proxies and the session will be added automatically.
noWorking:
  title: No working proxy available
  intro: "{sessions, plural, one {Once you add proxies, the session {names} gets one of them automatically.} other {Once you add proxies, the sessions {names} get one of them automatically.}}"
  introFailed: "{failed, plural, one {# proxy failed its check.} other {# proxies failed their check.}} {sessions, plural, one {Once you add proxies, the session {names} gets one of them automatically.} other {Once you add proxies, the sessions {names} get one of them automatically.}}"
notices:
  exported: "{filename} exported"
  ipSameTitle: Exit IP unchanged
  ipSame: The proxy still exits through {ip}. The time zone and location still match.
  ipChangedTitle: Exit IP changed
  ipChanged: The proxy now exits through {now}, not {was}. Restart the session to update its time zone and location.
