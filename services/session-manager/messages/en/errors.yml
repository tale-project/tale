# One sentence per error code the backend answers with. The app words an error
# from its code, in the person's language; a code that is missing here shows
# `fallback`, never the backend's own English sentence. A few codes have more
# sentences, `<code>_<what>`, for when the backend says why: the cause, how many
# proxies failed, what the session is doing. The plain one is for when it does
# not (older data, AI clients). A cause is the backend's English text in every
# language, like the check error on the Proxies page. `server_error` and
# `bad_answer` are made by the page, not sent by the backend: an answer that is
# no JSON of the app (a gateway's error page), and one the page cannot read.
# Beside a Try again button (a failed read) `readFailureText` and
# `readFailureCause` leave out the sentences that only say to try again,
# `internal_error`, `server_error`, `network` and `fallback`: a new sentence of
# that kind belongs in their list (`app/lib/api/failure.ts`).
fallback: Something went wrong. Try again.
internal_error: Something went wrong. Try again.
network: Can't reach Session Manager. Check that it's running, then try again.
server_error: Session Manager answered with an error. Try again.
bad_answer: Session Manager sent an answer this page can't read. Reload the page.
forbidden_host: Open Session Manager at 127.0.0.1 or localhost.
forbidden_origin: This request came from another website and was blocked.
validation_error: Check the values and try again.
session_not_found: This session no longer exists.
proxy_not_found: This proxy no longer exists.
secret_not_found: This secret no longer exists.
session_not_running: This session isn't running. Start it first.
session_running: This session is already running.
session_busy: This session is busy. Try again in a moment.
session_busy_assigning_proxy: This session is getting a proxy. Try again in a moment.
session_busy_starting: This session is starting. Try again in a moment.
session_busy_stopping: This session is stopping. Try again in a moment.
no_proxy: This session has no proxy.
no_free_proxy: "No free proxy is available. Every session needs its own proxy, so add proxies to continue."
no_working_proxy: No working proxy is available. Add proxies or check the existing ones, then try again.
no_working_proxy_failed: "No working proxy is available ({failed, plural, one {# proxy failed its check} other {# proxies failed their check}}). Add proxies or check the existing ones, then try again."
proxy_unreachable: This session's proxy isn't working. Choose Rotate IP to give the session another proxy.
proxy_unreachable_reason: "This session's proxy isn't working: {reason}. Choose Rotate IP to give the session another proxy."
proxy_busy: A session is using this proxy right now. Stop the session first.
proxy_in_use: A session uses this proxy. If you delete the proxy, the session gets another one on its next start.
ip_in_use: Another running session already uses this exit IP.
duplicate: This proxy is already in the pool.
invalid_proxy: This isn't a valid proxy.
invalid_name: The name must be 1 to 80 characters long.
name_taken: A session with this name already exists.
invalid_secret: Check the values of this secret.
invalid_kind: This type of secret doesn't exist.
invalid_scope: This scope doesn't exist.
invalid_start_page: The start page must be a web address, for example https://www.google.com.
browser_installing: The browser is still being installed. Try again once it is ready.
browser_not_installed: The browser isn't installed yet.
fingerprint_exhausted: Couldn't generate a new fingerprint that differs from every existing session. Try another operating system.
unknown_ip_location: Couldn't find the time zone and location of the proxy's exit IP.
unknown_ip_location_reason: "Couldn't find the time zone and location of the proxy's exit IP: {reason}."
nothing_to_export: No session has a proxy yet, so there is nothing to export.
