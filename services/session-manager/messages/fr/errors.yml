# One sentence per error code the backend answers with. The app words an error
# from its code, in the person's language; a code that is missing here shows
# `fallback`, never the backend's own English sentence. A few codes have more
# sentences, `<code>_<what>`, for when the backend says why: the cause, how many
# proxies failed, what the session is doing. The plain one is for when it does
# not (older data, AI clients). A cause is the backend's English text in every
# language, like the check error on the Proxies page. `server_error` and
# `bad_answer` are made by the page, not sent by the backend: an answer that is
# no JSON of the app (a gateway's error page), and one the page cannot read.
# Beside a Try again button (a failed read) `readFailureText` and
# `readFailureCause` leave out the sentences that only say to try again,
# `internal_error`, `server_error`, `network` and `fallback`: a new sentence of
# that kind belongs in their list (`app/lib/api/failure.ts`).
fallback: Une erreur s'est produite. Réessaie.
internal_error: Une erreur s'est produite. Réessaie.
network: Impossible de joindre Session Manager. Vérifie qu'il est lancé, puis réessaie.
server_error: Session Manager a répondu par une erreur. Réessaie.
bad_answer: Session Manager a envoyé une réponse que cette page ne peut pas lire. Recharge la page.
forbidden_host: Ouvre Session Manager à l'adresse 127.0.0.1 ou localhost.
forbidden_origin: Cette requête vient d'un autre site web et a été bloquée.
validation_error: Vérifie les valeurs, puis réessaie.
session_not_found: Cette session n'existe plus.
proxy_not_found: Ce proxy n'existe plus.
secret_not_found: Ce secret n'existe plus.
session_not_running: Cette session n'est pas en cours. Démarre-la d'abord.
session_running: Cette session est déjà en cours.
session_busy: Cette session est occupée. Réessaie dans un instant.
session_busy_assigning_proxy: Un proxy est en cours d'attribution à cette session. Réessaie dans un instant.
session_busy_starting: Cette session est en cours de démarrage. Réessaie dans un instant.
session_busy_stopping: Cette session est en cours d'arrêt. Réessaie dans un instant.
no_proxy: Cette session n'a pas de proxy.
no_free_proxy: "Aucun proxy libre n'est disponible. Chaque session a besoin de son propre proxy. Ajoute des proxys pour continuer."
no_working_proxy: Aucun proxy fonctionnel n'est disponible. Ajoute des proxys ou vérifie ceux qui existent, puis réessaie.
no_working_proxy_failed: "Aucun proxy fonctionnel n'est disponible ({failed, plural, one {# proxy a échoué à la vérification} other {# proxys ont échoué à la vérification}}). Ajoute des proxys ou vérifie ceux qui existent, puis réessaie."
proxy_unreachable: Le proxy de cette session ne fonctionne pas. Choisis Changer d'IP pour lui donner un autre proxy.
proxy_unreachable_reason: "Le proxy de cette session ne fonctionne pas : {reason}. Choisis Changer d'IP pour lui donner un autre proxy."
proxy_busy: Une session utilise ce proxy en ce moment. Arrête d'abord la session.
proxy_in_use: Une session utilise ce proxy. Si tu le supprimes, la session en recevra un autre à son prochain démarrage.
ip_in_use: Une autre session en cours utilise déjà cette IP de sortie.
duplicate: Ce proxy est déjà dans le pool.
invalid_proxy: Ce proxy n'est pas valide.
invalid_name: Le nom doit comporter entre 1 et 80 caractères.
name_taken: Une session portant ce nom existe déjà.
invalid_secret: Vérifie les valeurs de ce secret.
invalid_kind: Ce type de secret n'existe pas.
invalid_scope: Cette portée n'existe pas.
invalid_start_page: La page de démarrage doit être une adresse web, par exemple https://www.google.com.
browser_installing: Le navigateur est encore en cours d'installation. Réessaie dès qu'il sera prêt.
browser_not_installed: Le navigateur n'est pas encore installé.
fingerprint_exhausted: Impossible de générer une empreinte différente de celles des sessions existantes. Essaie un autre système d'exploitation.
unknown_ip_location: Impossible de déterminer le fuseau horaire et la position de l'IP de sortie du proxy.
unknown_ip_location_reason: "Impossible de déterminer le fuseau horaire et la position de l'IP de sortie du proxy : {reason}."
nothing_to_export: "Aucune session n'a encore de proxy : il n'y a rien à exporter."
