  confirm: Supprimer la session
add:
  title: Ajouter une session
  description: La session démarre tout de suite, avec son propre proxy.
  name: Nom
  nameHint: Laisse vide pour utiliser le prochain numéro libre.
  system: Système d'exploitation
  os:
    random: Aléatoire
    windows: Windows
    macos: macOS
    linux: Linux
