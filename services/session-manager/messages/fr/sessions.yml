noProxy:
  title: Aucun proxy libre disponible
  intro:
    start: Chaque session a besoin de son propre proxy, et aucun n'est libre pour le moment. Ajoute des proxys, et la session démarrera automatiquement.
    rotate: Chaque session a besoin de son propre proxy, et aucun n'est libre pour le moment. Ajoute des proxys, et la session passera automatiquement à l'un d'eux.
    create: Chaque session a besoin de son propre proxy, et aucun n'est libre pour le moment. Ajoute des proxys, et la session sera ajoutée automatiquement.
noWorking:
  title: Aucun proxy fonctionnel disponible
  intro: "{sessions, plural, one {Dès que tu ajoutes des proxys, la session {names} en reçoit un automatiquement.} other {Dès que tu ajoutes des proxys, les sessions {names} en reçoivent chacune un automatiquement.}}"
  introFailed: "{failed, plural, one {# proxy a échoué à la vérification.} other {# proxys ont échoué à la vérification.}} {sessions, plural, one {Dès que tu ajoutes des proxys, la session {names} en reçoit un automatiquement.} other {Dès que tu ajoutes des proxys, les sessions {names} en reçoivent chacune un automatiquement.}}"
