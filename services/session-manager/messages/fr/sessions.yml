sharedIp:
  title: Même IP de sortie qu'une autre session
  running: "{count, plural, one {La session en cours {names} utilise déjà l'IP de sortie {ip}.} other {Les sessions en cours {names} utilisent déjà l'IP de sortie {ip}.}}"
  consequence: Si la session {name} démarre avec la même IP de sortie, les sites web peuvent détecter que ces sessions sont liées.
  hint: "Si tu choisis Changer d'IP, la session {name} reçoit un autre proxy fonctionnel, puis démarre."
  confirm: Démarrer quand même
  rotate: Changer d'IP
brokenProxy:
  title: Le proxy de {name} ne fonctionne pas
  reason: "La dernière vérification a échoué : {reason}."
