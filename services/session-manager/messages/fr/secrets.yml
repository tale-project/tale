# La section Secrets. Le serveur nomme les types de secret et leurs champs de
# départ en anglais seulement ; `kinds` et `fields` sont ce que la personne lit
# à la place. Un libellé de champ qu'aucun catalogue ne connaît reste tel qu'il
# a été saisi. Les espaces insécables (\xA0) précèdent « : », « ? » et « » ».
