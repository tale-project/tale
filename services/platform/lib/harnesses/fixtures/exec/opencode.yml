managed-baseline:
  argv:
    - opencode
    - run
    - --format
    - json
    - --dir
    - /user/workspace
    - 'Golden battery prompt: fix the flaky login test'
  env:
    OPENCODE_CONFIG_CONTENT:
      '{"$schema":"https://opencode.ai/config.json","provider":{"tale":{"npm":"@ai-sdk/openai-compatible","name":"Tale
      Gateway","options":{"baseURL":"http://golden-gw:8080/openai/v1","apiKey":"{env:TALE_GATEWAY_TOKEN}"},"models":{"default":{"name":"default"}}}},"model":"tale/default","permission":{"*":"allow","question":"deny","webfetch":"deny","websearch":"deny"},"share":"disabled","autoupdate":false}'
    TALE_GATEWAY_TOKEN: golden-session-virtual-key
  cwd: /user/workspace
  stdinMode: close
