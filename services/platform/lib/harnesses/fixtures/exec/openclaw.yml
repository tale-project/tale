managed-baseline:
  argv:
    - tale-openclaw-run
    - --workdir
    - /user/workspace
  env:
    OPENCLAW_STATE_DIR: /user/.runtime/home/.openclaw
    TALE_GATEWAY_TOKEN: golden-session-virtual-key
  cwd: /user/workspace
  stdin: '{"prompt":"Golden battery prompt: fix the flaky login
    test","config":{"agents":{"defaults":{"workspace":"/user/workspace","skipBootstrap":true}},"tools":{"profile":"coding","deny":["web_search","web_fetch","x_search"]},"models":{"providers":{"tale":{"baseUrl":"http://golden-gw:8080/openai/v1","apiKey":"${TALE_GATEWAY_TOKEN}","api":"openai-completions","models":[]}}}}}'
  stdinMode: close
