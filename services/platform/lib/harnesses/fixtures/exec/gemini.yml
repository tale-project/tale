managed-baseline:
  argv:
    - tale-gemini-run
    - --workdir
    - /user/workspace
  env:
    GEMINI_API_KEY: golden-session-virtual-key
    GOOGLE_GEMINI_BASE_URL: http://golden-gw:8080/genai
    TALE_GATEWAY_TOKEN: golden-session-virtual-key
  cwd: /user/workspace
  stdin: '{"prompt":"Golden battery prompt: fix the flaky login
    test","settings":{"security":{"auth":{"selectedType":"gemini-api-key"}},"privacy":{"usageStatisticsEnabled":false},"model":{"maxSessionTurns":200},"tools":{"exclude":["google_web_search","web_fetch"]}}}'
  stdinMode: close
