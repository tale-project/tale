byo-baseline:
  argv:
    - agent
    - -p
    - --force
    - --trust
    - --sandbox
    - disabled
    - --output-format
    - stream-json
    - --workspace
    - /user/workspace
    - 'Golden battery prompt: fix the flaky login test'
  env:
    GOLDEN_BYO_KEY: golden-byo-credential-secret
  cwd: /user/workspace
  stdinMode: close
