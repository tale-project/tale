managed-baseline:
  argv:
    - codex
    - exec
    - --json
    - --skip-git-repo-check
    - -c
    - approval_policy="never"
    - -c
    - sandbox_mode="danger-full-access"
    - -c
    - web_search="disabled"
    - -c
    - model_provider="tale"
    - -c
    - model_providers.tale.name="Tale Gateway"
    - -c
    - model_providers.tale.base_url="http://golden-gw:8080/openai/v1"
    - -c
    - model_providers.tale.env_key="TALE_GATEWAY_TOKEN"
    - -c
    - model_providers.tale.wire_api="responses"
    - '-'
  env:
    CODEX_HOME: /user/.runtime/home/.codex
    TALE_GATEWAY_TOKEN: golden-session-virtual-key
  cwd: /user/workspace
  stdin: 'Golden battery prompt: fix the flaky login test'
  stdinMode: close
