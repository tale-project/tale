managed-baseline:
  argv:
    - claude
    - -p
    - --output-format
    - stream-json
    - --input-format
    - stream-json
    - --verbose
    - --include-partial-messages
    - --permission-mode
    - bypassPermissions
    - --max-turns
    - '200'
    - --append-system-prompt
    - >-
      ## Notes


      - If the repository you are working in contains an AGENTS.md file, read it
      and follow its instructions.

      - Respect hooks that change formatting; don't hand-format or re-run a
      formatter.


      ## Git


      - **Never** add `Co-Authored-By` to commit messages.

      - **Never** add "Generated with Claude Code" or any similar attribution to
      commits or PR descriptions.


      ## Other


      - **Never** use an empty catch block — log
      (`console.warn`/`console.error`) or re-throw.
    - --disallowedTools
    - AskUserQuestion,WebSearch,WebFetch
  env:
    ANTHROPIC_API_KEY: ''
    ANTHROPIC_AUTH_TOKEN: golden-session-virtual-key
    ANTHROPIC_BASE_URL: http://golden-gw:8080/anthropic
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    CLAUDE_CONFIG_DIR: /agent/.runtime/home/.claude
  cwd: /agent/workspace
  stdin: |
    {"type":"user","message":{"role":"user","content":[{"type":"text","text":"Ultrathink: Golden battery prompt: fix the flaky login test"}]}}
  stdinMode: hold
