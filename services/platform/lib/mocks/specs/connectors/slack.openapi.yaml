openapi: 3.1.0
info:
  title: Slack Web API (mock)
  version: '1.0.0'
  description: >-
    Trimmed spec for the operations the Slack connector
    (`configs/platform/system/connectors/slack/connector.yml`) actually calls. Mounted
    by the mock gateway at `/mock/slack`; paths mirror `https://slack.com/api`.
    All responses are Slack's JSON envelope shaped `{ "ok": true, ... }`.
servers:
  - url: /mock/slack
components:
  schemas:
    Channel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        is_channel: { type: boolean }
        is_private: { type: boolean }
        is_archived: { type: boolean }
        num_members: { type: integer }
        topic: { type: object }
        purpose: { type: object }
        created: { type: integer }
    Message:
      type: object
      properties:
        type: { type: string }
        user: { type: string }
        text: { type: string }
        ts: { type: string }
        thread_ts: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        team_id: { type: string }
        name: { type: string }
        real_name: { type: string }
        is_bot: { type: boolean }
        deleted: { type: boolean }
        profile: { type: object }
    ResponseMetadata:
      type: object
      properties:
        next_cursor: { type: string }
paths:
  /api/auth.test:
    post:
      operationId: authTest
      summary: Test authentication (test connection).
      responses:
        '200':
          description: The authenticated bot identity.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  url: { type: string }
                  team: { type: string }
                  user: { type: string }
                  team_id: { type: string }
                  user_id: { type: string }
              example:
                ok: true
                url: https://tale-mock.slack.com/
                team: Tale Mock Workspace
                user: tale-mock-bot
                team_id: T0MOCK0001
                user_id: U0MOCKBOT1
  /api/conversations.list:
    post:
      operationId: conversationsList
      summary: List channels (conversations).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer }
                cursor: { type: string }
                types: { type: string }
      responses:
        '200':
          description: A list of channels.
          content:
            application/json:
              schema:
                type: object
                required: [ok, channels]
                properties:
                  ok: { type: boolean }
                  channels:
                    type: array
                    items: { $ref: '#/components/schemas/Channel' }
                  response_metadata:
                    { $ref: '#/components/schemas/ResponseMetadata' }
              example:
                ok: true
                channels:
                  - id: C0MOCK0001
                    name: general
                    is_channel: true
                    is_private: false
                    is_archived: false
                    num_members: 42
                    topic:
                      {
                        value: Company-wide announcements,
                        creator: U0MOCKBOT1,
                        last_set: 1700000000,
                      }
                    purpose:
                      {
                        value: General discussion,
                        creator: U0MOCKBOT1,
                        last_set: 1700000000,
                      }
                    created: 1700000000
                  - id: C0MOCK0002
                    name: random
                    is_channel: true
                    is_private: false
                    is_archived: false
                    num_members: 17
                    topic: { value: '', creator: '', last_set: 0 }
                    purpose:
                      {
                        value: Non-work banter,
                        creator: U0MOCKBOT1,
                        last_set: 1700000000,
                      }
                    created: 1700000100
                response_metadata:
                  next_cursor: ''
  /api/conversations.info:
    post:
      operationId: conversationsInfo
      summary: Get a single channel's info.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string }
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema:
                type: object
                required: [ok, channel]
                properties:
                  ok: { type: boolean }
                  channel: { $ref: '#/components/schemas/Channel' }
              example:
                ok: true
                channel:
                  id: C0MOCK0001
                  name: general
                  is_channel: true
                  is_private: false
                  is_archived: false
                  num_members: 42
                  topic:
                    {
                      value: Company-wide announcements,
                      creator: U0MOCKBOT1,
                      last_set: 1700000000,
                    }
                  purpose:
                    {
                      value: General discussion,
                      creator: U0MOCKBOT1,
                      last_set: 1700000000,
                    }
                  created: 1700000000
  /api/conversations.history:
    post:
      operationId: conversationsHistory
      summary: List messages in a channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string }
                limit: { type: integer }
                cursor: { type: string }
                oldest: { type: string }
                latest: { type: string }
      responses:
        '200':
          description: A list of messages.
          content:
            application/json:
              schema:
                type: object
                required: [ok, messages]
                properties:
                  ok: { type: boolean }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  has_more: { type: boolean }
                  response_metadata:
                    { $ref: '#/components/schemas/ResponseMetadata' }
              example:
                ok: true
                messages:
                  - type: message
                    user: U0MOCKBOT1
                    text: Welcome to the channel!
                    ts: '1700000300.000100'
                  - type: message
                    user: U0MOCKUSR2
                    text: Thanks for having me.
                    ts: '1700000400.000200'
                    thread_ts: '1700000300.000100'
                has_more: false
                response_metadata:
                  next_cursor: ''
  /api/chat.postMessage:
    post:
      operationId: chatPostMessage
      summary: Send a message to a channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, text]
              properties:
                channel: { type: string }
                text: { type: string }
                blocks: { type: array }
                thread_ts: { type: string }
      responses:
        '200':
          description: The posted message.
          content:
            application/json:
              schema:
                type: object
                required: [ok, channel, ts, message]
                properties:
                  ok: { type: boolean }
                  channel: { type: string }
                  ts: { type: string }
                  message: { $ref: '#/components/schemas/Message' }
              example:
                ok: true
                channel: C0MOCK0001
                ts: '1700000500.000300'
                message:
                  type: message
                  user: U0MOCKBOT1
                  text: Hello from the mock connector.
                  ts: '1700000500.000300'
  /api/users.list:
    post:
      operationId: usersList
      summary: List workspace users.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer }
                cursor: { type: string }
      responses:
        '200':
          description: A list of users.
          content:
            application/json:
              schema:
                type: object
                required: [ok, members]
                properties:
                  ok: { type: boolean }
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  response_metadata:
                    { $ref: '#/components/schemas/ResponseMetadata' }
              example:
                ok: true
                members:
                  - id: U0MOCKBOT1
                    team_id: T0MOCK0001
                    name: tale-mock-bot
                    real_name: Tale Mock Bot
                    is_bot: true
                    deleted: false
                    profile:
                      {
                        real_name: Tale Mock Bot,
                        display_name: tale-bot,
                        email: '',
                      }
                  - id: U0MOCKUSR2
                    team_id: T0MOCK0001
                    name: ada
                    real_name: Ada Lovelace
                    is_bot: false
                    deleted: false
                    profile:
                      {
                        real_name: Ada Lovelace,
                        display_name: ada,
                        email: ada@example.com,
                      }
                response_metadata:
                  next_cursor: ''
  /api/users.info:
    post:
      operationId: usersInfo
      summary: Get a single user's info.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user]
              properties:
                user: { type: string }
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required: [ok, user]
                properties:
                  ok: { type: boolean }
                  user: { $ref: '#/components/schemas/User' }
              example:
                ok: true
                user:
                  id: U0MOCKUSR2
                  team_id: T0MOCK0001
                  name: ada
                  real_name: Ada Lovelace
                  is_bot: false
                  deleted: false
                  profile:
                    {
                      real_name: Ada Lovelace,
                      display_name: ada,
                      email: ada@example.com,
                    }
  /api/files.getUploadURLExternal:
    post:
      operationId: filesGetUploadURLExternal
      summary: Get a one-time external upload URL for a file.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [filename, length]
              properties:
                filename: { type: string }
                length: { type: integer }
      responses:
        '200':
          description: The upload URL and file id.
          content:
            application/json:
              schema:
                type: object
                required: [ok, upload_url, file_id]
                properties:
                  ok: { type: boolean }
                  upload_url: { type: string }
                  file_id: { type: string }
              example:
                ok: true
                upload_url: https://files.slack.com/upload/v1/mock-upload-token
                file_id: F0MOCKFILE1
  /api/files.completeUploadExternal:
    post:
      operationId: filesCompleteUploadExternal
      summary: Finalize an external file upload and share it to a channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files, channel_id]
              properties:
                files:
                  type: array
                  items: { type: object }
                channel_id: { type: string }
                initial_comment: { type: string }
      responses:
        '200':
          description: The completed file(s).
          content:
            application/json:
              schema:
                type: object
                required: [ok, files]
                properties:
                  ok: { type: boolean }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        title: { type: string }
              example:
                ok: true
                files:
                  - id: F0MOCKFILE1
                    name: report.txt
                    title: Quarterly Report
