openapi: 3.1.0
info:
  title: GitHub REST API (mock)
  version: '2022-11-28'
  description: >-
    Trimmed spec for the operations the GitHub connector
    (`configs/platform/system/connectors/github/connector.yml`) actually calls. Mounted
    by the mock gateway at `/mock/github`; paths mirror `https://api.github.com`.
servers:
  - url: /mock/github
components:
  schemas:
    SimpleUser:
      type: object
      properties:
        login: { type: string }
        id: { type: integer }
        type: { type: string }
    Repository:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        full_name: { type: string }
        private: { type: boolean }
        html_url: { type: string }
        description: { type: string }
        default_branch: { type: string }
    Issue:
      type: object
      properties:
        id: { type: integer }
        number: { type: integer }
        title: { type: string }
        state: { type: string }
        body: { type: string }
        html_url: { type: string }
    PullRequest:
      type: object
      properties:
        id: { type: integer }
        number: { type: integer }
        title: { type: string }
        state: { type: string }
        head: { type: object }
        base: { type: object }
        html_url: { type: string }
    Commit:
      type: object
      properties:
        sha: { type: string }
        commit: { type: object }
        html_url: { type: string }
paths:
  /user:
    get:
      operationId: getAuthenticatedUser
      summary: Get the authenticated user (test connection).
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleUser' }
              example:
                login: tale-mock-user
                id: 1
                type: User
  /user/repos:
    get:
      operationId: listReposForAuthenticatedUser
      summary: List repositories for the authenticated user.
      parameters:
        - { name: per_page, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: visibility, in: query, schema: { type: string } }
      responses:
        '200':
          description: A list of repositories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Repository' }
              example:
                - id: 1296269
                  name: hello-world
                  full_name: tale-mock-user/hello-world
                  private: false
                  html_url: https://github.com/tale-mock-user/hello-world
                  description: A deterministic mock repository.
                  default_branch: main
  /repos/{owner}/{repo}:
    get:
      operationId: getRepo
      summary: Get a repository.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The repository.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
              example:
                id: 1296269
                name: hello-world
                full_name: tale-mock-user/hello-world
                private: false
                html_url: https://github.com/tale-mock-user/hello-world
                description: A deterministic mock repository.
                default_branch: main
        '404':
          description: Not found.
          content:
            application/json:
              schema: { type: object }
              example: { message: Not Found }
  /repos/{owner}/{repo}/issues:
    get:
      operationId: listIssues
      summary: List repository issues.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: labels, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string } }
      responses:
        '200':
          description: A list of issues.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Issue' }
              example:
                - id: 1
                  number: 1347
                  title: Found a bug
                  state: open
                  body: The mock is deterministic.
                  html_url: https://github.com/tale-mock-user/hello-world/issues/1347
    post:
      operationId: createIssue
      summary: Create an issue.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                body: { type: string }
                labels: { type: array }
                assignees: { type: array }
              required: [title]
      responses:
        '201':
          description: The created issue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
              example:
                id: 2
                number: 1348
                title: New issue
                state: open
                body: Created by the mock.
                html_url: https://github.com/tale-mock-user/hello-world/issues/1348
  /repos/{owner}/{repo}/issues/{issue_number}:
    get:
      operationId: getIssue
      summary: Get a single issue.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - {
            name: issue_number,
            in: path,
            required: true,
            schema: { type: integer },
          }
      responses:
        '200':
          description: The issue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
              example:
                id: 1
                number: 1347
                title: Found a bug
                state: open
                body: The mock is deterministic.
                html_url: https://github.com/tale-mock-user/hello-world/issues/1347
  /repos/{owner}/{repo}/pulls:
    get:
      operationId: listPullRequests
      summary: List pull requests.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string } }
      responses:
        '200':
          description: A list of pull requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PullRequest' }
              example:
                - id: 1
                  number: 42
                  title: Add a feature
                  state: open
                  head: { ref: feature, sha: aaaaaaaaaaaa }
                  base: { ref: main, sha: bbbbbbbbbbbb }
                  html_url: https://github.com/tale-mock-user/hello-world/pull/42
    post:
      operationId: createPullRequest
      summary: Create a pull request.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                head: { type: string }
                base: { type: string }
                body: { type: string }
              required: [title, head, base]
      responses:
        '201':
          description: The created pull request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PullRequest' }
              example:
                id: 2
                number: 43
                title: New PR
                state: open
                head: { ref: feature, sha: cccccccccccc }
                base: { ref: main, sha: dddddddddddd }
                html_url: https://github.com/tale-mock-user/hello-world/pull/43
  /repos/{owner}/{repo}/commits:
    get:
      operationId: listCommits
      summary: List commits.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: sha, in: query, schema: { type: string } }
      responses:
        '200':
          description: A list of commits.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Commit' }
              example:
                - sha: 6dcb09b5b57875f334f61aebed695e2e4193db5e
                  commit:
                    message: 'Fix all the bugs'
                    author: { name: Mock Author, email: mock@example.com }
                  html_url: https://github.com/tale-mock-user/hello-world/commit/6dcb09b
  /search/code:
    get:
      operationId: searchCode
      summary: Search code.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Code search results.
          content:
            application/json:
              schema:
                type: object
                required: [total_count, items]
                properties:
                  total_count: { type: integer }
                  incomplete_results: { type: boolean }
                  items:
                    type: array
                    items: { type: object }
              example:
                total_count: 1
                incomplete_results: false
                items:
                  - name: app.ts
                    path: src/app.ts
                    sha: a1b2c3
                    html_url: https://github.com/tale-mock-user/hello-world/blob/main/src/app.ts
                    repository:
                      full_name: tale-mock-user/hello-world
