openapi: 3.1.0
info:
  title: Discord API (mock)
  version: v10
  description: >-
    Trimmed spec for the operations the Discord connector
    (`configs/platform/system/connectors/discord/connector.yml`) actually calls.
    Mounted by the mock gateway at `/mock/discord`; paths mirror
    `https://discord.com/api/v10`.
servers:
  - url: /mock/discord
components:
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        discriminator: { type: string }
        global_name: { type: string }
        bot: { type: boolean }
        avatar: { type: [string, 'null'] }
    Guild:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: [string, 'null'] }
        owner: { type: boolean }
        owner_id: { type: string }
        permissions: { type: string }
        description: { type: [string, 'null'] }
        approximate_member_count: { type: integer }
    Channel:
      type: object
      properties:
        id: { type: string }
        type: { type: integer }
        guild_id: { type: string }
        name: { type: string }
        position: { type: integer }
        topic: { type: [string, 'null'] }
        parent_id: { type: [string, 'null'] }
    Message:
      type: object
      properties:
        id: { type: string }
        channel_id: { type: string }
        content: { type: string }
        timestamp: { type: string }
        author: { $ref: '#/components/schemas/User' }
        embeds: { type: array, items: { type: object } }
    Member:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        nick: { type: [string, 'null'] }
        roles: { type: array, items: { type: string } }
        joined_at: { type: string }
paths:
  /api/v10/users/@me:
    get:
      operationId: getCurrentUser
      summary: Get the current bot user (test connection).
      responses:
        '200':
          description: The authenticated bot user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example:
                id: '900000000000000001'
                username: tale-mock-bot
                discriminator: '0001'
                global_name: Tale Mock Bot
                bot: true
                avatar: null
  /api/v10/users/@me/guilds:
    get:
      operationId: listGuilds
      summary: List the guilds the bot is a member of.
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: before, in: query, schema: { type: string } }
        - { name: after, in: query, schema: { type: string } }
      responses:
        '200':
          description: A list of guilds.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Guild' }
              example:
                - id: '800000000000000001'
                  name: Tale Mock Server
                  icon: null
                  owner: true
                  permissions: '562949953421311'
  /api/v10/guilds/{guild_id}:
    get:
      operationId: getGuild
      summary: Get a single guild.
      parameters:
        - { name: guild_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The guild.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guild' }
              example:
                id: '800000000000000001'
                name: Tale Mock Server
                icon: null
                owner_id: '900000000000000099'
                description: A deterministic mock guild.
                approximate_member_count: 3
  /api/v10/guilds/{guild_id}/channels:
    get:
      operationId: listChannels
      summary: List the channels in a guild.
      parameters:
        - { name: guild_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: A list of channels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Channel' }
              example:
                - id: '700000000000000001'
                  type: 0
                  guild_id: '800000000000000001'
                  name: general
                  position: 0
                  topic: The general channel.
                  parent_id: null
    post:
      operationId: createChannel
      summary: Create a channel in a guild.
      parameters:
        - { name: guild_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: integer }
                topic: { type: string }
              required: [name]
      responses:
        '201':
          description: The created channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
              example:
                id: '700000000000000002'
                type: 0
                guild_id: '800000000000000001'
                name: new-channel
                position: 1
                topic: Created by the mock.
                parent_id: null
  /api/v10/channels/{channel_id}/messages:
    get:
      operationId: listMessages
      summary: List messages in a channel.
      parameters:
        - {
            name: channel_id,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: before, in: query, schema: { type: string } }
        - { name: after, in: query, schema: { type: string } }
        - { name: around, in: query, schema: { type: string } }
      responses:
        '200':
          description: A list of messages.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
              example:
                - id: '600000000000000001'
                  channel_id: '700000000000000001'
                  content: Hello from the mock.
                  timestamp: '2026-01-01T00:00:00.000000+00:00'
                  author:
                    id: '900000000000000099'
                    username: mock-member
                    discriminator: '0042'
                  embeds: []
    post:
      operationId: sendMessage
      summary: Send a message to a channel.
      parameters:
        - {
            name: channel_id,
            in: path,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                embeds: { type: array, items: { type: object } }
              required: [content]
      responses:
        '200':
          description: The created message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example:
                id: '600000000000000002'
                channel_id: '700000000000000001'
                content: Sent by the mock.
                timestamp: '2026-01-01T00:00:01.000000+00:00'
                author:
                  id: '900000000000000001'
                  username: tale-mock-bot
                  discriminator: '0001'
                  bot: true
                embeds: []
  /api/v10/users/{user_id}:
    get:
      operationId: getUser
      summary: Get a single user.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example:
                id: '900000000000000099'
                username: mock-member
                discriminator: '0042'
                global_name: Mock Member
                bot: false
                avatar: null
  /api/v10/guilds/{guild_id}/members:
    get:
      operationId: listMembers
      summary: List the members of a guild.
      parameters:
        - { name: guild_id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: after, in: query, schema: { type: string } }
      responses:
        '200':
          description: A list of guild members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
              example:
                - user:
                    id: '900000000000000099'
                    username: mock-member
                    discriminator: '0042'
                  nick: null
                  roles: []
                  joined_at: '2026-01-01T00:00:00.000000+00:00'
