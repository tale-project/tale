openapi: 3.1.0
info:
  title: Twilio REST API (mock)
  version: '2010-04-01'
  description: >-
    Trimmed spec for the operations the Twilio connector
    (`configs/platform/system/integrations/twilio/connector.yml`) actually calls. Mounted
    by the mock gateway at `/mock/twilio`; paths mirror
    `https://api.twilio.com/2010-04-01`. Account-scoped resources end in `.json`.
servers:
  - url: /mock/twilio
components:
  schemas:
    Account:
      type: object
      properties:
        sid: { type: string }
        friendly_name: { type: string }
        status: { type: string }
        type: { type: string }
        date_created: { type: string }
        date_updated: { type: string }
    Message:
      type: object
      properties:
        sid: { type: string }
        account_sid: { type: string }
        to: { type: string }
        from: { type: string }
        body: { type: string }
        status: { type: string }
        direction: { type: string }
        num_segments: { type: string }
        price: { type: [string, 'null'] }
        price_unit: { type: string }
        date_created: { type: string }
        date_sent: { type: [string, 'null'] }
        uri: { type: string }
    MessageList:
      type: object
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        page: { type: integer }
        page_size: { type: integer }
        next_page_uri: { type: [string, 'null'] }
        previous_page_uri: { type: [string, 'null'] }
        uri: { type: string }
    Call:
      type: object
      properties:
        sid: { type: string }
        account_sid: { type: string }
        to: { type: string }
        from: { type: string }
        status: { type: string }
        direction: { type: string }
        duration: { type: [string, 'null'] }
        price: { type: [string, 'null'] }
        price_unit: { type: string }
        date_created: { type: string }
        uri: { type: string }
    CallList:
      type: object
      properties:
        calls:
          type: array
          items: { $ref: '#/components/schemas/Call' }
        page: { type: integer }
        page_size: { type: integer }
        next_page_uri: { type: [string, 'null'] }
        previous_page_uri: { type: [string, 'null'] }
        uri: { type: string }
    IncomingPhoneNumber:
      type: object
      properties:
        sid: { type: string }
        account_sid: { type: string }
        phone_number: { type: string }
        friendly_name: { type: string }
        capabilities: { type: object }
        date_created: { type: string }
        uri: { type: string }
    IncomingPhoneNumberList:
      type: object
      properties:
        incoming_phone_numbers:
          type: array
          items: { $ref: '#/components/schemas/IncomingPhoneNumber' }
        page: { type: integer }
        page_size: { type: integer }
        next_page_uri: { type: [string, 'null'] }
        previous_page_uri: { type: [string, 'null'] }
        uri: { type: string }
paths:
  /2010-04-01/Accounts/{accountSid}.json:
    get:
      operationId: getAccount
      summary: Fetch an account (also used for test connection).
      parameters:
        - {
            name: accountSid,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
              example:
                sid: ACxxsxxx0000000000000000000000001
                friendly_name: Tale Mock Account
                status: active
                type: Full
                date_created: 'Mon, 01 Jan 2024 00:00:00 +0000'
                date_updated: 'Mon, 01 Jan 2024 00:00:00 +0000'
  /2010-04-01/Accounts/{accountSid}/Messages.json:
    get:
      operationId: listMessages
      summary: List messages for an account.
      parameters:
        - {
            name: accountSid,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { name: To, in: query, schema: { type: string } }
        - { name: From, in: query, schema: { type: string } }
        - { name: DateSent, in: query, schema: { type: string } }
        - { name: PageSize, in: query, schema: { type: integer } }
        - { name: Page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageList' }
              example:
                messages:
                  - sid: SMxxx0000000000000000000000000001
                    account_sid: ACxxsxxx0000000000000000000000001
                    to: '+15558675310'
                    from: '+15017122661'
                    body: Hello from the Tale mock.
                    status: delivered
                    direction: outbound-api
                    num_segments: '1'
                    price: '-0.00750'
                    price_unit: USD
                    date_created: 'Mon, 01 Jan 2024 00:00:00 +0000'
                    date_sent: 'Mon, 01 Jan 2024 00:00:01 +0000'
                    uri: /2010-04-01/Accounts/ACxxsxxx0000000000000000000000001/Messages/SMxxx0000000000000000000000000001.json
                page: 0
                page_size: 50
                next_page_uri: null
                previous_page_uri: null
                uri: /2010-04-01/Accounts/ACxxsxxx0000000000000000000000001/Messages.json
    post:
      operationId: sendSms
      summary: Send an SMS message.
      parameters:
        - {
            name: accountSid,
            in: path,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                To: { type: string }
                From: { type: string }
                Body: { type: string }
              required: [To, From, Body]
      responses:
        '201':
          description: The created message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example:
                sid: SMxxx0000000000000000000000000002
                account_sid: ACxxsxxx0000000000000000000000001
                to: '+15558675310'
                from: '+15017122661'
                body: Sent from the Tale mock.
                status: queued
                direction: outbound-api
                num_segments: '1'
                price: null
                price_unit: USD
                date_created: 'Mon, 01 Jan 2024 00:00:00 +0000'
                date_sent: null
                uri: /2010-04-01/Accounts/ACxxsxxx0000000000000000000000001/Messages/SMxxx0000000000000000000000000002.json
  /2010-04-01/Accounts/{accountSid}/Messages/{messageSid}.json:
    get:
      operationId: getMessage
      summary: Fetch a single message.
      parameters:
        - {
            name: accountSid,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: messageSid,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example:
                sid: SMxxx0000000000000000000000000001
                account_sid: ACxxsxxx0000000000000000000000001
                to: '+15558675310'
                from: '+15017122661'
                body: Hello from the Tale mock.
                status: delivered
                direction: outbound-api
                num_segments: '1'
                price: '-0.00750'
                price_unit: USD
                date_created: 'Mon, 01 Jan 2024 00:00:00 +0000'
                date_sent: 'Mon, 01 Jan 2024 00:00:01 +0000'
                uri: /2010-04-01/Accounts/ACxxsxxx0000000000000000000000001/Messages/SMxxx0000000000000000000000000001.json
  /2010-04-01/Accounts/{accountSid}/Calls.json:
    get:
      operationId: listCalls
      summary: List calls for an account.
      parameters:
        - {
            name: accountSid,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { name: To, in: query, schema: { type: string } }
        - { name: From, in: query, schema: { type: string } }
        - { name: Status, in: query, schema: { type: string } }
        - { name: PageSize, in: query, schema: { type: integer } }
        - { name: Page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: A page of calls.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallList' }
              example:
                calls:
                  - sid: CAxxx0000000000000000000000000001
                    account_sid: ACxxsxxx0000000000000000000000001
                    to: '+15558675310'
                    from: '+15017122661'
                    status: completed
                    direction: outbound-api
                    duration: '42'
                    price: '-0.01500'
                    price_unit: USD
                    date_created: 'Mon, 01 Jan 2024 00:00:00 +0000'
                    uri: /2010-04-01/Accounts/ACxxsxxx0000000000000000000000001/Calls/CAxxx0000000000000000000000000001.json
                page: 0
                page_size: 50
                next_page_uri: null
                previous_page_uri: null
                uri: /2010-04-01/Accounts/ACxxsxxx0000000000000000000000001/Calls.json
    post:
      operationId: makeCall
      summary: Initiate an outbound call.
      parameters:
        - {
            name: accountSid,
            in: path,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                To: { type: string }
                From: { type: string }
                Url: { type: string }
                Method: { type: string }
              required: [To, From, Url]
      responses:
        '201':
          description: The created call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
              example:
                sid: CAxxx0000000000000000000000000002
                account_sid: ACxxsxxx0000000000000000000000001
                to: '+15558675310'
                from: '+15017122661'
                status: queued
                direction: outbound-api
                duration: null
                price: null
                price_unit: USD
                date_created: 'Mon, 01 Jan 2024 00:00:00 +0000'
                uri: /2010-04-01/Accounts/ACxxsxxx0000000000000000000000001/Calls/CAxxx0000000000000000000000000002.json
  /2010-04-01/Accounts/{accountSid}/IncomingPhoneNumbers.json:
    get:
      operationId: listPhoneNumbers
      summary: List incoming phone numbers for an account.
      parameters:
        - {
            name: accountSid,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { name: PageSize, in: query, schema: { type: integer } }
        - { name: Page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: A page of incoming phone numbers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncomingPhoneNumberList' }
              example:
                incoming_phone_numbers:
                  - sid: PNxxx0000000000000000000000000001
                    account_sid: ACxxsxxx0000000000000000000000001
                    phone_number: '+15017122661'
                    friendly_name: Tale Mock Number
                    capabilities: { voice: true, sms: true, mms: true }
                    date_created: 'Mon, 01 Jan 2024 00:00:00 +0000'
                    uri: /2010-04-01/Accounts/ACxxsxxx0000000000000000000000001/IncomingPhoneNumbers/PNxxx0000000000000000000000000001.json
                page: 0
                page_size: 50
                next_page_uri: null
                previous_page_uri: null
                uri: /2010-04-01/Accounts/ACxxsxxx0000000000000000000000001/IncomingPhoneNumbers.json
