openapi: 3.1.0
info:
  title: Tavily API (mock)
  version: '1.0'
  description: >-
    Trimmed spec for the operations the Tavily connector
    (`configs/platform/system/integrations/tavily/connector.yml`) actually calls. Mounted
    by the mock gateway at `/mock/tavily`; paths mirror `https://api.tavily.com`.
servers:
  - url: /mock/tavily
components:
  schemas:
    SearchResult:
      type: object
      properties:
        title: { type: string }
        url: { type: string }
        content: { type: string }
        score: { type: number }
        published_date: { type: string }
    SearchResponse:
      type: object
      properties:
        query: { type: string }
        answer: { type: string }
        response_time: { type: number }
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
    ExtractResult:
      type: object
      properties:
        url: { type: string }
        raw_content: { type: string }
    ExtractResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ExtractResult' }
        failed_results:
          type: array
          items: { type: object }
        response_time: { type: number }
paths:
  /search:
    post:
      operationId: search
      summary: Open-web search optimised for LLM agents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string }
                query: { type: string }
                max_results: { type: integer }
                search_depth: { type: string }
                include_domains: { type: array, items: { type: string } }
                exclude_domains: { type: array, items: { type: string } }
                include_answer: { type: boolean }
                topic: { type: string }
                days: { type: integer }
              required: [query]
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
              example:
                query: latest advances in retrieval-augmented generation
                answer: >-
                  Recent RAG advances focus on hybrid retrieval, smaller
                  re-ranking models, and longer effective context windows.
                response_time: 1.42
                results:
                  - title: A Practical Guide to Retrieval-Augmented Generation
                    url: https://example.com/rag-guide
                    content: >-
                      Retrieval-augmented generation combines a retriever with a
                      generator so the model can ground answers in external
                      documents instead of relying on parametric memory.
                    score: 0.97
                    published_date: '2026-01-12'
                  - title: Hybrid Retrieval Strategies for RAG Pipelines
                    url: https://example.com/hybrid-retrieval
                    content: >-
                      Combining dense vector search with sparse keyword search
                      improves recall on rare terms while keeping semantic
                      coverage high.
                    score: 0.91
                    published_date: '2026-02-03'
  /extract:
    post:
      operationId: extract
      summary: Extract page content from one or more URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string }
                urls:
                  type: array
                  items: { type: string }
                extract_depth: { type: string }
              required: [urls]
      responses:
        '200':
          description: Extracted page content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtractResponse' }
              example:
                response_time: 0.88
                results:
                  - url: https://example.com/rag-guide
                    raw_content: >-
                      Retrieval-augmented generation (RAG) is an architecture
                      that pairs a document retriever with a language model. The
                      retriever fetches relevant passages from a knowledge base
                      and the model conditions its generation on those passages,
                      producing grounded, citable answers.
                  - url: https://example.com/hybrid-retrieval
                    raw_content: >-
                      Hybrid retrieval blends dense embedding similarity with
                      sparse lexical matching. A reciprocal-rank-fusion step
                      merges both result sets before re-ranking.
                failed_results: []
