  errors: []
  warnings:
    - code: INPUT_KEY_UNKNOWN
      nodeId: gen
      message: node "gen" uses input.citi, which is not declared in the inputs schema
      hint: 'did you mean "city"? declared keys: city'
      at:
        pointer: /nodes/0/prompt
        range:
