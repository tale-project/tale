      params:
        node: gen
        field: prompt
    - code: TEMPLATE_UNTERMINATED
      message: 'output.note: "{{" at position 7 has no closing "}}" — it is kept as plain text'
      hint: close the template with }}, or remove the stray {{
      at:
        pointer: /output/note
        range:
          - 7
          - 9
      params:
        field: output
