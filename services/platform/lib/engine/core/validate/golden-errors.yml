      message: 'node "w" (weather.current): input must have required property ''city'''
      hint: 'schema: {"type":"object","properties":{"city":{"type":"string"},"units":{"type":"string","enum":["metric","imperial"]},"days":{"type":"integer"}},"required":["city"],"additionalProperties":false}'
