  # Tasks feature: the board UI has shipped. `status`/`priority` labels are
  # enum-driven dynamic lookups (`t(`status.${status}`)` / `t(`priority.${p}`)`
  # in task-status-badge.tsx / task-priority-icon.tsx / status-picker.tsx /
  # priority-picker.tsx, driven by the taskStatus/taskPriority unions in
  # convex/tasks/schema.ts) — the scanner's template-prefix match covers those
  # automatically, no allowlist entry needed.
  #
  # `activity.*` is different: TASK_ACTIVITY_LABEL_KEY (app/features/tasks/lib/
  # display.ts) maps a stored activity action onto a DOTTED key suffix (e.g.
  # `activity.created`), read at the task-modal.tsx / resource-detail.tsx
  # timeline via `t(\`tasks.${labelKey}\`)`. The scanner's lookup-table
  # heuristics only match single-segment values, not dotted ones, so it can't
  # tie these back to their keys.
  - 'tasks.activity'

  # Settings rail sub-section labels. The API sub-pages (REST / MCP / WebDAV /
  # Runtimes) are driven by the API_NAV_ITEMS catalog in
  # app/routes/dashboard/$id/settings/api/nav-items.ts and rendered via
  # `tNav(item.labelKey)` in settings-rail.tsx and the section's mobile tab
  # strip. Because the catalog is a data-only module (no `useT` call), the
  # scanner can't tie its `labelKey` literals back to the `navigation`
  # namespace.
  - 'navigation.apiRest'
  - 'navigation.mcp'
  - 'navigation.webdav'

  # Enterprise SSO sign-in failures: the authorize/callback Convex handlers set
  # the error message as a string param on the `/log-in?error=…` redirect
  # (`redirectWithError`), which the login page renders via `t(ssoError)` — a
  # runtime value the scanner can't tie back. The Entra AADSTS→message map lives
  # in convex/enterprise_sso/entra_id/error_codes.ts; the generic server-error
  # fallback (`sso.errors.serverError`) and the multi-org "enter your email"
  # bounce (`sso.errors.multipleConnections`) are passed as literals from the
  # handlers but under a namespace the client-source scanner can't resolve.
  - 'auth.sso.errors.multipleConnections'

  # Skill load-error detail titles: skill-load-error.ts maps machine error codes
  # (yaml_syntax, not_found, …) to `skills.loadErrorDetail.title.*` /
  # `skills.notFound` keys in a plain object, resolved later via the `skills`
  # scope — an enum-driven dispatch the regex scanner can't follow.
  - 'skills.loadErrorDetail'
  - 'skills.upload.errors'

  # `common.aria.selectRow` labels the data-table selection checkboxes
  # (`app/components/ui/data-table/column-builders.tsx#createSelectColumn`, used
  # by every selectable table). It is referenced via the
  # `i18n.t('common:aria.…')` colon form the usage scanner's `i18n.t()` matcher
  # can't tie back to a flat key, and the builder runs outside a hook so it
  # can't alias `useT('common')`. (`selectRow` used to escape orphaning through
  # a second `tCommon('aria.selectRow')` site in the removed Puck
  # conversation-list block; the column builder is now its only caller.)
  - 'common.aria.selectRow'

  # Run-admission refusal reasons (#2609): task-timeline.tsx and
  # task-run-failure-banner.tsx resolve `TASK_RUN_REFUSAL_LABEL_KEY[refusedReason]`
  # — an enum-driven lookup keyed by the machine `refusedReason` string stored on
  # the `taskActivity` row's `toValue` (see convex/agents/run_agent_on_task.ts) —
  # a runtime value the regex scanner can't tie back to these keys.
  - 'tasks.agentRuns.refused'

  # Resolved by the docs-screenshots pipeline (tests/docs-screenshots/
  # manifest.ts prepare() steps) — a runnable key consumer outside the
  # scanned source roots.
  - 'common.aria.dismiss'

  # Video-link chip status/error labels — resolved from the job row's
  # `displayStatus` / `errorReasonCode` at runtime
  # (app/features/chat/components/video-link-chip.tsx).
  - 'chat.videoLink.statuses'
  - 'chat.videoLink.errors'
