  - 'settings.logs.audit.actionLabels'
  - 'settings.logs.audit.actorTypeLabels'
  - 'settings.logs.audit.categoryLabels'
  - 'settings.logs.audit.resourceTypeLabels'
  - 'settings.logs.audit.statusLabels'

