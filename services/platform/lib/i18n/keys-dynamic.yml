  # scanner can't tie its `labelKey` literals back to the `navigation`
  # namespace. (`mcp` is also referenced directly in api/mcp.tsx, so only the
  # catalog-only labels need listing here.)
  - 'navigation.apiRest'
  - 'navigation.webdav'
  - 'navigation.runtimes'

