<!doctype html>
<html lang="en" suppresshydrationwarning>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      id="theme-color"
      name="theme-color"
      content="#fcfcfc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      id="theme-color-dark"
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="AI-powered customer service platform. Automate support with intelligent agents, manage conversations, and streamline workflows."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Tale" />
    <!-- Pre-hydration theme (same script as web/docs): sets the `.dark`
         class before first paint so the server-injected boot shell and the
         page background render in the user's theme with no light flash.
         Key mirrors @tale/ui ThemeProvider's STORAGE_KEY. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tale-theme');
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          var resolved =
            stored === 'dark' || (stored !== 'light' && prefersDark)
              ? 'dark'
              : 'light';
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = resolved;
        } catch (error) {
          console.warn('Failed to apply the pre-hydration theme', error);
        }
      })();
    </script>
    <!-- Pre-hydration Safari toolbar marker: on Mobile Safari outside an
         installed app the mobile tab bar adds bottom clearance (`pb-12`) for
         the browser toolbar. `boot-safari-toolbar` on <html> lets the boot
         shell's tab-bar placeholder reserve the same clearance before first
         paint. Mirrors detectIsMobileSafari / detectIsStandalone in
         app/hooks/use-display-mode.ts (pinned by
         boot-safari-toolbar-script.test.ts). -->
    <script>
      (function () {
        try {
          var nav = window.navigator;
          var ua = nav.userAgent;
          var isIOS =
            /iP(ad|hone|od)/.test(ua) ||
            (nav.platform === 'MacIntel' && nav.maxTouchPoints > 1);
          var isSafariShell =
            /Safari/.test(ua) && !/(CriOS|FxiOS|EdgiOS)/.test(ua);
          var standalone =
            (typeof window.matchMedia === 'function' &&
              window.matchMedia('(display-mode: standalone)').matches) ||
            nav.standalone === true;
          if (isIOS && isSafariShell && !standalone) {
            document.documentElement.classList.add('boot-safari-toolbar');
          }
        } catch (error) {
          console.warn('Failed to apply the boot Safari toolbar marker', error);
        }
      })();
    </script>
    <!-- Pre-hydration boot-shell state: reveal the Home layout pieces baked
         into the served boot shell before any JS or CSS runs.
         `boot-home-panel-open` gates the Home panel skeleton
         (HomePanelPlaceholder) on every Home route — chat, a task, a
         project, the inbox, or an org root (which redirects to chat) — and
         stays off only on a conversation-shaped page (a chat, a task, an
         open inbox conversation) whose panel the persisted
         `chat-history-panel-open-<orgId>` state has folded (org-scoped
         precisely so this script can read it pre-auth; the live HomePanel
         keeps the class in step). `boot-chat` gates the composer stand-in
         (ChatComposerPlaceholder) on a chat route or org root; shared-chat
         snapshots are neither. `boot-chat-notice` reserves the
         confidentiality notice's row under the composer stand-in when this
         device last saw the org show one: `chat-data-notice-<orgId>`
         (written by DataNoticeFooter, see data-notice-boot.ts) holds its text
         as a ready-escaped CSS string, copied to `--boot-chat-notice` so the
         row wraps like the live notice. -->
    <script>
      (function () {
        try {
          var match = window.location.pathname.match(
            /\/dashboard\/([^/]+)(?:\/([^/]+))?(?:\/([^/]+))?/,
          );
          // `switching` and `create-organization` are the literal (non-org)
          // segments under /dashboard/ — they render no Home layout.
          if (
            !match ||
            match[1] === 'switching' ||
            match[1] === 'create-organization'
          ) {
            return;
          }
          var org = match[1];
          var section = match[2];
          var home = ['home', 'chat', 'projects', 'tasks', 'conversations'];
          if (section !== undefined && home.indexOf(section) === -1) return;
          if (section === 'chat' && match[3] === 'shared') return;
          var root = document.documentElement;
          var chat = section === undefined || section === 'chat';
          var collapsible =
            chat ||
            section === 'tasks' ||
            (section === 'conversations' &&
              /[?&]conversation=/.test(window.location.search));
          var stored = localStorage.getItem('chat-history-panel-open-' + org);
          if (!collapsible || stored !== 'false') {
            root.classList.add('boot-home-panel-open');
          }
          if (!chat) return;
          root.classList.add('boot-chat');
          var notice = localStorage.getItem('chat-data-notice-' + org);
          if (notice) {
            root.classList.add('boot-chat-notice');
            root.style.setProperty('--boot-chat-notice', notice);
          }
        } catch (error) {
          console.warn('Failed to apply the boot Home-layout state', error);
        }
      })();
    </script>
    <title>Tale</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      id="favicon-light"
      rel="icon"
      type="image/png"
      href="/favicon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      id="favicon-dark"
      rel="icon"
      type="image/png"
      href="/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/apple-touch-icon-180x180.png"
    />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
    <link
      rel="alternate"
      type="text/plain"
      href="/llms-full.txt"
      title="llms-full.txt"
    />
    <!--
      Inter webfont is bundled via @fontsource/inter (see app/globals.css).
      Do NOT add third-party font/style CDNs here: self-deployed operators
      may run air-gapped, and any external origin is a GDPR data transfer.
    -->
  </head>
  <body class="font-sans antialiased">
    <noscript>
      <p>
        Tale is an application and needs JavaScript. Without it: this instance's
        REST and MCP reference is the OpenAPI document at
        <a href="/openapi.json">/openapi.json</a>, and the written developer
        guides are at <a href="https://docs.tale.dev/">docs.tale.dev</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script id="__ENV__">
      window.__ENV__ = '__ENV_PLACEHOLDER__';
      window.__ACCEPT_LANGUAGE__ = '__ACCEPT_LANGUAGE_PLACEHOLDER__';
    </script>
    <script type="module" src="/app/main.tsx"></script>
    <script>
      if (
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1'
      ) {
        var s = document.createElement('script');
        s.src = 'https://mcp.figma.com/mcp/html-to-design/capture.js';
        s.async = true;
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
