<!doctype html>
<html lang="en" suppresshydrationwarning>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      id="theme-color"
      name="theme-color"
      content="#fcfcfc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      id="theme-color-dark"
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="AI-powered customer service platform. Automate support with intelligent agents, manage conversations, and streamline workflows."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Tale" />
    <!-- Pre-hydration theme (same script as web/docs): sets the `.dark`
         class before first paint so the server-injected boot shell and the
         page background render in the user's theme with no light flash.
         Key mirrors @tale/ui ThemeProvider's STORAGE_KEY. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tale-theme');
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          var resolved =
            stored === 'dark' || (stored !== 'light' && prefersDark)
              ? 'dark'
              : 'light';
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = resolved;
        } catch (error) {
          console.warn('Failed to apply the pre-hydration theme', error);
        }
      })();
    </script>
    <!-- Pre-hydration boot-shell state: when the navigation targets a chat
         route (shared-view routes excluded — they render no panel) or an
         org root (which always redirects to chat), reveal the chat layout
         pieces baked into the served boot shell before any JS or CSS runs.
         `boot-chat` gates the composer stand-in (ChatComposerPlaceholder);
         `boot-chat-panel-open` additionally gates the sub-panel skeleton
         (ChatSubPanelPlaceholder) on the persisted panel state. Key mirrors
         ChatLayoutProvider's `chat-history-panel-open-<orgId>` (org-scoped
         precisely so this script can read it pre-auth). -->
    <script>
      (function () {
        try {
          var match = window.location.pathname.match(
            /\/dashboard\/([^/]+)(?:\/chat(?:\/(?!shared\/)|$)|\/?$)/,
          );
          // `switching` is the only literal (non-org) segment under
          // /dashboard/ — the org-switch interstitial renders no panel.
          if (!match || match[1] === 'switching') return;
          document.documentElement.classList.add('boot-chat');
          var stored = localStorage.getItem(
            'chat-history-panel-open-' + match[1],
          );
          if (stored !== 'false') {
            document.documentElement.classList.add('boot-chat-panel-open');
          }
        } catch (error) {
          console.warn('Failed to apply the boot chat-panel state', error);
        }
      })();
    </script>
    <title>Tale</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      id="favicon-light"
      rel="icon"
      type="image/png"
      href="/favicon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      id="favicon-dark"
      rel="icon"
      type="image/png"
      href="/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/apple-touch-icon-180x180.png"
    />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
    <link
      rel="alternate"
      type="text/plain"
      href="/llms-full.txt"
      title="llms-full.txt"
    />
    <!--
      Inter webfont is bundled via @fontsource/inter (see app/globals.css).
      Do NOT add third-party font/style CDNs here: self-deployed operators
      may run air-gapped, and any external origin is a GDPR data transfer.
    -->
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script id="__ENV__">
      window.__ENV__ = '__ENV_PLACEHOLDER__';
      window.__ACCEPT_LANGUAGE__ = '__ACCEPT_LANGUAGE_PLACEHOLDER__';
    </script>
    <script type="module" src="/app/main.tsx"></script>
    <script>
      if (
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1'
      ) {
        var s = document.createElement('script');
        s.src = 'https://mcp.figma.com/mcp/html-to-design/capture.js';
        s.async = true;
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
