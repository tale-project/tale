<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>You are offline</title>
    <style>
      /* Inline copy of the platform's `:root` / `.dark` tokens (see
         packages/ui/src/globals.css) so this static shell matches the app
         shell without a JS runtime. Brand accent is the dark-zinc /
         off-white pair from `--color-accent-base` / `--color-accent-fg`. */
      :root {
        --bg-base: #fcfcfc;
        --bg-muted: #f4f4f5;
        --fg-base: #09090b;
        --fg-muted: #71717a;
        --border: #e4e4e7;
        --accent-base: #030712;
        --accent-fg: #ffffff;
        --destructive: hsl(0 84.2% 60.2%);
        --success: hsl(155 92% 24%);
        --ring-inset: rgba(255, 255, 255, 0.2);
        --button-gradient-top: rgba(255, 255, 255, 0.16);
        --button-gradient-bot: rgba(255, 255, 255, 0);
        --button-shadow:
          0 1px 1.75px rgba(3, 7, 18, 0.4), 0 0 0 1px rgba(3, 7, 18, 1);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-base: #09090b;
          --bg-muted: rgba(255, 255, 255, 0.06);
          --fg-base: #fafafa;
          --fg-muted: hsl(218 11% 65%);
          --border: #27272a;
          --accent-base: #ffffff;
          --accent-fg: #030712;
          --destructive: hsl(0 91% 71%);
          --success: hsl(155 85% 35%);
          --ring-inset: rgba(255, 255, 255, 0.15);
          --button-gradient-top: rgba(0, 0, 0, 0.06);
          --button-gradient-bot: rgba(0, 0, 0, 0);
          --button-shadow:
            0 1px 1.75px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.6);
          color-scheme: dark;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-base);
        color: var(--fg-base);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: max(env(safe-area-inset-top, 0px) + 1.5rem, 2rem) 1.5rem
          max(env(safe-area-inset-bottom, 0px) + 1.5rem, 2rem);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .container {
        text-align: center;
        max-width: 24rem;
        width: 100%;
      }

      .icon-wrapper {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 9999px;
        background: var(--bg-muted);
        color: var(--fg-muted);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-wrapper svg {
        width: 2rem;
        height: 2rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.2;
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--fg-muted);
        margin-bottom: 1.5rem;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.375rem 0.875rem;
        border-radius: 9999px;
        background: var(--bg-muted);
        color: var(--fg-muted);
        font-size: 0.875rem;
        line-height: 1.25;
        font-weight: 500;
        margin-bottom: 1.5rem;
      }

      .status-indicator {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: var(--destructive);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .status.online .status-indicator {
        background: var(--success);
        animation: none;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* Mirrors the `primary` variant of @tale/ui/button — same dark-zinc
         surface, subtle highlight gradient, ring-inset, and dark shadow. */
      .retry-button {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        min-height: 2.75rem;
        padding: 0.75rem 1rem;
        font-family: inherit;
        font-size: 0.875rem;
        line-height: 1;
        font-weight: 500;
        color: var(--accent-fg);
        background:
          linear-gradient(
            to bottom,
            var(--button-gradient-top),
            var(--button-gradient-bot)
          ),
          var(--accent-base);
        background-color: var(--accent-base);
        border: none;
        border-radius: 0.5rem;
        box-shadow:
          inset 0 0 0 1px var(--ring-inset),
          var(--button-shadow);
        cursor: pointer;
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
      }

      .retry-button:hover {
        opacity: 0.95;
      }

      .retry-button:active {
        transform: scale(0.97);
      }

      .retry-button:focus-visible {
        outline: none;
        box-shadow:
          inset 0 0 0 1px var(--ring-inset),
          var(--button-shadow),
          0 0 0 2px var(--accent-base);
      }

      .retry-button:disabled {
        opacity: 0.65;
        cursor: progress;
      }

      .retry-button:disabled:active {
        transform: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .status-indicator {
          animation: none;
        }
        .retry-button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="icon-wrapper" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="2" x2="22" y1="2" y2="22" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
          <path d="M5 13a10 10 0 0 1 5.24-2.76" />
          <line x1="12" x2="12.01" y1="20" y2="20" />
        </svg>
      </div>

      <h1>You're offline</h1>
      <p>
        Tale needs an internet connection. We'll reconnect as soon as you're
        back online.
      </p>

      <div class="status" id="status" role="status" aria-live="polite">
        <span class="status-indicator" aria-hidden="true"></span>
        <span id="status-text">Offline</span>
      </div>

      <div>
        <button class="retry-button" id="retry-button" type="button">
          Try again
        </button>
      </div>
    </main>

    <script>
      // `navigator.onLine` only reports the OS network adapter state, not
      // whether the app server is actually reachable. So we drive the UI
      // from a real fetch probe instead — a cache-busted, non-navigation
      // request bypasses the service worker's navigation fallback and
      // truly tests whether the server responds. We only reload once a
      // probe succeeds; otherwise repeated reloads against a dead server
      // surface a raw browser error instead of this shell.
      (function () {
        const statusEl = document.getElementById('status');
        const statusTextEl = document.getElementById('status-text');
        const retryButton = document.getElementById('retry-button');

        const LABELS = {
          offline: 'Offline',
          checking: 'Checking connection…',
          online: 'Back online',
        };

        let probing = false;

        function setState(state) {
          statusTextEl.textContent = LABELS[state];
          statusEl.classList.toggle('online', state === 'online');
        }

        async function probeServer() {
          try {
            const res = await fetch('/?pwa-probe=' + Date.now(), {
              method: 'GET',
              cache: 'no-store',
              credentials: 'same-origin',
              redirect: 'manual',
              headers: { 'X-PWA-Probe': '1' },
            });
            // Any reply (including redirects/4xx) means the server is up.
            // Only network failures throw, which is what we want to catch.
            return res.type === 'opaqueredirect' || res.status > 0;
          } catch (_err) {
            return false;
          }
        }

        async function tryReconnect() {
          if (probing) return;
          probing = true;
          retryButton.disabled = true;
          setState('checking');
          const ok = await probeServer();
          if (ok) {
            setState('online');
            // Short delay so the user sees the success state before reload.
            window.setTimeout(() => window.location.reload(), 400);
            return;
          }
          setState('offline');
          retryButton.disabled = false;
          probing = false;
        }

        retryButton.addEventListener('click', tryReconnect);

        // The `online` event fires when the OS regains connectivity. That
        // doesn't guarantee the server is up, so we still probe before
        // reloading.
        window.addEventListener('online', tryReconnect);
        window.addEventListener('offline', () => {
          if (!probing) setState('offline');
        });

        setState('offline');
      })();
    </script>
  </body>
</html>
