  notStarted: Der Agenten-Lauf konnte nicht starten.
  agentMissing: Der zugewiesene Agent existiert nicht mehr. Weise einen anderen Agenten zu, damit die Aufgabe läuft.
  noAgentAssignee: Dieser Aufgabe ist kein Agent zugewiesen. Weise einen zu, um einen Lauf zu starten.
  cancelled: Der Agenten-Lauf wurde abgebrochen.
  cancelFailed: Der Agenten-Lauf konnte nicht abgebrochen werden.
  start: Agent starten
  willStart: Hier ablegen startet den Agenten-Lauf.
  willCancel: Hier ablegen bricht den laufenden Agenten-Lauf ab.
  # Ein kurzes Wort pro Zustand — die Zeile steht im schmalen
  # Eigenschaften-Panel neben „Lauf“ und dem Status-Chip der Aufgabe.
  status:
    queued: Wartet
    running: Arbeitet…
    settled: Fertig
    failed: Fehlgeschlagen
    cancelled: Abgebrochen
  # Ersetzt „Wartet", solange der Lauf auf Platz wartet: ein kurzer Zustand
  # pro Grund; `unknown` ist ein Warten ohne gespeicherten Grund (meist auf
  # einen Worker). Der Lauf startet von selbst, sobald der Platz frei wird.
  waiting:
    org_limit: Wartet auf einen Worker
    host: Wartet auf freien Platz
    destroy_pending: Wartet auf einen Arbeitsbereich
    exec_limit: Wartet auf seine Sandbox
    unknown: Wartet auf einen Worker
  # Was der kurze Zustand bedeutet, darunter, solange der Lauf wartet.
  waitingWhy:
    org_limit: Alle Agenten-Worker deiner Organisation sind belegt. Der Lauf startet von selbst, sobald einer frei ist.
    host: Der Sandbox-Host ist voll oder hat zu wenig Arbeitsspeicher oder Speicherplatz. Der Lauf startet von selbst, sobald wieder Platz ist.
    destroy_pending: Ein Admin löscht gerade den Arbeitsbereich, den dieser Lauf nutzen würde. Danach startet der Lauf in einem neuen.
    exec_limit: Seine Sandbox beendet noch einen früheren Prozess. Der Lauf startet gleich von selbst.
    unknown: Der Lauf startet von selbst, sobald Platz für ihn frei ist.
  # Für Owner und Admins neben „Alle … Agenten-Worker sind belegt".
  manageWorkers: Agenten-Worker verwalten
  # Zeile unter dem Status, während die Plattform einen fehlgeschlagenen
  # Lauf von selbst neu startet — damit klar ist, dass nicht du es warst.
  autoRetrying: 'Automatischer Versuch {n} von {max}'
  # Ersetzt diese Zeile, wenn der Broker das Token des Kontos mitten im
  # Lauf erneuert hat und die Plattform ihn fortsetzt — ohne verbrauchten
  # Versuch.
  resumedAfterTokenRefresh: Nach einer Token-Erneuerung fortgesetzt
  retry: Erneut ausführen
  cancel: Lauf abbrechen
  notStartedYet: Der Agent wartet, bis du ihn startest.
  failureTitle: Der Agent konnte diese Aufgabe nicht fertigstellen
  reported: Was der Lauf gemeldet hat
  logReadFailed: Das Agentenprotokoll konnte nicht geladen werden. Versuch es erneut.
  runReadFailed: Der Agentenlauf konnte nicht geladen werden. Versuch es erneut.
  failure:
    budget: Ein Nutzungslimit hat diesen Lauf gestoppt. Bitte einen Admin, es anzuheben, und starte den Agenten dann erneut.
    setup: 'Dem Agenten fehlt etwas, das er braucht — sein Modell, einer seiner Skills oder der Agent selbst. Ein Redakteur oder Admin kann das im Tab "Agenten" des Projekts beheben.'
    input: 'Ein Anhang dieser Aufgabe ist nicht mehr im Speicher — unter "Details" steht, welcher. Entferne ihn aus der Aufgabe oder lade ihn erneut hoch, und starte den Agenten dann erneut.'
    time_limit: Der Lauf hat sein Zeitlimit erreicht, bevor der Agent fertig war. Starte den Agenten erneut oder teile die Aufgabe in kleinere auf.
    capacity: Der Lauf hat zu lange auf einen freien Worker gewartet. Starte den Agenten erneut, wenn weniger Agenten beschäftigt sind.
    model: Das KI-Modell hinter diesem Agenten ist ausgefallen, bevor die Arbeit erledigt war. Starte den Agenten erneut — schlägt er wieder fehl, bitte einen Admin, den KI-Anbieter zu prüfen.
    start: 'Der Lauf konnte nicht starten. Versuche es erneut — schlägt er wieder fehl, zeig einem Admin, was der Lauf unter "Details" gemeldet hat.'
    interrupted: Der Lauf wurde unterbrochen, bevor der Agent fertig war. Starte den Agenten erneut.
    out_of_memory: Der Sandbox des Agenten ist der Arbeitsspeicher ausgegangen, deshalb wurde seine Arbeit gestoppt. Starte den Agenten erneut — passiert das wieder, bitte einen Admin, Agenten mehr Arbeitsspeicher zu geben.
    stalled: 'Der Agent hat nicht mehr reagiert: Er hat lange nichts ausgegeben und kaum gearbeitet, deshalb hat seine Sandbox ihn gestoppt. Starte den Agenten erneut — bleibt er wieder stehen, zeig einem Admin, was der Lauf unter "Details" gemeldet hat.'
    unknown: 'Der Lauf ist fehlgeschlagen. Starte den Agenten erneut — schlägt er wieder fehl, zeig einem Admin, was der Lauf unter "Details" gemeldet hat.'
  standardAgent:
    switchedOff: Der Standard-Agent der Organisation ist ausgeschaltet. Bitte einen Admin, ihn unter Richtlinien einzuschalten.
    noModel: Kein Modell, das du nutzen darfst, kann den Standard-Agenten ausführen. Bitte einen Admin, einen KI-Anbieter einzurichten oder dir Zugriff auf ein Modell zu geben.
    pinUnavailable: Das für den Standard-Agenten gewählte Modell steht dir nicht zur Verfügung. Bitte einen Admin, unter Richtlinien ein anderes zu wählen.
    harnessInvalid: Die für den Standard-Agenten gewählte Agent-Laufzeit ist nicht verfügbar. Bitte einen Admin, unter Richtlinien eine andere zu wählen.
    unreadable: Die Einstellungen des Standard-Agenten können nicht gelesen werden. Bitte einen Admin, sie unter Richtlinien zu prüfen.
