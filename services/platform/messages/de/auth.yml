sso:
  errors:
    serverError: Single Sign-On ist wegen eines Serverfehlers fehlgeschlagen. Versuch es erneut — oder wende dich an deine Administration, wenn's immer wieder passiert.
    multipleConnections:
      Hier nutzen mehrere Organisationen Single Sign-On. Gib
      zuerst die E-Mail-Adresse deiner Organisation ein und versuche es dann
      erneut.
    mfaRequired: Für die Anmeldung ist eine Multi-Faktor-Authentifizierung erforderlich.
    conditionalAccessBlocked: Die Anmeldung wurde durch eine Richtlinie für
      bedingten Zugriff blockiert.
    userNotAssigned:
      Dein Konto ist dieser Anwendung nicht zugewiesen. Wende dich an
      deine Administration, um Zugriff anzufordern.
    notOrgMember: Dein Konto ist kein Mitglied dieser Organisation. Bitte die
      Administration dieser Organisation, dich einzuladen, und melde dich
      danach erneut an.
    flowMismatch:
      Diese Anmeldung ist nicht in dem Browser gelandet, in dem sie begonnen
      hat. Starte sie von dieser Seite aus neu.
    assertionNotEncrypted:
      Diese Organisation verlangt verschlüsselte SAML-Assertions, der
      Identitätsanbieter hat aber eine unverschlüsselte geschickt. Bitte
      deine Administration, die Verschlüsselung der Assertions im
      Identitätsanbieter einzuschalten.
    silentAuthFailed: Stille Anmeldung fehlgeschlagen. Melde dich stattdessen manuell an.
    refreshTokenExpired: Deine Sitzung ist abgelaufen. Melde dich erneut an.
    consentRequired: Ein Administrator muss die Zustimmung erteilen, bevor du dich anmelden kannst.
    redirectMismatch:
      Die Weiterleitungs-URL für die Anmeldung stimmt nicht mit der
      in Microsoft Entra ID hinterlegten überein. Bitte deine Administration,
      die exakte Weiterleitungs-URL zu hinterlegen.
    clientNotFound: Die Single-Sign-On-Anwendung wurde im Verzeichnis nicht
      gefunden. Bitte deine Administration, die Client-ID zu prüfen.
    invalidClientSecret: Der Single-Sign-On-Client-Schlüssel ist ungültig oder
      abgelaufen. Bitte deine Administration, ihn zu aktualisieren.
    recovery:
      completeMfa:
        Bestätige die Multi-Faktor-Abfrage in deiner Authenticator-App, um
        fortzufahren.
      contactAdmin: Wende dich für Zugriff an deine Administration.
      signInInteractively: Versuche die Anmeldung erneut und schließe alle Abfragen ab.
      signInAgain: Melde dich erneut an, um fortzufahren.
      grantConsent: Eine Administration muss dieser Anwendung zustimmen.
  actions:
    tryAgain: Erneut versuchen
    completeMfa: Multi-Faktor-Anmeldung abschließen
    contactAdminMessage: Wende dich an deine Administration, um das zu beheben.
  protocol:
    entra: Microsoft Entra ID
    oidc: Generisches OIDC
    oauth2: OAuth2
    saml: SAML 2.0
