issueImport:
  description: Importiere Issues als Tale-Aufgaben. Bei einem erneuten Import werden die verknüpften Aufgaben wiederverwendet; ihr Status und ihre Beschreibung bleiben erhalten. Richte zuerst die Zugangsdaten der Quelle unter Einstellungen > Connectors ein.
  chooseProject: Tale-Projekt wählen
  noProjects: Keine Projekte gefunden. Erstelle vor dem Import ein Projekt.
  limitHint: 'Lies 1 bis 500 Issues der Quelle pro Durchlauf. Wenn weitere Issues passen, setze den Import im Ergebnis fort.'
  fields:
    projectId: Tale-Projekt
    owner: GitHub-Inhaber oder Organisation
    repo: GitHub-Repository
    labels: GitHub-Labels (kommagetrennt)
    organization: GlitchTip-Organisationskennung
    project: GlitchTip-Projektkennung
    query: GlitchTip-Suche
    limit: Maximale Anzahl an Issues
  resultTitle: Importierte Aufgaben
  summary: 'Verarbeitete Issues: {imported}. Neue Aufgaben: {created}. Vorhandene Aufgaben: {updated}.'
  mockResult: Dies ist ein Testergebnis. Es wurden keine Issues abgerufen und keine Aufgaben geschrieben.
  openTask: 'Aufgabe {id} öffnen'
  truncated: 'Weitere Issues passen zu den Filtern. Setze den Import mit dem nächsten Stapel fort. Bereits verknüpfte Issues verwenden ihre Tale-Aufgaben weiter.'
  continuing: 'Setze den Import mit dem nächsten Stapel fort. Wenn du die Quellfilter oder das Tale-Projekt änderst, beginnt ein neuer Suchlauf.'
  continue: 'Import fortsetzen'
  skipped: 'Übersprungene Issues: {count}. Geschlossene oder gelöste Issues ohne verknüpfte Tale-Aufgabe werden nicht importiert.'
  refreshHasMore: 'Weitere verknüpfte Aufgaben brauchen eine Aktualisierung der Quelle. Starte den Import erneut für die nächste Gruppe; Tale prüft die ältesten Abfragen zuerst.'
