    description: 'Pro-Org CRM-Datensätze: Name, E-Mail, Adresse, Locale, Metadaten.'
  externalConversations:
    title: Externe Konversationen
    description: Top-Level-Kontaktkanal-Posteingang (E-Mail/Chat-Connectors).
      Kaskadiert zu Nachrichteninhalten.
  chatFilterEvents:
    title: Chat-Filter-Ereignisse
    description:
      Telemetrie für Content-Filter-Auslöser (PII, Profanität, eigene
      Regeln). Jedes Ereignis enthält Filter, Kategorien, Richtung und
      Anzahl, nie den gefundenen Text. Die Guardrails-Seite und der
      Chat-Zustand zeigen nur die noch aufbewahrten Ereignisse.
    placeholder: z. B. 90
    helper: Filter-Ereignis-Telemetrie älter als dies wird gelöscht.
  notifications:
    title: Benachrichtigungen
    description: In-App-Benachrichtigungen (Erwähnungen, Agentenergebnisse,
      Systemwarnungen). Können Inhalte aus Chats, Dokumenten oder
      Automatisierungsläufen referenzieren.
    placeholder: z. B. 30
    helper: Benachrichtigungen, die älter als dies sind, werden gelöscht.
  chatHistory:
    title: Chat-Verlauf
    description: Konversationen mit Agents (Chat-Threads), die älter als die
      Aufbewahrungsfrist sind, automatisch löschen. Nachrichteninhalte in der
      Agent-Komponente werden archiviert. Die Löschung ist unumkehrbar.
    placeholder: z. B. 90
    helper:
      Chat-Threads, die (gemessen am letzten Aktualisierungszeitpunkt) älter
      sind, werden gelöscht.
  documents:
    title: Aufbewahrung von Dokumenten
    description:
      Dokumente, die die Aufbewahrungsfrist überschreiten, automatisch
      löschen. Mit Vorsicht verwenden — gelöschte Dokumente können nicht
      wiederhergestellt werden.
    placeholder: z. B. 90
    helper: Dokumente, die älter sind, werden gelöscht.
  userTemp:
    title: Bereinigung temporärer Nutzerdateien
    description:
      Dateien, die von Nutzern hochgeladen, aber nie in einem Dokument
      gespeichert wurden (z. B. Chat-Anhänge, abgebrochene Uploads),
      automatisch löschen.
    placeholder: z. B. 24
    helper: Temporäre Dateien, die älter sind, werden gelöscht.
  agentTemp:
    title: Bereinigung temporärer Agent-Dateien
    description: Dateien, die von Agents erzeugt, aber nie in einem Dokument
      gespeichert wurden (z. B. Zwischenresultate, Wissensdateien),
      automatisch löschen.
    placeholder: z. B. 24
    helper: Temporäre Dateien, die älter sind, werden gelöscht.
  workflowLogs:
    title: Protokolle von Automatisierungsläufen
    description:
      Einträge zu Automatisierungsläufen, die älter als die Aufbewahrungsfrist
      sind, automatisch löschen. Schließt pro Ausführung gespeicherte
      Variablen-/Output-Blobs ein.
    placeholder: z. B. 30
    helper: Automatisierungsläufe, die älter sind, werden gelöscht.
  auditLogs:
    title: Audit-Logs
    description: Audit-Log-Einträge, die älter als die Aufbewahrungsfrist sind, automatisch löschen. Audit-Logs sind unveränderliche Aufzeichnungen — halte die Frist lang genug, um deine Compliance-Anforderungen zu erfüllen.
    placeholder: z. B. 90
    helper: Audit-Log-Einträge, die älter sind, werden gelöscht.
  usageLedger:
    title: Nutzungsbuch
    description: Token-Verbrauchsdaten, die älter als die Aufbewahrungsfrist sind, automatisch löschen. Eine kürzere Frist schneidet historische Auswertungen ab — Budgets und Berichte stützen sich auf diese Daten.
    placeholder: z. B. 365
    helper: Nutzungsbuch-Zeilen, die älter sind, werden gelöscht.
  loginAttempts:
    title: Anmeldeversuche
    description: Aufzeichnungen fehlgeschlagener Anmeldeversuche, die älter als die Aufbewahrungsfrist sind, automatisch löschen. Diese Einstellung gilt deployment-weit — der kürzeste Wert aller Organisationen greift.
    placeholder: z. B. 90
    helper: Einträge zu Anmeldeversuchen, die älter sind, werden gelöscht.
