dsarPolicy:
  title: Governance für Anfragen betroffener Personen
  description: Karenzzeit, Doppelfreigabe und tägliches Limit pro Admin für
    DSGVO-Art.-17-Löschungsanfragen.
  coolingOffHours:
    label: Karenzzeit (Stunden)
    description:
      'Stunden zwischen Einreichung und tatsächlicher Ausführung der
      Kaskade. Jeder Admin kann innerhalb dieses Fensters abbrechen. 0 =
      sofortige Ausführung. Bereich: 0–72.'
  requireDualApproval:
    label: Doppelfreigabe erforderlich
    description:
      Wenn aktiviert, muss jede eingereichte Anfrage von einem zweiten
      Admin freigegeben werden (die einreichende Person kann nicht selbst
      freigeben), bevor die Karenzzeit beginnt. Empfohlen für sensible
      Deployments mit zwei oder mehr Admins.
  dailyLimitPerAdmin:
    label: Tägliches Limit pro Admin
    description:
      'Maximale Anzahl an Löschungsanfragen, die ein einzelner Admin pro
      Tag einreichen darf. Begrenzt den Schaden bei kompromittierten
      Admin-Zugängen. Bereich: 1–50.'
  saved: Governance für Anfragen betroffener Personen aktualisiert.
  saveFailed: Governance-Richtlinie konnte nicht gespeichert werden. Versuch es nochmal.
  invalidCoolingOffHours: Die Karenzzeit muss eine ganze Zahl zwischen 0 und 72 sein.
  invalidDailyLimit: Das tägliche Limit muss eine ganze Zahl zwischen 1 und 50 sein.
  ownerOnlyNotice:
    Nur der Owner kann diese Richtlinie ändern. Admins können sie
    lesen. Jede Lockerung der Schutzmaßnahmen (kürzere Karenzzeit,
    Deaktivieren der Doppelfreigabe, Anheben des täglichen Limits) wird 24
    Stunden lang gestaffelt, damit jeder Admin sie zurücksetzen kann.
  loosenProposedTitle: Änderung vorgemerkt — 24-Stunden-Prüffenster gestartet
  loosenProposedDescription: Lockernde Änderungen werden erst nach einem
    24-Stunden-Karenzfenster wirksam. Jeder Admin kann sie vorher abbrechen.
  loosenCancelledTitle: Vorgemerkte Änderung abgebrochen.
  pendingFieldLocked: Während des Prüffensters gesperrt
