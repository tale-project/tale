  noAvailable:
    Kein Modell zur Audiotranskription ist verfügbar. Füge unter KI-Anbieter
    einen kompatiblen Zugang hinzu oder aktiviere ihn. Prüfe auch, welche
    Modelle dieser Zugang erlaubt.
  unavailable:
    Das gespeicherte Modell ist nicht verfügbar. Wähle ein anderes Modell
    oder Automatisch oder prüfe den Anbieterzugang und die dafür erlaubten Modelle.
    Solange diese Auswahl gespeichert ist, wechselt Tale nicht zu einem
    anderen Modell.
  invalidPolicy:
    Die gespeicherte Konfiguration des Audiomodells ist ungültig. Wähle ein
