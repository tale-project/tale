visionModel:
  title: Modell für Bilder
  description:
    Kann das Modell eines Agenten selbst keine Bilder sehen, liest dieses
    Modell die Bilder für ihn — über das Gateway, es gelangt also kein
    Provider-Schlüssel in die Sandbox. Modelle, die Bilder ohnehin lesen,
    brauchen es nie.
  label: Modell, das Bilder liest
  labelHint:
    Automatisch passt für die meisten Organisationen. Lege eins fest, wenn
    die Wahl dem Provider-Katalog nicht mehr folgen soll.
  automaticLabel: Automatisch
  automaticHint: Tale wählt aus den Modellen, die deine Zugänge erreichen.
  resolved:
    pinned: 'Bilder liest derzeit {model}.'
    preferred: 'Bilder liest derzeit {model} — die empfohlene Wahl.'
    cheapest:
      'Bilder liest derzeit {model} — das günstigste erreichbare Modell, weil
      keines der empfohlenen verfügbar ist.'
  resolvedNone:
    Keines deiner erreichbaren Modelle kann Bilder lesen, damit können es
    Agenten auf einem reinen Textmodell auch nicht. Hinterlege einen Zugang
    zu einem Provider, der ein Modell für Bilder bedient.
  searchModels: Modelle suchen
  noModelsFound: Kein Modell verfügbar, das Bilder liest
  saveFailed: Modell für Bilder konnte nicht gespeichert werden
imageGeneration:
  title: Bildgenerierung
  description:
    Projekt-Agenten können bei ihren Aufgaben Bilder erstellen, ebenso
    Agent-Knoten in Automatisierungen. Die Kosten trägt deine Organisation.
    Die Funktion bleibt aus, bis du sie einschaltest. Im Chat entstehen nie
    Bilder.
  enabledLabel: Agenten Bilder erstellen lassen
  label: Bildmodell
  labelHint:
    Automatisch nimmt das erste empfohlene Bildmodell, das deine
    Anbieterzugänge erreichen. Ein festgelegtes Modell bleibt ausgewählt,
    bis du es änderst, auch wenn es nicht mehr verfügbar ist.
  automaticLabel: Automatisch
  automaticHint: Tale wählt aus den empfohlenen Bildmodellen, die deine Zugänge erreichen.
  currentModel:
    pinned: 'Agenten erstellen Bilder derzeit mit {model}.'
    preferred: 'Agenten erstellen Bilder derzeit mit {model} — die empfohlene Wahl.'
  draftHint: Speichere, um diese Auswahl anzuwenden.
  noAvailable:
    Keines der empfohlenen Bildmodelle ist verfügbar, daher erhalten
    Agenten kein Tool für Bilder. Füge unter KI-Anbieter einen Zugang zu
    OpenRouter oder OpenAI hinzu oder wähle eines der aufgeführten Modelle.
  unavailable:
    Das gespeicherte Bildmodell ist nicht verfügbar, daher erhalten Agenten
    kein Tool für Bilder. Wähle ein anderes Modell oder Automatisch oder
    prüfe den Anbieterzugang und die dafür erlaubten Modelle. Solange diese
    Auswahl gespeichert ist, wechselt Tale nicht zu einem anderen Modell.
  invalidPolicy:
    Die gespeicherte Konfiguration der Bildgenerierung ist ungültig, daher
    erhalten Agenten kein Tool für Bilder. Schalte die Bildgenerierung
    aus und wieder ein oder wähle ein Modell und speichere, um sie zu
    korrigieren.
  policyUnavailable:
    Die gespeicherte Konfiguration der Bildgenerierung konnte nicht gelesen
    werden. Versuche es erneut, bevor du sie änderst. Bis sie lesbar ist,
    erhalten Agenten kein Tool für Bilder.
