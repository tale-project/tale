transcriptionModel:
  title: Modell für Audiotranskription
  description:
    Dieses Modell transkribiert Audio- und Videoanhänge. Es übernimmt auch
    die Spracheingabe, wenn die Spracherkennung des Browsers nicht verfügbar
    ist. Die Spracherkennung des Browsers nutzt ihr eigenes Modell.
  label: Modell zur Audiotranskription
  labelHint:
    Automatisch wählt ein verfügbares Modell. Ein festgelegtes Modell bleibt
    ausgewählt, bis du es änderst, auch wenn es nicht mehr verfügbar ist.
  automaticLabel: Automatisch
  automaticHint: Tale wählt aus den verfügbaren Modellen zur Audiotranskription.
  currentModel: 'Aktuelles Modell für Audiotranskription: {model}.'
