title: Umgebung
description:
  Verschlüsselte Zugangsdaten, die die Agenten dieses Projekts nutzen
  können. Werte werden nach dem Speichern nie angezeigt.
agentAccessTitle: Für Agenten verfügbar
agentAccessBody: Agent-Runtimes (z. B. Hermes, OpenClaw) können diese Secrets
  nutzen, wenn sie Aufgaben für dieses Projekt ausführen — etwa um sich in
  deinem Namen bei externen Diensten anzumelden. Werte werden zur Laufzeit
  eingefügt und niemals dem Chat-Modell gezeigt oder in der Oberfläche
  angezeigt.
errors:
  accessDeniedTitle: Admin-Zugriff erforderlich
  PROJECT_FORBIDDEN:
    Du hast keinen Zugriff auf die Secrets dieses Projekts. Nur
    Projekt-Administratoren können sie ansehen oder verwalten.
  PROJECT_NOT_FOUND: Dieses Projekt existiert nicht mehr.
  loadFailed: Die Secrets dieses Projekts konnten nicht geladen werden.
  refreshFailed: Die Secrets dieses Projekts konnten nicht aktualisiert werden. Die Anzeige ist womöglich veraltet.
