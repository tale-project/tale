title: Umgebung
description:
  Verschlüsselte Zugangsdaten, die für dieses Projekt gespeichert werden. Sie
  werden derzeit nicht an Agentenläufe übergeben. Gewähre einem Agenten Zugriff
  über seine Secrets-Berechtigungen. Werte werden nach dem Speichern nie angezeigt.
agentAccessTitle: Für das Projekt gespeichert
agentAccessBody: Diese Zugangsdaten werden für das Projekt gespeichert, aber
  derzeit nicht an Agentenläufe übergeben. Gewähre einem Agenten Zugriff über
  seine Secrets-Berechtigungen. Werte werden niemals dem Chat-Modell gezeigt
  oder in der Oberfläche angezeigt.
errors:
  accessDeniedTitle: Admin-Zugriff erforderlich
  PROJECT_FORBIDDEN:
    Du hast keinen Zugriff auf die Secrets dieses Projekts. Nur
    Projekt-Administratoren können sie ansehen oder verwalten.
  PROJECT_NOT_FOUND: Dieses Projekt existiert nicht mehr.
  loadFailed: Die Secrets dieses Projekts konnten nicht geladen werden.
  refreshFailed: Die Secrets dieses Projekts konnten nicht aktualisiert werden. Die Anzeige ist womöglich veraltet.
  SECRET_NAME_INVALID: Secret-Namen müssen mit einem Großbuchstaben beginnen und dürfen nur Großbuchstaben, Ziffern oder Unterstriche enthalten (maximal 64 Zeichen).
