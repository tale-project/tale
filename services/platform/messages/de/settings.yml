mcpEndpoint:
  title: MCP-Endpunkt
  description: Verbinde einen MCP-Client mit diesem Deployment, um
    Automatisierungen zu erstellen, auszuführen und zu verwalten — und um an
    die Capabilities und das Wissen dieser Organisation zu kommen.
  copyEndpoint: MCP-Endpunkt-URL kopieren
  organizationReadFailed: Die Organisationsdaten konnten nicht geladen werden; die Beispielanfrage ist nicht verfügbar.
  organizationReadRetry: Erneut versuchen
  authHelp: 'Authentifiziere dich mit einem REST-API-Schlüssel als
    Bearer-Token. Ein Schlüssel gehört der Person, die ihn erstellt hat, und
    gilt in jeder Organisation, der sie angehört; diese Organisation nennt der
    Header X-Organization-Slug. Schlüssel erstellst und verwaltest du unter'
  authLink: REST-API-Schlüssel.
  orgSlug:
    title: Organisations-Slug
    description: Gehört der Schlüsselinhaber mehreren Organisationen an,
      muss jede Anfrage diese hier benennen — schick den Wert als
      X-Organization-Slug mit. Ein Schlüssel mit nur einer Organisation
      kann ihn weglassen.
    copy: Organisations-Slug kopieren
  tools:
    authoring:
      title: Autorieren
      description: Am Automatisierungsdokument arbeiten — entwerfen,
        validieren, testen, speichern, live schalten. get_docs erklärt die
        Grammatik.
    management:
      title: Lauf- & Trigger-Verwaltung
      description: Betreiben, was live ist — Läufe starten und abfragen,
        Versionen durchsehen, Trigger setzen und lösen.
    capability:
      title: Capabilities & Wissen
      description: Die eigene Oberfläche der Organisation — durchsuchen, was
        sie kann, eine Capability aufrufen, Wissen abrufen.
  exampleTitle: Ausprobieren
  exampleHelp: Listet die Tools — setze deinen API-Schlüssel ein;
    X-Organization-Slug ist schon eingetragen.
  copyExample: Beispiel-Anfrage kopieren
modelEndpoints:
  title: Modell-Endpunkte
  description: Nutze die Modelle der Organisation mit einem persönlichen
    API-Schlüssel aus deinen eigenen Werkzeugen — opencode, Claude Code,
    den OpenAI- und Anthropic-SDKs.
  loadFailed: Der Status der Modell-Endpunkte konnte nicht geladen werden.
  governanceNote: Jeder Aufruf zählt gegen deine Budgets und durchläuft die
    Eingabe-Guardrails der Organisation; die Antworten der Modelle werden
    nicht gefiltert.
  disabled:
    title: Die Modell-Endpunkte sind für deine Organisation nicht aktiviert
    description: Ein Admin aktiviert sie unter Einstellungen → Richtlinien →
      Modelle → Modellzugriff.
    openPolicy: Modellzugriff öffnen
  forbidden:
    title: Deine Rolle kann die Modell-Endpunkte nicht aufrufen
    description: Inhaber, Admins und Entwickler können das. Bitte einen
      Admin, dir die Kompetenz „Modelle über die API aufrufen“ zuzuweisen.
  openaiUrl:
    label: OpenAI-kompatible Basis-URL
    description: Für die OpenAI-SDKs, opencode und andere OpenAI-kompatible
      Clients, die /chat/completions anhängen.
    copy: OpenAI-kompatible Basis-URL kopieren
  anthropicUrl:
    label: Anthropic-kompatible Basis-URL
    description: Für Claude Code (ANTHROPIC_BASE_URL) und die
      Anthropic-SDKs, die /v1/messages anhängen.
    copy: Anthropic-kompatible Basis-URL kopieren
  apiKey:
    label: API-Schlüssel
    description: Schick einen persönlichen API-Schlüssel als Bearer-Token im
      Header Authorization. Schlüssel erstellst du unter
    link: REST-API-Schlüssel.
  orgSlug:
    label: Organisations-Slug
    description: Schick ihn als Header X-Organization-Slug mit, wenn dein
      Schlüssel zu mehr als einer Organisation gehört.
    copy: Organisations-Slug kopieren
  models:
    label: Modelle, die du aufrufen kannst
    description: Verwende diese IDs als Modellnamen an beiden Endpunkten.
      Dein Modellzugriff bestimmt die Liste.
    empty: Dir steht noch kein Modell zur Verfügung. Ein Admin verbindet
      Anbieter und legt den Modellzugriff fest.
    copy: Modell-ID {id} kopieren
  opencode:
    title: opencode
    description: Trag den Anbieter in opencode.json ein. Der Schlüssel kommt
      aus der Umgebungsvariable TALE_API_KEY.
    copy: opencode-Konfiguration kopieren
  claudeCode:
    title: Claude Code
    description: Setze diese Variablen, bevor du claude startest. Lass
      ANTHROPIC_API_KEY ungesetzt — Tale lehnt den Header ab, den es sendet.
    copy: Claude-Code-Variablen kopieren
  openaiSdk:
    title: OpenAI-SDK (Python)
    description: Richte den Client auf Tale aus. Streaming, Tools und Bilder
      funktionieren wie bei OpenAI.
    copy: OpenAI-SDK-Beispiel kopieren
