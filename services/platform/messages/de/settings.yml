  password:
    storedNoPreviewHint:
      Ein Wert ist gespeichert — leer lassen, um ihn zu behalten,
      oder einen neuen eingeben, um ihn zu ersetzen.
    writeOnlyHint: Nur Schreiben; leer lassen, um den gespeicherten Wert zu behalten
  testConnection: Verbindung testen
  result:
    ok: OK
    failed: Fehlgeschlagen
  knowledge:
    paradeDbNote:
      Die externe Wissensdatenbank muss ParadeDB (pgvector + pg_search)
      verwenden, damit die volle Hybrid-Suche funktioniert; reines pgvector
      fällt auf reine Vektor-Suche zurück.
  storage:
    externalS3: Externes S3
    region: Region
    endpoint: Endpunkt (MinIO/R2; leer für AWS)
    endpointShort: Endpunkt
    forcePathStyle: Path-Style erzwingen (MinIO/R2)
    accessKeyId: Access Key ID
    writeOnly: Nur Schreiben
    secretAccessKey: Secret Access Key
  orgKnowledge:
    title: Wissensdatenbank
    description:
      Die Postgres-Datenbank mit dem Wissenskorpus dieser Organisation für
      Suche und Abruf.
    statusDefault: Deployment-Standard
    readOnlyBody:
      Zum Ändern des Speicherorts des Wissenskorpus dieser Organisation sind
      Admin-Berechtigungen erforderlich.
    note:
      Ohne Verbindung liegt das Wissen dieser Organisation in der eingebauten
      Datenbank des Deployments, pro Organisation isoliert. Mit Verbindung
      liegt der Korpus in der oben angegebenen Datenbank — eine leere
      Datenbank wird automatisch vorbereitet, zuvor indexierte Einträge
      ziehen aber nicht mit um.
    cleared:
      Verbindung entfernt — die Wissenssuche dieser Organisation verwendet
      wieder die eingebaute Datenbank des Deployments.
    clearConfirm:
      title: Wissensdatenbank-Verbindung entfernen?
      description:
        Die Wissenssuche dieser Organisation läuft wieder über die eingebaute
        Datenbank des Deployments. Einträge, die bereits in deiner Datenbank
        liegen, bleiben dort — Tale kann sie aber erst wieder lesen, wenn die
        Verbindung erneut eingerichtet ist.
      confirm: Verbindung entfernen
    errors:
      readFailed: 'Die gespeicherte Verbindung konnte nicht geladen werden: {error}'
      hostRequired: Gib den Datenbank-Host ein.
      hostInvalid: Nur Buchstaben, Ziffern, Punkte, Bindestriche, Doppelpunkte und Klammern.
      portInvalid: Gib einen Port zwischen 1 und 65535 ein.
      databaseRequired: Gib den Datenbanknamen ein.
      userRequired: Gib den Datenbankbenutzer ein.
  orgEmbedding:
    title: Embedding-Modell
    description:
      Das Modell, das Dokumente und Suchanfragen dieser Organisation für die
      Wissenssuche in Vektoren umwandelt — erforderlich, bevor die
      Wissenssuche laufen kann, auf jeder Datenbank.
    statusConfigured: Eingerichtet
    statusNotConfigured: Nicht eingerichtet
    statusCredentialMissing: Zugangsdaten fehlen
    credentialMissingWarning: >-
      Die Zugangsdaten, die dieses Embedding-Modell verwendet, existieren
      nicht mehr; Dokumentindexierung und Wissenssuche stehen still. Lege
      unter Einstellungen → KI-Anbieter Zugangsdaten an oder stelle sie
      wieder her, oder wähle hier andere und speichere.
    notConfiguredWarning:
      Die Wissenssuche ist nicht verfügbar, bis ein Embedding-Modell
      eingerichtet ist.
    banner:
      title: Wissenssuche ist aus
      body: Diese Organisation hat einen KI-Anbieter, aber kein
        Embedding-Modell — Dokumente lassen sich nicht indexieren, und
        weder Dokumente noch Websites lassen sich durchsuchen.
      link: Embedding-Modell wählen
    recommendationBody:
      Dein {provider}-Zugang kann {model} bedienen ({dimensions}-dimensionale
      Vektoren).
    recommendationApply: Dieses Modell verwenden
    readOnlyBody: Zum Ändern des Embedding-Modells dieser Organisation sind
      Admin-Berechtigungen erforderlich.
    noCredentials:
      Es sind noch keine KI-Anbieter-Zugangsdaten gespeichert — lege welche
      unter Einstellungen → KI-Anbieter an, um hier einen Anbieter zu wählen.
    provider: Anbieter
    providerPlaceholder: Anbieter wählen
    credential: Zugangsdaten
    credentialDefault: Anbieter-Standard
    credentialHint:
      Welche gespeicherten Zugangsdaten die Embedding-Aufrufe autorisieren;
      der Standard sind die Standard-Zugangsdaten des Anbieters.
    model: Modell
    modelHint: Das Modell-Tag exakt so, wie der Anbieter es schreibt.
    modelCatalogHint: Embedding-Modelle aus dem Katalog des Anbieters.
    modelCatalogCustomHint:
      Embedding-Modelle aus der Modellliste dieses Anbieters; wähle „Anderes
      Modell“, um ein Tag einzugeben, das dort nicht steht.
    modelUncuratedHint:
      Tale kennt keine Vektorbreite für {provider}. Gib das Modell-Tag (oder
      den Namen deines Deployments) und die Vektorbreite ein, die dieses
      Modell erzeugt.
    modelUnsupportedHint:
      '{provider} bietet kein Embedding-Modell an. Wähle einen Anbieter, der
      eines bedient.'
    modelUnsupported: Bietet keine Embeddings
    modelCatalogUnavailableHint:
      Der Katalog von {provider} konnte nicht geladen werden. Aktualisiere
      die Kataloge unter Einstellungen → KI-Anbieter und versuche es erneut.
    modelUnavailable: Katalog nicht verfügbar
    modelUncheckedHint:
      Tale konnte nicht prüfen, ob {provider} Embeddings bietet, daher lässt
      sich noch kein Modell wählen. Nutze oben „Erneut versuchen“.
    modelUnchecked: Prüfung fehlgeschlagen
    supportReadFailed:
      Tale konnte nicht prüfen, welche Anbieter Embeddings bieten. Bis die
      Prüfung antwortet, lässt sich kein Modell wählen.
    supportReadRetry: Erneut versuchen
    modelPlaceholder: Modell wählen
    modelCustom: Anderes Modell…
    modelTag: Modell-Tag
    dimensions: Vektorbreite
    dimensionsHint:
      'Angegeben, nie geraten: die exakte Dimensionszahl, die dieses Modell
      erzeugt. Eine spätere Änderung macht bereits geschriebene Vektoren der
      alten Breite unbrauchbar.'
    baseUrl: Basis-URL
    baseUrlHint: OpenAI-kompatibler Endpunkt; leer lassen für den des Anbieters.
    sharedDbNote:
      Auf der gemeinsamen Datenbank des Deployments teilen sich alle
      Organisationen eine Vektorbreite — sie wird beim ersten geschriebenen
      Vektor festgelegt. Gib dieser Organisation eine eigene Wissensdatenbank,
      um frei zu wählen.
    removed:
      Embedding-Modell entfernt — die Wissenssuche ist nicht verfügbar, bis
      ein neues eingerichtet ist.
    removeConfirm:
      title: Embedding-Modell entfernen?
      description:
        Die Wissenssuche dieser Organisation funktioniert erst wieder, wenn
        ein neues Embedding-Modell eingerichtet ist. Bereits geschriebene
        Vektoren bleiben im Korpus.
      confirm: Modell entfernen
    errors:
      readFailed: 'Die gespeicherte Embedding-Konfiguration konnte nicht geladen werden: {error}'
      invalid: Die Embedding-Einstellungen sind ungültig. Prüfe die Felder und versuch es erneut.
      providerRequired: Wähle einen Anbieter.
      modelRequired: Gib das Modell-Tag ein.
      dimensionsInvalid: Gib eine ganze Zahl zwischen 1 und 16000 ein.
      baseUrlInvalid: Gib eine http(s)-URL ein oder lass das Feld leer.
      credentialNotFound: Die gewählten Zugangsdaten existieren nicht mehr — wähle andere.
      credentialMismatch: Die gewählten Zugangsdaten gehören zu einem anderen Anbieter.
      credentialDisabled: Die gewählten Zugangsdaten sind deaktiviert — aktiviere sie wieder oder wähle andere.
      providerUnsupported: Dieser Anbieter bietet kein Embedding-Modell an — wähle einen Anbieter, der eines bedient.
  orgStorage:
    title: Objektspeicher
    description: Der S3-kompatible Bucket mit den hochgeladenen Dateien dieser
      Organisation — Dokumente, Anhänge, Audio und generierte Medien.
    statusDefault: Deployment-Standard
    readOnlyBody:
      Zum Ändern des Speicherorts der Dateien dieser Organisation sind
      Admin-Berechtigungen erforderlich.
    bucket: Bucket
    prefix: Key-Präfix
    prefixHint: Optionaler Namensraum im Bucket; leer legt Objekte direkt im Bucket ab.
    credentialsHint:
      Nur Schreiben — gespeicherte Schlüssel werden nie angezeigt.
      Gib beide Schlüssel ein oder lass beide leer, um die gespeicherten
      Schlüssel zu testen.
    verified: Bucket geprüft (Hochladen, Lesen, Löschen)
    corsNote: Uploads und Downloads laufen direkt zwischen Browser und deinem
      Bucket. Der Bucket muss deshalb Cross-Origin-Anfragen (CORS) von
      {origin} akzeptieren — erlaube diesen Origin mit den Methoden GET, PUT
      und HEAD sowie allen Request-Headern. Der Verbindungstest läuft auf dem
      Server und kann das nicht prüfen.
    note:
      Ohne Verbindung liegen die Dateien dieser Organisation im eingebauten
      Speicher des Deployments, pro Organisation isoliert. Mit Verbindung
      landen neue Uploads im oben angegebenen Bucket; zuvor gespeicherte
      Dateien bleiben lesbar, wo sie sind.
    cleared: Verbindung entfernt — neue Uploads landen wieder im eingebauten
      Speicher des Deployments. Dateien in deinem Bucket bleiben dort, sind
      für Tale aber erst wieder verfügbar, wenn du die Verbindung erneut
      einrichtest.
    clearConfirm:
      title: Objektspeicher-Verbindung entfernen?
      description:
        Neue Uploads dieser Organisation landen wieder im eingebauten
        Speicher des Deployments. Dateien, die bereits in deinem Bucket
        liegen, bleiben dort — Tale kann sie aber erst wieder lesen, wenn die
        Verbindung erneut eingerichtet ist.
      confirm: Verbindung entfernen
    backfill:
      start: Bestehende Dateien verschieben
      description:
        Kopiert Dateien, die vor dem Wechsel im eingebauten Speicher des
        Deployments lagen, in deinen Bucket, damit alles an einem Ort liegt.
        Läuft im Hintergrund; Uploads funktionieren währenddessen weiter.
      confirm:
        title: Bestehende Dateien in deinen Bucket verschieben?
        description:
          Dateien dieser Organisation aus dem eingebauten Speicher des
          Deployments werden in deinen Bucket kopiert und von dort
          ausgeliefert. Das läuft im Hintergrund und kann bei großen
          Dateibeständen eine Weile dauern.
        confirm: Dateien verschieben
      status:
        running: 'Verschiebt Dateien… {migrated} verschoben, {failed} fehlgeschlagen.'
        completed: 'Fertig — {migrated} Dateien verschoben, {failed} fehlgeschlagen.'
        completedDry: 'Probelauf — {candidates} Dateien würden verschoben.'
        failed: 'Das Verschieben ist mit einem Fehler abgebrochen: {error}'
      errors:
        alreadyRunning: Ein Verschieben läuft bereits — warte, bis es fertig ist.
        notConfigured: Speichere die Bucket-Verbindung, bevor du bestehende Dateien verschiebst.
    errors:
      forbidden: Du darfst die Datenresidenz dieser Organisation nicht verwalten.
      invalidConnection:
        Die Verbindungsdaten sind ungültig. Prüfe die Felder und
        versuch es erneut.
      credentialsPair: Gib Access Key ID und Secret Access Key zusammen ein.
      credentialsRequired:
        Gib Access Key ID und Secret Access Key ein — beim ersten
        Einrichten des Objektspeichers sind sie erforderlich.
      readFailed: 'Die gespeicherte Verbindung konnte nicht geladen werden: {error}'
      regionRequired: Gib die Region des Buckets ein.
      endpointInvalid: Gib eine http(s)-URL ein oder lass das Feld leer für AWS.
      bucketRequired: Gib den Bucket-Namen ein.
