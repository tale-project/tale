    deleteAll: Alle Chats löschen
    archiveConfirm: 'Alle deine nicht archivierten Chats in dieser Organisation archivieren, einschließlich Projekt-Chats. Du kannst sie später wiederherstellen. Chats unter rechtlicher Aufbewahrung bleiben unverändert.'
    deleteConfirm: 'Alle deine Chats in dieser Organisation in den Papierkorb verschieben, einschließlich archivierter Chats und Projekt-Chats. Innerhalb der Aufbewahrungsfrist kannst du sie wiederherstellen. Chats unter rechtlicher Aufbewahrung oder mit einer laufenden Antwort bleiben unverändert.'
