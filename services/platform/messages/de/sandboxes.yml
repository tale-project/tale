title: Sandboxes
sessionsTitle: Arbeitsbereiche
description:
  Projekt-Agenten nutzen ihren Arbeitsbereich für mehrere Aufgaben. Die Schritte
  eines Workflow-Laufs teilen sich einen Arbeitsbereich. Der Arbeitsbereich eines
  Projekt-Agenten wird gelöscht, sobald er länger ungenutzt ist, als die
  Bereinigung der Arbeitsbereiche zulässt, oder sobald sein Agent, sein Projekt
  oder das zugehörige Mitglied entfernt wird. Laufzeitstatus und
  Kontingentbelegung stehen getrennt, denn ein Container kann nach der Freigabe
  des Kontingents weiterlaufen.
limits:
  title: Organisationslimits
  description:
    Lege fest, wie viele Sitzungen jede Arbeitsart gleichzeitig nutzen darf.
    Sitzungen belegen das Kontingent beim Start und während der Arbeit.
    Die Summe passt sich automatisch an und darf die Kapazität der
    Bereitstellung nicht überschreiten.
  usage: 'Belegt: {used} / {limit}'
  usageUnavailable: Kontingentbelegung nicht verfügbar
  invalidSessions: Gib eine ganze Zahl zwischen 1 und 500 ein.
  total: Sitzungen deiner Organisation insgesamt
  totalValue: '{total} / {maxSessions}'
  totalHint: Summe der drei Limits / Kapazität der Bereitstellung. Andere Organisationen teilen sich diese Kapazität.
  totalHintWithDevices: Summe der drei Limits / Kapazität der Bereitstellung plus die {deviceSessions} Sandboxes deiner Geräte. Andere Organisationen teilen sich die Kapazität der Bereitstellung.
  totalExceedsDeployment: Die Summe von {total} Sitzungen überschreitet die Kapazität der Bereitstellung von {maxSessions}. Verringere mindestens ein Limit, um zu speichern.
  totalExceedsCapacity: 'Die Summe von {total} Sitzungen überschreitet die Kapazität von {maxSessions}: {deploymentSessions} in der Bereitstellung und {deviceSessions} auf deinen Geräten. Verringere mindestens ein Limit, um zu speichern.'
  capacityUnavailable: Die Kapazität der Bereitstellung ist nicht verfügbar. Niedrigere Limits kannst du speichern; aktualisiere die Infrastrukturdaten, bevor du ein Limit erhöhst.
  capacityLoading: Kapazität der Bereitstellung prüfen…
  saveFailed: Sandbox-Limits konnten nicht gespeichert werden
quota:
  budgets:
    project: Projekt-Agent-Sitzungen
    workflow: Workflow-Sitzungen
    render: Render-Sitzungen
  budgetHints:
    project: Projekt-Agenten nutzen dieselbe Sandbox für mehrere Aufgaben.
    workflow: Agent- und Skriptschritte teilen sich eine Sandbox pro Workflow-Lauf.
    render: Temporäre Sandboxes rendern Webseiten beim Crawlen deiner Websites.
cleanup:
  title: Bereinigung der Arbeitsbereiche
  description:
    Projekt-Agenten bewahren ihre Dateien zwischen den Läufen in Arbeitsbereichen
    auf. Ein Arbeitsbereich wird sofort gelöscht, wenn sein Agent, sein Projekt
    oder das zugehörige Mitglied entfernt wird. Arbeitsbereiche unter einem
    Legal Hold bleiben erhalten.
  deleteUnused: Ungenutzte Arbeitsbereiche löschen
  deleteUnusedHint: Löscht einen Arbeitsbereich nach der unten angegebenen Anzahl Tage ohne Nutzung. Angepinnte Arbeitsbereiche bleiben erhalten.
  unusedDays: Tage ohne Nutzung
  unusedDaysHint: Die Tage zählen ab dem Zeitpunkt, an dem der Agent zuletzt im Arbeitsbereich gearbeitet hat. Wenn du das Löschen einschaltest oder den Zeitraum verkürzt, wird kein Arbeitsbereich gelöscht, bevor die volle Anzahl Tage vergangen ist.
  invalidDays: Gib eine ganze Zahl zwischen 1 und 3650 ein.
  loadFailed: Die Einstellungen zur Bereinigung der Arbeitsbereiche konnten nicht geladen werden. Lade die Seite neu, um es erneut zu versuchen.
  saveFailed: Die Einstellungen zur Bereinigung der Arbeitsbereiche konnten nicht gespeichert werden
capacity:
  title: Infrastrukturkapazität
  description:
    Tatsächlich laufende Umgebungen und gemessene Host-Ressourcen. Die Zahlen
    können von der Kontingentbelegung abweichen, weil Umgebungen nach dem Ende
    einer Aufgabe weiterlaufen können.
  refresh: Aktualisieren
  hostSessions: Sandboxes der Bereitstellung
  namespaceSessions: Sandboxes der Bereitstellung (Namespace)
  organizationSessions: Sandboxes deiner Organisation
  slots: '{used} / {limit}'
  sessionStates: '{running} laufen · {starting} starten'
  sessionSlotsHint: Aktuell laufend oder startend / Kapazität der Bereitstellung, gemeinsam für alle Organisationen.
  organizationSessionsHint: Aktuell laufend oder startend, auch Sandboxes im Leerlauf, die zur Wiederverwendung bereitstehen.
  cpu: CPU-Auslastung des Hosts
  cpuUsage: '{used} / {total} Kerne'
  cpuHint: Messung über alle Prozesse auf dem Host.
  memory: Speichernutzung des Hosts
  memoryUsage: '{used} / {total} GiB'
  memoryHint: Genutzter und gesamter Host-Speicher, einschließlich anderer Dienste.
  unknownValue: Nicht verfügbar
  operatorLimits:
    Alle Organisationen teilen sich die vom Betreiber festgelegte Kapazität.
    Ein freier Platz garantiert keine ausreichende Rechenleistung oder
    ausreichend Speicher für eine neue Sandbox.
  observedAt: 'Messzeitpunkt: {time}'
  scopes:
    host: Host gesamt
    namespace: Kubernetes-Namespace; Messwerte für Host-Ressourcen fehlen
  notConfigured: Für diese Bereitstellung ist keine Sandbox-Infrastruktur eingerichtet.
  unreachable: Infrastrukturdaten konnten nicht aktualisiert werden. Laufzeitstatus und Ressourcennutzung sind unbekannt.
