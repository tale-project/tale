syncHealth:
  badge:
    failed: Sync-Fehler
    needsReauth: Neu verbinden
  dialog:
    failedTitle: Synchronisierung fehlgeschlagen
    failedDescription: >-
      Die letzte Synchronisierung von „{name}“ ist fehlgeschlagen. Tale
      versucht es etwa alle 15 Minuten erneut und entfernt diesen Hinweis,
      sobald ein Durchlauf gelingt.
    needsReauthTitle: Zugriff auf {provider} abgelaufen
    needsReauthDescription: >-
      Tale erreicht {provider} mit dem Konto, das „{name}“ synchronisiert,
      nicht mehr. Die bisher synchronisierten Dateien bleiben erhalten;
      Neues kommt erst an, wenn dieses Konto erneut verbunden ist.
    failingSince: Fehlgeschlagen seit {time}
    syncedBy: Synchronisiert über das Konto von {ownerName}
    syncedByUnknown: Synchronisiert über das Konto eines Mitglieds, das inzwischen gegangen ist
    errorDetails: Fehlerdetails
    ownerNextStep: >-
      Verbinde dein Konto erneut, um die Synchronisierung fortzusetzen. Der
      nächste Durchlauf nimmt sie innerhalb von 15 Minuten wieder auf.
    otherNextStep: >-
      Bitte {ownerName}, das Konto erneut zu verbinden. Wer Dokumente
      importieren darf, kann die Synchronisierung auch mit einem neuen
