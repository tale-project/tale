        title: Deployment für SSO nicht vollständig konfiguriert
        callbackMissing:
          Die Weiterleitungs-URL ist leer, weil SITE_URL auf dem Server
          nicht gesetzt ist. Die SSO-Anmeldung schlägt fehl, bis dies
          konfiguriert ist.
        authSecretMissing:
          BETTER_AUTH_SECRET ist auf dem Server nicht gesetzt. Die
          SSO-Anmeldung schlägt mit einem Serverfehler fehl, bis dies
          konfiguriert ist.
      guide:
        title: Einrichtungsleitfaden
        redirectLabel: Weiterleitungs-/Callback-URL
        samlIntro: Erstellen Sie in Ihrem IdP eine SAML-App mit der oben im
          Anmeldebereich angezeigten SP-Metadaten-URL und ACS-URL.
        entra:
          intro:
            Registrieren Sie eine App im Microsoft Entra Admin Center und tragen Sie
            die Daten unten ein.
          s1:
            Melden Sie sich im Microsoft Entra Admin Center (entra.microsoft.com)
            mindestens als Anwendungsentwickler an.
          s2:
            Gehen Sie zu Entra ID › App-Registrierungen › Neue Registrierung; benennen
            Sie sie und wählen Sie „Einzelner Mandant".
          s3:
            Wählen Sie unter Umleitungs-URI die Plattform „Web", fügen Sie die oben
            angezeigte Weiterleitungs-URL ein und klicken Sie auf Registrieren.
          s4:
            Kopieren Sie auf der Übersichtsseite die Anwendungs-(Client-)ID und die
            Verzeichnis-(Mandanten-)ID. Die Issuer-URL lautet
            https://login.microsoftonline.com/{tenant-id}/v2.0.
          s5:
            Gehen Sie zu Zertifikate & Geheimnisse › Neues Clientgeheimnis und kopieren
            Sie den Geheimnis-Wert (nicht die Geheimnis-ID).
          s6: Tragen Sie Client-ID, Clientgeheimnis und Issuer-URL in die Felder oben ein.
          s7:
            Für die Gruppen-zu-Team-Synchronisierung fügen Sie unter API-Berechtigungen
            die Microsoft-Graph-Berechtigung GroupMember.Read.All hinzu und
            erteilen Sie die Administratorzustimmung.
          s8: Für die OneDrive-/SharePoint-Dokumentensynchronisation füge unter
            API-Berechtigungen die Microsoft-Graph-Berechtigungen Files.Read und
            Sites.Read.All hinzu und erteile die Administratorzustimmung. Willst
            du nur die Anmeldung, entferne die beiden Scopes oben aus dem Feld
            Scopes.
        google:
          intro:
            Erstellen Sie einen OAuth-Client in der Google Cloud Console und tragen
            Sie die Daten unten ein.
          s1:
            Öffnen Sie in der Google Cloud Console APIs & Dienste › Anmeldedaten ›
            Anmeldedaten erstellen › OAuth-Client-ID.
          s2: Wählen Sie den Anwendungstyp „Webanwendung".
          s3:
            Fügen Sie unter Autorisierte Weiterleitungs-URIs die oben angezeigte
            Weiterleitungs-URL hinzu und speichern Sie.
          s4: Kopieren Sie die Client-ID und das Clientgeheimnis oben auf der
            Client-Seite.
          s5:
            Tragen Sie sie oben mit der Issuer-URL https://accounts.google.com ein – die
            Endpunkte werden automatisch erkannt.
          groupsNote: 'Hinweis: Das Standard-OIDC von Google liefert keine
            Gruppenmitgliedschaften – die Gruppen-zu-Team-Synchronisierung
            benötigt das Admin SDK / die Cloud Identity API mit einem
            Workspace-Administrator. Andere OIDC-Anbieter (Okta, Auth0,
            Keycloak) funktionieren genauso: Issuer-URL und Client-Anmeldedaten
            eintragen.'
        oauth2:
          intro: Für Anbieter ohne OIDC-Discovery konfigurieren Sie die Endpunkte manuell.
          s1:
            Registrieren Sie eine Web-/OAuth2-Anwendung bei Ihrem Anbieter und fügen Sie
            die oben angezeigte Weiterleitungs-URL hinzu.
          s2: Kopieren Sie Client-ID und Clientgeheimnis.
          s3:
            Tragen Sie die URLs für Autorisierungs-, Token- und Userinfo-Endpunkt aus
            der Dokumentation Ihres Anbieters ein.
          s4: Falls Ihr Anbieter abweichende Claim-Namen verwendet, ordnen Sie
            E-Mail/Name/Gruppen unter „Erweitert" zu.
        saml:
          intro:
            Konfigurieren Sie in Ihrem IdP eine SAML-2.0-Anwendung und tragen Sie die
            Daten unten ein.
          s1: Erstellen Sie in Ihrem IdP eine neue SAML-2.0-Anwendung.
          s2: Setzen Sie die ACS-URL (Assertion Consumer Service) und die
            Entity-ID/Audience auf die oben angezeigten SP-Werte oder laden Sie
            die SP-Metadaten-URL hoch.
          s3: Setzen Sie das Name-ID-Format auf E-Mail-Adresse.
          s4: Kopieren Sie die IdP-Entity-ID, die IdP-Anmelde-URL und das
            IdP-Signaturzertifikat (PEM) in die Felder oben.
          s5:
            Ordnen Sie in Ihrem IdP die Attribute für E-Mail, Name und Gruppe zu;
            weichen die Namen ab, tragen Sie die passenden Attributnamen unter
            „Erweitert" ein.
      disableConfirmTitle: SSO-Anmeldung deaktivieren?
