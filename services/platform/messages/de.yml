      title: Wissensdatenbank
      description:
        Die Postgres-Datenbank mit dem Wissenskorpus dieser Organisation für
        Suche und Abruf.
      statusDefault: Deployment-Standard
      readOnlyBody:
        Zum Ändern des Speicherorts des Wissenskorpus dieser Organisation sind
        Admin-Berechtigungen erforderlich.
      note:
        Ohne Verbindung liegt das Wissen dieser Organisation in der eingebauten
        Datenbank des Deployments, pro Organisation isoliert. Mit Verbindung
        liegt der Korpus in der oben angegebenen Datenbank — eine leere
        Datenbank wird automatisch vorbereitet, zuvor indexierte Einträge
        ziehen aber nicht mit um.
      cleared:
        Verbindung entfernt — die Wissenssuche dieser Organisation verwendet
        wieder die eingebaute Datenbank des Deployments.
      clearConfirm:
        title: Wissensdatenbank-Verbindung entfernen?
        description:
          Die Wissenssuche dieser Organisation läuft wieder über die eingebaute
          Datenbank des Deployments. Einträge, die bereits in deiner Datenbank
          liegen, bleiben dort — Tale kann sie aber erst wieder lesen, wenn die
          Verbindung erneut eingerichtet ist.
        confirm: Verbindung entfernen
      errors:
        readFailed: 'Die gespeicherte Verbindung konnte nicht geladen werden: {error}'
