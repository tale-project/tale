  aiHint: Bearbeitbar — verschiebe Token, um den Rückweg zu testen.
  restoredTitle: Wiederhergestellte Antwort
  restoredHint:
    Token wieder durch deine Originaldaten ersetzt. Grüne Markierungen
    zeigen, was wiederhergestellt wurde.
  blockTitle: Nachricht blockiert
  blockHint: Personendaten erkannt — die Nachricht würde abgelehnt und nicht an
