  tokenizedHint:
    Personendaten durch indizierte Token ersetzt — nur diese Version
    sieht das KI-Modell.
  maskedTitle: Maskierte Ausgabe
  maskedHint: Personendaten durch generische Platzhalter ersetzt. Diese Version
    wird gesendet und gespeichert.
