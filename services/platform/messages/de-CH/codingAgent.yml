prompt:
  createInProject: Nutze den MCP-Server tale. Rufe zuerst get_docs auf und liste dann meine Automatisierungen mit list_automations auf, damit du keine doppelt anlegst. Erstelle eine neue Automatisierung im Projekt «{project}». [Beschreibe, was sie tun soll.] Wähle einen Namen, den list_automations noch nicht zeigt, prüfe die Automatisierung mit validate_automation und teste sie mit test_automation. Speichere sie dann mit save_automation, create auf true und projectId auf {projectId}, damit sie in diesem Projekt installiert wird. Frag mich, bevor du sie live schaltest.
