sessionLapse:
  paused: Deine Seite bleibt geöffnet. Kopiere alles, was du behalten möchtest. Wenn du bereit bist, schliesse offene Dialoge und wähle Anmelden.
validation:
  passwordUppercase: Passwort muss einen Grossbuchstaben enthalten
changePassword:
  requirements:
    uppercase: Ein Grossbuchstabe
  warning:
    description:
      Beim Ändern deines Passworts wirst du auf allen Geräten abgemeldet.
      Du musst dich anschliessend mit deinem neuen Passwort erneut anmelden.
forcedChange:
  description:
    Dein Passwort ist gemäss der Rotationsrichtlinie der Organisation
    abgelaufen. Lege ein neues Passwort fest, um fortzufahren.
