condition:
  gt: '{a} grösser als {b} ist'
  notGt: '{a} nicht grösser als {b} ist'
  quote: '«{text}»'
runs:
  quarantine:
    changed: Die Sperre hat sich geändert. Schliesse diesen Dialog und prüfe die aktuellen Angaben, bevor du entscheidest.
  effects:
    description: Alles, was dieser Lauf ausserhalb der Plattform verändert hat, in
      der Reihenfolge, in der es passiert ist.
    none: Dieser Lauf hat ausserhalb der Plattform nichts verändert.
    noneForNode: Diese Node hat ausserhalb der Plattform nichts verändert.
    noneYetForNode: Diese Node hat ausserhalb der Plattform noch nichts verändert.
trigger:
  cronProblems:
    emptyEntry: 'Im Feld «{field}» steht in «{token}» ein Komma ohne Wert daneben'
    invalidStep: 'Im Feld «{field}» ist die Schrittweite in «{token}» keine ganze Zahl ab 1'
    notARange: 'Im Feld «{field}» ist «{token}» kein Bereich — schreib ihn als «von-bis»'
    outOfRange: 'Im Feld «{field}» liegt «{token}» ausserhalb des Bereichs — erlaubt sind ganze Zahlen von {min} bis {max}'
    matchesNothing: 'Im Feld «{field}» trifft «{token}» keinen Wert'
  schedule:
    repeatNoCron: '«{sentence}» lässt sich nicht als ein Cron-Ausdruck schreiben. Gib einen ein oder wechsle zurück zu Wiederholung.'
  nextRuns:
    paused: 'Pausiert: Schalte «Aktiv» ein und speichere, damit diese Läufe starten.'
  skip:
    missed:
      policySkip: 'Sie wurden ausgelassen, wie unter «Verpasste Läufe» eingestellt.'
  issues:
    input:
      tooLarge: 'Die feste Eingabe ist grösser als 16 KiB.'
blank:
  deployFailed: 'Die Automatisierung wurde angelegt, aber v1 liess sich nicht live schalten: {error}. Schalte sie im Editor live.'
  triggerFailed: "Die Automatisierung wurde angelegt, aber ihr Trigger liess sich
    nicht setzen: {error}. Setze ihn über die Trigger-Karte."
templates:
  loadFailed: 'Die Vorlagen liessen sich nicht laden: {error}'
  loadTemplateFailed: 'Die Vorlage liess sich nicht laden: {error}'
  numberOutOfRange: '«{label}» braucht eine ganze Zahl von {min} bis {max}.'
  preview:
    needsPartner: 'Hier ist nichts zu verbinden: Die Automatisierung arbeitet mit dem, was eine der Vorlagen unter «Passt zu» hereinholt.'
  createFailed: 'Die Automatisierung liess sich nicht anlegen: {error}'
tests:
  fromRun:
    simulate:
      tooLarge: 'Zu gross, um ihn in der Automatisierung zu behalten ({size}).'
    warnings:
      tooLarge: '{part, select, input {Die Eingabe} output {Die Ausgabe} other {Der Test}} ist gross ({size}).'
settings:
