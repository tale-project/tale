account:
  chats:
    archiveConfirm: Alle deine nicht archivierten Chats in dieser Organisation
      archivieren, einschliesslich Projekt-Chats. Du kannst sie später
      wiederherstellen. Chats unter rechtlicher Aufbewahrung bleiben
      unverändert.
    deleteConfirm: Alle deine Chats in dieser Organisation in den Papierkorb
      verschieben, einschliesslich archivierter Chats und Projekt-Chats.
      Innerhalb der Aufbewahrungsfrist kannst du sie wiederherstellen. Chats
      unter rechtlicher Aufbewahrung oder mit einer laufenden Antwort bleiben
      unverändert.
dataResidency:
  orgStorage:
