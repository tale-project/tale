    abschliessender Schrägstrich), sonst schlägt die Anmeldung mit AADSTS50011
    fehl.
providers:
  subscriptionScope:
    description: >-
      Ein Abo-Token läuft nur in der Agent-Laufzeit, die sein Anbieter
      unterstützt, etwa Claude Code oder Codex, in einer Sandbox: Die Anbieter
      erlauben diese Tokens nicht in anderen Anwendungen, und Anthropic weist
      sie bei jedem Client ausser Claude Code ab. Im Chat lassen sich diese
      Zugangsdaten nicht verwenden. Um mit diesen Modellen zu chatten, füge für
      den Anbieter Zugangsdaten per API-Schlüssel oder Umgebungsvariable hinzu.
  broker:
    maxResponseBytes: Maximale Antwortgrösse (Bytes)
