      confirm:
        description: Dateien dieser Organisation aus dem eingebauten Speicher des
          Deployments werden in deinen Bucket kopiert und von dort ausgeliefert.
          Das läuft im Hintergrund und kann bei grossen Dateibeständen eine
          Weile dauern.
enterpriseSso:
  excludeGroupsLabel: Gruppen ausschliessen
  embedding:
    toggleHelp: Ausgeschaltet bleibt jede Seite ausserhalb von Frames; die Liste
      unten bleibt erhalten.
  metadata:
    importFailed: Die IdP-Metadaten liessen sich nicht importieren.
    errorTooLarge: Das Metadaten-Dokument ist zu gross (max. 1 MB).
    errorFetchFailed: Die Metadaten-URL liess sich nicht abrufen. Prüfe die Adresse oder lade
      die Datei herunter und lade sie hier hoch.
  redirectUrlHelp: Registrieren Sie genau diese URL als "Web"-Weiterleitungs-URI in Ihrer
