    guide:
      title: Setup guide
      redirectLabel: Redirect / callback URL
      samlIntro:
        Create a SAML app in your IdP using the SP metadata URL and ACS URL
        shown in the sign-in section above.
      entra:
        intro:
          Register an app in the Microsoft Entra admin center, then paste its
          details below.
        s1:
          Sign in to the Microsoft Entra admin center (entra.microsoft.com) as at
          least an Application Developer.
        s2:
          Go to Entra ID › App registrations › New registration; name it and choose
          "Single tenant".
        s3:
          Under Redirect URI, select the "Web" platform and paste the Redirect URL
          shown above, then Register.
        s4: On the Overview page, copy the Application (client) ID and Directory
          (tenant) ID. The Issuer URL is
          https://login.microsoftonline.com/{tenant-id}/v2.0.
        s5:
          Go to Certificates & secrets › New client secret and copy the secret Value
          (not the Secret ID).
        s6: Enter the client ID, client secret, and issuer URL in the fields above.
        s7:
          For group→team sync, add the Microsoft Graph GroupMember.Read.All permission
          under API permissions and grant admin consent.
        s8:
          For OneDrive/SharePoint document sync, add the Microsoft Graph Files.Read
          and Sites.Read.All permissions under API permissions and grant admin
          consent. If you only want sign-in, remove the two scopes from the
          Scopes field above.
      google:
        intro:
          Create an OAuth client in the Google Cloud Console, then paste its
          details below.
        s1:
          In the Google Cloud Console, open APIs & Services › Credentials › Create
          credentials › OAuth client ID.
        s2: Choose the application type "Web application".
        s3: Under Authorized redirect URIs, add the Redirect URL shown above and save.
        s4: Copy the Client ID and Client secret shown at the top of the client page.
        s5:
          Enter them above with the Issuer URL https://accounts.google.com — the
          endpoints are discovered automatically.
        groupsNote: Google's standard OIDC doesn't return group memberships — group→team sync needs the Admin SDK / Cloud Identity API with a Workspace admin.
      oauth2:
        intro: For providers without OIDC discovery, configure the endpoints manually.
        s1:
          Register a web/OAuth2 application with your provider and add the Redirect
          URL shown above.
        s2: Copy the client ID and client secret.
        s3: Enter the authorization, token, and userinfo endpoint URLs from your
          provider's documentation.
        s4:
          If your provider uses non-standard claim names, map email/name/groups under
          Advanced.
      saml:
        intro:
          Configure a SAML 2.0 application in your IdP, then paste its details
          below.
        s1: In your IdP, create a new SAML 2.0 application.
        s2:
          Set the ACS (Assertion Consumer Service) URL and the Entity ID / Audience to
          the SP values shown above, or upload the SP metadata URL.
        s3: Set the Name ID format to email address.
        s4:
          Copy the IdP entity ID, the IdP single sign-on URL, and the IdP signing
          certificate (PEM) into the fields above.
        s5:
          Map the email, name, and group attributes in your IdP; if their names
          differ, set the matching attribute names under Advanced.
