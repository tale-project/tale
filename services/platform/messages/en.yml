      modelHint: The model tag exactly as the provider spells it.
      dimensions: Vector width
      dimensionsHint:
        'Stated, never guessed: the exact dimension count this model produces.
        Changing it later strands vectors already written at the old width.'
      baseUrl: Base URL
      baseUrlHint: OpenAI-compatible endpoint; leave blank for the provider's own.
      sharedDbNote:
        On the deployment's shared database, all organizations share one
        vector width — it is pinned when the first vector is written. Give
        this organization its own knowledge database to choose freely.
      removed:
        Embedding model removed — knowledge search is unavailable until a new
        one is configured.
      removeConfirm:
        title: Remove the embedding model?
        description:
          Knowledge search for this organization stops working until a new
          embedding model is configured. Vectors already written stay in the
          corpus.
        confirm: Remove model
      errors:
        readFailed: "Couldn't load the stored embedding config: {error}"
        invalid: The embedding settings are invalid. Check the fields and try again.
        providerRequired: Choose a provider.
        modelRequired: Enter the model tag.
        dimensionsInvalid: Enter a whole number between 1 and 16000.
        baseUrlInvalid: Enter an http(s) URL, or leave blank.
        credentialNotFound: The selected credential no longer exists — choose another.
        credentialMismatch: The selected credential belongs to a different provider.
        credentialDisabled: The selected credential is disabled — re-enable it or pick another.
