      title: Object storage
      description:
        The S3-compatible bucket holding this organization's uploaded files
        — documents, attachments, audio, and generated media.
      statusDefault: Deployment default
      readOnlyBody:
        Admin permissions are required to change where this organization's
        files are stored.
      bucket: Bucket
      prefix: Key prefix
      prefixHint:
        Optional namespace inside the bucket; blank stores objects at the
        bucket root.
      credentialsHint:
        Write-only — stored keys are never shown. Enter both keys, or
        leave both blank to test the stored keys.
      verified: Bucket verified (upload, read, delete)
      corsNote: Uploads and downloads run directly between the browser and your
        bucket, so the bucket must accept cross-origin (CORS) requests from
        {origin} — allow that origin with the GET, PUT and HEAD methods and all
        request headers. The connection test runs on the server and cannot check
        this.
      note:
        Off, this organization's files live in the deployment's built-in storage,
        isolated per organization. On, new uploads go to the bucket above; files
        stored before the switch stay readable where they are.
      cleared:
        Connection removed — new uploads go back to the deployment's built-in
        storage. Files already in your bucket stay there but are unavailable to
        Tale until you reconnect it.
