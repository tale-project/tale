        immediately. Range: 0–72.'
    requireDualApproval:
      label: Require dual approval
      description:
        When enabled, every filed request must be approved by a second
        admin (the filer cannot approve their own request) before the
        cooling-off window starts. Recommended for high-stakes deployments with
        two or more admins.
    dailyLimitPerAdmin:
      label: Daily limit per admin
      description:
        'Maximum number of erasure requests a single admin may file per
        day. Caps blast radius from a compromised admin credential. Range:
        1–50.'
