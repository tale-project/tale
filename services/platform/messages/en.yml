        title: Remove the object-storage connection?
        description:
          New uploads for this organization go back to the deployment's
          built-in storage. Files already written to your bucket stay there, but
          Tale can no longer read them until the connection is added again.
        confirm: Remove connection
      backfill:
        start: Move existing files
        description:
          Copies files stored before the switch from the deployment's built-in
          storage into your bucket, so everything lives in one place. Runs in
          the background; uploads keep working meanwhile.
        confirm:
          title: Move existing files into your bucket?
          description:
