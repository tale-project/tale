title: Sandboxes
sessionsTitle: Workspaces
description:
  A project agent works each task it runs at the same time in a worker of its
  own, a sandbox with its own workspace that later tasks reuse. Workflow runs
  share one workspace across their steps. A worker's workspace stays until it
  goes unused for longer than Workspace cleanup allows, or until its agent,
  project or member is removed. Runtime status and organization quota
  allocation are shown separately; a released allocation can still have a
  running container.
limits:
  title: Organization limits
  description:
    Set the number of sessions each workload can use at once. Allocated sessions
    count against these limits while work starts or runs. The total updates
    automatically and must fit within the deployment capacity.
  usage: 'Allocated: {used} / {limit}'
  usageUnavailable: Allocation data unavailable
  # Under the agent workers limit: the runs a higher limit would start now.
  waitingForWorkers: '{count, plural, one {# agent run is waiting for a free worker.} other {# agent runs are waiting for a free worker.}}'
  invalidSessions: Must be a whole number between 1 and 500.
  total: Total organization sessions
  totalValue: '{total} / {maxSessions}'
  totalHint: Sum of the three limits / deployment capacity. Other organizations share this capacity.
  totalHintWithDevices: Sum of the three limits / deployment capacity plus the {deviceSessions} sandboxes your devices run. Other organizations share the deployment capacity.
  totalExceedsDeployment: The total of {total} sessions exceeds the deployment capacity of {maxSessions}. Reduce one or more limits to save.
  totalExceedsCapacity: 'The total of {total} sessions exceeds the capacity of {maxSessions}: {deploymentSessions} on the deployment and {deviceSessions} on your devices. Reduce one or more limits to save.'
  capacityUnavailable: Deployment capacity is unavailable. Lowering limits still saves; refresh the infrastructure data before raising one.
  capacityLoading: Checking deployment capacity…
  saveFailed: Couldn't save sandbox limits
quota:
  budgets:
    project: Agent workers
    workflow: Workflow sessions
    render: Render sessions
  budgetHints:
    project: Each task an agent works on at the same time runs in a sandbox of its own.
    workflow: Agent and script steps share one sandbox per workflow run.
    render: Temporary sandboxes render web pages during website crawling.
cleanup:
  title: Workspace cleanup
  description:
    Project agents keep their files in workspaces between runs. A workspace is
    deleted right away when its agent, project or member is removed. Workspaces
    under a legal hold are kept.
  deleteUnused: Delete unused workspaces
  deleteUnusedHint: Deletes a workspace after the number of days without use set below. Pinned workspaces are kept.
  unusedDays: Days without use
  unusedDaysHint: Counted from the last time the agent worked in the workspace. After you turn deletion on or shorten the period, no workspace is deleted until the full number of days has passed.
  invalidDays: Must be a whole number between 1 and 3650.
  loadFailed: Couldn't load the workspace cleanup settings. Reload the page to try again.
  saveFailed: Couldn't save the workspace cleanup settings
capacity:
  title: Infrastructure capacity
  description:
    Actual running environments and measured host resources. These counts can
    differ from organization allocations because idle environments can stay
    running after a task ends.
  refresh: Refresh
  hostSessions: Deployment sandboxes
  namespaceSessions: Deployment sandboxes (namespace)
  organizationSessions: Your organization's sandboxes
  slots: '{used} / {limit}'
  sessionStates: '{running} running · {starting} starting'
  sessionSlotsHint: Currently running or starting / deployment capacity, shared by all organizations.
  organizationSessionsHint: Currently running or starting, including idle sandboxes kept for reuse.
  cpu: Host CPU usage
  cpuUsage: '{used} / {total} cores'
  cpuHint: Measured across all host workloads.
  memory: Host memory usage
  memoryUsage: '{used} / {total} GiB'
  memoryHint: Used memory and total memory across the host, including other services.
  unknownValue: Unavailable
  operatorLimits:
    All organizations share the deployment capacity set by the operator.
    A free place does not guarantee enough CPU or memory for a new sandbox.
  observedAt: 'Observed: {time}'
  scopes:
    host: Host scope
    namespace: Kubernetes namespace scope; host resource measurements unavailable
  notConfigured: Sandbox infrastructure is not configured for this deployment.
  unreachable: Couldn't refresh infrastructure data. Runtime state and resource usage are unknown.
