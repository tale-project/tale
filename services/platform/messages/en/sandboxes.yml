empty:
  title: No workspaces yet
  description:
    A project agent's worker appears with its first task, one for each task it
    works on at the same time. Its workspace stays until it goes unused for
    longer than Workspace cleanup allows, or until its agent, project or member
    is removed. A workflow run's workspace is reclaimed once the run ends.
    Temporary crawler sessions are included in capacity counts above.
accessDenied: You need developer or admin access to manage sandboxes.
