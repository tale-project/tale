dialog:
  title: Connect a coding agent
  description: Your agent signs in with your Tale account. You choose the organization and what it may do.
  guide: Setup guide
  done: Done
clients:
  label: Coding agent
  other: Other
steps:
  claudeCodeAdd: Add Tale to Claude Code. Run this in your terminal.
  claudeCodeSignIn: Sign in. Your browser opens Tale; choose the organization and what the agent may do.
  codexAdd: Add Tale to Codex and sign in. Run this in your terminal; your browser opens Tale, where you choose the organization and what the agent may do.
  otherAddress: Add this address to your client as a remote MCP server.
  otherSignIn: Choose browser sign-in (OAuth) when it asks how to authenticate. The guide has the steps for Cursor, opencode and Claude on the web.
copy:
  command: Copy command
  address: Copy address
  prompt: Copy prompt
  copied: Copied
status:
  waiting: Waiting for your agent to sign in…
  connected: 'Connected: {client}'
prompt:
  label: Then ask your agent
  labelConnected: Try this first
  replace: Replace the part in brackets before you send it.
  general: Use the tale MCP server. Call get_docs first, then list my automations with list_automations and tell me what you can do in this workspace. Ask me before you deploy anything or change a setting.
  edit: Use the tale MCP server. Call get_docs, then open the automation {name} with get_automation. [Describe the change you want.] Check it with validate_automation and test it with test_automation before you save it as a new version with save_automation. Ask me before you deploy it.
  run: Use the tale MCP server. The run {runId} of the automation {name} failed. Call get_docs first, then read the run with get_run and ask for its record; the failed step's failure.reason says why. Read the automation with get_automation, explain in plain words what went wrong and propose the smallest fix. Reproduce the failure with run_automation before you change anything. If the cause is outside the automation, such as a connector, a secret or a model that is not set up, tell me where in Tale to set it up, and never ask me to paste a secret. Save a fix with save_automation only after I agree, and ask me before you deploy it.
  create: Use the tale MCP server. Call get_docs first, then list my automations with list_automations so you do not repeat one. Create a new automation. [Describe what it should do.] Pick a name list_automations does not show yet, check the automation with validate_automation and test it with test_automation, then save it with save_automation and create set to true. Ask me before you deploy it.
