      identity provider can also set it.
    manageLink: Manage members
  teams:
    title: Your teams
    description: Teams decide which team documents, projects and inbox
      queues you can see. Admins manage them under Settings › Teams.
    none: You are not in any team yet. You see everything shared with the
      whole organization.
