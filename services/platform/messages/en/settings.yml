mcpEndpoint:
  title: MCP endpoint
  description: Point any MCP client at this deployment to author, run and
    manage automations — and to reach this organization's own capabilities and
    knowledge.
  copyEndpoint: Copy MCP endpoint URL
  organizationReadFailed: The organization details could not be loaded, so the example request is unavailable.
  organizationReadRetry: Try again
  authHelp:
    'Authenticate with a REST API key as a bearer token. A key belongs to
    the person who created it and works in every organization they are a
    member of; this one is named by the X-Organization-Slug header. Create
    and manage keys under'
  authLink: REST API keys.
  orgSlug:
    title: Organization slug
    description: A key whose holder belongs to more than one organization
      must name this one on every request — send this value as the
      X-Organization-Slug header. A single-organization key may omit it.
    copy: Copy organization slug
  tools:
    authoring:
      title: Authoring
      description: Work on automation documents — draft, validate, test,
        save and deploy them. get_docs teaches the grammar.
    management:
      title: Run & trigger management
      description: Operate what is deployed — start and poll durable runs,
        browse versions, bind and unbind triggers.
    discovery:
      title: Discovery
      description: Look up what an automation may name — models, agent
        runtimes, skills, connectors, secret names, projects and events.
    settings:
      title: Settings
      description: Read, plan and change the settings your role allows.
        Secrets are always entered in Tale.
    capability:
      title: Capabilities & knowledge
      description: This organization's own surface — search what it can do,
        invoke one capability, retrieve knowledge.
  exampleTitle: Try it
  exampleHelp: Lists the tools — put your API key in place; the organization
    header is already filled in.
  copyExample: Copy example request
modelEndpoints:
  title: Model endpoints
  description: Use the organization's models from your own tools — opencode,
    Claude Code, the OpenAI and Anthropic SDKs — with a personal API key.
  loadFailed: Couldn't load the model endpoints' status.
  governanceNote: Every call counts against your budgets and passes the
    organization's input guardrails; the models' answers are not filtered.
  disabled:
    title: Model endpoints are not enabled for your organization
    description: An admin turns them on under Settings → Governance →
      Models → Model access.
    openPolicy: Open model access
  forbidden:
    title: Your role cannot call the model endpoints
    description: Owners, admins and developers can. Ask an admin to grant
      you the Call models over the API competence.
  openaiUrl:
    label: OpenAI-compatible base URL
    description: For the OpenAI SDKs, opencode and other OpenAI-compatible
      clients, which append /chat/completions.
    copy: Copy OpenAI-compatible base URL
  anthropicUrl:
    label: Anthropic-compatible base URL
    description: For Claude Code (ANTHROPIC_BASE_URL) and the Anthropic
      SDKs, which append /v1/messages.
    copy: Copy Anthropic-compatible base URL
  apiKey:
    label: API key
    description: Send a personal API key as a bearer token in the
      Authorization header. Create one under
    link: REST API keys.
  orgSlug:
    label: Organization slug
    description: Send it as the X-Organization-Slug header when your key
      belongs to more than one organization.
    copy: Copy organization slug
  models:
    label: Models you can call
    description: Use these ids as the model name on both endpoints. Your
      model access decides the list.
    empty: No model is available to you yet. An admin connects providers
      and decides model access.
    copy: Copy model id {id}
  opencode:
    title: opencode
    description: Add the provider to opencode.json. The key comes from the
      TALE_API_KEY environment variable.
    copy: Copy opencode configuration
  claudeCode:
    title: Claude Code
    description: Set these variables before you start claude. Leave
      ANTHROPIC_API_KEY unset — Tale refuses the header it sends.
    copy: Copy Claude Code variables
  openaiSdk:
    title: OpenAI SDK (Python)
    description: Point the client at Tale. Streaming, tools and images work
      as they do with OpenAI.
    copy: Copy OpenAI SDK example
