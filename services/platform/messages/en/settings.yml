dataResidency:
  readOnly:
    title: Read-only access
  externalPostgres: External Postgres
  field:
    host: Host
    port: Port
    database: Database
    user: User
    sslMode: SSL mode
    password: Password
  password:
    storedNoPreviewHint:
      A value is stored — leave blank to keep it, or enter a new
      one to replace it.
    writeOnlyHint: Write-only; leave blank to keep the stored value
  testConnection: Test connection
  result:
    ok: OK
    failed: Failed
  knowledge:
    paradeDbNote:
      The external knowledge database must run ParadeDB (pgvector +
      pg_search) for full hybrid search; plain pgvector degrades to
      vector-only.
  storage:
    externalS3: External S3
    region: Region
    endpoint: Endpoint (MinIO/R2; blank for AWS)
    endpointShort: Endpoint
    forcePathStyle: Force path-style (MinIO/R2)
    accessKeyId: Access key ID
    writeOnly: Write-only
    secretAccessKey: Secret access key
  orgKnowledge:
    title: Knowledge database
    description:
      The Postgres database holding this organization's knowledge corpus
      for search and retrieval.
    statusDefault: Deployment default
    readOnlyBody:
      Admin permissions are required to change where this organization's
      knowledge corpus is stored.
    note:
      Off, this organization's knowledge lives in the deployment's built-in
      database, isolated per organization. On, the corpus lives in the
      database above — an empty database is prepared automatically, but
      entries indexed before the switch do not move with it.
    cleared:
      Connection removed — this organization's knowledge search uses the
      deployment's built-in database again.
    clearConfirm:
      title: Remove the knowledge database connection?
      description:
        Knowledge search for this organization goes back to the deployment's
        built-in database. Entries already written to your database stay
        there, but Tale can no longer read them until the connection is
        added again.
      confirm: Remove connection
    errors:
      readFailed: "Couldn't load the stored connection: {error}"
      hostRequired: Enter the database host.
      hostInvalid: Only letters, digits, dots, dashes, colons, and brackets.
      portInvalid: Enter a port between 1 and 65535.
      databaseRequired: Enter the database name.
      userRequired: Enter the database user.
  orgEmbedding:
    title: Embedding model
    description:
      The model that turns this organization's documents and queries into
      vectors for knowledge search — required before knowledge search can
      run, on any database.
    statusConfigured: Configured
    statusNotConfigured: Not configured
    statusCredentialMissing: Credential missing
    credentialMissingWarning: >-
      The credential this embedding model resolves no longer exists, so
      document indexing and knowledge search are down. Add or restore a
      credential under Settings → AI providers, or choose another one
      here and save.
    notConfiguredWarning:
      Knowledge search is unavailable until an embedding model is
      configured.
    banner:
      title: Knowledge search is off
      body: This organization has an AI provider but no embedding model, so
        documents cannot be indexed and neither documents nor websites can
        be searched.
      link: Choose an embedding model
    recommendationBody:
      Your {provider} credential can serve {model} ({dimensions}-dimensional
      vectors).
    recommendationApply: Use this model
    readOnlyBody:
      Admin permissions are required to change this organization's embedding
      model.
    noCredentials:
      No AI provider credentials are stored yet — add one under Settings →
      AI providers to choose a provider here.
    provider: Provider
    providerPlaceholder: Choose a provider
    credential: Credential
    credentialDefault: Provider default
    credentialHint:
      Which stored credential authorizes the embedding calls; the default is
      the provider's default credential.
    model: Model
    modelHint: The model tag exactly as the provider spells it.
    modelCatalogHint: Embedding models the provider's catalog lists.
    modelCatalogCustomHint:
      Embedding models this provider's listing carries; pick Other model to
      type a tag it does not list.
    modelUncuratedHint:
      Tale knows no vector width for {provider}. Enter the model tag (or
      your deployment name) and the vector width that model produces.
    modelUnsupportedHint:
      '{provider} offers no embedding model. Choose a provider that serves
      one.'
    modelUnsupported: Cannot embed
    modelCatalogUnavailableHint:
      The {provider} catalog could not be loaded. Refresh the catalogs under
      Settings → AI providers and try again.
    modelUnavailable: Catalog unavailable
    modelUncheckedHint:
      Tale could not check whether {provider} can embed, so no model can be
      chosen yet. Use Try again above.
    modelUnchecked: Could not check
    supportReadFailed:
      Tale could not check which providers can embed. No model can be
      chosen until the check answers.
    supportReadRetry: Try again
    modelPlaceholder: Choose a model
    modelCustom: Other model…
    modelTag: Model tag
    dimensions: Vector width
    dimensionsHint:
      'Stated, never guessed: the exact dimension count this model produces,
      one of {widths}. After a change, the indexed documents and website
      pages are embedded again at the new width.'
    baseUrl: Base URL
    baseUrlHint: OpenAI-compatible endpoint; leave blank for the provider's own.
    removed:
      Embedding model removed — knowledge search is unavailable until a new
      one is configured.
    removeConfirm:
      title: Remove the embedding model?
      description:
        Knowledge search for this organization stops working until a new
        embedding model is configured. Vectors already written stay in the
        corpus.
      confirm: Remove model
    errors:
      readFailed: "Couldn't load the stored embedding config: {error}"
      invalid: The embedding settings are invalid. Check the fields and try again.
      providerRequired: Choose a provider.
      modelRequired: Enter the model tag.
      dimensionsInvalid: 'Enter a supported vector width: {widths}.'
      baseUrlInvalid: Enter an http(s) URL, or leave blank.
      credentialNotFound: The selected credential no longer exists — choose another.
      credentialMismatch: The selected credential belongs to a different provider.
      credentialDisabled: The selected credential is disabled — re-enable it or pick another.
      providerUnsupported: This provider offers no embedding model — choose a provider that serves one.
  orgStorage:
    title: Object storage
    description:
      The S3-compatible bucket holding this organization's uploaded files
      — documents, attachments, audio, and generated media.
    statusDefault: Deployment default
    readOnlyBody:
      Admin permissions are required to change where this organization's
      files are stored.
    bucket: Bucket
    prefix: Key prefix
    prefixHint:
      Optional namespace inside the bucket; blank stores objects at the
      bucket root.
    credentialsHint:
      Write-only — stored keys are never shown. Enter both keys, or
      leave both blank to test the stored keys.
    verified: Bucket verified (upload, read, delete)
    corsNote: Uploads and downloads run directly between the browser and your
      bucket, so the bucket must accept cross-origin (CORS) requests from
      {origin} — allow that origin with the GET, PUT and HEAD methods and all
      request headers. The connection test runs on the server and cannot check
      this.
    note:
      Off, this organization's files live in the deployment's built-in storage,
      isolated per organization. On, new uploads go to the bucket above; files
      stored before the switch stay readable where they are.
    cleared:
      Connection removed — new uploads go back to the deployment's built-in
      storage. Files already in your bucket stay there but are unavailable to
      Tale until you reconnect it.
    clearConfirm:
      title: Remove the object-storage connection?
      description:
        New uploads for this organization go back to the deployment's
        built-in storage. Files already written to your bucket stay there, but
        Tale can no longer read them until the connection is added again.
      confirm: Remove connection
    backfill:
      start: Move existing files
      description:
        Copies files stored before the switch from the deployment's built-in
        storage into your bucket, so everything lives in one place. Runs in
        the background; uploads keep working meanwhile.
      confirm:
        title: Move existing files into your bucket?
        description:
          Files this organization stored in the deployment's built-in storage
          are copied into your bucket and served from there. This runs in the
          background and can take a while for large file sets.
        confirm: Move files
      status:
        running: 'Moving files… {migrated} moved, {failed} failed so far.'
        completed: 'Done — {migrated} files moved, {failed} failed.'
        completedDry: 'Dry run — {candidates} files would move.'
        failed: 'The move stopped with an error: {error}'
      errors:
        alreadyRunning: A move is already running — wait for it to finish.
        notConfigured: Save the bucket connection before moving existing files.
    errors:
      forbidden: You're not allowed to manage this organization's data residency.
      invalidConnection: The connection settings are invalid. Check the fields and try again.
      credentialsPair: Enter the access key ID and the secret access key together.
      credentialsRequired:
        Enter an access key ID and secret access key — they're
        required the first time object storage is configured.
      readFailed: "Couldn't load the stored connection: {error}"
      regionRequired: Enter the bucket's region.
      endpointInvalid: Enter an http(s) URL, or leave blank for AWS.
      bucketRequired: Enter the bucket name.
