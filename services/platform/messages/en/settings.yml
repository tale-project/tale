    description: Archive your chats or move them to Trash in this organization.
    archiveAll: Archive all chats
    deleteAll: Delete all chats
    archiveConfirm: 'Archive all your unarchived chats in this organization, including project chats. You can unarchive them later. Chats under legal hold stay unchanged.'
    deleteConfirm: 'Move all your chats in this organization to Trash, including archived and project chats. They can be restored during the retention grace period. Chats under legal hold or with a running reply stay unchanged.'
    result: 'Updated {changed} chats; {failed} could not be changed.'
    failed: 'Could not update your chats. Try again.'
usage:
  limits:
    title: Usage limits
    description: Your organization can cap the tokens, cost, and requests of
      your AI usage.
  personal:
    title: Your limits
    description: The chats you send, the voice output you request, and the
      agent runs you start count toward these limits, whichever way you
      started them. When a limit is reached, you can't start more of that
      work until it resets.
  shared:
    title: Shared limits
    description: A shared limit counts the usage of everyone it covers, so it
      can be reached before your own limits.
  empty:
    title: No usage limits apply to you
    description: Your organization hasn't set a token, cost, or request limit
      that covers you.
  loadFailed: Couldn't load your usage limits. Reload the page to try again.
  manageLimits: Manage limits
