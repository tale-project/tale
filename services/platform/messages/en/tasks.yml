agentRun:
  automationDisabled: 'Task automation is turned off. Ask an organization admin to enable it.'
  automationUnavailable: 'Task automation is unavailable. Ask an organization admin to check its policy.'
  previousRun: 'Previous run by {name}'
  label: Run
  started: The agent is on it — it reports back to this task for review.
  alreadyRunning: This task's agent is already running.
  notStarted: The agent run could not start.
  agentMissing: The assigned agent no longer exists. Assign another agent to run this task.
  noAgentAssignee: No agent is assigned to this task. Assign one to start a run.
  cancelled: The agent run was cancelled.
  cancelFailed: The agent run could not be cancelled.
  start: Start agent
  willStart: Dropping here starts the agent run.
  willCancel: Dropping here cancels the agent's live run.
  # One short word per state — the strip sits in the narrow property panel
  # next to a "Run" label, an agent avatar, and the task's own Status chip,
  # so anything longer truncates and repeats what the panel already says.
  status:
    queued: Queued
    running: Working…
    settled: Finished
    failed: Failed
    cancelled: Cancelled
  # Replaces "Queued" while the run waits for room, one short state per
  # reason; `unknown` is a wait that kept no reason (most waits are for a
  # worker). The run starts by itself once that room frees.
  waiting:
    org_limit: Waiting for a worker
    host: Waiting for room
    destroy_pending: Waiting for a workspace
    exec_limit: Waiting for its sandbox
    unknown: Waiting for a worker
  # What the short state means, said under it while the run waits.
  waitingWhy:
    org_limit: All of your organization's agent workers are busy. The run starts on its own when one is free.
    host: The sandbox host is full or short of memory or disk. The run starts on its own once there is room.
    destroy_pending: An admin is deleting the workspace this run would use. The run starts in a fresh one once that is done.
    exec_limit: Its sandbox is still finishing an earlier process. The run starts on its own in a moment.
    unknown: The run starts on its own as soon as there is room for it.
  # Shown to Owners and Admins beside "All … agent workers are busy".
  manageWorkers: Manage agent workers
  # Caption under the status line while a machine-kicked retry runs — the
  # user must be able to tell the platform's retry from their own.
  autoRetrying: 'Auto-retry {n} of {max}'
  # Replaces the caption when the broker refreshed the account's token
  # under the run and the platform resumed it — no attempt spent yet.
  resumedAfterTokenRefresh: Resumed after a token refresh
  retry: Retry
  cancel: Cancel run
  notStartedYet: The agent waits until you start it.
  failureTitle: The agent couldn't finish this task
  reported: What the run reported
  logReadFailed: The agent log could not be loaded. Try again.
  runReadFailed: The agent run could not be loaded. Try again.
  failure:
    budget: A usage limit stopped this run. Ask an Admin to raise it, then start the agent again.
    setup: Something this agent needs is missing — its model, one of its skills, or the agent itself. An Editor or Admin can fix it on the project's Agents tab.
    input: An attachment on this task is no longer in storage — Details names it. Remove it from the task or upload it again, then start the agent again.
    time_limit: The run reached its time limit before the agent finished. Start the agent again, or split the task into smaller ones.
    capacity: The run waited too long for a free worker. Start the agent again when fewer agents are busy.
    model: The AI model behind this agent failed before the work was done. Start the agent again — if it fails again, ask an Admin to check the AI provider.
    start: The run couldn't start. Try again — if it fails again, show an Admin what the run reported under Details.
    interrupted: The run was interrupted before the agent finished. Start the agent again.
    out_of_memory: The agent's sandbox ran out of memory, so its work was stopped. Start the agent again — if it keeps happening, ask an Admin to give agents more memory.
    stalled: The agent stopped responding — it printed nothing and did almost no work for a long time — so its sandbox stopped it. Start the agent again; if it stops again, show an Admin what the run reported under Details.
    unknown: The run failed. Start the agent again — if it fails again, show an Admin what the run reported under Details.
  standardAgent:
    switchedOff: The organization's standard agent is switched off. Ask an Admin to switch it on under Governance.
    noModel: No model you can use can run the standard agent. Ask an Admin to set up an AI provider or to give you access to a model.
    pinUnavailable: The model chosen for the standard agent isn't one you can use. Ask an Admin to choose another under Governance.
    harnessInvalid: The agent runtime chosen for the standard agent isn't available. Ask an Admin to choose another under Governance.
    unreadable: The standard agent's settings can't be read. Ask an Admin to check them under Governance.
    notNeeded: This project has agents of its own. Assign one of them instead.
