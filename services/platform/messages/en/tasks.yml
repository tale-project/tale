# name the keys the title handles), then the live announcements. {task} is
# `KEY-12, Title` on pickup and `KEY-12` after it (the title when the
# project has no key); {status} is a `status.*` label. A drop names where
# the task was released, not a status change: a workflow can still refuse it.
