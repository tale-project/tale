title: Environment
description: Encrypted credentials this project's agents can use. Values are
  never shown after saving.
agentAccessTitle: Available to agents
agentAccessBody: Agent runtimes (e.g. Hermes, OpenClaw) can use these secrets
  when they run tasks for this project — for example to sign in to external
  services on your behalf. Values are injected at runtime and are never shown
  to the chat model or revealed in the UI.
errors:
  accessDeniedTitle: Admin access required
  PROJECT_FORBIDDEN:
    You don't have access to this project's secrets. Only project
    administrators can view or manage them.
  PROJECT_NOT_FOUND: This project no longer exists.
  loadFailed: "Couldn't load this project's secrets."
  refreshFailed: "Couldn't refresh this project's secrets. What's shown may be out of date."
