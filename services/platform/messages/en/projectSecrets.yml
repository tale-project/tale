title: Environment
description: Encrypted credentials stored for this project. They are not
  currently passed to agent runs. To grant an agent access, use its Secrets
  grants. Values are never shown after saving.
agentAccessTitle: Stored for the project
agentAccessBody: These credentials are stored for this project but are not
  currently passed to agent runs. Grant an agent access through its Secrets
  grants. Values are never shown to the chat model or revealed in the UI.
errors:
  accessDeniedTitle: Admin access required
  PROJECT_FORBIDDEN:
    You don't have access to this project's secrets. Only project
    administrators can view or manage them.
  PROJECT_NOT_FOUND: This project no longer exists.
  loadFailed: "Couldn't load this project's secrets."
  refreshFailed: "Couldn't refresh this project's secrets. What's shown may be out of date."
  SECRET_NAME_INVALID: Secret names must start with an uppercase letter and contain only uppercase letters, numbers, or underscores (maximum 64 characters).
