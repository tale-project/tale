    title: Prompt templates
    description: Saved prompts across all visibility scopes (personal, team, global).
  messageFeedback:
    title: Message feedback
    description:
      Thumbs/comments left on agent messages. Free-text comments may
      contain quoted user content.
  contacts:
    title: Contacts
    description: 'Per-org CRM records: name, email, address, locale, metadata.'
  externalConversations:
    title: External conversations
    description:
      Top-level contact-channel inbox (email/chat connectors). Cascades
      to message bodies.
  chatFilterEvents:
    title: Chat filter events
    description:
      Telemetry for content-filter triggers (PII, profanity, custom
      rules). Each event holds the filter, categories, direction and
      counts, never the matched text. The Guardrails page and Chat health
      show only the events still kept.
    placeholder: e.g. 90
    helper: Filter-event telemetry rows older than this will be deleted.
  notifications:
    title: Notifications
    description:
      In-app notifications (mentions, agent results, system alerts). May
      reference content from chats, documents, or automation runs.
    placeholder: e.g. 30
    helper: Notification rows older than this will be deleted.
  chatHistory:
    title: Chat history
    description:
      Automatically delete chat threads (conversations with agents) older
      than the retention period. Message contents in the agent component are
      archived. Deletion is irreversible.
    placeholder: e.g. 90
    helper: Chat threads older than this (by last-updated time) will be deleted.
  documents:
    title: Document retention
    description:
      Automatically delete documents that exceed the retention period.
      Use with caution — deleted documents cannot be recovered.
    placeholder: e.g. 90
    helper: Documents older than this will be deleted.
  userTemp:
    title: User temporary file cleanup
    description:
      Automatically delete files uploaded by users but never saved to a
      document (e.g. chat attachments, aborted uploads).
    placeholder: e.g. 24
    helper: Temporary files older than this will be deleted.
  agentTemp:
    title: Agent temporary file cleanup
    description:
      Automatically delete files generated by agents but never saved to a
      document (e.g. intermediate outputs, knowledge files).
    placeholder: e.g. 24
    helper: Temporary files older than this will be deleted.
  workflowLogs:
    title: Automation run logs
    description: Automatically delete automation run records older than the
      retention period. Includes per-execution variable/output storage
      blobs.
    placeholder: e.g. 30
    helper: Automation runs older than this will be deleted.
  auditLogs:
    title: Audit logs
    description: Automatically delete audit log entries older than the retention period. Audit logs are immutable records — keep retention long enough to satisfy your compliance requirements.
    placeholder: e.g. 90
    helper: Audit log entries older than this will be deleted.
  usageLedger:
    title: Usage ledger
    description: Automatically delete token-usage records older than the retention period. Shortening this truncates historical analytics — budgets and reports depend on these records.
    placeholder: e.g. 365
    helper: Usage ledger rows older than this will be deleted.
  loginAttempts:
    title: Login attempts
    description: Automatically delete failed-login tracking records older than the retention period. These are deployment-wide — the shortest retention across all orgs applies.
    placeholder: e.g. 90
    helper: Login attempt records older than this will be deleted.
