dsarPolicy:
  title: Data subject request governance
  description:
    Cooling-off window, dual-admin approval, and per-admin daily filing
    limit for GDPR Art. 17 erasure requests.
  coolingOffHours:
    label: Cooling-off window (hours)
    description:
      'Hours between filing a request and the cascade actually running.
      Any admin can cancel within this window. Set to 0 to execute
      immediately. Range: 0–72.'
  requireDualApproval:
    label: Require dual approval
    description:
      When enabled, every filed request must be approved by a second
      admin (the filer cannot approve their own request) before the
      cooling-off window starts. Recommended for high-stakes deployments with
      two or more admins.
  dailyLimitPerAdmin:
    label: Daily limit per admin
    description:
      'Maximum number of erasure requests a single admin may file per
      day. Caps blast radius from a compromised admin credential. Range:
      1–50.'
  saved: Data subject request governance updated.
  saveFailed: Couldn't save the policy. Try again.
  invalidCoolingOffHours: Cooling-off window must be a whole number between 0 and 72.
  invalidDailyLimit: Daily limit must be a whole number between 1 and 50.
  ownerOnlyNotice:
    Only the org owner can change this policy. Admins can read it.
    To weaken any safeguard (shorter cooling-off, disabling dual approval, or
    raising the daily limit), the change is staged for 24 hours so any admin
    can revert it.
  loosenProposedTitle: Change staged — 24h review window started
  loosenProposedDescription:
    Weakening changes apply after a 24-hour grace window.
    Any admin can cancel before then.
  loosenCancelledTitle: Pending change cancelled.
  pendingFieldLocked: Locked while review window is open
  pendingBanner:
    title: Pending policy weakening
    description: Proposed by {name}. Any admin can cancel before this takes effect.
    cancel: Cancel pending change
