visionModel:
  title: Vision model
  description:
    When an agent's own model cannot see images, any image it reads is
    transcribed by this model — through the gateway, so no provider key
    enters the sandbox. A model that already reads images never uses it.
  label: Model that reads images
  labelHint:
    Automatic suits most organizations. Pin one when you want the choice to
    stop following the provider catalog.
  automaticLabel: Automatic
  automaticHint: Let Tale choose from the models your credentials reach.
  resolved:
    pinned: 'Currently reading images with {model}.'
    preferred: 'Currently reading images with {model}, the recommended choice.'
    cheapest: 'Currently reading images with {model} — the cheapest model your
      credentials reach, since none of the recommended ones is available.'
  resolvedNone:
    No model your credentials reach can read images, so agents on a
    text-only model cannot either. Add a provider credential that serves a
    vision model.
  searchModels: Search models
  noModelsFound: No model that reads images is available
  saveFailed: Couldn't save the vision model
