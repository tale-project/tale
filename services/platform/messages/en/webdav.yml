  errorRateLimited: Too many app-passwords created recently. Try again later.
  savedTitle: Save this password — it will not be shown again.
  copy: Copy
  dismiss: I have saved it
list:
  title: App-passwords
  empty: No app-passwords yet.
  emptyDescription: Generate an app-password below to mount Tale documents as a network drive.
  label: Label
  prefix: Prefix
  lastUsed: Last used
  created: Created
  neverUsed: never
  revoked: revoked
  revoke: Revoke
  revokedToast: Revoked
  revokeError: Could not revoke
  revokeErrorNotFound: This app-password no longer exists.
revokeDialog:
  title: Revoke this app-password?
  body: Any device mounted with this password will be disconnected and active
