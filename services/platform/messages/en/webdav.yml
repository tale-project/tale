description: Mount Tale documents as a network drive in Finder, File Explorer,
  or any WebDAV client.
connectionDetails:
  title: Connection details
  usernameLabel: Username
  usernameHelp: Your Tale account email (or username)
  copyUsername: Copy username
  passwordLabel: Password
  passwordHelp: An app-password you generate below — not your account password.
create:
  title: Generate a new app-password
  description:
