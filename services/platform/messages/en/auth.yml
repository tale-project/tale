sso:
  errors:
    serverError: Single sign-on failed due to a server error. Try again, or contact your administrator if it keeps happening.
    multipleConnections:
      More than one organization uses single sign-on here. Enter
      your organization email address first, then try again.
    mfaRequired: Multi-factor authentication is required to sign in.
    conditionalAccessBlocked: Sign-in was blocked by a conditional-access policy.
    userNotAssigned:
      Your account is not assigned to this application. Contact your
      administrator to request access.
    notOrgMember:
      Your account is not a member of this organization. Ask an admin of
      this organization to invite you, then sign in again.
    flowMismatch:
      This sign-in did not finish in the browser it started in. Start the
      sign-in again from this page.
    assertionNotEncrypted:
      This organization requires encrypted SAML assertions, but the identity
      provider sent one in plain text. Ask your administrator to turn on
      assertion encryption in the identity provider.
    silentAuthFailed: Silent sign-in failed. Sign in manually instead.
    refreshTokenExpired: Your session expired. Sign in again.
    consentRequired: An admin needs to grant consent before you can sign in.
    redirectMismatch:
      The sign-in redirect URL does not match the one registered in
      Microsoft Entra ID. Ask your administrator to register the exact
      redirect URL.
    clientNotFound: The single sign-on application could not be found in the
      directory. Ask your administrator to check the client ID.
    invalidClientSecret:
      The single sign-on client secret is invalid or expired. Ask
      your administrator to update it.
    recovery:
      completeMfa: Complete the multi-factor prompt from your authenticator to continue.
      contactAdmin: Contact your administrator for access.
      signInInteractively: Try signing in again and complete any prompts.
      signInAgain: Sign in again to continue.
      grantConsent: An administrator must grant consent for this application.
  actions:
    tryAgain: Try again
    completeMfa: Complete multi-factor sign-in
    contactAdminMessage: Contact your administrator to resolve this.
  protocol:
    entra: Microsoft Entra ID
    oidc: Generic OIDC
    oauth2: OAuth2
    saml: SAML 2.0
