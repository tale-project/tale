visionModel:
  title: Modèle pour les images
  description:
    Quand le modèle d'un agent ne voit pas les images, c'est ce modèle qui
    les lit pour lui — via la passerelle, donc aucune clé de fournisseur
    n'entre dans le sandbox. Un modèle qui lit déjà les images ne s'en sert
    jamais.
  label: Modèle qui lit les images
  labelHint:
    Automatique convient à la plupart des organisations. Fixe-en un quand tu
    veux que ce choix cesse de suivre le catalogue du fournisseur.
  automaticLabel: Automatique
  automaticHint: Tale choisit parmi les modèles que tes accès atteignent.
  resolved:
    pinned: 'Les images sont lues par {model}.'
    preferred: 'Les images sont lues par {model}, le choix recommandé.'
    cheapest:
      "Les images sont lues par {model} — le modèle le moins cher que tes
      accès atteignent, aucun des modèles recommandés n'étant disponible."
  resolvedNone:
    Aucun modèle que tes accès atteignent ne lit les images ; les agents sur
    un modèle texte seul ne peuvent donc pas non plus. Ajoute un accès à un
    fournisseur qui sert un modèle capable de lire les images.
  searchModels: Rechercher des modèles
  noModelsFound: Aucun modèle capable de lire les images
  saveFailed: Échec de l'enregistrement du modèle pour les images
imageGeneration:
  title: Génération d'images
  description:
    Permet aux agents de projet qui traitent des tâches et aux nœuds agent
    des automatisations de créer des images, facturées à ton organisation.
    Désactivée tant que tu ne l'actives pas. Le chat ne crée jamais
    d'images.
  enabledLabel: Laisser les agents générer des images
  label: Modèle d'images
  labelHint:
    Automatique utilise le premier modèle d'images recommandé que tes accès
    fournisseurs atteignent. Un modèle fixé reste sélectionné jusqu'à ce que
    tu le changes, même s'il devient indisponible.
  automaticLabel: Automatique
  automaticHint: Tale choisit parmi les modèles d'images recommandés que tes accès atteignent.
  currentModel:
    pinned: 'Les agents génèrent actuellement les images avec {model}.'
    preferred: 'Les agents génèrent actuellement les images avec {model}, le choix recommandé.'
  draftHint: Enregistre pour appliquer cette sélection.
  noAvailable:
    "Aucun des modèles d'images recommandés n'est disponible : les agents
    n'ont donc pas d'outil pour les images. Ajoute un accès OpenRouter ou
    OpenAI dans Fournisseurs IA, ou choisis un des modèles proposés."
  unavailable:
    "Le modèle d'images enregistré est indisponible : les agents n'ont donc
    pas d'outil pour les images. Choisis un autre modèle ou Automatique, ou
    vérifie son accès fournisseur et les modèles qu'il autorise. Tale ne
    passera pas à un autre modèle tant que cette sélection est enregistrée."
  invalidPolicy:
    "La configuration enregistrée de la génération d'images est invalide :
    les agents n'ont donc pas d'outil pour les images. Désactive puis
    réactive la génération d'images, ou choisis un modèle et enregistre,
    pour la corriger."
  policyUnavailable:
    La configuration enregistrée de la génération d'images n'a pas pu être
    lue. Réessaie avant de la modifier. Les agents n'ont pas d'outil pour
    les images tant qu'elle reste illisible.
