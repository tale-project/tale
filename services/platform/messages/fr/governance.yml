twoFactorPolicy:
  title: Authentification à double facteur
  description: Exiger que tous les utilisateurs authentifiés par mot de passe
    activent un second facteur (TOTP) après une période de grâce.
  enforced: Exiger l'authentification à double facteur
  policyDisabledHint:
    L'authentification à double facteur reste facultative pour
    tous les utilisateurs tant que cette politique est désactivée.
  gracePeriodDays: Période de grâce (jours)
  gracePeriodDaysHint:
    Nombre de jours dont dispose chaque utilisateur à partir de
