      dépose la demande ne peut pas l'approuver elle-même."
dsarPolicy:
  title: Gouvernance des demandes des personnes concernées
  description: Délai de réflexion, approbation à double signature et limite
    quotidienne par admin pour les demandes d'effacement RGPD art. 17.
  coolingOffHours:
    label: Délai de réflexion (heures)
    description:
      "Heures entre le dépôt d'une demande et l'exécution effective de la
      cascade. Tout admin peut annuler dans cette fenêtre. 0 = exécution
      immédiate. Plage : 0–72."
  requireDualApproval:
    label: Exiger une approbation à double signature
    description:
      Lorsque activé, chaque demande déposée doit être approuvée par un
      second admin (la personne qui dépose ne peut pas approuver sa propre
      demande) avant le démarrage du délai de réflexion. Recommandé pour les
      déploiements à enjeux élevés avec deux admins ou plus.
  dailyLimitPerAdmin:
    label: Limite quotidienne par admin
    description:
      "Nombre maximal de demandes d'effacement qu'un admin peut déposer
      par jour. Limite l'impact d'identifiants admin compromis. Plage : 1–50."
  saved: Gouvernance des demandes mise à jour.
  saveFailed: Impossible d'enregistrer la politique. Réessaie.
  invalidCoolingOffHours: Le délai de réflexion doit être un nombre entier entre 0 et 72.
  invalidDailyLimit: La limite quotidienne doit être un nombre entier entre 1 et 50.
  ownerOnlyNotice: Seul le propriétaire de l'organisation peut modifier cette
    politique. Les admins peuvent la lire. Tout assouplissement (réduction du
    délai de réflexion, désactivation de la double approbation ou augmentation
    de la limite quotidienne) est différé pendant 24 heures pour qu'un admin
    puisse l'annuler.
  loosenProposedTitle: Modification mise en attente — fenêtre de revue de 24h démarrée
  loosenProposedDescription:
    Les modifications d'assouplissement prennent effet
    après un délai de grâce de 24 heures. Tout admin peut les annuler avant.
  loosenCancelledTitle: Modification en attente annulée.
  pendingFieldLocked: Verrouillé pendant la fenêtre de revue
  pendingBanner:
    title: Assouplissement de politique en attente
    description:
      Proposé par {name}. Tout admin peut l'annuler avant qu'il ne prenne
      effet.
    cancel: Annuler la modification en attente
