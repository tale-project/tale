enrollment:
  title: Authentification à double facteur
  description:
    Protège ton compte avec un code temporel généré par une application
    d'authentification.
  enabledHint: L'authentification à double facteur est active sur ton compte.
  requiredByOrg: Ton organisation exige l'authentification à double facteur.
    Active-la maintenant pour continuer.
  enableButton: Activer le double facteur
  disableButton: Désactiver
  regenerateButton: Régénérer les codes de secours
  enabled: Authentification à double facteur activée
  disabled: Authentification à double facteur désactivée
  passwordPromptDescription: Confirme ton mot de passe pour commencer la
    configuration de l'authentification à double facteur.
  disablePromptDescription: Confirme ton mot de passe pour désactiver
    l'authentification à double facteur.
  disableEnforcedWarning: Ton organisation exige l'authentification à double facteur. Si tu la désactives, tu devras la reconfigurer à ta prochaine connexion.
  regeneratePromptDescription: Confirme ton mot de passe. Générer de nouveaux
    codes invalide tous les codes de secours précédents.
passkeys:
  title: Passkeys
  description:
    Connecte-toi avec un passkey (Face ID, Touch ID, Windows Hello ou
    une clé de sécurité). Un passkey est résistant au phishing et satisfait
    l'exigence de double authentification de ton organisation.
  addButton: Ajouter un passkey
  revokeButton: Supprimer
  revokeConfirmTitle: Supprimer le passkey ?
  revokeConfirmDescription: Cela supprime « {name} » qui ne pourra plus être
    utilisé pour se connecter. S'il s'agissait de ton seul second facteur, il
    se peut que tu doives reconfigurer la double authentification.
  unnamed: Passkey
  registered: Passkey enregistré
  revoked: Passkey supprimé
  empty: Tu n'as pas encore ajouté de passkey.
  namePromptDescription:
    Donne un nom à ce passkey pour le reconnaître plus tard
    (p. ex. "Touch ID du MacBook").
  confirmPasswordDescription: Ta connexion remonte à un certain temps. Confirme ton mot de passe pour ajouter un passkey.
  signInAgainDescription: Ta connexion remonte à un certain temps. Reconnecte-toi, puis ajoute ton passkey.
  nameLabel: Nom du passkey
  namePlaceholder: Touch ID du MacBook
  attachment:
    label: Type d'authentificateur
    any: Indifférent (recommandé)
    platform: Cet appareil (Face ID, Touch ID, Windows Hello)
    crossPlatform: Clé de sécurité ou téléphone
  errors:
    registerFailed: Impossible d'enregistrer le passkey. Réessaie.
    revokeFailed: Impossible de supprimer le passkey. Réessaie.
    listFailed: Impossible de charger tes passkeys.
    refreshFailed: Impossible d'actualiser tes passkeys. La liste affichée n'est peut-être plus à jour.
    confirmFailed: Impossible de confirmer ton mot de passe. Réessaie.
setup:
  title: Configurer l'authentification à double facteur
  qrInstructions: Scanne le code QR avec une application d'authentification
    (Google Authenticator, 1Password, Authy), puis saisis le code à 6 chiffres
    ci-dessous.
  manualEntry: 'Ou saisis-le manuellement :'
  verifyCodeLabel: Code de vérification
  verifyButton: Vérifier et activer
backupCodes:
  title: Enregistre tes codes de secours
  description:
    Chaque code peut être utilisé une seule fois si tu perds l'accès à
    ton application d'authentification.
  warningOnce: Ces codes ne seront plus affichés. Télécharge-les ou copie-les maintenant.
  downloadButton: Télécharger
  doneButton: Terminé
  regenerated: Nouveaux codes de secours générés
confirmPassword:
  label: Mot de passe
  submit: Confirmer
  wrongPassword: Mot de passe incorrect. Après plusieurs échecs, ton compte est temporairement verrouillé.
verify:
  title: Vérifier ton identité
  description: Saisis le code à 6 chiffres de ton application d'authentification.
  backupDescription: Saisis l'un de tes codes de secours.
  codeLabel: Code d'authentification
  useBackupCodeToggle: Utiliser un code de secours à la place
  useAuthenticatorToggle: Utiliser l'application d'authentification à la place
  backupCodeLabel: Code de secours
  submitButton: Vérifier
  invalid: Code invalide ou expiré. Réessaie.
  tooManyAttempts: Trop de tentatives échouées. Réessaie plus tard.
  success: Connecté avec succès
  backupCodeSuccess: Code de secours utilisé. Pense à régénérer tes codes de
    secours dans les Paramètres.
  usePasskeyButton: Utiliser un passkey à la place
  passkeyFailed: Connexion par passkey échouée ou annulée. Réessaie ou utilise un code.
lowBackupCodes:
  body:
    Génère un nouveau lot afin de pouvoir récupérer ton compte en cas de perte
    de ton application d'authentification.
  regenerateLink: Régénérer maintenant
  titleOne: Il ne reste qu'1 code de secours
  titleOther: Il ne reste que {count} codes de secours
enroll:
  title: Double facteur requis
  description: Ton organisation exige l'authentification à double facteur pour continuer.
  usePasskeyButton: Enregistrer un passkey à la place
grace:
  body:
    Ton organisation exigera bientôt que tous les membres utilisent un second
    facteur. Active-le maintenant pour éviter toute interruption.
  setupLink: Configurer maintenant
  titleOne: Authentification à double facteur requise dans {days} jour
  titleOther: Authentification à double facteur requise dans {days} jours
admin:
  resetButton: Réinitialiser le double facteur
  confirmTitle: Réinitialiser l'authentification à double facteur ?
  confirmDescription:
    Cela désactive le double facteur pour {name} et met fin à
    toutes ses sessions actives. {name} devra se réinscrire lors de sa
    prochaine connexion.
  passkeys:
    title: Passkeys
    confirmTitle: Supprimer ce passkey ?
    confirmDescription:
      Cela supprime le passkey "{name}" et met fin à toutes les
      sessions actives du membre. Une nouvelle connexion sera nécessaire.
    deviceTypes:
      singleDevice: Clé liée à un appareil
      multiDevice: Passkey synchronisé
errors:
  enableFailed: Impossible de démarrer la configuration du double facteur. Réessaie.
  disableFailed: Échec de la désactivation de l'authentification à double facteur.
  regenerateFailed: Échec de la génération de nouveaux codes de secours.
  invalidCode: Code invalide ou expiré. Réessaie.
