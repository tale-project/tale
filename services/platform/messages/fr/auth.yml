sso:
  errors:
    serverError:
      L’authentification unique n’a pas pu aboutir en raison d’une erreur
      serveur. Réessaie, ou contacte ton administration si le problème
      persiste.
    multipleConnections:
      Plusieurs organisations utilisent l’authentification unique
      ici. Saisis d’abord l’adresse e-mail de ton organisation, puis réessaie.
    mfaRequired: Une authentification multifacteur est requise pour te connecter.
    conditionalAccessBlocked: La connexion a été bloquée par une stratégie d’accès conditionnel.
    userNotAssigned:
      Ton compte n’est pas affecté à cette application. Contacte ton
      administration pour demander l’accès.
    notOrgMember: Ton compte n’est pas membre de cette organisation. Demande à
      l’administration de cette organisation de t’inviter, puis
      reconnecte-toi.
    flowMismatch:
      Cette connexion ne s’est pas terminée dans le navigateur où elle a
      commencé. Relance-la depuis cette page.
    assertionNotEncrypted:
      Cette organisation exige des assertions SAML chiffrées, mais le
      fournisseur d’identité en a envoyé une en clair. Demande à ton
      administration d’activer le chiffrement des assertions côté
      fournisseur d’identité.
    silentAuthFailed: La connexion silencieuse a échoué. Connecte-toi de manière interactive.
    refreshTokenExpired: Ta session a expiré. Reconnecte-toi.
    consentRequired:
      Cette application nécessite le consentement d’un administrateur
      avant que tu puisses te connecter.
    redirectMismatch:
      L’URL de redirection de connexion ne correspond pas à celle
      enregistrée dans Microsoft Entra ID. Demande à ton administration
      d’enregistrer l’URL de redirection exacte.
    clientNotFound:
      L’application d’authentification unique est introuvable dans
      l’annuaire. Demande à ton administration de vérifier l’ID client.
    invalidClientSecret:
      Le secret client de l’authentification unique est invalide
      ou expiré. Demande à ton administration de le mettre à jour.
    recovery:
      completeMfa:
        Valide la demande multifacteur depuis ton authentificateur pour
        continuer.
      contactAdmin: Contacte ton administration pour obtenir l’accès.
      signInInteractively: Réessaie de te connecter et complète les éventuelles demandes.
      signInAgain: Reconnecte-toi pour continuer.
      grantConsent: Une administration doit accorder son consentement à cette application.
  actions:
    tryAgain: Réessayer
    completeMfa: Terminer la connexion multifacteur
    contactAdminMessage: Contacte ton administration pour résoudre ce problème.
  protocol:
    entra: Microsoft Entra ID
    oidc: OIDC générique
    oauth2: OAuth2
    saml: SAML 2.0
