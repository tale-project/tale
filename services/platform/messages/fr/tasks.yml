agentRun:
  automationDisabled: 'L’automatisation des tâches est désactivée. Demande à un administrateur de l’organisation de l’activer.'
  automationUnavailable: 'L’automatisation des tâches est indisponible. Demande à un administrateur de l’organisation de vérifier sa politique.'
  previousRun: 'Exécution précédente de {name}'
  label: Exécution
  started: L'agent s'y met — il rendra compte sur cette tâche pour relecture.
  alreadyRunning: L'agent de cette tâche tourne déjà.
  notStarted: L'exécution de l'agent n'a pas pu démarrer.
  agentMissing: L'agent assigné n'existe plus. Assigne un autre agent pour exécuter cette tâche.
  noAgentAssignee: Aucun agent n'est assigné à cette tâche. Assignes-en un pour lancer une exécution.
  cancelled: L'exécution de l'agent a été annulée.
  cancelFailed: L'exécution de l'agent n'a pas pu être annulée.
  start: Démarrer l'agent
  willStart: "Déposer ici démarre l'exécution de l'agent."
  willCancel: "Déposer ici annule l'exécution en cours de l'agent."
  # Un mot court par état — la ligne vit dans le panneau de propriétés,
  # à côté du libellé « Exécution » et du statut de la tâche.
  status:
    queued: En attente
    running: En cours…
    settled: Terminée
    failed: Échouée
    cancelled: Annulée
  # Remplace « En attente » tant que l'exécution attend de la place : un état
  # court par raison ; `unknown` est une attente sans raison enregistrée (le
  # plus souvent, un worker). L'exécution démarre d'elle-même dès que la
  # place se libère.
  waiting:
    org_limit: En attente d’un worker
    host: En attente de place
    destroy_pending: En attente d’un espace de travail
    exec_limit: En attente de sa sandbox
    unknown: En attente d’un worker
  # Ce que l'état court veut dire, affiché dessous pendant l'attente.
  waitingWhy:
    org_limit: Tous les workers d’agent de ton organisation sont occupés. L’exécution démarre d’elle-même dès que l’un d’eux se libère.
    host: L’hôte des sandboxes est plein ou manque de mémoire ou d’espace disque. L’exécution démarre d’elle-même dès qu’il y a de la place.
    destroy_pending: Un admin supprime l’espace de travail que cette exécution utiliserait. Elle démarre dans un nouvel espace une fois la suppression terminée.
    exec_limit: Sa sandbox termine encore un processus précédent. L’exécution démarre d’elle-même dans un instant.
    unknown: L’exécution démarre d’elle-même dès qu’il y a de la place pour elle.
  # Pour les owners et les admins, à côté de « Tous les workers d’agent … ».
  manageWorkers: Gérer les workers d’agent
  # Ligne sous le statut pendant que la plateforme relance elle-même une
  # exécution échouée — pour distinguer sa relance de la tienne.
  autoRetrying: 'Tentative automatique {n} sur {max}'
  # Remplace cette ligne quand le courtier a actualisé le jeton du compte
  # en cours d'exécution et que la plateforme la reprend — sans tentative
  # consommée.
  resumedAfterTokenRefresh: Reprise après l'actualisation du jeton
  retry: Relancer
  cancel: Annuler l'exécution
  notStartedYet: L’agent attend que tu le démarres.
  failureTitle: L’agent n’a pas pu terminer cette tâche
  reported: Ce que l’exécution a signalé
  logReadFailed: Le journal de l’agent n’a pas pu être chargé. Réessaie.
  runReadFailed: L’exécution de l’agent n’a pas pu être chargée. Réessaie.
  failure:
    budget: Une limite d’utilisation a arrêté cette exécution. Demande à un admin de la relever, puis relance l’agent.
    setup: Il manque quelque chose à cet agent — son modèle, l’un de ses skills ou l’agent lui-même. Un éditeur ou un admin peut corriger cela dans l’onglet Agents du projet.
    input: Une pièce jointe de cette tâche n’est plus dans le stockage — « Détails » indique laquelle. Retire-la de la tâche ou téléverse-la à nouveau, puis relance l’agent.
    time_limit: L’exécution a atteint sa limite de temps avant que l’agent ait terminé. Relance l’agent, ou découpe la tâche en tâches plus petites.
    capacity: L’exécution a attendu trop longtemps un worker libre. Relance l’agent quand moins d’agents seront occupés.
    model: Le modèle d’IA derrière cet agent a échoué avant la fin du travail. Relance l’agent — s’il échoue encore, demande à un admin de vérifier le fournisseur d’IA.
    start: L’exécution n’a pas pu démarrer. Réessaie — si elle échoue encore, montre à un admin ce que l’exécution a signalé dans « Détails ».
    interrupted: L’exécution a été interrompue avant que l’agent ait terminé. Relance l’agent.
    out_of_memory: La sandbox de l’agent a manqué de mémoire, son travail a donc été arrêté. Relance l’agent — si cela se reproduit, demande à un admin de donner plus de mémoire aux agents.
    stalled: L’agent ne répondait plus — il n’a rien affiché et n’a presque rien fait pendant longtemps —, sa sandbox l’a donc arrêté. Relance l’agent — s’il s’arrête encore, montre à un admin ce que l’exécution a signalé dans « Détails ».
    unknown: L’exécution a échoué. Relance l’agent — si elle échoue encore, montre à un admin ce que l’exécution a signalé dans « Détails ».
  standardAgent:
    switchedOff: L'agent standard de l'organisation est désactivé. Demande à un admin de l'activer dans Gouvernance.
    noModel: Aucun modèle que tu peux utiliser ne peut faire fonctionner l'agent standard. Demande à un admin de configurer un fournisseur IA ou de te donner accès à un modèle.
    pinUnavailable: Le modèle choisi pour l'agent standard ne t'est pas accessible. Demande à un admin d'en choisir un autre dans Gouvernance.
    harnessInvalid: L'environnement d'agent choisi pour l'agent standard n'est pas disponible. Demande à un admin d'en choisir un autre dans Gouvernance.
    unreadable: Les réglages de l'agent standard sont illisibles. Demande à un admin de les vérifier dans Gouvernance.
    notNeeded: Ce projet a ses propres agents. Assigne plutôt l'un d'eux.
