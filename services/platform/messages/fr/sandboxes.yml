  title: Supprimer la sandbox ?
  description: Cela supprime la sandbox et son espace de travail et annule les tâches en cours. Une fois la sandbox supprimée, le prochain lancement de l'agent en crée une nouvelle.
  confirm: Supprimer
toast:
  stopped: Tâche arrêtée
  pinned: Sandbox épinglée
  unpinned: Sandbox détachée
  destroying: Suppression de la sandbox en cours
  destroyingDescription: Elle disparaît de la liste dès que son espace de travail est supprimé.
  error: Échec de l'action
empty:
  title: Aucun espace de travail pour le moment
  description:
    L'espace de travail d'un agent de projet apparaît après sa première tâche. Il
    est conservé jusqu'au retrait de son agent, de son projet ou du membre
    concerné, ou jusqu'à ce que le nettoyage des espaces de travail le supprime
    faute d'utilisation. L'espace d'une exécution de workflow est récupéré à la
    fin de l'exécution. Les chiffres de capacité ci-dessus incluent les sessions
    temporaires d'exploration.
accessDenied: Tu as besoin d'un accès développeur ou admin pour gérer les sandboxes.
deletedAgent: Agent supprimé
devices:
  title: Appareils
  description:
    Exécute les sandboxes de ton organisation sur tes propres machines. Les
    nouveaux espaces de travail des agents et des automatisations démarrent sur
    un appareil connecté qui a de la place, sinon sur le serveur. Un espace de
    travail reste sur la machine où il a démarré.
  add: Ajouter un appareil
  columns:
    name: Appareil
    status: Statut
    sandboxes: Sandboxes
    machine: Machine
    version: Version
    lastSeen: Dernier contact
  status:
    online: En ligne
    updating: Mise à jour en cours
    outdated: Mise à jour requise
    update_failed: Échec de la mise à jour
    offline: Hors ligne
  platform: '{os} · {arch}'
  sandboxCount: '{used} / {limit}'
  lastSeenNow: Maintenant
  machine: '{cpus, plural, one {# processeur} other {# processeurs}} · {memory} Gio'
  updatingTo: 'Mise à jour vers {version}'
  updateFailedHint: La mise à jour vers {version} a échoué. L'appareil réessaie de lui-même.
  outdatedHint: Utilise une autre version que Tale ({version}). Exécute tale sandbox update sur la machine.
  empty:
    title: Aucun appareil pour l'instant
    description: Ajoute une machine Linux ou macOS avec Docker pour y exécuter les sandboxes de ton organisation.
  hub:
    notConfigured: Le service de sandbox de ce déploiement n'accepte pas d'appareils. Demande à ton opérateur d'activer le hub d'appareils.
    unavailable: Impossible de joindre le service de sandbox. L'état des appareils n'est peut-être pas à jour.
  actions:
    remove: Retirer
  removeConfirm:
    title: 'Retirer {name} ?'
    description:
      L'appareil cesse immédiatement d'exécuter des sandboxes pour ton
      organisation. Ses espaces de travail restent sur la machine mais ne sont
      plus accessibles depuis Tale.
    confirm: Retirer l'appareil
  toast:
    removed: Appareil retiré
    error: Impossible de retirer l'appareil
  addDialog:
    title: Ajouter un appareil
    description:
      Exécute cette commande dans un terminal sur la machine à ajouter. Elle
      installe la CLI Tale et connecte la machine à ton organisation.
    commandLabel: Installer et connecter
    copyCommand: Copier la commande
