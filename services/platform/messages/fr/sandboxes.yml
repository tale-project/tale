title: Sandboxes
sessionsTitle: Espaces de travail
description: >-
  Les agents de projet réutilisent leur espace entre les tâches. Les étapes
  d'un workflow partagent le même espace. L'espace d'un agent de projet est
  conservé jusqu'au retrait de son agent, de son projet ou du membre concerné,
  ou jusqu'à ce que le nettoyage des espaces de travail le supprime faute
  d'utilisation. L'état d'exécution et l'allocation
  du quota sont distincts : un conteneur peut rester actif après la libération
  de son allocation.
limits:
  title: Limites de l'organisation
  description:
    Fixe le nombre de sessions que chaque type de travail peut utiliser à la fois.
    Les sessions occupent le quota au démarrage et pendant le travail.
    Le total se recalcule automatiquement et ne doit pas dépasser la capacité
    du déploiement.
  usage: 'Allouées : {used} / {limit}'
  usageUnavailable: Allocation indisponible
  invalidSessions: Saisis un nombre entier entre 1 et 500.
  total: Total des sessions de ton organisation
  totalValue: '{total} / {maxSessions}'
  totalHint: Somme des trois limites / capacité du déploiement. Les autres organisations partagent cette capacité.
  totalHintWithDevices: Somme des trois limites / capacité du déploiement plus les {deviceSessions} sandboxes de tes appareils. Les autres organisations partagent la capacité du déploiement.
  totalExceedsDeployment: Le total de {total} sessions dépasse la capacité du déploiement de {maxSessions}. Réduis au moins une limite pour enregistrer.
  totalExceedsCapacity: 'Le total de {total} sessions dépasse la capacité de {maxSessions} : {deploymentSessions} dans le déploiement et {deviceSessions} sur tes appareils. Réduis au moins une limite pour enregistrer.'
  capacityUnavailable: La capacité du déploiement est indisponible. Tu peux abaisser les limites ; actualise les données de l'infrastructure avant d'en augmenter une.
  capacityLoading: Vérification de la capacité du déploiement…
  saveFailed: Impossible d'enregistrer les limites des sandboxes
quota:
  budgets:
    project: Sessions d'agent de projet
    workflow: Sessions de workflow
    render: Sessions de rendu
  budgetHints:
    project: Les agents de projet réutilisent une sandbox entre leurs tâches.
    workflow: Les étapes agent et script partagent une sandbox par exécution de workflow.
    render: Des sandboxes temporaires rendent les pages pendant l'exploration des sites.
cleanup:
  title: Nettoyage des espaces de travail
  description:
    Les agents de projet gardent leurs fichiers dans des espaces de travail
    entre deux exécutions. Un espace de travail est supprimé immédiatement quand
    son agent, son projet ou le membre concerné est retiré. Les espaces de
    travail sous conservation légale ne sont pas supprimés.
  deleteUnused: Supprimer les espaces de travail inutilisés
  deleteUnusedHint: Supprime un espace de travail après le nombre de jours sans utilisation indiqué ci-dessous. Les espaces de travail épinglés sont conservés.
  unusedDays: Jours sans utilisation
  unusedDaysHint: Les jours se comptent à partir de la dernière fois que l'agent a travaillé dans l'espace de travail. Quand tu actives la suppression ou que tu raccourcis la période, aucun espace de travail n'est supprimé avant que ce nombre de jours ne se soit entièrement écoulé.
  invalidDays: Saisis un nombre entier entre 1 et 3650.
  loadFailed: Impossible de charger les paramètres de nettoyage des espaces de travail. Recharge la page pour réessayer.
  saveFailed: Impossible d'enregistrer les paramètres de nettoyage des espaces de travail
capacity:
  title: Capacité de l'infrastructure
  description: >-
    Environnements réellement actifs et ressources mesurées sur l'hôte.
    Ces chiffres peuvent différer des allocations : un environnement peut
    rester actif après la fin d'une tâche.
  refresh: Actualiser
  hostSessions: Sandboxes du déploiement
  namespaceSessions: Sandboxes du déploiement (namespace)
  organizationSessions: Sandboxes de ton organisation
  slots: '{used} / {limit}'
  sessionStates: '{running} actives · {starting} au démarrage'
  sessionSlotsHint: Actuellement actives ou au démarrage / capacité du déploiement, partagée par toutes les organisations.
  organizationSessionsHint: Actuellement actives ou au démarrage, y compris les sandboxes inactives conservées pour être réutilisées.
  cpu: Utilisation du CPU de l'hôte
  cpuUsage: '{used} / {total} cœurs'
  cpuHint: Mesure sur l'ensemble des processus de l'hôte.
  memory: Mémoire de l'hôte utilisée
  memoryUsage: '{used} / {total} Gio'
  memoryHint: Mémoire utilisée et totale de l'hôte, y compris les autres services.
  unknownValue: Indisponible
  operatorLimits:
    Toutes les organisations partagent la capacité fixée par l'opérateur.
    Une place libre ne garantit pas assez de CPU ou de mémoire pour une nouvelle sandbox.
  observedAt: 'Relevé : {time}'
  scopes:
    host: Ensemble de l'hôte
    namespace: Namespace Kubernetes ; mesures des ressources de l'hôte indisponibles
  notConfigured: Ce déploiement n'a pas d'infrastructure de sandbox configurée.
  unreachable: Impossible d'actualiser les données de l'infrastructure. L'état d'exécution et les ressources utilisées sont inconnus.
