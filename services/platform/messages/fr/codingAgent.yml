  waiting: En attente de la connexion de ton agent…
  connected: 'Connecté : {client}'
prompt:
  label: Demande ensuite à ton agent
  labelConnected: Essaie d’abord ceci
  replace: Remplace la partie entre crochets avant d’envoyer le prompt.
  general: Utilise le serveur MCP tale. Appelle d’abord get_docs, puis liste mes automatisations avec list_automations et dis-moi ce que tu peux faire dans cet espace de travail. Demande-moi avant de mettre quoi que ce soit en service ou de modifier un paramètre.
  edit: Utilise le serveur MCP tale. Appelle get_docs, puis ouvre l’automatisation {name} avec get_automation. [Décris la modification voulue.] Vérifie-la avec validate_automation et teste-la avec test_automation avant de l’enregistrer comme nouvelle version avec save_automation. Demande-moi avant de la mettre en service.
