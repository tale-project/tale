  orgKnowledge:
    title: Base de connaissances
    description:
      La base Postgres qui contient le corpus de connaissances de cette
      organisation pour la recherche et la récupération.
    statusDefault: Défaut du déploiement
    readOnlyBody:
      Des permissions Admin sont requises pour modifier l'emplacement du
      corpus de connaissances de cette organisation.
    note: Désactivée, les connaissances de cette organisation restent dans la
      base intégrée du déploiement, isolées par organisation. Activée, le
      corpus vit dans la base ci-dessus — une base vide est préparée
      automatiquement, mais les entrées indexées avant le changement ne
      migrent pas avec elle.
    cleared: Connexion supprimée — la recherche de connaissances de cette
      organisation utilise à nouveau la base intégrée du déploiement.
    clearConfirm:
      title: Supprimer la connexion à la base de connaissances ?
      description:
        La recherche de connaissances de cette organisation repasse par la
        base intégrée du déploiement. Les entrées déjà écrites dans ta base y
        restent, mais Tale ne peut plus les lire tant que la connexion n'est
        pas rétablie.
      confirm: Supprimer la connexion
    errors:
      readFailed: 'Impossible de charger la connexion enregistrée : {error}'
      hostRequired: Saisis l'hôte de la base de données.
      hostInvalid: Uniquement lettres, chiffres, points, tirets, deux-points et crochets.
      portInvalid: Saisis un port entre 1 et 65535.
      databaseRequired: Saisis le nom de la base de données.
      userRequired: Saisis l'utilisateur de la base de données.
  orgEmbedding:
    title: Modèle d'embedding
    description:
      Le modèle qui transforme les documents et les requêtes de cette
      organisation en vecteurs pour la recherche de connaissances — requis
      avant toute recherche, quelle que soit la base.
    statusConfigured: Configuré
    statusNotConfigured: Non configuré
    statusCredentialMissing: Identifiants manquants
    credentialMissingWarning: >-
      Les identifiants que ce modèle d'embedding utilise n'existent plus ;
      l'indexation des documents et la recherche de connaissances sont
      arrêtées. Ajoute ou rétablis des identifiants sous Paramètres →
      Fournisseurs IA, ou choisis-en d'autres ici et enregistre.
    notConfiguredWarning:
      La recherche de connaissances est indisponible tant qu'aucun modèle
      d'embedding n'est configuré.
    banner:
      title: La recherche de connaissances est coupée
      body: Cette organisation a un fournisseur IA mais aucun modèle
        d'embedding, donc les documents ne peuvent pas être indexés, et ni
        les documents ni les sites web ne peuvent être cherchés.
      link: Choisir un modèle d'embedding
    recommendationBody:
      Ton identifiant {provider} peut servir {model} (vecteurs à {dimensions}
      dimensions).
    recommendationApply: Utiliser ce modèle
    readOnlyBody:
      Des permissions Admin sont requises pour modifier le modèle d'embedding
      de cette organisation.
    noCredentials:
      Aucun identifiant de fournisseur IA n'est encore stocké — ajoutes-en un
      dans Paramètres → Fournisseurs IA pour choisir un fournisseur ici.
    provider: Fournisseur
    providerPlaceholder: Choisis un fournisseur
    credential: Identifiants
    credentialDefault: Défaut du fournisseur
    credentialHint:
      Les identifiants stockés qui autorisent les appels d'embedding ; par
      défaut, ceux du fournisseur.
    model: Modèle
    modelHint: Le tag du modèle exactement comme le fournisseur l'écrit.
    modelCatalogHint: Modèles d’embedding du catalogue du fournisseur.
    modelCatalogCustomHint:
      Modèles d’embedding de la liste de ce fournisseur ; choisis « Autre modèle »
      pour saisir un tag qui n’y figure pas.
    modelUncuratedHint:
      Tale ne connaît aucune largeur de vecteurs pour {provider}. Saisis le
      tag du modèle (ou le nom de ton déploiement) et la largeur des vecteurs
      que ce modèle produit.
    modelUnsupportedHint:
      '{provider} ne propose aucun modèle d’embedding. Choisis un fournisseur
      qui en sert un.'
    modelUnsupported: Ne propose pas d’embeddings
    modelCatalogUnavailableHint:
      Le catalogue de {provider} n’a pas pu être chargé. Actualise les
      catalogues sous Paramètres → Fournisseurs IA, puis réessaie.
    modelUnavailable: Catalogue indisponible
    modelUncheckedHint:
      Tale n’a pas pu vérifier si {provider} propose des embeddings ; aucun
      modèle ne peut donc encore être choisi. Utilise « Réessayer » ci-dessus.
    modelUnchecked: Vérification impossible
    supportReadFailed:
      Tale n’a pas pu vérifier quels fournisseurs proposent des embeddings.
      Aucun modèle ne peut être choisi tant que la vérification n’a pas
      répondu.
    supportReadRetry: Réessayer
    modelPlaceholder: Choisis un modèle
    modelCustom: Autre modèle…
    modelTag: Tag du modèle
    dimensions: Largeur des vecteurs
    dimensionsHint:
      "Déclarée, jamais devinée : le nombre exact de dimensions que produit
      ce modèle, parmi {widths}. Après un changement, les documents et les
      pages de sites déjà indexés reçoivent de nouveaux vecteurs à la
      nouvelle largeur."
    baseUrl: URL de base
    baseUrlHint: Endpoint compatible OpenAI ; vide pour celui du fournisseur.
    removed: Modèle d'embedding supprimé — la recherche de connaissances est
      indisponible tant qu'un nouveau modèle n'est pas configuré.
    removeConfirm:
      title: Supprimer le modèle d'embedding ?
      description:
        La recherche de connaissances de cette organisation ne fonctionne
        plus tant qu'un nouveau modèle d'embedding n'est pas configuré. Les
        vecteurs déjà écrits restent dans le corpus.
      confirm: Supprimer le modèle
    errors:
      readFailed: "Impossible de charger la configuration d'embedding enregistrée : {error}"
      invalid: Les paramètres d'embedding sont invalides. Vérifie les champs et réessaie.
      providerRequired: Choisis un fournisseur.
      modelRequired: Saisis le tag du modèle.
      dimensionsInvalid: 'Saisis une largeur de vecteurs prise en charge : {widths}.'
      baseUrlInvalid: Saisis une URL http(s), ou laisse le champ vide.
      credentialNotFound: Les identifiants choisis n'existent plus — choisis-en d'autres.
      credentialMismatch: Les identifiants choisis appartiennent à un autre fournisseur.
      credentialDisabled: Les identifiants choisis sont désactivés — réactive-les ou choisis-en d'autres.
      providerUnsupported: Ce fournisseur ne propose aucun modèle d’embedding — choisis un fournisseur qui en sert un.
  orgStorage:
    title: Stockage d'objets
    description:
      Le bucket compatible S3 qui contient les fichiers téléversés de
      cette organisation — documents, pièces jointes, audio et médias générés.
    statusDefault: Défaut du déploiement
    readOnlyBody:
      Des permissions Admin sont requises pour modifier l'emplacement de
      stockage des fichiers de cette organisation.
    bucket: Bucket
    prefix: Préfixe de clé
    prefixHint:
      Espace de noms optionnel dans le bucket ; vide, les objets sont
      stockés à la racine.
    credentialsHint:
      Écriture seule — les clés stockées ne sont jamais affichées.
      Saisis les deux clés, ou laisse-les vides pour tester les clés
      enregistrées.
    verified: Bucket vérifié (écriture, lecture, suppression)
    corsNote:
      "Les téléversements et les téléchargements passent directement du
      navigateur à ton bucket : le bucket doit donc accepter les requêtes
      cross-origin (CORS) depuis {origin} — autorise cette origine avec les
      méthodes GET, PUT et HEAD et tous les en-têtes de requête. Le test de
      connexion s'exécute côté serveur et ne peut pas le vérifier."
    note:
      Désactivé, les fichiers de cette organisation restent dans le stockage
      intégré du déploiement, isolés par organisation. Activé, les nouveaux
      téléversements vont dans le bucket ci-dessus ; les fichiers stockés
      avant le changement restent lisibles là où ils sont.
    cleared:
      Connexion supprimée — les nouveaux téléversements retournent dans le
      stockage intégré du déploiement. Les fichiers déjà dans ton bucket y
      restent, mais Tale ne peut plus les lire tant que tu ne rétablis pas la
      connexion.
    clearConfirm:
      title: Supprimer la connexion au stockage d'objets ?
      description:
        Les nouveaux téléversements de cette organisation retournent dans
        le stockage intégré du déploiement. Les fichiers déjà écrits dans ton
        bucket y restent, mais Tale ne peut plus les lire tant que la
        connexion n'est pas rétablie.
      confirm: Supprimer la connexion
    backfill:
      start: Déplacer les fichiers existants
      description:
        Copie les fichiers stockés avant le changement depuis le stockage
        intégré du déploiement vers ton bucket, pour que tout vive au même
        endroit. S'exécute en arrière-plan ; les téléversements continuent
        pendant ce temps.
      confirm:
        title: Déplacer les fichiers existants vers ton bucket ?
        description:
          Les fichiers que cette organisation a stockés dans le stockage
          intégré du déploiement sont copiés dans ton bucket et servis depuis
          là. L'opération s'exécute en arrière-plan et peut prendre du temps
          pour de gros volumes.
        confirm: Déplacer les fichiers
      status:
        running: 'Déplacement en cours… {migrated} déplacés, {failed} en échec.'
        completed: 'Terminé — {migrated} fichiers déplacés, {failed} en échec.'
        completedDry: 'Essai à blanc — {candidates} fichiers seraient déplacés.'
        failed: "Le déplacement s'est arrêté sur une erreur : {error}"
      errors:
        alreadyRunning: Un déplacement est déjà en cours — attends qu'il se termine.
        notConfigured: Enregistre la connexion au bucket avant de déplacer les fichiers existants.
    errors:
      forbidden:
        Tu n'es pas autorisé à gérer la résidence des données de cette
        organisation.
      invalidConnection:
        Les paramètres de connexion sont invalides. Vérifie les
        champs et réessaie.
      credentialsPair: Saisis l'Access Key ID et la Secret Access Key ensemble.
      credentialsRequired:
        Saisis une Access Key ID et une Secret Access Key — elles
        sont requises à la première configuration du stockage d'objets.
      readFailed: 'Impossible de charger la connexion enregistrée : {error}'
      regionRequired: Saisis la région du bucket.
      endpointInvalid: Saisis une URL http(s), ou laisse vide pour AWS.
      bucketRequired: Saisis le nom du bucket.
