mcpEndpoint:
  title: Endpoint MCP
  description: Branche n'importe quel client MCP sur ce déploiement pour
    créer, exécuter et gérer des automatisations — et pour accéder aux
    capacités et aux connaissances de cette organisation.
  copyEndpoint: Copier l'URL de l'endpoint MCP
  organizationReadFailed: Les informations de l'organisation n'ont pas pu être chargées ; la requête d'exemple n'est pas disponible.
  organizationReadRetry: Réessayer
  authHelp:
    "Authentifie-toi avec une clé API REST en jeton Bearer. Une clé
    appartient à la personne qui l'a créée et fonctionne dans chaque
    organisation dont elle est membre ; celle-ci est nommée par l'en-tête
    X-Organization-Slug. Tu crées et gères les clés sous"
  authLink: Clés API REST.
  orgSlug:
    title: Slug de l'organisation
    description: Si le détenteur de la clé appartient à plusieurs
      organisations, chaque requête doit nommer celle-ci — envoie cette
      valeur dans l'en-tête X-Organization-Slug. Une clé à organisation
      unique peut s'en passer.
    copy: Copier le slug de l'organisation
  tools:
    authoring:
      title: Écriture
      description: Travailler le document d'automatisation — rédiger,
        valider, tester, enregistrer, déployer. get_docs enseigne la
        grammaire.
    management:
      title: Gestion des exécutions & déclencheurs
      description: Piloter ce qui est déployé — lancer et suivre les
        exécutions, parcourir les versions, poser et retirer les
        déclencheurs.
    discovery:
      title: Découverte
      description: Consulter ce qu'une automatisation peut nommer — modèles,
        environnements d'agent, skills, connectors, noms de secrets, projets
        et événements.
    capability:
      title: Capacités & connaissances
      description: La surface propre à l'organisation — chercher ce qu'elle
        sait faire, invoquer une capacité, récupérer des connaissances.
  exampleTitle: Essaie
  exampleHelp:
    Liste les outils — remplace par ta clé API ; X-Organization-Slug
    est déjà renseigné.
  copyExample: Copier la requête d'exemple
modelEndpoints:
  title: Endpoints de modèles
  description: Utilise les modèles de l'organisation depuis tes propres
    outils — opencode, Claude Code, les SDK OpenAI et Anthropic — avec une
    clé API personnelle.
  loadFailed: Impossible de charger l'état des endpoints de modèles.
  governanceNote: Chaque appel est décompté de tes budgets et passe par les
    garde-fous d'entrée de l'organisation ; les réponses des modèles ne sont
    pas filtrées.
  disabled:
    title: Les endpoints de modèles ne sont pas activés pour ton organisation
    description: Un admin les active sous Paramètres → Gouvernance →
      Modèles → Accès aux modèles.
    openPolicy: Ouvrir l'accès aux modèles
  forbidden:
    title: Ton rôle ne peut pas appeler les endpoints de modèles
    description: Les propriétaires, les admins et les développeurs le
      peuvent. Demande à un admin de t'attribuer la compétence « Appeler les
      modèles par l'API ».
  openaiUrl:
    label: URL de base compatible OpenAI
    description: Pour les SDK OpenAI, opencode et les autres clients
      compatibles OpenAI, qui ajoutent /chat/completions.
    copy: Copier l'URL de base compatible OpenAI
  anthropicUrl:
    label: URL de base compatible Anthropic
    description: Pour Claude Code (ANTHROPIC_BASE_URL) et les SDK
      Anthropic, qui ajoutent /v1/messages.
    copy: Copier l'URL de base compatible Anthropic
  apiKey:
    label: Clé API
    description: Envoie une clé API personnelle en jeton Bearer dans
      l'en-tête Authorization. Tu crées les clés sous
    link: Clés API REST.
  orgSlug:
    label: Slug de l'organisation
    description: Envoie-le dans l'en-tête X-Organization-Slug quand ta clé
      appartient à plus d'une organisation.
    copy: Copier le slug de l'organisation
  models:
    label: Modèles que tu peux appeler
    description: Utilise ces identifiants comme nom de modèle sur les deux
      endpoints. Ton accès aux modèles décide de la liste.
    empty: Aucun modèle ne t'est encore disponible. Un admin connecte les
      fournisseurs et décide de l'accès aux modèles.
    copy: Copier l'identifiant de modèle {id}
  opencode:
    title: opencode
    description: Ajoute le fournisseur à opencode.json. La clé vient de la
      variable d'environnement TALE_API_KEY.
    copy: Copier la configuration opencode
  claudeCode:
    title: Claude Code
    description: Définis ces variables avant de lancer claude. Laisse
      ANTHROPIC_API_KEY non définie — Tale refuse l'en-tête qu'elle envoie.
    copy: Copier les variables Claude Code
  openaiSdk:
    title: SDK OpenAI (Python)
    description: Pointe le client vers Tale. Le streaming, les outils et les
      images fonctionnent comme avec OpenAI.
    copy: Copier l'exemple du SDK OpenAI
