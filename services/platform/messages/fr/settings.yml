      d'autres applications, et Anthropic les refuse depuis tout client
      autre que Claude Code. Le chat ne peut pas utiliser ces identifiants.
      Pour discuter avec ces modèles, ajoute des identifiants par clé API
      ou variable d'environnement pour ce fournisseur.
