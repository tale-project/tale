    deleteConfirm: 'Déplacer tous tes chats de cette organisation dans la corbeille, y compris les chats archivés et les chats de projet. Tu pourras les restaurer pendant le délai de conservation. Les chats sous conservation légale ou avec une réponse en cours restent inchangés.'
