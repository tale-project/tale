title: Environnement
description:
  Identifiants chiffrés que les agents de ce projet peuvent utiliser.
  Les valeurs ne sont jamais affichées après l'enregistrement.
agentAccessTitle: Accessible aux agents
agentAccessBody: Les runtimes d'agents (par ex. Hermes, OpenClaw) peuvent
  utiliser ces secrets lorsqu'ils exécutent des tâches pour ce projet — par
  exemple pour se connecter à des services externes en ton nom. Les valeurs
  sont injectées à l'exécution et ne sont jamais montrées au modèle de chat ni
  affichées dans l'interface.
errors:
  accessDeniedTitle: Accès administrateur requis
  PROJECT_FORBIDDEN: Tu n'as pas accès aux secrets de ce projet. Seuls les
    administrateurs du projet peuvent les consulter ou les gérer.
  PROJECT_NOT_FOUND: Ce projet n'existe plus.
  loadFailed: "Impossible de charger les secrets de ce projet."
  refreshFailed: "Impossible d'actualiser les secrets de ce projet. L'affichage n'est peut-être plus à jour."
