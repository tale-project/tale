title: Environnement
description:
  Identifiants chiffrés stockés pour ce projet. Ils ne sont actuellement pas
  transmis aux exécutions d'agents. Accorde l'accès à un agent via ses
  autorisations Secrets. Les valeurs ne sont jamais affichées après
  l'enregistrement.
agentAccessTitle: Stockés pour le projet
agentAccessBody: Ces identifiants sont stockés pour le projet, mais ne sont
  actuellement pas transmis aux exécutions d'agents. Accorde l'accès à un
  agent via ses autorisations Secrets. Les valeurs ne sont jamais montrées au
  modèle de chat ni affichées dans l'interface.
errors:
  accessDeniedTitle: Accès administrateur requis
  PROJECT_FORBIDDEN: Tu n'as pas accès aux secrets de ce projet. Seuls les
    administrateurs du projet peuvent les consulter ou les gérer.
  PROJECT_NOT_FOUND: Ce projet n'existe plus.
  loadFailed: "Impossible de charger les secrets de ce projet."
  refreshFailed: "Impossible d'actualiser les secrets de ce projet. L'affichage n'est peut-être plus à jour."
  SECRET_NAME_INVALID: Les noms de secrets doivent commencer par une majuscule et contenir uniquement des majuscules, chiffres ou tirets bas (64 caractères maximum).
