    title: Mot de passe modifié
    description: Utilise ton nouveau mot de passe lors de ta prochaine connexion.
  passwordSet:
    title: Mot de passe défini
    description: Tu peux maintenant te connecter avec ton mot de passe.
  newMemberCreated:
    title: Membre ajouté
    description: Le nouveau membre a été créé et ajouté à ton organisation.
  existingUserAdded:
    title: Membre ajouté
    description: L'utilisateur a été ajouté à ton organisation.
