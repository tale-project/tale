          s1:
            Dans la console Google Cloud, ouvrez API et services › Identifiants › Créer
            des identifiants › ID client OAuth.
          s2: Choisissez le type d'application « Application Web ».
          s3:
            Sous URI de redirection autorisés, ajoutez l'URL de redirection affichée
            ci-dessus et enregistrez.
          s4:
            Copiez l'ID client et le secret client affichés en haut de la page du
            client.
          s5:
            Saisissez-les ci-dessus avec l'URL de l'émetteur https://accounts.google.com
            — les points de terminaison sont détectés automatiquement.
          groupsNote: "Remarque : l'OIDC standard de Google ne renvoie pas les
            appartenances aux groupes — la synchronisation groupe→équipe
            nécessite l'Admin SDK / l'API Cloud Identity avec un administrateur
            Workspace. Les autres fournisseurs OIDC (Okta, Auth0, Keycloak)
            fonctionnent de la même manière : saisissez l'URL de l'émetteur et
            les identifiants client."
        oauth2:
          intro:
            Pour les fournisseurs sans découverte OIDC, configurez les points de
            terminaison manuellement.
          s1:
            Enregistrez une application Web/OAuth2 chez votre fournisseur et ajoutez
            l'URL de redirection affichée ci-dessus.
          s2: Copiez l'ID client et le secret client.
          s3:
            Saisissez les URL des points de terminaison d'autorisation, de jeton et
            userinfo depuis la documentation de votre fournisseur.
          s4:
            Si votre fournisseur utilise des noms de claims non standard, mappez
            e-mail/nom/groupes sous « Avancé ».
        saml:
          intro:
            Configurez une application SAML 2.0 dans votre IdP, puis saisissez ses
            informations ci-dessous.
          s1: Dans votre IdP, créez une nouvelle application SAML 2.0.
          s2:
            Définissez l'URL ACS (Assertion Consumer Service) et l'Entity ID / Audience
            avec les valeurs SP affichées ci-dessus, ou importez l'URL des
            métadonnées SP.
          s3: Définissez le format du Name ID sur adresse e-mail.
          s4:
            Copiez l'Entity ID de l'IdP, l'URL de connexion de l'IdP et le certificat de
            signature de l'IdP (PEM) dans les champs ci-dessus.
          s5:
            Mappez les attributs e-mail, nom et groupe dans votre IdP ; si leurs noms
            diffèrent, indiquez les noms d'attributs correspondants sous «
            Avancé ».
