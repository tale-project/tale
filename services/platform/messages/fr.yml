      note: Désactivée, les connaissances de cette organisation restent dans la
        base intégrée du déploiement, isolées par organisation. Activée, le
        corpus vit dans la base ci-dessus — une base vide est préparée
        automatiquement, mais les entrées indexées avant le changement ne
        migrent pas avec elle.
