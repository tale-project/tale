          ticket RH #4711'
        confirmLabel: Tape {phrase} pour confirmer
        confirmDescription:
          Requis pour chaque demande d'effacement. Le bouton d'envoi
          reste désactivé tant que la phrase ne correspond pas exactement.
        submit: Déposer la demande
      extendDeadline:
        title: Prolonger le délai art. 12(3)
        description:
          Ajoute jusqu'à 60 jours à la fenêtre de réponse. La prolongation
          elle-même doit être communiquée à la personne dans le mois initial,
          avec motifs (art. 12(3)). Chaque demande ne peut être prolongée qu'une
          seule fois.
        extraDaysLabel: Jours supplémentaires ({min}–{max})
        extraDaysDescription: Jours entiers ajoutés au délai initial de 30 jours.
        extraDaysError: Saisis un nombre entier entre {min} et {max}.
        extensionReasonLabel: Motif de prolongation
        extensionReasonPlaceholder:
          ex. Revue juridique transfrontalière — le conseil
          demande deux semaines de plus
        submit: Accorder la prolongation
      retry:
        title: Réessayer l'effacement
        description:
          Réexécute la cascade pour cette demande. À utiliser après avoir
          levé une rétention bloquante ou corrigé la cause de l'échec précédent.
        confirm: Réessayer
      cancel:
        title: Annuler la demande d'effacement
        description:
          Annule cette demande avant son exécution. Le reçu reste comme trace
          de l'annulation, mais aucune donnée n'est supprimée. L'annulation
          n'est possible que pendant le délai de réflexion.
