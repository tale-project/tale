      title: Conversations externes
      description:
        Boîte de réception de canal contact de haut niveau (intégrations
        email/chat). Cascade vers les corps de messages.
    chatFilterEvents:
      title: Événements chat-filter
      description:
        Télémétrie des déclencheurs de filtre de contenu (PII, profanité,
        règles personnalisées). Utile pour ajuster le filtre ; contient des
        extraits de messages cités.
      placeholder: ex. 90
      helper: Les lignes de télémétrie de filtre plus anciennes seront supprimées.
    notifications:
      title: Notifications
      description: Notifications in-app (mentions, résultats d'agent, alertes
        système). Peuvent référencer du contenu de chats, documents ou
        exécutions de workflow.
      placeholder: ex. 30
      helper: Les notifications plus anciennes seront supprimées.
    chatHistory:
      title: Historique de chat
      description:
        Supprime automatiquement les conversations avec les agents (threads
        de chat) plus anciennes que la période de rétention. Le contenu des
        messages dans le composant agent est archivé. La suppression est
        irréversible.
      placeholder: ex. 90
      helper:
        Les conversations plus anciennes (selon la dernière mise à jour) seront
        supprimées.
    documents:
      title: Rétention des documents
      description:
        Supprime automatiquement les documents qui dépassent la période de
        rétention. À utiliser avec précaution — les documents supprimés ne
        peuvent pas être récupérés.
      placeholder: ex. 90
      helper: Les documents plus anciens seront supprimés.
    userTemp:
      title: Nettoyage des fichiers temporaires utilisateur
      description: Supprime automatiquement les fichiers téléversés par les
        utilisateurs mais jamais enregistrés dans un document (ex. pièces
        jointes de chat, téléversements interrompus).
      placeholder: ex. 24
      helper: Les fichiers temporaires plus anciens seront supprimés.
    agentTemp:
      title: Nettoyage des fichiers temporaires d'agent
      description:
        Supprime automatiquement les fichiers générés par les agents mais
        jamais enregistrés dans un document (ex. résultats intermédiaires,
        fichiers de connaissances).
      placeholder: ex. 24
      helper: Les fichiers temporaires plus anciens seront supprimés.
    workflowLogs:
      title: Journaux d'exécution de workflow
      description: Supprime automatiquement les enregistrements d'exécution de
        workflow plus anciens que la période de rétention. Inclut les blobs de
        stockage de variables/sorties par exécution.
      placeholder: ex. 30
      helper:
        Les exécutions de workflow plus anciennes seront supprimées (1 à 365
        jours).
    auditLogs:
      title: Journaux d'audit
      description: "Supprime automatiquement les entrées du journal d'audit plus
        anciennes que la période de rétention. Remarque : les journaux d'audit
        sont des enregistrements historiques immuables utilisés pour la
        conformité ; garde une rétention suffisamment longue pour satisfaire tes
        exigences d'audit ou de conformité."
      placeholder: ex. 90
      helper:
        Les entrées du journal d'audit plus anciennes seront supprimées (30 à
        365 jours).
    usageLedger:
      title: Registre d'utilisation
      description:
        "Supprime automatiquement les lignes du registre d'utilisation des
        tokens plus anciennes que la période de rétention. Attention :
        raccourcir cette rétention tronque les analyses historiques (les budgets
        et les rapports s'appuient sur ces lignes)."
      placeholder: ex. 365
      helper:
        Les lignes du registre d'utilisation plus anciennes seront supprimées
        (30 à 3650 jours).
    loginAttempts:
      title: Tentatives de connexion
      description: "Supprime automatiquement les enregistrements de suivi des
        connexions échouées (loginAttempts, compteurs de blocage par heure) plus
        anciens que la période de rétention. Remarque : ces tables s'appliquent
        à l'ensemble du déploiement — la valeur la plus stricte (la plus courte)
        parmi toutes les organisations est utilisée."
      placeholder: ex. 90
      helper: Les enregistrements de tentatives de connexion plus anciens seront
        supprimés (7 à 365 jours).
