          s3:
            Sous URI de redirection, sélectionnez la plateforme « Web », collez l'URL de
            redirection affichée ci-dessus, puis cliquez sur Inscrire.
          s4:
            Sur la page Vue d'ensemble, copiez l'ID d'application (client) et l'ID de
            répertoire (locataire). L'URL de l'émetteur est
            https://login.microsoftonline.com/{tenant-id}/v2.0.
          s5:
            Allez dans Certificats et secrets › Nouveau secret client et copiez la
            Valeur du secret (pas son ID).
          s6:
            Saisissez l'ID client, le secret client et l'URL de l'émetteur dans les
            champs ci-dessus.
          s7:
            Pour la synchronisation groupe→équipe, ajoutez l'autorisation Microsoft
            Graph GroupMember.Read.All sous Autorisations d'API et accordez le
            consentement administrateur.
          s8:
            Pour la synchronisation de documents OneDrive/SharePoint, ajoute les
            autorisations Microsoft Graph Files.Read et Sites.Read.All sous
            Autorisations d'API et accorde le consentement administrateur. Si tu
            veux uniquement la connexion, retire ces deux scopes du champ Scopes
            ci-dessus.
