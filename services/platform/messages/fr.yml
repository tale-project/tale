      title: Historique de chat
      description:
        Supprime automatiquement les conversations avec les agents (threads
        de chat) plus anciennes que la période de rétention. Le contenu des
        messages dans le composant agent est archivé. La suppression est
        irréversible.
      placeholder: ex. 90
      helper:
        Les conversations plus anciennes (selon la dernière mise à jour) seront
        supprimées.
    documents:
      title: Rétention des documents
      description:
        Supprime automatiquement les documents qui dépassent la période de
        rétention. À utiliser avec précaution — les documents supprimés ne
        peuvent pas être récupérés.
      placeholder: ex. 90
      helper: Les documents plus anciens seront supprimés.
    userTemp:
      title: Nettoyage des fichiers temporaires utilisateur
      description: Supprime automatiquement les fichiers téléversés par les
        utilisateurs mais jamais enregistrés dans un document (ex. pièces
        jointes de chat, téléversements interrompus).
      placeholder: ex. 24
      helper: Les fichiers temporaires plus anciens seront supprimés.
    agentTemp:
      title: Nettoyage des fichiers temporaires d'agent
      description:
        Supprime automatiquement les fichiers générés par les agents mais
        jamais enregistrés dans un document (ex. résultats intermédiaires,
        fichiers de connaissances).
      placeholder: ex. 24
      helper: Les fichiers temporaires plus anciens seront supprimés.
