<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta http-equiv="refresh" content="2" />
    <title>Tale — updating…</title>
    <style>
      /* Inline copy of the platform's `:root` / `.dark` tokens (see
         packages/ui/src/globals.css) so this static shell matches the app
         shell — and the sibling offline.html — without a JS runtime. Brand
         accent is the dark-zinc / off-white pair from `--color-accent-base`
         / `--color-accent-fg`. */
      :root {
        --bg-base: #fcfcfc;
        --bg-muted: #f4f4f5;
        --fg-base: #09090b;
        --fg-muted: #71717a;
        --border: #e4e4e7;
        --accent-base: #030712;
        --accent-fg: #ffffff;
        --destructive: hsl(0 84.2% 60.2%);
        --success: hsl(155 92% 24%);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-base: #09090b;
          --bg-muted: rgba(255, 255, 255, 0.06);
          --fg-base: #fafafa;
          --fg-muted: hsl(218 11% 65%);
          --border: #27272a;
          --accent-base: #ffffff;
          --accent-fg: #030712;
          --destructive: hsl(0 91% 71%);
          --success: hsl(155 85% 35%);
          color-scheme: dark;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: var(--bg-base);
        color: var(--fg-base);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: max(env(safe-area-inset-top, 0px) + 1.5rem, 2rem) 1.5rem
          max(env(safe-area-inset-bottom, 0px) + 1.5rem, 2rem);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .container {
        text-align: center;
        max-width: 24rem;
        width: 100%;
      }

      .icon-wrapper {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 9999px;
        background: var(--bg-muted);
        color: var(--fg-muted);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-wrapper svg {
        width: 2rem;
        height: 2rem;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.2;
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--fg-muted);
        margin-bottom: 1.5rem;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.375rem 0.875rem;
        border-radius: 9999px;
        background: var(--bg-muted);
        color: var(--fg-muted);
        font-size: 0.875rem;
        line-height: 1.25;
        font-weight: 500;
      }

      .status-indicator {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: var(--accent-base);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .icon-wrapper svg,
        .status-indicator {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="icon-wrapper" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
      </div>

      <h1>Updating Tale</h1>
      <p>
        This usually takes a few seconds. The page will refresh automatically.
      </p>

      <div class="status" role="status" aria-live="polite">
        <span class="status-indicator" aria-hidden="true"></span>
        <span>Updating…</span>
      </div>
    </main>
  </body>
</html>
