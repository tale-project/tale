# The read-only Docker API proxy: role docker-api of the proxy image
# (tale-proxy). Traefik's Docker provider reads the services' labels through
# it and nothing else: it answers the reads that provider makes and refuses
# every other request, so the socket it holds is never Traefik's.
#
# A socket mounted read-only restricts nothing (the API is a protocol on
# it), so this allowlist is the boundary. The workers run as root because
# they must open the socket; the service publishes no port and shares its
# network only with the edge.
daemon off;
user root;
worker_processes 1;
pid /tmp/docker-api.pid;
error_log stderr warn;
load_module modules/ngx_http_js_module.so;

events {
  worker_connections 256;
}

http {
  server_tokens off;
  client_body_temp_path /tmp/docker-api-body;
  proxy_temp_path /tmp/docker-api-proxy;
  fastcgi_temp_path /tmp/docker-api-fastcgi;
  uwsgi_temp_path /tmp/docker-api-uwsgi;
  scgi_temp_path /tmp/docker-api-scgi;
  log_format refused '$remote_addr "$request" $status';
  map $status $docker_api_refused { 403 1; default 0; }
  access_log /dev/stdout refused if=$docker_api_refused;

  js_path /usr/share/tale-proxy/docker-api;
  js_import strip from strip-env.js;

  # What Traefik's Docker provider calls (v3.7, measured): the ping, the
  # version, the container list and one container's inspect, and the event
  # stream — with or without an API version prefix, GET or HEAD only.
  map $request_method $docker_api_method {
    GET 1;
    HEAD 1;
    default 0;
  }
  map $request_uri $docker_api_path {
    default 0;
    "~^/(v1\.[0-9]+/)?(_ping|version|events|containers/json|containers/[A-Za-z0-9][A-Za-z0-9_.-]*/json)(\?[^#]*)?$" 1;
  }
  map "$docker_api_method$docker_api_path" $docker_api_allowed {
    11 1;
    default 0;
  }

  server {
    listen 2375;
    default_type application/json;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Answers are filtered as plain JSON: never let the daemon compress one.
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    # The event stream stays open as long as Traefik runs.
    proxy_read_timeout 24h;

    location ~ ^/(v1\.[0-9]+/)?containers/[^/]+/json$ {
      if ($docker_api_allowed = 0) {
        return 403 '{"message":"refused by the Docker API proxy"}\n';
      }
      js_header_filter strip.headers;
      js_body_filter strip.body buffer_type=buffer;
      proxy_pass http://unix:/var/run/docker.sock:;
    }

    location / {
      if ($docker_api_allowed = 0) {
        return 403 '{"message":"refused by the Docker API proxy"}\n';
      }
      proxy_pass http://unix:/var/run/docker.sock:;
    }
  }
}
