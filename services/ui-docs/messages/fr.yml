    éléments de navigation avec @tale/ui. Relie les composants à tes propres
    données et règles métier.
  appPackageLink: Voir les composants applicatifs
  marketingPackageTitle: Sites publics
  marketingPackageDescription: 'Crée des pages de présentation avec
