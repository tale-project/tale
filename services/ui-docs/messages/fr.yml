  sectionsTitle: La suite
  sectionsDescription: Choisis un guide pour configurer les paquets, prendre une décision de conception ou construire ton écran.
  sectionsGettingStarted: Installe les paquets, comprends leur articulation et configure les thèmes et les traductions.
  sectionsFoundations: Choisis les couleurs, la typographie, les espacements et les icônes, puis vérifie l’accessibilité.
  sectionsComponents: Choisis les états des composants et relie leurs propriétés, leurs fonctions de rappel et leurs noms accessibles.
  sectionsPatterns: Compose des listes et des pages de paramètres avec recherche, brouillons et gestion de l’enregistrement.
  sectionsMarketingUi: Utilise la navigation, les composants marketing et les cadres d’illustration pour construire un site public.
  installTitle: L’installer dans ton propre dépôt
  installDescription: Les paquets fournissent du code source TypeScript. Essaie une branche snapshot, puis fixe un tag de version et enregistre le fichier de verrouillage dans Git pour obtenir une installation reproductible.
  installCodeLabel: package.json
  installDocsLink: Lire le guide d’installation
