home:
  faq:
    byoModels:
      a: Nein. Du kannst eigene Modelle mitbringen, musst es aber nicht. Tale
        unterstützt die meisten grossen KI-Anbieter ohne Aufschlag —
        Cloud-Modellnutzung wird zu den Tarifen deines Anbieters abgerechnet und
        ist nicht in den Plänen enthalten.
    onPrem:
      a: Tale kann auf deiner Infrastruktur mit lokalen Modellen laufen. Für einen
        Offline-Betrieb brauchst du auch lokale Abhängigkeiten und begrenzte
        ausgehende Verbindungen. Aktivierte Cloud-Modelle, externe Werkzeuge und
        Konnektoren können Daten nach aussen senden; Selbsthosting macht sie
        nicht automatisch lokal.
  demos:
    arena:
      replyA3: Schliesse mit dem Link zur Eskalations-Richtlinie, den der Kontakt
        intern teilen kann.
  tagline:
    pillars:
      selfHosted:
        title: Standardmässig selbst gehostet

