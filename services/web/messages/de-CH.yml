platformAutomations:
  capabilities:
    items:
      - title: Gespeicherte Versionen und Bereitstellung
        body: Speichere Änderungen als neue Workflow-Version. Stelle die Version für
          künftige Live-Läufe bereit. Laufende Ausführungen behalten ihre
          Startversion.
        docsLabel: Konzepte der Automatisierung
      - title: Typisierte Workflow-Schritte
        body: Verbinde Modellaufrufe, Agentenarbeit in Sandboxes, Datentransformationen,
          Unterautomatisierungen und angebundene Aktionen. Ergänze Bedingungen
          oder Wiederholungen, wo sie unterstützt werden.
        docsLabel: Workflow-Editor
      - title: Trigger, die zur Aufgabe passen
        body: Zeitpläne (Cron), Webhooks, Plattform-Events oder ein manueller Testlauf
          aus dem Editor.
        docsLabel: Trigger
      - title: Ausführungs-Logs
        body: Prüfe Status, Eingaben, Ausgaben und Schrittverlauf eines Laufs. Die
          erfassten Connector-Aktionen helfen dir nachzuvollziehen, was passiert
          ist.
        docsLabel: Ausführungs-Logs
      - title: Freigaben im Loop
        body: Connector-Regeln können geschützte Schreibzugriffe bis zur Freigabe
          anhalten. Ein Agentenschritt kann ausserdem eine Person nach fehlenden
          Informationen fragen, bevor er fortfährt.
        docsLabel: Konzepte der Automatisierung
