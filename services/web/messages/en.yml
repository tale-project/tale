platformAutomations:
  eyebrow: Automations
  title: What are Automations in Tale?
  description: Automations make recurring project work repeatable. Connect model calls,
    agent steps and actions into a versioned workflow, test it, and run it
    manually or through a configured trigger.
  capabilities:
    heading: Define and repeat the process
    description:
      Keep the steps, saved versions, triggers and run history together so the
      team can inspect how recurring work is performed.
    items:
      - title: Saved versions and deployment
        body:
          Save a new version when the workflow changes. Deploy the version
          that future live runs should use; existing runs keep the version
          they started with.
        docsLabel: Automation concepts
      - title: Typed workflow steps
        body:
          Combine model calls, sandboxed agent work, data transformations,
          subautomations and connected actions. Add conditions or iteration
          where supported.
        docsLabel: Workflow editor
      - title: Triggers that fit the job
        body:
          Schedules (cron), webhooks, platform events, or a manual test run from the
          editor.
        docsLabel: Triggers
      - title: Execution logs
        body:
          Inspect a run’s status, inputs, outputs and step trace. Review
          recorded connector effects when checking what happened.
        docsLabel: Execution logs
      - title: Approvals in the loop
        body:
          Connector policies can pause protected writes for approval. An agent
          step can also ask a person for missing information before
          continuing.
        docsLabel: Automation concepts
  faq:
    heading: Automations FAQ
    items:
      - q: What is an automation in Tale?
        a: An automation defines a repeatable workflow with inputs, steps and
          outputs. Saved versions, deployment, triggers and run history let
          your team test and operate that process.
      - q: Is there a standalone workflow product?
        a:
          No. A workflow lives inside its automation. The automation's Editor tab is
          where you meet the graph.
      - q: When should I use an automation instead of an agent?
        a:
          Use an automation for repeatable steps, conditions, schedules or
          connected actions. Use a project agent when a task needs an outcome
          that you will review. An automation can include agent work.
      - q: Can I test a workflow before it runs on a schedule?
        a:
          Yes. Test a saved version before deploying it or enabling a trigger.
          Mock runs simulate connector operations; live runs can affect
          connected systems and may require approval.
  docs:
    - label: Automation concepts
      path: /platform/automations/concepts
    - label: Workflow editor
      path: /platform/automations/editor
    - label: Triggers
      path: /platform/automations/triggers
    - label: Execution logs
      path: /platform/automations/execution-logs
    - label: Built-in automations
      path: /platform/automations/builtin
  tour:
    heading: How automations run in Tale
    description:
      Define the process, choose the steps and data it needs, and inspect each
      run. Configure approval policies for protected connector writes.
    stages:
      - id: govern
        eyebrow: Approvals
        title: |-
          Human-in-the-loop
          before it ships
        description:
          When policy requires approval, a connector write waits for a person.
          Approval lets the run attempt the action; rejection blocks it.
      - id: agents
        eyebrow: Agents
        title: |-
          Give an agent
          a workflow step
        description:
          Configure an agent step with its own runtime, model, instructions
          and equipment. Use a model call when a single response is enough.
      - id: knowledge
        eyebrow: Knowledge
        title: |-
          Supply the sources
          the process needs
        description:
          Add knowledge retrieval or stage reference files where the workflow
          needs them. Pass the results to later steps and inspect their
          outputs.
      - id: projects
        eyebrow: Projects
        title: |-
          Scope workflows
          by workspace
        description:
          Bind an automation to the projects where it belongs. Project access
          and the tools granted to each step determine what it can reach.
  demos:
