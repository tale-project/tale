platformAutomations:
  eyebrow: Automations
  title: What are Automations in Tale?
  description: An automation bundles connectors, agents, a workflow, and the
    views it ships — an Inbox, for example — into one installable unit. The
    workflow inside is a graph of typed steps — LLM, Action, Condition, Loop,
    Sandbox — with schedules, webhooks, events, and human approvals.
  capabilities:
    heading: What ships in an automation?
    description:
      Compose multi-step work as a typed graph — LLM, action, condition,
      loop, and sandbox steps — with approvals and versioned runs.
    items:
      - title: Installable bundles
        body:
          Owners and Admins install from the catalog; Members use the Inbox, agents,
          or views it registers without assembling pieces by hand.
        docsLabel: Automation concepts
      - title: Typed workflow steps
        body:
          LLM, Action, Condition, Loop, and Sandbox steps compose the graph. Every
          save snapshots a version you can restore.
        docsLabel: Workflow editor
      - title: Triggers that fit the job
        body:
          Schedules (cron), webhooks, platform events, or a manual test run from the
          editor.
        docsLabel: Triggers
      - title: Execution logs
        body:
          Every run records status, timing, inputs, and a per-step journal — audit
          trail and debugger in one place.
        docsLabel: Execution logs
      - title: Approvals in the loop
        body:
          Proposed workflow edits, agent-started runs, and waiting-for-input pauses
          land as approval cards before work continues.
        docsLabel: Approvals in workflows
  faq:
    heading: Automations FAQ
    items:
      - q: What is an automation in Tale?
        a: A Tale automation is an installable bundle — connectors, agents, a
          workflow, and ready-made views like an Inbox — that runs multi-step
          work with triggers and approvals.
      - q: Is there a standalone workflow product?
        a:
          No. A workflow lives inside its automation. The automation's Editor tab is
          where you meet the graph.
      - q: When should I use an automation instead of an agent?
        a:
          Use an automation when the job needs multiple steps, branches, schedules, or
          approvals between them — not when a single conversational agent is
          enough.
      - q: Can I test a workflow before it runs on a schedule?
        a:
          Yes. The editor has a manual test run — you watch a complete execution with
          inputs, a per-step journal, and timing before any trigger goes live.
  docs:
    - label: Automation concepts
