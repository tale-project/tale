        title: |-
          Keep the discussion
          with the work
        description:
          Use project chats for shared context and choose which conversations
          to share with project members. Tasks, files, and instructions stay
          in the same project.
      - id: agents
        eyebrow: Project agents
        title: |-
          Give the next task
          to the right agent
        description:
          Choose a project agent for the work that follows your conversation.
