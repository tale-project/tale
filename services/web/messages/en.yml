  title: Chats in Tale
  description: 'Chat is the everyday entry point: pick an agent (or none), type,
    and a reply streams back with citations, tool calls, and optional Arena
    comparisons — the surface every other platform module feeds.'
  capabilities:
    heading: What does Chat include?
