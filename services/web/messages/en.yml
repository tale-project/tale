  tour:
    title: From a shared task to a reviewed result
    subtitle:
      Give work an owner, give agents the context to act, and keep your
      teammates involved as the project moves forward.
    connect:
      eyebrow: Agents & connectors
      title: |-
        Delegate tasks
        to your agents
      description:
        Assign tasks to specialist agents with their own instructions and
        tools. Equip a manager agent to delegate ready work, while agents run
        in persistent sandboxes within the capacity you configure.
    pool:
      eyebrow: Knowledge
      title: |-
        Give agents
        the project context
      description:
        Project files, standing instructions, and shared knowledge keep work
        grounded in your company’s information. Check retrieved sources and
        carry useful context into the next task.
    delegate:
      eyebrow: Automations
      title: |-
        Make recurring work
        repeatable
      description:
        Connect agent steps, conditions, and actions into workflows for
        recurring tasks. Start them manually or through configured triggers,
        then inspect each run.
    govern:
      eyebrow: Approvals & audit
      title: |-
        Review the result.
        Decide what happens next.
      description:
        Review task deliverables with your team. Configure review policies and
        connector approvals, inspect run history, and manage access and usage
        as your agent fleet grows.
    arena:
      eyebrow: Chat Arena
      title: |-
        Compare models
        on the same prompt
      description:
        Arena runs one question through two models side by side. Pick the
        reply that fits — without leaving the thread or retyping the ask.
    projects:
      eyebrow: Projects
      title: |-
        Plan the work
        with your team
      description: Bring teammates, tasks, files, and conversations into a project.
        Assign work to a person or an agent and follow its progress on the
        board.
    explore: Explore {module}
  tagline:
    eyebrow: Your workspace, your choice
    title: Your Infrastructure. Your Data. Your Rules.
    subtitle:
      Choose where your workspace runs and which models your agents use.
    pillars:
      selfHosted:
        title: Self-hosted by default
        description:
          Run Tale on your own infrastructure or choose managed hosting. Local
          models keep inference local; external providers, connectors, and
          tools follow the connections you configure.
      security:
        title: Security built in
        description: Manage members, roles, single sign-on, budgets, and configured
          guardrails in the same product. Use audit records and run history to
          investigate what happened.
      openSource:
        title: Fully open source
        description:
          The entire codebase is public under the MIT license. Read it, audit
          it, change what you need — without asking anyone.
  connectors:
    title: Plugged into the tools you already run
    subtitle:
      Connect the services your projects depend on. Configure credentials
      once, then grant the access agents and workflows need for their work.
  agents:
    title: Your agents, your choice
    subtitle: Use your preferred runtime with your own credentials or API-billed models.
  compliance:
    eyebrow: SECURITY
    title: Support for your deployment
    independent:
      title: Independent & Transparent
      description: Swiss-based and vendor-neutral — no ties to a cloud or model
        provider, so your deployment answers only to you.
    certified:
      title: ISO 27001-certified services
      description:
        Ruler GmbH is ISO 27001 certified. The scope covers Tale Enterprise
        and professional services. Ask us for the certificate and scope
        relevant to your deployment.
  faq:
    eyebrow: FAQ
    title: Frequently Asked Questions
    stillQuestions: Still have questions?
    contactTeam: Contact the team
    whatIsTale:
      q: What is Tale?
      a:
        Tale is an open-source project workspace for teams and AI agents. Plan
        tasks with teammates, delegate work to agents, and review the results
        in the same place. It combines task boards, agent sandboxes, shared
        knowledge, and workflows. Self-hosting and private models are
        available when you need them.
    openSource:
      q: Is Tale open source?
      a: Yes. Tale is MIT-licensed and the full feature set ships in the free
        Community edition — Enterprise adds support and services, not features.
    onPrem:
      q: Can Tale run fully on-premises or air-gapped?
      a:
        Tale can run on your own infrastructure with local models. An offline
        deployment also needs local dependencies and restricted outbound
        connections. Cloud models, external tools, and connectors can send
        data outside your network when enabled; self-hosting alone does not
        make them local.
    enterprisePricing:
      q: How does Enterprise pricing work?
      a:
        Enterprise is billed per user/month, with two months free when paying yearly.
        Storage beyond the included quota is billed per TB/month. The Community
        edition stays free for self-hosted use.
    enterpriseFeatures:
      q: Are there additional features in the Enterprise plan?
      a: No. All product features are available in the open source version too.
        Enterprise adds extended support and services.
    byoModels:
      q: Do I have to bring my own AI models?
      a:
        No. You can bring your own models, but it's not required. Tale supports most
        major AI providers without markup — cloud model usage is billed at your
        provider's rates and is not included in the plans.
    aiProviders:
      q: Can I use my preferred AI provider?
      a:
        Yes. Tale supports the major cloud AI providers without markup — usage is
        billed at your provider's rates, so you keep your vendor and your
        existing billing.
    hardware:
      q: Do you also provide hardware?
      a:
        Yes — hardware is available on rental, leasing, or purchase terms. Mention it
        when you contact the team and you'll get a quote for the configuration
        that fits.
    ownHardwareModels:
      q: Can I use my own hardware and AI models?
      a: Yes. Run Tale on your own infrastructure and connect a local model
        server, such as Ollama or vLLM, through a supported API. Check the
        deployment requirements and test the model with your chosen agent
        runtime before assigning work.
    customTraining:
      q: Do you offer custom AI model training?
      a:
        Yes. Custom model training and fine-tuning are available for clients. Bring
        it up in the demo call if you need it.
    whoFor:
      q: Who is Tale for?
      a: Tale is for teams that want to organize work for AI agents and
        collaborate with them. Technical members configure agents, tools, and
        repository access; other teammates can describe tasks, discuss
        progress, and review results. Use it for software projects, marketing
        campaigns, research, reports, or recurring operational work. What an
        agent can do depends on its tools and permissions.
    agentSubscriptions:
      q: Can I use my existing agent subscription?
      a: Yes, when the agent runtime supports that subscription. Bring your own token
        or supported login credential and choose the matching runtime. You can
        also use API-backed models. Subscription calls follow the provider’s
        limits and bypass Tale’s gateway metering and spending caps; check
        that usage with the provider.
  cta:
    title: Bring your next project to Tale
    description:
      Start a self-hosted workspace or bring a real task to a demo. See how
      your team and AI agents can work through it together.
