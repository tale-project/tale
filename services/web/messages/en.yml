        body:
          Switch agents mid-thread, run one-shot specialists, or keep a sticky agent
          for the conversation.
        docsLabel: Agents in chat
  faq:
    heading: Chat FAQ
    items:
      - q: What is Chat in Tale?
        a:
          Tale Chat is the everyday surface where you pick an agent, send a message,
          and read a streamed reply with citations and tool calls.
      - q: Does Chat work without an agent?
        a:
          Yes. Raw chat uses the model's defaults when you are exploring; reach for an
          agent when the same question will recur.
      - q: What is Arena mode?
        a:
          Arena mode runs the same prompt against more than one model or agent so you
          can compare replies before you choose.
      - q: Can Chat take actions, or only answer?
        a:
          Both. When a reply would call a connector or start a workflow, the action
          pauses on an in-chat approval card first — right where the work is
          happening.
