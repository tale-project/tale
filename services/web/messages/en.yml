platformAgents:
  eyebrow: Agents
  title: What are agents in Tale?
  description: A Tale agent is the four-knob combination of instructions,
    knowledge, tools, and a model. Editors build them once; the team runs them
    in chat, automations, and projects — on harnesses like Claude Code, Codex,
    Hermes, and OpenClaw when the work needs a coding CLI in a sandbox.
  capabilities:
    heading: What can agents do?
    description:
      What one agent definition gives the whole team — and what it adds
      beyond a bare model.
    items:
      - title: Four knobs, one unit
        body:
          Instructions, knowledge, tools, and model define how an agent behaves.
          Change one knob without re-training anything.
        docsLabel: Agent concepts
      - title: Harnesses dock in
        body:
          Bind Claude Code, Codex, Hermes, and OpenClaw as the harness a project
          agent or automation agent node runs on.
        docsLabel: Harnesses
      - title: Delegation between agents
        body:
          Specialist agents hand work to each other when a thread leaves one domain
          — without losing the transcript.
        docsLabel: Agent workers
      - title: Skills as reusable bundles
        body:
          Package a writing voice or multi-step pattern once and bind it to up to
          ten agents.
        docsLabel: Agent skills
      - title: Knowledge scoped per agent
        body:
          Each agent searches only the library slices you grant — team docs stay
          invisible outside the team.
        docsLabel: Agent knowledge
  faq:
    heading: Agents FAQ
    items:
      - q: What is an agent in Tale?
        a:
          A Tale agent combines instructions, knowledge, tools, and a model into one
          reusable unit that Members run in chat and automations.
      - q: Can Tale orchestrate Claude Code and Hermes?
        a:
          Yes. Claude Code, Codex, Hermes, and OpenClaw ship as harnesses — bind
          one when you create a project agent or an automation agent node.
      - q: When should I use an agent instead of a workflow?
        a:
          Use an agent when the conversation stays in one domain and voice. Reach for
          an automation when the work needs multiple steps, branches, schedules,
          or approvals.
      - q: Can each agent use a different model?
        a:
          Yes. Every agent binds its own primary model and fallbacks — Claude Code can
          run on Claude Opus while a support specialist runs Claude Sonnet. Swap
          the model without rebuilding the agent.
  docs:
    - label: Agent concepts
      path: /platform/agents/concepts
