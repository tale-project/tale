seo:
  ogImageAlt: Tale logo
  home:
    title: "Tale: Project Workspace for Teams and AI Agents"
    description: Plan projects, delegate tasks to AI agents, and review results with your
      team. An open-source workspace with agent sandboxes, shared context, and
      workflows.
  pricing:
    title: How much does Tale cost? — Community & Enterprise
    description:
      Tale Enterprise is CHF 12 (EUR 14) per user/month, two months free
      on yearly billing. Community is free to self-host under MIT.
  contact:
    title: Contact the Tale team — sales, support, demos
    description:
      "Talk to the Tale team about coordinating teammates and AI agents:
      project workflows, deployment, pricing, or a guided demo."
  about:
    title: Who is behind Tale? — About Ruler GmbH
    description: Tale is built by Ruler GmbH in Spiez, Switzerland. We build an
      MIT-licensed project workspace where teams coordinate AI agents and
      review their work.
  requestDemo:
    title: Request a Tale demo — a guided walkthrough
    description:
      Bring a task your team needs to solve. See how Tale coordinates
      teammates and AI agents through project boards, sandbox work, and
      review.
  hardwarePricing:
    title: What does Tale AI hardware cost?
    description:
      Silent inference hardware from single nodes to racks — rent, lease,
      or buy. Deploy on-site with remote maintenance, or host in secure data
      centers.
  platform:
    title: AI Agent Coordination and Project Management | Tale
    description: Bring people, AI agents, tasks, and project files into one workspace.
      See how Tale connects task boards, agent sandboxes, knowledge, and
      repeatable workflows.
  platformAgents:
    title: AI Agents for Project Tasks | Tale
    description:
      Give project agents instructions, tools, and a runtime such as Claude
      Code or Codex. Assign tasks, inspect sandbox files, and review what the
      agents deliver.
  platformChat:
    title: AI chat with sources and task handoff | Tale
    description: Ask questions, inspect sources, compare two models in Arena, and turn a
      conversation into a project task for an AI agent in Tale.
  platformAutomations:
    title: Repeatable AI Agent Workflows | Tale
    description: Turn recurring work into workflows with agent steps, conditions,
      connectors, and configured approvals. Start runs manually or with
      schedules and webhooks.
  platformKnowledge:
    title: Shared Knowledge for AI Project Work | Tale
    description:
      Give AI work the context it needs. Index documents, websites, and
      knowledge entries, retrieve accessible sources, and check citations in
      the same workspace.
  platformGovernance:
    title: AI governance, approvals and usage controls | Tale
    description:
      Configure connector approvals, review recorded actions, set model usage
      budgets, and apply chat guardrails for your team and AI agents in Tale.
  platformProjects:
    title: Shared Task Boards for Teams and AI Agents | Tale
    description:
      Plan work with teammates and AI agents on a shared project board. Keep
      tasks, files, conversations, and reviews together from the first request
      to the result.
  changelog:
    title: What's new in Tale? — Changelog
    description: Release notes for every Tale version, newest first — the
      features, fixes, and breaking changes in each one, published from GitHub
      Releases.
