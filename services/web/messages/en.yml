platformGovernance:
  eyebrow: Governance
  title: Set the rules for your team and agents
  description: Control access, configure connector approvals, and review recorded
    actions. Set model usage budgets and chat filters for the work your team
    and agents carry out.
  capabilities:
    heading: What does governance cover?
    description: Choose which connector writes need approval, which tools agents may use,
      and which content and usage rules apply.
    items:
      - title: Approve connector writes
        body:
          Automation connector writes pause when your policy requires
          approval. External writes require it by default; reads and internal
          platform writes follow different rules.
        docsLabel: Approval concepts
      - title: Inspect the proposed operation
        body:
          Review the destination and exact input before approving. Reject an
          incorrect operation, fix the workflow or input, and start a new run.
        docsLabel: Approval concepts
      - title: Read the audit trail
        body:
          Inspect recorded actions and approval decisions with their actor and
          time. Use the audit log to investigate what happened.
        docsLabel: Audit logs
      - title: Set organization rules
        body:
          Configure shared instructions, access policies, and agent tool
          grants. Enforced permissions and filters complement the instructions
          you give a model.
        docsLabel: Guardrails
      - title: Configure chat content filters
        body:
          Enable content safety, personal-data detection, and optional
          moderation for the chat directions you choose. Test the patterns and
          failure behavior your work needs.
        docsLabel: Guardrails
      - title: Set budgets for metered work
        body: Track recorded model usage and set budget rules for supported paths,
          including managed agent runs. Direct subscription calls use the
          provider’s own controls.
        docsLabel: Usage analytics
  faq:
    heading: Governance FAQ
    items:
      - q: What does governance control?
        a:
          Governance combines access rules, connector approval policies,
          recorded audit events, usage budgets, and configurable chat filters.
          Each control has its own scope.
      - q: Where do I decide a connector approval?
        a:
          Open the waiting automation run. If it works on a task, the approval
          card also appears on that task. Connector approvals are distinct
          from reviewing an agent’s completed task.
      - q: Can I choose which connector writes require approval?
        a: Yes. The policy can be configured for a connector or a specific
          action. External writes require approval by default; changing the
          policy does not resolve an approval already waiting.
      - q: Does every agent action wait for approval?
        a:
          No. The connector broker exposes read actions to agents; governed
          connector writes run through automation nodes. Direct GitHub tooling
          and explicitly granted secrets have separate access paths. Review
          those grants too.
      - q: How do content filters and data controls apply?
        a: Chat filters can check configured input and output. Model API
          endpoints filter input only; they do not filter model output.
          Personal-data detection depends on configured patterns. Assess
          deployment, providers, and operating procedures together.
  docs:
    - label: Approval concepts
      path: /platform/approvals/concepts
    - label: Configure approvals
      path: /platform/approvals/configure
    - label: Approvals in workflows
      path: /platform/automations/approvals-in-workflows
    - label: Audit logs
      path: /platform/admin/governance/audit-logs
    - label: Guardrails
      path: /platform/admin/governance/guardrails
  tour:
    heading: See the rules in the work
    description: Inspect workflow runs, compare answers, and check the tools and sources
      available to agents.
    stages:
      - id: automations
        eyebrow: Automations
        title: |-
          Follow the run
          and its decisions
        description:
          A configured workflow can review an access report and prepare a
          notification. Inspect its steps, approval decisions, and recorded
          effects in the run detail.
      - id: arena
        eyebrow: Arena
        title: |-
          Compare wording
          and check the policy
        description:
          Read two model responses to the same question. Verify each against
          your policy before using either one.
      - id: agents
        eyebrow: Agents
        title: |-
          Choose the tools
          the work needs
        description:
          Equip each project agent with explicit tools and credentials.
          Managed model calls use Tale’s gateway controls; direct subscription
          access follows a different path.
      - id: knowledge
        eyebrow: Knowledge
        title: |-
          Read the source
          behind the answer
        description:
          Keep policies and runbooks in accessible knowledge. When an answer
          uses them, inspect the source and check whether it supports the
          result.
