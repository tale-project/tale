platformKnowledge:
  eyebrow: Knowledge
  title: What is Knowledge in Tale?
  description: Knowledge is the org's shared library — documents, knowledge
    entries, crawled websites, and typed records — that agents retrieve and cite
    so replies reflect your reality, not only model training data.
  capabilities:
    heading: What lives in Knowledge?
    description: Give agents the documents, records, and crawls they need — and
      every answer cites where it came from.
    items:
      - title: Documents with an indexing pipeline
        body:
          Upload files; Tale extracts, chunks, embeds, and stores them for retrieval
          with citations.
        docsLabel: Documents
      - title: Knowledge entries
        body:
          Small topic-keyed facts — captured from chat with approval or added by
          hand.
        docsLabel: Knowledge entries
      - title: Website crawls
        body: Index pages your agents should cite without pasting them into prompts.
        docsLabel: Crawling
      - title: Typed records
        body:
          Products, Contacts, and Vendors are exact field rows agents read as data,
          not prose.
        docsLabel: Structured data
      - title: Per-agent retrieval scope
        body:
          An agent's Knowledge tab decides which slices it can search; team items
          stay team-scoped.
        docsLabel: Agent knowledge
  faq:
    heading: Knowledge FAQ
    items:
      - q: What is Knowledge in Tale?
        a:
          Tale Knowledge is the org's shared library of documents, facts, websites, and
          typed records that agents retrieve and cite in replies.
      - q: Do agents see the whole library by default?
        a:
          No. Each agent's Knowledge tab sets retrieval scope. Team-scoped items stay
          invisible outside the team.
      - q: What is the difference between documents and typed records?
        a:
          Documents and entries are indexed for retrieval. Products, Contacts, and
          Vendors are structured rows agents read as exact values.
      - q: Can agents write to Knowledge, or only read?
        a:
          They can propose. Entries captured from a chat pause on an approval card; a
          person decides what enters the library, and the decision is logged.
