about:
  hero:
    eyebrow: About us
    title: Who is behind Tale?
    description: Tale is built by Ruler GmbH in Spiez, Switzerland. We build an
      open-source project workspace where people and AI agents solve problems
      together. Our ISO 27001 certification covers Tale Enterprise and
      professional services.
    ctaContact: Contact us
    ctaGithub: View the code
  facts:
    founded:
      label: Founded
      value: '2020'
    location:
      label: Based in
      value: Spiez, Switzerland
    certified:
      label: Certified
      value: Ruler GmbH · ISO 27001
    license:
      label: License
      value: MIT — fully open source
  story:
    heading: Our story
    p1: Ruler GmbH was founded in Spiez, in the Canton of Bern, in 2020 by
      Yannick Monney. From day one the company has been Swiss-based and
      vendor-neutral — no ties to a cloud or model provider.
    p2: We build Tale for companies that want AI agents to work alongside their
      teams. Work needs owners, context, coordination, and a place to review
      the result. A shared project workspace brings those pieces together.
    tagline: Your Infrastructure. Your Data. Your Rules.
    p3: Tale brings project boards, agent sandboxes, files, knowledge, and
      workflows into one product. Teams can assign tasks, follow agent
      progress, and review deliverables together, with a choice of runtimes,
      models, and deployment.
  product:
    heading: What we build
    description: "Tale is an open-source workspace for teams and AI agents: one place to
      plan projects, delegate tasks, and review results."
    orchestrator:
      title: People and agents on the same project
      body: Assign work to teammates or project agents. Give agents instructions,
        tools, and a supported runtime, then follow their tasks and inspect
        what they produce.
    openSource:
      title: Open source, no asterisks
      body: The entire codebase is public on GitHub under the MIT license. The
        free Community edition ships identical features; Enterprise adds
        support and services at CHF 12 (EUR 14) per user/month.
    deployment:
      title: Your infrastructure or ours
      body: Self-host on your own infrastructure or choose managed hosting in
        Switzerland or the EU. Choose local or cloud models and configure
        which external services the workspace can reach.
    beyond:
      title: Beyond software
      body: We also supply AI hardware to rent, lease, or buy, and run AI
        trainings for teams adopting agents.
  work:
    heading: How we work with companies
    description: Putting agents to work takes a clear process as well as software. We
      help teams prepare their sources, define useful tasks, and establish how
      people review the results.
    dataQuality:
      title: Data worth pointing agents at
      body: We help structure sources, ownership, and provenance so people and
        agents can find and check the relevant evidence.
    regulated:
      title: At home in regulated environments
      body: We help teams evaluate deployment, access, and review requirements.
        Ruler GmbH’s ISO 27001 certification covers Tale Enterprise and
        professional services; request the scope and evidence relevant to your
        organization.
    edge:
      title: An edge that stays yours
      body: Keep your team’s project context, workflows, and review history
        together as you add agents. The MIT-licensed codebase and a choice of
        runtimes and deployment let you adapt Tale to how your company works.
    tailored:
      title: Solutions shaped to your goals
      body: No two organizations adopt AI the same way. We build the agents,
        automations, knowledge, and hardware around what you are trying to
        achieve — and leave out what you don't need.
  values:
    heading: What we stand for
    privacy:
      title: Data stays yours
      body: Keep deployment and model choices in your hands. Use local inference
        when needed and review the data flows of any external services you
        connect.
    neutrality:
      title: Independent & vendor-neutral
      body: Swiss-based and vendor-neutral — no ties to a cloud or model
        provider, so your deployment answers only to you.
    transparency:
      title: Transparent by default
      body: An MIT-licensed public codebase and a company you can look up in
        the Swiss commercial register. What we ship is what you can read.
    control:
      title: Humans stay in charge
      body: People define the work, grant agent access, and configure review and
        approval policies. Teams can inspect deliverables and run history
        before deciding what comes next.
  cta:
    title: Talk to the team
    description: Questions about Tale, deployment, or working with Ruler GmbH?
      Book a demo or reach us through the contact form.
