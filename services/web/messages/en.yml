platformProjects:
  eyebrow: Projects
  title: What are Projects in Tale?
  description: Projects are shared workspaces that bundle the chats, files,
    instructions, and task board for one piece of work — so context follows the
    work and agents pick tasks up where your team leaves them.
  capabilities:
    heading: One workspace per piece of work
    description:
      A project keeps everything a contact, a launch, or an investigation
      needs in one place — and puts agents to work inside it.
    items:
      - title: Context that follows the work
        body:
          Chats, files, instructions, and tasks live on the project's tabs, so
          nobody re-pastes background into a fresh composer.
        docsLabel: Projects overview
      - title: A board agents work from
        body:
          Assign a task card to an agent and the task-ops pack runs it — triage,
          execution, review, and escalation included.
        docsLabel: Task automation
      - title: A backlog with human triage
        body:
          Automations propose work; a teammate starts what is worth doing and closes
          what is not. Nothing runs unvetted.
        docsLabel: Project backlog
      - title: Files scoped to the project
        body:
          The Knowledge tab holds the project's folder tree — indexed for retrieval
          inside the project, invisible outside it.
        docsLabel: Manage files
      - title: The right agents on call
        body: Curate which agents and models members see in the project, so the
          recommended specialist is one click away.
        docsLabel: Agents and models
  faq:
    heading: Projects FAQ
    items:
      - q: What is a project in Tale?
        a: A shared workspace that bundles chats, files, instructions, and tasks
          around one piece of work — a contact, a launch, an investigation — so
          the context stays with the work.
      - q: How do agents work on project tasks?
        a:
          'Assigning a board task to an agent starts the task-ops loop: the agent
          executes, a human review gate checks the result, and budgets,
          concurrency limits, and a kill switch keep runs inside guardrails.'
      - q: Who sees a project's chats and files?
        a:
          Only the project's members. Chats, files, and threads stay scoped to the
          workspace they live in — support escalations stay out of engineering.
      - q: How is a project different from a chat?
        a:
          'A chat answers one question and moves on. A project carries ongoing work:
          shared history, a task board, instructions that apply to every chat,
          and files agents can cite.'
