platformGovernance:
  eyebrow: Governance
  title: What is Governance in Tale?
  description: 'Governance is the seam between agent initiative and human
    judgement: approval cards hold actions until someone decides, every decision
    lands in the audit log, and spend stays visible — without a separate
    approver inbox.'
  capabilities:
    heading: What does governance cover?
    description: Put a human in the loop where it matters — with an audit trail,
      budget controls, and filters that keep sensitive data out of prompts and
      replies.
    items:
      - title: In-chat approval cards
        body:
          Plans, document writes, knowledge writes, connector calls, MCP tools,
          and workflow runs pause until approve or reject.
        docsLabel: Approval concepts
      - title: Suggest changes on connectors
        body:
          Describe what is wrong; the agent revises the call instead of abandoning
          the work.
        docsLabel: Approval concepts
      - title: Audit trail
        body:
          Each decision records actor, action, and timestamp. Resolved cards stay in
          the transcript.
        docsLabel: Audit logs
      - title: Guardrails and policies
        body:
          Org-level guardrails and the run-code policy set the limits on what agents
          may attempt — before a card ever appears.
        docsLabel: Guardrails
      - title: PII filtered in both directions
        body:
          Every chat message passes content safety, PII detection, and an optional
          moderation provider — on the way in and the way out. Matches block,
          mask, or flag; the matched text itself is never stored.
        docsLabel: Guardrails
      - title: Usage visibility
        body: Usage analytics and budgets keep model spend visible to Admins.
        docsLabel: Usage analytics
  faq:
    heading: Governance FAQ
    items:
      - q: What is Governance in Tale?
        a:
          Tale Governance holds agent actions behind in-chat approval cards, writes
          decisions to the audit log, and keeps usage visible to Admins.
      - q: Is there a separate approval inbox?
        a:
          No. Approvals are decided in the conversation they interrupt, by whoever
          holds that chat.
      - q: Can I choose which actions require approval?
        a: Yes. Approvals are configurable per action type — plans, document and
          knowledge writes, connector calls, MCP tools, and workflow runs can
          each require a human decision before they run.
      - q: Can agents send email without approval?
        a:
          Not if you require approval for it. Outbound actions hold as in-chat cards
          until someone decides — you choose which action types need a decision.
      - q: How does Tale help with GDPR and PII?
        a: Keep processing on infrastructure you control, let PII detection mask
          personal data before it reaches or leaves a model, and point auditors
          at the audit log. Tale is GDPR-compliant, certified to ISO 27001 and
          SOC 2 Type II, and publishes its DPA and technical and organizational
          measures.
  docs:
    - label: Approval concepts
      path: /platform/approvals/concepts
    - label: Configure approvals
      path: /platform/approvals/configure
    - label: Approvals in workflows
      path: /platform/automations/approvals-in-workflows
    - label: Audit logs
      path: /platform/admin/governance/audit-logs
    - label: Guardrails
      path: /platform/admin/governance/guardrails
  tour:
    heading: How governance holds the line
    description: Approve before actions ship, audit every run, compare models
      honestly, and keep agents inside your rules.
    stages:
      - id: automations
        eyebrow: Automations
        title: |-
          Every gated run
          leaves a log
        description:
          'A nightly access review runs on schedule and alerts #security on
          new admin grants — every execution numbered in the same journal
          approvals write to.'
      - id: arena
        eyebrow: Arena
        title: |-
          Compare before
          you commit
        description:
          Policy-sensitive wording is exactly where models disagree. Arena
          drafts the same reply twice so the safer version ships.
      - id: agents
        eyebrow: Agents
        title: |-
          Agents stay inside
          budgets and tools
        description:
          Spend controls and tool grants travel with each agent — governance
          is not a separate bolt-on.
      - id: knowledge
        eyebrow: Knowledge
        title: |-
          Cite what policy
          allowed the reply
        description:
          Grounded answers show the policy and runbook sources so auditors
          can follow the same trail.
  demos:
    govern:
