platformHub:
  title: How does the Tale platform work?
  description: 'Tale is the orchestrator for AI agents: one place where your
    agents share knowledge, run automations, and answer to the same approvals —
    self-hosted, on your terms.'
  modulesHeading: Platform modules
  modulesDescription: Chat, Projects, Knowledge, Agents, Automations, and
    Governance — each is useful alone; together they make one governed system.
    Open a module for its own tour.
  tour:
    heading: How the platform fits together
    description:
      Every window below is one module telling its own story — ground it
      in Knowledge, run it through Automations, hold it at Governance, compare
      it in Arena. Open any module for the full tour.
    stages:
      - id: agents
        eyebrow: Agents
        title: |-
          Every agent,
          one roster
        description:
          Claude Code, Codex, Hermes, OpenClaw — docked beside in-product
          agents so work routes to the tool your team already runs.
      - id: knowledge
        eyebrow: Knowledge
        title: |-
          One library,
          cited everywhere
        description:
          The product manual, the docs crawl, the price list, an FAQ entry —
          one indexed library every agent cites.
      - id: automations
        eyebrow: Automations
        title: Delegate multi-step work
        description:
          An invoice pipeline extracts line items, holds anything over CHF
          5,000, and files the rest to the ERP — every run logged.
      - id: govern
        eyebrow: Governance
        title: |-
          Held until
          someone decides
        description: Even a knowledge write waits for a person. Approve, and the
          decision lands in the audit log with the budget in view.
      - id: arena
        eyebrow: Arena
        title: |-
          Two drafts,
          one brief
        description:
          One announcement brief, two models side by side — the stronger
          draft ships.
      - id: projects
        eyebrow: Projects
        title: Scope by team
        description:
          Every window above ran inside one workspace. Projects decide which
          agents, libraries, and members sit together — and who sees the runs.
  faq:
    heading: Platform FAQ
    items:
      - q: What is the platform in Tale?
        a:
          'Tale is a self-hosted orchestrator for AI agents: connect agents, pool
          knowledge, run automations, and govern every action on infrastructure
          you run.'
      - q: Which modules does Tale include?
        a: Chat, Projects, Knowledge, Agents, Automations, and Governance — with
          Projects scoping work, files, and agents by team.
      - q: Is Tale open source?
        a:
          Yes. Community is MIT-licensed and free to self-host. Enterprise adds support
          and services on the same codebase.
      - q: Where should I start?
        a:
          Open Chat to try a grounded reply, or Agents to dock Claude Code, Codex,
          Hermes, and OpenClaw under one orchestrator.
