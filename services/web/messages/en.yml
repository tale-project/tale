platformProjects:
  eyebrow: Projects
  title: What are Projects in Tale?
  description: Bring teammates, tasks, project agents and reference files together around
    a shared goal. Use the board to plan work, start agent tasks and review
    the results with your team.
  capabilities:
    heading: One workspace per piece of work
    description:
      Coordinate a launch, a research project or an internal improvement with
      a shared board, project instructions and agents equipped for the work.
    items:
      - title: Context that follows the work
        body:
          Keep tasks, instructions and reference files in one project. Project
          chats use its instructions and can retrieve relevant files.
        docsLabel: Projects overview
      - title: A board agents work from
        body:
          Assign a task to a project agent, then start it. Follow progress and
          review the report and attached files when the agent finishes.
        docsLabel: Task automation
      - title: A backlog for proposed work
        body:
          Collect ideas and agent-proposed tasks in the backlog. Clarify the
          brief, choose an assignee and decide which tasks to start.
        docsLabel: Project backlog
      - title: Files scoped to the project
        body:
          Organize reference files in the project’s Knowledge tab. Indexed
          content is available in that project’s context, subject to access
          rules.
        docsLabel: Manage files
      - title: Agents equipped for your project
        body: Create project agents with a role, compatible runtime and model,
          instructions and tools. Assign work to the agent prepared for that
          task.
        docsLabel: Project agents
  faq:
    heading: Projects FAQ
    items:
      - q: What is a project in Tale?
        a: A shared workspace that bundles chats, files, instructions, and tasks
          around one piece of work — a contact, a launch, an investigation — so
          the context stays with the work.
      - q: How do agents work on project tasks?
        a:
          Assign a task, then start the agent or move the task to In progress.
          The agent works in its sandbox and returns a report and files for
          review. A person or a separately assigned reviewer agent can review
          the result; assignment alone does not start a run.
      - q: Who sees a project's chats and files?
        a:
          Projects are organization-wide by default. Restrict the project
          audience to selected teams when needed; administrators retain
          access. Chats remain personal until explicitly shared, including
          chats created inside a project.
      - q: How is a project different from a chat?
        a:
          A chat is a conversation with an AI assistant. A project organizes
          ongoing work across a task board, agents, instructions, files and
          chats. Starting a new chat uses the project instructions, but does
          not automatically import earlier conversations.
  docs:
    - label: Projects overview
      path: /platform/projects/overview
    - label: Project concepts
      path: /platform/projects/concepts
    - label: Task automation
      path: /platform/projects/task-automation
    - label: Project backlog
      path: /platform/projects/backlog
    - label: Manage files
      path: /platform/projects/manage-files
    - label: Project agents
