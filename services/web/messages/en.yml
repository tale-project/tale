platformKnowledge:
  eyebrow: Knowledge
  title: What is Knowledge in Tale?
  description: Keep documents, short facts, website content and structured records
    available to your team. Chat and equipped project agents can retrieve
    accessible sources to support answers and task work.
  capabilities:
    heading: What lives in Knowledge?
    description: Prepare useful sources for retrieval and check the evidence behind an
      answer or deliverable.
    items:
      - title: Documents with an indexing pipeline
        body:
          Upload supported files and check their indexing status. Indexed text
          can be retrieved with source references.
        docsLabel: Documents
      - title: Knowledge entries
        body:
          Save a concise fact under a stable topic. Update the current entry
          and inspect its version history when information changes.
        docsLabel: Knowledge entries
      - title: Website crawls
        body: Index pages your agents should cite without pasting them into prompts.
        docsLabel: Crawling
      - title: Typed records
        body:
          Contacts and products keep named fields together so people and
          agents can look up specific values alongside supporting documents.
        docsLabel: Structured data
      - title: Access follows the source
        body:
          Team restrictions and project access apply during retrieval. Project
          agents need the corresponding platform tools to reach knowledge.
        docsLabel: Knowledge overview
  faq:
    heading: Knowledge FAQ
    items:
      - q: What is Knowledge in Tale?
        a:
          Knowledge holds shared documents, entries, indexed websites,
          contacts and products. Use it to give questions and project tasks a
          common reference, then verify the sources used.
      - q: What determines which sources can be retrieved?
        a:
          Retrieval follows source permissions and project context. Project
          chats can search their project’s files and accessible organization
          knowledge. Project agents need the relevant tools in their
          equipment.
      - q: What is the difference between documents and typed records?
        a:
          Documents and entries provide text for retrieval. Contacts and
          products store named fields for exact lookups. Check the source and
          its freshness in either case.
      - q: How does a useful fact become shared knowledge?
        a:
          An authorized editor can add or update a knowledge entry;
          integrations can also maintain entries through the API. Verify a
          fact before saving it. Chat does not automatically add facts to the
          library.
  docs:
    - label: Knowledge overview
      path: /platform/knowledge/overview
    - label: Documents
      path: /platform/knowledge/documents
    - label: Knowledge entries
      path: /platform/knowledge/knowledge-entries
    - label: Crawling
      path: /platform/knowledge/crawling
    - label: Structured data
      path: /platform/knowledge/structured-data
