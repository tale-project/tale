platformHub:
  title: How does the Tale platform work?
  description: Tale brings teammates and AI agents into one project workspace. Plan work
    on task boards, delegate to agents running in sandboxes, and review the
    results with the context and files that produced them.
  modulesHeading: Platform modules
  modulesDescription: Projects organize the work. Agents execute assigned tasks. Chat and
    Knowledge supply context. Automations make recurring steps repeatable,
    while Governance configures access and review.
  tour:
    heading: How the platform fits together
    description:
      Plan a project, equip agents for its tasks, and review their results.
      Knowledge, chat and repeatable workflows support the work your team
      coordinates.
    stages:
      - id: agents
        eyebrow: Agents
        title: |-
          Agents for
          your project tasks
        description:
          Configure project agents with a supported runtime, model and tools.
          Assign them tasks and follow their progress with your teammates.
      - id: knowledge
        eyebrow: Knowledge
        title: |-
          Shared sources
          for the work
        description:
          Keep manuals, reference files, website content and short facts
          available for retrieval. Check the cited sources behind an answer.
      - id: automations
        eyebrow: Automations
        title: Delegate multi-step work
        description:
          Define the steps for recurring work, configure its trigger, and
          inspect the results of each run. Connector approval policies can
          pause protected writes.
      - id: govern
        eyebrow: Governance
        title: |-
          Held until
          someone decides
        description: A protected connector write can wait for approval in an automation
          run. Review the proposed action, decide, and check its execution
          outcome.
      - id: arena
        eyebrow: Arena
        title: |-
          Two drafts,
          one brief
        description:
          Compare two model responses to the same brief. Read both drafts
          before choosing which one to use.
      - id: projects
        eyebrow: Projects
        title: Scope by team
        description:
          Bring tasks, agents, files and instructions into a project. Choose
          its audience and explicitly share the chats your teammates should
          read.
  faq:
    heading: Platform FAQ
    items:
      - q: What is the platform in Tale?
        a:
          Tale is an open-source project workspace for teams and AI agents.
          Plan tasks, delegate work, follow progress and review results, with
          shared context and repeatable workflows.
      - q: Which modules does Tale include?
        a: Chat, Projects, Knowledge, Agents, Automations, and Governance — with
          Projects scoping work, files, and agents by team.
      - q: Is Tale open source?
        a:
          Yes. Community is MIT-licensed and free to self-host. Enterprise adds support
          and services on the same codebase.
      - q: Where should I start?
        a:
          Start with a project and one task whose result you can judge. Add
          the relevant files, assign a configured agent, start it, and review
          what it delivers.
