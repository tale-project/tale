platformChat:
  eyebrow: Chats
  title: Ask, compare, then hand work to an agent
  description: Use chat to understand a problem, work with project sources, and draft a
    brief. When the work needs files, code, or tools, create a project task
    and assign an agent.
  capabilities:
    heading: What does Chat include?
    description:
      Explore a question, check the sources, and prepare the next task.
    items:
      - title: Choose a model
        body:
          Pick an available model and provider, or let Auto select a model for
          each message within your organization’s rules.
        docsLabel: Chat basics
      - title: Inspect the sources
        body:
          Open the documents and pages used in an answer. Check that the cited
          material supports the conclusion.
        docsLabel: Chat basics
      - title: Compare two models in Arena
        body:
          Send the same prompt and starting context to two models. Read both
          replies and choose how to continue.
        docsLabel: Arena mode
      - title: Bring the relevant files
        body:
          Attach supported documents, images, or recordings. Processing and
          model capabilities determine what the assistant can read.
        docsLabel: Attachments
      - title: Move from a question to a task
        body:
          Create a project task from the conversation when you need an agent
          to produce files or perform work in a sandbox.
        docsLabel: Project agents
  faq:
    heading: Chat FAQ
    items:
      - q: What is Chat in Tale?
        a:
          Chat is the built-in assistant for questions, source retrieval, and
          text drafts. It can use accessible company knowledge and the current
          project’s context.
      - q: Do I need to configure a project agent for chat?
        a:
          No. Chat uses Tale’s built-in assistant and your chosen model.
          Project agents are separate workers that you assign to project
          tasks.
      - q: What is Arena mode?
        a:
          Arena sends one prompt to two models with the same starting context.
          You compare their replies and record a verdict before continuing the
          conversation.
      - q: How do I turn a chat into work?
        a:
          Create a project task from the conversation and assign an agent.
          Chat itself does not run code, change connected systems, or produce
          file deliverables. Task progress and results stay linked to the
          conversation.
  docs:
    - label: Chat overview
      path: /platform/chat/overview
    - label: Chat basics
      path: /platform/chat/basics
    - label: Arena Mode
      path: /platform/chat/arena-mode
