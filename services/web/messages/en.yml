platformAgents:
  eyebrow: Agents
  title: What are agents in Tale?
  description: Project agents work on tasks alongside your team. Give each one
    instructions, a supported runtime, a model and tools, then follow its
    sandbox work and review its reports and files.
  capabilities:
    heading: What can agents do?
    description:
      Configure reusable workers for project tasks, from research and document
      preparation to code changes and review.
    items:
      - title: A defined role and runtime
        body:
          Choose a runtime, a compatible model and provider, standing
          instructions, and the equipment the work needs.
        docsLabel: Agent concepts
      - title: Supported agent runtimes
        body:
          Bind Claude Code, Codex, Hermes, and OpenClaw as the agent runtime a project
          agent or automation agent node runs on.
        docsLabel: Agent runtimes
      - title: Delegation between agents
        body:
          An equipped manager agent can start other agents on ready tasks in
          the same project, within delegation, access and capacity limits.
        docsLabel: Task automation
      - title: Skills as reusable bundles
        body:
          Give agents reusable instructions and supporting files as skills.
          Equip them for tasks such as preparing documents or reviewing
          changes.
        docsLabel: Project agents
      - title: Tools for project context
        body:
          Grant the platform tools an agent needs to find tasks, read files
          and retrieve knowledge. Access rules still apply to the sources it
          uses.
        docsLabel: Knowledge
  faq:
    heading: Agents FAQ
    items:
      - q: What is an agent in Tale?
        a:
          A project agent is a reusable worker in one project. Its runtime,
          model, instructions and tools determine how it approaches tasks.
          Reports and produced files stay with the task for review.
      - q: Can we bring our own subscriptions or API keys?
        a:
          Yes. Connect your API credentials, or use a supported Anthropic
          subscription with Claude Code or ChatGPT subscription with Codex for
          task and automation agents. An administrator configures the
          credentials or token broker. Chat needs API credentials;
          subscription availability and limits depend on your provider and
          plan.
      - q: When should I use an agent instead of a workflow?
        a:
          Use a project agent for an outcome that needs tools, files or
          several turns of work. Use an automation when you can define
          repeatable steps, conditions or triggers.
      - q: Can each agent use a different model?
        a:
          Yes. Choose a model and provider for each project agent, subject to
          runtime compatibility and the models available in your organization.
          Configuration changes apply to later runs.
  docs:
    - label: Agent concepts
      path: /platform/agents/concepts
    - label: Project agents
