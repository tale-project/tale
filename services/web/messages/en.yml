  tour:
    title: How Tale orchestrates your AI agents
    subtitle:
      Connect what you use, pool what you know, delegate the work, govern
      the result — then compare models and scope by project.
    connect:
      eyebrow: Agents & connectors
      title: |-
        Bring the agents
        you already trust
      description:
        Claude Code, Codex, Hermes, OpenClaw — plus Slack, GitHub, Outlook,
        and the rest of your stack. Nothing gets replaced; everything gets
        coordinated.
    pool:
      eyebrow: Knowledge
      title: |-
        One knowledge base,
        every answer grounded
      description:
        Documents, websites, product and contact data flow into a shared
        knowledge base. Agents answer from what your company actually knows —
        with citations you can check.
    delegate:
      eyebrow: Automations
      title: |-
        Delegate the work,
        not the control
      description:
        Automations chain LLM steps, conditions, and actions into workflows
        that run on triggers — inbox triage, escalations, weekly reports. Every
        run leaves a log.
    govern:
      eyebrow: Approvals & audit
      title: |-
        Approve before it ships.
        Audit after.
      description:
        Human-in-the-loop approvals gate the actions that matter. Audit
        logs, budgets, guardrails, and SSO keep every agent inside your rules.
    arena:
      eyebrow: Chat Arena
      title: |-
        Compare models
        on the same prompt
      description:
        Arena runs one question through two models side by side. Pick the
        reply that fits — without leaving the thread or retyping the ask.
    projects:
      eyebrow: Projects
      title: |-
        Scope agents
        and knowledge by team
      description: Projects keep agents, documents, and members in the right
        workspace. Support stays on support; engineering keeps its own stack.
    explore: Explore {module}
  tagline:
    title: Your Infrastructure. Your Data. Your Rules.
    subtitle:
      Run AI on your terms — from where it's hosted to how every action is
      governed.
    pillars:
      selfHosted:
        title: Self-hosted by default
        description:
          Runs entirely on your infrastructure — no cloud required. Pair it
          with local models and no data leaves your network; either way, nothing
          locks you to a vendor.
      security:
        title: Security built in
        description: Single sign-on, sensitive data detection, content safety
          guardrails, full activity logging, and budget controls — all built in,
          not bolted on.
      openSource:
        title: Fully open source
        description:
          The entire codebase is public under the MIT license. Read it, audit
          it, change what you need — without asking anyone.
  connectors:
    title: Plugged into the tools you already run
    subtitle:
      Connect Gmail, Slack, GitHub, Shopify, and your model providers once
      per organization — every agent and automation shares the same governed
      credentials.
  agents:
    title: Works with the agents you run
    subtitle:
      Dock Claude Code, Codex, Hermes, OpenClaw, Pi, and OpenCode under one
      orchestrator you host.
  compliance:
    eyebrow: SECURITY
    title: Compliance you can verify
    independent:
      title: Independent & Transparent
      description: Swiss-based and vendor-neutral — no ties to a cloud or model
        provider, so your deployment answers only to you.
    certified:
      title: Certified & Compliant
      description:
        Certified to ISO 27001 and SOC 2 Type II, and GDPR-compliant —
        audit logs and data controls mean you always know where your data is
        stored.
  faq:
    eyebrow: FAQ
    title: Frequently Asked Questions
    stillQuestions: Still have questions?
    contactTeam: Contact the team
    whatIsTale:
      q: What is Tale?
      a:
        'Tale is an open-source, self-hosted platform that orchestrates AI agents: it
        connects the agents and CLIs your team already uses, pools their
        knowledge into one governed knowledge base, and runs automations with
        human approval — on your own infrastructure or in a managed cloud in
        Switzerland or the EU.'
    openSource:
      q: Is Tale open source?
      a: Yes. Tale is MIT-licensed and the full feature set ships in the free
        Community edition — Enterprise adds support and services, not features.
    onPrem:
      q: Can Tale run fully on-premises or air-gapped?
      a:
        Yes. Tale self-hosts on your VPC, on-premises hardware, or fully air-gapped
        environments; with local models, no data ever leaves your network.
    enterprisePricing:
      q: How does Enterprise pricing work?
      a:
        Enterprise is billed per user/month, with two months free when paying yearly.
        Storage beyond the included quota is billed per TB/month. The Community
        edition stays free for self-hosted use.
    enterpriseFeatures:
      q: Are there additional features in the Enterprise plan?
      a: No. All product features are available in the open source version too.
        Enterprise adds extended support and services.
    byoModels:
      q: Do I have to bring my own AI models?
      a:
        No. You can bring your own models, but it's not required. Tale supports most
        major AI providers without markup — cloud model usage is billed at your
        provider's rates and is not included in the plans.
    aiProviders:
      q: Can I use my preferred AI provider?
      a:
        Yes. Tale supports the major cloud AI providers without markup — usage is
        billed at your provider's rates, so you keep your vendor and your
        existing billing.
    hardware:
      q: Do you also provide hardware?
      a:
        Yes — hardware is available on rental, leasing, or purchase terms. Mention it
        when you contact the team and you'll get a quote for the configuration
        that fits.
    ownHardwareModels:
      q: Can I use my own hardware and AI models?
      a: Yes. Tale is hardware- and model-agnostic, so you're free to use your own.
    customTraining:
      q: Do you offer custom AI model training?
      a:
        Yes. Custom model training and fine-tuning are available for clients. Bring
        it up in the demo call if you need it.
  cta:
    title: Deploy Tale on your infrastructure.
    description:
      Orchestrate your AI agents on a sovereign stack you run yourself —
      get in touch, or spin one up in four commands.
    primary: Request a demo
    getStarted: Get started
    terminalTitle: Self-host in four commands
    copy: Copy
    copied: Copied
    docsLink: Full install guide
