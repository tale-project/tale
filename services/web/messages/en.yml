pricingPage:
  relatedHeading: Related
  ctaTitle: Put a number on your setup
  ctaDescription: Request a demo or talk to the team about Enterprise seats,
    storage, and hardware.
  faq:
    heading: Pricing FAQ
    items:
      - q: How much does Tale Enterprise cost?
        a:
          Tale Enterprise is CHF 12 (EUR 14) per user/month, with two months free on
          yearly billing. Storage is CHF 10 (EUR 12) per TB/month.
      - q: Is Community free?
        a: Yes. The Community edition is free to self-host under the MIT license.
      - q: Can I buy hardware with software?
        a:
          Yes. Silent inference hardware is available to rent, lease, or buy — see
          Hardware pricing.
