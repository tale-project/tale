        title: |-
          Ancre chaque réponse
          dans des sources indexées
        description:
          Chat lit dans les bibliothèques que tu accordes — des cartes de
          citation atterrissent dans le fil pour ouvrir le fichier ou la page
          utilisée.
  demos:
