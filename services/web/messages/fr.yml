platformAgents:
  eyebrow: Agents
  title: Que sont les agents dans Tale ?
  description: Un agent Tale est la combinaison à quatre boutons d’instructions,
    connaissances, outils et modèle. Les éditeurs les construisent une fois ;
    l’équipe les exécute dans Chat, automations et projets — sur des harnesses
    comme Claude Code, Codex, Hermes et OpenClaw quand le travail a besoin d’une
    CLI de code dans un sandbox.
  capabilities:
    heading: Que peuvent faire les agents ?
    description:
      Ce qu’une définition d’agent donne à toute l’équipe — et ce qu’elle
      ajoute par rapport à un modèle nu.
    items:
      - title: Quatre boutons, une unité
        body:
          Instructions, connaissances, outils et modèle définissent le comportement
          d’un agent. Change un bouton sans rien réentraîner.
        docsLabel: Concepts agents
      - title: Les harnesses s’accostent
        body:
          Lie Claude Code, Codex, Hermes et OpenClaw comme harness sur lequel
          tourne un agent de projet ou un nœud agent d’automation.
        docsLabel: Harnesses
      - title: Délégation entre agents
        body:
          Les agents spécialistes se passent le travail quand un fil quitte un
          domaine — sans perdre la transcription.
        docsLabel: Workers agents
      - title: Skills comme bundles réutilisables
        body:
          Emballe une voix d’écriture ou un schéma multi-étapes une fois et lie-le à
          jusqu’à dix agents.
        docsLabel: Skills agents
      - title: Connaissances limitées par agent
        body:
          Chaque agent ne cherche que les tranches de bibliothèque que tu accordes —
          les docs d’équipe restent invisibles hors équipe.
        docsLabel: Connaissances agent
  faq:
    heading: FAQ agents
    items:
      - q: Qu’est-ce qu’un agent dans Tale ?
        a:
          Un agent Tale combine instructions, connaissances, outils et modèle en une
          unité réutilisable que les membres exécutent dans Chat et automations.
      - q: Tale peut-il orchestrer Claude Code et Hermes ?
        a:
          Oui. Claude Code, Codex, Hermes et OpenClaw arrivent comme harnesses —
          lie-en un quand tu crées un agent de projet ou un nœud agent d’automation.
      - q: Quand utiliser un agent plutôt qu’un workflow ?
        a:
          Utilise un agent quand la conversation reste dans un domaine et une voix.
          Passe à une automation quand le travail a besoin de plusieurs étapes,
          branches, plannings ou approbations.
      - q: Chaque agent peut-il utiliser un modèle différent ?
        a:
          Oui. Chaque agent porte son modèle principal et ses fallbacks — Claude Code
          peut tourner sur Claude Opus pendant qu’un spécialiste support utilise
          Claude Sonnet. Tu changes de modèle sans reconstruire l’agent.
  docs:
    - label: Concepts agents
      path: /platform/agents/concepts
    - label: Créer un agent
      path: /platform/agents/create
    - label: Harnesses
      path: /platform/agents/harnesses
    - label: Délégation
      path: /platform/agents/delegation
    - label: Connaissances agent
      path: /platform/agents/knowledge
  tour:
    heading: Comment les agents apparaissent dans Tale
    description:
      Accroche les agents auxquels tu fais confiance, ancre-les dans le
      savoir, lance-les dans des workflows et isole-les par projet.
    stages:
      - id: projects
        eyebrow: Projets
        title: |-
          Isole les agents
          par équipe
        description:
          Chaque projet garde agents, membres et savoir dans un espace — le
          support ne voit jamais la stack ingénierie.
      - id: knowledge
        eyebrow: Connaissances
        title: |-
          Ancre chaque agent
          dans ce que tu sais
        description:
          L’agent Support reçoit les macros, la voix de marque et le crawl du
          centre d’aide — rien d’autre. Chaque agent ne cherche que dans les
          tranches que tu lui accordes.
      - id: automations
        eyebrow: Automatisations
        title: |-
          Lance les agents
          dans un travail multi-étapes
        description:
          Les workflows appellent des agents comme étapes LLM avec conditions
          et actions — chaque run laisse un journal.
      - id: chat
        eyebrow: Sandbox
        title: |-
          Regarde l’agent
          dans Files et Live
        description:
          Les agents qui tournent sur un harness travaillent dans un sandbox —
          parcours l’arbre du workspace, ouvre le fichier qu’ils viennent d’écrire,
          et suis le navigateur live pendant qu’ils cliquent dans le résultat.
  demos:
    knowledge:
      label: 'Démo animée : les tranches de connaissances accordées à un agent —
        macros support, entrée de voix de marque, crawl du playbook agents et
        playbook retours.'
