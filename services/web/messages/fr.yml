      identifiants, puis accorde aux agents et aux workflows les accès
      nécessaires à leur travail.
  agents:
    title: Tes agents, à ta façon
    subtitle: Utilise un moteur compatible avec tes identifiants ou des modèles facturés par API.
  faq:
    eyebrow: FAQ
    title: Questions fréquentes
    stillQuestions: Encore des questions ?
    contactTeam: Contacter l’équipe
    whatIsTale:
      q: Qu’est-ce que Tale ?
      a: Tale est un espace de projet open source pour les équipes et les
        agents IA. Planifie les tâches avec tes collègues, délègue le travail
        aux agents et examine les résultats au même endroit. Tale réunit
        tableaux de tâches, sandboxes, connaissances et workflows. Tu peux
        aussi l’auto-héberger et utiliser des modèles privés.
    openSource:
      q: Tale est-il open source ?
      a: Oui. Tale est sous licence MIT et toutes les fonctionnalités sont dans
        l’édition Community gratuite — Enterprise ajoute du support et des
        services, pas des fonctionnalités.
    onPrem:
      q: Tale peut-il tourner entièrement on-premises ou en environnement isolé ?
      a:
        Tale peut fonctionner sur ton infrastructure avec des modèles locaux.
        Un déploiement hors ligne demande aussi des dépendances locales et des
        connexions sortantes restreintes. Les modèles cloud, outils et
        connecteurs externes peuvent transmettre des données hors de ton
        réseau lorsqu’ils sont activés.
    enterprisePricing:
      q: Comment fonctionne la tarification Enterprise ?
      a:
        Enterprise est facturé par utilisateur et par mois, avec deux mois offerts en
        paiement annuel. Le stockage au-delà du quota inclus est facturé par
        To/mois. L’édition Community reste gratuite pour un usage auto-hébergé.

    byoModels:
      q: Dois-je apporter mes propres modèles d’IA ?
      a:
        Non. Tu peux apporter tes propres modèles, sans obligation. Tale prend en
        charge la plupart des grands fournisseurs d’IA sans majoration — l’usage
        cloud est facturé aux tarifs de ton fournisseur et n’est pas inclus dans
        les plans.




    whoFor:
      q: À qui s’adresse Tale ?
      a: "Tale s’adresse aux équipes qui veulent organiser le travail des agents
        IA et collaborer avec eux. Les profils techniques configurent les
        agents, les outils et les accès aux dépôts ; les autres membres
        décrivent les tâches, discutent de l’avancement et examinent les
        résultats. Projets logiciels, campagnes marketing, recherches,
        rapports ou opérations récurrentes : les possibilités dépendent des
        outils et des autorisations de chaque agent."
    agentSubscriptions:
      q: Puis-je utiliser mon abonnement à un agent ?
      a: Oui, si le moteur prend en charge cet abonnement. Ajoute ton propre
        jeton ou les identifiants de connexion compatibles, puis choisis le
        moteur correspondant. Tu peux aussi utiliser des modèles par API. Les
        appels via abonnement suivent les limites du fournisseur et passent en
        dehors du suivi et des plafonds de dépenses de la passerelle Tale ;
        vérifie cet usage auprès du fournisseur.
