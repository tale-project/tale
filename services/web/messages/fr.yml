platformProjects:
  eyebrow: Projets
  title: Que sont les Projets dans Tale ?
  description:
    Réunis ton équipe, ses tâches, ses agents et ses fichiers de référence
    autour d’un objectif commun. Planifie le travail sur le tableau, lance les
    tâches des agents et examine les résultats avec ton équipe.
  capabilities:
    heading: Un espace de travail par sujet
    description:
      Coordonne un lancement, une recherche ou une amélioration interne avec
      un tableau partagé, des instructions de projet et des agents équipés
      pour ce travail.
    items:
      - title: Un contexte qui suit le travail
        body: Regroupe les tâches, les instructions et les fichiers de référence
          dans un projet. Ses chats utilisent les instructions du projet et
          peuvent consulter les fichiers pertinents.
        docsLabel: Vue d’ensemble des projets
      - title: Un tableau d’où les agents travaillent
        body:
          Attribue une tâche à un agent de projet, puis lance-la. Suis sa
          progression et examine le rapport et les fichiers joints lorsque
          l’agent a terminé.
        docsLabel: Automatisation des tâches
      - title: Un backlog pour le travail proposé
        body:
          Rassemble les idées et les tâches proposées par les agents dans le
          backlog. Précise la demande, attribue la tâche et choisis le travail
          à lancer.
        docsLabel: Backlog du projet
      - title: Des fichiers qui restent dans le projet
        body:
          Organise les fichiers de référence dans l’onglet Connaissances du
          projet. Le contenu indexé est accessible dans le contexte de ce
          projet, selon les règles d’accès.
        docsLabel: Gérer les fichiers
      - title: Des agents équipés pour ton projet
        body:
          Crée des agents de projet avec un rôle, un environnement d’exécution
          et un modèle compatibles, des instructions et des outils. Attribue
          le travail à l’agent préparé pour cette tâche.
        docsLabel: Agents de projet
  faq:
    heading: FAQ Projets
    items:
      - q: Qu’est-ce qu’un projet dans Tale ?
        a: Un espace de travail partagé qui réunit chats, fichiers, instructions
          et tâches autour d’un même travail — un contact, un lancement, une
          enquête — pour que le contexte reste avec le travail.
      - q: Comment les agents traitent-ils les tâches d’un projet ?
        a:
          Attribue une tâche, puis lance l’agent ou passe la tâche à En cours.
          L’agent travaille dans son sandbox et remet un rapport et des
          fichiers à examiner. Une personne ou un agent de vérification
          affecté séparément peut examiner le résultat. L’attribution seule ne
          lance aucune exécution.
      - q: Qui voit les chats et fichiers d’un projet ?
        a:
          Les projets sont accessibles à toute l’organisation par défaut. Tu
          peux limiter leur audience à certaines équipes ; les administrateurs
          conservent l’accès. Les chats restent personnels tant qu’ils ne sont
          pas explicitement partagés, y compris dans un projet.
      - q: Quelle différence entre un projet et un chat ?
        a:
          Un chat est une conversation avec un assistant IA. Un projet
          organise le travail dans la durée avec un tableau de tâches, des
          agents, des instructions, des fichiers et des chats. Un nouveau chat
          utilise les instructions du projet, sans importer automatiquement
          les conversations précédentes.
