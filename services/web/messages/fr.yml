platformKnowledge:
  eyebrow: Connaissances
  title: Que sont les connaissances dans Tale ?
  description: Mets documents, faits utiles, contenus web et données structurées à
    disposition de ton équipe. Le chat et les agents de projet équipés pour
    cela peuvent consulter les sources accessibles pour répondre et travailler
    sur les tâches.
  capabilities:
    heading: Que contiennent les connaissances ?
    description:
      Prépare des sources utiles pour la recherche et vérifie les éléments qui
      étayent une réponse ou un livrable.
    items:
      - title: Documents avec pipeline d’indexation
        body:
          Importe des fichiers pris en charge et vérifie leur indexation. Le
          texte indexé peut être consulté avec ses références de source.
        docsLabel: Documents
      - title: Fiches de connaissances
        body:
          Enregistre un fait concis sous un sujet stable. Actualise la fiche
          lorsque l’information change et consulte son historique de versions.
        docsLabel: Fiches de connaissances
      - title: Crawls de sites
        body:
          Indexe les pages que tes agents doivent citer sans les coller dans les
          prompts.
        docsLabel: Crawling
      - title: Enregistrements typés
        body:
          Les contacts et les produits regroupent des champs nommés. Les
          personnes et les agents peuvent consulter des valeurs précises avec
          les documents qui les complètent.
        docsLabel: Données structurées
      - title: L’accès suit les règles de la source
        body:
          Les restrictions d’équipe et l’accès au projet s’appliquent aussi à
          la recherche. Les agents de projet ont besoin des outils
          correspondants pour consulter les connaissances.
        docsLabel: Vue d’ensemble des connaissances
  faq:
    heading: FAQ sur les connaissances
    items:
      - q: Que sont les connaissances dans Tale ?
        a:
          Les connaissances réunissent documents, fiches, sites indexés,
          contacts et produits partagés. Elles donnent une référence commune
          aux questions et aux tâches du projet. Vérifie ensuite les sources
          utilisées.
      - q: Qu’est-ce qui détermine les sources consultables ?
        a:
          La recherche respecte les autorisations des sources et le contexte
          du projet. Les chats de projet peuvent consulter ses fichiers et les
          connaissances accessibles de l’organisation. Les agents doivent
          disposer des outils correspondants.
      - q: Quelle différence entre documents et enregistrements typés ?
        a:
          Les documents et fiches fournissent du texte à rechercher. Les
          contacts et produits stockent des champs nommés pour des
          consultations précises. Vérifie dans les deux cas la source et son
          actualité.
      - q: Comment partager un fait utile dans les connaissances ?
        a:
          "Une personne autorisée à modifier les connaissances peut créer ou
          actualiser une fiche. Les intégrations peuvent aussi le faire via
          l’API. Vérifie le fait avant de l’enregistrer : le chat ne l’ajoute
          pas automatiquement à la bibliothèque."
  docs:
    - label: Vue d’ensemble des connaissances
      path: /platform/knowledge/overview
    - label: Documents
      path: /platform/knowledge/documents
    - label: Fiches de connaissances
      path: /platform/knowledge/knowledge-entries
    - label: Crawling
      path: /platform/knowledge/crawling
    - label: Données structurées
      path: /platform/knowledge/structured-data
  tour:
    heading: Comment le savoir ancre Tale
    description:
      Prépare les sources de l’entreprise, utilise-les pour les questions et
      les tâches du projet, puis examine les références qui étayent le
      résultat.
    stages:
      - id: chat
        eyebrow: Chat
        title: |-
          Consulte les sources
          d’une réponse
        description:
          Les passages récupérés deviennent des cartes de citation — le
          lecteur ouvre le fichier ou la page utilisée.
      - id: projects
        eyebrow: Projets
        title: |-
          Les bibliothèques vivent
          avec leurs équipes
        description:
          Les projets définissent quels documents côtoient quels agents et
          membres.
  demos:
