platformProjects:
  eyebrow: Projets
  title: Que sont les Projets dans Tale ?
  description:
    Les projets sont des espaces de travail partagés qui réunissent les
    chats, les fichiers, les instructions et le tableau de tâches d’un même
    travail — le contexte suit le travail, et les agents reprennent les tâches
    là où ton équipe les laisse.
  capabilities:
    heading: Un espace de travail par sujet
    description:
      Un projet garde tout ce qu’un contact, un lancement ou une enquête
      demande au même endroit — et y met les agents au travail.
    items:
      - title: Un contexte qui suit le travail
        body: Chats, fichiers, instructions et tâches vivent dans les onglets du
          projet — personne ne recolle le contexte dans un composer vide.
        docsLabel: Vue d’ensemble des projets
      - title: Un tableau d’où les agents travaillent
        body:
          Assigne une carte à un agent et le pack task-ops l’exécute — triage,
          exécution, revue et escalade compris.
        docsLabel: Automatisation des tâches
      - title: Un backlog trié par des humains
        body:
          Les automatisations proposent du travail ; quelqu’un lance ce qui en vaut
          la peine et ferme le reste. Rien ne tourne sans validation.
        docsLabel: Backlog du projet
      - title: Des fichiers qui restent dans le projet
        body:
          L’onglet Connaissances tient l’arborescence du projet — indexée pour la
          recherche dans le projet, invisible en dehors.
        docsLabel: Gérer les fichiers
      - title: Les bons agents sous la main
        body:
          Choisis quels agents et modèles les membres voient dans le projet — le
          spécialiste recommandé est à un clic.
        docsLabel: Agents et modèles
  faq:
    heading: FAQ Projets
    items:
      - q: Qu’est-ce qu’un projet dans Tale ?
        a: Un espace de travail partagé qui réunit chats, fichiers, instructions
          et tâches autour d’un même travail — un contact, un lancement, une
          enquête — pour que le contexte reste avec le travail.
      - q: Comment les agents traitent-ils les tâches d’un projet ?
        a:
          'Assigner une tâche du tableau à un agent lance la boucle task-ops : l’agent
          exécute, une revue humaine contrôle le résultat, et budgets, limites
          de simultanéité et arrêt d’urgence gardent les exécutions dans les
          garde-fous.'
      - q: Qui voit les chats et fichiers d’un projet ?
        a:
          Seulement les membres du projet. Chats, fichiers et fils restent dans leur
          espace de travail — les escalades support ne débordent pas sur
          l’ingénierie.
      - q: Quelle différence entre un projet et un chat ?
        a:
          'Un chat répond à une question puis s’arrête. Un projet porte un travail qui
          dure : historique partagé, tableau de tâches, instructions valables
          pour chaque chat, et fichiers que les agents peuvent citer.'
  docs:
    - label: Vue d’ensemble des projets
      path: /platform/projects/overview
    - label: Concepts des projets
      path: /platform/projects/concepts
    - label: Automatisation des tâches
      path: /platform/projects/task-automation
    - label: Backlog du projet
      path: /platform/projects/backlog
    - label: Gérer les fichiers
      path: /platform/projects/manage-files
    - label: Agents et modèles
      path: /platform/projects/project-agents
  tour:
    heading: Comment un projet fait avancer le travail
    description:
      Assigne une tâche à un agent, reprends le chat du projet avec son
      contexte, appuie les réponses sur les fichiers du projet — et garde ce qui
      sort derrière une revue.
    stages:
      - id: tasks
        eyebrow: Tâches
        title: |-
          Assigne une carte,
          un agent la prend
        description:
          Assigner une tâche du tableau à un agent lance la boucle task-ops —
          exécution, contrôles et escalade tournent sur des workflows que ton
          organisation possède et règle.
      - id: chat
        eyebrow: Chats
        title: |-
          Chaque chat démarre
          avec le contexte
        description:
          Les instructions et fichiers du projet accompagnent chaque fil — un
          nouveau chat reprend la refonte là où le précédent s’est arrêté.
      - id: knowledge
        eyebrow: Connaissances
        title: |-
          Des fichiers qui restent
          dans le projet
        description:
          L’onglet Connaissances garde l’arborescence du projet indexée pour
          la recherche — citée dans les chats du projet, invisible en dehors.
      - id: govern
        eyebrow: Revue
        title: |-
          Rien ne part
          sans décision
        description:
          Quand une tâche publierait ou enverrait quelque chose, la carte
          d’approbation arrive chez le responsable du projet — et la décision
          reste dans la piste d’audit.
  demos:
    projects:
      label:
        'Démo animée : la liste des projets — chaque espace de travail partagé
        avec ses agents et ses membres.'
      project1: Refonte du site web
      agents1: 3 agents
