      source2: Voix de marque
      sourceType2: entry
      source3: agents.nordwind.eu
      sourceType3: website
      source4: returns-playbook.pdf
      sourceType4: pdf
    automation:
      label:
        'Démo animée : un workflow nocturne appelle l’agent Release comme étape
        LLM, vérifie s’il y a du nouveau et poste un digest sur Slack ; la table
        Exécutions enregistre chaque run.'
      trigger: Chaque nuit
      llm: Agent Release
      condition: Du nouveau ?
      branchYes: Oui
      action: Poster sur Slack
      actionAlt: Passer ce run
      run1: '#311'
      runTone1: done
      duration1: 6,1 s
      run2: '#312'
      runTone2: done
