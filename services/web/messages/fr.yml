      action: 'Alerte #security'
      actionAlt: Archiver
      run1: '#98'
      runTone1: done
      duration1: 3,4 s
      run2: '#99'
      runTone2: done
      duration2: 3,1 s
      run3: '#100'
      runTone3: running
      duration3: 0,6 s
    connect:
      label:
        "Illustration : agents de projet aux responsabilités et modèles
        distincts ; leurs outils et autorisations se configurent séparément."
      agent1: Agent Politique
      model1: Claude Sonnet
      agent2: Agent Audit
      model2: Claude Opus
      agent3: Agent Budget
      model3: GPT-5.5
      agent4: Agent Accès
      model4: Claude Sonnet
      agent5: Agent Exceptions
      model5: Claude Opus
platformHub:
  title: Comment fonctionne la plateforme Tale ?
  description: Tale réunit collègues et agents IA dans un espace de projet. Planifie les
    tâches sur des tableaux, délègue-les aux agents dans leurs sandboxes et
    examine les résultats avec leur contexte et leurs fichiers.
  modulesHeading: Modules plateforme
  modulesDescription: Les projets organisent le travail. Les agents exécutent les tâches
    attribuées. Le chat et les connaissances fournissent le contexte. Les
    automatisations rendent les étapes réutilisables ; la gouvernance définit
    les accès et les validations.
  tour:
    heading: Comment la plateforme s’assemble
    description: Planifie un projet, équipe les agents pour ses tâches et examine leurs
      résultats. Les connaissances, le chat et les workflows réutilisables
      soutiennent le travail de ton équipe.
    stages:
      - id: agents
        eyebrow: Agents
        title: |-
          Des agents pour
          les tâches du projet
        description:
          Configure les agents de projet avec un moteur pris en charge, un
          modèle et des outils. Attribue-leur des tâches et suis leur
          progression avec ton équipe.
      - id: projects
        eyebrow: Projets
        title: Isole par équipe
        description:
          Réunis tâches, agents, fichiers et consignes dans un projet. Définis
          son accès et partage explicitement les chats que ton équipe doit
          pouvoir lire.
  faq:
    heading: FAQ plateforme
    items:
      - q: Qu’est-ce que la plateforme dans Tale ?
        a:
          Tale est un espace de projet open source pour les équipes et les
          agents IA. Planifie les tâches, délègue le travail, suis la
          progression et examine les résultats avec un contexte partagé et des
          workflows réutilisables.
      - q: Quels modules Tale inclut-il ?
        a:
          Chat, Projets, Connaissances, Agents, Automatisations et Gouvernance — les Projets
          isolent le travail, les fichiers et les agents par équipe.
      - q: Tale est-il open source ?
        a: Oui. Community est sous licence MIT et gratuite en auto-hébergement.
          Enterprise ajoute support et services sur la même base de code.
      - q: Par où commencer ?
        a:
          Commence par un projet et une tâche dont tu peux évaluer le
          résultat. Ajoute les fichiers utiles, attribue un agent configuré,
          lance-le et examine ce qu’il produit.
  demos:
