platformChat:
  eyebrow: Chats
  title: Pose des questions, compare, puis confie le travail à un agent
  description: Utilise le chat pour comprendre un problème, consulter les sources du
    projet et préparer des consignes. Si le travail nécessite des fichiers, du
    code ou des outils, crée une tâche de projet et attribue-la à un agent.
  capabilities:
    heading: Que comprend Chat ?
    description: Examine une question, vérifie les sources et prépare la prochaine tâche.
    items:
      - title: Choisir un modèle
        body:
          Choisis un modèle et son fournisseur, ou laisse Auto sélectionner un
          modèle pour chaque message selon les règles de ton organisation.
        docsLabel: Les bases du chat
      - title: Vérifier les sources
        body:
          Ouvre les documents et pages utilisés dans une réponse. Vérifie que
          les sources étayent la conclusion.
        docsLabel: Les bases du chat
      - title: Comparer deux modèles dans Arena
        body:
          Envoie la même demande avec le même contexte initial à deux modèles.
          Lis les deux réponses et choisis comment poursuivre.
        docsLabel: Mode Arena
      - title: Joindre les fichiers utiles
        body:
          Ajoute des documents, images ou enregistrements pris en charge. Le
          traitement et les capacités du modèle déterminent ce que l’assistant
          peut lire.
        docsLabel: Pièces jointes
      - title: Passer d’une question à une tâche
        body:
          Crée une tâche de projet depuis la conversation lorsqu’un agent doit
          produire des fichiers ou travailler dans une sandbox.
        docsLabel: Agents de projet
  faq:
    heading: FAQ Chat
    items:
      - q: Qu’est-ce que le chat dans Tale ?
        a:
          Le chat utilise l’assistant intégré pour les questions, la recherche
          de sources et les brouillons de texte. Il peut consulter les
          connaissances accessibles de l’entreprise et le contexte du projet
          actuel.
      - q: Faut-il configurer un agent de projet pour discuter ?
        a:
          Non. Le chat utilise l’assistant intégré de Tale et le modèle
          choisi. Les agents de projet sont des exécutants distincts auxquels
          tu attribues des tâches.
      - q: Qu’est-ce que le mode Arena ?
        a:
          Arena envoie une demande à deux modèles avec le même contexte
          initial. Tu compares leurs réponses et donnes un avis avant de
          poursuivre la conversation.
      - q: Comment transformer une conversation en travail concret ?
        a: Crée une tâche de projet depuis la conversation et attribue-la à un
          agent. Le chat lui-même n’exécute pas de code, ne modifie pas les
          systèmes connectés et ne produit pas de fichiers livrables.
          L’avancement et les résultats de la tâche restent liés à la
          conversation.
  docs:
    - label: Vue d’ensemble Chat
      path: /platform/chat/overview
    - label: Bases du Chat
      path: /platform/chat/basics
    - label: Mode Arena
      path: /platform/chat/arena-mode
    - label: Agents de projet
      path: /platform/agents/concepts
    - label: Pièces jointes
      path: /platform/chat/attachments
  tour:
    heading: Comment Chat fonctionne dans Tale
    description:
      Examine le problème dans le chat, puis utilise les tâches de projet et
      les automatisations pour la suite du travail.
    stages:
      - id: projects
        eyebrow: Projets
        title: |-
          Garder les échanges
          avec le travail
        description:
          Utilise les chats du projet pour leur contexte commun et choisis les
          conversations à partager avec ses membres. Tâches, fichiers et
          instructions restent dans le même projet.
      - id: knowledge
        eyebrow: Connaissances
        title: |-
          Vérifier les réponses
          à partir des sources
        description:
          Le chat peut consulter les connaissances et fichiers de projet
          accessibles. Ouvre les sources d’une réponse et vérifie-les avant
          d’utiliser le résultat.
  demos:
    arena:
      label:
        "Illustration : deux modèles rédigent une annonce à partir des mêmes
        consignes de version dans Arena."
      prompt: Rédige une annonce à partir des consignes de version jointes.
      modelA: Claude Sonnet
      modelB: GPT-5.5
      replyA1: Commence par l’amélioration principale décrite dans les consignes.
      replyA2:
        Explique à qui elle est utile et cite la note de version
        correspondante.
      replyA3: Termine par la prochaine étape documentée.
      replyB1: Pars du problème client auquel répond cette version.
      replyB2: Énumère les changements et relie chacun à sa source.
      replyB3: Termine par les modalités de déploiement indiquées dans les consignes.
    projects:
      label:
        "Illustration : les projets rassemblent les chats, tâches, fichiers et
        agents liés au même travail."
      project1: Fils support
