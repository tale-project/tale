platformChat:
  eyebrow: Chats
  title: Chats dans Tale
  description: 'Chat est le point d’entrée quotidien : choisis un agent (ou
    aucun), tape, et une réponse arrive en streaming avec citations, appels
    d’outils et comparaisons Arena optionnelles — la surface dans laquelle
    chaque autre module plateforme alimente.'
  capabilities:
    heading: Que comprend Chat ?
    description: L’IA du quotidien qui cite ses sources, appelle tes outils et
      compare les modèles côte à côte.
    items:
      - title: Composer avec routage Auto
        body:
          Le composer porte le sélecteur d’agent et de modèle. Auto laisse Tale
          choisir le modèle pour le fil.
        docsLabel: Bases du Chat
      - title: Citations sur chaque réponse ancrée
        body:
          Les passages récupérés portent leur source pour que les lecteurs ouvrent
          le fichier, l’entrée ou la page utilisée par la réponse.
        docsLabel: Bases du Chat
      - title: Mode Arena
        body:
          Compare modèles ou agents côte à côte quand tu as besoin d’un second avis
          avant de t’engager.
        docsLabel: Mode Arena
      - title: Pièces jointes et Canvas
        body:
          Téléverse les fichiers pris en charge ; ouvre Canvas quand la réponse a
          besoin d’un long document ou diagramme à côté du fil.
        docsLabel: Pièces jointes
      - title: Agents dans le fil
        body:
          Change d’agent en cours de fil, lance des spécialistes ponctuels ou garde
          un agent fixe pour la conversation.
        docsLabel: Agents dans Chat
  faq:
    heading: FAQ Chat
    items:
      - q: Qu’est-ce que Chat dans Tale ?
        a:
          Tale Chat est la surface quotidienne où tu choisis un agent, envoies un
          message et lis une réponse streamée avec citations et appels d’outils.
      - q: Chat fonctionne-t-il sans agent ?
        a:
          Oui. Le chat brut utilise les défauts du modèle en exploration ; passe à un
          agent quand la même question reviendra.
      - q: Qu’est-ce que le mode Arena ?
        a:
          Le mode Arena exécute le même prompt contre plus d’un modèle ou agent pour
          comparer les réponses avant de choisir.
      - q: Le chat peut-il agir, ou seulement répondre ?
        a: Les deux. Quand une réponse appellerait une connector ou lancerait un
          workflow, l’action attend d’abord sur une carte d’approbation dans le
          fil — là où le travail se fait.
  docs:
    - label: Vue d’ensemble Chat
      path: /platform/chat/overview
    - label: Bases du Chat
      path: /platform/chat/basics
    - label: Mode Arena
      path: /platform/chat/arena-mode
    - label: Agents dans Chat
      path: /platform/chat/agents-in-chat
    - label: Pièces jointes
      path: /platform/chat/attachments
  tour:
    heading: Comment Chat fonctionne dans Tale
    description:
      D’une réponse ancrée à Arena, aux approbations, à Knowledge et aux
      projets découpés — les mêmes surfaces qu’au quotidien.
    stages:
      - id: govern
        eyebrow: Approbations
        title: |-
          Les approbations vivent
          dans le fil
        description: Quand une réponse posterait sur Slack, enverrait un mail ou
          changerait un système, une carte d’approbation arrive dans le fil
          avant tout envoi.
      - id: projects
        eyebrow: Projets
        title: |-
          Les fils restent
          avec leur équipe
        description:
          Un fil appartient à son espace de travail. Les brouillons de
          l’agent Comms restent chez Comms — l’ingénierie n’a jamais à les faire
          défiler.
      - id: agents
        eyebrow: Agents
        title: |-
          Choisis l’agent
          qui possède la question
        description:
          Change de spécialiste en cours de fil ou laisse Auto router —
          chaque agent porte ses instructions, son savoir et ses outils.
      - id: knowledge
