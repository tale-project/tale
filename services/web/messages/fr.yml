platformAutomations:
  eyebrow: Automatisations
  title: Que sont les automatisations dans Tale ?
  description: Les automatisations rendent le travail récurrent réutilisable. Relie
    appels de modèles, étapes d’agents et actions dans un workflow versionné,
    teste-le et lance-le à la demande ou avec un déclencheur configuré.
  capabilities:
    heading: Définir et répéter le processus
    description: Garde les étapes, versions, déclencheurs et historiques ensemble pour
      que l’équipe puisse examiner comment le travail récurrent est réalisé.
    items:
      - title: Versions enregistrées et déploiement
        body:
          Enregistre une nouvelle version quand le workflow change. Déploie
          celle que les prochaines exécutions réelles utiliseront ; les
          exécutions en cours conservent leur version de départ.
        docsLabel: Concepts des automatisations
      - title: Étapes de workflow typées
        body:
          Combine appels de modèles, travail d’agents en sandbox,
          transformations de données, sous-automatisations et actions
          connectées. Ajoute des conditions ou des répétitions lorsque l’étape
          les prend en charge.
        docsLabel: Éditeur workflow
      - title: Déclencheurs adaptés au travail
        body:
          Plannings (cron), webhooks, événements plateforme ou un run de test manuel
          depuis l’éditeur.
        docsLabel: Déclencheurs
      - title: Journaux d’exécution
        body:
          Examine l’état, les entrées, les sorties et le détail des étapes
          d’une exécution. Consulte les effets consignés des Connectors pour
          vérifier ce qui s’est passé.
        docsLabel: Journaux d’exécution
      - title: Approbations dans la boucle
        body:
          Les règles des Connectors peuvent suspendre les écritures protégées
          jusqu’à leur approbation. Une étape d’agent peut aussi demander les
          informations manquantes à une personne avant de continuer.
        docsLabel: Concepts des automatisations
  faq:
    heading: FAQ automations
    items:
      - q: Qu’est-ce qu’une automation dans Tale ?
        a:
          Une automatisation définit un workflow réutilisable avec des
          entrées, des étapes et des sorties. Les versions, le déploiement,
          les déclencheurs et l’historique permettent à ton équipe de tester
          et d’exploiter ce processus.
      - q: Existe-t-il un produit workflow autonome ?
        a:
          Non. Un workflow vit dans son automation. L’onglet Éditeur de l’automation
          est là où tu rencontres le graphe.
      - q: Quand utiliser une automation plutôt qu’un agent ?
        a: Utilise une automatisation pour des étapes réutilisables, des
          conditions, des horaires ou des actions connectées. Confie à un
          agent de projet une tâche dont tu examineras le résultat. Une
          automatisation peut inclure le travail d’un agent.
      - q: Puis-je tester un workflow avant de le planifier ?
        a:
          Oui. Teste une version enregistrée avant de la déployer ou d’activer
          un déclencheur. Les tests simulent les opérations des Connectors.
          Les exécutions réelles peuvent modifier les systèmes connectés et
          demander une approbation.
  docs:
    - label: Concepts des automatisations
      path: /platform/automations/concepts
    - label: Éditeur workflow
      path: /platform/automations/editor
    - label: Déclencheurs
      path: /platform/automations/triggers
    - label: Journaux d’exécution
      path: /platform/automations/execution-logs
    - label: Automatisations intégrées
      path: /platform/automations/builtin
  tour:
    heading: Comment les automatisations tournent dans Tale
    description:
      Définis le processus, choisis les étapes et les données nécessaires,
      puis examine chaque exécution. Configure les règles d’approbation des
      écritures protégées des Connectors.
    stages:
      - id: govern
        eyebrow: Approbations
        title: |-
          Human-in-the-loop
          avant l’envoi
        description:
          Lorsqu’une règle exige une approbation, une écriture de Connector
          attend la décision d’une personne. L’approbation autorise la
          tentative d’exécution ; le refus l’empêche.
      - id: agents
        eyebrow: Agents
        title: |-
          Confie à un agent
          une étape du workflow
        description: Configure une étape d’agent avec son moteur, son modèle, ses
          consignes et son équipement. Utilise un appel de modèle lorsqu’une
          seule réponse suffit.
