platformAgents:
  eyebrow: Agents
  title: Que sont les agents dans Tale ?
  description: Les agents de projet travaillent sur les tâches avec ton équipe. Donne à
    chacun des consignes, un moteur pris en charge, un modèle et des outils,
    puis suis son travail dans la sandbox et examine ses rapports et fichiers.
  capabilities:
    heading: Que peuvent faire les agents ?
    description:
      Configure des agents réutilisables pour les tâches du projet, de la
      recherche et la préparation de documents aux modifications de code et à
      leur examen.
    items:
      - title: Un rôle et un moteur définis
        body:
          Choisis un moteur, un modèle et un fournisseur compatibles, des
          consignes permanentes et l’équipement nécessaire au travail.
        docsLabel: Concepts agents
      - title: Environnements d'agent pris en charge
        body:
          Lie Claude Code, Codex, Hermes et OpenClaw comme environnement d'agent sur lequel
          tourne un agent de projet ou un nœud agent d’automation.
        docsLabel: Environnements d'agent
      - title: Délégation entre agents
        body:
          Un agent de coordination équipé pour cela peut lancer d’autres
          agents sur les tâches prêtes du même projet, dans les limites de
          délégation, d’accès et de capacité.
        docsLabel: Automatisation des tâches
      - title: Skills comme bundles réutilisables
        body:
          Fournis aux agents des consignes réutilisables et des fichiers
          d’appui sous forme de skills, par exemple pour préparer des
          documents ou examiner des modifications.
        docsLabel: Agents de projet
      - title: Des outils pour le contexte du projet
        body:
          Accorde les outils de la plateforme dont l’agent a besoin pour
          trouver des tâches, lire des fichiers et consulter les
          connaissances. Les règles d’accès aux sources restent applicables.
        docsLabel: Base de connaissances
  faq:
    heading: FAQ agents
    items:
      - q: Qu’est-ce qu’un agent dans Tale ?
        a:
          Un agent de projet est un exécutant réutilisable dans un projet. Son
          moteur, son modèle, ses consignes et ses outils définissent sa façon
          de traiter les tâches. Ses rapports et fichiers restent associés à
          la tâche pour examen.
      - q: Peut-on utiliser nos propres abonnements ou clés API ?
        a:
          Oui. Connecte tes accès API, ou utilise un abonnement Anthropic
          compatible avec Claude Code ou un abonnement ChatGPT avec Codex pour
          les agents de tâches et d’automatisations. Un administrateur
          configure les accès ou le broker de jetons. Le chat nécessite des
          accès API ; la disponibilité et les limites des abonnements
          dépendent du fournisseur et de l’offre.
      - q: Quand utiliser un agent plutôt qu’un workflow ?
        a:
          Utilise un agent de projet pour un résultat qui demande des outils,
          des fichiers ou plusieurs étapes de travail. Choisis une
          automatisation pour définir des étapes, conditions ou déclencheurs
          réutilisables.
      - q: Chaque agent peut-il utiliser un modèle différent ?
        a:
          Oui. Choisis un modèle et un fournisseur par agent de projet, selon
          la compatibilité du moteur et les modèles disponibles dans ton
          organisation. Les changements s’appliquent aux exécutions suivantes.
  docs:
    - label: Concepts agents
      path: /platform/agents/concepts
    - label: Agents de projet
      path: /platform/projects/project-agents
    - label: Environnements d'agent
      path: /platform/agents/harnesses
    - label: Automatisation des tâches
      path: /platform/projects/task-automation
    - label: Base de connaissances
      path: /platform/knowledge/overview
  tour:
