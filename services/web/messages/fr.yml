platformGovernance:
  eyebrow: Gouvernance
  title: Qu’est-ce que la gouvernance dans Tale ?
  description:
    'La gouvernance est la couture entre initiative d’agent et jugement
    humain : les cartes d’approbation retiennent les actions jusqu’à décision,
    chaque décision atterrit dans le journal d’audit, et les dépenses restent
    visibles — sans boîte d’approbation séparée.'
  capabilities:
    heading: Que couvre la gouvernance ?
    description: Mets une personne dans la boucle là où ça compte — avec journal
      d’audit, contrôles de budget et des filtres qui gardent les données
      sensibles hors des prompts et des réponses.
    items:
      - title: Cartes d’approbation dans Chat
        body:
          Plans, écritures de documents, écritures Knowledge, appels d’connector,
          outils MCP et exécutions de workflow font pause jusqu’à approbation ou
          rejet.
        docsLabel: Concepts approbation
      - title: Suggérer des changements sur connectors
        body:
          Décris ce qui ne va pas ; l’agent révise l’appel au lieu d’abandonner le
          travail.
        docsLabel: Concepts approbation
      - title: Piste d’audit
        body:
          Chaque décision enregistre acteur, action et horodatage. Les cartes
          résolues restent dans la transcription.
        docsLabel: Journaux d’audit
      - title: Guardrails et politiques
        body:
          Les guardrails de l’organisation et la politique d’exécution de code
          fixent les limites de ce que les agents peuvent tenter — avant même
          qu’une carte apparaisse.
        docsLabel: Guardrails
      - title: PII filtrées dans les deux sens
        body:
          Chaque message de chat passe par la sécurité du contenu, la détection de
          PII et, en option, un fournisseur de modération — à l’entrée comme à
          la sortie. Les correspondances sont bloquées, masquées ou signalées ;
          le texte détecté n’est jamais stocké.
        docsLabel: Guardrails
      - title: Visibilité des dépenses
        body:
          Les analytics d’usage et budgets gardent les dépenses modèles visibles
          pour les admins.
        docsLabel: Analytics d’usage
  faq:
    heading: FAQ gouvernance
    items:
      - q: Qu’est-ce que la gouvernance dans Tale ?
        a: La gouvernance Tale retient les actions d’agent derrière des cartes
          d’approbation dans Chat, écrit les décisions dans le journal d’audit
          et rend les dépenses visibles aux admins.
      - q: Y a-t-il une boîte d’approbation séparée ?
        a:
          Non. Les approbations se décident dans la conversation qu’elles interrompent,
          par quiconque tient ce chat.
      - q: Puis-je choisir quelles actions demandent une approbation ?
        a:
          Oui. Les approbations sont configurables par type d’action — plans, écritures
          de documents et de Knowledge, appels d’connector, outils MCP et
          exécutions de workflow peuvent chacun exiger une décision humaine
          avant de s’exécuter.
      - q: Les agents peuvent-ils envoyer des emails sans approbation ?
        a:
          Pas si tu exiges une approbation pour ça. Les actions sortantes attendent en
          cartes dans le chat jusqu’à ce que quelqu’un tranche — tu choisis
          quels types d’actions demandent une décision.
      - q: Comment Tale aide-t-il pour le RGPD et les PII ?
        a: Traite les données sur une infrastructure que tu contrôles, laisse la
          détection de PII masquer les données personnelles avant qu’elles
          n’atteignent ou ne quittent un modèle, et montre le journal d’audit
          aux auditeurs. Tale est conforme au RGPD, certifié ISO 27001 et SOC 2
          Type II — le DPA et les mesures techniques et organisationnelles sont
          publiés.
  docs:
    - label: Concepts approbation
      path: /platform/approvals/concepts
    - label: Configurer approbations
      path: /platform/approvals/configure
    - label: Approbations dans workflows
      path: /platform/automations/approvals-in-workflows
    - label: Journaux d’audit
      path: /platform/admin/governance/audit-logs
    - label: Guardrails
      path: /platform/admin/governance/guardrails
  tour:
    heading: Comment la gouvernance tient la ligne
    description: Approuve avant l’envoi, audite chaque run, compare les modèles
      honnêtement et garde les agents dans tes règles.
    stages:
      - id: automations
        eyebrow: Automatisations
        title: |-
          Chaque run verrouillé
          laisse un journal
        description:
          'Une revue d’accès tourne chaque nuit et alerte #security sur les
          nouveaux droits admin — chaque exécution numérotée dans le même
          journal que remplissent les approbations.'
      - id: arena
        eyebrow: Arena
        title: |-
          Compare avant
          de t’engager
        description:
          C’est sur les formulations sensibles que les modèles divergent.
          Arena rédige deux fois la même réponse pour que la version la plus
          sûre parte.
      - id: agents
        eyebrow: Agents
        title: |-
          Les agents restent dans
          budgets et outils
        description:
          Contrôles de dépense et droits d’outils voyagent avec chaque agent
          — la gouvernance n’est pas un add-on.
      - id: knowledge
        eyebrow: Connaissances
        title: |-
          Cite la politique
          qui a autorisé la réponse
        description:
          Les réponses fondées montrent les sources de politique et de
          runbook — les auditeurs suivent la même piste.
  demos:
    govern:
      label: 'Démo animée : un agent demande à publier trois entrées Knowledge
        capturées dans un fil ; une personne approuve, et la décision atterrit
        dans le journal d’audit.'
      approvalTitle: Publier 3 entrées Knowledge depuis ce fil ?
      requester: Agent Politique · Écriture Knowledge
      audit1: Approuvé par lena@nordwind.eu
      audit2: 3 entrées ajoutées à la bibliothèque Politique
      audit3: 'Entrée d’audit #8841 écrite'
      budgetValue: CHF 220 / 800
    automation:
      label: 'Démo animée : une revue d’accès planifiée vérifie chaque nuit les
        changements de permissions et alerte #security dès qu’apparaissent de
        nouveaux droits admin.'
      trigger: Chaque jour
      llm: Revue d’accès
      condition: Nouvel admin ?
      branchYes: Oui
      action: 'Alerte #security'
      actionAlt: Archiver
      run1: '#98'
      runTone1: done
      duration1: 3,4 s
      run2: '#99'
      runTone2: done
      duration2: 3,1 s
      run3: '#100'
      runTone3: running
      duration3: 0,6 s
    arena:
      label:
        'Démo animée : deux modèles rédigent la même réponse d’exception d’accès
        côte à côte, pour que la formulation la plus sûre parte.'
      prompt:
        Un prestataire demande l’admin sur l’org staging hors politique d’accès
        — rédige la réponse.
      agent: Agent Accès
      modelA: Claude Sonnet
      modelB: GPT-5.5
      replyA1: Refuse l’admin permanent et cite la clause least-privilege.
      replyA2: Propose un grant break-glass limité dans le temps avec Audit.
      replyA3: Passe à Security s’ils ont besoin de la production.
      replyB1: Reconnais la deadline avant de rappeler la fenêtre d’accès.
      replyB2:
        Suggère un rôle lecture seule plus un ingénieur en binôme comme chemin
        documenté.
      replyB3: Signale la demande pour la revue hebdo des exceptions d’accès.
    knowledge:
      label:
        'Démo animée : le corpus de politiques que les auditeurs peuvent ouvrir —
        la politique d’usage de l’IA, le crawl de la page trust, une entrée sur
        les données et le registre des risques modèles.'
      source1: politique-usage-ia.pdf
      sourceType1: pdf
      source2: trust.nordwind.eu
      sourceType2: website
      source3: Règles de traitement des données
      sourceType3: entry
      source4: registre-risques-modeles.pdf
      sourceType4: pdf
    connect:
      label:
        'Démo animée : agents avec contrôles de budget et droits d’outils — agent
        Politique, agent Audit, agent Budget, agent Accès et agent Exceptions.'
      agent1: Agent Politique
      model1: Claude Sonnet
      agent2: Agent Audit
      model2: Claude Opus
      agent3: Agent Budget
      model3: GPT-5.5
      agent4: Agent Accès
      model4: Claude Sonnet
      agent5: Agent Exceptions
      model5: Claude Opus
platformHub:
  title: Comment fonctionne la plateforme Tale ?
  description: 'Tale est l’orchestrateur pour agents IA : un seul endroit où tes
    agents partagent leurs connaissances, exécutent des automatisations et
    répondent aux mêmes approbations — auto-hébergé, à tes conditions.'
  modulesHeading: Modules plateforme
  modulesDescription: Six modules — chacun utile seul ; ensemble, un système
    gouverné de bout en bout. Ouvre un module pour sa propre visite.
  tour:
    heading: Comment la plateforme s’assemble
    description: Chaque fenêtre ci-dessous est un module qui raconte sa propre
      histoire — ancrée dans Knowledge, exécutée par Automations, retenue par
      Governance, comparée dans Arena. Ouvre un module pour la visite complète.
    stages:
      - id: agents
        eyebrow: Agents
        title: |-
          Chaque agent,
          un seul roster
        description:
          Claude Code, Codex, Hermes, OpenClaw — accrochés à côté des agents
          produit pour router le travail vers l’outil que ton équipe utilise
          déjà.
      - id: knowledge
        eyebrow: Connaissances
        title: |-
          Une bibliothèque,
          citée partout
        description:
          Le manuel produit, le crawl des docs, la liste de prix, une entrée
          FAQ — une bibliothèque indexée que chaque agent cite.
      - id: automations
        eyebrow: Automatisations
        title: |-
          Délègue le travail
          multi-étapes
        description:
          Une pipeline de factures extrait les lignes, retient tout montant
          au-dessus de CHF 5 000 et classe le reste dans l’ERP — chaque run
          journalisé.
      - id: govern
        eyebrow: Gouvernance
        title: |-
          Retenu jusqu’à
          la décision
        description:
          Même une écriture de connaissances attend une personne. Approuve,
          et la décision atterrit au journal d’audit, budget sous les yeux.
      - id: arena
        eyebrow: Arena
        title: |-
          Deux brouillons,
          un brief
        description: Un brief d’annonce, deux modèles côte à côte — le meilleur
          brouillon part.
      - id: projects
        eyebrow: Projets
        title: Isole par équipe
        description:
          Chaque fenêtre ci-dessus a tourné dans un espace de travail. Les
          projets décident quels agents, bibliothèques et membres vont ensemble
          — et qui voit les runs.
  faq:
    heading: FAQ plateforme
    items:
      - q: Qu’est-ce que la plateforme dans Tale ?
        a:
          'Tale est un orchestrateur auto-hébergé pour agents IA : connecte les agents,
          met le savoir en commun, lance des automatisations et gouverne chaque
          action — sur une infrastructure que tu fais tourner.'
      - q: Quels modules Tale inclut-il ?
        a:
          Chat, Projets, Knowledge, Agents, Automations et Governance — les Projets
          isolent le travail, les fichiers et les agents par équipe.
      - q: Tale est-il open source ?
        a: Oui. Community est sous licence MIT et gratuite en auto-hébergement.
          Enterprise ajoute support et services sur la même base de code.
      - q: Par où commencer ?
        a:
          Ouvre Chat pour une réponse fondée, ou Agents pour accrocher Claude Code,
          Codex, Hermes et OpenClaw sous un seul orchestrateur.
