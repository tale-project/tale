platformAutomations:
  eyebrow: Automations
  title: Que sont les Automations dans Tale ?
  description: Une automation regroupe connectors, agents, un workflow et les
    vues qu’elle apporte — une Inbox, par exemple — en une unité installable. Le
    workflow à l’intérieur est un graphe d’étapes typées — LLM, Action,
    Condition, Loop, Sandbox — avec plannings, webhooks, événements et
    approbations humaines.
  capabilities:
    heading: Que contient une automation ?
    description: Compose le travail en plusieurs étapes comme un graphe typé —
      étapes LLM, Action, Condition, Loop et Sandbox — avec approbations et
      exécutions versionnées.
    items:
      - title: Bundles installables
        body:
          Les propriétaires et admins installent depuis le catalogue ; les membres
          utilisent l’Inbox, les agents ou les vues qu’elle enregistre sans
          assembler les pièces à la main.
        docsLabel: Concepts automations
      - title: Étapes de workflow typées
        body:
          Les étapes LLM, Action, Condition, Loop et Sandbox composent le graphe.
          Chaque sauvegarde crée une version que tu peux restaurer.
        docsLabel: Éditeur workflow
      - title: Déclencheurs adaptés au travail
        body:
          Plannings (cron), webhooks, événements plateforme ou un run de test manuel
          depuis l’éditeur.
        docsLabel: Déclencheurs
      - title: Journaux d’exécution
        body:
          Chaque run enregistre statut, timing, entrées et un journal par étape —
          piste d’audit et débogueur au même endroit.
        docsLabel: Journaux d’exécution
      - title: Approbations dans la boucle
        body:
          Les modifications de workflow proposées, les runs lancés par agent et les
          pauses en attente d’entrée deviennent des cartes d’approbation avant
          que le travail continue.
        docsLabel: Approbations dans workflows
  faq:
    heading: FAQ automations
    items:
      - q: Qu’est-ce qu’une automation dans Tale ?
        a:
          Une automation Tale est un paquet installable — connectors, agents, un
          workflow et des vues prêtes comme une Inbox — qui exécute un travail
          en plusieurs étapes avec déclencheurs et approbations.
      - q: Existe-t-il un produit workflow autonome ?
        a:
          Non. Un workflow vit dans son automation. L’onglet Éditeur de l’automation
          est là où tu rencontres le graphe.
      - q: Quand utiliser une automation plutôt qu’un agent ?
        a: Utilise une automation quand le travail a besoin de plusieurs étapes,
          branches, plannings ou approbations entre elles — pas quand un seul
          agent conversationnel suffit.
      - q: Puis-je tester un workflow avant de le planifier ?
        a:
          Oui. L’éditeur propose un run de test manuel — tu regardes une exécution
          complète, entrées, journal par étape et durée, avant qu’un déclencheur
          parte en production.
  docs:
    - label: Concepts automations
