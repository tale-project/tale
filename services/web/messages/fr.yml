  tour:
    title: Comment Tale orchestre tes agents IA
    subtitle: Connecte ce que tu utilises, mets ton savoir en commun, délègue le
      travail, gouverne le résultat — puis compare les modèles et isole par
      projet.
    connect:
      eyebrow: Agents & connectors
      title: |-
        Amène les agents
        que tu utilises déjà
      description:
        Claude Code, Codex, Hermes, OpenClaw — plus Slack, GitHub, Outlook
        et le reste de ta stack. Rien n’est remplacé ; tout est coordonné.
    pool:
      eyebrow: Connaissances
      title: |-
        Une base de connaissances,
        chaque réponse fondée
      description:
        Documents, sites web, données produits et contacts convergent vers
        une base de connaissances partagée. Les agents répondent avec ce que ton
        entreprise sait vraiment — sources vérifiables à l’appui.
    delegate:
      eyebrow: Automatisations
      title: |-
        Délègue le travail,
        pas le contrôle
      description:
        Les automatisations enchaînent étapes LLM, conditions et actions en
        workflows déclenchés — triage d’inbox, escalades, rapports hebdo. Chaque
        exécution laisse un journal.
    govern:
      eyebrow: Approbations & audit
      title: |-
        Approuver avant l’envoi.
        Auditer après.
      description:
        Les approbations humaines verrouillent les actions qui comptent.
        Journaux d’audit, budgets, guardrails et SSO gardent chaque agent dans
        tes règles.
    arena:
      eyebrow: Chat Arena
      title: |-
        Compare les modèles
        sur la même question
      description:
        Arena envoie une question à deux modèles côte à côte. Tu choisis la
        réponse qui convient — sans quitter le fil ni retaper la demande.
    projects:
      eyebrow: Projets
      title: |-
        Isole agents
        et savoir par équipe
      description: Les projets gardent agents, documents et membres dans le bon
        espace. Le support reste au support ; l’ingénierie garde sa propre
        stack.
    explore: Explorer {module}
  tagline:
    title: Ton infrastructure. Tes données. Tes règles.
    subtitle:
      Fais tourner l’IA à tes conditions — de l’hébergement à la gouvernance
      de chaque action.
    pillars:
      selfHosted:
        title: Auto-hébergé par défaut
        description:
          Tourne entièrement sur ton infrastructure — aucun cloud requis.
          Avec des modèles locaux, aucune donnée ne quitte ton réseau ; et rien
          ne t’attache à un fournisseur.
      security:
        title: Sécurité intégrée
        description:
          Single sign-on, détection de données sensibles, garde-fous de
          sûreté de contenu, journalisation complète et contrôles de budget —
          tout est intégré, rien n’est greffé.
      openSource:
        title: Entièrement open source
        description:
          Tout le code est public, sous licence MIT. Lis-le, audite-le,
          change ce qu’il te faut — sans demander à personne.
  connectors:
    title: Branché sur les outils que tu utilises déjà
    subtitle:
      Connecte Gmail, Slack, GitHub, Shopify et tes fournisseurs de modèles
      une seule fois par organisation — tous les agents et automatisations
      partagent les mêmes accès gouvernés.
  agents:
    title: Fonctionne avec les agents que tu utilises
    subtitle:
      Accroche Claude Code, Codex, Hermes, OpenClaw, Pi et OpenCode sous un
      orchestrateur que tu héberges.
  compliance:
    eyebrow: SÉCURITÉ
    title: Une conformité que tu peux vérifier
    independent:
      title: Indépendant et transparent
      description:
        Basé en Suisse et neutre vis-à-vis des fournisseurs — sans lien
        avec un fournisseur de cloud ou de modèles, pour que ton déploiement ne
        réponde qu’à toi.
    certified:
      title: Certifié et conforme
      description:
        Certifié ISO 27001 et SOC 2 Type II, conforme au RGPD — journaux
        d’audit et contrôles des données te disent toujours où sont stockées tes
        données.
  faq:
    eyebrow: FAQ
    title: Questions fréquentes
    stillQuestions: Encore des questions ?
    contactTeam: Contacter l’équipe
    whatIsTale:
      q: Qu’est-ce que Tale ?
      a: 'Tale est une plateforme open source et auto-hébergée qui orchestre les
        agents IA : elle connecte les agents et CLI que ton équipe utilise déjà,
        met leurs connaissances en commun dans une base gouvernée et exécute des
        automatisations avec approbation humaine — sur ta propre infrastructure
        ou dans un cloud géré en Suisse ou dans l’UE.'
    openSource:
      q: Tale est-il open source ?
      a: Oui. Tale est sous licence MIT et toutes les fonctionnalités sont dans
        l’édition Community gratuite — Enterprise ajoute du support et des
        services, pas des fonctionnalités.
    onPrem:
      q: Tale peut-il tourner entièrement on-premises ou en environnement isolé ?
      a:
        Oui. Tale s’auto-héberge dans ton VPC, sur ton matériel ou totalement isolé
        du réseau ; avec des modèles locaux, tes données ne quittent jamais ton
        réseau.
    enterprisePricing:
      q: Comment fonctionne la tarification Enterprise ?
      a:
        Enterprise est facturé par utilisateur et par mois, avec deux mois offerts en
        paiement annuel. Le stockage au-delà du quota inclus est facturé par
        To/mois. L’édition Community reste gratuite pour un usage auto-hébergé.
    enterpriseFeatures:
      q: Y a-t-il des fonctionnalités supplémentaires dans le forfait Enterprise ?
      a:
        Non. Toutes les fonctionnalités du produit sont également disponibles dans la
        version open source. Enterprise ajoute un support et des services
        étendus.
    byoModels:
      q: Dois-je apporter mes propres modèles d’IA ?
      a:
        Non. Tu peux apporter tes propres modèles, sans obligation. Tale prend en
        charge la plupart des grands fournisseurs d’IA sans majoration — l’usage
        cloud est facturé aux tarifs de ton fournisseur et n’est pas inclus dans
        les plans.
    aiProviders:
      q: Puis-je utiliser mon fournisseur d’IA préféré ?
      a:
        Oui. Tale prend en charge les grands fournisseurs d’IA cloud sans marge —
        l’usage est facturé aux tarifs de ton fournisseur. Tu gardes ton
        fournisseur et ta facturation actuelle.
    hardware:
      q: Le matériel est-il aussi proposé ?
      a:
        Oui — le matériel est disponible en location, leasing ou achat. Mentionne-le
        quand tu contactes l’équipe et tu recevras un devis pour la
        configuration adaptée.
    ownHardwareModels:
      q: Puis-je utiliser mon propre matériel et mes propres modèles d’IA ?
      a:
        Oui. Tale est agnostique au matériel et aux modèles — tu peux utiliser les
        tiens.
    customTraining:
      q: L’entraînement de modèles d’IA sur mesure est-il proposé ?
      a:
        Oui. L’entraînement et le fine-tuning de modèles sur mesure sont disponibles
        pour les clients. Aborde-le pendant l’appel de démo si tu en as besoin.
  cta:
    title: Déploie Tale sur ton infrastructure.
    description: Orchestre tes agents IA sur une stack souveraine que tu fais
      tourner toi-même — contacte-nous, ou lance-la en quatre commandes.
    primary: Demander une démo
    getStarted: Démarrer
    terminalTitle: Auto-héberge en quatre commandes
    copy: Copier
    copied: Copié
    docsLink: Guide d'installation complet
