seo:
  ogImageAlt: Logo Tale
  home:
    title: "Tale : projets en équipe avec des agents IA"
    description: Planifie tes projets, délègue des tâches aux agents IA et examine les
      résultats en équipe. Un espace open source avec sandboxes, contexte
      partagé et workflows.
  pricing:
    title: Combien coûte Tale ? — Community & Enterprise
    description:
      'Tale Enterprise : CHF 12 (EUR 14) par utilisateur/mois, deux mois
      offerts en annuel. Community est gratuite en auto-hébergement sous MIT.'
  contact:
    title: Contacter l’équipe Tale — ventes, support, démos
    description:
      "Parle à l’équipe Tale de la collaboration avec les agents IA : projets,
      déploiement, tarifs ou démonstration adaptée à ton équipe."
  about:
    title: Qui est derrière Tale ? — À propos de Ruler GmbH
    description: "Ruler GmbH, à Spiez en Suisse, construit Tale : un espace de projet
      sous licence MIT où les équipes coordonnent des agents IA et examinent
      leur travail."
  requestDemo:
    title: Demander une démo Tale — visite guidée
    description:
      Apporte une tâche à résoudre en équipe. Vois comment Tale coordonne
      collègues et agents IA avec des tableaux de projet, des sandboxes et des
      validations.
  hardwarePricing:
    title: Combien coûte le hardware AI Tale ?
    description:
      'Hardware d’inférence silencieux, du nœud unique au rack : location,
      leasing ou achat. Sur site avec maintenance à distance, ou en centres de
      données sécurisés.'
  platform:
    title: Coordonner agents IA et projets | Tale
    description: Réunis collègues, agents IA, tâches et fichiers dans un même espace.
      Tale relie tableaux de tâches, sandboxes, connaissances et workflows
      réutilisables.
  platformAgents:
    title: Agents IA pour les tâches de projet | Tale
    description:
      Configure les consignes, les outils et le moteur de tes agents, comme
      Claude Code ou Codex. Attribue des tâches et examine les fichiers qu’ils
      produisent.
  platformChat:
    title: Chat IA, sources et tâches de projet | Tale
    description: Pose des questions, vérifie les sources, compare deux modèles dans Arena
      et transforme une conversation en tâche pour un agent IA dans Tale.
  platformAutomations:
    title: Workflows réutilisables avec des agents IA | Tale
    description:
      Transforme les tâches récurrentes en workflows avec agents, conditions,
      connecteurs et approbations. Lance-les à la demande, sur horaire ou par
      webhook.
  platformKnowledge:
    title: Connaissances partagées pour travailler avec l’IA | Tale
    description: Donne du contexte au travail de l’IA. Indexe documents, sites web et
      fiches de connaissances, retrouve les sources accessibles et vérifie les
      citations.
  platformGovernance:
    title: Gouvernance IA, approbations et limites d’usage | Tale
    description: Configure les approbations des connecteurs, consulte les actions
      enregistrées et définis les budgets et filtres du chat de ton équipe
      dans Tale.
  platformProjects:
    title: Tableaux de tâches pour équipes et agents IA | Tale
    description: Planifie le travail avec tes collègues et tes agents IA sur un tableau
      partagé. Garde tâches, fichiers, conversations et validations dans le
      même projet.
  changelog:
    title: Quoi de neuf dans Tale ? — Changelog
    description: Les notes de version de Tale, de la plus récente à la plus
      ancienne — fonctionnalités, correctifs et changements de rupture, publiés
      depuis GitHub Releases.
