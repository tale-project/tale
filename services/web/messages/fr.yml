pricingPage:
  relatedHeading: À suivre
  ctaTitle: Mets un chiffre sur ta configuration
  ctaDescription: Demande une démo ou parle à l’équipe des sièges Enterprise, du
    stockage et du matériel.
  faq:
    heading: FAQ tarifs
    items:
      - q: Combien coûte Tale Enterprise ?
        a:
          Tale Enterprise coûte 12 CHF (14 €) par utilisateur et par mois, avec deux
          mois offerts en facturation annuelle. Le stockage coûte 10 CHF (12 €)
          par To et par mois.
      - q: Community est-il gratuit ?
        a: Oui. L’édition Community est gratuite à auto-héberger sous licence MIT.
      - q: Puis-je acheter du matériel avec le logiciel ?
        a:
          Oui. Du matériel d’inférence silencieux est disponible en location, leasing
          ou achat — vois les tarifs matériel.
