      replyA2:
        Enchaîne avec deux lignes sur l’indexation plus rapide et le nouvel
        export d’audit.
      replyA3: Termine par le chemin de mise à niveau et un lien vers le changelog.
      replyB1: 'Commence par ce que les pilotes demandaient : une installation
        air-gapped plus simple, livrée.'
      replyB2: Liste les trois nouveautés en puces courtes avec liens vers la doc.
      replyB3: Finis par un merci aux premiers contacts et la commande de mise à niveau.
