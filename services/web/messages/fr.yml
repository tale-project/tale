      members1: '8'
      project2: Chat ingénierie
      agents2: 5 agents
      members2: '11'
      project3: Brouillons Comms
      agents3: 2 agents
      members3: '4'
      project4: Salle de pilotage
      agents4: 3 agents
      members4: '6'
    knowledge:
      label:
        'Démo animée : les sources que Chat récupère pour une réponse ancrée — le
        PDF des notes de version, le crawl du changelog, le modèle d’annonce et
        l’entrée de voix de marque.'
      source1: release-notes-2.4.pdf
      sourceType1: pdf
      source2: changelog.nordwind.eu
      sourceType2: website
      source3: Modèle d’annonce
      sourceType3: entry
      source4: Guide de ton
      sourceType4: entry
platformGovernance:
  eyebrow: Gouvernance
  title: Définis les règles de ton équipe et de tes agents
  description:
    Gère les accès, configure les approbations des connecteurs et consulte les
    actions enregistrées. Définis les budgets de modèles et les filtres du
    chat pour le travail de ton équipe et de ses agents.
  capabilities:
    heading: Que couvre la gouvernance ?
    description: Choisis les écritures des connecteurs à approuver, les outils autorisés
      aux agents et les règles de contenu et d’usage à appliquer.
    items:
      - title: Approuver les écritures des connecteurs
        body:
          Une écriture de connecteur dans une automatisation attend une
          approbation si ta politique l’exige. C’est le cas par défaut pour
          les écritures externes ; les lectures et écritures internes suivent
          d’autres règles.
        docsLabel: Comprendre les approbations
      - title: Examiner l’opération proposée
        body:
          Vérifie la destination et les entrées exactes avant d’approuver.
          Rejette une opération incorrecte, corrige le processus ou ses
          entrées, puis lance une nouvelle exécution.
        docsLabel: Comprendre les approbations
      - title: Consulter le journal d’audit
        body:
          Examine les actions et décisions d’approbation enregistrées avec
          leur auteur et leur date. Utilise le journal pour comprendre ce qui
          s’est passé.
        docsLabel: Journaux d’audit
      - title: Définir les règles de l’organisation
        body:
          Configure les instructions communes, les règles d’accès et les
          outils des agents. Les autorisations et filtres appliqués complètent
          les instructions données au modèle.
        docsLabel: Garde-fous
      - title: Configurer les filtres du chat
        body:
          Active les filtres de contenu, la détection de données personnelles
          et la modération facultative sur les entrées ou sorties du chat de
          ton choix. Teste les motifs et le comportement en cas d’erreur.
        docsLabel: Garde-fous
      - title: Définir des budgets pour l’usage mesuré
        body:
          Suis l’usage de modèles enregistré et définis des budgets sur les
          parcours pris en charge, dont les exécutions gérées d’agents. Les
          appels directs par abonnement dépendent des contrôles du
          fournisseur.
        docsLabel: Analyse de l’utilisation
  faq:
    heading: FAQ gouvernance
    items:
      - q: Que contrôle la gouvernance ?
        a: La gouvernance regroupe les règles d’accès, les approbations des
          connecteurs, les événements d’audit, les budgets d’usage et les
          filtres du chat. Chaque contrôle a son propre périmètre.
      - q: Où décider d’une approbation de connecteur ?
        a:
          Ouvre l’exécution d’automatisation en attente. Si elle travaille sur
          une tâche, la carte d’approbation y apparaît aussi. Ces approbations
          sont distinctes de la revue du résultat d’un agent.
      - q: Puis-je choisir les écritures de connecteur à approuver ?
        a:
          Oui. Tu peux configurer la politique pour un connecteur ou une
          action précise. Les écritures externes nécessitent une approbation
          par défaut. Modifier la politique ne résout pas une demande déjà en
          attente.
      - q: Chaque action d’agent attend-elle une approbation ?
        a:
          Non. Le relais de connecteurs expose les lectures aux agents ; les
          écritures soumises aux règles d’approbation passent par les nœuds
          d’automatisation. Les outils GitHub directs et les secrets accordés
          explicitement ont leurs propres accès. Vérifie aussi ces
          autorisations.
      - q: Comment s’appliquent les filtres et contrôles des données ?
        a: Les filtres du chat peuvent vérifier les entrées et sorties
          configurées. Les points d’accès de l’API de modèles filtrent
          uniquement les entrées. La détection de données personnelles dépend
          des motifs configurés. Évalue ensemble l’hébergement, les
          fournisseurs et les procédures.
  docs:
    - label: Concepts approbation
      path: /platform/approvals/concepts
    - label: Configurer approbations
      path: /platform/approvals/configure
    - label: Approbations dans workflows
      path: /platform/automations/approvals-in-workflows
    - label: Journaux d’audit
      path: /platform/admin/governance/audit-logs
    - label: Guardrails
      path: /platform/admin/governance/guardrails
  tour:
    heading: Retrouve les règles dans le travail
    description: Examine les exécutions, compare les réponses et vérifie les outils et
      sources accessibles aux agents.
    stages:
      - id: automations
        eyebrow: Automatisations
        title: |-
          Suivre l’exécution
          et ses décisions
        description:
          Un processus configuré peut examiner un rapport d’accès et préparer
          une notification. Consulte ses étapes, décisions d’approbation et
          effets enregistrés dans le détail de l’exécution.
      - id: agents
        eyebrow: Agents
        title: |-
          Choisir les outils
          nécessaires au travail
        description:
          Accorde explicitement les outils et identifiants de chaque agent.
          Les appels de modèles gérés utilisent les contrôles de la passerelle
          Tale ; les abonnements directs suivent un autre parcours.
  demos:
    govern:
      label: "Illustration : une automatisation demande une approbation avant qu’un
