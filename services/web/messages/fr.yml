about:
  hero:
    eyebrow: À propos
    title: Qui est derrière Tale ?
    description: Ruler GmbH, à Spiez en Suisse, développe Tale. Nous construisons un
      espace de projet open source où les personnes et les agents IA résolvent
      des problèmes ensemble. Notre certification ISO 27001 couvre Tale
      Enterprise et les services professionnels.
    ctaContact: Nous contacter
    ctaGithub: Voir le code
  facts:
    founded:
      label: Fondée
      value: '2020'
    location:
      label: Siège
      value: Spiez, Suisse
    certified:
      label: Certifiée
      value: Ruler GmbH · ISO 27001
    license:
      label: Licence
      value: MIT — entièrement open source
  story:
    heading: Notre histoire
    p1: Ruler GmbH a été fondée en 2020 à Spiez, dans le canton de Berne, par
      Yannick Monney. Depuis le premier jour, l’entreprise est basée en Suisse
      et neutre vis-à-vis des fournisseurs — sans lien avec un fournisseur de
      cloud ou de modèles.
    p2: Nous construisons Tale pour les entreprises qui veulent faire travailler
      des agents IA avec leurs équipes. Le travail demande des responsables,
      du contexte, de la coordination et un endroit où examiner les résultats.
      Un espace de projet partagé réunit ces éléments.
    tagline: Ton infrastructure. Tes données. Tes règles.
    p3: Tale réunit tableaux de projet, sandboxes, fichiers, connaissances et
      workflows dans un produit. Les équipes attribuent des tâches, suivent
      les agents et examinent les livrables ensemble, en choisissant leurs
      moteurs, modèles et mode de déploiement.
  product:
    heading: Ce que nous construisons
    description: "Tale est un espace open source pour les équipes et les agents IA : un
      même endroit pour planifier les projets, déléguer les tâches et examiner
      les résultats."
    orchestrator:
      title: Collègues et agents sur le même projet
      body: Confie le travail à tes collègues ou à des agents de projet. Donne aux
        agents des consignes, des outils et un moteur pris en charge, puis
        suis leurs tâches et examine leurs productions.
    openSource:
      title: Open source, sans astérisque
      body: Tout le code est public sur GitHub, sous licence MIT. La version
        Community gratuite embarque les mêmes fonctionnalités ; Enterprise
        ajoute support et services pour CHF 12 (EUR 14) par utilisateur/mois.
    deployment:
      title: Ton infrastructure ou la nôtre
      body: Auto-héberge Tale sur ton infrastructure ou choisis un hébergement
        géré en Suisse ou dans l’UE. Choisis des modèles locaux ou cloud et
        configure les services externes accessibles à l’espace de travail.
    beyond:
      title: Au-delà du logiciel
      body: Nous fournissons du matériel IA à louer, financer ou acheter pour les équipes qui exécutent des modèles sur leur propre infrastructure.
  work:
    heading: Comment nous travaillons avec les entreprises
    description: Faire travailler des agents demande un processus clair et un logiciel
      adapté. Nous aidons les équipes à préparer leurs sources, définir des
      tâches utiles et organiser la revue des résultats.
    dataQuality:
      title: Des données dignes de tes agents
      body: Nous aidons à structurer les sources, les responsabilités et la
        provenance pour que les personnes et les agents puissent trouver et
        vérifier les éléments utiles.
    regulated:
      title: À l’aise dans les environnements régulés
      body: Nous aidons les équipes à évaluer leurs besoins de déploiement,
        d’accès et de validation. La certification ISO 27001 de Ruler GmbH
        couvre Tale Enterprise et les services professionnels ; demande le
        périmètre et les justificatifs adaptés à ton organisation.
    edge:
      title: Une avance qui te reste
      body: Conserve le contexte des projets, les workflows et l’historique des
        validations à mesure que tu ajoutes des agents. Le code sous licence
        MIT et le choix des moteurs et du déploiement permettent d’adapter
        Tale au fonctionnement de ton entreprise.
    tailored:
      title: Des solutions taillées sur tes objectifs
      body: Aucune organisation n’adopte l’IA de la même façon. Nous construisons
        les agents, les automatisations, les connaissances et le matériel autour
        de ce que tu veux atteindre — et laissons de côté le reste.
  values:
    heading: Ce que nous défendons
    privacy:
      title: Tes données restent les tiennes
      body: Garde la main sur le déploiement et les modèles. Utilise l’inférence
        locale si nécessaire et vérifie les flux de données des services
        externes que tu connectes.
    neutrality:
      title: Indépendant et neutre
      body: Basé en Suisse et neutre vis-à-vis des fournisseurs — sans lien
        avec un fournisseur de cloud ou de modèles, pour que ton déploiement ne
        réponde qu’à toi.
    transparency:
      title: Transparent par défaut
      body: Une base de code publique sous licence MIT et une entreprise que tu
        peux vérifier au registre du commerce suisse. Ce que nous livrons, tu
        peux le lire.
    control:
      title: L’humain garde la main
      body: Les personnes définissent le travail, accordent les accès aux agents
        et configurent les règles de validation et d’approbation. L’équipe
        examine les livrables et l’historique avant de décider de la suite.
  cta:
    title: Parle à l’équipe
    description: Des questions sur Tale, le déploiement ou une collaboration
      avec Ruler GmbH ? Réserve une démo ou écris-nous via le formulaire de
      contact.
