platformKnowledge:
  eyebrow: Knowledge
  title: Qu’est-ce que Knowledge dans Tale ?
  description: Knowledge est la bibliothèque partagée de l’organisation —
    documents, entrées Knowledge, sites crawlés et enregistrements typés — que
    les agents récupèrent et citent pour que les réponses reflètent ta réalité,
    pas seulement les données d’entraînement.
  capabilities:
    heading: Que contient Knowledge ?
    description:
      Donne aux agents les documents, enregistrements et crawls dont ils
      ont besoin — et chaque réponse cite d’où elle vient.
    items:
      - title: Documents avec pipeline d’indexation
        body:
          Téléverse des fichiers ; Tale extrait, découpe, embed et stocke pour
          récupération avec citations.
        docsLabel: Documents
      - title: Entrées Knowledge
        body:
          Petits faits par thème — capturés depuis Chat avec approbation ou ajoutés
          à la main.
        docsLabel: Entrées Knowledge
      - title: Crawls de sites
        body:
          Indexe les pages que tes agents doivent citer sans les coller dans les
          prompts.
        docsLabel: Crawling
      - title: Enregistrements typés
        body:
          Products, Contacts et Vendors sont des lignes de champs exactes que les
          agents lisent comme données, pas comme prose.
        docsLabel: Données structurées
      - title: Portée de récupération par agent
        body:
          L’onglet Knowledge d’un agent décide quelles tranches il peut chercher ;
          les éléments d’équipe restent limités à l’équipe.
        docsLabel: Connaissances agent
  faq:
    heading: FAQ Knowledge
    items:
      - q: Qu’est-ce que Knowledge dans Tale ?
        a:
          Tale Knowledge est la bibliothèque partagée de l’organisation de documents,
          faits, sites et enregistrements typés que les agents récupèrent et
          citent dans les réponses.
      - q: Les agents voient-ils toute la bibliothèque par défaut ?
        a:
          Non. L’onglet Knowledge de chaque agent fixe la portée de récupération. Les
          éléments limités à l’équipe restent invisibles hors équipe.
      - q: Quelle différence entre documents et enregistrements typés ?
        a:
          Documents et entrées sont indexés pour récupération. Products, Contacts et
          Vendors sont des lignes structurées que les agents lisent comme
          valeurs exactes.
      - q: Les agents peuvent-ils écrire dans Knowledge, ou seulement lire ?
        a:
          Ils peuvent proposer. Les entrées capturées depuis un chat attendent sur une
          carte d’approbation ; une personne décide de ce qui entre dans la
          bibliothèque, et la décision est journalisée.
  docs:
    - label: Vue d’ensemble Knowledge
      path: /platform/knowledge/overview
    - label: Documents
      path: /platform/knowledge/documents
    - label: Entrées Knowledge
      path: /platform/knowledge/knowledge-entries
    - label: Crawling
      path: /platform/knowledge/crawling
    - label: Données structurées
      path: /platform/knowledge/structured-data
  tour:
    heading: Comment le savoir ancre Tale
    description:
      Indexe ce que ton entreprise sait, cite-le dans le chat, lie-le aux
      agents et garde les comparaisons honnêtes.
    stages:
      - id: chat
        eyebrow: Chat
        title: |-
          Chaque réponse fondée
          porte ses sources
        description:
          Les passages récupérés deviennent des cartes de citation — le
          lecteur ouvre le fichier ou la page utilisée.
      - id: agents
        eyebrow: Agents
        title: |-
          Accorde des bibliothèques
          par agent
        description:
          Un agent voit ses accès, rien de plus — ce que le juridique a
          indexé n’apparaît jamais dans un fil support.
      - id: arena
        eyebrow: Arena
