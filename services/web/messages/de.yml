  tour:
    title: Von der gemeinsamen Aufgabe zum geprüften Ergebnis
    subtitle: Weise Aufgaben zu, gib Agenten den nötigen Kontext und arbeite mit
      deinem Team am nächsten Schritt.
    connect:
      eyebrow: Agents & Connectors
      title: |-
        Delegiere Aufgaben
        an deine Agenten
      description:
        Weise Aufgaben spezialisierten Agenten mit eigenen Anweisungen und
        Werkzeugen zu. Ein entsprechend ausgestatteter Manager-Agent kann
        startbereite Arbeit delegieren. Agenten arbeiten in persistenten
        Sandboxes innerhalb der von dir festgelegten Kapazität.
    pool:
      eyebrow: Wissen
      title: |-
        Gib Agenten
        den Projektkontext
      description:
        Projektdateien, dauerhafte Anweisungen und gemeinsames Wissen geben
        der Arbeit eine Grundlage. Prüfe die verwendeten Quellen und nutze den
        passenden Kontext für die nächste Aufgabe.
    delegate:
      eyebrow: Automatisierungen
      title: |-
        Mache wiederkehrende
        Arbeit wiederholbar
      description:
        Verbinde Agentenschritte, Bedingungen und Aktionen zu Workflows für
        wiederkehrende Aufgaben. Starte sie manuell oder über konfigurierte
        Auslöser und prüfe die einzelnen Läufe.
    govern:
      eyebrow: Freigaben & Audit
      title: |-
        Prüfe das Ergebnis.
        Entscheide den nächsten Schritt.
      description: Prüfe die Ergebnisse mit deinem Team. Lege Prüfregeln und
        Connector-Genehmigungen fest, sieh dir den Ausführungsverlauf an und
        verwalte Zugriff und Nutzung für deine wachsende Agentenflotte.
    arena:
      eyebrow: Chat Arena
      title: |-
        Vergleiche Modelle
        auf derselben Anfrage
      description:
        Arena schickt eine Frage an zwei Modelle nebeneinander. Du wählst
        die passende Antwort — ohne den Thread zu verlassen oder die Frage neu
        zu tippen.
    projects:
      eyebrow: Projekte
      title: |-
        Plane die Arbeit
        mit deinem Team
      description: Bündle Teammitglieder, Aufgaben, Dateien und Gespräche in einem
        Projekt. Weise die Arbeit einer Person oder einem Agenten zu und
        verfolge den Fortschritt auf dem Board.
    explore: '{module} entdecken'
  tagline:
    title: Deine Infrastruktur. Deine Daten. Deine Regeln.
    subtitle: Wähle, wo dein Arbeitsbereich läuft und welche Modelle deine Agenten
      nutzen.
    pillars:
      selfHosted:
        title: Standardmäßig selbst gehostet
        description:
          Betreibe Tale auf eigener Infrastruktur oder nutze Managed Hosting.
          Lokale Modelle halten die Inferenz lokal; externe Anbieter,
          Konnektoren und Werkzeuge nutzen die von dir eingerichteten
          Verbindungen.
      security:
        title: Eingebaute Sicherheit
        description: Verwalte Mitglieder, Rollen, Single Sign-on, Budgets und
          konfigurierte Schutzregeln im selben Produkt. Nutze Audit-Einträge
          und den Ausführungsverlauf, um Vorgänge nachzuvollziehen.
      openSource:
        title: Vollständig Open Source
        description:
          Der gesamte Code ist öffentlich, unter MIT-Lizenz. Lies ihn,
          auditier ihn, ändere, was du brauchst — ohne jemanden zu fragen.
  connectors:
    title: Angedockt an die Tools, die du schon nutzt
    subtitle: Verbinde die Dienste, die deine Projekte brauchen. Richte Zugangsdaten
      ein und gib Agenten und Workflows den nötigen Zugriff für ihre Aufgaben.
  agents:
    title: Wähle die Laufzeit für jeden Agenten
    subtitle: Nutze Claude Code, Codex, Hermes, OpenClaw und weitere unterstützte
      Laufzeiten. Mit eigenen Zugangsdaten kannst du ein unterstütztes
      Agentenabo verwenden oder Modelle per API abrechnen lassen.
  compliance:
    eyebrow: SICHERHEIT
    title: Unterstützung für deinen Betrieb
    independent:
      title: Unabhängig & transparent
      description:
        In der Schweiz ansässig und herstellerneutral — ohne Bindung an
        einen Cloud- oder Modellanbieter, damit dein Deployment nur dir
        verpflichtet ist.
    certified:
      title: ISO-27001-zertifizierte Leistungen
      description:
        Ruler GmbH ist ISO-27001-zertifiziert. Der Geltungsbereich umfasst
        Tale Enterprise und professionelle Dienstleistungen. Frag uns nach dem
        Zertifikat und dem Geltungsbereich für deinen Betrieb.
  faq:
    eyebrow: FAQ
    title: Häufig gestellte Fragen
    stillQuestions: Noch Fragen?
    contactTeam: Team kontaktieren
    whatIsTale:
      q: Was ist Tale?
      a: Tale ist ein Open-Source-Projektarbeitsbereich für Teams und
        KI-Agenten. Plane Aufgaben mit deinem Team, delegiere Arbeit an
        Agenten und prüfe die Ergebnisse am selben Ort. Tale verbindet
        Aufgabenboards, Agenten-Sandboxes, gemeinsames Wissen und Workflows.
        Bei Bedarf kannst du es selbst hosten und private Modelle nutzen.
    openSource:
      q: Ist Tale Open Source?
      a:
        Ja. Tale ist MIT-lizenziert, und der volle Funktionsumfang steckt in der
        kostenlosen Community-Edition — Enterprise ergänzt Support und Services,
        keine Funktionen.
    onPrem:
      q: Läuft Tale komplett on-premises oder air-gapped?
      a: Tale kann auf deiner Infrastruktur mit lokalen Modellen laufen. Für
        einen Offline-Betrieb brauchst du auch lokale Abhängigkeiten und
        begrenzte ausgehende Verbindungen. Aktivierte Cloud-Modelle, externe
        Werkzeuge und Konnektoren können Daten nach außen senden;
        Selbsthosting macht sie nicht automatisch lokal.
    enterprisePricing:
      q: Wie funktioniert die Enterprise-Preisgestaltung?
      a:
        Enterprise wird pro Nutzer und Monat abgerechnet, mit zwei Monaten gratis bei
        jährlicher Zahlung. Speicher über das enthaltene Kontingent hinaus wird
        pro TB/Monat berechnet. Die Community-Edition bleibt für den selbst
        gehosteten Einsatz kostenlos.
    enterpriseFeatures:
      q: Gibt es zusätzliche Funktionen im Enterprise-Plan?
      a:
        Nein. Alle Produktfunktionen sind auch in der Open-Source-Version verfügbar.
        Enterprise bietet erweiterten Support und zusätzliche Services.
    byoModels:
      q: Muss ich eigene KI-Modelle mitbringen?
      a: Nein. Du kannst eigene Modelle mitbringen, musst es aber nicht. Tale
        unterstützt die meisten großen AI-Anbieter ohne Aufschlag —
        Cloud-Modellnutzung wird zu den Tarifen deines Anbieters abgerechnet und
        ist nicht in den Plänen enthalten.
    aiProviders:
      q: Kann ich meinen bevorzugten KI-Anbieter nutzen?
      a: Ja. Tale unterstützt die großen Cloud-KI-Anbieter ohne Aufschlag — die
        Nutzung wird zu den Preisen deines Anbieters abgerechnet. Du behältst
        deinen Anbieter und deine bestehende Abrechnung.
    hardware:
      q: Bietet ihr auch Hardware an?
      a:
        Ja — Hardware gibt es zur Miete, zum Leasing oder zum Kauf. Erwähne es beim
        Kontakt, und du bekommst ein Angebot für die passende Konfiguration.
    ownHardwareModels:
      q: Kann ich meine eigene Hardware und KI-Modelle nutzen?
      a: Ja. Tale ist hardware- und modellagnostisch — du kannst deine eigene
        Infrastruktur und Modelle nutzen.
    customTraining:
      q: Bietet ihr individuelles KI-Modelltraining an?
      a:
        Ja. Training und Fine-Tuning eigener Modelle sind für Kunden verfügbar. Bring
        es im Demo-Call zur Sprache, wenn du es brauchst.
    whoFor:
      q: Für wen ist Tale gedacht?
      a: Tale ist für Teams, die Arbeit für KI-Agenten organisieren und mit
        ihnen zusammenarbeiten wollen. Technische Teammitglieder richten
        Agenten, Werkzeuge und Repository-Zugriffe ein; andere beschreiben
        Aufgaben, besprechen den Fortschritt und prüfen Ergebnisse. Nutze Tale
        für Softwareprojekte, Marketingkampagnen, Recherchen, Berichte oder
        wiederkehrende Betriebsaufgaben. Was ein Agent tun kann, hängt von
        seinen Werkzeugen und Berechtigungen ab.
    agentSubscriptions:
      q: Kann ich mein bestehendes Agentenabo nutzen?
      a: Ja, wenn die Laufzeit dieses Abo unterstützt. Hinterlege dein eigenes
        Token oder unterstützte Anmeldedaten und wähle die passende Laufzeit.
        Du kannst auch Modelle per API nutzen. Abo-Aufrufe unterliegen den
        Grenzen des Anbieters und umgehen Tales Gateway-Messung und
        Ausgabenlimits. Prüfe diese Nutzung beim Anbieter.
  cta:
    title: Bring dein nächstes Projekt zu Tale
    description: Starte einen selbst gehosteten Arbeitsbereich oder bring eine echte
      Aufgabe zur Demo mit. Sieh, wie dein Team und KI-Agenten sie gemeinsam
      bearbeiten können.
