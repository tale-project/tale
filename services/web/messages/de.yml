      project1: Support-Desk
      agents1: 4 Agents
      members1: '9'
      project2: Platform Build
      agents2: 6 Agents
      members2: '12'
      project3: Docs & Enablement
      agents3: 2 Agents
      members3: '4'
      project4: Release-Zug
      agents4: 3 Agents
      members4: '7'
    sandbox:
      label:
        'Animierte Demo: Hermes bearbeitet install_offline.py im Files-Bereich,
        dann zeigt der Live-Browser die Air-Gap-Install-Checkliste.'
      prompt: Fixe das Offline-Install-Skript und zeig mir die Checkliste im
        Live-Browser.
      agent: Hermes
