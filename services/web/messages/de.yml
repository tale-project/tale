platformChat:
  eyebrow: Chats
  title: Fragen klären, vergleichen, Arbeit übergeben
  description:
    Nutze den Chat, um ein Problem zu verstehen, Projektquellen auszuwerten
    und einen Auftrag vorzubereiten. Braucht die Arbeit Dateien, Code oder
    Werkzeuge, erstelle eine Projektaufgabe und weise sie einem Agenten zu.
  capabilities:
    heading: Was umfasst Chat?
    description: Gehe einer Frage nach, prüfe die Quellen und bereite die nächste Aufgabe
      vor.
    items:
      - title: Ein Modell wählen
        body:
          Wähle ein verfügbares Modell mit Anbieter oder lass Auto für jede
          Nachricht ein Modell nach den Regeln deiner Organisation auswählen.
        docsLabel: Chat-Grundlagen
      - title: Quellen prüfen
        body:
          Öffne die Dokumente und Seiten, die eine Antwort verwendet hat.
          Prüfe, ob die Quellen die Schlussfolgerung stützen.
        docsLabel: Chat-Grundlagen
      - title: Zwei Modelle in Arena vergleichen
        body:
          Sende denselben Prompt mit demselben Ausgangskontext an zwei
          Modelle. Lies beide Antworten und entscheide, wie du fortfahren
          willst.
        docsLabel: Arena-Modus
      - title: Die passenden Dateien mitgeben
        body:
          Hänge unterstützte Dokumente, Bilder oder Aufnahmen an. Verarbeitung
          und Modellfähigkeiten bestimmen, was der Assistent lesen kann.
        docsLabel: Anhänge
      - title: Vom Gespräch zur Aufgabe wechseln
        body:
          Erstelle aus dem Gespräch eine Projektaufgabe, wenn ein Agent
          Dateien erstellen oder in einer Sandbox arbeiten soll.
        docsLabel: Projektagenten
  faq:
    heading: FAQ zu Chat
    items:
      - q: Was ist der Chat in Tale?
        a:
          Der Chat nutzt den integrierten Assistenten für Fragen, die Suche
          nach Quellen und Textentwürfe. Er kann zugängliches
          Unternehmenswissen und den Kontext des aktuellen Projekts verwenden.
      - q: Brauche ich für den Chat einen Projektagenten?
        a:
          Nein. Der Chat nutzt Tales integrierten Assistenten mit deinem
          gewählten Modell. Projektagenten sind eigenständige Bearbeiter,
          denen du Projektaufgaben zuweist.
      - q: Was ist der Arena-Modus?
        a:
          Arena sendet einen Prompt mit demselben Ausgangskontext an zwei
          Modelle. Du vergleichst die Antworten und hältst eine Bewertung
          fest, bevor du das Gespräch fortsetzt.
      - q: Wie wird aus einem Chat konkrete Arbeit?
        a:
          Erstelle aus dem Gespräch eine Projektaufgabe und weise einen
          Agenten zu. Der Chat selbst führt keinen Code aus, ändert keine
          angebundenen Systeme und erstellt keine Ergebnisdateien. Fortschritt
          und Ergebnis der Aufgabe bleiben mit dem Gespräch verknüpft.
  docs:
    - label: Chat-Übersicht
      path: /platform/chat/overview
    - label: Chat-Grundlagen
      path: /platform/chat/basics
    - label: Arena-Modus
      path: /platform/chat/arena-mode
    - label: Projektagenten
      path: /platform/agents/concepts
    - label: Anhänge
      path: /platform/chat/attachments
  tour:
    heading: So funktioniert Chat in Tale
    description: Besprich das Problem im Chat und nutze Projektaufgaben und
      Automatisierungen für die anschließende Arbeit.
    stages:
      - id: projects
        eyebrow: Projekte
        title: |-
          Gespräche bei
          der Arbeit halten
        description:
          Nutze Projektchats mit gemeinsamem Kontext und wähle, welche
          Gespräche du mit Projektmitgliedern teilst. Aufgaben, Dateien und
          Anweisungen bleiben im selben Projekt.
      - id: knowledge
        eyebrow: Wissen
        title: |-
          Antworten anhand
          der Quellen prüfen
        description:
          Der Chat kann zugängliches Wissen und Projektdateien abrufen. Öffne
          die Quellen einer Antwort und prüfe sie, bevor du das Ergebnis
          nutzt.
  demos:
