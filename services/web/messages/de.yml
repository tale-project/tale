about:
  hero:
    eyebrow: Über uns
    title: Wer steht hinter Tale?
    description: Ruler GmbH aus Spiez in der Schweiz entwickelt Tale. Wir bauen einen
      Open-Source-Projektarbeitsbereich, in dem Menschen und KI-Agenten
      gemeinsam Probleme lösen. Unsere ISO-27001-Zertifizierung umfasst Tale
      Enterprise und professionelle Dienstleistungen.
    ctaContact: Kontakt aufnehmen
    ctaGithub: Code ansehen
  facts:
    founded:
      label: Gegründet
      value: '2020'
    location:
      label: Sitz
      value: Spiez, Schweiz
    certified:
      label: Zertifiziert
      value: Ruler GmbH · ISO 27001
    license:
      label: Lizenz
      value: MIT — vollständig Open Source
  story:
    heading: Unsere Geschichte
    p1: Die Ruler GmbH wurde 2020 von Yannick Monney in Spiez im Kanton Bern
      gegründet. Von Anfang an in der Schweiz ansässig und herstellerneutral —
      ohne Bindung an einen Cloud- oder Modellanbieter.
    p2: Wir bauen Tale für Unternehmen, in denen KI-Agenten mit den Teams
      zusammenarbeiten sollen. Arbeit braucht Zuständigkeiten, Kontext,
      Abstimmung und einen Ort, an dem Ergebnisse geprüft werden. Ein
      gemeinsamer Projektarbeitsbereich bringt das zusammen.
    tagline: Deine Infrastruktur. Deine Daten. Deine Regeln.
    p3: Tale verbindet Projektboards, Agenten-Sandboxes, Dateien, Wissen und
      Workflows in einem Produkt. Teams können Aufgaben zuweisen, den
      Fortschritt verfolgen und Ergebnisse gemeinsam prüfen. Laufzeiten,
      Modelle und Betriebsform bleiben wählbar.
  product:
    heading: Was wir bauen
    description: "Tale ist ein Open-Source-Arbeitsbereich für Teams und KI-Agenten: ein
      Ort, um Projekte zu planen, Aufgaben zu delegieren und Ergebnisse zu
      prüfen."
    orchestrator:
      title: Menschen und Agenten im selben Projekt
      body: Weise Arbeit Teammitgliedern oder Projektagenten zu. Gib den Agenten
        Anweisungen, Werkzeuge und eine unterstützte Laufzeit. Verfolge ihre
        Aufgaben und prüfe die Ergebnisse.
    openSource:
      title: Open Source, ohne Sternchen
      body: Der gesamte Code ist öffentlich auf GitHub, unter MIT-Lizenz. Die
        kostenlose Community-Edition hat denselben Funktionsumfang; Enterprise
        ergänzt Support und Services für CHF 12 (EUR 14) pro User/Monat.
    deployment:
      title: Deine Infrastruktur oder unsere
      body: Hoste Tale auf eigener Infrastruktur oder nutze Managed Hosting in der
        Schweiz oder der EU. Wähle lokale oder Cloud-Modelle und lege fest,
        welche externen Dienste der Arbeitsbereich erreichen darf.
    beyond:
      title: Mehr als Software
      body: Wir liefern KI-Hardware zum Mieten, Leasen oder Kaufen für Teams, die Modelle auf ihrer eigenen Infrastruktur betreiben.
  work:
    heading: Wie wir mit Unternehmen arbeiten
    description: Damit Agenten sinnvoll mitarbeiten, braucht es neben Software einen
      klaren Ablauf. Wir helfen Teams, ihre Quellen vorzubereiten, passende
      Aufgaben zu definieren und die Ergebnisprüfung festzulegen.
    dataQuality:
      title: Daten, auf die man Agents ansetzen kann
      body: Wir helfen dabei, Quellen, Zuständigkeiten und Herkunft zu
        strukturieren, damit Menschen und Agenten relevante Belege finden und
        prüfen können.
    regulated:
      title: Zu Hause in regulierten Umgebungen
      body: Wir helfen Teams, Anforderungen an Betrieb, Zugriff und Prüfung
        einzuordnen. Die ISO-27001-Zertifizierung der Ruler GmbH umfasst Tale
        Enterprise und professionelle Dienstleistungen. Fordere die für deine
        Organisation passenden Nachweise und den Geltungsbereich an.
    edge:
      title: Ein Vorsprung, der dir bleibt
      body: Behalte Projektkontext, Workflows und Review-Verlauf deines Teams
        zusammen, wenn weitere Agenten hinzukommen. Der MIT-lizenzierte Code
        sowie die Wahl von Laufzeiten und Betriebsform lassen dich Tale an die
        Arbeit deines Unternehmens anpassen.
    tailored:
      title: Lösungen, die zu deinen Zielen passen
      body: Keine zwei Organisationen führen KI gleich ein. Wir bauen Agents,
        Automatisierungen, Wissen und Hardware um das herum, was du erreichen willst
        — und lassen weg, was du nicht brauchst.
  values:
    heading: Wofür wir stehen
    privacy:
      title: Deine Daten bleiben deine
      body: Behalte die Wahl über Betrieb und Modelle. Nutze bei Bedarf lokale
        Inferenz und prüfe die Datenflüsse der externen Dienste, die du
        verbindest.
    neutrality:
      title: Unabhängig & herstellerneutral
      body: In der Schweiz ansässig und herstellerneutral — ohne Bindung an
        einen Cloud- oder Modellanbieter, damit dein Deployment nur dir
        verpflichtet ist.
    transparency:
      title: Transparent von Grund auf
      body: Eine öffentliche Codebasis unter MIT-Lizenz und ein Unternehmen,
        das du im Schweizer Handelsregister nachschlagen kannst. Was wir
        ausliefern, kannst du lesen.
    control:
      title: Menschen behalten die Kontrolle
      body: Menschen definieren die Arbeit, vergeben Agentenzugriffe und legen
        Review- und Freigaberegeln fest. Teams können Ergebnisse und
        Ausführungsverlauf prüfen, bevor sie den nächsten Schritt entscheiden.
  cta:
    title: Sprich mit dem Team
    description: Fragen zu Tale, zum Deployment oder zur Zusammenarbeit mit der
      Ruler GmbH? Buch eine Demo oder schreib uns über das Kontaktformular.
