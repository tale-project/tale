platformKnowledge:
  eyebrow: Wissen
  title: Was ist Wissen in Tale?
  description: Halte Dokumente, kurze Fakten, Website-Inhalte und strukturierte
    Datensätze für dein Team bereit. Chat und passend ausgestattete
    Projektagenten können zugängliche Quellen für Antworten und Aufgaben
    abrufen.
  capabilities:
    heading: Was steckt in Wissen?
    description:
      Bereite hilfreiche Quellen für die Suche auf und prüfe die Belege hinter
      Antworten und Ergebnissen.
    items:
      - title: Dokumente mit Indexierungs-Pipeline
        body:
          Lade unterstützte Dateien hoch und prüfe ihren Indexierungsstatus.
          Indexierter Text lässt sich mit Quellenangaben abrufen.
        docsLabel: Dokumente
      - title: Wissenseinträge
        body:
          Speichere einen kurzen Fakt unter einem beständigen Thema.
          Aktualisiere den Eintrag bei Änderungen und prüfe seine
          Versionshistorie.
        docsLabel: Wissenseinträge
      - title: Website-Crawls
        body:
          Indexiere Seiten, die Agents zitieren sollen, ohne sie in Prompts zu
          pasten.
        docsLabel: Crawling
      - title: Typisierte Datensätze
        body:
          Kontakte und Produkte bündeln benannte Felder. Menschen und Agenten
          können konkrete Werte nachschlagen und ergänzende Dokumente
          hinzuziehen.
        docsLabel: Strukturierte Daten
      - title: Zugriff nach den Regeln der Quelle
        body:
          Teambeschränkungen und Projektzugriffe gelten auch bei der Suche.
          Projektagenten brauchen die passenden Plattform-Tools, um Wissen
          abzurufen.
        docsLabel: Wissen im Überblick
  faq:
    heading: FAQ zu Wissen
    items:
      - q: Was ist Wissen in Tale?
        a:
          Wissen enthält gemeinsame Dokumente, Einträge, indexierte Websites,
          Kontakte und Produkte. Schaffe damit eine gemeinsame Grundlage für
          Fragen und Projektaufgaben und prüfe die verwendeten Quellen.
      - q: Was bestimmt, welche Quellen abrufbar sind?
        a: Die Suche berücksichtigt Quellberechtigungen und Projektkontext.
          Projektchats können eigene Projektdateien und zugängliches
          Organisationswissen durchsuchen. Projektagenten brauchen dafür die
          passenden Tools.
      - q: Was ist der Unterschied zwischen Dokumenten und typisierten Datensätzen?
        a:
          Dokumente und Einträge liefern Text für die Suche. Kontakte und
          Produkte speichern benannte Felder zum gezielten Nachschlagen. Prüfe
          in beiden Fällen die Quelle und ihre Aktualität.
      - q: Wie wird aus einem hilfreichen Fakt gemeinsames Wissen?
        a:
          Personen mit Bearbeitungsrecht können Wissenseinträge anlegen oder
          aktualisieren; Integrationen können sie über die API pflegen. Prüfe
          einen Fakt vor dem Speichern. Chat fügt der Bibliothek nicht
          automatisch Fakten hinzu.
  docs:
    - label: Wissen im Überblick
      path: /platform/knowledge/overview
    - label: Dokumente
      path: /platform/knowledge/documents
    - label: Wissenseinträge
      path: /platform/knowledge/knowledge-entries
    - label: Crawling
      path: /platform/knowledge/crawling
    - label: Strukturierte Daten
      path: /platform/knowledge/structured-data
  tour:
    heading: So verankert Wissen Tale
    description:
      Bereite Unternehmensquellen auf, nutze sie für Fragen und
      Projektaufgaben und prüfe die Belege hinter dem Ergebnis.
    stages:
      - id: chat
        eyebrow: Chat
        title: |-
          Öffne die Quellen
          hinter einer Antwort
        description:
          Abgerufene Passagen landen als Zitat-Karten — Leser öffnen die
          Datei oder Seite, die die Antwort genutzt hat.
      - id: projects
        eyebrow: Projekte
