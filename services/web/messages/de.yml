  agents:
    title: Deine Agenten, deine Wahl
    subtitle: Nutze deine bevorzugte Laufzeit mit eigenen Zugangsdaten oder per API abgerechneten Modellen.
  faq:
    eyebrow: FAQ
    title: Häufig gestellte Fragen
    stillQuestions: Noch Fragen?
    contactTeam: Team kontaktieren
    whatIsTale:
      q: Was ist Tale?
      a: Tale ist ein Open-Source-Projektarbeitsbereich für Teams und
        KI-Agenten. Plane Aufgaben mit deinem Team, delegiere Arbeit an
        Agenten und prüfe die Ergebnisse am selben Ort. Tale verbindet
        Aufgabenboards, Agenten-Sandboxes, gemeinsames Wissen und Workflows.
        Bei Bedarf kannst du es selbst hosten und private Modelle nutzen.
    openSource:
      q: Ist Tale Open Source?
      a:
        Ja. Tale ist MIT-lizenziert, und der volle Funktionsumfang steckt in der
        kostenlosen Community-Edition — Enterprise ergänzt Support und Services,
        keine Funktionen.
    onPrem:
      q: Läuft Tale komplett on-premises oder air-gapped?
      a: Tale kann auf deiner Infrastruktur mit lokalen Modellen laufen. Für
        einen Offline-Betrieb brauchst du auch lokale Abhängigkeiten und
        begrenzte ausgehende Verbindungen. Aktivierte Cloud-Modelle, externe
        Werkzeuge und Konnektoren können Daten nach außen senden;
        Selbsthosting macht sie nicht automatisch lokal.
    enterprisePricing:
      q: Wie funktioniert die Enterprise-Preisgestaltung?
      a:
        Enterprise wird pro Nutzer und Monat abgerechnet, mit zwei Monaten gratis bei
        jährlicher Zahlung. Speicher über das enthaltene Kontingent hinaus wird
        pro TB/Monat berechnet. Die Community-Edition bleibt für den selbst
        gehosteten Einsatz kostenlos.

    byoModels:
      q: Muss ich eigene KI-Modelle mitbringen?
      a: Nein. Du kannst eigene Modelle mitbringen, musst es aber nicht. Tale
        unterstützt die meisten großen KI-Anbieter ohne Aufschlag —
        Cloud-Modellnutzung wird zu den Tarifen deines Anbieters abgerechnet und
        ist nicht in den Plänen enthalten.




    whoFor:
      q: Für wen ist Tale gedacht?
      a: Tale ist für Teams, die Arbeit für KI-Agenten organisieren und mit
        ihnen zusammenarbeiten wollen. Technische Teammitglieder richten
        Agenten, Werkzeuge und Repository-Zugriffe ein; andere beschreiben
        Aufgaben, besprechen den Fortschritt und prüfen Ergebnisse. Nutze Tale
        für Softwareprojekte, Marketingkampagnen, Recherchen, Berichte oder
        wiederkehrende Betriebsaufgaben. Was ein Agent tun kann, hängt von
        seinen Werkzeugen und Berechtigungen ab.
    agentSubscriptions:
      q: Kann ich mein bestehendes Agentenabo nutzen?
      a: Ja, wenn die Laufzeit dieses Abo unterstützt. Hinterlege dein eigenes
        Token oder unterstützte Anmeldedaten und wähle die passende Laufzeit.
        Du kannst auch Modelle per API nutzen. Abo-Aufrufe unterliegen den
        Grenzen des Anbieters und umgehen Tales Gateway-Messung und
        Ausgabenlimits. Prüfe diese Nutzung beim Anbieter.
  cta:
    title: Bring dein nächstes Projekt zu Tale
    description: Starte einen selbst gehosteten Arbeitsbereich oder bring eine echte
      Aufgabe zur Demo mit. Sieh, wie dein Team und KI-Agenten sie gemeinsam
      bearbeiten können.
