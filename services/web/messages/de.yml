pricingPage:
  relatedHeading: Weiterführend
  ctaTitle: Lass dir dein Setup durchrechnen
  ctaDescription: Fordere eine Demo an oder sprich mit dem Team über
    Enterprise-Sitze, Speicher und Hardware.
  faq:
    heading: Preise FAQ
    items:
      - q: Was kostet Tale Enterprise?
        a:
          Tale Enterprise kostet CHF 12 (EUR 14) pro User und Monat, bei jährlicher
          Abrechnung zwei Monate gratis. Speicher kostet CHF 10 (EUR 12) pro TB
          und Monat.
      - q: Ist Community kostenlos?
        a:
          Ja. Die Community-Edition kannst du unter der MIT-Lizenz kostenlos selbst
          hosten.
      - q: Kann ich Hardware mit Software kaufen?
        a:
          Ja. Leise Inference-Hardware gibt es zum Mieten, Leasen oder Kaufen — siehe
          Hardware-Preise.
