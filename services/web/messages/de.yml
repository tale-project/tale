platformKnowledge:
  eyebrow: Knowledge
  title: Was ist Knowledge in Tale?
  description: Knowledge ist die gemeinsame Bibliothek der Organisation —
    Dokumente, Knowledge-Einträge, gecrawlte Websites und typisierte Datensätze
    — die Agents abrufen und zitieren, damit Antworten deine Realität
    widerspiegeln, nicht nur Trainingsdaten.
  capabilities:
    heading: Was steckt in Knowledge?
    description:
      Gib Agents die Dokumente, Datensätze und Crawls, die sie brauchen —
      und jede Antwort zitiert, woher sie stammt.
    items:
      - title: Dokumente mit Indexierungs-Pipeline
        body:
          Lade Dateien hoch; Tale extrahiert, chunked, embeddet und speichert sie
          für Retrieval mit Zitationen.
        docsLabel: Dokumente
      - title: Knowledge-Einträge
        body:
          Kleine themenbezogene Fakten — aus dem Chat mit Freigabe erfasst oder von
          Hand ergänzt.
        docsLabel: Knowledge-Einträge
      - title: Website-Crawls
        body:
          Indexiere Seiten, die Agents zitieren sollen, ohne sie in Prompts zu
          pasten.
        docsLabel: Crawling
      - title: Typisierte Datensätze
        body:
          Products, Contacts und Vendors sind exakte Feldzeilen, die Agents als
          Daten lesen, nicht als Prosa.
        docsLabel: Strukturierte Daten
      - title: Retrieval-Scope pro Agent
        body:
          Der Knowledge-Tab eines Agents legt fest, welche Slices er durchsuchen
          kann; Team-Items bleiben team-begrenzt.
        docsLabel: Agent-Wissen
  faq:
    heading: FAQ zu Knowledge
    items:
      - q: Was ist Knowledge in Tale?
        a:
          Tale Knowledge ist die gemeinsame Bibliothek der Organisation aus Dokumenten,
          Fakten, Websites und typisierten Datensätzen, die Agents in Antworten
          abrufen und zitieren.
      - q: Sehen Agents standardmäßig die ganze Bibliothek?
        a: Nein. Der Knowledge-Tab jedes Agents setzt den Retrieval-Scope.
          Team-begrenzte Items bleiben außerhalb des Teams unsichtbar.
      - q: Was ist der Unterschied zwischen Dokumenten und typisierten Datensätzen?
        a:
          Dokumente und Einträge werden für Retrieval indexiert. Products, Contacts und
          Vendors sind strukturierte Zeilen, die Agents als exakte Werte lesen.
      - q: Können Agents in Knowledge schreiben — oder nur lesen?
        a:
          Sie können vorschlagen. Wissens-Einträge aus einem Chat pausieren auf einer
          Freigabe-Karte; ein Mensch entscheidet, was in die Bibliothek kommt —
          und der Entscheid wird protokolliert.
  docs:
    - label: Knowledge-Übersicht
      path: /platform/knowledge/overview
    - label: Dokumente
      path: /platform/knowledge/documents
    - label: Knowledge-Einträge
      path: /platform/knowledge/knowledge-entries
    - label: Crawling
      path: /platform/knowledge/crawling
    - label: Strukturierte Daten
      path: /platform/knowledge/structured-data
  tour:
    heading: So verankert Wissen Tale
    description:
      Indexiere, was dein Unternehmen weiß, zitiere es im Chat, binde es
      an Agents und halte Vergleiche ehrlich.
    stages:
      - id: chat
        eyebrow: Chat
        title: |-
          Jede belegte Antwort
          trägt ihre Quellen
        description:
          Abgerufene Passagen landen als Zitat-Karten — Leser öffnen die
          Datei oder Seite, die die Antwort genutzt hat.
      - id: agents
        eyebrow: Agents
        title: |-
          Libraries pro Agent
          freigeben
        description: Ein Agent sieht seine Freigaben und nicht mehr — was Legal
          indexiert hat, taucht in keinem Support-Thread auf.
      - id: arena
        eyebrow: Arena
        title: |-
          Antworten auf denselben
          Quellen vergleichen
        description:
          Arena lässt eine Anfrage durch zwei Modelle laufen — du siehst,
          welche Antwort das Wissen besser nutzt.
      - id: projects
        eyebrow: Projekte
        title: |-
          Bibliotheken wohnen
          bei ihren Teams
        description:
          Projekte legen fest, welche Dokumente neben welchen Agents und
          Mitgliedern liegen.
  demos:
    knowledge:
      label:
        'Animierte Demo: Die Org-Bibliothek indexiert das Produkthandbuch, den
        Docs-Site-Crawl, die Preisliste 2026 und einen Onboarding-FAQ-Eintrag.'
      source1: produkthandbuch-v4.pdf
      sourceType1: pdf
      source2: docs.nordwind.eu
      sourceType2: website
      source3: Preisliste 2026
      sourceType3: catalog
      source4: Onboarding-FAQ
      sourceType4: entry
    hero:
      label: 'Animierte Demo: Eine Frage zur Akkupflege wird aus dem indexierten
        Produkthandbuch beantwortet — Handbuch und FAQ-Eintrag sind unter der
        Antwort zitiert.'
      prompt: Was hat sich in Handbuch v4 bei der Akkupflege im Winter geändert?
      routedTitle: An Produkt-Agent geroutet
      routedDetail: Auto hat Claude Sonnet für den Produkt-Korpus gewählt.
      reply1: V4 engt die Langzeitlagerung auf 10–20 °C ein, ab 30 Tagen Standzeit.
      reply2: Vor dem Einlagern auf 60 % laden — volle Ladung altert die Zellen
        schneller.
      reply3: Der Enteisungs-Hinweis ist in die Quick-Start-Beilage gewandert —
      reply4: und Firmware 3.2 bringt eine Ladesperre bei Minustemperaturen.
      citation1: produkthandbuch-v4.pdf
      citation2: Onboarding-FAQ
      composerAgentRouted: Produkt-Agent
      composerModel: Claude Sonnet
    arena:
      label:
        'Animierte Demo: Zwei Modelle beantworten dieselbe Garantiefrage aus
        denselben indexierten Quellen — die besser belegte Antwort gewinnt.'
      prompt: 'Antworte aus dem Handbuch: Wie lange gilt die Akku-Garantie?'
      agent: Produkt-Agent
      modelA: Claude Sonnet
      modelB: Gemini 2.5
      replyA1: Zwei Jahre ab Lieferung, laut Handbuch v4, Abschnitt 8.
      replyA2: Wasserschäden und Fremd-Ladegeräte schließen sie aus.
      replyA3:
        Mit Registrierung innerhalb von 90 Tagen verlängert sie sich auf drei
        Jahre.
      replyB1: 24 Monate ab Lieferung, mit Registrierung verlängerbar auf 36.
      replyB2: Das Verlängerungsfenster schließt 90 Tage nach dem Kauf.
      replyB3: Abschnitt 8 listet die Ausschlüsse — Ladegeräte und Wasserschäden.
    connect:
      label: 'Animierte Demo: Agents mit Bibliotheks-Slices — Product-Agent,
        Docs-Agent, Support-Agent, Research-Agent und Policy-Agent.'
      agent1: Product-Agent
      model1: Claude Sonnet
      agent2: Docs-Agent
      model2: Claude Opus
      agent3: Support-Agent
      model3: Claude Sonnet
      agent4: Research-Agent
      model4: GPT-5.5
      agent5: Policy-Agent
      model5: Claude Opus
    projects:
      label: 'Animierte Demo: Projekte, die Bibliotheken neben den Agents und
        Mitgliedern halten, die sie nutzen.'
      project1: Produkt-Korpus
      agents1: 3 Agents
