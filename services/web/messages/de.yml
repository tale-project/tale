platformAgents:
  eyebrow: Agents
  title: Was sind Agents in Tale?
  description: Ein Tale Agent ist die Vier-Knopf-Kombination aus Anweisungen,
    Wissen, Tools und Modell. Redakteure bauen sie einmal; das Team nutzt sie in
    Chat, Automations und Projekten — auf Harnesses wie Claude Code, Codex,
    Hermes und OpenClaw, wenn die Arbeit eine Coding-CLI in einer Sandbox braucht.
  capabilities:
    heading: Was können Agents?
    description:
      Was eine Agent-Definition dem ganzen Team gibt — und was sie einem
      nackten Modell voraushat.
    items:
      - title: Vier Knöpfe, eine Einheit
        body:
          Anweisungen, Wissen, Tools und Modell definieren, wie ein Agent sich
          verhält. Ändere einen Knopf, ohne etwas neu zu trainieren.
        docsLabel: Agent-Konzepte
      - title: Harnesses docken an
        body:
          Binde Claude Code, Codex, Hermes und OpenClaw als Harness, auf dem ein
          Projekt-Agent oder ein Automation-Agent-Knoten läuft.
        docsLabel: Harnesses
      - title: Delegation zwischen Agents
        body:
          Spezial-Agents übergeben Arbeit aneinander, wenn ein Thread eine Domäne
          verlässt — ohne das Transkript zu verlieren.
        docsLabel: Agent-Worker
      - title: Skills als wiederverwendbare Bundles
        body:
          Packe eine Schreibstimme oder ein mehrstufiges Muster einmal und binde es
          an bis zu zehn Agents.
        docsLabel: Agent-Skills
      - title: Wissen pro Agent begrenzt
        body:
          Jeder Agent durchsucht nur die Bibliotheks-Slices, die du freigibst —
          Team-Docs bleiben außerhalb des Teams unsichtbar.
        docsLabel: Agent-Wissen
  faq:
    heading: FAQ zu Agents
    items:
      - q: Was ist ein Agent in Tale?
        a:
          Ein Tale Agent kombiniert Anweisungen, Wissen, Tools und Modell zu einer
          wiederverwendbaren Einheit, die Mitglieder in Chat und Automations
          nutzen.
      - q: Kann Tale Claude Code und Hermes orchestrieren?
        a:
          Ja. Claude Code, Codex, Hermes und OpenClaw kommen als Harnesses — binde
          eines, wenn du einen Projekt-Agent oder einen Automation-Agent-Knoten
          anlegst.
      - q: Wann nutze ich einen Agent statt eines Workflows?
        a:
          Nutze einen Agent, wenn das Gespräch in einer Domäne und Stimme bleibt. Greif
          zur Automation, wenn die Arbeit mehrere Schritte, Verzweigungen,
          Zeitpläne oder Freigaben braucht.
      - q: Kann jeder Agent ein anderes Modell nutzen?
        a:
          Ja. Jeder Agent bindet sein eigenes Primärmodell samt Fallbacks — Claude Code
          kann auf Claude Opus laufen, während ein Support-Spezialist Claude
          Sonnet nutzt. Das Modell wechselst du, ohne den Agent neu zu bauen.
  docs:
    - label: Agent-Konzepte
      path: /platform/agents/concepts
    - label: Projekt-Agenten
      path: /platform/projects/project-agents
    - label: Harnesses
      path: /platform/agents/harnesses
    - label: Aufgaben-Automatisierung
      path: /platform/projects/task-automation
    - label: Wissen
      path: /platform/knowledge/overview
  tour:
    heading: So zeigen sich Agents in Tale
    description:
      Docke die Agents an, denen du vertraust, verankere sie im Wissen,
      führe sie in Workflows aus und grenze sie nach Projekt ab.
    stages:
      - id: projects
        eyebrow: Projekte
        title: |-
          Agents nach Team
          abgrenzen
        description:
          Jedes Projekt hält Agents, Mitglieder und Wissen in einem Workspace
          — Support sieht nie den Engineering-Stack.
      - id: knowledge
        eyebrow: Wissen
        title: |-
          Jeden Agent in dem
          verankern, was du weißt
        description: Der Support-Agent bekommt Makros, Brand Voice und den
          Help-Center-Crawl — sonst nichts. Jeder Agent durchsucht nur die
          Slices, die du ihm gibst.
      - id: automations
        eyebrow: Automatisierungen
        title: |-
          Agents in mehrstufiger
          Arbeit ausführen
        description: Workflows rufen Agents als LLM-Schritte mit Bedingungen und
          Aktionen auf — jeder Lauf hinterlässt ein Log.
      - id: chat
        eyebrow: Sandbox
        title: |-
          Dem Agent in Files
          und Live zusehen
        description:
          Agents, die auf einem Harness laufen, arbeiten in einer Sandbox —
          brows den Workspace-Tree, öffne die Datei, die sie gerade geschrieben
          haben, und schau im Live-Browser zu, wie sie das Ergebnis durchklicken.
  demos:
    knowledge:
      label:
        'Animierte Demo: Die Wissens-Slices für einen Agent — Support-Makros,
        Brand-Voice-Eintrag, Agent-Playbook-Crawl und Returns-Playbook.'
      source1: support-macros.pdf
      sourceType1: pdf
      source2: Brand Voice
      sourceType2: entry
      source3: agents.nordwind.eu
      sourceType3: website
      source4: returns-playbook.pdf
      sourceType4: pdf
    automation:
      label:
        'Animierte Demo: Ein nächtlicher Workflow ruft den Release-Agent als
        LLM-Schritt auf, prüft auf neue Änderungen und postet einen Digest nach
        Slack; die Ausführungen-Tabelle hält jeden Lauf fest.'
      trigger: Nachts 02:00
      llm: Release-Agent
      condition: Änderungen?
      branchYes: Ja
      action: Digest an Slack
      actionAlt: Überspringen
      run1: '#311'
      runTone1: done
      duration1: 6,1s
      run2: '#312'
      runTone2: done
      duration2: 5,4s
      run3: '#313'
      runTone3: running
      duration3: 0,8s
    connect:
      label: 'Animierte Demo: Die Agents-Liste dieser Seite — Support-Agent,
        Docs-Agent, Release-Agent, Research-Agent und Pilot-Agent, jeweils mit
        Modell.'
      agent1: Support-Agent
      model1: Claude Sonnet
      agent2: Docs-Agent
      model2: Claude Opus
      agent3: Release-Agent
      model3: GPT-5.5
      agent4: Research-Agent
      model4: Claude Opus
      agent5: Pilot-Agent
      model5: Claude Opus
    projects:
      label: 'Animierte Demo: Projekte so abgegrenzt, dass Support und Platform
