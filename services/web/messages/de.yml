platformHub:
  title: Wie funktioniert die Tale-Plattform?
  description: Tale bringt Teammitglieder und KI-Agenten in einem Projektarbeitsbereich
    zusammen. Plane Aufgaben auf Boards, delegiere sie an Agenten in Sandboxes
    und prüfe die Ergebnisse mit dem zugehörigen Kontext und den Dateien.
  modulesHeading: Plattform-Module
  modulesDescription:
    Projekte organisieren die Arbeit. Agenten bearbeiten zugewiesene Aufgaben.
    Chat und Wissen liefern Kontext. Automationen machen Schritte
    wiederholbar; Governance regelt Zugriff und Prüfung.
  tour:
    heading: So fügt sich die Plattform zusammen
    description:
      Plane ein Projekt, statte Agenten für seine Aufgaben aus und prüfe ihre
      Ergebnisse. Wissen, Chat und wiederholbare Workflows unterstützen die
      gemeinsame Arbeit.
    stages:
      - id: agents
        eyebrow: Agents
        title: |-
          Agenten für
          deine Projektaufgaben
        description: Konfiguriere Projektagenten mit einer unterstützten Laufzeit, einem
          Modell und Tools. Weise ihnen Aufgaben zu und verfolge den
          Fortschritt mit deinem Team.
      - id: knowledge
        eyebrow: Wissen
        title: |-
          Gemeinsame Quellen
          für die Arbeit
        description:
          Halte Handbücher, Referenzdateien, Website-Inhalte und kurze Fakten
          für die Suche bereit. Prüfe die Quellenangaben einer Antwort.
      - id: automations
        eyebrow: Automatisierungen
        title: |-
          Mehrstufige Arbeit
          delegieren
        description:
          Definiere die Schritte für wiederkehrende Arbeit, richte den
          Auslöser ein und prüfe die Ergebnisse jedes Laufs. Freigaberegeln
          für Connector-Aktionen können geschützte Schreibzugriffe anhalten.
      - id: govern
        eyebrow: Governance
        title: |-
          Angehalten, bis
          jemand entscheidet
        description:
          Ein geschützter Connector-Schreibzugriff kann in einer
          Automatisierung auf Freigabe warten. Prüfe die geplante Aktion,
          entscheide und kontrolliere das Ergebnis.
      - id: arena
        eyebrow: Arena
        title: |-
          Zwei Entwürfe,
          ein Briefing
        description: Vergleiche zwei Modellantworten auf denselben Auftrag. Lies beide
          Entwürfe, bevor du einen davon verwendest.
      - id: projects
        eyebrow: Projekte
        title: Nach Team abgrenzen
        description:
          Bündle Aufgaben, Agenten, Dateien und Anweisungen in einem Projekt.
          Lege den Zugriff fest und teile gezielt die Chats, die dein Team
          lesen soll.
  faq:
    heading: Plattform-FAQ
    items:
      - q: Was ist die Plattform in Tale?
        a:
          Tale ist ein Open-Source-Projektarbeitsbereich für Teams und
          KI-Agenten. Plane Aufgaben, delegiere Arbeit, verfolge den
          Fortschritt und prüfe Ergebnisse mit gemeinsamem Kontext und
          wiederholbaren Workflows.
      - q: Welche Module gehören zu Tale?
        a:
          Chat, Projekte, Knowledge, Agents, Automations und Governance — die Projekte
          grenzen Arbeit, Dateien und Agents nach Team ab.
      - q: Ist Tale Open Source?
        a:
          Ja. Community ist MIT-lizenziert und kostenlos selbst gehostet. Enterprise
          ergänzt Support und Services auf derselben Codebasis.
      - q: Wo fange ich an?
        a:
          Starte mit einem Projekt und einer Aufgabe, deren Ergebnis du
          beurteilen kannst. Füge passende Dateien hinzu, weise einen
          eingerichteten Agenten zu, starte ihn und prüfe sein Ergebnis.
  demos:
    hero:
      label:
        "Beispieldemo: Ein Chat erklärt anhand von Quellen, wie Tale
        Projektaufgaben, Agenten und Reviews im Team verbindet."
