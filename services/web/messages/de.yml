  tour:
    title: Wie Tale deine KI-Agents orchestriert
    subtitle: Verbinde, was du nutzt. Bündle dein Wissen. Delegiere die Arbeit.
      Kontrolliere das Ergebnis — vergleiche Modelle und grenze nach Projekt ab.
    connect:
      eyebrow: Agents & Connectors
      title: |-
        Bring die Agents mit,
        denen du schon vertraust
      description:
        Claude Code, Codex, Hermes, OpenClaw — plus Slack, GitHub, Outlook
        und der Rest deines Stacks. Nichts wird ersetzt; alles wird koordiniert.
    pool:
      eyebrow: Wissen
      title: |-
        Eine Wissensbasis,
        jede Antwort belegt
      description:
        Dokumente, Websites, Produkt- und Kontaktdaten landen in einer
        gemeinsamen Wissensbasis. Agents antworten mit dem Wissen deines
        Unternehmens — belegt mit prüfbaren Quellen.
    delegate:
      eyebrow: Automatisierungen
      title: |-
        Delegiere die Arbeit,
        nicht die Kontrolle
      description:
        Automatisierungen verketten LLM-Schritte, Bedingungen und Aktionen
        zu Workflows, die auf Trigger laufen — Inbox-Triage, Eskalationen,
        Wochenberichte. Jeder Lauf hinterlässt ein Log.
    govern:
      eyebrow: Freigaben & Audit
      title: |-
        Erst freigeben.
        Dann auditieren.
      description: Human-in-the-Loop-Freigaben sichern die Aktionen, die zählen.
        Audit-Logs, Budgets, Guardrails und SSO halten jeden Agent in deinen
        Regeln.
    arena:
      eyebrow: Chat Arena
      title: |-
        Vergleiche Modelle
        auf derselben Anfrage
      description:
        Arena schickt eine Frage an zwei Modelle nebeneinander. Du wählst
        die passende Antwort — ohne den Thread zu verlassen oder die Frage neu
        zu tippen.
    projects:
      eyebrow: Projekte
      title: |-
        Agents und Wissen
        nach Team abgrenzen
      description: Projekte halten Agents, Dokumente und Mitglieder im richtigen
        Workspace. Support bleibt bei Support; Engineering behält seinen eigenen
        Stack.
    explore: '{module} entdecken'
  tagline:
    title: Deine Infrastruktur. Deine Daten. Deine Regeln.
    subtitle: Betreibe KI zu deinen Bedingungen — vom Hosting bis zur Governance
      jeder Aktion.
    pillars:
      selfHosted:
        title: Standardmäßig selbst gehostet
        description:
          Läuft komplett auf deiner Infrastruktur — ganz ohne Cloud. Mit
          lokalen Modellen verlassen keine Daten dein Netzwerk; und an einen
          Anbieter bindet dich so oder so nichts.
      security:
        title: Eingebaute Sicherheit
        description: Single Sign-on, Erkennung sensibler Daten,
          Content-Safety-Guardrails, vollständige Aktivitätsprotokolle und
          Budgetkontrollen — alles integriert, nichts nachträglich aufgesetzt.
      openSource:
        title: Vollständig Open Source
        description:
          Der gesamte Code ist öffentlich, unter MIT-Lizenz. Lies ihn,
          auditier ihn, ändere, was du brauchst — ohne jemanden zu fragen.
  connectors:
    title: Angedockt an die Tools, die du schon nutzt
    subtitle: Verbinde Gmail, Slack, GitHub, Shopify und deine Modell-Anbieter
      einmal pro Organisation — alle Agents und Automatisierungen teilen
      dieselben verwalteten Zugangsdaten.
  agents:
    title: Funktioniert mit den Agents, die du nutzt
    subtitle: Docke Claude Code, Codex, Hermes, OpenClaw, Pi und OpenCode unter
      einem Orchestrator an, den du hostest.
  compliance:
    eyebrow: SICHERHEIT
    title: Compliance, die du prüfen kannst
    independent:
      title: Unabhängig & transparent
      description:
        In der Schweiz ansässig und herstellerneutral — ohne Bindung an
        einen Cloud- oder Modellanbieter, damit dein Deployment nur dir
        verpflichtet ist.
    certified:
      title: Zertifiziert & konform
      description:
        Zertifiziert nach ISO 27001 und SOC 2 Type II, DSGVO-konform —
        Audit-Logs und Datenkontrollen zeigen dir jederzeit, wo deine Daten
        gespeichert sind.
  faq:
    eyebrow: FAQ
    title: Häufig gestellte Fragen
    stillQuestions: Noch Fragen?
    contactTeam: Team kontaktieren
    whatIsTale:
      q: Was ist Tale?
      a: 'Tale ist eine quelloffene, selbst gehostete Plattform, die KI-Agents
        orchestriert: Sie verbindet die Agents und CLIs, die dein Team bereits
        nutzt, bündelt ihr Wissen in einer regelbaren Wissensdatenbank und führt
        Automationen mit menschlicher Freigabe aus — auf deiner eigenen
        Infrastruktur oder in einer verwalteten Cloud in der Schweiz oder der
        EU.'
    openSource:
      q: Ist Tale Open Source?
      a:
        Ja. Tale ist MIT-lizenziert, und der volle Funktionsumfang steckt in der
        kostenlosen Community-Edition — Enterprise ergänzt Support und Services,
        keine Funktionen.
    onPrem:
      q: Läuft Tale komplett on-premises oder air-gapped?
      a: Ja. Tale läuft selbst gehostet in deiner VPC, auf eigener Hardware oder
        vollständig air-gapped; mit lokalen Modellen verlassen deine Daten dein
        Netzwerk nie.
    enterprisePricing:
      q: Wie funktioniert die Enterprise-Preisgestaltung?
      a:
        Enterprise wird pro Nutzer und Monat abgerechnet, mit zwei Monaten gratis bei
        jährlicher Zahlung. Speicher über das enthaltene Kontingent hinaus wird
        pro TB/Monat berechnet. Die Community-Edition bleibt für den selbst
        gehosteten Einsatz kostenlos.
    enterpriseFeatures:
      q: Gibt es zusätzliche Funktionen im Enterprise-Plan?
      a:
        Nein. Alle Produktfunktionen sind auch in der Open-Source-Version verfügbar.
        Enterprise bietet erweiterten Support und zusätzliche Services.
    byoModels:
      q: Muss ich eigene KI-Modelle mitbringen?
      a: Nein. Du kannst eigene Modelle mitbringen, musst es aber nicht. Tale
        unterstützt die meisten großen AI-Anbieter ohne Aufschlag —
        Cloud-Modellnutzung wird zu den Tarifen deines Anbieters abgerechnet und
        ist nicht in den Plänen enthalten.
    aiProviders:
      q: Kann ich meinen bevorzugten KI-Anbieter nutzen?
      a: Ja. Tale unterstützt die großen Cloud-KI-Anbieter ohne Aufschlag — die
        Nutzung wird zu den Preisen deines Anbieters abgerechnet. Du behältst
        deinen Anbieter und deine bestehende Abrechnung.
    hardware:
      q: Bietet ihr auch Hardware an?
      a:
        Ja — Hardware gibt es zur Miete, zum Leasing oder zum Kauf. Erwähne es beim
        Kontakt, und du bekommst ein Angebot für die passende Konfiguration.
    ownHardwareModels:
      q: Kann ich meine eigene Hardware und KI-Modelle nutzen?
      a: Ja. Tale ist hardware- und modellagnostisch — du kannst deine eigene
        Infrastruktur und Modelle nutzen.
    customTraining:
      q: Bietet ihr individuelles KI-Modelltraining an?
      a:
        Ja. Training und Fine-Tuning eigener Modelle sind für Kunden verfügbar. Bring
        es im Demo-Call zur Sprache, wenn du es brauchst.
  cta:
    title: Betreibe Tale auf deiner Infrastruktur.
    description: Orchestriere deine KI-Agents auf einem souveränen Stack, den du
      selbst betreibst — nimm Kontakt auf oder leg in vier Befehlen los.
