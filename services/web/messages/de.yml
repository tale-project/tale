platformAutomations:
  eyebrow: Automations
  title: Was sind Automations in Tale?
  description: Eine Automation bündelt Connectors, Agents, einen Workflow und
    die Views, die sie mitbringt — zum Beispiel eine Inbox — zu einer
    installierbaren Einheit. Der Workflow darin ist ein Graph typisierter
    Schritte — LLM, Action, Condition, Loop, Sandbox — mit Zeitplänen, Webhooks,
    Events und menschlichen Freigaben.
  capabilities:
    heading: Was steckt in einer Automation?
    description:
      Baue mehrstufige Arbeit als typisierten Graphen — LLM-, Action-,
      Condition-, Loop- und Sandbox-Schritte — mit Freigaben und versionierten
      Läufen.
    items:
      - title: Installierbare Bundles
        body:
          Owner und Admins installieren aus dem Katalog; Mitglieder nutzen Inbox,
          Agents oder Views, die sie registriert, ohne Teile von Hand
          zusammenzusetzen.
        docsLabel: Automation-Konzepte
      - title: Typisierte Workflow-Schritte
        body:
          LLM-, Action-, Condition-, Loop- und Sandbox-Schritte bilden den Graphen.
          Jeder Save erzeugt eine Version, die du wiederherstellen kannst.
        docsLabel: Workflow-Editor
      - title: Trigger, die zur Aufgabe passen
        body:
          Zeitpläne (Cron), Webhooks, Plattform-Events oder ein manueller Testlauf
          aus dem Editor.
        docsLabel: Trigger
      - title: Ausführungs-Logs
        body:
          Jeder Lauf protokolliert Status, Timing, Inputs und ein Schritt-Journal —
          Audit-Trail und Debugger an einem Ort.
        docsLabel: Ausführungs-Logs
      - title: Freigaben im Loop
        body: Vorgeschlagene Workflow-Änderungen, agent-gestartete Läufe und
          Waiting-for-Input-Pausen landen als Freigabe-Karten, bevor die Arbeit
          weitergeht.
        docsLabel: Freigaben in Workflows
  faq:
    heading: FAQ zu Automations
    items:
      - q: Was ist eine Automation in Tale?
        a:
          Eine Tale-Automation ist ein installierbares Bündel — Connectors, Agents,
          ein Workflow und fertige Views wie eine Inbox — das mehrstufige Arbeit
          mit Triggern und Freigaben ausführt.
      - q: Gibt es ein eigenständiges Workflow-Produkt?
        a:
          Nein. Ein Workflow lebt in seiner Automation. Der Editor-Tab der Automation
          ist dort, wo du den Graphen triffst.
      - q: Wann nutze ich eine Automation statt eines Agents?
        a:
          Nutze eine Automation, wenn die Aufgabe mehrere Schritte, Verzweigungen,
          Zeitpläne oder Freigaben dazwischen braucht — nicht, wenn ein
          einzelner konversationeller Agent reicht.
      - q: Kann ich einen Workflow testen, bevor er nach Zeitplan läuft?
        a:
          Ja. Der Editor hat einen manuellen Testlauf — du siehst eine komplette
          Ausführung mit Eingaben, Schritt-Journal und Timing, bevor irgendein
          Trigger live geht.
  docs:
    - label: Automation-Konzepte
      path: /platform/automations/concepts
    - label: Workflow-Editor
      path: /platform/automations/editor
    - label: Trigger
      path: /platform/automations/triggers
    - label: Ausführungs-Logs
      path: /platform/automations/execution-logs
    - label: Built-in Automations
      path: /platform/automations/builtin
  tour:
