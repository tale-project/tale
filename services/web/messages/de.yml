platformKnowledge:
  eyebrow: Knowledge
  title: Was ist Knowledge in Tale?
  description: Halte Dokumente, kurze Fakten, Website-Inhalte und strukturierte
    Datensätze für dein Team bereit. Chat und passend ausgestattete
    Projektagenten können zugängliche Quellen für Antworten und Aufgaben
    abrufen.
  capabilities:
    heading: Was steckt in Knowledge?
    description:
      Bereite hilfreiche Quellen für die Suche auf und prüfe die Belege hinter
      Antworten und Ergebnissen.
    items:
      - title: Dokumente mit Indexierungs-Pipeline
        body:
          Lade unterstützte Dateien hoch und prüfe ihren Indexierungsstatus.
          Indexierter Text lässt sich mit Quellenangaben abrufen.
        docsLabel: Dokumente
      - title: Knowledge-Einträge
        body:
          Speichere einen kurzen Fakt unter einem beständigen Thema.
          Aktualisiere den Eintrag bei Änderungen und prüfe seine
          Versionshistorie.
        docsLabel: Wissenseinträge
      - title: Website-Crawls
        body:
          Indexiere Seiten, die Agents zitieren sollen, ohne sie in Prompts zu
          pasten.
        docsLabel: Crawling
      - title: Typisierte Datensätze
        body:
          Kontakte und Produkte bündeln benannte Felder. Menschen und Agenten
          können konkrete Werte nachschlagen und ergänzende Dokumente
          hinzuziehen.
        docsLabel: Strukturierte Daten
      - title: Zugriff nach den Regeln der Quelle
        body:
          Teambeschränkungen und Projektzugriffe gelten auch bei der Suche.
          Projektagenten brauchen die passenden Plattform-Tools, um Wissen
          abzurufen.
        docsLabel: Wissen im Überblick
  faq:
    heading: FAQ zu Knowledge
    items:
      - q: Was ist Knowledge in Tale?
        a:
          Wissen enthält gemeinsame Dokumente, Einträge, indexierte Websites,
          Kontakte und Produkte. Schaffe damit eine gemeinsame Grundlage für
          Fragen und Projektaufgaben und prüfe die verwendeten Quellen.
      - q: Was bestimmt, welche Quellen abrufbar sind?
        a: Die Suche berücksichtigt Quellberechtigungen und Projektkontext.
          Projektchats können eigene Projektdateien und zugängliches
          Organisationswissen durchsuchen. Projektagenten brauchen dafür die
          passenden Tools.
      - q: Was ist der Unterschied zwischen Dokumenten und typisierten Datensätzen?
        a:
          Dokumente und Einträge liefern Text für die Suche. Kontakte und
          Produkte speichern benannte Felder zum gezielten Nachschlagen. Prüfe
          in beiden Fällen die Quelle und ihre Aktualität.
      - q: Wie wird aus einem hilfreichen Fakt gemeinsames Wissen?
        a:
          Personen mit Bearbeitungsrecht können Wissenseinträge anlegen oder
          aktualisieren; Integrationen können sie über die API pflegen. Prüfe
          einen Fakt vor dem Speichern. Chat fügt der Bibliothek nicht
          automatisch Fakten hinzu.
  docs:
    - label: Wissen im Überblick
      path: /platform/knowledge/overview
    - label: Dokumente
      path: /platform/knowledge/documents
    - label: Wissenseinträge
      path: /platform/knowledge/knowledge-entries
    - label: Crawling
      path: /platform/knowledge/crawling
    - label: Strukturierte Daten
      path: /platform/knowledge/structured-data
  tour:
    heading: So verankert Wissen Tale
    description:
      Bereite Unternehmensquellen auf, nutze sie für Fragen und
      Projektaufgaben und prüfe die Belege hinter dem Ergebnis.
    stages:
      - id: chat
        eyebrow: Chat
        title: |-
          Öffne die Quellen
          hinter einer Antwort
        description:
          Abgerufene Passagen landen als Zitat-Karten — Leser öffnen die
          Datei oder Seite, die die Antwort genutzt hat.
      - id: agents
        eyebrow: Agents
        title: |-
          Statte Agenten
          für die Suche aus
        description: Gib Projektagenten die Tools, die sie zum Abrufen von Wissen
          brauchen. Die Zugriffsregeln der Quelle bestimmen weiterhin, was ein
          Lauf lesen kann.
      - id: arena
        eyebrow: Arena
        title: |-
          Vergleiche Antworten
          und prüfe die Belege
        description:
          Stelle zwei Modellen in Arena dieselbe Frage. Vergleiche ihre
          Begründungen und prüfe, welche Quellen jede Antwort tatsächlich
          verwendet.
      - id: projects
        eyebrow: Projekte
        title: |-
          Bibliotheken wohnen
          bei ihren Teams
        description:
          Projekte legen fest, welche Dokumente neben welchen Agents und
          Mitgliedern liegen.
  demos:
    knowledge:
      label:
        'Animierte Demo: Die Org-Bibliothek indexiert das Produkthandbuch, den
        Docs-Site-Crawl, die Preisliste 2026 und einen Onboarding-FAQ-Eintrag.'
      source1: produkthandbuch-v4.pdf
      sourceType1: pdf
      source2: docs.nordwind.eu
      sourceType2: website
      source3: Preisliste 2026
      sourceType3: catalog
      source4: Onboarding-FAQ
      sourceType4: entry
    hero:
      label: "Beispieldemo: Ein Chat beantwortet eine Produktfrage mit abgerufenen
        Textstellen und zeigt Quellenangaben zu einem Handbuch und einem
        FAQ-Eintrag."
      prompt: Was hat sich in Handbuch v4 bei der Akkupflege im Winter geändert?
      routedTitle: Modell ausgewählt
      routedDetail: Claude Sonnet antwortet mit abgerufenen Produktquellen.
      reply1: V4 engt die Langzeitlagerung auf 10–20 °C ein, ab 30 Tagen Standzeit.
      reply2: Vor dem Einlagern auf 60 % laden — volle Ladung altert die Zellen
        schneller.
      reply3: Der Enteisungs-Hinweis ist in die Quick-Start-Beilage gewandert —
      reply4: und Firmware 3.2 bringt eine Ladesperre bei Minustemperaturen.
      citation1: produkthandbuch-v4.pdf
      citation2: Onboarding-FAQ
      composerModel: Claude Sonnet
    arena:
      label:
        "Beispieldemo: Zwei Modelle beantworten dieselbe Garantiefrage. Die
        Antworten und ihre Quellenangaben lassen sich vergleichen."
      prompt: 'Antworte aus dem Handbuch: Wie lange gilt die Akku-Garantie?'
      modelA: Claude Sonnet
      modelB: Gemini 2.5
      replyA1: Zwei Jahre ab Lieferung, laut Handbuch v4, Abschnitt 8.
      replyA2: Wasserschäden und Fremd-Ladegeräte schließen sie aus.
      replyA3:
        Mit Registrierung innerhalb von 90 Tagen verlängert sie sich auf drei
        Jahre.
      replyB1: 24 Monate ab Lieferung, mit Registrierung verlängerbar auf 36.
      replyB2: Das Verlängerungsfenster schließt 90 Tage nach dem Kauf.
      replyB3: Abschnitt 8 listet die Ausschlüsse — Ladegeräte und Wasserschäden.
    connect:
      label: "Beispieldemo: Projektagenten für Produkt-, Dokumentations-, Support-,
        Recherche- und Richtlinienaufgaben können Wissenstools erhalten."
