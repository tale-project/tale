platformGovernance:
  eyebrow: Governance
  title: Regeln für dein Team und deine Agenten
  description:
    Steuere Zugriffe, konfiguriere Genehmigungen für Connector-Aktionen und
    prüfe protokollierte Vorgänge. Lege Modellbudgets und Chat-Filter für die
    Arbeit deines Teams und seiner Agenten fest.
  capabilities:
    heading: Was umfasst Governance?
    description: Lege fest, welche Connector-Schreibaktionen eine Genehmigung brauchen,
      welche Werkzeuge Agenten nutzen dürfen und welche Inhalts- und
      Nutzungsregeln gelten.
    items:
      - title: Connector-Schreibaktionen genehmigen
        body: Connector-Schreibaktionen in Automatisierungen warten auf
          Genehmigung, wenn deine Richtlinie es verlangt. Für externe
          Schreibaktionen gilt das standardmäßig; Lesezugriffe und interne
          Plattformaktionen haben andere Regeln.
        docsLabel: Genehmigungen verstehen
      - title: Die vorgeschlagene Aktion prüfen
        body:
          Prüfe Ziel und genaue Eingabe vor der Genehmigung. Lehne eine
          fehlerhafte Aktion ab, korrigiere Ablauf oder Eingabe und starte
          eine neue Ausführung.
        docsLabel: Genehmigungen verstehen
      - title: Das Prüfprotokoll lesen
        body:
          Prüfe aufgezeichnete Aktionen und Genehmigungsentscheidungen mit
          handelnder Person und Zeitpunkt. Nutze das Prüfprotokoll, um
          Vorgänge nachzuvollziehen.
        docsLabel: Prüfprotokolle
      - title: Organisationsregeln festlegen
        body:
          Konfiguriere gemeinsame Anweisungen, Zugriffsregeln und
          Werkzeugfreigaben für Agenten. Durchgesetzte Rechte und Filter
          ergänzen die Anweisungen an ein Modell.
        docsLabel: Schutzregeln
      - title: Chat-Inhaltsfilter konfigurieren
        body:
          Aktiviere Inhaltsschutz, Erkennung personenbezogener Daten und
          optionale Moderation für die gewünschten Chat-Richtungen. Teste
          passende Muster und das Verhalten bei Fehlern.
        docsLabel: Schutzregeln
      - title: Budgets für erfasste Nutzung setzen
        body: Verfolge erfasste Modellnutzung und lege Budgets für unterstützte
          Zugriffswege fest, darunter verwaltete Agentenausführungen. Direkte
          Abonnementaufrufe nutzen die Kontrollen des Anbieters.
        docsLabel: Nutzungsanalyse
  faq:
    heading: FAQ zu Governance
    items:
      - q: Was steuert die Governance?
        a:
          Governance umfasst Zugriffsregeln, Genehmigungsrichtlinien für
          Connectors, Prüfereignisse, Nutzungsbudgets und konfigurierbare
          Chat-Filter. Jede Kontrolle hat einen eigenen Geltungsbereich.
      - q: Wo entscheide ich über eine Connector-Genehmigung?
        a:
          Öffne die wartende Automatisierungsausführung. Arbeitet sie an einer
          Aufgabe, erscheint die Genehmigungskarte auch dort.
          Connector-Genehmigungen sind von der Prüfung eines abgeschlossenen
          Agentenergebnisses getrennt.
      - q: Kann ich festlegen, welche Connector-Schreibaktionen eine
          Genehmigung brauchen?
        a:
          Ja. Die Richtlinie lässt sich für einen Connector oder eine einzelne
          Aktion festlegen. Externe Schreibaktionen brauchen standardmäßig
          eine Genehmigung. Eine Richtlinienänderung entscheidet keine bereits
          wartende Anfrage.
      - q: Wartet jede Agentenaktion auf Genehmigung?
        a:
          Nein. Der Connector-Broker stellt Agenten Leseaktionen bereit;
          genehmigungspflichtige Connector-Schreibaktionen laufen über
          Automatisierungsknoten. Direkte GitHub-Werkzeuge und ausdrücklich
          freigegebene Secrets haben eigene Zugriffswege. Prüfe auch diese
          Freigaben.
      - q: Wie gelten Inhaltsfilter und Datenkontrollen?
        a: Chat-Filter können die konfigurierten Ein- und Ausgaben prüfen.
          Modell-API-Endpunkte filtern nur Eingaben, keine Modellausgaben. Die
          Erkennung personenbezogener Daten hängt von den eingerichteten
          Mustern ab. Bewerte Betrieb, Anbieter und Verfahren gemeinsam.
  docs:
    - label: Freigabe-Konzepte
      path: /platform/approvals/concepts
    - label: Freigaben konfigurieren
      path: /platform/approvals/configure
    - label: Freigaben in Workflows
      path: /platform/automations/approvals-in-workflows
    - label: Audit-Logs
      path: /platform/admin/governance/audit-logs
    - label: Guardrails
      path: /platform/admin/governance/guardrails
  tour:
    heading: Regeln bei der Arbeit nachvollziehen
    description: Prüfe Ablaufausführungen, vergleiche Antworten und kontrolliere die
      Werkzeuge und Quellen, die Agenten nutzen können.
    stages:
      - id: automations
        eyebrow: Automatisierungen
