platformHub:
  title: Wie funktioniert die Tale-Plattform?
  description: 'Tale ist der Orchestrator für KI-Agents: ein Ort, an dem deine
    Agents Wissen teilen, Automationen ausführen und denselben Freigaben
    unterstehen — selbst gehostet, zu deinen Bedingungen.'
  modulesHeading: Plattform-Module
  modulesDescription:
    Sechs Module — jedes für sich nützlich; zusammen ein System
    mit eingebauter Governance. Öffne ein Modul für seine eigene Tour.
  tour:
    heading: So fügt sich die Plattform zusammen
    description:
      Jedes Fenster unten ist ein Modul mit seiner eigenen Geschichte —
      in Knowledge verankert, durch Automations ausgeführt, von Governance
      angehalten, in Arena verglichen. Öffne ein Modul für die ganze Tour.
    stages:
      - id: agents
        eyebrow: Agents
        title: |-
          Jeder Agent,
          ein Roster
        description: Claude Code, Codex, Hermes, OpenClaw — angedockt neben
          In-Product-Agents, damit Arbeit zum Tool geht, das dein Team schon
          nutzt.
      - id: knowledge
        eyebrow: Wissen
        title: |-
          Eine Bibliothek,
          überall zitiert
        description:
          Produkthandbuch, Docs-Crawl, Preisliste, ein FAQ-Eintrag — eine
          indexierte Bibliothek, aus der jeder Agent zitiert.
      - id: automations
        eyebrow: Automatisierungen
        title: |-
          Mehrstufige Arbeit
          delegieren
        description:
          Eine Rechnungs-Pipeline liest Positionen aus, hält alles über CHF
          5'000 an und bucht den Rest ins ERP — jeder Lauf im Log.
      - id: govern
        eyebrow: Governance
        title: |-
          Angehalten, bis
          jemand entscheidet
        description:
          Selbst ein Wissens-Eintrag wartet auf einen Menschen. Freigeben —
          und der Entscheid landet im Audit-Log, das Budget im Blick.
      - id: arena
        eyebrow: Arena
        title: |-
          Zwei Entwürfe,
          ein Briefing
        description: Ein Ankündigungs-Briefing, zwei Modelle nebeneinander — der
          stärkere Entwurf geht raus.
      - id: projects
        eyebrow: Projekte
        title: Nach Team abgrenzen
        description:
          Jedes Fenster oben lief in einem Workspace. Projekte entscheiden,
          welche Agents, Bibliotheken und Mitglieder zusammensitzen — und wer
          die Läufe sieht.
  faq:
    heading: Plattform-FAQ
    items:
      - q: Was ist die Plattform in Tale?
        a:
          'Tale ist ein selbst gehosteter Orchestrator für KI-Agents: Agents verbinden,
          Wissen bündeln, Automatisierungen ausführen und jede Aktion steuern —
          auf Infrastruktur, die du betreibst.'
      - q: Welche Module gehören zu Tale?
        a:
          Chat, Projekte, Knowledge, Agents, Automations und Governance — die Projekte
          grenzen Arbeit, Dateien und Agents nach Team ab.
      - q: Ist Tale Open Source?
