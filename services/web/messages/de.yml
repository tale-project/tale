platformAutomations:
  eyebrow: Automations
  title: Was sind Automations in Tale?
  description: Automatisierungen machen wiederkehrende Projektarbeit wiederholbar.
    Verbinde Modellaufrufe, Agentenschritte und Aktionen zu einem
    versionierten Workflow, teste ihn und starte ihn manuell oder über einen
    eingerichteten Auslöser.
  capabilities:
    heading: Abläufe definieren und wiederholen
    description:
      Halte Schritte, gespeicherte Versionen, Auslöser und Ausführungsverlauf
      zusammen. So kann dein Team nachvollziehen, wie wiederkehrende Arbeit
      ausgeführt wird.
    items:
      - title: Gespeicherte Versionen und Bereitstellung
        body:
          Speichere Änderungen als neue Workflow-Version. Stelle die Version
          für künftige Live-Läufe bereit. Laufende Ausführungen behalten ihre
          Startversion.
        docsLabel: Konzepte der Automatisierung
      - title: Typisierte Workflow-Schritte
        body:
          Verbinde Modellaufrufe, Agentenarbeit in Sandboxes,
          Datentransformationen, Unterautomatisierungen und angebundene
          Aktionen. Ergänze Bedingungen oder Wiederholungen, wo sie
          unterstützt werden.
        docsLabel: Workflow-Editor
      - title: Trigger, die zur Aufgabe passen
        body:
          Zeitpläne (Cron), Webhooks, Plattform-Events oder ein manueller Testlauf
          aus dem Editor.
        docsLabel: Trigger
      - title: Ausführungs-Logs
        body:
          Prüfe Status, Eingaben, Ausgaben und Schrittverlauf eines Laufs. Die
          erfassten Connector-Aktionen helfen dir nachzuvollziehen, was
          passiert ist.
        docsLabel: Ausführungs-Logs
      - title: Freigaben im Loop
        body: Connector-Regeln können geschützte Schreibzugriffe bis zur Freigabe
          anhalten. Ein Agentenschritt kann außerdem eine Person nach
          fehlenden Informationen fragen, bevor er fortfährt.
        docsLabel: Konzepte der Automatisierung
  faq:
    heading: FAQ zu Automations
    items:
      - q: Was ist eine Automation in Tale?
        a:
          Eine Automatisierung definiert einen wiederholbaren Workflow mit
          Eingaben, Schritten und Ausgaben. Versionen, Bereitstellung,
          Auslöser und Ausführungsverlauf helfen deinem Team, den Ablauf zu
          testen und zu betreiben.
      - q: Gibt es ein eigenständiges Workflow-Produkt?
        a:
          Nein. Ein Workflow lebt in seiner Automation. Der Editor-Tab der Automation
          ist dort, wo du den Graphen triffst.
      - q: Wann nutze ich eine Automation statt eines Agents?
        a:
          Nutze eine Automatisierung für wiederholbare Schritte, Bedingungen,
          Zeitpläne oder angebundene Aktionen. Nutze einen Projektagenten für
          eine Aufgabe mit einem prüfbaren Ergebnis. Eine Automatisierung kann
          Agentenarbeit enthalten.
      - q: Kann ich einen Workflow testen, bevor er nach Zeitplan läuft?
        a:
          Ja. Teste eine gespeicherte Version vor der Bereitstellung oder dem
          Aktivieren eines Auslösers. Testläufe simulieren Connector-Aktionen.
          Live-Läufe können verbundene Systeme ändern und eine Freigabe
          erfordern.
  docs:
    - label: Konzepte der Automatisierung
      path: /platform/automations/concepts
    - label: Workflow-Editor
      path: /platform/automations/editor
    - label: Trigger
      path: /platform/automations/triggers
    - label: Ausführungs-Logs
      path: /platform/automations/execution-logs
    - label: Built-in Automations
      path: /platform/automations/builtin
  tour:
    heading: So laufen Automatisierungen in Tale
    description: Definiere den Ablauf, wähle die nötigen Schritte und Daten und prüfe
      jeden Lauf. Lege Freigaberegeln für geschützte Connector-Schreibzugriffe
      fest.
    stages:
      - id: govern
        eyebrow: Freigaben
        title: |-
          Human-in-the-Loop
          bevor es rausgeht
        description:
          Wenn die Regeln eine Freigabe verlangen, wartet ein
          Connector-Schreibzugriff auf eine Person. Die Freigabe erlaubt den
          Ausführungsversuch, eine Ablehnung verhindert ihn.
      - id: agents
        eyebrow: Agents
        title: |-
          Gib einem Agenten
          einen Workflow-Schritt
        description:
          Konfiguriere einen Agentenschritt mit eigener Laufzeit, Modell,
          Anweisungen und Ausstattung. Nutze einen Modellaufruf, wenn eine
          einzelne Antwort genügt.
      - id: knowledge
        eyebrow: Wissen
        title: |-
          Stelle die benötigten
          Quellen bereit
        description:
          Füge Wissenssuche hinzu oder stelle Referenzdateien bereit, wo der
          Workflow sie braucht. Gib die Ergebnisse an spätere Schritte weiter
          und prüfe ihre Ausgaben.
      - id: projects
        eyebrow: Projekte
        title: |-
          Workflows nach
          Workspace abgrenzen
        description:
          Ordne eine Automatisierung den passenden Projekten zu.
          Projektzugriff und die pro Schritt erteilten Tools bestimmen, worauf
          sie zugreifen kann.
