      replyB1: Beginne mit dem Kundenproblem, das die Version löst.
      replyB2: Liste die Änderungen mit einem Link zur jeweiligen Quelle.
      replyB3: Nenne zum Schluss die Angaben zur Einführung aus dem Briefing.
    projects:
      label:
        "Beispieldarstellung: Projekte halten zugehörige Chats, Aufgaben,
