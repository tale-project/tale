          bevor es rausgeht
        description:
          Der Lauf pausiert genau dort, wo du es festgelegt hast. Freigeben
          setzt den angehaltenen Schritt mit Journal-Eintrag fort; Ablehnen
          stoppt den Lauf.
      - id: agents
