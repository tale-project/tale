platformProjects:
  eyebrow: Projekte
  title: Was sind Projekte in Tale?
  description: Projekte sind geteilte Arbeitsbereiche, die Chats, Dateien,
    Anweisungen und das Task-Board zu einem Vorhaben bündeln — der Kontext
    bleibt bei der Arbeit, und Agents übernehmen Aufgaben dort, wo dein Team sie
    liegen lässt.
  capabilities:
    heading: Ein Arbeitsbereich pro Vorhaben
    description: Ein Projekt hält alles, was ein Kontakt, ein Launch oder eine
      Recherche braucht, an einem Ort — und setzt Agents mitten darin an die
      Arbeit.
    items:
      - title: Kontext, der bei der Arbeit bleibt
        body: Chats, Dateien, Anweisungen und Aufgaben liegen auf den Tabs des
          Projekts — niemand kopiert Hintergrund in einen frischen Composer.
        docsLabel: Projekt-Überblick
      - title: Ein Board, von dem Agents arbeiten
        body:
          Weise eine Aufgabenkarte einem Agent zu, und das Task-Ops-Paket führt sie
          aus — Triage, Ausführung, Review und Eskalation inklusive.
        docsLabel: Aufgaben-Automatisierung
      - title: Ein Backlog mit menschlicher Triage
        body:
          Automatisierungen schlagen Arbeit vor; jemand startet, was sich lohnt, und
          schließt, was nicht. Nichts läuft ungeprüft.
        docsLabel: Projekt-Backlog
      - title: Dateien, die im Projekt bleiben
        body: Der Wissens-Tab hält den Ordnerbaum des Projekts — im Projekt für
          Retrieval indexiert, außerhalb unsichtbar.
        docsLabel: Dateien verwalten
      - title: Die richtigen Agents griffbereit
        body:
          Kuratiere, welche Agents und Modelle Mitglieder im Projekt sehen — der
          empfohlene Spezialist ist einen Klick entfernt.
        docsLabel: Agents und Modelle
  faq:
    heading: Projekte-FAQ
    items:
      - q: Was ist ein Projekt in Tale?
        a: Ein geteilter Arbeitsbereich, der Chats, Dateien, Anweisungen und
          Aufgaben zu einem Vorhaben bündelt — ein Kontakt, ein Launch, eine
          Recherche — damit der Kontext bei der Arbeit bleibt.
      - q: Wie arbeiten Agents an Projektaufgaben?
        a:
          'Die Zuweisung einer Board-Aufgabe an einen Agent startet den Task-Ops-Loop:
          Der Agent führt aus, ein menschliches Review-Gate prüft das Ergebnis,
          und Budgets, Parallelitätslimits und ein Notausschalter halten Läufe
          in Leitplanken.'
      - q: Wer sieht die Chats und Dateien eines Projekts?
        a:
          Nur die Mitglieder des Projekts. Chats, Dateien und Threads bleiben auf ihren
          Arbeitsbereich beschränkt — Support-Eskalationen bleiben aus dem
          Engineering raus.
      - q: Was unterscheidet ein Projekt von einem Chat?
        a:
          'Ein Chat beantwortet eine Frage und ist vorbei. Ein Projekt trägt laufende
          Arbeit: geteilter Verlauf, ein Task-Board, Anweisungen für jeden Chat
          und Dateien, die Agents zitieren können.'
  docs:
    - label: Projekt-Überblick
      path: /platform/projects/overview
    - label: Projekt-Konzepte
      path: /platform/projects/concepts
    - label: Aufgaben-Automatisierung
      path: /platform/projects/task-automation
    - label: Projekt-Backlog
      path: /platform/projects/backlog
    - label: Dateien verwalten
      path: /platform/projects/manage-files
    - label: Agents und Modelle
      path: /platform/projects/project-agents
  tour:
    heading: Wie Projekte Arbeit erledigen
    description:
      Weise eine Aufgabe einem Agent zu, setz den Projekt-Chat mit seinem
      Kontext fort, stütze Antworten auf Projektdateien — und halte, was
      rausgeht, hinter dem Review.
    stages:
      - id: tasks
        eyebrow: Aufgaben
        title: |-
          Karte zuweisen,
          ein Agent übernimmt
        description:
          Die Zuweisung einer Board-Aufgabe an einen Agent startet den
          Task-Ops-Loop — Ausführung, Prüfungen und Eskalation laufen über
          Workflows, die deiner Organisation gehören.
      - id: chat
        eyebrow: Chats
        title: |-
          Jeder Chat startet
          mit dem Kontext
        description:
          Projekt-Anweisungen und -Dateien reisen in jedem Thread mit — ein
          neuer Chat setzt den Relaunch dort fort, wo der letzte aufgehört hat.
      - id: knowledge
        eyebrow: Wissen
        title: |-
          Dateien, die im
          Projekt bleiben
        description:
          Der Wissens-Tab hält den Ordnerbaum des Projekts für Retrieval
          indexiert — in Projekt-Chats zitiert, außerhalb unsichtbar.
      - id: govern
        eyebrow: Review
        title: |-
          Nichts geht raus
          ohne Entscheidung
        description: Würde eine Aufgabe veröffentlichen oder senden, landet die
          Freigabe-Karte beim Projekt-Owner — und die Entscheidung bleibt im
          Audit-Trail.
  demos:
