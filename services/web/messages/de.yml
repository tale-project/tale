platformChat:
  eyebrow: Chats
  title: Chats in Tale
  description:
    'Chat ist der Alltagseinstieg: Agent wählen (oder keinen), tippen,
    und eine Antwort streamt mit Zitationen, Tool-Aufrufen und optionalen
    Arena-Vergleichen — die Oberfläche, in die jedes andere Plattform-Modul
    einmündet.'
  capabilities:
    heading: Was umfasst Chat?
    description: Alltags-KI, die ihre Quellen zitiert, deine Tools aufruft und
      Modelle nebeneinander vergleicht.
    items:
      - title: Composer mit Auto-Routing
        body:
          Der Composer trägt Agent-Picker und Modell-Picker. Auto lässt Tale das
          Modell für den Thread wählen.
        docsLabel: Chat-Grundlagen
      - title: Zitationen bei jeder verankerten Antwort
        body:
          Abgerufene Passagen tragen ihre Quelle, damit Leser die Datei, den Eintrag
          oder die Seite öffnen können, die die Antwort nutzte.
        docsLabel: Chat-Grundlagen
      - title: Arena-Modus
        body:
          Vergleiche Modelle oder Agents nebeneinander, wenn du eine zweite Meinung
          brauchst, bevor du dich festlegst.
        docsLabel: Arena-Modus
      - title: Anhänge und Canvas
        body:
          Lade unterstützte Dateien hoch; öffne Canvas, wenn die Antwort ein langes
          Dokument oder Diagramm neben dem Thread braucht.
        docsLabel: Anhänge
      - title: Agents im Thread
        body:
          Wechsle Agents mitten im Thread, starte One-Shot-Spezialisten oder behalte
          einen festen Agent fürs Gespräch.
        docsLabel: Agents im Chat
  faq:
    heading: FAQ zu Chat
    items:
      - q: Was ist Chat in Tale?
        a:
          Tale Chat ist die Alltagsoberfläche, auf der du einen Agent wählst, eine
          Nachricht sendest und eine gestreamte Antwort mit Zitationen und
          Tool-Aufrufen liest.
      - q: Funktioniert Chat ohne Agent?
        a:
          Ja. Roher Chat nutzt die Modell-Defaults beim Erkunden; greif zum Agent, wenn
          dieselbe Frage wiederkehrt.
      - q: Was ist der Arena-Modus?
        a:
          Der Arena-Modus führt denselben Prompt gegen mehr als ein Modell oder Agent
          aus, damit du Antworten vergleichen kannst, bevor du wählst.
      - q: Kann Chat auch handeln — oder nur antworten?
        a:
          Beides. Würde eine Antwort eine Connector aufrufen oder einen Workflow
          starten, pausiert die Aktion zuerst auf einer Freigabe-Karte im Chat —
          genau dort, wo die Arbeit passiert.
  docs:
    - label: Chat-Übersicht
      path: /platform/chat/overview
    - label: Chat-Grundlagen
      path: /platform/chat/basics
    - label: Arena-Modus
      path: /platform/chat/arena-mode
    - label: Agents im Chat
      path: /platform/chat/agents-in-chat
    - label: Anhänge
      path: /platform/chat/attachments
  tour:
    heading: So funktioniert Chat in Tale
    description: Von der gestützten Antwort über Arena, Freigaben, Knowledge und
      abgegrenzte Projekte — dieselben Oberflächen wie jeden Tag.
    stages:
      - id: govern
        eyebrow: Freigaben
        title: |-
          Freigaben leben
          im Thread
        description:
          Würde eine Antwort nach Slack posten, Mails senden oder ein System
          ändern, landet eine Freigabe-Karte im Thread, bevor etwas rausgeht.
      - id: projects
        eyebrow: Projekte
        title: |-
          Threads bleiben
          bei ihrem Team
        description:
          Ein Thread gehört zu seinem Workspace. Die Entwürfe des Comms-Agent
          bleiben bei Comms — Engineering muss nie daran vorbeiscrollen.
      - id: agents
        eyebrow: Agents
        title: |-
          Den Agent wählen,
          der die Frage besitzt
        description:
          Wechsle Spezialisten mitten im Thread oder lass Auto routen — jeder
          Agent bringt eigene Anweisungen, Wissen und Tools mit.
      - id: knowledge
