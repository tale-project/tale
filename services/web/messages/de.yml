platformAgents:
  eyebrow: Agenten
  title: Was sind Agents in Tale?
  description: Projektagenten bearbeiten Aufgaben gemeinsam mit deinem Team. Gib jedem
    Agenten Anweisungen, eine unterstützte Laufzeit, ein Modell und Tools.
    Verfolge die Arbeit in der Sandbox und prüfe Berichte und Dateien.
  capabilities:
    heading: Was können Agents?
    description:
      Richte wiederverwendbare Agenten für Projektaufgaben ein – von Recherche
      und Dokumenten bis zu Code-Änderungen und Reviews.
    items:
      - title: Klare Aufgabe und Laufzeit
        body:
          Wähle eine Laufzeit, ein kompatibles Modell mit Anbieter, dauerhafte
          Anweisungen und die nötige Ausstattung.
        docsLabel: Agent-Konzepte
      - title: Unterstützte Agent-Laufzeiten
        body:
          Binde Claude Code, Codex, Hermes und OpenClaw als Agent-Laufzeit, auf der ein
          Projekt-Agent oder ein Automatisierungs-Agent-Knoten läuft.
        docsLabel: Agent-Laufzeiten
      - title: Delegation zwischen Agents
        body:
          Ein entsprechend ausgestatteter Manager-Agent kann andere Agenten
          für startbereite Aufgaben desselben Projekts starten. Dabei gelten
          Delegations-, Zugriffs- und Kapazitätsgrenzen.
        docsLabel: Aufgaben-Automatisierung
      - title: Skills als wiederverwendbare Bundles
        body:
          Gib Agenten wiederverwendbare Anweisungen und Hilfsdateien als
          Skills. Statte sie etwa für die Dokumentenerstellung oder das Prüfen
          von Änderungen aus.
        docsLabel: Projekt-Agenten
      - title: Tools für den Projektkontext
        body:
          Erteile die Plattform-Tools, mit denen der Agent Aufgaben findet,
          Dateien liest und Wissen abruft. Für die Quellen gelten weiterhin
          ihre Zugriffsregeln.
        docsLabel: Wissen
  faq:
    heading: FAQ zu Agents
    items:
      - q: Was ist ein Agent in Tale?
        a:
          Ein Projektagent ist ein wiederverwendbarer Agent in einem Projekt.
          Laufzeit, Modell, Anweisungen und Tools bestimmen seine
          Arbeitsweise. Berichte und erzeugte Dateien bleiben zur Prüfung bei
          der Aufgabe.
      - q: Können wir eigene Abos oder API-Schlüssel nutzen?
        a:
          Ja. Verbinde eigene API-Zugangsdaten oder nutze ein unterstütztes
          Anthropic-Abo mit Claude Code beziehungsweise ein ChatGPT-Abo mit
          Codex für Aufgaben- und Automatisierungsagenten. Ein Administrator
          richtet die Zugangsdaten oder den Token-Broker ein. Chat braucht
          API-Zugangsdaten; Verfügbarkeit und Limits von Abos hängen vom
          Anbieter und Tarif ab.
      - q: Wann nutze ich einen Agent statt eines Workflows?
        a:
          Nutze einen Projektagenten für ein Ergebnis, das Tools, Dateien oder
          mehrere Arbeitsrunden braucht. Nutze eine Automatisierung, wenn du
          wiederholbare Schritte, Bedingungen oder Auslöser festlegen kannst.
      - q: Kann jeder Agent ein anderes Modell nutzen?
        a:
          Ja. Wähle für jeden Projektagenten ein Modell und einen Anbieter,
          passend zur Laufzeit und zum Modellangebot deiner Organisation.
          Änderungen gelten für spätere Läufe.
  docs:
    - label: Agent-Konzepte
      path: /platform/agents/concepts
    - label: Projekt-Agenten
      path: /platform/projects/project-agents
    - label: Agent-Laufzeiten
      path: /platform/agents/harnesses
    - label: Aufgaben-Automatisierung
      path: /platform/projects/task-automation
    - label: Wissen
      path: /platform/knowledge/overview
  tour:
    heading: So zeigen sich Agents in Tale
    description:
      Richte Agenten für ein Projekt ein, gib ihnen die nötigen Tools und den
      Kontext und verfolge ihre Arbeit anhand von Berichten und Ergebnissen.
    stages:
      - id: projects
        eyebrow: Projekte
        title: |-
          Agents nach Team
          abgrenzen
        description:
          Jedes Projekt hat eigene Agentenkonfigurationen. Der Projektzugriff
          bestimmt, wer die Agenten und ihre Aufgaben sehen kann.
      - id: knowledge
        eyebrow: Wissen
        title: |-
          Jeden Agent in dem
          verankern, was du weißt
        description: Füge Aufgabenbeschreibung und Referenzdateien hinzu und erteile
          Tools für zugängliches Unternehmenswissen. Sage dem Agenten klar,
          welche Quellen er verwenden soll.
  demos:
