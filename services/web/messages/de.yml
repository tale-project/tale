platformGovernance:
  eyebrow: Governance
  title: Was ist Governance in Tale?
  description:
    'Governance ist die Naht zwischen Agent-Initiative und menschlichem
    Urteil: Freigabe-Karten halten Aktionen an, bis jemand entscheidet, jede
    Entscheidung landet im Audit-Log, und Ausgaben bleiben sichtbar — ohne
    separates Freigabe-Postfach.'
  capabilities:
    heading: Was umfasst Governance?
    description: Setze einen Menschen dort in den Loop, wo es zählt — mit
      Audit-Trail, Budget-Kontrollen und Filtern, die sensible Daten aus Prompts
      und Antworten heraushalten.
    items:
      - title: Freigabe-Karten im Chat
        body: Pläne, Dokument-Schreibvorgänge, Knowledge-Schreibvorgänge,
          Connector-Aufrufe, MCP-Tools und Workflow-Läufe pausieren bis
          Freigabe oder Ablehnung.
        docsLabel: Freigabe-Konzepte
      - title: Änderungen bei Connectors vorschlagen
        body:
          Beschreibe, was falsch ist; der Agent überarbeitet den Aufruf statt die
          Arbeit abzubrechen.
        docsLabel: Freigabe-Konzepte
      - title: Audit-Trail
        body:
          Jede Entscheidung protokolliert Akteur, Aktion und Zeitstempel. Gelöste
          Karten bleiben im Transkript.
        docsLabel: Audit-Logs
      - title: Guardrails und Policies
        body:
          Org-weite Guardrails und die Run-Code-Policy setzen die Grenzen dessen,
          was Agents überhaupt versuchen dürfen — bevor eine Karte erscheint.
        docsLabel: Guardrails
      - title: PII in beide Richtungen gefiltert
        body:
          Jede Chat-Nachricht durchläuft Inhaltssicherheit, PII-Erkennung und
          optional einen Moderations-Provider — auf dem Weg hinein und hinaus.
          Treffer werden blockiert, maskiert oder markiert; der Fundtext selbst
          wird nie gespeichert.
        docsLabel: Guardrails
      - title: Ausgaben-Sichtbarkeit
        body: Usage Analytics und Budgets halten Modell-Ausgaben für Admins sichtbar.
        docsLabel: Usage Analytics
  faq:
    heading: FAQ zu Governance
    items:
      - q: Was ist Governance in Tale?
        a:
          Tale Governance hält Agent-Aktionen hinter Freigabe-Karten im Chat, schreibt
          Entscheidungen ins Audit-Log und macht Ausgaben für Admins sichtbar.
      - q: Gibt es ein separates Freigabe-Postfach?
        a:
          Nein. Freigaben werden im Gespräch entschieden, das sie unterbrechen — von
          wem auch immer diesen Chat hält.
      - q: Kann ich wählen, welche Aktionen eine Freigabe brauchen?
        a:
          Ja. Freigaben sind pro Aktionstyp konfigurierbar — Pläne, Dokument- und
          Knowledge-Schreibvorgänge, Connector-Aufrufe, MCP-Tools und
          Workflow-Läufe können jeweils eine menschliche Entscheidung verlangen,
          bevor sie laufen.
      - q: Können Agents Emails ohne Freigabe senden?
        a:
          Nicht, wenn du dafür eine Freigabe verlangst. Ausgehende Aktionen warten als
          Karten im Chat, bis jemand entscheidet — welche Aktionstypen eine
          Entscheidung brauchen, legst du selbst fest.
      - q: Wie hilft Tale bei DSGVO und PII?
        a: Verarbeite Daten auf Infrastruktur, die du kontrollierst, lass die
          PII-Erkennung persönliche Daten maskieren, bevor sie ein Modell
          erreichen oder verlassen, und zeig Auditoren das Audit-Log. Tale ist
          DSGVO-konform, zertifiziert nach ISO 27001 und SOC 2 Type II — DPA
          sowie technische und organisatorische Maßnahmen sind veröffentlicht.
  docs:
    - label: Freigabe-Konzepte
      path: /platform/approvals/concepts
    - label: Freigaben konfigurieren
      path: /platform/approvals/configure
    - label: Freigaben in Workflows
      path: /platform/automations/approvals-in-workflows
    - label: Audit-Logs
      path: /platform/admin/governance/audit-logs
    - label: Guardrails
      path: /platform/admin/governance/guardrails
  tour:
    heading: So hält Governance die Linie
    description: Gib frei, bevor Aktionen rausgehen, auditiere jeden Lauf,
      vergleiche Modelle ehrlich und halte Agents in deinen Regeln.
    stages:
      - id: automations
        eyebrow: Automatisierungen
        title: |-
          Jeder freigegebene Lauf
          hinterlässt ein Log
        description:
          'Ein nächtlicher Access-Review läuft nach Zeitplan und alarmiert
          #security bei neuen Admin-Rechten — jede Ausführung nummeriert im
          selben Journal, in das auch Freigaben schreiben.'
      - id: arena
        eyebrow: Arena
        title: |-
          Vergleichen, bevor
          du zusagst
        description:
          Gerade bei heikler Formulierung gehen Modelle auseinander. Arena
          entwirft dieselbe Antwort zweimal — die sicherere Version geht raus.
      - id: agents
        eyebrow: Agents
        title: |-
          Agents bleiben in
          Budgets und Tools
        description:
          Ausgabenkontrolle und Tool-Freigaben reisen mit jedem Agent —
          Governance ist kein nachträglicher Aufsatz.
      - id: knowledge
        eyebrow: Wissen
        title: |-
          Zitiere, welche Policy
          die Antwort erlaubt hat
        description:
          Belegte Antworten zeigen Policy- und Runbook-Quellen — Auditoren
          folgen derselben Spur.
  demos:
    govern:
      label:
        'Animierte Demo: Ein Agent will drei Knowledge-Einträge aus einem Thread
        veröffentlichen; eine Person gibt frei, und die Entscheidung landet im
        Audit-Log.'
      approvalTitle: 3 Knowledge-Einträge aus diesem Thread veröffentlichen?
      requester: Policy-Agent · Knowledge-Write
      audit1: Freigegeben von lena@nordwind.eu
      audit2: 3 Einträge zur Policy-Bibliothek hinzugefügt
      audit3: 'Audit-Eintrag #8841 geschrieben'
      budgetValue: CHF 220 / 800
    automation:
      label: 'Animierte Demo: Ein geplanter Access-Review prüft jede Nacht die
        Berechtigungs-Änderungen und alarmiert #security, sobald neue
        Admin-Rechte auftauchen.'
      trigger: Täglich 01:00
      llm: Rechte prüfen
      condition: Neue Admins?
      branchYes: Ja
      action: '#security-Alarm'
      actionAlt: Bericht ablegen
      run1: '#98'
      runTone1: done
      duration1: 3,4s
      run2: '#99'
      runTone2: done
      duration2: 3,1s
      run3: '#100'
      runTone3: running
      duration3: 0,6s
    arena:
      label:
        'Animierte Demo: Zwei Modelle entwerfen dieselbe Access-Exception-Antwort
        nebeneinander — die sicherere Formulierung geht raus.'
      prompt: Ein Contractor will Admin auf der Staging-Org außerhalb der
        Access-Policy — entwirf die Antwort.
      agent: Access-Agent
      modelA: Claude Sonnet
      modelB: GPT-5.5
      replyA1: Lehne dauerhaften Admin ab und zitiere die Least-Privilege-Klausel.
      replyA2: Biete einen zeitlich begrenzten Break-Glass-Grant mit Audit an.
      replyA3: Leite an Security weiter, falls sie Production brauchen.
      replyB1: Anerkenne die Deadline, bevor du das Access-Fenster wiederholst.
      replyB2: Schlage eine Read-only-Rolle plus einen Pair-Engineer als
        dokumentierten Weg vor.
      replyB3: Markiere die Anfrage für das wöchentliche Access-Exceptions-Review.
    knowledge:
      label:
        'Animierte Demo: Der Richtlinien-Korpus, den Auditoren öffnen können —
