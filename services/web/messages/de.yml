platformProjects:
  eyebrow: Projekte
  title: Was sind Projekte in Tale?
  description: Bringe Teammitglieder, Aufgaben, Projektagenten und Referenzdateien für
    ein gemeinsames Ziel zusammen. Plane die Arbeit auf dem Board, starte
    Agentenaufgaben und prüfe die Ergebnisse mit deinem Team.
  capabilities:
    heading: Ein Arbeitsbereich pro Vorhaben
    description: Koordiniere einen Launch, eine Recherche oder eine interne Verbesserung
      mit einem gemeinsamen Board, Projektanweisungen und passend
      ausgestatteten Agenten.
    items:
      - title: Kontext, der bei der Arbeit bleibt
        body: Bündle Aufgaben, Anweisungen und Referenzdateien in einem Projekt.
          Projektchats nutzen dessen Anweisungen und können relevante Dateien
          abrufen.
        docsLabel: Projekt-Überblick
      - title: Ein Board, von dem Agents arbeiten
        body:
          Weise eine Aufgabe einem Projektagenten zu und starte sie. Verfolge
          den Fortschritt und prüfe den Bericht und die angehängten Dateien,
          sobald der Agent fertig ist.
        docsLabel: Aufgaben-Automatisierung
      - title: Ein Backlog für vorgeschlagene Arbeit
        body:
          Sammle Ideen und von Agenten vorgeschlagene Aufgaben im Backlog.
          Kläre den Auftrag, weise die Aufgabe zu und entscheide, was
          gestartet wird.
        docsLabel: Projekt-Backlog
      - title: Dateien, die im Projekt bleiben
        body: Ordne Referenzdateien im Wissen-Tab des Projekts. Indexierte Inhalte
          sind im Projektkontext verfügbar; dabei gelten die Zugriffsregeln.
        docsLabel: Dateien verwalten
      - title: Agenten für dein Projekt ausstatten
        body:
          Erstelle Projektagenten mit Rolle, kompatibler Laufzeit und Modell,
          Anweisungen und Tools. Weise die Arbeit dem dafür ausgestatteten
          Agenten zu.
        docsLabel: Projekt-Agenten
  faq:
    heading: Projekte-FAQ
    items:
      - q: Was ist ein Projekt in Tale?
        a: Ein geteilter Arbeitsbereich, der Chats, Dateien, Anweisungen und
          Aufgaben zu einem Vorhaben bündelt — ein Kontakt, ein Launch, eine
          Recherche — damit der Kontext bei der Arbeit bleibt.
      - q: Wie arbeiten Agents an Projektaufgaben?
        a:
          Weise eine Aufgabe zu und starte dann den Agenten oder verschiebe
          die Aufgabe auf In Bearbeitung. Der Agent arbeitet in seiner Sandbox
          und liefert einen Bericht und Dateien zur Prüfung. Eine Person oder
          ein separat zugewiesener Prüfagent kann das Ergebnis prüfen. Die
          Zuweisung allein startet keinen Lauf.
      - q: Wer sieht die Chats und Dateien eines Projekts?
        a:
          Projekte sind standardmäßig für die ganze Organisation zugänglich.
          Beschränke den Projektzugriff bei Bedarf auf ausgewählte Teams;
          Administratoren behalten Zugriff. Chats bleiben persönlich, bis sie
          ausdrücklich geteilt werden – auch Chats innerhalb eines Projekts.
      - q: Was unterscheidet ein Projekt von einem Chat?
        a:
          Ein Chat ist ein Gespräch mit einem KI-Assistenten. Ein Projekt
          organisiert laufende Arbeit mit Aufgabenboard, Agenten, Anweisungen,
          Dateien und Chats. Ein neuer Chat nutzt die Projektanweisungen,
          übernimmt aber nicht automatisch frühere Gespräche.
  docs:
    - label: Projekt-Überblick
      path: /platform/projects/overview
    - label: Projekt-Konzepte
      path: /platform/projects/concepts
    - label: Aufgaben-Automatisierung
      path: /platform/projects/task-automation
    - label: Projekt-Backlog
      path: /platform/projects/backlog
    - label: Dateien verwalten
      path: /platform/projects/manage-files
    - label: Projekt-Agenten
      path: /platform/projects/project-agents
  tour:
    heading: Wie Projekte Arbeit erledigen
    description:
      Plane die Arbeit mit deinem Team, delegiere Aufgaben an Agenten und
      prüfe ihre Berichte. Projektanweisungen und Referenzdateien unterstützen
      die Arbeit.
    stages:
      - id: tasks
        eyebrow: Aufgaben
        title: |-
          Aufgabe zuweisen,
          dann Agenten starten
        description:
          Formuliere einen klaren Auftrag und weise einen Projektagenten zu.
          Starte die Arbeit, verfolge den Fortschritt und prüfe den Bericht
          und die Dateien, die der Agent zur Prüfung zurückgibt.
      - id: chat
        eyebrow: Chats
        title: |-
          Gib Projektchats
          eine gemeinsame Grundlage
        description:
          Projektanweisungen gelten für die zugehörigen Chats. Der Assistent
          kann relevante Projektdateien abrufen. Ergänze frühere
          Entscheidungen, die ein neues Gespräch braucht.
      - id: knowledge
        eyebrow: Wissen
        title: |-
          Dateien, die im
          Projekt bleiben
        description:
          Halte Referenzdateien im Wissen-Tab des Projekts bereit und prüfe
          ihren Indexierungsstatus. Projektchats können indexierte Inhalte und
          zugängliches Organisationswissen abrufen.
      - id: govern
        eyebrow: Review
        title: |-
          Geschützte Workflow-Aktionen
          prüfen und freigeben
        description: Nutze Connector-Schritte in Automatisierungen für kontrollierte
          Schreibaktionen. Wenn ein Schritt eine Freigabe braucht, entscheidet
          eine prüfende Person, bevor der Workflow die Aktion versucht. Die
          Entscheidung wird protokolliert.
  demos:
    projects:
      label:
        'Animierte Demo: die Projektliste — jeder geteilte Arbeitsbereich mit
        seinen Agents und Mitgliedern.'
      project1: Website-Relaunch
