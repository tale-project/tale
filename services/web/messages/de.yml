seo:
  ogImageAlt: Tale-Logo
  home:
    title: "Tale: Projektarbeit mit deinem Team und KI-Agenten"
    description: Plane Projekte, delegiere Aufgaben an KI-Agenten und prüfe Ergebnisse im
      Team. Ein Open-Source-Arbeitsbereich mit Agenten-Sandboxes, Kontext und
      Workflows.
  pricing:
    title: Was kostet Tale? — Community & Enterprise
    description: 'Tale Enterprise: CHF 12 (EUR 14) pro User/Monat, zwei Monate
      gratis bei Jahresabrechnung. Community ist unter MIT kostenlos selbst
      gehostet.'
  contact:
    title: Kontakt zum Tale-Team — Vertrieb, Support, Demos
    description: "Sprich mit dem Tale-Team über die Zusammenarbeit mit KI-Agenten:
      Projektabläufe, Bereitstellung, Preise oder eine geführte Demo."
  about:
    title: Wer steht hinter Tale? — Über die Ruler GmbH
    description: "Ruler GmbH aus Spiez baut Tale: einen MIT-lizenzierten
      Projektarbeitsbereich, in dem Teams KI-Agenten koordinieren und ihre
      Arbeit prüfen."
  requestDemo:
    title: Tale-Demo anfragen — geführter Rundgang
    description:
      Bring eine Aufgabe aus deinem Team mit. Sieh, wie Tale Teammitglieder
      und KI-Agenten über Projektboards, Sandbox-Arbeit und Reviews
      zusammenbringt.
  hardwarePricing:
    title: Was kostet Tale-AI-Hardware? — mieten, leasen, kaufen
    description: Geräuscharme Inference-Hardware von einzelnen Nodes bis Racks —
      mieten, leasen oder kaufen. Vor Ort mit Remote-Wartung oder in sicheren
      Rechenzentren.
  platform:
    title: KI-Agenten und Projekte koordinieren | Tale
    description:
      Menschen, KI-Agenten, Aufgaben und Projektdateien in einem
      Arbeitsbereich. Tale verbindet Aufgabenboards, Agenten-Sandboxes, Wissen
      und wiederholbare Abläufe.
  platformAgents:
    title: KI-Agenten für Projektaufgaben | Tale
    description:
      Gib Projektagenten Anweisungen, Werkzeuge und eine Laufzeit wie Claude
      Code oder Codex. Weise Aufgaben zu, öffne Sandbox-Dateien und prüfe die
      Ergebnisse.
  platformChat:
    title: KI-Chat mit Quellen und Projektaufgaben | Tale
    description:
      Stelle Fragen, prüfe Quellen, vergleiche zwei Modelle in Arena und mache
      aus einem Gespräch eine Projektaufgabe für einen KI-Agenten in Tale.
  platformAutomations:
    title: Wiederholbare Workflows mit KI-Agenten | Tale
    description:
      Mache wiederkehrende Aufgaben zu Workflows mit Agentenschritten,
      Bedingungen, Konnektoren und Freigaben. Starte sie manuell, per Zeitplan
      oder Webhook.
  platformKnowledge:
    title: Gemeinsames Wissen für die Arbeit mit KI | Tale
    description: Gib der Arbeit mit KI den nötigen Kontext. Indexiere Dokumente, Websites
      und Wissenseinträge, finde zugängliche Quellen und prüfe die Belege im
      Arbeitsbereich.
  platformGovernance:
    title: KI-Governance, Genehmigungen und Nutzungslimits | Tale
    description: Konfiguriere Connector-Genehmigungen, prüfe protokollierte Aktionen und
      lege Modellbudgets und Chat-Schutzregeln für dein Team in Tale fest.
  platformProjects:
    title: Aufgabenboards für Teams und KI-Agenten | Tale
    description: Plane die Arbeit mit Teammitgliedern und KI-Agenten auf einem
      gemeinsamen Projektboard. Aufgaben, Dateien, Gespräche und Reviews
      bleiben zusammen.
  changelog:
    title: Was ist neu in Tale? — Changelog
    description: Release Notes zu jeder Tale-Version, neueste zuerst — Features,
      Fixes und Breaking Changes jeder Version, veröffentlicht aus GitHub
      Releases.
