<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f4" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tale-theme');
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          var resolved =
            stored === 'dark' || (stored !== 'light' && prefersDark)
              ? 'dark'
              : 'light';
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = resolved;
        } catch (_) {}
      })();
    </script>
    <!--
      Self-hosted analytics, proxied first-party at /_a (deployment lives in
      tale-project/ops, services/analytics). Two things to preserve: keep the
      src same-origin, because the CSP this server sends allows same-origin
      scripts only; and keep this tag OUTSIDE the seo markers below, which the
      prerenderer rewrites per route. The id comes from services/analytics/seed.py.
    -->
    <script
      defer
      src="/_a/script.js"
      data-website-id="86021df0-293b-4436-8dd3-aa83bdf4b86e"
      data-domains="tale.dev"
    ></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- seo:start -->
    <!--
      Per-route SEO tags. In production the prerenderer (scripts/prerender.ts)
      replaces everything between seo:start/seo:end with the exact `<head>`
      the route's `useDocumentMeta` renders. These defaults are what dev and
      the SPA-shell fallback (un-prerendered routes) show before JS boots.
    -->
    <title>Tale: The Orchestrator for AI Agents</title>
    <meta
      name="description"
      content="Tale connects the AI agents and CLIs your team already uses, pools their knowledge, and delegates work across them — self-hosted, ISO 27001 & SOC 2 certified."
    />
    <link rel="canonical" href="https://tale.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tale" />
    <meta property="og:url" content="https://tale.dev/" />
    <meta property="og:title" content="Tale: The Orchestrator for AI Agents" />
    <meta
      property="og:description"
      content="Tale connects the AI agents and CLIs your team already uses, pools their knowledge, and delegates work across them — self-hosted, ISO 27001 & SOC 2 certified."
    />
    <meta property="og:image" content="https://tale.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Tale — The Orchestrator for AI Agents"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tale: The Orchestrator for AI Agents" />
    <meta
      name="twitter:description"
      content="Tale connects the AI agents and CLIs your team already uses, pools their knowledge, and delegates work across them — self-hosted, ISO 27001 & SOC 2 certified."
    />
    <meta name="twitter:image" content="https://tale.dev/og.png" />
    <meta
      name="twitter:image:alt"
      content="Tale — The Orchestrator for AI Agents"
    />
    <!-- seo:end -->

    <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
    <link
      rel="alternate"
      type="text/plain"
      href="/llms-full.txt"
      title="llms-full.txt"
    />
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
