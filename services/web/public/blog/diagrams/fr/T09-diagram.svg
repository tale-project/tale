<svg xmlns="http://www.w3.org/2000/svg" lang="fr" viewBox="0 0 1040 850" role="img" aria-labelledby="title desc"><title id="title">Choisir la configuration complète de l’agent</title><desc id="desc">Le modèle est un choix parmi plusieurs couches de configuration interdépendantes.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="850" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  GUIDE PRATIQUE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Choisir la configuration complète de l’agent</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Le modèle est un choix parmi plusieurs couches de configuration interdépendantes.</text><rect x="48" y="214" width="300" height="180" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="70" y="256" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Runtime</text><text x="70" y="294" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Exécute la boucle de l’agent</text><text x="70" y="320" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">et gère son exécution</text><rect x="370" y="214" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="392" y="256" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Modèle</text><text x="392" y="294" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Génère les décisions</text><text x="392" y="320" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">et les réponses</text><rect x="692" y="214" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="714" y="256" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Fournisseur IA</text><text x="714" y="294" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Fournit l’accès au modèle</text><text x="714" y="320" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">via une authentification</text><rect x="48" y="444" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="486" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Skills</text><text x="70" y="524" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400"><tspan x="70" dy="0">Fournissent des méthodes</tspan><tspan x="70" dy="26">réutilisables</tspan></text><text x="70" y="576" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">et des ressources associées</text><rect x="370" y="444" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="392" y="486" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Outils</text><text x="392" y="524" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400"><tspan x="392" dy="0">Donnent accès aux données</tspan><tspan x="392" dy="26">et aux actions</tspan></text><text x="392" y="576" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">selon les droits configurés</text><rect x="692" y="444" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="714" y="486" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Espace de travail</text><text x="714" y="524" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Contient les fichiers de travail</text><text x="714" y="550" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">et les résultats rassemblés</text><path d="M48 756 H992" stroke="#d2d6da" /><text x="48" y="792" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Teste cette combinaison sur une tâche représentative avant d’élargir les accès.</text><text x="48" y="823" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schéma explicatif · ni capture du produit ni résultat mesuré</text></svg>
