<svg lang="fr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 890" role="img" aria-labelledby="title desc"><title id="title">Tracer tout le périmètre du déploiement</title><desc id="desc">Héberger l’espace de travail en local ne détermine pas toutes les destinations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="890" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  GUIDE PRATIQUE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Tracer tout le périmètre du déploiement</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Héberger l’espace de travail en local ne détermine pas toutes les destinations.</text><rect x="48" y="214" width="540" height="474" rx="14" fill="white" stroke="#24272b" stroke-width="1.5" stroke-dasharray="7 6"/><text x="73" y="254" font-family="Inter,Arial,sans-serif" font-size="18" fill="#24272b" font-weight="600">L’INFRASTRUCTURE QUE TU CHOISIS</text><rect x="76" y="290" width="480" height="112" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="98" y="327" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Espace de travail + livrables stockés</text><text x="98" y="362" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Application, connaissances, fichiers, sauvegardes</text><rect x="76" y="455" width="480" height="112" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="98" y="492" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Exécution de l’agent</text><text x="98" y="527" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Identifiants, tools et accès au modèle configurés</text><rect x="696" y="220" width="296" height="126" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="718" y="257" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Services de modèles</text><text x="718" y="292" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Génération et embeddings</text><path d="M588 283 L684 283" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="696" y="373" width="296" height="126" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="718" y="410" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Tools connectés</text><text x="718" y="445" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400"><tspan x="718" dy="0">Navigateur, API,</tspan><tspan x="718" dy="23">services externes</tspan></text><path d="M588 436 L684 436" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="696" y="526" width="296" height="126" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="718" y="563" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Services d’exploitation</text><text x="718" y="598" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400"><tspan x="718" dy="0">Supervision et</tspan><tspan x="718" dy="23">sauvegardes distantes</tspan></text><path d="M588 589 L684 589" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><text x="75" y="644" font-family="Inter,Arial,sans-serif" font-size="19" fill="#24272b" font-weight="400">Emplacement et accès dépendent de la configuration.</text><path d="M48 796 H992" stroke="#d2d6da"/><text x="48" y="832" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Pour chaque flèche : précise les données, la destination, l’opérateur et la conservation.</text><text x="48" y="863" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schéma explicatif · ni capture du produit ni résultat mesuré</text></svg>
