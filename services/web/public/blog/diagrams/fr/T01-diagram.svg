<svg xmlns="http://www.w3.org/2000/svg" lang="fr" viewBox="0 0 1040 940" role="img" aria-labelledby="title desc"><title id="title">Coordonner le travail autour des livrables</title><desc id="desc">Rassemble les constats avant de soumettre le résultat à la revue.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="940" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  GUIDE PRATIQUE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Coordonner le travail autour des livrables</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Rassemble les constats avant de soumettre le résultat à la revue.</text><rect x="360" y="195" width="320" height="132" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="382" y="237" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Brief commun</text><text x="382" y="275" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Objectif + règles des sources</text><text x="382" y="301" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Critères d’acceptation</text><rect x="48" y="355" width="453" height="113" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="397" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Recherche</text><text x="70" y="435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Trouver les preuves et les lacunes</text><rect x="539" y="355" width="453" height="113" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="561" y="397" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Vérifier les sources</text><text x="561" y="435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Examiner les preuves et les dates</text><path d="M520 327 V337 H274 V347" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M520 337 H765 V347" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="250" y="520" width="540" height="113" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="272" y="562" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Rassembler les constats</text><text x="272" y="600" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Résoudre les conflits ou noter la question ouverte</text><path d="M274 468 V494 H430 V508" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M765 468 V494 H610 V508" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="250" y="681" width="540" height="132" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="272" y="723" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Résultat prêt pour la revue</text><text x="272" y="761" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Livrables identifiés + décisions en suspens</text><text x="272" y="787" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Une personne responsable de la revue</text><path d="M520 633 L520 669" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M48 846 H992" stroke="#d2d6da" /><text x="48" y="882" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Ajouter des intervenants n’aide que si la répartition justifie l’effort de coordination.</text><text x="48" y="913" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schéma explicatif · ni capture du produit ni résultat mesuré</text></svg>
