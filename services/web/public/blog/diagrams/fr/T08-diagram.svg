<svg lang="fr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 820" role="img" aria-labelledby="title desc"><title id="title">Évaluer le travail accepté</title><desc id="desc">Garde visibles la qualité, l’effort de revue, les coûts et la durée totale.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="820" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  GUIDE PRATIQUE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Évaluer le travail accepté</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Garde visibles la qualité, l’effort de revue, les coûts et la durée totale.</text><rect x="48" y="215" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="252" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Achèvement</text><text x="70" y="287" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Le livrable est-il correct ?</text><text x="70" y="314" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Uniquement des effets permis ?</text><rect x="539" y="215" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="561" y="252" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Effort de revue</text><text x="561" y="287" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Minutes de travail humain</text><text x="561" y="314" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Corrections et nouvelles tentatives</text><rect x="48" y="411" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="448" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Coûts pris en compte</text><text x="70" y="483" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Frais des fournisseurs et des tools</text><text x="70" y="510" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Hypothèses de répartition explicites</text><rect x="539" y="411" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="561" y="448" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Délai jusqu’à l’acceptation</text><text x="561" y="483" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Attente + exécution + revue</text><text x="561" y="510" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Mesurer l’effort actif séparément</text><text x="48" y="650" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="500">Mêmes données figées  →  essais répétés  →  même grille d’acceptation</text><path d="M48 726 H992" stroke="#d2d6da"/><text x="48" y="762" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Inclus les échecs dans l’analyse. Un coût inconnu n’est pas un coût nul.</text><text x="48" y="793" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schéma explicatif · ni capture du produit ni résultat mesuré</text></svg>
