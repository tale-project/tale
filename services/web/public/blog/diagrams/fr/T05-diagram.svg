<svg lang="fr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 810" role="img" aria-labelledby="title desc"><title id="title">Vérifier l’accès, l’actualité et les preuves</title><desc id="desc">Même citée, une source peut être déformée dans la réponse.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="810" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  GUIDE PRATIQUE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Vérifier l’accès, l’actualité et les preuves</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Même citée, une source peut être déformée dans la réponse.</text><rect x="48" y="235" width="218" height="160" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600"><tspan x="70" dy="0">Contexte</tspan><tspan x="70" dy="28">d’accès</tspan></text><text x="70" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Qui demande ?</text><text x="70" y="349" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Pour quel projet ?</text><path d="M266 315 L279 315" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="290" y="235" width="218" height="160" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="312" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600"><tspan x="312" dy="0">Sources</tspan><tspan x="312" dy="28">permises</tspan></text><text x="312" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Appliquer les règles</text><text x="312" y="349" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">d’accès actuelles</text><path d="M508 315 L521 315" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="532" y="235" width="218" height="160" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="554" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Passages</text><text x="554" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Retrouver et vérifier</text><text x="554" y="349" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400"><tspan x="554" dy="0">les versions</tspan><tspan x="554" dy="23">des sources</tspan></text><path d="M750 315 L763 315" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="774" y="235" width="218" height="160" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="796" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600"><tspan x="796" dy="0">Texte +</tspan><tspan x="796" dy="28">citations</tspan></text><text x="796" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Chaque passage</text><text x="796" y="349" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">étaye-t-il le propos ?</text><rect x="48" y="464" width="453" height="166" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="501" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Actualité des documents</text><text x="70" y="536" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Quand le contenu a-t-il changé ?</text><text x="70" y="563" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Quand la copie indexée a-t-elle été actualisée ?</text><rect x="539" y="464" width="453" height="166" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="561" y="501" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Actualité des droits</text><text x="561" y="536" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Quand l’accès à la source a-t-il changé ?</text><text x="561" y="563" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Quand l’accès effectif a-t-il été actualisé ?</text><path d="M48 716 H992" stroke="#d2d6da"/><text x="48" y="752" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Teste séparément les sources absentes, obsolètes, contradictoires et sans droit d’accès.</text><text x="48" y="783" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schéma explicatif · ni capture du produit ni résultat mesuré</text></svg>
