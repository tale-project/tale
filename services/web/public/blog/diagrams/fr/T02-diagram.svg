<svg lang="fr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" role="img" aria-labelledby="title desc"><title id="title">Trois décisions de revue distinctes</title><desc id="desc">Question, revue du résultat et approbation d’action ont des effets différents.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="740" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  GUIDE PRATIQUE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Trois décisions de revue distinctes</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Question, revue du résultat et approbation d’action ont des effets différents.</text><rect x="48" y="223" width="300" height="171" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Question</text><text x="70" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Information manquante</text><text x="70" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">ou choix encore ouvert</text><path d="M198 395 L198 444" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="48" y="461" width="300" height="72" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="64" y="505" font-family="Inter,Arial,sans-serif" font-size="18" fill="white" font-weight="500">Poursuivre avec la réponse</text><rect x="370" y="223" width="300" height="171" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="392" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Revue du résultat</text><text x="392" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Un livrable à examiner</text><text x="392" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">selon les critères d’acceptation</text><path d="M520 395 L520 444" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="370" y="461" width="300" height="72" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="386" y="505" font-family="Inter,Arial,sans-serif" font-size="18" fill="white" font-weight="500">Accepter ou faire modifier</text><rect x="692" y="223" width="300" height="171" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="714" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Approbation d’action</text><text x="714" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Une opération précise</text><text x="714" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">et son effet prévu</text><path d="M842 395 L842 444" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="692" y="461" width="300" height="72" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="708" y="505" font-family="Inter,Arial,sans-serif" font-size="18" fill="white" font-weight="500">Autoriser ou refuser l’action</text><path d="M48 646 H992" stroke="#d2d6da"/><text x="48" y="682" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Une action autorisée peut échouer. Vérifie son résultat séparément.</text><text x="48" y="713" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schéma explicatif · ni capture du produit ni résultat mesuré</text></svg>
