<svg lang="fr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 890" role="img" aria-labelledby="title desc"><title id="title">Vérifier les droits à chaque frontière</title><desc id="desc">Les consignes expriment l’intention ; les contrôles appliqués déterminent l’accès.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="890" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  GUIDE PRATIQUE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Vérifier les droits à chaque frontière</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Les consignes expriment l’intention ; les contrôles appliqués déterminent l’accès.</text><rect x="48" y="207" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><rect x="48" y="207" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="69" y="254" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Identité</text><text x="270" y="254" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Qui lance le travail et qui l’exécute ?</text><rect x="48" y="301" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><rect x="48" y="301" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="69" y="348" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Données</text><text x="270" y="348" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Quelles ressources cette identité peut-elle lire ?</text><rect x="48" y="395" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><rect x="48" y="395" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="69" y="442" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Tools</text><text x="270" y="442" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Quels identifiants et opérations sont disponibles ?</text><rect x="48" y="489" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><rect x="48" y="489" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="69" y="536" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Effets</text><text x="270" y="536" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Quelles écritures exigent une approbation précise ?</text><rect x="48" y="583" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><rect x="48" y="583" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="69" y="630" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Preuves</text><text x="270" y="630" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Qu’est-ce qui a été tenté, autorisé et accompli ?</text><rect x="48" y="710" width="944" height="72" rx="14" fill="#e9edf2" stroke="#c5ccd5" stroke-width="1.5"/><text x="70" y="754" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="500">Teste aussi les refus et les accès révoqués, pas seulement les réussites.</text><path d="M48 796 H992" stroke="#d2d6da"/><text x="48" y="832" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Les approbations et la traçabilité peuvent varier selon le chemin d’exécution.</text><text x="48" y="863" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schéma explicatif · ni capture du produit ni résultat mesuré</text></svg>
