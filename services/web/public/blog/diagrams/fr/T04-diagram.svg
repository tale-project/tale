<svg xmlns="http://www.w3.org/2000/svg" lang="fr" viewBox="0 0 1040 900" role="img" aria-labelledby="title desc"><title id="title">Cinq formes de continuité</title><desc id="desc">Les fichiers conservés ne deviennent pas automatiquement le contexte d’un autre agent.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="900" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  GUIDE PRATIQUE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Cinq formes de continuité</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Les fichiers conservés ne deviennent pas automatiquement le contexte d’un autre agent.</text><rect x="48" y="198" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="242" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Références du projet</text><text x="383" y="242" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Consignes communes et sources</text><rect x="48" y="291" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="335" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Dossier de la tâche</text><text x="383" y="335" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Décisions, statut, critères d’acceptation</text><rect x="48" y="384" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="428" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Fichiers de travail</text><text x="383" y="428" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Données intermédiaires et livrables</text><rect x="48" y="477" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="521" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Conversation du runtime</text><text x="383" y="521" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Reprise selon les capacités du runtime</text><rect x="48" y="570" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="614" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Contexte actif du modèle</text><text x="383" y="614" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Informations sélectionnées et disponibles</text><rect x="48" y="698" width="355" height="106" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="740" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Intervenant A</text><text x="70" y="778" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Conserver un résultat durable</text><rect x="637" y="698" width="355" height="106" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="659" y="740" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Intervenant B</text><text x="659" y="778" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Lire et vérifier la transmission</text><path d="M416 749 L623 749" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><text x="422" y="720" font-family="Inter,Arial,sans-serif" font-size="18" fill="#24272b" font-weight="400">Livrable explicite</text><path d="M48 806 H992" stroke="#d2d6da" /><text x="48" y="842" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Note les emplacements, les versions des sources, les décisions ouvertes et la prochaine action.</text><text x="48" y="873" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schéma explicatif · ni capture du produit ni résultat mesuré</text></svg>
