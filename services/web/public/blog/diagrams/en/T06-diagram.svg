<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 1040 890" role="img" aria-labelledby="title desc"><title id="title">Draw the full deployment boundary</title><desc id="desc">Hosting the workspace locally does not determine every destination.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="890" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  FIELD GUIDE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Draw the full deployment boundary</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Hosting the workspace locally does not determine every destination.</text><rect x="48" y="214" width="540" height="474" rx="14" fill="white" stroke="#24272b" stroke-width="1.5" stroke-dasharray="7 6" /><text x="73" y="254" font-family="Inter,Arial,sans-serif" font-size="18" fill="#24272b" font-weight="600">YOUR CHOSEN INFRASTRUCTURE</text><rect x="76" y="290" width="480" height="112" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="98" y="332" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Workspace + stored artifacts</text><text x="98" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Application, knowledge, files, backups</text><rect x="76" y="455" width="480" height="112" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="98" y="497" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Agent execution</text><text x="98" y="535" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Configured credentials, tools, and model path</text><rect x="696" y="220" width="296" height="126" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="718" y="262" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Model services</text><text x="718" y="300" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Generation and embeddings</text><path d="M588 283 L684 283" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="696" y="373" width="296" height="132" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="718" y="415" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Connected tools</text><text x="718" y="453" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400"><tspan x="718" dy="0">Browser, APIs,</tspan><tspan x="718" dy="26">external services</tspan></text><path d="M588 436 L684 436" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="696" y="526" width="296" height="126" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="718" y="568" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Operational systems</text><text x="718" y="606" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Monitoring and remote backups</text><path d="M588 589 L684 589" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><text x="75" y="644" font-family="Inter,Arial,sans-serif" font-size="19" fill="#24272b" font-weight="400">Placement and access depend on configuration.</text><path d="M48 796 H992" stroke="#d2d6da" /><text x="48" y="832" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">For every arrow: identify payload, destination, operator, and retention.</text><text x="48" y="863" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Conceptual explanation · not a product screenshot or measured result</text></svg>
