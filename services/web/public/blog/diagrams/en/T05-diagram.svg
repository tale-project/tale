<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 1040 810" role="img" aria-labelledby="title desc"><title id="title">Check access, freshness, and support</title><desc id="desc">An answer with a citation can still misrepresent its source.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="810" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  FIELD GUIDE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Check access, freshness, and support</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">An answer with a citation can still misrepresent its source.</text><rect x="48" y="235" width="218" height="160" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="277" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600"><tspan x="70" dy="0">Check</tspan><tspan x="70" dy="26">access</tspan></text><text x="70" y="341" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Who is asking?</text><text x="70" y="367" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Which project?</text><path d="M272 315 L284 315" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="290" y="235" width="218" height="160" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="312" y="277" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600"><tspan x="312" dy="0">Select</tspan><tspan x="312" dy="26">sources</tspan></text><text x="312" y="341" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Apply current</text><text x="312" y="367" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">permission rules</text><path d="M514 315 L526 315" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="532" y="235" width="218" height="160" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="554" y="277" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600"><tspan x="554" dy="0">Retrieve</tspan><tspan x="554" dy="26">passages</tspan></text><text x="554" y="341" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Retrieve and check</text><text x="554" y="367" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">source versions</text><path d="M756 315 L768 315" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="774" y="235" width="218" height="160" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="796" y="277" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600"><tspan x="796" dy="0">Check the</tspan><tspan x="796" dy="26">answer</tspan></text><text x="796" y="341" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Does each passage</text><text x="796" y="367" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">support the claim?</text><rect x="48" y="464" width="453" height="166" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="506" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Document freshness</text><text x="70" y="544" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">When did the content change?</text><text x="70" y="570" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">When did the searchable copy update?</text><rect x="539" y="464" width="453" height="166" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="561" y="506" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Permission freshness</text><text x="561" y="544" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">When did source access change?</text><text x="561" y="570" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">When did effective access update?</text><path d="M48 716 H992" stroke="#d2d6da" /><text x="48" y="752" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Test unavailable, stale, conflicting, and inaccessible sources as separate cases.</text><text x="48" y="783" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Conceptual explanation · not a product screenshot or measured result</text></svg>
