<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 1040 850" role="img" aria-labelledby="title desc"><title id="title">Choose the complete agent setup</title><desc id="desc">A model is one choice among several interacting configuration layers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="850" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  FIELD GUIDE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Choose the complete agent setup</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">A model is one choice among several interacting configuration layers.</text><rect x="48" y="214" width="300" height="180" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="70" y="256" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Runtime</text><text x="70" y="294" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Runs the agent loop</text><text x="70" y="320" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">and manages execution</text><rect x="370" y="214" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="392" y="256" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Model</text><text x="392" y="294" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Generates decisions</text><text x="392" y="320" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">and responses</text><rect x="692" y="214" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="714" y="256" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Provider</text><text x="714" y="294" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Serves the model</text><text x="714" y="320" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">with a credential path</text><rect x="48" y="444" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="486" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Skills</text><text x="70" y="524" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Supply reusable methods</text><text x="70" y="550" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">and supporting resources</text><rect x="370" y="444" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="392" y="486" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Tools</text><text x="392" y="524" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Expose data and actions</text><text x="392" y="550" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">within configured access</text><rect x="692" y="444" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="714" y="486" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Workspace</text><text x="714" y="524" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Holds working files</text><text x="714" y="550" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">and collected outputs</text><path d="M48 756 H992" stroke="#d2d6da" /><text x="48" y="792" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Verify the combination on one representative task before expanding access.</text><text x="48" y="823" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Conceptual explanation · not a product screenshot or measured result</text></svg>
