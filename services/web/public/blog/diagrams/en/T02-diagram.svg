<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 1040 740" role="img" aria-labelledby="title desc"><title id="title">Three different review decisions</title><desc id="desc">A question, a result review, and an action approval have different effects.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="740" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  FIELD GUIDE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Three different review decisions</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">A question, a result review, and an action approval have different effects.</text><rect x="48" y="223" width="300" height="171" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="265" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Question</text><text x="70" y="303" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Missing information</text><text x="70" y="329" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">or an unresolved choice</text><path d="M198 395 L198 444" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="48" y="461" width="300" height="72" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="64" y="505" font-family="Inter,Arial,sans-serif" font-size="18" fill="white" font-weight="500">Continue with an answer</text><rect x="370" y="223" width="300" height="171" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="392" y="265" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Result review</text><text x="392" y="303" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">A delivered output</text><text x="392" y="329" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">against acceptance criteria</text><path d="M520 395 L520 444" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="370" y="461" width="300" height="72" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="386" y="505" font-family="Inter,Arial,sans-serif" font-size="18" fill="white" font-weight="500">Accept or request changes</text><rect x="692" y="223" width="300" height="171" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="714" y="265" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Action approval</text><text x="714" y="303" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">A specific operation</text><text x="714" y="329" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">and its intended effect</text><path d="M842 395 L842 444" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="692" y="461" width="300" height="72" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="708" y="505" font-family="Inter,Arial,sans-serif" font-size="18" fill="white" font-weight="500">Permit or deny this action</text><path d="M48 646 H992" stroke="#d2d6da" /><text x="48" y="682" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">A permitted action can still fail. Verify the result separately.</text><text x="48" y="713" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Conceptual explanation · not a product screenshot or measured result</text></svg>
