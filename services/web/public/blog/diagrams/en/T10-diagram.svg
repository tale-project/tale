<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc"><title id="title">Turn research into a reviewed brief</title><desc id="desc">Keep evidence, hypotheses, options, and decisions distinguishable.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="800" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  FIELD GUIDE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Turn research into a reviewed brief</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Keep evidence, hypotheses, options, and decisions distinguishable.</text><rect x="48" y="225" width="300" height="144" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="267" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Brief</text><text x="70" y="305" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Audience + decision</text><text x="70" y="331" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Constraints + sources</text><path d="M354 297 L364 297" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="370" y="225" width="300" height="144" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="392" y="267" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Research</text><text x="392" y="305" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Find evidence</text><text x="392" y="331" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Record gaps</text><path d="M676 297 L686 297" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="692" y="225" width="300" height="144" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="714" y="267" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Options</text><text x="714" y="305" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Compare messages</text><text x="714" y="331" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">and tradeoffs</text><rect x="48" y="473" width="453" height="162" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="70" y="515" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Marketing review</text><text x="70" y="553" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Check support and differentiation</text><text x="70" y="579" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Choose direction or request revision</text><rect x="539" y="473" width="453" height="162" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="561" y="515" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Accepted campaign brief</text><text x="561" y="553" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Deliver the evidence and decision</text><text x="561" y="579" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Publication is a separate next step</text><path d="M842 369 V420 H274 V461" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M501 554 L527 554" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M48 706 H992" stroke="#d2d6da" /><text x="48" y="742" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">A polished draft is not evidence of demand, conversion, or campaign impact.</text><text x="48" y="773" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Conceptual explanation · not a product screenshot or measured result</text></svg>
