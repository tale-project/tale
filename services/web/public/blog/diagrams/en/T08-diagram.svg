<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 1040 820" role="img" aria-labelledby="title desc"><title id="title">Evaluate accepted work</title><desc id="desc">Keep quality, review effort, cost, and elapsed time visible.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="820" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  FIELD GUIDE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Evaluate accepted work</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Keep quality, review effort, cost, and elapsed time visible.</text><rect x="48" y="215" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="257" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Completion</text><text x="70" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Correct deliverable?</text><text x="70" y="321" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Permitted side effects only?</text><rect x="539" y="215" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="561" y="257" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Review burden</text><text x="561" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Human minutes</text><text x="561" y="321" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Corrections and repeated attempts</text><rect x="48" y="411" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="453" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Cost coverage</text><text x="70" y="491" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Provider and tool charges</text><text x="70" y="517" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Disclosed allocation assumptions</text><rect x="539" y="411" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="561" y="453" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Time to acceptance</text><text x="561" y="491" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Queue + execution + review</text><text x="561" y="517" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Track active effort separately</text><text x="48" y="650" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="500">Same input snapshot  →  repeated trials  →  the same acceptance rubric</text><path d="M48 726 H992" stroke="#d2d6da" /><text x="48" y="762" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Keep failed trials in the analysis. Missing cost data is not zero cost.</text><text x="48" y="793" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Conceptual explanation · not a product screenshot or measured result</text></svg>
