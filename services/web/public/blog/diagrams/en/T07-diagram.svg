<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 1040 890" role="img" aria-labelledby="title desc"><title id="title">Inspect authority at each boundary</title><desc id="desc">Instructions describe intent; enforced controls determine access.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="890" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  FIELD GUIDE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Inspect authority at each boundary</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Instructions describe intent; enforced controls determine access.</text><rect x="48" y="207" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><rect x="48" y="207" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="69" y="253" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Identity</text><text x="270" y="254" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Who starts and executes the work?</text><rect x="48" y="301" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><rect x="48" y="301" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="69" y="347" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Data</text><text x="270" y="348" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Which resources may this identity read?</text><rect x="48" y="395" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><rect x="48" y="395" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="69" y="441" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Tools</text><text x="270" y="442" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Which credential and operation are available?</text><rect x="48" y="489" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><rect x="48" y="489" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="69" y="535" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Effects</text><text x="270" y="536" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Which writes need a specific approval?</text><rect x="48" y="583" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><rect x="48" y="583" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="69" y="629" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Evidence</text><text x="270" y="630" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">What was attempted, allowed, and completed?</text><rect x="48" y="710" width="944" height="72" rx="14" fill="#e9edf2" stroke="#c5ccd5" stroke-width="1.5" /><text x="70" y="754" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="500">Test denials and revoked access as well as the successful path.</text><path d="M48 796 H992" stroke="#d2d6da" /><text x="48" y="832" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Different execution paths can have different approval and audit coverage.</text><text x="48" y="863" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Conceptual explanation · not a 