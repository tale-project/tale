<svg lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 900" role="img" aria-labelledby="title desc"><title id="title">Five kinds of continuity</title><desc id="desc">Preserved files do not automatically become another agent’s context.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="900" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  FIELD GUIDE</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Five kinds of continuity</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Preserved files do not automatically become another agent’s context.</text><rect x="48" y="198" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="242" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Project references</text><text x="383" y="242" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Shared instructions and source material</text><rect x="48" y="291" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="335" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Task record</text><text x="383" y="335" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Decisions, status, acceptance criteria</text><rect x="48" y="384" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="428" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Working files</text><text x="383" y="428" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Intermediate data and delivered artifacts</text><rect x="48" y="477" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="521" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Runtime conversation</text><text x="383" y="521" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Continuation depends on runtime support</text><rect x="48" y="570" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="614" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Active model context</text><text x="383" y="614" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Selected information available right now</text><rect x="48" y="698" width="355" height="103" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="735" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Worker A</text><text x="70" y="770" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Keep durable output</text><rect x="637" y="698" width="355" height="103" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="659" y="735" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Worker B</text><text x="659" y="770" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Read and verify the handoff</text><path d="M416 749 L623 749" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><text x="422" y="720" font-family="Inter,Arial,sans-serif" font-size="18" fill="#24272b" font-weight="400">Explicit artifact</text><path d="M48 806 H992" stroke="#d2d6da"/><text x="48" y="842" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Record locations, source versions, unresolved decisions, and the next action.</text><text x="48" y="873" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Conceptual explanation · not a product screenshot or measured result</text></svg>
