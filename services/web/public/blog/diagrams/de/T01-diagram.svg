<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 940" role="img" aria-labelledby="title desc"><title id="title">Arbeit auf Ergebnisse ausrichten</title><desc id="desc">Führe die Erkenntnisse zusammen, bevor das Ergebnis geprüft wird.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="940" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  PRAXISLEITFADEN</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Arbeit auf Ergebnisse ausrichten</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Führe die Erkenntnisse zusammen, bevor das Ergebnis geprüft wird.</text><rect x="360" y="195" width="320" height="110" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="382" y="232" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Gemeinsames Briefing</text><text x="382" y="267" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Ziel + Quellenregeln</text><text x="382" y="294" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Abnahmekriterien</text><rect x="48" y="355" width="453" height="113" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="392" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Recherche</text><text x="70" y="427" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Belege und Lücken finden</text><rect x="539" y="355" width="453" height="113" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="561" y="392" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Quellen prüfen</text><text x="561" y="427" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Belege und Datumsangaben prüfen</text><path d="M520 305 V330 H274 V343" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M520 330 H765 V343" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="250" y="520" width="540" height="113" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="272" y="557" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Erkenntnisse zusammenführen</text><text x="272" y="592" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Widersprüche klären oder offene Frage festhalten</text><path d="M274 468 V494 H430 V508" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M765 468 V494 H610 V508" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="250" y="681" width="540" height="113" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="272" y="718" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Prüfbares Ergebnis</text><text x="272" y="753" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Benannte Dateien + offene Entscheidungen</text><text x="272" y="780" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Eine verantwortliche Prüfperson</text><path d="M520 633 L520 669" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M48 846 H992" stroke="#d2d6da"/><text x="48" y="882" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Mehr Beteiligte lohnen sich nur, wenn die Arbeitsteilung den Abstimmungsaufwand rechtfertigt.</text><text x="48" y="913" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schematische Erklärung · keine Produktansicht und kein gemessenes Ergebnis</text></svg>
