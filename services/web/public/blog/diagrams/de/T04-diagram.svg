<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 900" role="img" aria-labelledby="title desc"><title id="title">Fünf Formen der Kontinuität</title><desc id="desc">Gespeicherte Dateien werden nicht automatisch zum Kontext eines anderen Agenten.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="900" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  PRAXISLEITFADEN</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Fünf Formen der Kontinuität</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Gespeicherte Dateien werden nicht automatisch zum Kontext eines anderen Agenten.</text><rect x="48" y="198" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="242" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Projektreferenzen</text><text x="383" y="242" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Gemeinsame Anweisungen und Quellen</text><rect x="48" y="291" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="335" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Aufgabenprotokoll</text><text x="383" y="335" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Entscheidungen, Status, Abnahmekriterien</text><rect x="48" y="384" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="428" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Arbeitsdateien</text><text x="383" y="428" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Zwischendaten und gelieferte Dateien</text><rect x="48" y="477" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="521" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Laufzeitgespräch</text><text x="383" y="521" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Fortsetzung hängt von der Laufzeitumgebung ab</text><rect x="48" y="570" width="944" height="75" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="614" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Aktiver Modellkontext</text><text x="383" y="614" font-family="Inter,Arial,sans-serif" font-size="20" fill="#525860" font-weight="400">Ausgewählte, aktuell verfügbare Informationen</text><rect x="48" y="698" width="355" height="103" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="735" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Bearbeiter A</text><text x="70" y="770" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Ergebnis dauerhaft speichern</text><rect x="637" y="698" width="355" height="103" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="659" y="735" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Bearbeiter B</text><text x="659" y="770" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Übergabe lesen und prüfen</text><path d="M416 749 L623 749" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><text x="422" y="720" font-family="Inter,Arial,sans-serif" font-size="18" fill="#24272b" font-weight="400">Konkrete Datei</text><path d="M48 806 H992" stroke="#d2d6da"/><text x="48" y="842" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Halte Speicherorte, Quellenstände, offene Entscheidungen und die nächste Aktion fest.</text><text x="48" y="873" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schematische Erklärung · keine Produktansicht und kein gemessenes Ergebnis</text></svg>
