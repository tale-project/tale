<svg xmlns="http://www.w3.org/2000/svg" lang="de" viewBox="0 0 1040 850" role="img" aria-labelledby="title desc"><title id="title">Wer bestimmt den nächsten Schritt?</title><desc id="desc">Feste Abläufe und vom Modell erzeugte Ausgaben sind getrennte Fragen.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="850" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  PRAXISLEITFADEN</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Wer bestimmt den nächsten Schritt?</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Feste Abläufe und vom Modell erzeugte Ausgaben sind getrennte Fragen.</text><text x="48" y="245" font-family="Inter,Arial,sans-serif" font-size="25" fill="#24272b" font-weight="600">Workflow</text><text x="48" y="280" font-family="Inter,Arial,sans-serif" font-size="17" fill="#525860" font-weight="400">Schritte vorab festgelegt</text><text x="48" y="399" font-family="Inter,Arial,sans-serif" font-size="25" fill="#24272b" font-weight="600">Agent</text><text x="48" y="434" font-family="Inter,Arial,sans-serif" font-size="17" fill="#525860" font-weight="400">Nächste Aktion zur Laufzeit gewählt</text><text x="48" y="553" font-family="Inter,Arial,sans-serif" font-size="25" fill="#24272b" font-weight="600">Hybrid</text><text x="48" y="588" font-family="Inter,Arial,sans-serif" font-size="17" fill="#525860" font-weight="400">Begrenzter Agent im Prozess</text><rect x="376" y="203" width="180" height="105" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="398" y="264" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Eingabe</text><rect x="594" y="203" width="180" height="105" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="616" y="250" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600"><tspan x="616" dy="0">Feste</tspan><tspan x="616" dy="26">Schritte</tspan></text><rect x="812" y="203" width="180" height="105" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="834" y="264" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Ausgabe</text><path d="M556 255 L582 255" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M774 255 L800 255" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="376" y="357" width="180" height="105" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="398" y="418" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Beobachten</text><rect x="594" y="357" width="180" height="105" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="616" y="418" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Wählen</text><rect x="812" y="357" width="180" height="105" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="834" y="418" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Tool nutzen</text><path d="M556 409 L582 409" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M774 409 L800 409" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M902 462 V489 H466 V472" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="376" y="511" width="180" height="105" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="398" y="572" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Validieren</text><rect x="594" y="511" width="180" height="105" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="616" y="558" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600"><tspan x="616" dy="0">Auftrag an</tspan><tspan x="616" dy="26">den Agenten</tspan></text><rect x="812" y="511" width="180" height="105" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="834" y="572" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Prüfen</text><path d="M556 563 L582 563" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M774 563 L800 563" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M48 756 H992" stroke="#d2d6da" /><text x="48" y="792" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Wähle zuerst die einfachste Struktur, die die Abnahmekriterien erfüllt.</text><text x="48" y="823" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schematische Erklärung · keine Produktansicht und kein gemessenes Ergebnis</text></svg>
