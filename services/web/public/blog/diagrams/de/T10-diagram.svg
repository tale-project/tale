<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc"><title id="title">Von der Recherche zum geprüften Briefing</title><desc id="desc">Belege, Hypothesen, Optionen und Entscheidungen klar auseinanderhalten.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="800" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  PRAXISLEITFADEN</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Von der Recherche zum geprüften Briefing</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Belege, Hypothesen, Optionen und Entscheidungen klar auseinanderhalten.</text><rect x="48" y="225" width="300" height="144" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="262" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Briefing</text><text x="70" y="297" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Zielgruppe + Entscheidung</text><text x="70" y="324" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Vorgaben + Quellen</text><path d="M348 297 L358 297" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="370" y="225" width="300" height="144" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="392" y="262" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Recherche</text><text x="392" y="297" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Belege finden</text><text x="392" y="324" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Lücken festhalten</text><path d="M670 297 L680 297" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="692" y="225" width="300" height="144" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="714" y="262" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Optionen</text><text x="714" y="297" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Botschaften vergleichen</text><text x="714" y="324" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">und Zielkonflikte abwägen</text><rect x="48" y="473" width="453" height="162" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="70" y="510" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Marketingprüfung</text><text x="70" y="545" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Belege und Abgrenzung prüfen</text><text x="70" y="572" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Richtung wählen oder überarbeiten lassen</text><rect x="539" y="473" width="453" height="162" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="561" y="510" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Abgenommenes Kampagnenbriefing</text><text x="561" y="545" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Belege und Entscheidung übergeben</text><text x="561" y="572" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Veröffentlichung folgt als eigener Schritt</text><path d="M842 369 V420 H274 V461" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M501 554 L527 554" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M48 706 H992" stroke="#d2d6da"/><text x="48" y="742" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Ein guter Entwurf belegt weder Nachfrage noch Conversion oder Kampagnenwirkung.</text><text x="48" y="773" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schematische Erklärung · keine Produktansicht und kein gemessenes Ergebnis</text></svg>
