<svg xmlns="http://www.w3.org/2000/svg" lang="de" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc"><title id="title">Von der Recherche zum geprüften Briefing</title><desc id="desc">Belege, Hypothesen, Optionen und Entscheidungen klar auseinanderhalten.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="800" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  PRAXISLEITFADEN</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Von der Recherche zum geprüften Briefing</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Belege, Hypothesen, Optionen und Entscheidungen klar auseinanderhalten.</text><rect x="48" y="225" width="300" height="144" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="267" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Briefing</text><text x="70" y="305" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Zielgruppe + Entscheidung</text><text x="70" y="331" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Vorgaben + Quellen</text><path d="M354 297 L364 297" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="370" y="225" width="300" height="144" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="392" y="267" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Recherche</text><text x="392" y="305" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Belege finden</text><text x="392" y="331" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Lücken festhalten</text><path d="M676 297 L686 297" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="692" y="225" width="300" height="144" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="714" y="267" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Optionen</text><text x="714" y="305" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Botschaften vergleichen</text><text x="714" y="331" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">und Zielkonflikte abwägen</text><rect x="48" y="473" width="453" height="162" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="70" y="515" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Marketingprüfung</text><text x="70" y="553" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Belege und Abgrenzung prüfen</text><text x="70" y="579" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Richtung wählen oder überarbeiten lassen</text><rect x="539" y="473" width="453" height="162" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="561" y="515" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Abgenommenes Kampagnenbriefing</text><text x="561" y="553" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Belege und Entscheidung übergeben</text><text x="561" y="579" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Veröffentlichung folgt als eigener Schritt</text><path d="M842 369 V420 H274 V461" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M501 554 L527 554" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M48 706 H992" stroke="#d2d6da" /><text x="48" y="742" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Ein guter Entwurf belegt weder Nachfrage noch Conversion oder Kampagnenwirkung.</text><text x="48" y="773" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schematische Erklärung · keine Produktansicht und kein gemessenes Ergebnis</text></svg>
