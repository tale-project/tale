<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 890" role="img" aria-labelledby="title desc"><title id="title">Die gesamte Betriebsgrenze erfassen</title><desc id="desc">Ein lokal betriebener Arbeitsbereich legt nicht jedes Datenziel fest.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="890" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  PRAXISLEITFADEN</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Die gesamte Betriebsgrenze erfassen</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Ein lokal betriebener Arbeitsbereich legt nicht jedes Datenziel fest.</text><rect x="48" y="214" width="540" height="474" rx="14" fill="white" stroke="#24272b" stroke-width="1.5" stroke-dasharray="7 6"/><text x="73" y="254" font-family="Inter,Arial,sans-serif" font-size="18" fill="#24272b" font-weight="600">DEINE GEWÄHLTE INFRASTRUKTUR</text><rect x="76" y="290" width="480" height="112" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="98" y="327" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Arbeitsbereich + gespeicherte Dateien</text><text x="98" y="362" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Anwendung, Wissen, Dateien, Backups</text><rect x="76" y="455" width="480" height="112" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="98" y="492" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Agentenausführung</text><text x="98" y="527" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400"><tspan x="98" dy="0">Konfigurierte Zugangsdaten, Tools</tspan><tspan x="98" dy="23">und Modellanbindung</tspan></text><rect x="696" y="220" width="296" height="126" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="718" y="257" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Modelldienste</text><text x="718" y="292" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Generierung und Embeddings</text><path d="M588 283 L684 283" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="696" y="373" width="296" height="126" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="718" y="410" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Angebundene Tools</text><text x="718" y="445" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Browser, APIs, externe Dienste</text><path d="M588 436 L684 436" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="696" y="526" width="296" height="126" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="718" y="563" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Betriebsdienste</text><text x="718" y="598" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400"><tspan x="718" dy="0">Überwachung und</tspan><tspan x="718" dy="23">externe Backups</tspan></text><path d="M588 589 L684 589" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><text x="75" y="644" font-family="Inter,Arial,sans-serif" font-size="19" fill="#24272b" font-weight="400">Standort und Zugriff hängen von der Konfiguration ab.</text><path d="M48 796 H992" stroke="#d2d6da"/><text x="48" y="832" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Erfasse für jeden Pfeil: Dateninhalt, Ziel, Betreiber und Aufbewahrung.</text><text x="48" y="863" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schematische Erklärung · keine Produktansicht und kein gemessenes Ergebnis</text></svg>
