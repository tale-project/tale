<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 810" role="img" aria-labelledby="title desc"><title id="title">Zugriff, Aktualität und Belege prüfen</title><desc id="desc">Auch eine Antwort mit Quellenangabe kann die Quelle falsch wiedergeben.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="810" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  PRAXISLEITFADEN</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Zugriff, Aktualität und Belege prüfen</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Auch eine Antwort mit Quellenangabe kann die Quelle falsch wiedergeben.</text><rect x="48" y="235" width="218" height="160" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Zugriffskontext</text><text x="70" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Wer fragt?</text><text x="70" y="349" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Welches Projekt?</text><path d="M266 315 L279 315" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="290" y="235" width="218" height="160" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="312" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600"><tspan x="312" dy="0">Erlaubte</tspan><tspan x="312" dy="28">Quellen</tspan></text><text x="312" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Aktuelle Rechte</text><text x="312" y="349" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">anwenden</text><path d="M508 315 L521 315" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="532" y="235" width="218" height="160" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="554" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Textstellen</text><text x="554" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Quellen abrufen und</text><text x="554" y="349" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Versionen prüfen</text><path d="M750 315 L763 315" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="774" y="235" width="218" height="160" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="796" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600"><tspan x="796" dy="0">Entwurf +</tspan><tspan x="796" dy="28">Belege</tspan></text><text x="796" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Belegt jede Textstelle</text><text x="796" y="349" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">die Aussage?</text><rect x="48" y="464" width="453" height="166" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="501" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Aktualität der Dokumente</text><text x="70" y="536" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Wann wurde der Inhalt geändert?</text><text x="70" y="563" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Wann wurde die Suchkopie aktualisiert?</text><rect x="539" y="464" width="453" height="166" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="561" y="501" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Aktualität der Rechte</text><text x="561" y="536" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Wann änderte sich der Quellenzugriff?</text><text x="561" y="563" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Wann änderten sich die wirksamen Rechte?</text><path d="M48 716 H992" stroke="#d2d6da"/><text x="48" y="752" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Teste fehlende, veraltete, widersprüchliche und nicht zugängliche Quellen getrennt.</text><text x="48" y="783" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schematische Erklärung · keine Produktansicht und kein gemessenes Ergebnis</text></svg>
