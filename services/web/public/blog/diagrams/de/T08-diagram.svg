<svg xmlns="http://www.w3.org/2000/svg" lang="de" viewBox="0 0 1040 820" role="img" aria-labelledby="title desc"><title id="title">Abgenommene Arbeit bewerten</title><desc id="desc">Qualität, Prüfaufwand, Kosten und Gesamtdauer getrennt sichtbar halten.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="820" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  PRAXISLEITFADEN</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Abgenommene Arbeit bewerten</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Qualität, Prüfaufwand, Kosten und Gesamtdauer getrennt sichtbar halten.</text><rect x="48" y="215" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="257" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Fertigstellung</text><text x="70" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Ist das Ergebnis korrekt?</text><text x="70" y="321" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Nur erlaubte Wirkungen?</text><rect x="539" y="215" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="561" y="257" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Prüfaufwand</text><text x="561" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Menschlicher Aufwand in Minuten</text><text x="561" y="321" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Korrekturen und weitere Versuche</text><rect x="48" y="411" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="453" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Erfasste Kosten</text><text x="70" y="491" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Anbieter- und Tool-Gebühren</text><text x="70" y="517" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Offengelegte Umlageannahmen</text><rect x="539" y="411" width="453" height="163" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="561" y="453" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Zeit bis zur Abnahme</text><text x="561" y="491" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Wartezeit + Ausführung + Prüfung</text><text x="561" y="517" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Aktiven Aufwand gesondert erfassen</text><text x="48" y="650" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="500">Gleicher Eingabestand  →  wiederholte Tests  →  gleiche Abnahmekriterien</text><path d="M48 726 H992" stroke="#d2d6da" /><text x="48" y="762" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Fehlversuche gehören in die Auswertung. Fehlende Kostendaten bedeuten nicht null Kosten.</text><text x="48" y="793" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schematische Erklärung · keine Produktansicht und kein gemessenes Ergebnis</text></svg>
