<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 890" role="img" aria-labelledby="title desc"><title id="title">Befugnisse an jeder Grenze prüfen</title><desc id="desc">Anweisungen beschreiben die Absicht. Durchgesetzte Regeln bestimmen den Zugriff.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="890" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  PRAXISLEITFADEN</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Befugnisse an jeder Grenze prüfen</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Anweisungen beschreiben die Absicht. Durchgesetzte Regeln bestimmen den Zugriff.</text><rect x="48" y="207" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><rect x="48" y="207" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="69" y="254" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Identität</text><text x="270" y="254" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Wer startet die Arbeit und führt sie aus?</text><rect x="48" y="301" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><rect x="48" y="301" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="69" y="348" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Daten</text><text x="270" y="348" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Welche Ressourcen darf diese Identität lesen?</text><rect x="48" y="395" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><rect x="48" y="395" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="69" y="442" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Tools</text><text x="270" y="442" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Welche Zugangsdaten und Vorgänge sind verfügbar?</text><rect x="48" y="489" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><rect x="48" y="489" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="69" y="536" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Wirkungen</text><text x="270" y="536" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Welche Schreibzugriffe brauchen eine eigene Genehmigung?</text><rect x="48" y="583" width="944" height="76" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><rect x="48" y="583" width="194" height="76" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="69" y="630" font-family="Inter,Arial,sans-serif" font-size="23" fill="white" font-weight="600">Nachweise</text><text x="270" y="630" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="400">Was wurde versucht, erlaubt und abgeschlossen?</text><rect x="48" y="710" width="944" height="72" rx="14" fill="#e9edf2" stroke="#c5ccd5" stroke-width="1.5"/><text x="70" y="754" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="500">Teste auch Ablehnungen und entzogene Rechte, nicht nur den Erfolgsfall.</text><path d="M48 796 H992" stroke="#d2d6da"/><text x="48" y="832" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Genehmigungen und Protokollierung können je nach Ausführungspfad unterschiedlich greifen.</text><text x="48" y="863" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schematische Erklärung · keine Produktansicht und kein gemessenes Ergebnis</text></svg>
