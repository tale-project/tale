<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" role="img" aria-labelledby="title desc"><title id="title">Drei unterschiedliche Entscheidungen</title><desc id="desc">Rückfrage, Ergebnisprüfung und Aktionsgenehmigung haben unterschiedliche Folgen.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#525860"/></marker></defs><rect width="1040" height="740" fill="#f4f4f4"/><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  PRAXISLEITFADEN</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Drei unterschiedliche Entscheidungen</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Rückfrage, Ergebnisprüfung und Aktionsgenehmigung haben unterschiedliche Folgen.</text><rect x="48" y="223" width="300" height="171" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="70" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Rückfrage</text><text x="70" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Fehlende Informationen</text><text x="70" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">oder eine offene Wahl</text><path d="M198 395 L198 444" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="48" y="461" width="300" height="72" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="64" y="505" font-family="Inter,Arial,sans-serif" font-size="18" fill="white" font-weight="500">Mit der Antwort fortfahren</text><rect x="370" y="223" width="300" height="171" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="392" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Ergebnisprüfung</text><text x="392" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Ein geliefertes Ergebnis</text><text x="392" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">an Abnahmekriterien messen</text><path d="M520 395 L520 444" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="370" y="461" width="300" height="72" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="386" y="505" font-family="Inter,Arial,sans-serif" font-size="18" fill="white" font-weight="500">Abnehmen oder ändern lassen</text><rect x="692" y="223" width="300" height="171" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5"/><text x="714" y="260" font-family="Inter,Arial,sans-serif" font-size="23" fill="#24272b" font-weight="600">Aktionsgenehmigung</text><text x="714" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Ein konkreter Vorgang</text><text x="714" y="322" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">und seine geplante Wirkung</text><path d="M842 395 L842 444" fill="none" stroke="#525860" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="692" y="461" width="300" height="72" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5"/><text x="708" y="505" font-family="Inter,Arial,sans-serif" font-size="18" fill="white" font-weight="500">Aktion erlauben oder ablehnen</text><path d="M48 646 H992" stroke="#d2d6da"/><text x="48" y="682" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Auch eine erlaubte Aktion kann scheitern. Prüfe das Ergebnis gesondert.</text><text x="48" y="713" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schematische Erklärung · keine Produktansicht und kein gemessenes Ergebnis</text></svg>
