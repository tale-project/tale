<svg xmlns="http://www.w3.org/2000/svg" lang="de" viewBox="0 0 1040 850" role="img" aria-labelledby="title desc"><title id="title">Die gesamte Agentenkonfiguration wählen</title><desc id="desc">Das Modell ist eine von mehreren Konfigurationsschichten, die zusammenwirken.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="#525860" /></marker></defs><rect width="1040" height="850" fill="#f4f4f4" /><text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="15" fill="#525860" font-weight="600">TALE  /  PRAXISLEITFADEN</text><text x="48" y="109" font-family="Inter,Arial,sans-serif" font-size="34" fill="#24272b" font-weight="600">Die gesamte Agentenkonfiguration wählen</text><text x="48" y="149" font-family="Inter,Arial,sans-serif" font-size="19" fill="#525860" font-weight="400">Das Modell ist eine von mehreren Konfigurationsschichten, die zusammenwirken.</text><rect x="48" y="214" width="300" height="180" rx="14" fill="#24272b" stroke="#24272b" stroke-width="1.5" /><text x="70" y="256" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="600">Laufzeitumgebung</text><text x="70" y="294" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">Führt die Agentenschleife aus</text><text x="70" y="320" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e1e4e8" font-weight="400">und steuert die Ausführung</text><rect x="370" y="214" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="392" y="256" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Modell</text><text x="392" y="294" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Erzeugt Entscheidungen</text><text x="392" y="320" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">und Antworten</text><rect x="692" y="214" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="714" y="256" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Anbieter</text><text x="714" y="294" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Stellt das Modell bereit</text><text x="714" y="320" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">mit konfiguriertem Zugang</text><rect x="48" y="444" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="70" y="486" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Skills</text><text x="70" y="524" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400"><tspan x="70" dy="0">Liefern wiederverwendbare</tspan><tspan x="70" dy="26">Methoden</tspan></text><text x="70" y="576" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">und ergänzende Ressourcen</text><rect x="370" y="444" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="392" y="486" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Tools</text><text x="392" y="524" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400"><tspan x="392" dy="0">Machen Daten und Aktionen</tspan><tspan x="392" dy="26">zugänglich</tspan></text><text x="392" y="576" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">gemäß den Zugriffsrechten</text><rect x="692" y="444" width="300" height="180" rx="14" fill="white" stroke="#d2d6da" stroke-width="1.5" /><text x="714" y="486" font-family="Inter,Arial,sans-serif" font-size="22" fill="#24272b" font-weight="600">Arbeitsbereich</text><text x="714" y="524" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Enthält Arbeitsdateien</text><text x="714" y="550" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">und gesammelte Ergebnisse</text><path d="M48 756 H992" stroke="#d2d6da" /><text x="48" y="792" font-family="Inter,Arial,sans-serif" font-size="18" fill="#525860" font-weight="400">Prüfe das Zusammenspiel an einer typischen Aufgabe, bevor du Rechte erweiterst.</text><text x="48" y="823" font-family="Inter,Arial,sans-serif" font-size="14" fill="#525860" font-weight="400">Schematische Erklärung · keine Produktansicht und kein gemessenes Ergebnis</text></svg>
