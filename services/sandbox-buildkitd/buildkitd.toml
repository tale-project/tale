# Shared sandbox buildkitd configuration. See services/sandbox-buildkitd/Dockerfile.
root = "/var/lib/buildkit"

[grpc]
# gRPC endpoint the sessions' remote buildx builder connects to. Bound on the
# organization network only (never published to the host); a unix socket
# is also exposed for in-container probes. The spawner enforces a separate
# internal bridge per organization; this endpoint has no client authentication.
address = ["tcp://0.0.0.0:1234", "unix:///run/buildkit/buildkitd.sock"]

[worker.oci]
enabled = true
# Build RUN steps share this container's netns so they inherit the redsocks
# transparent-egress fence installed by docker-entrypoint.sh. MUST stay
# "host" — the alternative "bridge" default (newer BuildKit) gives RUN steps
# their own subnet that bypasses the redirect, so they'd have no egress.
networkMode = "host"
gc = true

# Keep the cache bounded so a runaway build can't fill the host disk. The
# persistent /var/lib/buildkit volume holds the cache across daemon restarts.
# A rule's keepDuration shields everything used more recently than it from
# that rule's space limits, so the old `keepBytes + keepDuration` rule pruned
# nothing used within a week. GC applies the rules in order, at start and
# about a minute after a build:
# first, cache mounts, build contexts and git checkouts unused for two days go;
[[worker.oci.gcpolicy]]
keepDuration = "48h"
filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
# then everything else, least recently used first, until the cache is under
# 20 GB — and smaller while the disk it shares with every session has less
# than 5% free, but never below 2 GB: every organization's builder prunes its
# own cache by the whole shortfall, so without that floor a disk that other
# data filled would wipe each building organization's cache.
[[worker.oci.gcpolicy]]
all = true
maxUsedSpace = "20GB"
minFreeSpace = "5%"
reservedSpace = "2GB"

[worker.containerd]
# Single OCI worker; no containerd worker (the image has no containerd.sock).
enabled = false
