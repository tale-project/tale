# The checks the merge train waits for on tale/tale, one per workflow: the
# readiness job of each ported workflow, as Forgejo names its status. The ops
# repository declares them in deployments/tale/merge-train/pr/repositories.yml.
# Generated: bun tools/cli/scripts/forgejo-port.ts checks --write
- Build / CI ready (Build)
- CLI / CI ready (CLI)
- Checks / CI ready (Checks)
- Commitlint / CI ready (Commitlint)
- E2E / CI ready (E2E)
- SAST / CI ready (SAST)
- Security / CI ready (Security)
