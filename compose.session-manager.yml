# =============================================================================
# Tale Session Manager — Standalone Docker Compose
# =============================================================================
# The manager for isolated Camoufox browser sessions runs independently of the
# platform stack (services/platform, db, knowledge-db, proxy, sandbox), as the
# sites do, with its own image and its own stack.
#
# Unlike the sites it is a tool for one person, not a site: it has NO LOGIN and
# drives browsers with your proxies and your secrets. So the port is published
# on the loopback only (compose.web.yml publishes on every interface). To reach
# the manager from other machines, put a reverse proxy that authenticates in
# front of it and name the address people use in SESSION_MANAGER_ALLOWED_HOSTS.
#
# Usage:
#   Local build:    docker compose -f compose.session-manager.yml up --build
#   Pull image:     PULL_POLICY=always docker compose -f compose.session-manager.yml up -d
# then open http://localhost:3004. The default policy builds, so a plain `up -d`
# builds the image from this checkout rather than using a pulled one.
#
# Environment variables, from your shell or from a .env file next to this one:
#   SESSION_MANAGER_PORT           Port on 127.0.0.1 (default 3004).
#   SESSION_MANAGER_ALLOWED_HOSTS  The Host values the server answers (DNS
#                                  rebinding guard), `host:port` exactly as in the
#                                  address bar, comma separated. Default: localhost
#                                  and 127.0.0.1 on SESSION_MANAGER_PORT. Replaces
#                                  that default, so list those two as well.
#   SESSION_MANAGER_BLOCK_WEBRTC   `1` removes RTCPeerConnection from every browser.
#   VERSION                        Image tag to pull (default latest), and the
#                                  version a local build reports (default dev).
#
# /data is the volume: the database (proxy passwords and secrets), every
# session's profile and, in /data/camoufox, the Camoufox browser and the GeoIP
# database. The first start downloads them in the background (about 700 MB) and
# needs about 2 GB of memory to unpack them; services/session-manager/Dockerfile
# says more.
#
# Image:
#   ghcr.io/tale-project/tale/tale-session-manager:${VERSION:-latest}

services:
  session-manager:
    image: ghcr.io/tale-project/tale/tale-session-manager:${VERSION:-latest}
    container_name: tale-session-manager
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: .
      dockerfile: services/session-manager/Dockerfile
      args:
        VERSION: ${VERSION:-dev}

    environment:
      # The server listens on 3004 inside the container and answers only the
      # Host values it knows: under another published port the address bar says
      # localhost:<port>, which it must be told.
      SESSION_MANAGER_ALLOWED_HOSTS: ${SESSION_MANAGER_ALLOWED_HOSTS:-localhost:${SESSION_MANAGER_PORT:-3004},127.0.0.1:${SESSION_MANAGER_PORT:-3004}}
      SESSION_MANAGER_BLOCK_WEBRTC: ${SESSION_MANAGER_BLOCK_WEBRTC:-false}

    ports:
      - '127.0.0.1:${SESSION_MANAGER_PORT:-3004}:3004'

    volumes:
      - session-manager-data:/data

    restart: unless-stopped

    # Closing the browsers takes the server up to 30 seconds, and Compose stops
    # a container after 10 by default: a browser killed halfway through would
    # not save its tabs for the session's next start.
    stop_grace_period: 40s

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3004/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  session-manager-data:
