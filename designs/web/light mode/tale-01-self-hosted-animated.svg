      <circle cx="16" cy="0" r="5.5" fill="rgba(14,13,11,0.12)"/>
      <circle cx="32" cy="0" r="5.5" fill="rgba(14,13,11,0.12)"/>
      <text x="536" y="4" text-anchor="end" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="rgba(14,13,11,0.38)" letter-spacing="0.6">tale@localhost</text>
    </g>

    <g transform="translate(32, 124)" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <text x="0" y="0" fill="#0E0D0B">$ tale start</text><text x="0" y="36" fill="rgba(14,13,11,0.55)">↳ platform   running</text><text x="0" y="60" fill="rgba(14,13,11,0.55)">↳ rag        running</text><text x="0" y="84" fill="rgba(14,13,11,0.55)">↳ convex     running</text>
    </g>

    <g transform="translate(24, 264)">
