      <text x="0" y="22" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(14,13,11,0.38)" letter-spacing="0.8">HOST · 0.0.0.0  ·  EGRESS · 0  ·  VENDOR · NONE</text>
