<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <rect width="600" height="540" fill="#FAFAFA"/>
  <g transform="translate(0, 22)">
    <rect x="8" y="24" width="584" height="448" rx="14"
