        fill="rgba(42,95,143,0.07)" stroke="#2A5F8F" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="552" height="38" rx="9"
        fill="#2A5F8F" fill-opacity="0.04" stroke="none">
        <animate attributeName="fill-opacity" values="0.04;0.10;0.04" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="18" y="25" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#2A5F8F">✓ ready at https://localhost</text>
    </g>

    <g transform="translate(32, 340)" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
