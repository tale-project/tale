# =============================================================================
# Tale UI Docs (Design-system documentation site) — Standalone Docker Compose
# =============================================================================
# The design-system docs site at ui.tale.dev runs independently of the
# platform stack and has its own environment file at
# services/ui-docs/.env.example.
#
# Usage:
#   Local build:    docker compose -f compose.ui-docs.yml up --build
#   Pull image:     docker compose -f compose.ui-docs.yml pull && docker compose -f compose.ui-docs.yml up -d
#
# Image:
#   ghcr.io/tale-project/tale/tale-ui-docs:${VERSION:-latest}

services:
  ui-docs:
    image: ghcr.io/tale-project/tale/tale-ui-docs:${VERSION:-latest}
    container_name: tale-ui-docs
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: .
      dockerfile: services/ui-docs/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        UI_DOCS_BASE_URL: ${UI_DOCS_BASE_URL:-/}
        UI_DOCS_SITE_URL: ${UI_DOCS_SITE_URL:-https://ui.tale.dev}

    env_file:
      # Optional: the ui-docs site runs fine on its build-arg defaults. Marked
      # not-required so the file's absence doesn't fail compose validation for
      # the whole project.
      - path: services/ui-docs/.env
        required: false

    ports:
      - '3003:3003'

    restart: unless-stopped

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3003/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
