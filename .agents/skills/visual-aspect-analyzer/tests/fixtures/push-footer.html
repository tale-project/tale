<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>push footer</title>
    <style>
      body {
        margin: 0;
      }
      #promo {
        height: 100px;
        background: #eee;
        transition: none;
      }
      #footer {
        height: 40px;
        background: #333;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="promo">promo</div>
    <div id="footer">footer</div>
    <script>
      // The promo grows, pushing the footer down: a layout shift the footer is
      // the source of, and the footer is "affected by" the promo.
      setTimeout(() => {
        document.getElementById('promo').style.height = '220px';
      }, 300);
    </script>
  </body>
</html>
