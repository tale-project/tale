<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>a slow fade during a resize is a composite transition</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 24px;
      }
      /* Width grows AND opacity drifts slowly: the per-frame opacity step stays
         under the fade epsilon, so only the whole-interval opacity range reveals
         the fade. Without that, this is mislabelled a plain resize. */
      #card {
        width: 120px;
        height: 80px;
        background: #0a7;
        opacity: 1;
        transition:
          width 680ms linear,
          opacity 680ms linear;
      }
      #card.go {
        width: 320px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="card" data-testid="card">Card</div>
    </main>
    <script>
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          document.getElementById('card').classList.add('go');
        });
      });
    </script>
  </body>
</html>
