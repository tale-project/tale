<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>spa</title>
  </head>
  <body>
    <div id="view">home</div>
    <script>
      // A programmatic SPA route change: the instrument wraps pushState, so this
      // opens a second segment without a full reload.
      setTimeout(() => {
        history.pushState({}, '', '/page-2');
        document.getElementById('view').textContent = 'page two';
      }, 300);
    </script>
  </body>
</html>
