<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline SVG is detected as painting media</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 24px;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Main">Site</nav>
    <!-- A real inline <svg> reports a lowercase, namespaced tagName ('svg'); the
         media checks normalise the case so it is seeded, painting, and reported. -->
    <svg id="logo" width="120" height="80" viewBox="0 0 120 80">
      <rect x="10" y="10" width="100" height="60" fill="#0a7" />
      <circle cx="60" cy="40" r="20" fill="#fff" />
    </svg>
  </body>
</html>
