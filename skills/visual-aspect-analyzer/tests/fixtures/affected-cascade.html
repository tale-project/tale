<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>affected cascade</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      #promo {
        height: 50px;
        background: #fc0;
      }
      .item {
        height: 60px;
        border-bottom: 1px solid #ccc;
        padding: 8px;
        background: #fff;
      }
      /* Absolutely positioned: it must NOT be reported as affected by #promo. */
      #floating {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 80px;
        height: 30px;
        background: #0af;
      }
    </style>
  </head>
  <body>
    <div id="floating">floating</div>
    <div id="promo">promo banner</div>
    <div class="item" id="item-1">item 1</div>
    <div class="item" id="item-2">item 2</div>
    <div class="item" id="item-3">item 3</div>
    <div class="item" id="item-4">item 4</div>
    <div class="item" id="item-5">item 5</div>
    <div class="item" id="item-6">item 6</div>
    <script>
      // The promo grows and pushes the whole in-flow column down: every item is
      // "affected by" #promo; the absolutely-positioned #floating is not.
      setTimeout(() => {
        document.getElementById('promo').style.height = '200px';
      }, 300);
    </script>
  </body>
</html>
