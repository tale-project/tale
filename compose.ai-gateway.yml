# =============================================================================
# Tale AI Gateway (subscription credential pool) — Standalone Docker Compose
# =============================================================================
# The gateway runs independently of the platform stack and has its own
# environment file at services/ai-gateway/.env.example.
#
# Usage:
#   Local build:    docker compose -f compose.ai-gateway.yml up --build
#   Pull image:     docker compose -f compose.ai-gateway.yml pull && docker compose -f compose.ai-gateway.yml up -d
#
# Image:
#   ghcr.io/tale-project/tale/tale-ai-gateway:${VERSION:-latest}

services:
  ai-gateway:
    image: ghcr.io/tale-project/tale/tale-ai-gateway:${VERSION:-latest}
    container_name: tale-ai-gateway
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: .
      dockerfile: services/ai-gateway/Dockerfile
      args:
        VERSION: ${VERSION:-dev}

    env_file:
      # Required in practice — the gateway refuses to start without its four
      # secrets — but marked optional so the file's absence does not fail
      # compose validation for the whole project.
      - path: services/ai-gateway/.env
        required: false

    environment:
      # The volume below, not the image's working directory: the credential
      # pool has to outlive the container.
      AI_GATEWAY_DATA_DIR: /data

    volumes:
      - ai-gateway-data:/data

    ports:
      - '3004:3004'

    restart: unless-stopped

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3004/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  # The encrypted account document. Back this up; losing it loses every
  # authorized account (and the encryption key alone cannot rebuild it).
  ai-gateway-data:
    driver: local
