name: Migrations E2E

# The real-stack layer of the migration integrity proof (the fast per-PR
# layer is the chain suite inside the `migrations` job of test.yml). Tier 1
# boots the current images and injects the 0.2.84 baseline world; the nightly
# schedule and manual dispatch run tier 2 — a true upgrade from an old
# published image, covering push-time schema validation over existing rows.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/platform/convex/migrations/**'
      - 'services/platform/convex/schema.ts'
      - 'services/platform/lib/shared/schemas/**'
      - 'services/platform/docker-entrypoint.sh'
      - 'services/platform/tests/integration/container-migrations-test.ts'
      - '.github/workflows/migrations-e2e.yml'
  schedule:
    # Nightly tier-2 upgrade run (03:17 UTC — off the top-of-hour rush).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      from_version:
        description: 'Old image tag to upgrade FROM (tier 2); empty = tier 1'
        required: false
        default: ''

concurrency:
  group: migrations-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations-e2e:
    name: Migrations E2E (container)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (tier 2 pulls old images)
        if: github.event_name == 'schedule' || github.event.inputs.from_version != ''
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tier-2 source version
        id: from
        # `github` context values never interpolate into the script (shell
        # injection); they arrive as env vars, and the dispatch input must
        # look like a version before it may reach the e2e image refs.
        env:
          FROM_INPUT: ${{ github.event.inputs.from_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          FROM="$FROM_INPUT"
          if [ -z "$FROM" ] && [ "$EVENT_NAME" = "schedule" ]; then
            # Nightly default: the previous minor's latest published tag —
            # bounded below by the 0.4.0 migration baseline (the history
            # reset removed every earlier upgrade path; the entrypoint's
            # breaking-cutover guard refuses pre-0.4 volumes by design).
            # Until a second >= 0.4.0 line exists this resolves empty and
            # the nightly runs tier 1.
            FROM=$(git tag --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -Ev '^v0\.[0-3]\.' \
              | sed -n '2p' | sed 's/^v//')
          fi
          if [ -n "$FROM" ] && ! echo "$FROM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "from_version '$FROM' is not a plain X.Y.Z version" >&2
            exit 1
          fi
          echo "version=$FROM" >> "$GITHUB_OUTPUT"
          echo "Tier-2 source version: '${FROM:-<none — tier 1>}'"

      - name: Run migrations e2e
        env:
          MIGRATIONS_E2E_FROM: ${{ steps.from.outputs.version }}
        run: bun run docker:test:migrations
