name: Checks

# The tale-project standard check gate (see tale-project/example-project):
# six jobs with stable names — format, lint, typecheck, build, test, test-ui —
# each one `setup-turbo` + a single root script, identical across repositories.
# Repo-specific extra jobs append below the marked banner and never replace or
# rename the standard six.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_API: 'http://127.0.0.1:9080'
  TURBO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TURBO_TEAM: 'tale'

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # uv backs `uvx ruff@<ver>` in format:check (Python formatting).
      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run format check
        run: bun run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run lint
        run: bunx turbo run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run type check
        run: bunx turbo run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run build
        run: bunx turbo run build

  test:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # bgutil PO-token provider — the zero-config anti-bot layer baked into the
    # convex image. Runs as a service container so the live YouTube-ingestion
    # step (last) can fetch GVS tokens at 127.0.0.1:4416, exactly like the
    # `bgutil-provider` compose sidecar in production.
    services:
      bgutil:
        image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
        ports:
          - 4416:4416

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # yt-dlp + deno + ffmpeg + the bgutil plugin are self-provisioned by the
      # live YouTube ingestion test via `ensureVideoToolchain()` in a
      # `beforeAll` (convex/video_links/ytdlp_toolchain.ts). It still runs here
      # because GitHub runners are datacenter IPs — the environment where
      # YouTube's bot wall appears — so a green run proves the shipped anti-bot
      # stack actually gets past it.
      - name: Run tests
        # YOUTUBE_LIVE_TEST enables the live ingest test within the normal
        # suite; it + VIDEO_INGEST_POT_PROVIDER_URL are declared on the `test`
        # task in turbo.json so turbo keys its cache on them.
        env:
          YOUTUBE_LIVE_TEST: '1'
          VIDEO_INGEST_POT_PROVIDER_URL: http://127.0.0.1:4416
        run: bunx turbo run test

  test-ui:
    name: UI
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run UI tests
        run: bunx turbo run test:ui

  # ===========================================================================
  # Repo-specific jobs — tale's additions beyond the standard six.
  # ===========================================================================

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          start-turbo-cache: 'false'

      - name: Run knip
        run: bun run knip:check

  # Data-migration guard + round-trip tests. The guard runs FIRST so a missing
  # test / registry entry / snapshot fails fast with a named error before the
  # (slower) round-trip suite.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Migration manifest + test guard
        working-directory: services/platform
        run: bun run migrations:check

      - name: Migration round-trip tests (up & down)
        working-directory: services/platform
        run: bunx vitest --run --project server convex/migrations

  # Browser-mode component tests (`*.browser.test.tsx`) — Vitest Browser Mode
  # mounts components in a real Chromium for the assertions jsdom can't fake
  # (real layout/getBoundingClientRect, React Flow geometry, the Clipboard API,
  # real focus/breakpoints). Boots no backend, so it is far cheaper than a
  # Playwright E2E shard. Draft PRs skip.
  test-browser:
    name: Browser
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: services/platform
        # The azure apt mirror flakes hard (2026-08-19: shards burned on it
        # twice — first hanging a job's whole 30-minute budget, then as an
        # apt-lock pileup when a per-attempt timeout killed bunx but not its
        # root apt child). Point apt at the canonical archive up front and
        # cap the step; no inner timeout/retry — those cannot kill root's
        # apt and only leave a held lock behind.
        timeout-minutes: 12
        run: |
          # Guarded: the mirror file is standard on ubuntu-latest, but a runner-image
          # change must degrade to the default mirror, not fail the job under set -e.
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          bunx playwright install --with-deps chromium

      - name: Run browser-mode component tests
        run: bunx turbo run test:browser
