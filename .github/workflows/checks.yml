name: Checks

# The tale-project standard check gate (see tale-project/example-project):
# six jobs with stable names — format, lint, typecheck, build, test, test-ui —
# each one `setup-turbo` + a single root script, identical across repositories.
# Repo-specific extra jobs append below the marked banner and never replace or
# rename the standard six.

run-name: ${{ github.event_name == 'repository_dispatch' && format('Release candidate {0}', github.event.client_payload.candidate_sha) || '' }}

on:
  repository_dispatch:
    types: [release-candidate]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && format('candidate-{0}', github.event.client_payload.candidate_sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}

env:
  TURBO_API: 'http://127.0.0.1:9080'
  TURBO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TURBO_TEAM: 'tale'

jobs:
  candidate-source:
    name: Candidate source
    uses: ./.github/workflows/release-candidate-source.yml
    permissions:
      contents: read
    with:
      candidate: ${{ github.event_name == 'repository_dispatch' }}
      candidate_sha: ${{ github.event.client_payload.candidate_sha }}

  format:
    needs: candidate-source
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # uv backs `uvx ruff@<ver>` in format:check (Python formatting).
      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run format check
        run: bun run format:check

      # A conflict a merge or rebase left behind parses fine in markdown and
      # shell, so no other job would notice it.
      - name: Refuse merge-conflict markers
        run: bun run lint:conflicts

  lint:
    needs: candidate-source
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run lint
        run: bunx turbo run lint

  typecheck:
    needs: candidate-source
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run type check
        run: bunx turbo run typecheck

  build:
    needs: candidate-source
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run build
        run: bunx turbo run build
        env:
          # @tale/web's fetch-releases calls api.github.com; unauthenticated
          # shared-runner IPs get rate-limited (403), so hand it the workflow
          # token — the same cure the E2E prerender step carries. turbo passes
          # it through (`globalPassThroughEnv`) without hashing it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: candidate-source
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # bgutil PO-token provider — the zero-config anti-bot layer baked into the
    # platform image. Runs as a service container so the live YouTube-ingestion
    # step (last) can fetch GVS tokens at 127.0.0.1:4416, exactly like the
    # `bgutil-provider` compose sidecar in production.
    services:
      bgutil:
        image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
        ports:
          - 4416:4416

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # yt-dlp + deno + ffmpeg + the bgutil plugin are self-provisioned by the
      # live YouTube ingestion test via `ensureVideoToolchain()` in a
      # `beforeAll` (backend/core/video_links/ytdlp_toolchain.ts). It still runs here
      # because GitHub runners are datacenter IPs — the environment where
      # YouTube's bot wall appears — so a green run proves the shipped anti-bot
      # stack actually gets past it.
      - name: Run tests
        # YOUTUBE_LIVE_TEST enables the live ingest test within the normal
        # suite; it + VIDEO_INGEST_POT_PROVIDER_URL are declared on the `test`
        # task in turbo.json so turbo keys its cache on them.
        env:
          YOUTUBE_LIVE_TEST: '1'
          VIDEO_INGEST_POT_PROVIDER_URL: http://127.0.0.1:4416
        # Each workspace runner has its own worker pool. Bound their overlap so
        # full-corpus checks retain CPU time on the shared hosted runner.
        run: bunx turbo run test --concurrency=2

  test-ui:
    needs: candidate-source
    name: UI
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run UI tests
        run: bunx turbo run test:ui

  # ===========================================================================
  # Repo-specific jobs — tale's additions beyond the standard six.
  # ===========================================================================

  knip:
    needs: candidate-source
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          start-turbo-cache: 'false'

      - name: Run knip
        run: bun run knip:check

  # Browser-mode component tests (`*.browser.test.tsx`) — Vitest Browser Mode
  # mounts components in a real Chromium for the assertions jsdom can't fake
  # (real layout/getBoundingClientRect, React Flow geometry, the Clipboard API,
  # real focus/breakpoints). Boots no backend, so it is far cheaper than a
  # Playwright E2E shard. Draft PRs skip.
  test-browser:
    needs: candidate-source
    name: Browser
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: services/platform
        # Preserve the runner's mirror failover. Bound APT itself: killing
        # bunx with a shell timeout can leave its root child holding the lock.
        timeout-minutes: 12
        run: |
          # Native config also reaches Playwright's sudo-launched APT process.
          sudo tee /etc/apt/apt.conf.d/99-tale-playwright >/dev/null <<'APT'
          Acquire::ForceIPv4 "true";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "1";
          APT
          sudo apt-config shell IPv4 Acquire::ForceIPv4 HTTPTimeout Acquire::http::Timeout HTTPSTimeout Acquire::https::Timeout Retries Acquire::Retries
          bunx playwright install --with-deps chromium

      - name: Run browser-mode component tests
        run: bunx turbo run test:browser

  # A real, uncached Postgres + object-store proof. Run on every normal event,
  # including draft PRs, and on the same pinned source as the candidate receipt.
  backend-integration:
    needs: candidate-source
    name: Backend integration (all lanes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ITEST_REQUIRE_ALL_LANES: '1'
      ITEST_S3_ENDPOINT: http://127.0.0.1:19000
      VIDEO_INGEST_FFMPEG_LOCATION: /usr/bin/ffmpeg
      DB_CONTAINER: tale-itest-db-${{ github.run_id }}-${{ github.run_attempt }}
      S3_CONTAINER: tale-itest-s3-${{ github.run_id }}-${{ github.run_attempt }}
      DB_IMAGE: tale-itest-db:${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          start-turbo-cache: 'false'

      - name: Prepare isolated proof and shipped runtime pins
        id: runtime
        run: |
          set -euo pipefail
          PROOF_DIR="$RUNNER_TEMP/backend-integration-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "PROOF_DIR=$PROOF_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_DIR" "$PROOF_DIR/config" "$PROOF_DIR/builtin"
          node_image="$(sed -n 's/^FROM \(node:[^ ]*\) AS node-bin$/\1/p' services/platform/Dockerfile)"
          node_version="${node_image#node:}"
          node_version="${node_version%%-*}"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "node-version=$node_version" >> "$GITHUB_OUTPUT"
          object_image="$(bun -e 'import { THIRD_PARTY_IMAGES } from "./tools/cli/src/lib/compose/types.ts"; console.log(THIRD_PARTY_IMAGES["object-store"]);')"
          test -n "$object_image"
          db_password="$(openssl rand -hex 24)"
          s3_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$s3_secret"
          {
            echo "DB_PASSWORD=$db_password"
            echo "DATABASE_URL=postgresql://tale:$db_password@127.0.0.1:15432/tale_app"
            echo "KNOWLEDGE_DATABASE_URL=postgresql://tale:$db_password@127.0.0.1:15432/tale_knowledge"
            echo "ITEST_S3_ACCESS_KEY=tale-itest"
            echo "ITEST_S3_SECRET_KEY=$s3_secret"
            echo "MINIO_ROOT_USER=tale-itest"
            echo "MINIO_ROOT_PASSWORD=$s3_secret"
            echo "TALE_CONFIG_DIR=$PROOF_DIR/config"
            echo "TALE_CONFIG_BUILTIN_DIR=$PROOF_DIR/builtin"
            echo "OBJECT_STORE_IMAGE=$object_image"
          } >> "$GITHUB_ENV"
          {
            echo "source=$(git rev-parse HEAD)"
            echo "workflow-event=$GITHUB_EVENT_NAME"
            echo "workflow-sha=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "node-image=$node_image"
            echo "object-store=$object_image"
            sha256sum services/db/Dockerfile services/platform/backend/integration-check.ts
          } > "$PROOF_DIR/source.txt"

      - name: Setup shipping Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.runtime.outputs.node-version }}
          package-manager-cache: false

      - name: Install media tooling
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          { node --version; bun --version; ffmpeg -version; ffprobe -version; } > "$PROOF_DIR/toolchain.txt"

      - name: Build candidate database image
        timeout-minutes: 15
        run: |
          set -euo pipefail
          docker build --file services/db/Dockerfile --tag "$DB_IMAGE" . 2>&1 | tee "$PROOF_DIR/db-build.log"

      - name: Start disposable database and shipped object store
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker run --detach --name "$DB_CONTAINER" --shm-size=512m \
            --publish 127.0.0.1:15432:5432 --env DB_PASSWORD \
            --env TALE_DB_ROLE=knowledge "$DB_IMAGE"
          docker run --detach --name "$S3_CONTAINER" \
            --publish 127.0.0.1:19000:9000 --env MINIO_ROOT_USER --env MINIO_ROOT_PASSWORD \
            "$OBJECT_STORE_IMAGE" server /data
          for _attempt in $(seq 1 90); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$DB_CONTAINER")"
            if [ "$health" = healthy ]; then break; fi
            if [ "$health" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          test "$health" = healthy
          curl --fail --silent --show-error --retry 60 --retry-connrefused --retry-delay 2 --retry-max-time 120 --max-time 5 \
            "$ITEST_S3_ENDPOINT/minio/health/ready"
          # Readiness means migrations finished; also refuse a degraded corpus
          # image instead of allowing pg_search's optional boot path to pass.
          test "$(docker exec "$DB_CONTAINER" psql -U tale -d tale_knowledge -tAc "SELECT count(*) FROM pg_extension WHERE extname IN ('pg_search', 'vector')")" = 2
          docker exec "$DB_CONTAINER" psql -U tale -d tale_app -v ON_ERROR_STOP=1 -c 'SELECT 1'
          docker exec "$DB_CONTAINER" psql -U tale -d tale_knowledge -c "SELECT extname, extversion FROM pg_extension WHERE extname IN ('pg_search', 'vector')" > "$PROOF_DIR/extensions.txt"
          docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "$DB_IMAGE" "$OBJECT_STORE_IMAGE" > "$PROOF_DIR/images.txt"

      - name: Run every backend integration lane
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # Direct workspace command: no Turbo verdict can be replayed. The
          # harness owns lane accounting, skip refusal and the failure exit.
          trap 'echo "$?" > "$PROOF_DIR/exit-code.txt"' EXIT
          bun run --filter @tale/platform backend:integration 2>&1 | tee "$PROOF_DIR/backend-integration.log"

      - name: Retain service diagnostics and stop owned containers
        if: always()
        timeout-minutes: 2
        run: |
          PROOF_DIR="${PROOF_DIR:-$RUNNER_TEMP/backend-integration-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}"
          echo "PROOF_DIR=$PROOF_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_DIR"
          docker logs "$DB_CONTAINER" > "$PROOF_DIR/db.log" 2>&1 || true
          docker logs "$S3_CONTAINER" > "$PROOF_DIR/object-store.log" 2>&1 || true
          docker rm --force --volumes "$DB_CONTAINER" "$S3_CONTAINER" || true

      - name: Upload backend integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROOF_DIR }}/*.txt
            ${{ env.PROOF_DIR }}/*.log
          if-no-files-found: error
          retention-days: 14

  candidate-gate:
    name: Candidate gate
    needs: [candidate-source, format, lint, typecheck, build, test, test-ui, knip, test-browser, backend-integration]
    if: always() && github.event_name == 'repository_dispatch'
    uses: ./.github/workflows/release-candidate-receipt.yml
    permissions: {}
    with:
      candidate_sha: ${{ github.event.client_payload.candidate_sha }}
      workflow: .github/workflows/checks.yml
      jobs: ${{ toJSON(needs) }}
