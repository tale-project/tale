name: Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/platform/**'
      - 'services/sandbox/**'
      - 'services/sandbox-runtime/**'
      - 'services/sandbox-buildkitd/**'
      - 'services/controller/**'
      - 'packages/**'
      - 'services/db/**'
      - 'services/proxy/**'
      - 'tools/cli/**'
      - 'tools/skills/**'
      - '.agents/skills/**'
      - '.claude/skills/**'
      - 'builtin-configs/skills/**'
      - 'docs/**'
      - 'README.md'
      - 'README.de.md'
      - 'README.fr.md'
      - '.github/workflows/test.yml'
      - '.github/actions/setup-turbo/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'tsconfig.base.json'
  push:
    branches:
      - main
    paths:
      - 'services/platform/**'
      - 'services/sandbox/**'
      - 'services/sandbox-runtime/**'
      - 'services/sandbox-buildkitd/**'
      - 'services/controller/**'
      - 'packages/**'
      - 'services/db/**'
      - 'services/proxy/**'
      - 'tools/cli/**'
      - 'tools/skills/**'
      - '.agents/skills/**'
      - '.claude/skills/**'
      - 'builtin-configs/skills/**'
      - 'docs/**'
      - 'README.md'
      - 'README.de.md'
      - 'README.fr.md'
      - '.github/workflows/test.yml'
      - '.github/actions/setup-turbo/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'tsconfig.base.json'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_API: 'http://127.0.0.1:9080'
  TURBO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TURBO_TEAM: 'tale'

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests via Turborepo.
  # ---------------------------------------------------------------------------
  test:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # bgutil PO-token provider — the zero-config anti-bot layer baked into the
    # convex image. Runs as a service container so the live YouTube-ingestion
    # step (last) can fetch GVS tokens at 127.0.0.1:4416, exactly like the
    # `bgutil-provider` compose sidecar in production.
    services:
      bgutil:
        image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
        ports:
          - 4416:4416

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: yt-dlp + deno + ffmpeg + the bgutil plugin are NO LONGER installed
      # here. The live YouTube ingestion test (convex/video_links/ytdlp_live.test.ts)
      # now SELF-PROVISIONS them via `ensureVideoToolchain()` in a `beforeAll`
      # (see convex/video_links/ytdlp_toolchain.ts), downloading whatever the
      # host is missing into a per-user cache. That makes the exact same test
      # runnable on a laptop, not just on CI — the bespoke install step is gone.
      #
      # We STILL run it here because GitHub runners are DATACENTER IPs — the exact
      # environment where YouTube's "confirm you're not a bot" wall appears — so a
      # green run proves the shipped anti-bot stack (the bgutil PO-token provider
      # service above + tuned player clients) actually gets past the wall and
      # pulls a transcript, not just that it works from a residential laptop.

      - name: Run tests
        # YOUTUBE_LIVE_TEST enables the live ingest test within the normal suite;
        # it + VIDEO_INGEST_POT_PROVIDER_URL are declared on the `test` task in
        # turbo.json so turbo keys its cache on them (else a cached result would
        # skip the live test). VIDEO_INGEST_YTDLP_PLUGIN_DIRS is intentionally
        # NOT set — the toolchain helper points it at the self-provisioned plugin
        # cache at runtime.
        env:
          YOUTUBE_LIVE_TEST: '1'
          VIDEO_INGEST_POT_PROVIDER_URL: http://127.0.0.1:4416
        run: bunx turbo run test

  # ---------------------------------------------------------------------------
  # Data-migration guard + round-trip tests. The guard runs FIRST so a missing
  # test / registry entry / snapshot fails fast with a named error before the
  # (slower) round-trip suite.
  # ---------------------------------------------------------------------------
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Migration manifest + test guard
        working-directory: services/platform
        run: bun run migrations:check

      - name: Migration round-trip tests (up & down)
        working-directory: services/platform
        run: bunx vitest --run --project server convex/migrations

  # ---------------------------------------------------------------------------
  # UI tests. Draft PRs skip.
  # ---------------------------------------------------------------------------
  test-ui:
    name: UI
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run UI tests
        run: bunx turbo run test:ui

  # ---------------------------------------------------------------------------
  # Browser-mode component tests (`*.browser.test.tsx`) — Vitest Browser Mode
  # mounts components in a real Chromium for the assertions jsdom can't fake
  # (real layout/getBoundingClientRect, React Flow geometry, the Clipboard API,
  # real focus/breakpoints). This lane boots NO backend, build, or hermetic
  # stack, so it is far cheaper than a Playwright E2E shard — it is where UI
  # tests that need a real browser but not a real backend belong. Draft PRs skip.
  # ---------------------------------------------------------------------------
  test-browser:
    name: Browser
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: services/platform
        # The azure apt mirror flakes hard (2026-08-19: shards burned on it
        # twice — first hanging a job's whole 30-minute budget, then as an
        # apt-lock pileup when a per-attempt timeout killed bunx but not its
        # root apt child). Point apt at the canonical archive up front and
        # cap the step; no inner timeout/retry — those cannot kill root's
        # apt and only leave a held lock behind.
        timeout-minutes: 12
        run: |
          # Guarded: the mirror file is standard on ubuntu-latest, but a runner-image
          # change must degrade to the default mirror, not fail the job under set -e.
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          bunx playwright install --with-deps chromium

      - name: Run browser-mode component tests
        run: bunx turbo run test:browser
