name: YouTube ingest (live)

# Proves YouTube video-link ingestion actually works — from a DATACENTER IP,
# the exact environment where YouTube's "confirm you're not a bot" wall appears.
# GitHub-hosted runners are datacenter IPs, so a green run here is real evidence
# the shipped anti-bot stack (bgutil PO-token provider + tuned player clients)
# gets past the wall and pulls a transcript. The test itself calls the platform's
# own ytdlpJson / ytdlpWriteSubs (services/platform/convex/video_links/ytdlp.ts),
# so it exercises buildAntiBotFlags exactly as production does.
#
# Live network + YouTube dependency, so it is its OWN workflow (never part of the
# blocking unit gate): on video-ingest PRs, nightly, and on demand.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/platform/convex/video_links/**'
      - '.github/workflows/youtube-ingest.yml'
  schedule:
    # Nightly at 03:30 UTC — continuous proof the feature still works.
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: YouTube transcript (datacenter IP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12

    # The bgutil PO-token provider — the zero-config anti-bot layer that ships
    # in the convex image. Runs as a service container so the yt-dlp bgutil
    # plugin can fetch GVS tokens from http://127.0.0.1:4416, exactly like the
    # `bgutil-provider` compose sidecar in production.
    services:
      bgutil:
        image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
        ports:
          - 4416:4416

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install yt-dlp, deno, ffmpeg (into runYtdlp's pinned PATH)
        run: |
          set -euo pipefail
          # runYtdlp pins PATH=/usr/local/bin:/usr/bin:/bin and spawns `yt-dlp`,
          # which itself spawns deno (JS challenge) + ffmpeg (subtitle convert).
          # All three must resolve on that PATH.
          sudo apt-get update && sudo apt-get install -y ffmpeg unzip
          sudo curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o /usr/local/bin/yt-dlp
          sudo chmod 0755 /usr/local/bin/yt-dlp
          curl -fsSL "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip" -o /tmp/deno.zip
          sudo unzip -o /tmp/deno.zip -d /usr/local/bin
          sudo chmod 0755 /usr/local/bin/deno
          yt-dlp --version && deno --version | head -1 && ffmpeg -version | head -1

      - name: Install the bgutil yt-dlp plugin
        run: |
          set -euo pipefail
          mkdir -p /tmp/yt-dlp-plugins
          curl -fsSL "https://github.com/Brainicism/bgutil-ytdlp-pot-provider/releases/download/1.3.1/bgutil-ytdlp-pot-provider.zip" -o /tmp/bgutil.zip
          unzip -o /tmp/bgutil.zip -d /tmp/yt-dlp-plugins
          ls -R /tmp/yt-dlp-plugins

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live YouTube transcript test
        env:
          YOUTUBE_LIVE_TEST: '1'
          # Point the shipped buildAntiBotFlags at the plugin + provider, exactly
          # as the self-hosted image's zero-config defaults do.
          VIDEO_INGEST_YTDLP_PLUGIN_DIRS: /tmp/yt-dlp-plugins
          VIDEO_INGEST_POT_PROVIDER_URL: http://127.0.0.1:4416
        run: bun run --filter @tale/platform test -- ytdlp_live

      - name: Summary
        if: always()
        run: echo "## YouTube live ingest test complete" >> "$GITHUB_STEP_SUMMARY"
