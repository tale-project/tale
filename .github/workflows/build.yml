    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (contains(fromJson(needs.changes.outputs.services), 'web') && github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # Keep cold-cache headroom for standalone image builds.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Reclaim disk space if needed
        env:
          MIN_FREE_GIB: '20'
        run: *reclaim-ci-disk

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Setup Docker builder
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          # Hosted runners are discarded; large layer teardown delayed
          # downstream checks by 47–132 seconds in measured builds.
          cleanup: false

      # Keep Compose's build arguments, context, Dockerfile and image tags as
      # the source of truth; only add a persistent layer cache and local load.
      - name: Resolve site build
        env:
          SERVICE: web
        run: |
          set -euo pipefail
          # The existing probe creates this placeholder before Compose too.
          if [ ! -e "services/$SERVICE/.env" ]; then touch "services/$SERVICE/.env"; fi
          docker compose -f "compose.$SERVICE.yml" -f "compose.$SERVICE.test.yml" \
            --env-file .env.test -p "tale-$SERVICE-test" build --print "$SERVICE" \
            > "$RUNNER_TEMP/site-build.json"

      - name: Build site image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: ${{ runner.temp }}/site-build.json
          targets: web
          load: true
          set: |
            *.cache-from=type=gha,scope=web
            *.cache-to=type=gha,scope=web,mode=max,ghtoken=${{ secrets.GITHUB_TOKEN }},repository=${{ github.repository }}
          provenance: false

      - name: Run web container test
        run: bun services/platform/tests/integration/container-web-test.ts
        env:
          SKIP_BUILD: 'true'
          PULL_POLICY: never

      - name: Summary
        if: always()
        run: echo "## tale-web container test complete" >> "$GITHUB_STEP_SUMMARY"

