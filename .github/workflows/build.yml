  # ---------------------------------------------------------------------------
  # Validate container image metadata, healthchecks, entrypoints. Pulls images
  # built by the `build` job from GHCR.
  # Skipped for fork PRs (image-validate-fork covers that). Draft PRs skip.
  # ---------------------------------------------------------------------------
  image-validate:
    name: Validate images
    needs: [changes, build]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.changes.outputs.ci_tests == 'true' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.fork != true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-receipt-*
          path: ${{ runner.temp }}/image-receipts
          merge-multiple: true

      # Pull by the recorded digest and check the revision label, exactly as
      # the smoke test does.
      - name: Pull images from GHCR
        env:
          SOURCE_SHA: ${{ needs.changes.outputs.source_sha }}
          RECEIPTS: ${{ runner.temp }}/image-receipts
        run: |
          set -euo pipefail
          # Compose-stack services + sandbox-runtime. Keep in sync with build.yml
          # (build matrix) and cleanup-pr-images.yml matrix. sandbox-runtime is
          # not a compose service but the spawner pulls it at boot — re-tag it
          # locally so PULL_POLICY=never validation finds it.
          REGISTRY_PATH="${{ env.REGISTRY }}/${{ github.repository }}"
          # Validate all receipts before any background work; a missing or
          # malformed receipt must not be hidden by another successful pull.
          images=()
          for svc in db platform proxy sandbox-llm-gateway sandbox sandbox-egress sandbox-buildkitd sandbox-runtime; do
            DIGEST=$(jq -r '.digest // empty' "${RECEIPTS}/${svc}.json" 2> /dev/null || true)
            if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::No image receipt with a digest for tale-${svc}"; exit 1
            fi
            images+=("${svc}@${DIGEST}")
          done
          pull_image() {
            local svc=$1 digest=$2 image revision
            image="${REGISTRY_PATH}/tale-${svc}@${digest}"
            echo "Pulling ${image}..."
            docker pull "$image"
            revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
            if [ "$revision" != "$SOURCE_SHA" ]; then
              echo "::error::tale-${svc} was built from ${revision}, not ${SOURCE_SHA}"; exit 1
            fi
            docker tag "$image" "ghcr.io/tale-project/tale/tale-${svc}:latest"
          }
          # Three concurrent pulls overlap downloads without flooding the
          # runner's disk. Wait on every PID, including a failed early child.
          pids=()
          failed=false
          for entry in "${images[@]}"; do
            pull_image "${entry%@*}" "${entry#*@}" &
            pids+=("$!")
            if [ "${#pids[@]}" -eq 3 ]; then
              for pid in "${pids[@]}"; do
                if ! wait "$pid"; then failed=true; fi
              done
              [ "$failed" = false ] || exit 1
              pids=()
            fi
          done
          # Bash 3.2 treats an empty array as unset under nounset. Exact
          # batches already joined every child and leave nothing to wait for.
          if [ "${#pids[@]}" -gt 0 ]; then
            for pid in "${pids[@]}"; do
              if ! wait "$pid"; then failed=true; fi
            done
          fi
          [ "$failed" = false ] || exit 1
          # The spawner reads SANDBOX_RUNTIME_IMAGE which defaults to
          # `tale-sandbox-runtime:latest` (unscoped). Mirror the tag so the
          # spawner's boot-time `ensureImage` hits a local cache instead of
          # trying to pull from GHCR.
          docker tag "ghcr.io/tale-project/tale/tale-sandbox-runtime:latest" \
            "tale-sandbox-runtime:latest"

      # Runtime conformance imports workspace schemas and the exec builder.
      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          start-turbo-cache: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          turbo-cache: 'false'

      - name: Run image validation
        run: bun services/platform/tests/integration/container-image-test.ts
        env:
          SKIP_BUILD: 'true'
          PULL_POLICY: never

      - name: Validate sandbox runtime behavior
        run: bun services/platform/tests/integration/container-sandbox-runtime-test.ts
        env:
          SKIP_BUILD: 'true'
          IMAGE: tale-sandbox-runtime:latest

      - name: Summary
        if: always()
        run: echo "## Image validation complete" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Fork-PR image-validate fallback: builds locally (no GHCR pull).
  # ---------------------------------------------------------------------------
  image-validate-fork:
    name: Validate images (fork PR)
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.ci_tests == 'true' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.fork == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      # The fork lane runs the same workspace-dependent conformance helpers.
      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          start-turbo-cache: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          turbo-cache: 'false'

      - name: Run image validation (local build)
        run: bun services/platform/tests/integration/container-image-test.ts

      - name: Validate sandbox runtime behavior
        run: bun services/platform/tests/integration/container-sandbox-runtime-test.ts
        env:
          SKIP_BUILD: 'true'
          IMAGE: tale-sandbox-runtime:latest

      - name: Summary
        if: always()
        run: echo "## Image validation (fork PR) complete" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Trivy vulnerability scan per changed service (non-blocking).
  # Runs on push-to-main and on non-fork PRs (fork PRs can't push images, so
  # there's nothing to pull and scan). Without the PR run, GHAS's aggregated
  # "Code scanning results / Trivy" check flags `8 configurations not found`
  # because the per-image SARIF categories declared by `main` never report
  # back on PRs.
  # Reuses the image built and pushed by the `build` job instead of rebuilding.
  # ---------------------------------------------------------------------------
  vulnerability-scan:
    name: Scan ${{ matrix.service }}
    needs: [changes, build]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.changes.outputs.scannable_services != '[]' && github.event.pull_request.head.repo.fork != true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.scannable_services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service }}:${{ needs.changes.outputs.image_tag }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service }}:${{ needs.changes.outputs.image_tag }}
          format: 'sarif'
          output: '${{ matrix.service }}-trivy.sarif'
          severity: 'HIGH,CRITICAL'
          trivyignores: '.trivyignore.yaml'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        if: always() && hashFiles(format('{0}-trivy.sarif', matrix.service)) != ''
        with:
          sarif_file: '${{ matrix.service }}-trivy.sarif'
          category: 'trivy-${{ matrix.service }}'

      # Software Bill of Materials for supply-chain transparency. Reuses the
      # already-pulled image; Trivy is already a dependency, so no new tool.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service }}:${{ needs.changes.outputs.image_tag }}
          format: 'cyclonedx'
          output: '${{ matrix.service }}-sbom.cdx.json'

      - name: Upload SBOM
        if: always() && hashFiles(format('{0}-sbom.cdx.json', matrix.service)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.service }}
          path: '${{ matrix.service }}-sbom.cdx.json'
          retention-days: 14
          if-no-files-found: ignore

      - name: Note missing SARIF
        if: always() && hashFiles(format('{0}-trivy.sarif', matrix.service)) == ''
        run: |
          {
            echo "## ⚠ Trivy did not produce SARIF for ${{ matrix.service }}"
            echo ""
            echo "Scan likely failed before writing output. Check earlier step logs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.service }} vulnerability scan complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Results uploaded to the Security tab (when SARIF is present)." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Storybook static build — fires when the platform service or shared UI
  # packages (which house the bulk of stories) change. Draft PRs skip.
  # ---------------------------------------------------------------------------
  storybook:
    name: Storybook
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.storybook == 'true' && github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    # A cold build of all four Storybooks (web/docs/ui/platform) on a 2vCPU
    # runner lands right at 5m, so any packages/ui change that misses the Turbo
    # cache flakily times out. Give the cold path headroom.
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          start-turbo-cache: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Storybook
        run: bunx turbo run storybook:build

  # ---------------------------------------------------------------------------
  # Release candidate gate — the verdict the release lane reads before it tags
  # (.github/RELEASING.md). Candidate runs only; it runs after every job it
  # needs whatever their result, and passes only if each one succeeded against
  # the pinned SHA: a skipped or cancelled job fails the gate, it never passes
  # by omission. Its receipt names the source, this run and the digest of
  # every image the smoke test and the image validation pulled. Fork-PR jobs
  # never run for a candidate, and the advisory scan is not one of its checks.
  # ---------------------------------------------------------------------------
  candidate-gate:
    name: Candidate gate
    needs:
      - candidate-source
      - changes
      - build
      - smoke-test
      - image-validate
      - web-test
      - docs-test
      - ui-docs-test
      - ai-gateway-test
      - storybook
    if: always() && needs.changes.outputs.candidate_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      # A build that failed uploads no receipt; the next step names the gap.
      - name: Download image receipts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-receipt-*
          path: ${{ runner.temp }}/image-receipts
          merge-multiple: true

      - name: Judge the candidate
        env:
          CANDIDATE_SHA: ${{ needs.changes.outputs.candidate_sha }}
          IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RECEIPTS: ${{ runner.temp }}/image-receipts
        run: |
          set -euo pipefail
          verdict=passed
          JOBS=$(jq -c 'with_entries(.value = .value.result)' <<< "$NEEDS")
          while IFS=$'\t' read -r job result; do
            if [ "$result" != success ]; then
              echo "::error::${job} did not succeed for release candidate ${CANDIDATE_SHA} (${result})"
              verdict=failed
            fi
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value)"' <<< "$JOBS")
          # The build matrix; keep in sync with it (deployment-ci.test.ts).
          IMAGES='[]'
          for svc in db platform proxy sandbox-llm-gateway sandbox sandbox-egress sandbox-buildkitd sandbox-runtime; do
            if ! ENTRY=$(jq -ce --arg service "$svc" --arg revision "$CANDIDATE_SHA" --arg tag "$IMAGE_TAG" \
              'select(.service == $service and .revision == $revision and .tag == $tag and (.digest | test("^sha256:[a-f0-9]{64}$")))' \
              "${RECEIPTS}/${svc}.json" 2> /dev/null); then
              echo "::error::No image receipt of tale-${svc} built from ${CANDIDATE_SHA}"
              verdict=failed
              continue
            fi
            IMAGES=$(jq -c --argjson entry "$ENTRY" '. + [$entry]' <<< "$IMAGES")
          done
          jq -n --arg candidate "$CANDIDATE_SHA" --arg verdict "$verdict" \
            --argjson jobs "$JOBS" --argjson images "$IMAGES" \
            --arg id "$RUN_ID" --arg attempt "$RUN_ATTEMPT" --arg url "$RUN_URL" \
            --arg event "$EVENT_NAME" --arg workflow "$WORKFLOW_SHA" \
            --arg ref "$DISPATCH_REF" --arg sha "$DISPATCH_SHA" \
            '{schemaVersion: 1, workflow: ".github/workflows/build.yml", candidate: $candidate, verdict: $verdict,
              run: {id: $id, attempt: $attempt, url: $url, event: $event, workflowSha: $workflow, ref: $ref, sha: $sha},
              jobs: $jobs, images: $images}' > release-candidate.json
          {
            echo "## Release candidate \`${CANDIDATE_SHA}\`: ${verdict}"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value) |"' <<< "$JOBS"
            echo ""
            echo "| Image | Digest |"
            echo "| --- | --- |"
            jq -r '.[] | "| \(.image) | `\(.digest)` |"' <<< "$IMAGES"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$verdict" = passed ]

      - name: Upload candidate receipt
        if: always() && hashFiles('release-candidate.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-build-${{ needs.changes.outputs.candidate_sha }}-attempt-${{ github.run_attempt }}
          path: release-candidate.json
          retention-days: 90
          overwrite: true
