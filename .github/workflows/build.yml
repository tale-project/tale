name: Build

# Jobs use the default actions/checkout (fetch-depth: 1). If a Dockerfile
# starts to need git history (e.g. `git describe --tags`), bump fetch-depth
# on that job's checkout AND pass the version/ref via build-args from the
# workflow rather than reading `.git` from inside the build context.

# A release candidate (.github/RELEASING.md) is one full commit SHA on main
# that a release is meant to ship. A maintainer dispatches it from the Actions
# tab or with `gh workflow run build.yml -f candidate_sha=<sha>`; a token that
# may push but not dispatch workflows sends a `release-candidate` repository
# dispatch with `client_payload.candidate_sha`. Either one runs this file from
# main against that SHA: every job checks it out, every check runs whatever
# its last commit touched, and the Candidate gate at the end is the verdict
# the release lane reads before it tags.
run-name: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && format('Release candidate {0}', inputs.candidate_sha || github.event.client_payload.candidate_sha) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'packages/**'
      - 'configs/platform/**'
      - 'patches/**'
      - 'tools/**/package.json'
      - 'docs/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/pull-ci-images.sh'
      - 'tools/cli/scripts/check-sbom-hashes.ts'
      - '.github/actions/setup-turbo/**'
      - 'compose*.yml'
      - 'services/platform/tests/integration/container-*'
      - 'services/platform/tests/integration/static-site-test.ts'
      - 'services/platform/tests/integration/lib/**'
      - '.env.test'
      - 'bunfig.toml'
      - 'tsconfig*.json'
      - 'turbo.json'
      - '.dockerignore'
      - 'package.json'
      - 'bun.lock'
  merge_group:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Release candidate: the full 40-character commit SHA on main to validate'
        required: true
        type: string
  repository_dispatch:
    types: [release-candidate]

# Main pushes keep one running Build and coalesce newer pushes into the pending
# slot. Let the running build finish publishing the shared main layer cache;
# otherwise frequent merges can keep every PR rebuilding unchanged images.
# Pull requests and merge groups still cancel superseded runs. A release
# candidate gets a group of its own, keyed by its
# SHA and never cancelled — a merge to main must not starve it (#3951), and a
# second dispatch of the same SHA waits behind the first instead of replacing
# it.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && format('candidate-{0}', inputs.candidate_sha || github.event.client_payload.candidate_sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'repository_dispatch' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  REGISTRY: ghcr.io

jobs:
  pr-scope:
    name: PR scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
      full: ${{ steps.scope.outputs.full }}
      changes: ${{ steps.scope.outputs.changes }}
      ci_tests: ${{ steps.scope.outputs.ci_tests }}
      storybook: ${{ steps.scope.outputs.storybook }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Decide applicability
        id: scope
        uses: ./.github/actions/ci-scope
        with:
          filter: build

  # Only candidates need remote source validation; ordinary jobs keep their event SHA.
  candidate-source:
    if: >-
      github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    name: Candidate source
    uses: ./.github/workflows/release-candidate-source.yml
    permissions:
      contents: read
    with:
      candidate: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
      candidate_sha: ${{ inputs.candidate_sha || github.event.client_payload.candidate_sha }}

  # ---------------------------------------------------------------------------
  # Discover which services changed so matrix jobs only run for them.
  # ---------------------------------------------------------------------------
  changes:
    if: >-
      !cancelled() &&
      (((github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') &&
      needs.candidate-source.result == 'success') ||
      ((github.event_name != 'repository_dispatch' && github.event_name != 'workflow_dispatch') &&
      needs.candidate-source.result == 'skipped')) &&
      (github.event_name != 'pull_request' ||
      (needs.pr-scope.result == 'success' && needs.pr-scope.outputs.run == 'true'))
    needs: [candidate-source, pr-scope]
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.services.outputs.list }}
      scannable_services: ${{ steps.services.outputs.scannable }}
      ci_tests: ${{ steps.services.outputs.ci_tests }}
      stack: ${{ steps.services.outputs.stack }}
      storybook: ${{ steps.services.outputs.storybook }}
      image_tag: ${{ steps.tag.outputs.value }}
      # The commit every job builds and tests. `candidate_sha` is that same
      # commit in a release-candidate run and empty otherwise, so a checkout
      # given it as `ref` keeps its event's default everywhere else.
      source_sha: ${{ needs.candidate-source.outputs.sha || github.sha }}
      candidate_sha: ${{ needs.candidate-source.outputs.candidate_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}

      - name: Filter paths
        if: needs.candidate-source.outputs.candidate_sha == '' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.pr-scope.outputs.full != 'true'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: .github/ci-scope.yml

      - name: Compute service matrix
        id: services
        env:
          CANDIDATE_SHA: ${{ needs.candidate-source.outputs.candidate_sha }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_SCOPE: ${{ needs.pr-scope.outputs.full }}
          PR_CHANGES: ${{ needs.pr-scope.outputs.changes }}
          PR_CI_TESTS: ${{ needs.pr-scope.outputs.ci_tests }}
          PR_STORYBOOK: ${{ needs.pr-scope.outputs.storybook }}
          CHANGES: ${{ steps.filter.outputs.changes }}
          CI_TESTS: ${{ steps.filter.outputs.build_ci_tests }}
          STORYBOOK: ${{ steps.filter.outputs.build_storybook }}
          IMAGE_INPUTS: ${{ steps.filter.outputs.build_image_inputs }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ] && [ "$FULL_SCOPE" != true ]; then
            # This decision was validated once against the frozen PR event.
            # Never query the mutable PR files again after waiting in the queue.
            CHANGES="$PR_CHANGES"
            CI_TESTS="$PR_CI_TESTS"
            STORYBOOK="$PR_STORYBOOK"
            IMAGE_INPUTS=false
          elif [ -n "$CHANGES" ]; then
            CHANGES=$(jq -ce '[.[] | select(startswith("build_")) | ltrimstr("build_")]' <<< "$CHANGES")
          fi
          if [ -n "$CANDIDATE_SHA" ] || [ "$EVENT_NAME" = merge_group ] || [ "$FULL_SCOPE" = true ]; then
            # Candidates, merge groups, conservative scope and shared build
            # inputs run every service and test. A skipped candidate check
            # never passed; shared dependencies can alter every Dockerfile.
            CHANGES='["platform","db","proxy","sandbox-llm-gateway","web","docs","ui-docs","ai-gateway","storybook","sandbox","sandbox-egress","sandbox-buildkitd","sandbox-runtime","ci_tests","image_inputs"]'
            CI_TESTS=true
            STORYBOOK=true
          elif [ "${IMAGE_INPUTS:-false}" = true ]; then
            CHANGES=$(jq -c '. + ["platform","db","proxy","sandbox-llm-gateway","web","docs","ui-docs","ai-gateway","storybook","sandbox","sandbox-egress","sandbox-buildkitd","sandbox-runtime"] | unique' <<< "$CHANGES")
            CI_TESTS=true
            STORYBOOK=true
          fi
          # Strip pseudo-filters that aren't real services from the matrix list.
          SERVICES=$(jq -c '[.[] | select(. != "ci_tests" and . != "storybook" and . != "image_inputs")]' <<< "$CHANGES")
          echo "list=${SERVICES}" >> "$GITHUB_OUTPUT"
          echo "Services to build: ${SERVICES}"
          # Standalone sites have their own tests and need no platform stack.
          STACK=$(jq -r 'any(.[]; . == "db" or . == "platform" or . == "proxy" or . == "sandbox-llm-gateway" or . == "sandbox" or . == "sandbox-egress" or . == "sandbox-buildkitd" or . == "sandbox-runtime")' <<< "$SERVICES")
          if [ "$CI_TESTS" = true ]; then STACK=true; fi

          # Vulnerability scan covers the compose-stack services + sandbox
          # trio that `build` actually pushes to GHCR. Web, docs and ui-docs
          # use their own compose stacks and are reachable via security.yml's
          # filesystem scan. A release candidate is not scanned here: the scan
          # is advisory, and its SARIF would be filed against main's head, not
          # against the candidate.
          SCANNABLE=$(jq -c '[.[] | select(. == "db" or . == "platform" or . == "proxy" or . == "sandbox-llm-gateway" or . == "sandbox" or . == "sandbox-egress" or . == "sandbox-buildkitd" or . == "sandbox-runtime")]' <<< "$SERVICES")
          if [ -n "$CANDIDATE_SHA" ]; then SCANNABLE='[]'; fi
          {
            echo "scannable=${SCANNABLE}"
            echo "ci_tests=${CI_TESTS}"
            echo "stack=${STACK}"
            echo "storybook=${STORYBOOK}"
          } >> "$GITHUB_OUTPUT"
          echo "Services to scan: ${SCANNABLE}"

      # CI image tag shared across build/smoke/validate/scan jobs. PR runs use
      # `pr-{n}-sha-{fullsha}` so every source commit has an unambiguous tag that
      # cleanup-pr-images.yml can wipe by prefix when the PR closes. Pushes to
      # main and merge-queue runs lack a PR number and fall back to `sha-…`. A
      # release candidate's images are `candidate-sha-{fullsha}`: only its own
      # runs write that tag, and its jobs pull the recorded digests anyway.
      - name: Compute image tag
        id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_SHA: ${{ needs.candidate-source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Image source must be a full commit SHA'; exit 1
          fi
          if [ -n "${CANDIDATE_SHA:-}" ]; then
            if [[ ! "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo '::error::Image source must be a full commit SHA'; exit 1
            fi
            echo "value=candidate-sha-${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"
          elif [ -n "$PR_NUMBER" ]; then
            if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo '::error::Pull request number must contain only digits'; exit 1
            fi
            echo "value=pr-${PR_NUMBER}-sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build each compose-stack service's Docker image and push to GHCR.
  #
  # Standalone-only edits use their own container jobs. When compose services
  # or their test inputs change, the matrix is intentionally fixed:
  # smoke-test and image-validate need ALL compose-stack services available, so
  # building only changed ones would force them back into local-build mode.
  # Unchanged services can reuse the main branch's GHA layer cache when it is
  # available. A missing or evicted cache still requires a complete build.
  #
  # Web/docs/ui-docs are NOT in this matrix — they have their own compose
  # stacks and are exercised by the separate web-test / docs-test /
  # ui-docs-test jobs below.
  #
  # Fork PRs cannot push to upstream GHCR. Their smoke-test-fork and
  # image-validate-fork jobs build locally on the runners that use the images;
  # loading eight additional matrix images into unrelated runners wastes work.
  #
  # Draft PRs skip to save minutes.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.service }}
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.stack == 'true' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.fork != true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Compose-stack services. Keep in sync with build.yml (smoke/validate
        # pull loops) and cleanup-pr-images.yml matrix.
        service:
          [
            db,
            platform,
            proxy,
            sandbox-llm-gateway,
            sandbox,
            sandbox-egress,
            sandbox-buildkitd,
            sandbox-runtime,
          ]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Reclaim disk space
        if: matrix.service == 'platform' || matrix.service == 'sandbox-runtime'
        # The pulled stack occupies roughly 12–13GB locally. Builders also
        # retain dependency snapshots and compressed exports; keep 40GiB.
        env:
          MIN_FREE_GIB: '40'
        run: &reclaim-ci-disk |
          set -euo pipefail
          case "$MIN_FREE_GIB" in
            20|28|40) ;;
            *) echo '::error::Invalid CI disk target'; exit 1 ;;
          esac
          MIN_FREE_KB=$((MIN_FREE_GIB * 1024 * 1024))
          measure_space() {
            df -h /
            AVAILABLE_KB=$(df -Pk / | awk 'NR == 2 { print $4 }')
            if [[ ! "$AVAILABLE_KB" =~ ^[0-9]+$ ]]; then
              echo '::error::Could not measure free disk space'; exit 1
            fi
            echo "Available: ${AVAILABLE_KB} KiB; cleanup target: ${MIN_FREE_GIB} GiB"
          }
          measure_space
          if [ "$AVAILABLE_KB" -ge "$MIN_FREE_KB" ]; then exit 0; fi
          # Stop once the next build/pull has headroom. Deleting all installed
          # toolchains took 50–119s even when the image build was cached.
          for DIRECTORY in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            sudo rm -rf -- "$DIRECTORY"
            measure_space
            if [ "$AVAILABLE_KB" -ge "$MIN_FREE_KB" ]; then exit 0; fi
          done
          sudo docker image prune -af
          measure_space
          # Preserve the old cold-build fallback after exhausting its cleanup.
          # The target controls when to stop deleting; it is not a runner quota.
          if [ "$AVAILABLE_KB" -lt "$MIN_FREE_KB" ]; then
            echo '::warning::Full CI disk cleanup completed below the headroom target'
          fi

      - name: Setup Docker builder
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          # Hosted runners are discarded; large layer teardown delayed
          # downstream checks by 47–132 seconds in measured builds.
          cleanup: false

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The revision label names the commit the image was built from: the
      # checkout, which a release candidate pins to its own SHA rather than
      # the dispatched ref's head.
      - name: Resolve build metadata
        id: meta
        env:
          SOURCE_SHA: ${{ needs.changes.outputs.source_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Checked out ${HEAD_SHA}, expected ${SOURCE_SHA}"; exit 1
          fi
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "revision=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      # Fail the build (not just the separate test job) on a broken builtin
      # config catalog — build.yml and test.yml otherwise run independently,
      # so a bad builtin JSON could still ship in the image. Platform-only:
      # other matrix services have no builtin-configs catalog to validate.
      - name: Setup toolchain
        if: matrix.service == 'platform'
        uses: ./.github/actions/setup-turbo
        with:
          start-turbo-cache: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          turbo-cache: 'false'

      - name: Validate builtin configs
        if: matrix.service == 'platform'
        run: bun run --filter @tale/platform configs:validate

      # `provenance: false` avoids GHCR's "unknown/unknown" attestation manifest
      # for single-platform images (docker/build-push-action#820). The cleanup
      # workflow's tag-prefix filter assumes single-manifest tags — re-enabling
      # provenance would require widening that filter (see N2 in cleanup file).
      - name: Build and push
        id: image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service }}:${{ needs.changes.outputs.image_tag }}
          build-args: |
            VERSION=${{ needs.changes.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          # Publish the large shared stack cache only from main. PR-local
          # exports took 148s and cannot seed other PRs; old candidates must
          # not overwrite the current main cache.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=gha,scope={0},mode=max,ghtoken={1},repository={2}', matrix.service, secrets.GITHUB_TOKEN, github.repository) || '' }}
          # `labels:` replaces Dockerfile LABEL (not merges). Include version
          # so `tale` can read the running image the same way it does on
          # release tags — see get-container-version.ts.
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.changes.outputs.image_tag }}
          provenance: false

      # One receipt per pushed image: the digest this run pushed and the
      # commit it was built from. The smoke test, the image validation and the
      # candidate gate read these, so they test and name the exact bytes built
      # here, never whatever a tag points at by the time they pull it.
      - name: Record image receipt
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service }}
          TAG: ${{ needs.changes.outputs.image_tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.meta.outputs.revision }}
          RECEIPTS: ${{ runner.temp }}/image-receipts
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::The build of tale-${SERVICE} reported no image digest"; exit 1
          fi
          mkdir -p "$RECEIPTS"
          jq -n --arg service "$SERVICE" --arg image "$IMAGE" --arg tag "$TAG" \
            --arg digest "$DIGEST" --arg revision "$REVISION" \
            '{service: $service, image: $image, tag: $tag, digest: $digest, revision: $revision}' \
            > "${RECEIPTS}/${SERVICE}.json"

      - name: Upload image receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-receipt-${{ matrix.service }}
          path: ${{ runner.temp }}/image-receipts/${{ matrix.service }}.json
          # Re-running failed jobs reuses the receipts of the images that built.
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: Summary
        if: success()
        run: |
          {
            echo "## Built tale-${{ matrix.service }}"
            echo ""
            echo "Pushed: \`${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service }}:${{ needs.changes.outputs.image_tag }}\`"
            echo "Digest: \`${{ steps.image.outputs.digest }}\`"
            echo "Source: \`${{ steps.meta.outputs.revision }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## ❌ Build failed for tale-${{ matrix.service }}"
            echo ""
            echo "Attempted tag: \`${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service }}:${{ needs.changes.outputs.image_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Run container smoke tests via docker compose. Pulls images built by the
  # `build` job from GHCR instead of rebuilding locally.
  # Skipped for fork PRs (smoke-test-fork covers that path). Draft PRs skip.
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke test
    needs: [changes, build]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.changes.outputs.stack == 'true' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.fork != true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Checkout CI image pull helper
        if: needs.changes.outputs.candidate_sha != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Candidate C can predate the helper. Use only this trusted workflow
          # file from exact H, isolated from C's source and image receipts.
          ref: ${{ github.workflow_sha }}
          path: .ci-workflow
          persist-credentials: false
          sparse-checkout: .github/scripts/pull-ci-images.sh
          sparse-checkout-cone-mode: false

      - name: Reclaim disk space
        env:
          MIN_FREE_GIB: '28'
        run: *reclaim-ci-disk

      - name: Log Docker environment
        run: |
          docker version
          docker compose version
          df -h /
          free -h

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-receipt-*
          path: ${{ runner.temp }}/image-receipts
          merge-multiple: true

      # Pull each service image by the digest the build job recorded and
      # re-tag it locally as `:latest`. compose.yml resolves
      # `${VERSION:-latest}`; with PULL_POLICY=never the smoke script will use
      # these local images verbatim and skip its own `docker compose build`
      # step. An image whose revision label is not this run's source fails
      # the pull.
      - name: Pull images from GHCR
        env:
          PULL_HELPER: ${{ needs.changes.outputs.candidate_sha != '' && '.ci-workflow/.github/scripts/pull-ci-images.sh' || '.github/scripts/pull-ci-images.sh' }}
          REGISTRY_PATH: ${{ env.REGISTRY }}/${{ github.repository }}
          SOURCE_SHA: ${{ needs.changes.outputs.source_sha }}
          RECEIPTS: ${{ runner.temp }}/image-receipts
        run: &pull-ci-images |
          bash "$PULL_HELPER" \
            db platform proxy sandbox-llm-gateway sandbox sandbox-egress sandbox-buildkitd sandbox-runtime

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Run smoke tests
        run: bun services/platform/tests/integration/container-smoke-test.ts
        env:
          SMOKE_TEST_TIMEOUT: 300
          SKIP_BUILD: 'true'
          PULL_POLICY: never

      - name: Dump container logs on failure
        if: failure()
        run: |
          cd "${{ github.workspace }}"
          {
            echo "## Container Logs (on failure)"
            echo ""
            echo "<details><summary>compose logs (last 300 lines per service)</summary>"
            echo ""
            echo '```'
            docker compose -f compose.yml -f compose.test.yml --env-file .env.test -p tale-test logs --tail=300 2>&1 || true
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>compose ps -a</summary>"
            echo ""
            echo '```'
            docker compose -f compose.yml -f compose.test.yml --env-file .env.test -p tale-test ps -a 2>&1 || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: echo "## Smoke tests complete" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Fork-PR smoke test fallback: builds locally (no GHCR push) since fork
  # GITHUB_TOKEN is read-only. Mirrors the pre-refactor workflow shape.
  # ---------------------------------------------------------------------------
  smoke-test-fork:
    name: Smoke test (fork PR)
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.stack == 'true' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.fork == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Reclaim disk space
        env:
          MIN_FREE_GIB: '40'
        run: *reclaim-ci-disk

      - name: Log Docker environment
        run: |
          docker version
          docker compose version
          df -h /
          free -h

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Run smoke tests (local build)
        run: bun services/platform/tests/integration/container-smoke-test.ts
        env:
          SMOKE_TEST_TIMEOUT: 300

      - name: Dump container logs on failure
        if: failure()
        run: |
          cd "${{ github.workspace }}"
          {
            echo "## Container Logs (on failure, fork PR)"
            echo ""
            echo "<details><summary>compose logs (last 300 lines per service)</summary>"
            echo ""
            echo '```'
            docker compose -f compose.yml -f compose.test.yml --env-file .env.test -p tale-test logs --tail=300 2>&1 || true
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>compose ps -a</summary>"
            echo ""
            echo '```'
            docker compose -f compose.yml -f compose.test.yml --env-file .env.test -p tale-test ps -a 2>&1 || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: echo "## Smoke tests (fork PR) complete" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
