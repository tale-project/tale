        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Reclaim disk space
        run: |
          # Keep 20 GiB for a cold standalone build. Skip expensive toolchain
          # removal only when the runner already has that headroom.
          available_kib=$(df -Pk / | awk 'NR == 2 { print $4 }')
          echo "Available disk before static build: ${available_kib} KiB"
          if [ "$available_kib" -lt 20971520 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune -af
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
