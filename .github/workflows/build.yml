  ui-docs-test:
    name: UI docs container test
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (contains(fromJson(needs.changes.outputs.services), 'ui-docs') && github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    permissions:
