name: Load

# Manually triggered and never part of the merge gate: one profile of the
# load harness (tools/load) against a self-contained stack on the runner —
# tale-db and the object store as containers, N api and M worker processes of
# the platform from this checkout, and the realistic mock model provider.
#
# A hosted runner has four cores shared by the generator, the platform and
# the database, so its numbers say whether a change moved the platform's
# cost per user, not what a production host holds. A distributed run against
# a real deployment (many generators, one shard each, `merge` at the end) is
# described in tools/load/README.md.
#
# The agent-burst profile asks what such a host holds instead: a hosted
# runner is the 4 vCPU / 16 GB host of #3977. It adds the sandbox control
# plane built from this checkout (the spawner, its egress proxy and the LLM
# gateway, beside the host's api as `bun dev` runs them), starts 12 agent runs
# across 7 agents within 30 s whose turns each hold 2 GiB and a CPU, and fails
# when the host or the platform did not hold the burst (tools/load/README.md,
# "Agent burst"). The users, ramp, hold and think inputs do not apply to it.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Load profile
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - soak
          - connections
          - signin-storm
          - agent-burst
        default: smoke
      users:
        description: Peak concurrent virtual users
        type: string
        default: '200'
      ramp_seconds:
        description: Seconds to reach the peak
        type: string
        default: '60'
      hold_seconds:
        description: Seconds to hold the peak (each stress step)
        type: string
        default: '180'
      api_processes:
        description: Platform api processes
        type: string
        default: '2'
      worker_processes:
        description: Platform worker processes
        type: string
        default: '1'
      think_scale:
        description: Multiply every think time (1 = human pace)
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load:
    name: Load (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      LOAD_DB_PASSWORD: tale_load_ci
      LOAD_S3_ACCESS_KEY: tale-load
      LOAD_S3_SECRET_KEY: tale_load_object_store
      PROFILE: ${{ inputs.profile }}
      USERS: ${{ inputs.users }}
      RAMP_SECONDS: ${{ inputs.ramp_seconds }}
      HOLD_SECONDS: ${{ inputs.hold_seconds }}
      API_PROCESSES: ${{ inputs.api_processes }}
      WORKER_PROCESSES: ${{ inputs.worker_processes }}
      THINK_SCALE: ${{ inputs.think_scale }}
      # The agent-burst profile's first api listens where the sandbox relay
      # forwards (compose.dev.yml's backend-relay), on every interface so the
      # relay and the LLM gateway reach it and the mock from their bridges.
      BASE_PORT: ${{ inputs.profile == 'agent-burst' && '3005' || '4105' }}
      LISTEN_HOST: ${{ inputs.profile == 'agent-burst' && '0.0.0.0' || '127.0.0.1' }}

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          for pair in "users:$USERS" "ramp_seconds:$RAMP_SECONDS" "hold_seconds:$HOLD_SECONDS" \
            "api_processes:$API_PROCESSES" "worker_processes:$WORKER_PROCESSES"; do
            value="${pair#*:}"
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "::error::${pair%%:*} must be a whole number, got '${value}'"; exit 1
            fi
          done
          if [[ ! "$THINK_SCALE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::think_scale must be a number, got '${THINK_SCALE}'"; exit 1
          fi
          if [ "$API_PROCESSES" -lt 1 ] || [ "$API_PROCESSES" -gt 8 ]; then
            echo '::error::api_processes must be 1-8 on a hosted runner'; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # The agent-burst profile builds the sandbox images, the session
      # runtime among them, which needs the room Build's runtime build does.
      - name: Reclaim disk space
        if: env.PROFILE == 'agent-burst'
        env:
          MIN_FREE_GIB: '40'
        run: |
          set -euo pipefail
          case "$MIN_FREE_GIB" in
            20|28|40) ;;
            *) echo '::error::Invalid CI disk target'; exit 1 ;;
          esac
          MIN_FREE_KB=$((MIN_FREE_GIB * 1024 * 1024))
          measure_space() {
            df -h /
            AVAILABLE_KB=$(df -Pk / | awk 'NR == 2 { print $4 }')
            if [[ ! "$AVAILABLE_KB" =~ ^[0-9]+$ ]]; then
              echo '::error::Could not measure free disk space'; exit 1
            fi
            echo "Available: ${AVAILABLE_KB} KiB; cleanup target: ${MIN_FREE_GIB} GiB"
          }
          measure_space
          if [ "$AVAILABLE_KB" -ge "$MIN_FREE_KB" ]; then exit 0; fi
          # Stop once the next build/pull has headroom. Deleting all installed
          # toolchains took 50–119s even when the image build was cached.
          for DIRECTORY in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            sudo rm -rf -- "$DIRECTORY"
            measure_space
            if [ "$AVAILABLE_KB" -ge "$MIN_FREE_KB" ]; then exit 0; fi
          done
          # Run as the job's user, like its Docker steps: sudo resets the
          # environment and would lose a self-hosted runner's DOCKER_HOST.
          docker image prune -af
          measure_space
          # Preserve the old cold-build fallback after exhausting its cleanup.
          # The target controls when to stop deleting; it is not a runner quota.
          if [ "$AVAILABLE_KB" -lt "$MIN_FREE_KB" ]; then
            echo '::warning::Full CI disk cleanup completed below the headroom target'
          fi

      - name: Setup toolchain
        id: toolchain
        uses: ./.github/actions/setup-turbo
        with:
          start-turbo-cache: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          turbo-cache: 'false'

      # Thousands of open streams need descriptors, a listen backlog that
      # absorbs a ramp's connect bursts, and ephemeral ports beyond the
      # default 28k.
      - name: Raise network limits
        run: |
          set -euo pipefail
          sudo sysctl -w net.core.somaxconn=8192 net.ipv4.tcp_max_syn_backlog=8192 \
            net.ipv4.ip_local_port_range='10000 65000' net.ipv4.tcp_tw_reuse=1
          echo "nofile: $(ulimit -n) -> $(ulimit -Hn)"

      - name: Setup Docker builder
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          cleanup: false

      # Build's own layer cache (scope `db`) is read, never written.
      - name: Build tale-db from services/db
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/db/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: tale-db:load
          cache-from: type=gha,scope=db
          provenance: false

      # The agent-burst profile's sandbox images, from this checkout and from
      # the caches Build reads (an unreadable one only costs time), tagged as
      # compose.yml names them at VERSION=load and the runtime as the spawner
      # starts it.
      - name: Build the sandbox spawner
        if: env.PROFILE == 'agent-burst'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/sandbox/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/tale-project/tale/tale-sandbox:load
          build-args: VERSION=load
          cache-from: |
            type=gha,scope=sandbox
            type=registry,ref=ghcr.io/tale-project/tale/tale-sandbox-buildcache:amd64
          provenance: false

      - name: Build the sandbox egress proxy
        if: env.PROFILE == 'agent-burst'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/sandbox-egress/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/tale-project/tale/tale-sandbox-egress:load
          build-args: VERSION=load
          cache-from: |
            type=gha,scope=sandbox-egress
            type=registry,ref=ghcr.io/tale-project/tale/tale-sandbox-egress-buildcache:amd64
          provenance: false

      - name: Build the sandbox LLM gateway
        if: env.PROFILE == 'agent-burst'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/sandbox-llm-gateway/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/tale-project/tale/tale-sandbox-llm-gateway:load
          build-args: VERSION=load
          cache-from: |
            type=gha,scope=sandbox-llm-gateway
            type=registry,ref=ghcr.io/tale-project/tale/tale-sandbox-llm-gateway-buildcache:amd64
          provenance: false

      - name: Build the sandbox runtime
        if: env.PROFILE == 'agent-burst'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/sandbox-runtime/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: tale-sandbox-runtime:latest
          build-args: VERSION=load
          cache-from: |
            type=gha,scope=sandbox-runtime
            type=registry,ref=ghcr.io/tale-project/tale/tale-sandbox-runtime-buildcache:amd64
          provenance: false

      - name: Resolve the object-store pin
        id: object-store
        run: |
          set -euo pipefail
          image=$(bun -e "import { THIRD_PARTY_IMAGES } from './tools/cli/src/lib/compose/types.ts'; console.log(THIRD_PARTY_IMAGES['object-store'])")
          if [ -z "$image" ]; then
            echo '::error::THIRD_PARTY_IMAGES names no object-store image'; exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Start tale-db and the object store
        env:
          OBJECT_STORE_IMAGE: ${{ steps.object-store.outputs.image }}
        run: |
          set -euo pipefail
          docker run -d --name tale-load-db --shm-size 1g -p 127.0.0.1:5432:5432 \
            -e DB_PASSWORD="$LOAD_DB_PASSWORD" -e DB_MAX_CONNECTIONS=400 \
            -e DB_SHARED_BUFFERS=1GB -e DB_EFFECTIVE_CACHE_SIZE=4GB tale-db:load
          docker run -d --name tale-load-object-store -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$LOAD_S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$LOAD_S3_SECRET_KEY" \
            -e MINIO_BROWSER=off "$OBJECT_STORE_IMAGE" server /data --address ':9000'
          for _ in $(seq 1 90); do
            if docker exec tale-load-db test -f /tmp/.db_ready; then break; fi
            sleep 2
          done
          docker exec tale-load-db test -f /tmp/.db_ready || { echo '::error::tale-db never became ready'; exit 1; }
          for _ in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 -sf -o /dev/null http://127.0.0.1:9000/minio/health/ready; then break; fi
            sleep 1
          done

      # What the agent-burst stack needs of its host, as `tale` and `bun dev`
      # prepare one. Swap goes off: the burst judges whether the host's memory
      # held, and the runner's swap file would turn a shortage into slowness.
      # The kernel log, which names any OOM kill, is opened to the job's user.
      # The runner's own interface drops what reaches the api's ports and the
      # mock's two (its door and its metrics), so only the runner and its
      # containers reach them.
      - name: Prepare the host for the agent burst
        if: env.PROFILE == 'agent-burst'
        run: |
          set -euo pipefail
          sudo swapoff -a
          sudo sysctl -w kernel.dmesg_restrict=0
          sudo mkdir -p -m 0750 /var/lib/tale-sandbox
          docker network inspect tale-sandbox-net >/dev/null 2>&1 ||
            docker network create --internal --ipv6=false --driver=bridge tale-sandbox-net
          bridge_ip="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          if [ -z "$bridge_ip" ]; then
            echo '::error::the docker bridge names no gateway address'; exit 1
          fi
          echo "BRIDGE_IP=$bridge_ip" >> "$GITHUB_ENV"
          iface="$(ip -o route show default | awk '{ print $5; exit }')"
          sudo iptables -I INPUT -i "$iface" -p tcp -m multiport \
            --dports "${BASE_PORT}:$(( BASE_PORT + API_PROCESSES - 1 )),4199:4200" -j DROP
          echo "cpus: $(nproc)"
          free -m

      # Secrets are minted per run; the stack and the database are discarded
      # with the runner.
      - name: Write the stack environment
        run: |
          set -euo pipefail
          LOAD_DIR="$RUNNER_TEMP/load"
          mkdir -p "$LOAD_DIR/config" "$LOAD_DIR/report"
          auth_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$auth_secret"
          {
            echo "LOAD_DIR=$LOAD_DIR"
            echo "TALE_LOAD_AUTH_SECRET=$auth_secret"
            echo "TALE_LOAD_DB_URL=postgres://tale:${LOAD_DB_PASSWORD}@127.0.0.1:5432/tale_app"
            echo "TALE_LOAD_STATS_DB_URL=postgres://tale:${LOAD_DB_PASSWORD}@127.0.0.1:5432/tale"
          } >> "$GITHUB_ENV"
          cat > "$LOAD_DIR/stack.env" <<ENV
          DATABASE_URL=postgres://tale:${LOAD_DB_PASSWORD}@127.0.0.1:5432/tale_app
          KNOWLEDGE_DATABASE_URL=postgres://tale:${LOAD_DB_PASSWORD}@127.0.0.1:5432/tale_knowledge
          BETTER_AUTH_SECRET=${auth_secret}
          ENCRYPTION_SECRET_HEX=$(openssl rand -hex 32)
          SITE_URL=http://127.0.0.1:${BASE_PORT}
          TALE_CONFIG_DIR=${LOAD_DIR}/config
          TALE_CONFIG_BUILTIN_DIR=${GITHUB_WORKSPACE}/configs/platform
          TALE_ALLOW_OPEN_SIGN_UP=true
          TALE_ALLOW_PRIVATE_PROVIDER_HOSTS=1
          TALE_PROVIDER_KEY_LOADMOCK=load-mock-key
          OBJECT_STORE_ACCESS_KEY=${LOAD_S3_ACCESS_KEY}
          OBJECT_STORE_SECRET_KEY=${LOAD_S3_SECRET_KEY}
          OBJECT_STORE_BUCKET=tale-blobs
          OBJECT_STORE_ENDPOINT=http://127.0.0.1:9000
          OBJECT_STORE_PUBLIC_ENDPOINT=http://127.0.0.1:9000
          OBJECT_STORE_REGION=us-east-1
          OBJECT_STORE_FORCE_PATH_STYLE=true
          DATABASE_POOL_MAX=20
          AUTH_DATABASE_POOL_MAX=10
          NODE_ENV=production
          ENV
          sed -i 's/^ *//' "$LOAD_DIR/stack.env"
          # The sandbox control plane, as `bun dev` reaches it from the host:
          # the spawner and the LLM gateway on loopback, and sessions call
          # back through the relay's `backend-api` alias.
          if [ "$PROFILE" = agent-burst ]; then
            sandbox_token="$(openssl rand -hex 32)"
            gateway_password="Load-$(openssl rand -hex 24)-A1"
            echo "::add-mask::$sandbox_token"
            echo "::add-mask::$gateway_password"
            {
              echo "SANDBOX_TOKEN=$sandbox_token"
              echo "SANDBOX_LLM_GATEWAY_ADMIN_PASSWORD=$gateway_password"
            } >> "$GITHUB_ENV"
            printf '%s\n' \
              'SANDBOX_URL=http://127.0.0.1:8003' \
              "SANDBOX_TOKEN=${sandbox_token}" \
              'SANDBOX_LLM_GATEWAY_URL=http://127.0.0.1:8080' \
              "SANDBOX_LLM_GATEWAY_ADMIN_PASSWORD=${gateway_password}" \
              'SANDBOX_HTTP_API_BASE_URL=http://backend-api:3005' >> "$LOAD_DIR/stack.env"
          fi

      # The sandbox control plane as `bun dev` runs it beside a host backend
      # (services/platform/scripts/dev-engine.ts): the spawner, its egress
      # proxy, the LLM gateway published on loopback, and the relay that
      # carries the `backend-api` alias to the host's api.
      - name: Start the sandbox control plane
        if: env.PROFILE == 'agent-burst'
        timeout-minutes: 10
        env:
          VERSION: load
          PULL_POLICY: never
        run: |
          set -euo pipefail
          compose=(docker compose -f compose.yml -f compose.dev.yml -f compose.docs.yml
            -f compose.sandbox-llm-gateway.dev.yml)
          "${compose[@]}" up -d --no-build --wait --wait-timeout 300 \
            sandbox-llm-gateway sandbox sandbox-egress backend-relay
          "${compose[@]}" ps

      - name: Start the platform stack
        timeout-minutes: 10
        run: |
          set -euo pipefail
          ulimit -n 65536
          node tools/load/src/cli.ts stack up --platform services/platform \
            --env-file "$LOAD_DIR/stack.env" --api "$API_PROCESSES" --workers "$WORKER_PROCESSES" \
            --base-port "$BASE_PORT" --listen-host "$LISTEN_HOST" --mock-port 4199 --mock-processes 2 \
            --state "$LOAD_DIR/stack.json" --logs "$LOAD_DIR/logs"

      - name: Seed the population
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if [ "$PROFILE" = agent-burst ]; then
            # One organization, whose owner sets up the burst. The LLM gateway
            # reaches the mock across its bridge and passes Claude Code's
            # Anthropic wire through to it as it is.
            node tools/load/src/cli.ts seed --target "http://127.0.0.1:$BASE_PORT" \
              --users 1 --org-size 1 --provider-base-url "http://$BRIDGE_IP:4199" \
              --provider-api-format anthropic --output "$LOAD_DIR/plan.json"
          else
            node tools/load/src/cli.ts seed --target "http://127.0.0.1:$BASE_PORT" \
              --users "$USERS" --org-size 50 --mega-org-size "$(( USERS / 10 ))" \
              --provider-base-url http://127.0.0.1:4199/v1 --output "$LOAD_DIR/plan.json"
          fi

      - name: Run the profile
        if: env.PROFILE != 'agent-burst'
        timeout-minutes: 150
        run: |
          set -euo pipefail
          ulimit -n 65536
          targets="$(seq -s, -f 'http://127.0.0.1:%g' "$BASE_PORT" $(( BASE_PORT + API_PROCESSES - 1 )))"
          metrics="$(seq -s, -f 'http://127.0.0.1:%g/metrics' "$BASE_PORT" $(( BASE_PORT + API_PROCESSES - 1 )))"
          node tools/load/src/cli.ts run --plan "$LOAD_DIR/plan.json" --profile "$PROFILE" \
            --users "$USERS" --ramp "$RAMP_SECONDS" --hold "$HOLD_SECONDS" \
            --think-scale "$THINK_SCALE" --processes 2 --target "$targets" --metrics "$metrics" \
            --report "$LOAD_DIR/report/report.json"

      # Its own exit code is the verdict: 1 when an expectation missed.
      - name: Run the agent burst
        if: env.PROFILE == 'agent-burst'
        timeout-minutes: 45
        run: |
          set -euo pipefail
          node tools/load/src/cli.ts burst --plan "$LOAD_DIR/plan.json" \
            --stack-state "$LOAD_DIR/stack.json" --report "$LOAD_DIR/report/report.json"

      - name: Stop the platform stack
        if: always()
        run: |
          if [ -f "$LOAD_DIR/stack.json" ]; then
            node tools/load/src/cli.ts stack down --state "$LOAD_DIR/stack.json" || true
          fi

      - name: Collect the sandbox logs
        if: always() && env.PROFILE == 'agent-burst' && env.LOAD_DIR != ''
        env:
          VERSION: load
          PULL_POLICY: never
        run: |
          mkdir -p "$LOAD_DIR/logs"
          docker compose -f compose.yml -f compose.dev.yml -f compose.docs.yml \
            -f compose.sandbox-llm-gateway.dev.yml logs --no-color --timestamps \
            > "$LOAD_DIR/logs/sandbox.log" 2>&1 || true
          docker ps -a > "$LOAD_DIR/logs/containers.txt" 2>&1 || true
          sudo dmesg > "$LOAD_DIR/logs/dmesg.log" 2>&1 || true

      - name: Summarize
        if: always()
        run: |
          if [ -f "$LOAD_DIR/report/report.md" ]; then
            cat "$LOAD_DIR/report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report was written; see the stack logs artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: load-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.LOAD_DIR }}/report
            ${{ env.LOAD_DIR }}/logs
            ${{ env.LOAD_DIR }}/plan.json
          retention-days: 14
          if-no-files-found: warn
