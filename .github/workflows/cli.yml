name: CLI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach binary to (e.g., v1.0.0)'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'tools/cli/**'
      - 'scripts/install-cli.*'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'tools/cli/**'
      - 'scripts/install-cli.*'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the version string for the build matrix.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION="dev"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build the CLI binary for each target platform.
  # All platforms run on GitHub-hosted runners (free for public repos).
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `cross: true` marks binaries compiled for a different architecture
        # than the build host: they cannot execute there, so the run-the-binary
        # steps (Verify binary, smoke tests) are skipped for those entries.
        include:
          - os: ubuntu-latest
            platform: linux
            build_script: build:linux
            binary: tale
            artifact: tale_linux
          - os: ubuntu-latest
            platform: linux-arm64
            build_script: build:linux-arm64
            binary: tale
            artifact: tale_linux_arm64
            cross: true
          - os: macos-latest
            platform: macos
            build_script: build:mac
            binary: tale
            artifact: tale_macos
          - os: macos-latest
            platform: macos-x64
            build_script: build:mac-x64
            binary: tale
            artifact: tale_macos_x64
            cross: true
          - os: windows-latest
            platform: windows
            build_script: build:windows
            binary: tale.exe
            artifact: tale_windows.exe

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # 1.3.12's `bun build --compile` emits a truncated macOS code
          # signature (oven-sh/bun#29120): users' kernels SIGKILL the binary
          # while CI's SIP-disabled runners run it fine. Keep >= 1.3.13 and
          # keep the "Verify macOS code signature" step below.
          bun-version: '1.3.13'

      - name: Restore Bun install cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-1.3.13-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-1.3.13-

      - name: Install dependencies
        working-directory: tools/cli
        run: bun install --frozen-lockfile

      - name: Generate embedded files
        working-directory: tools/cli
        run: bun run generate

      # Smoke tests in tests/ are discovered too but skip cleanly here —
      # TALE_BINARY is only set after the binary is built.
      - name: Run unit tests
        working-directory: tools/cli
        run: bun test

      - name: Run type check
        if: matrix.platform == 'linux'
        working-directory: tools/cli
        run: bun run typecheck

      - name: Inject version into package.json
        working-directory: tools/cli
        run: |
          jq '.version = "${{ needs.prepare.outputs.version }}"' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Build binary
        working-directory: tools/cli
        run: bun run ${{ matrix.build_script }}

      - name: Rename binary
        working-directory: tools/cli/dist
        run: mv ${{ matrix.binary }} ${{ matrix.artifact }}

      # Bun finalizes the compiled binary after signing it, so the signature
      # never seals the shipped bytes (and 1.3.12's was outright truncated —
      # oven-sh/bun#29120). Strip and ad-hoc re-sign so the final file carries
      # a valid seal; without one, stock macOS kernels SIGKILL the binary.
      # codesign inspects the Mach-O on disk, so it covers the cross-compiled
      # x64 binary on the arm64 runner just as well as the native one.
      - name: Normalize macOS code signature
        if: startsWith(matrix.platform, 'macos')
        working-directory: tools/cli/dist
        run: |
          codesign --remove-signature ${{ matrix.artifact }}
          codesign -s - ${{ matrix.artifact }}

      # Cross-compiled binaries cannot execute on the build host — static
      # checks (codesign below) are all CI can do for those.
      - name: Verify binary
        if: ${{ !matrix.cross }}
        working-directory: tools/cli/dist
        run: |
          if [ "${{ matrix.platform }}" != "windows" ]; then
            chmod +x ${{ matrix.artifact }}
          fi
          ./${{ matrix.artifact }} --version

      # Running the binary is not enough on macOS: GitHub runners have SIP
      # disabled, so they execute binaries whose signature the stock kernel
      # rejects with SIGKILL. Validate the signature statically instead.
      - name: Verify macOS code signature
        if: startsWith(matrix.platform, 'macos')
        working-directory: tools/cli/dist
        run: codesign --verify --strict --verbose=2 ${{ matrix.artifact }}

      - name: Run smoke tests
        if: ${{ !matrix.cross }}
        working-directory: tools/cli
        env:
          TALE_BINARY: dist/${{ matrix.artifact }}
        run: bun test tests/smoke.test.ts

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: tools/cli/dist/${{ matrix.artifact }}
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Attach built binaries to the GitHub release (dispatch only).
  # ---------------------------------------------------------------------------
  release:
    name: Attach to release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Wait for release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          TAG="$RELEASE_TAG"
          MAX_ATTEMPTS=10
          DELAY=15
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
              echo "Release $TAG found."
              exit 0
            fi
            echo "Release $TAG not found yet (attempt $i/$MAX_ATTEMPTS). Waiting ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2 > 120 ? 120 : DELAY * 2))
          done
          echo "::error::Release $TAG not found after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Generate checksums
        run: |
          # Flatten the per-artifact dirs into one, then emit a single
          # SHA256SUMS-style file the installers verify the binary against.
          mkdir -p release
          cp artifacts/tale_linux/* release/tale_linux
          cp artifacts/tale_linux_arm64/* release/tale_linux_arm64
          cp artifacts/tale_macos/* release/tale_macos
          cp artifacts/tale_macos_x64/* release/tale_macos_x64
          cp artifacts/tale_windows.exe/* release/tale_windows.exe
          cd release
          sha256sum tale_linux tale_linux_arm64 tale_macos tale_macos_x64 tale_windows.exe > tale_checksums.txt
          cat tale_checksums.txt

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass workflow inputs through the environment and quote them in the
          # shell, so the tag is treated as data — never interpolated as code.
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release/tale_linux \
            release/tale_linux_arm64 \
            release/tale_macos \
            release/tale_macos_x64 \
            release/tale_windows.exe \
            release/tale_checksums.txt \
            --repo "$REPO" \
            --clobber
