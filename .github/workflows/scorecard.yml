name: Scorecard

# OpenSSF Scorecard — supply-chain posture score for the repo. Runs on the
# default branch and weekly, uploads SARIF to the Security tab, and publishes the
# result to the public OpenSSF API (for the README badge). Informational only;
# it never blocks a PR.

on:
  branch_protection_rule:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the analysis job opts into the few writes it needs.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload findings to the code-scanning dashboard.
      security-events: write
      # Publish results to the public OpenSSF API (badge).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: results.sarif
          category: scorecard
