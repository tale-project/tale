name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.*.*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string
      sites_only:
        description: 'Build web/docs/ui-docs only; keep platform, CLI and latest tags unchanged'
        required: false
        type: boolean
        default: false

# Share admission across tags: a later run must see the previous publication.
# Releases must not cancel mid-flight (partial manifests would break deploys).
concurrency:
  group: tale-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # The org.opencontainers.image.* metadata every published image carries,
  # without the prefix: the Dockerfiles declare the static keys, the build
  # steps below the dynamic ones (tools/cli/scripts/oci-image-metadata.test.ts).
  OCI_METADATA_KEYS: created revision source version title description url documentation vendor licenses

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the version string used by every downstream job.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_number: ${{ steps.version.outputs.version_number }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      sites_only: ${{ steps.version.outputs.sites_only }}
      services: ${{ steps.version.outputs.services }}
      service_names: ${{ steps.version.outputs.service_names }}

    steps:
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          SITES_ONLY: ${{ inputs.sites_only || false }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::The release source must be a full commit SHA'; exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION_NUMBER="${VERSION#v}"
          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo '::error::Version must be an exact semantic version'; exit 1
          fi
          # Keep the public release train to one full cohort per UTC day. A
          # rerun of the same tag remains available for recovery; a different
          # tag must wait for the next day so services and CLI assets cannot
          # churn through several partially adopted cohorts.
          if [ "$SITES_ONLY" != true ]; then
            TODAY="$(date -u +%F)"
            LATEST_RELEASE="$({
              gh api "repos/${REPOSITORY}/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false and .published_at != null) | [.published_at, .tag_name] | @tsv'
            } | sort | tail -n 1)"
            if [ -n "$LATEST_RELEASE" ]; then
              LATEST_PUBLISHED="${LATEST_RELEASE%%$'\t'*}"
              LATEST_TAG="${LATEST_RELEASE#*$'\t'}"
              if [ "${LATEST_PUBLISHED%%T*}" = "$TODAY" ] && [ "$LATEST_TAG" != "v${VERSION_NUMBER}" ]; then
                echo "::error::A release was already published today (${LATEST_TAG}); release at most one full cohort per UTC day"; exit 1
              fi
            fi
          fi
          # Start the longest native builds first within the bounded matrix.
          SERVICE_NAMES='["sandbox-runtime","platform","db","web","docs","ui-docs","ai-gateway","proxy","sandbox-llm-gateway","sandbox","sandbox-egress","sandbox-buildkitd"]'
          if [ "$SITES_ONLY" = true ]; then SERVICE_NAMES='["web","docs","ui-docs"]'; fi
          {
            echo "sites_only=$SITES_ONLY"
            echo "service_names=$SERVICE_NAMES"
            echo "services=$(jq -c 'map({name:.})' <<< "$SERVICE_NAMES")"
            echo "version=v${VERSION_NUMBER}"
            echo "version_number=${VERSION_NUMBER}"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

      # Limit the checkout to the notes and their standalone validator.
      - name: Checkout release notes
        if: steps.version.outputs.sites_only != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/release-notes
            tools/cli/scripts/release-notes.ts
          sparse-checkout-cone-mode: false

      - name: Setup Bun for release notes
        if: steps.version.outputs.sites_only != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Validate authored release notes before building
        if: steps.version.outputs.sites_only != 'true'
        shell: bash
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: bun tools/cli/scripts/release-notes.ts --version "$TAG"

      - name: Summary
        run: |
          {
            echo "## Release Version"
            echo "- **Version**: ${{ steps.version.outputs.version }}"
            echo "- **Version Number**: ${{ steps.version.outputs.version_number }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build and push each service image per architecture on native runners.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.service.name }} (${{ matrix.arch.name }})
    needs: prepare
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
        arch:
          - { name: amd64, runner: ubuntu-latest, platform: linux/amd64 }
          - { name: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Reclaim disk space
        if: matrix.service.name == 'platform' || matrix.service.name == 'sandbox-runtime'
        env:
          MIN_FREE_GIB: '40'
        run: &reclaim-release-disk |
          set -euo pipefail
          case "$MIN_FREE_GIB" in
            20|28|40) ;;
            *) echo '::error::Invalid CI disk target'; exit 1 ;;
          esac
          MIN_FREE_KB=$((MIN_FREE_GIB * 1024 * 1024))
          measure_space() {
            df -h /
            AVAILABLE_KB=$(df -Pk / | awk 'NR == 2 { print $4 }')
            if [[ ! "$AVAILABLE_KB" =~ ^[0-9]+$ ]]; then
              echo '::error::Could not measure free disk space'; exit 1
            fi
            echo "Available: ${AVAILABLE_KB} KiB; cleanup target: ${MIN_FREE_GIB} GiB"
          }
          measure_space
          if [ "$AVAILABLE_KB" -ge "$MIN_FREE_KB" ]; then exit 0; fi
          # Stop once the next build/pull has headroom. Deleting all installed
          # toolchains took 50–119s even when the image build was cached.
          for DIRECTORY in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            sudo rm -rf -- "$DIRECTORY"
            measure_space
            if [ "$AVAILABLE_KB" -ge "$MIN_FREE_KB" ]; then exit 0; fi
          done
          sudo docker image prune -af
          measure_space
          # Preserve the old cold-build fallback after exhausting its cleanup.
          # The target controls when to stop deleting; it is not a runner quota.
          if [ "$AVAILABLE_KB" -lt "$MIN_FREE_KB" ]; then
            echo '::warning::Full CI disk cleanup completed below the headroom target'
          fi

      - name: Setup Docker builder
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          cleanup: false
          # Hosted runners can be temporarily throttled by Docker Hub. Keep
          # the builder bootstrap and anonymous base-image resolution on the
          # public Google mirror so a registry incident does not strand a
          # release before buildx starts.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: meta
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "revision=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          AUTOMATION_PROTOCOL=$(sed -n 's/^export const ENGINE_PROTOCOL = \([1-9][0-9]*\);$/\1/p' services/platform/lib/engine/core/protocol.ts)
          case "$AUTOMATION_PROTOCOL" in 1|2) ;; *) echo '::error::Unsupported automation writer protocol'; exit 1;; esac
          echo "automation-protocol=${AUTOMATION_PROTOCOL}" >> "$GITHUB_OUTPUT"

      # A service's title, description and links are written once, by the final
      # stage of its Dockerfile. The annotations repeat them so the manifest
      # says what the image config says; this step reads them from there, and
      # the job fails when the Dockerfile does not declare all of them.
      - name: Resolve image annotations
        id: annotations
        env:
          SERVICE: ${{ matrix.service.name }}
        run: |
          set -euo pipefail
          DOCKERFILE="services/${SERVICE}/Dockerfile"
          KEYS="title description url documentation vendor licenses"
          read -ra WANTED <<< "$KEYS"
          STATIC=$(
            awk 'toupper($1) == "FROM" { stage = "" } { stage = stage $0 "\n" } END { printf "%s", stage }' "$DOCKERFILE" \
              | grep -v '^[[:space:]]*#' \
              | grep -oE "org\.opencontainers\.image\.(${KEYS// /|})=\"[^\"]*\"" \
              | sed -E 's/="(.*)"$/=\1/' || true
          )
          FOUND=$(printf '%s\n' "$STATIC" | grep -c . || true)
          if [ "$FOUND" -ne "${#WANTED[@]}" ]; then
            echo "::error::The final stage of ${DOCKERFILE} declares ${FOUND} of its OCI labels ${KEYS}"
            exit 1
          fi
          {
            echo 'static<<OCI_ANNOTATIONS_EOF'
            printf '%s\n' "$STATIC"
            echo 'OCI_ANNOTATIONS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: image
        # A Docker Hub 429/5xx while resolving a public base can fail an
        # otherwise valid build. Keep the first attempt's failure visible in
        # the step outcome, then make one complete retry. The retry remains a
        # blocking step, so real build/configuration failures still fail this
        # job after the retry.
        continue-on-error: true
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/${{ matrix.service.name }}/Dockerfile
          platforms: ${{ matrix.arch.platform }}
          push: true
          # zstd layers unpack several times faster than gzip ones, at a
          # slightly better ratio. Docker pulls them from Engine 23.0 on (the
          # CLI refuses engines older than 24) and Kubernetes nodes from
          # containerd 1.5; only OCI media types name them. force-compression
          # re-encodes a layer the cache still holds as gzip. Level 3 is
          # zstd's default and the level AWS measured faster Fargate starts
          # with.
          outputs: type=image,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service.name }}:${{ needs.prepare.outputs.version_number }}-${{ matrix.arch.name }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version_number }}
            ${{ matrix.service.name == 'platform' && format('AUTOMATION_WRITER_PROTOCOL={0}', steps.meta.outputs.automation-protocol) || '' }}
          # Only trusted releases write these separate per-service cache images.
          # Architecture tags keep the native builders from replacing each other.
          # A release reads no other cache, so a layer it reuses keeps the bytes
          # the previous release shipped and a host's upgrade downloads only the
          # layers whose inputs changed. Reading main's GHA cache as well handed
          # a release the bytes of a main build that had rebuilt from an evicted
          # cache: v0.5.76's amd64 runtime image changed 1.98 of its 2.03 GB
          # while arm64, built from the same source without that cache, changed
          # none.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service.name }}-buildcache:${{ matrix.arch.name }}
          # A cache outage must not invalidate a successfully pushed image.
          # The cache keeps the zstd blobs the image shipped, so the next
          # release reuses an unchanged layer's exact bytes. A gzip cache would
          # be re-encoded on every release, and a zstd encoder only promises
          # the same output from the same code version: a BuildKit update could
          # change every layer's digest and re-ship each image in full.
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service.name }}-buildcache:${{ matrix.arch.name }},mode=max,ignore-error=true,compression=zstd,compression-level=3,force-compression=true
          # `labels:` merge into the Dockerfile's LABELs, and a key named in both
          # takes the value given here. These are the labels only a build knows;
          # the Dockerfile's final stage declares the rest. The CLI reads
          # org.opencontainers.image.version to detect the running instance;
          # omitting it made every in-place 0.4.x deploy look like an unknown
          # (hence pre-0.4) instance and trip the breaking-cutover guard.
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version_number }}
            ${{ matrix.service.name == 'platform' && format('io.tale.automation-writer-protocol={0}', steps.meta.outputs.automation-protocol) || '' }}
          # The same metadata on this architecture's image manifest: the build's
          # own values as above, then the Dockerfile's from the step before.
          # Manifest level only: BuildKit refuses an `index:` annotation on a
          # single-platform export. The Manifest job writes the index over both
          # architectures and annotates it from the pushed config.
          annotations: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version_number }}
            ${{ steps.annotations.outputs.static }}
            ${{ matrix.service.name == 'platform' && format('io.tale.automation-writer-protocol={0}', steps.meta.outputs.automation-protocol) || '' }}
          provenance: false

      - name: Back off before retrying the registry
        if: steps.image.outcome == 'failure'
        run: sleep 15

      - name: Retry build and push after a transient registry failure
        id: image_retry
        if: steps.image.outcome == 'failure'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/${{ matrix.service.name }}/Dockerfile
          platforms: ${{ matrix.arch.platform }}
          push: true
          outputs: type=image,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service.name }}:${{ needs.prepare.outputs.version_number }}-${{ matrix.arch.name }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version_number }}
            ${{ matrix.service.name == 'platform' && format('AUTOMATION_WRITER_PROTOCOL={0}', steps.meta.outputs.automation-protocol) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service.name }}-buildcache:${{ matrix.arch.name }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service.name }}-buildcache:${{ matrix.arch.name }},mode=max,ignore-error=true,compression=zstd,compression-level=3,force-compression=true
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version_number }}
            ${{ matrix.service.name == 'platform' && format('io.tale.automation-writer-protocol={0}', steps.meta.outputs.automation-protocol) || '' }}
          annotations: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version_number }}
            ${{ steps.annotations.outputs.static }}
            ${{ matrix.service.name == 'platform' && format('io.tale.automation-writer-protocol={0}', steps.meta.outputs.automation-protocol) || '' }}
          provenance: false

      # Read the pushed manifest back by digest, from whichever attempt pushed
      # it. buildx older than 0.12 drops `annotations` with a warning and a
      # green build, and the Manifest job indexes only what this step passed.
      - name: Verify image annotations
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service.name }}
          DIGEST: ${{ steps.image_retry.outputs.digest || steps.image.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version_number }}
          REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::The build of ${IMAGE} reported no image digest"; exit 1
          fi
          REF="${IMAGE}@${DIGEST}"
          MANIFEST=$(docker buildx imagetools inspect "$REF" --raw)
          CONFIG=$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}')
          jq -e -n --argjson manifest "$MANIFEST" --argjson config "$CONFIG" \
            --arg keys "$OCI_METADATA_KEYS" --arg version "$VERSION" --arg revision "$REVISION" '
            ($config.config.Labels // {}) as $labels
            | ($manifest.annotations // {}) as $annotations
            | ($keys | split(" ") | map("org.opencontainers.image." + .)) as $declared
            | $manifest.mediaType == "application/vnd.oci.image.manifest.v1+json"
              and $annotations["org.opencontainers.image.version"] == $version
              and $annotations["org.opencontainers.image.revision"] == $revision
              and all($declared[]; ($annotations[.] // "") != "" and $annotations[.] == $labels[.])
              and all(($labels | keys[] | select(startswith("io.tale."))); $annotations[.] == $labels[.])
          ' > /dev/null || {
            echo "::error::${REF} does not repeat its OCI metadata labels as manifest annotations"
            exit 1
          }

      - name: Setup Bun for document checks
        if: matrix.service.name == 'sandbox-runtime'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Verify native document tools
        if: matrix.service.name == 'sandbox-runtime'
        env:
          DOCUMENT_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/tale-sandbox-runtime:${{ needs.prepare.outputs.version_number }}-${{ matrix.arch.name }}@${{ steps.image_retry.outputs.digest || steps.image.outputs.digest }}
          DOCUMENT_PLATFORM: ${{ matrix.arch.platform }}
          DOCUMENT_REVISION: ${{ steps.meta.outputs.revision }}
          DOCUMENT_VERSION: ${{ needs.prepare.outputs.version_number }}
          DOCUMENT_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$DOCUMENT_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ "$DOCUMENT_PLATFORM" == linux/amd64 || "$DOCUMENT_PLATFORM" == linux/arm64 ]] || exit 1
          docker pull --platform "$DOCUMENT_PLATFORM" "$DOCUMENT_IMAGE"
          LABELS=$(docker image inspect --format '{{json .Config.Labels}}' "$DOCUMENT_IMAGE")
          jq -e --arg revision "$DOCUMENT_REVISION" --arg version "$DOCUMENT_VERSION" --arg source "$DOCUMENT_SOURCE" \
            '."org.opencontainers.image.revision" == $revision and ."org.opencontainers.image.version" == $version and ."org.opencontainers.image.source" == $source' <<< "$LABELS" > /dev/null
          # Both checks use anonymous, offline read-only containers with their
          # own tmpfs. Await both even when the first UID fails.
          # JavaScript owns the template interpolation.
          # shellcheck disable=SC2016
          bun -e '
            import { checkDocumentTools } from "./services/platform/tests/integration/lib/document-tools.ts";
            const image = process.env.DOCUMENT_IMAGE;
            const platform = process.env.DOCUMENT_PLATFORM;
            if (!image || (platform !== "linux/amd64" && platform !== "linux/arm64")) {
              throw new Error("Invalid native document check inputs");
            }
            const uids = [65534, 10001];
            const checks = await Promise.allSettled(uids.map(uid => checkDocumentTools(image, uid, platform)));
            let failed = false;
            for (const [index, check] of checks.entries()) {
              console.log(`Document tools as uid ${uids[index]}`);
              if (check.status === "rejected") {
                console.error(check.reason);
                failed = true;
              } else {
                console.log(check.value.combined.trim());
                failed ||= check.value.exitCode !== 0;
              }
            }
            if (failed) process.exitCode = 1;
          '

  # ---------------------------------------------------------------------------
  # Gate: validate built images with the same tests CI runs on PRs.
  # ---------------------------------------------------------------------------
  container-test:
    name: Container test gate
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Reclaim disk space if needed
        env:
          MIN_FREE_GIB: ${{ needs.prepare.outputs.sites_only == 'true' && '20' || '40' }}
        run: *reclaim-release-disk

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull release images
        env:
          SERVICE_NAMES: ${{ needs.prepare.outputs.service_names }}
          REGISTRY_PATH: ${{ env.REGISTRY }}/${{ github.repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          IMAGE_TAG: ${{ needs.prepare.outputs.version_number }}-amd64
        run: |
          set -euo pipefail
          read -r -a SERVICES <<< "$(jq -r 'join(" ")' <<< "$SERVICE_NAMES")"
          bash .github/scripts/pull-ci-images.sh "${SERVICES[@]}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Preload external smoke-test image from mirror
        env:
          MIRROR_IMAGE: mirror.gcr.io/brainicism/bgutil-ytdlp-pot-provider:1.3.1
          COMPOSE_IMAGE: brainicism/bgutil-ytdlp-pot-provider:1.3.1
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull "$MIRROR_IMAGE"; then
              docker tag "$MIRROR_IMAGE" "$COMPOSE_IMAGE"
              exit 0
            fi
            echo "Mirror pull attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 5))
          done
          echo '::error::Could not preload the smoke-test provider image from the registry mirror'
          exit 1

      # Image probes use disposable offline containers; the smoke test owns
      # the tale-test Compose project. Reuse the same accepted image set.
      - name: Run stack validation
        if: needs.prepare.outputs.sites_only != 'true'
        env:
          PULL_POLICY: never
          SKIP_BUILD: 'true'
          SMOKE_TEST_TIMEOUT: 300
        run: |
          set -euo pipefail
          LOG_DIR=$(mktemp -d "${RUNNER_TEMP}/release-validation.XXXXXX")
          bun services/platform/tests/integration/container-image-test.ts > "${LOG_DIR}/images.log" 2>&1 &
          IMAGES_PID=$!
          bun services/platform/tests/integration/container-smoke-test.ts > "${LOG_DIR}/smoke.log" 2>&1 &
          SMOKE_PID=$!
          FAILED=0
          if ! wait "$IMAGES_PID"; then FAILED=1; fi
          if ! wait "$SMOKE_PID"; then FAILED=1; fi
          for SUITE in images smoke; do
            echo "::group::Release ${SUITE} validation"
            cat "${LOG_DIR}/${SUITE}.log"
            echo '::endgroup::'
          done
          exit "$FAILED"

      # These projects have unique container names, volumes and ports13001–13004.
      - name: Run standalone container tests
        env:
          PULL_POLICY: never
          SKIP_BUILD: 'true'
          SITES_ONLY: ${{ needs.prepare.outputs.sites_only }}
        run: |
          set -euo pipefail
          LOG_DIR=$(mktemp -d "${RUNNER_TEMP}/release-validation.XXXXXX")
          SERVICES=(web docs ui-docs)
          if [ "$SITES_ONLY" != true ]; then SERVICES+=(ai-gateway); fi
          PIDS=()
          for SERVICE in "${SERVICES[@]}"; do
            TEST_SCRIPT="services/platform/tests/integration/container-${SERVICE}-test.ts"
            bun run "$TEST_SCRIPT" > "${LOG_DIR}/${SERVICE}.log" 2>&1 &
            PIDS+=("$!")
          done
          FAILED=0
          for PID in "${PIDS[@]}"; do
            if ! wait "$PID"; then FAILED=1; fi
          done
          for SERVICE in "${SERVICES[@]}"; do
            echo "::group::Release ${SERVICE} container validation"
            cat "${LOG_DIR}/${SERVICE}.log"
            echo '::endgroup::'
          done
          exit "$FAILED"

      - name: Upload release validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-validation-logs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-validation.*/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Container Test Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Release image validation status: ${{ job.status }} (${{ needs.prepare.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Publish one OCI image index (:version and :latest) per service.
  # ---------------------------------------------------------------------------
  manifest:
    name: Manifest ${{ matrix.service }}
    needs: [prepare, build, container-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    strategy:
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.service_names) }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One call writes the index and every tag, so :version and :latest name
      # the same index digest, and a re-run of this job over the same images
      # writes the same bytes. `docker manifest` has no way to put annotations
      # on an index; imagetools does, and GitHub documents that a multi-arch
      # package takes its description from the index's annotations. They repeat
      # the OCI labels of the pushed amd64 image config, so the index cannot
      # drift from the image it describes.
      - name: Create and push the OCI image index
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service }}
          VERSION: ${{ needs.prepare.outputs.version_number }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SITES_ONLY: ${{ needs.prepare.outputs.sites_only }}
        run: |
          set -euo pipefail
          docker buildx version
          AMD64="${IMAGE}:${VERSION}-amd64"
          ARM64="${IMAGE}:${VERSION}-arm64"

          # An image missing part of the metadata set stops here, before a tag moves.
          CONFIG=$(docker buildx imagetools inspect "$AMD64" --format '{{json .Image}}')
          jq -e --arg keys "$OCI_METADATA_KEYS" '
            (.config.Labels // {}) as $labels
            | all(($keys | split(" "))[]; ($labels["org.opencontainers.image." + .] // "") != "")
          ' <<< "$CONFIG" > /dev/null || {
            echo "::error::${AMD64} lacks an org.opencontainers.image label of: ${OCI_METADATA_KEYS}"
            exit 1
          }
          # Only what Tale declares: a base image's own labels (base.digest,
          # for one) describe one architecture's build, not the index.
          LABELS=$(jq -r --arg keys "$OCI_METADATA_KEYS" '
            ($keys | split(" ") | map("org.opencontainers.image." + .)) as $declared
            | (.config.Labels // {}) | to_entries | sort_by(.key)[]
            | select(.key as $key | ($declared | index($key)) != null or ($key | startswith("io.tale.")))
            | "\(.key)=\(.value)"
          ' <<< "$CONFIG")
          ANNOTATIONS=()
          while IFS= read -r LABEL; do
            ANNOTATIONS+=(--annotation "index:${LABEL}")
          done <<< "$LABELS"

          TAGS=(--tag "${IMAGE}:${VERSION}")
          if [ "$SITES_ONLY" != true ]; then TAGS+=(--tag "${IMAGE}:latest"); fi
          docker buildx imagetools create "${TAGS[@]}" "${ANNOTATIONS[@]}" "$AMD64" "$ARM64"

          # The proof: the tag is an OCI image index of exactly the two native
          # images this run pushed, annotated with this release, and every tag
          # written names that one index.
          INDEX=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw)
          jq -e --arg version "$VERSION" --arg revision "$SOURCE_SHA" '
            .mediaType == "application/vnd.oci.image.index.v1+json"
            and ([.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | sort) == ["linux/amd64", "linux/arm64"]
            and .annotations["org.opencontainers.image.version"] == $version
            and .annotations["org.opencontainers.image.revision"] == $revision
          ' <<< "$INDEX" > /dev/null || {
            echo "::error::${IMAGE}:${VERSION} is not the expected annotated OCI image index"
            exit 1
          }
          for ARCH in amd64 arm64; do
            CHILD=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}-${ARCH}" --format '{{.Manifest.Digest}}')
            jq -e --arg digest "$CHILD" --arg arch "$ARCH" \
              'any(.manifests[]; .digest == $digest and .platform.architecture == $arch)' <<< "$INDEX" > /dev/null || {
              echo "::error::${IMAGE}:${VERSION} does not index the ${ARCH} image this run pushed"
              exit 1
            }
          done
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          if [ "$SITES_ONLY" != true ]; then
            LATEST=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')
            [ "$LATEST" = "$DIGEST" ] || {
              echo "::error::${IMAGE}:latest does not name the ${VERSION} index"
              exit 1
            }
          fi

          {
            echo "### ${SERVICE}"
            echo "- **Version**: ${VERSION}"
            echo "- **Revision**: ${SOURCE_SHA}"
            echo "- **Index**: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Create the GitHub release after manifests are verified.
  # ---------------------------------------------------------------------------
  create-release:
    if: needs.prepare.outputs.sites_only != 'true'
    name: Create release
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The contract-changes section compares this tag with the previous
          # one (`git describe`), so the whole tag history is needed.
          fetch-depth: 0
          persist-credentials: false
          # API snapshots are read with git show; only the notes and their
          # dependency-free renderers need to be present in the working tree.
          sparse-checkout: |
            .github/release-notes
            services/platform/scripts/openapi/contract-notes.ts
            tools/cli/scripts/release-notes.ts
          sparse-checkout-cone-mode: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Verify manifests are pullable
        env:
          VERSION: ${{ needs.prepare.outputs.version_number }}
          REGISTRY_PATH: ${{ env.REGISTRY }}/${{ github.repository }}
          SERVICE_NAMES: ${{ needs.prepare.outputs.service_names }}
        run: |
          set -euo pipefail
          SERVICE_TEXT=$(jq -er 'if type == "array" and length > 0 and all(.[]; type == "string" and test("^[a-z0-9]+(-[a-z0-9]+)*$")) then join(" ") else error("Invalid services") end' <<< "$SERVICE_NAMES")
          read -r -a SERVICES <<< "$SERVICE_TEXT"
          PIDS=()
          for ((WORKER = 0; WORKER < 3 && WORKER < ${#SERVICES[@]}; WORKER++)); do
            (
              FAILED=0
              for ((INDEX = WORKER; INDEX < ${#SERVICES[@]}; INDEX += 3)); do
                IMAGE="${REGISTRY_PATH}/tale-${SERVICES[$INDEX]}:${VERSION}"
                echo "Verifying manifest: ${IMAGE}"
                if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
                  echo "::error::Manifest not found: ${IMAGE}"
                  FAILED=1
                fi
              done
              exit "$FAILED"
            ) &
            PIDS+=("$!")
          done
          FAILED=0
          for PID in "${PIDS[@]}"; do
            if ! wait "$PID"; then FAILED=1; fi
          done
          [ "$FAILED" -eq 0 ] || exit 1
          echo "All service manifests verified"

      # The "API contract changes" section the API reference promises for
      # every release: generated from the contract fingerprint at the
      # previous tag and this one, never hand-written (v0.5.49–v0.5.55
      # shipped the 1.21.0 bump under a bare "What's Changed" list). The
      # section follows authored highlights and precedes GitHub's generated notes.
      - name: Describe API contract changes
        env:
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          FINGERPRINT=services/platform/scripts/openapi/contract-fingerprint.json
          OPENAPI=services/platform/public/openapi.json
          CHANGELOG=services/platform/lib/shared/constants/api-contract.ts
          # A dispatched release names a tag the checkout may not sit on.
          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" > /dev/null; then
            AT="refs/tags/${TAG}"
          else
            echo "::warning::tag ${TAG} is not in the checkout; comparing HEAD with its previous tag"
            AT="HEAD"
          fi
          PREV="$(git describe --tags --abbrev=0 "${AT}^" 2>/dev/null || true)"
          echo "Comparing the contract at ${AT} with ${PREV:-<no previous tag>}"
          mkdir -p /tmp/contract
          git show "${AT}:${FINGERPRINT}" > /tmp/contract/current-fingerprint.json
          git show "${AT}:${OPENAPI}" > /tmp/contract/current-openapi.json
          git show "${AT}:${CHANGELOG}" > /tmp/contract/current-changelog.ts
          if [ -n "${PREV}" ]; then
            git show "${PREV}:${FINGERPRINT}" > /tmp/contract/previous-fingerprint.json || true
            git show "${PREV}:${OPENAPI}" > /tmp/contract/previous-openapi.json || true
          fi
          bun services/platform/scripts/openapi/contract-notes.ts \
            --previous-tag "${PREV:-(none)}" \
            --previous-fingerprint /tmp/contract/previous-fingerprint.json \
            --previous-openapi /tmp/contract/previous-openapi.json \
            --current-fingerprint /tmp/contract/current-fingerprint.json \
            --current-openapi /tmp/contract/current-openapi.json \
            --changelog /tmp/contract/current-changelog.ts \
            --out /tmp/contract/release-notes.md

      - name: Lead with authored release outcomes
        env:
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          bun tools/cli/scripts/release-notes.ts --version "$TAG" \
            --contract /tmp/contract/release-notes.md --out /tmp/release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          if PUBLISHED="$(gh release view "$TAG" --json isDraft --jq '.isDraft == false' 2>/dev/null)"; then
            test "$PUBLISHED" = true || { echo '::error::A draft release already exists; reconcile it before retrying'; exit 1; }
            echo "Published release already exists, preserving its notes and assets"
          else
            gh release create "$TAG" \
              --target "$SOURCE_SHA" \
              --title "Tale $TAG" \
              --notes-file /tmp/release-notes.md \
              --generate-notes
          fi
          TAG_SHA="$(gh api "repos/${REPOSITORY}/commits/refs%2Ftags/${TAG}" --jq .sha)"
          if [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Release tag ${TAG} resolves to ${TAG_SHA}, expected ${SOURCE_SHA}"; exit 1
          fi

  # ---------------------------------------------------------------------------
  # Kick off the CLI build workflow to attach binaries to the release.
  # ---------------------------------------------------------------------------
  trigger-cli:
    if: needs.prepare.outputs.sites_only != 'true'
    name: Trigger CLI build
    # The CLI workflow resolves its source from the release tag. A dispatched
    # release creates that tag in create-release, so do not dispatch it in
    # parallel with the publication job.
    needs: [prepare, manifest, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read

    steps:
      - name: Dispatch CLI workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          gh workflow run cli.yml \
            --repo "$REPO" \
            --ref "$RELEASE_TAG" \
            --field "release_tag=$RELEASE_TAG"

  # ---------------------------------------------------------------------------
  # Final summary for the release.
  # ---------------------------------------------------------------------------
  summary:
    if: >-
      always() && needs.manifest.result == 'success' &&
      (needs.prepare.outputs.sites_only == 'true' ||
       (needs.create-release.result == 'success' && needs.trigger-cli.result == 'success'))
    name: Summary
    needs: [prepare, create-release, manifest, trigger-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Write summary
        env:
          SERVICE_NAMES: ${{ needs.prepare.outputs.service_names }}
          SITES_ONLY: ${{ needs.prepare.outputs.sites_only }}
          VERSION: ${{ needs.prepare.outputs.version_number }}
          IMAGE_ROOT: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          {
            echo "## Release ${VERSION} complete"
            echo
            echo "Selected images were built, tested and published for native amd64 + arm64."
            echo
            echo '| Service | Image |'
            echo '|---------|-------|'
            while IFS= read -r svc; do
              echo "| ${svc} | \`${IMAGE_ROOT}/tale-${svc}:${VERSION}\` |"
            done < <(jq -r '.[]' <<< "$SERVICE_NAMES")
            echo
            if [ "$SITES_ONLY" = true ]; then
              echo 'Content-site release: platform, CLI, GitHub releases and latest tags were preserved.'
            else
              echo "CLI build triggered for \`v${VERSION}\`."
              echo
              echo '```bash'
              echo "./scripts/deploy.sh deploy v${VERSION}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
