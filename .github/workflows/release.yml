name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.*.*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string
      sites_only:
        description: 'Build web/docs/ui-docs only; keep platform, CLI and latest tags unchanged'
        required: false
        type: boolean
        default: false

# Releases must not cancel mid-flight (partial manifests would break deploys).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the version string used by every downstream job.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_number: ${{ steps.version.outputs.version_number }}
      sites_only: ${{ steps.version.outputs.sites_only }}
      services: ${{ steps.version.outputs.services }}
      service_names: ${{ steps.version.outputs.service_names }}

    steps:
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          SITES_ONLY: ${{ inputs.sites_only || false }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION_NUMBER="${VERSION#v}"
          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo '::error::Version must be an exact semantic version'; exit 1
          fi
          # Start the longest native builds first within the bounded matrix.
          SERVICE_NAMES='["sandbox-runtime","platform","db","web","docs","ui-docs","ai-gateway","proxy","sandbox-llm-gateway","sandbox","sandbox-egress","sandbox-buildkitd"]'
          if [ "$SITES_ONLY" = true ]; then SERVICE_NAMES='["web","docs","ui-docs"]'; fi
          {
            echo "sites_only=$SITES_ONLY"
            echo "service_names=$SERVICE_NAMES"
            echo "services=$(jq -c 'map({name:.})' <<< "$SERVICE_NAMES")"
            echo "version=v${VERSION_NUMBER}"
            echo "version_number=${VERSION_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      # Limit the checkout to the notes and their standalone validator.
      - name: Checkout release notes
        if: steps.version.outputs.sites_only != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/release-notes
            tools/cli/scripts/release-notes.ts
          sparse-checkout-cone-mode: false

      - name: Setup Bun for release notes
        if: steps.version.outputs.sites_only != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Validate authored release notes before building
        if: steps.version.outputs.sites_only != 'true'
        shell: bash
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: bun tools/cli/scripts/release-notes.ts --version "$TAG"

      - name: Summary
        run: |
          {
            echo "## Release Version"
            echo "- **Version**: ${{ steps.version.outputs.version }}"
            echo "- **Version Number**: ${{ steps.version.outputs.version_number }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build and push each service image per architecture on native runners.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.service.name }} (${{ matrix.arch.name }})
    needs: prepare
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
        arch:
          - { name: amd64, runner: ubuntu-latest, platform: linux/amd64 }
          - { name: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Reclaim disk space
        if: matrix.service.name == 'platform' || matrix.service.name == 'sandbox-runtime'
        env:
          MIN_FREE_GIB: '40'
        run: &reclaim-release-disk |
          set -euo pipefail
          case "$MIN_FREE_GIB" in
            20|28|40) ;;
            *) echo '::error::Invalid CI disk target'; exit 1 ;;
          esac
          MIN_FREE_KB=$((MIN_FREE_GIB * 1024 * 1024))
          measure_space() {
            df -h /
            AVAILABLE_KB=$(df -Pk / | awk 'NR == 2 { print $4 }')
            if [[ ! "$AVAILABLE_KB" =~ ^[0-9]+$ ]]; then
              echo '::error::Could not measure free disk space'; exit 1
            fi
            echo "Available: ${AVAILABLE_KB} KiB; cleanup target: ${MIN_FREE_GIB} GiB"
          }
          measure_space
          if [ "$AVAILABLE_KB" -ge "$MIN_FREE_KB" ]; then exit 0; fi
          # Stop once the next build/pull has headroom. Deleting all installed
          # toolchains took 50–119s even when the image build was cached.
          for DIRECTORY in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            sudo rm -rf -- "$DIRECTORY"
            measure_space
            if [ "$AVAILABLE_KB" -ge "$MIN_FREE_KB" ]; then exit 0; fi
          done
          sudo docker image prune -af
          measure_space
          # Preserve the old cold-build fallback after exhausting its cleanup.
          # The target controls when to stop deleting; it is not a runner quota.
          if [ "$AVAILABLE_KB" -lt "$MIN_FREE_KB" ]; then
            echo '::warning::Full CI disk cleanup completed below the headroom target'
          fi

      - name: Setup Docker builder
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          cleanup: false

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: meta
        run: |
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: services/${{ matrix.service.name }}/Dockerfile
          platforms: ${{ matrix.arch.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service.name }}:${{ needs.prepare.outputs.version_number }}-${{ matrix.arch.name }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version_number }}
          # Only trusted releases write these separate per-service cache images.
          # Architecture tags keep the native builders from replacing each other.
          # amd64 also imports the GHA cache CI warms on main.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service.name }}-buildcache:${{ matrix.arch.name }}
            ${{ matrix.arch.name == 'amd64' && format('type=gha,scope={0}', matrix.service.name) || '' }}
          # A cache outage must not invalidate a successfully pushed image.
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service.name }}-buildcache:${{ matrix.arch.name }},mode=max,ignore-error=true
          # `labels:` replaces Dockerfile LABEL (not merges). The CLI reads
          # org.opencontainers.image.version to detect the running instance;
          # omitting it made every in-place 0.4.x deploy look like an unknown
          # (hence pre-0.4) instance and trip the breaking-cutover guard.
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version_number }}
          provenance: false

      - name: Setup Bun for document checks
        if: matrix.service.name == 'sandbox-runtime'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Verify native document tools
        if: matrix.service.name == 'sandbox-runtime'
        env:
          DOCUMENT_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/tale-sandbox-runtime:${{ needs.prepare.outputs.version_number }}-${{ matrix.arch.name }}@${{ steps.image.outputs.digest }}
          DOCUMENT_PLATFORM: ${{ matrix.arch.platform }}
          DOCUMENT_REVISION: ${{ steps.meta.outputs.revision }}
          DOCUMENT_VERSION: ${{ needs.prepare.outputs.version_number }}
          DOCUMENT_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$DOCUMENT_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ "$DOCUMENT_PLATFORM" == linux/amd64 || "$DOCUMENT_PLATFORM" == linux/arm64 ]] || exit 1
          docker pull --platform "$DOCUMENT_PLATFORM" "$DOCUMENT_IMAGE"
          LABELS=$(docker image inspect --format '{{json .Config.Labels}}' "$DOCUMENT_IMAGE")
          jq -e --arg revision "$DOCUMENT_REVISION" --arg version "$DOCUMENT_VERSION" --arg source "$DOCUMENT_SOURCE" \
            '."org.opencontainers.image.revision" == $revision and ."org.opencontainers.image.version" == $version and ."org.opencontainers.image.source" == $source' <<< "$LABELS" > /dev/null
          # Both checks use anonymous, offline read-only containers with their
          # own tmpfs. Await both even when the first UID fails.
          # JavaScript owns the template interpolation.
          # shellcheck disable=SC2016
          bun -e '
            import { checkDocumentTools } from "./services/platform/tests/integration/lib/document-tools.ts";
            const image = process.env.DOCUMENT_IMAGE;
            const platform = process.env.DOCUMENT_PLATFORM;
            if (!image || (platform !== "linux/amd64" && platform !== "linux/arm64")) {
              throw new Error("Invalid native document check inputs");
            }
            const uids = [65534, 10001];
            const checks = await Promise.allSettled(uids.map(uid => checkDocumentTools(image, uid, platform)));
            let failed = false;
            for (const [index, check] of checks.entries()) {
              console.log(`Document tools as uid ${uids[index]}`);
              if (check.status === "rejected") {
                console.error(check.reason);
                failed = true;
              } else {
                console.log(check.value.combined.trim());
                failed ||= check.value.exitCode !== 0;
              }
            }
            if (failed) process.exitCode = 1;
          '

  # ---------------------------------------------------------------------------
  # Gate: validate built images with the same tests CI runs on PRs.
  # ---------------------------------------------------------------------------
  container-test:
    name: Container test gate
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Reclaim disk space if needed
        env:
          MIN_FREE_GIB: ${{ needs.prepare.outputs.sites_only == 'true' && '20' || '40' }}
        run: *reclaim-release-disk

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull release images
        env:
          SERVICE_NAMES: ${{ needs.prepare.outputs.service_names }}
          REGISTRY_PATH: ${{ env.REGISTRY }}/${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_TAG: ${{ needs.prepare.outputs.version_number }}-amd64
        run: |
          set -euo pipefail
          read -r -a SERVICES <<< "$(jq -r 'join(" ")' <<< "$SERVICE_NAMES")"
          bash .github/scripts/pull-ci-images.sh "${SERVICES[@]}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      # Image probes use disposable offline containers; the smoke test owns
      # the tale-test Compose project. Reuse the same accepted image set.
      - name: Run stack validation
        if: needs.prepare.outputs.sites_only != 'true'
        env:
          PULL_POLICY: never
          SKIP_BUILD: 'true'
          SMOKE_TEST_TIMEOUT: 300
        run: |
          set -euo pipefail
          LOG_DIR=$(mktemp -d "${RUNNER_TEMP}/release-validation.XXXXXX")
          bun services/platform/tests/integration/container-image-test.ts > "${LOG_DIR}/images.log" 2>&1 &
          IMAGES_PID=$!
          bun services/platform/tests/integration/container-smoke-test.ts > "${LOG_DIR}/smoke.log" 2>&1 &
          SMOKE_PID=$!
          FAILED=0
          if ! wait "$IMAGES_PID"; then FAILED=1; fi
          if ! wait "$SMOKE_PID"; then FAILED=1; fi
          for SUITE in images smoke; do
            echo "::group::Release ${SUITE} validation"
            cat "${LOG_DIR}/${SUITE}.log"
            echo '::endgroup::'
          done
          exit "$FAILED"

      # These projects have unique container names, volumes and ports13001–13004.
      - name: Run standalone container tests
        env:
          PULL_POLICY: never
          SKIP_BUILD: 'true'
          SITES_ONLY: ${{ needs.prepare.outputs.sites_only }}
        run: |
          set -euo pipefail
          LOG_DIR=$(mktemp -d "${RUNNER_TEMP}/release-validation.XXXXXX")
          SERVICES=(web docs ui-docs)
          if [ "$SITES_ONLY" != true ]; then SERVICES+=(ai-gateway); fi
          PIDS=()
          for SERVICE in "${SERVICES[@]}"; do
            bun "services/platform/tests/integration/container-${SERVICE}-test.ts" > "${LOG_DIR}/${SERVICE}.log" 2>&1 &
            PIDS+=("$!")
          done
          FAILED=0
          for PID in "${PIDS[@]}"; do
            if ! wait "$PID"; then FAILED=1; fi
          done
          for SERVICE in "${SERVICES[@]}"; do
            echo "::group::Release ${SERVICE} container validation"
            cat "${LOG_DIR}/${SERVICE}.log"
            echo '::endgroup::'
          done
          exit "$FAILED"

      - name: Upload release validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-validation-logs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-validation.*/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Container Test Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Release image validation status: ${{ job.status }} (${{ needs.prepare.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Create multi-arch manifests (:version and :latest) per service.
  # ---------------------------------------------------------------------------
  manifest:
    name: Manifest ${{ matrix.service }}
    needs: [prepare, build, container-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    strategy:
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.service_names) }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          SITES_ONLY: ${{ needs.prepare.outputs.sites_only }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/tale-${{ matrix.service }}"
          VERSION="${{ needs.prepare.outputs.version_number }}"

          docker manifest create ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          docker manifest push ${IMAGE}:${VERSION}
          docker manifest inspect ${IMAGE}:${VERSION} >/dev/null
          if [ "$SITES_ONLY" != true ]; then
            docker manifest create ${IMAGE}:latest \
              ${IMAGE}:${VERSION}-amd64 \
              ${IMAGE}:${VERSION}-arm64
            docker manifest push ${IMAGE}:latest
          fi

          {
            echo "### ${{ matrix.service }}"
            echo "- **Version**: ${VERSION}"
            echo "- **Revision**: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Create the GitHub release after manifests are verified.
  # ---------------------------------------------------------------------------
  create-release:
    if: needs.prepare.outputs.sites_only != 'true'
    name: Create release
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The contract-changes section compares this tag with the previous
          # one (`git describe`), so the whole tag history is needed.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Verify manifests are pullable
        env:
          VERSION: ${{ needs.prepare.outputs.version_number }}
          REGISTRY_PATH: ${{ env.REGISTRY }}/${{ github.repository }}
          SERVICE_NAMES: ${{ needs.prepare.outputs.service_names }}
        run: |
          set -euo pipefail
          SERVICE_TEXT=$(jq -er 'if type == "array" and length > 0 and all(.[]; type == "string" and test("^[a-z0-9]+(-[a-z0-9]+)*$")) then join(" ") else error("Invalid services") end' <<< "$SERVICE_NAMES")
          read -r -a SERVICES <<< "$SERVICE_TEXT"
          PIDS=()
          for ((WORKER = 0; WORKER < 3 && WORKER < ${#SERVICES[@]}; WORKER++)); do
            (
              FAILED=0
              for ((INDEX = WORKER; INDEX < ${#SERVICES[@]}; INDEX += 3)); do
                IMAGE="${REGISTRY_PATH}/tale-${SERVICES[$INDEX]}:${VERSION}"
                echo "Verifying manifest: ${IMAGE}"
                if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
                  echo "::error::Manifest not found: ${IMAGE}"
                  FAILED=1
                fi
              done
              exit "$FAILED"
            ) &
            PIDS+=("$!")
          done
          FAILED=0
          for PID in "${PIDS[@]}"; do
            if ! wait "$PID"; then FAILED=1; fi
          done
          [ "$FAILED" -eq 0 ] || exit 1
          echo "All service manifests verified"

      # The "API contract changes" section the API reference promises for
      # every release: generated from the contract fingerprint at the
      # previous tag and this one, never hand-written (v0.5.49–v0.5.55
      # shipped the 1.21.0 bump under a bare "What's Changed" list). The
      # section follows authored highlights and precedes GitHub's generated notes.
      - name: Describe API contract changes
        env:
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          FINGERPRINT=services/platform/scripts/openapi/contract-fingerprint.json
          OPENAPI=services/platform/public/openapi.json
          CHANGELOG=services/platform/lib/shared/constants/api-contract.ts
          # A dispatched release names a tag the checkout may not sit on.
          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" > /dev/null; then
            AT="refs/tags/${TAG}"
          else
            echo "::warning::tag ${TAG} is not in the checkout; comparing HEAD with its previous tag"
            AT="HEAD"
          fi
          PREV="$(git describe --tags --abbrev=0 "${AT}^" 2>/dev/null || true)"
          echo "Comparing the contract at ${AT} with ${PREV:-<no previous tag>}"
          mkdir -p /tmp/contract
          git show "${AT}:${FINGERPRINT}" > /tmp/contract/current-fingerprint.json
          git show "${AT}:${OPENAPI}" > /tmp/contract/current-openapi.json
          git show "${AT}:${CHANGELOG}" > /tmp/contract/current-changelog.ts
          if [ -n "${PREV}" ]; then
            git show "${PREV}:${FINGERPRINT}" > /tmp/contract/previous-fingerprint.json || true
            git show "${PREV}:${OPENAPI}" > /tmp/contract/previous-openapi.json || true
          fi
          bun services/platform/scripts/openapi/contract-notes.ts \
            --previous-tag "${PREV:-(none)}" \
            --previous-fingerprint /tmp/contract/previous-fingerprint.json \
            --previous-openapi /tmp/contract/previous-openapi.json \
            --current-fingerprint /tmp/contract/current-fingerprint.json \
            --current-openapi /tmp/contract/current-openapi.json \
            --changelog /tmp/contract/current-changelog.ts \
            --out /tmp/contract/release-notes.md

      - name: Lead with authored release outcomes
        env:
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          bun tools/cli/scripts/release-notes.ts --version "$TAG" \
            --contract /tmp/contract/release-notes.md --out /tmp/release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if PUBLISHED="$(gh release view "$TAG" --json isDraft --jq '.isDraft == false' 2>/dev/null)"; then
            test "$PUBLISHED" = true || { echo '::error::A draft release already exists; reconcile it before retrying'; exit 1; }
            echo "Published release already exists, preserving its notes and assets"
          else
            gh release create "$TAG" \
              --title "Tale $TAG" \
              --notes-file /tmp/release-notes.md \
              --generate-notes
          fi

  # ---------------------------------------------------------------------------
  # Kick off the CLI build workflow to attach binaries to the release.
  # ---------------------------------------------------------------------------
  trigger-cli:
    if: needs.prepare.outputs.sites_only != 'true'
    name: Trigger CLI build
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read

    steps:
      - name: Dispatch CLI workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          gh workflow run cli.yml \
            --repo "$REPO" \
            --ref "$RELEASE_TAG" \
            --field "release_tag=$RELEASE_TAG"

  # ---------------------------------------------------------------------------
  # Final summary for the release.
  # ---------------------------------------------------------------------------
  summary:
    if: >-
      always() && needs.manifest.result == 'success' &&
      (needs.prepare.outputs.sites_only == 'true' ||
       (needs.create-release.result == 'success' && needs.trigger-cli.result == 'success'))
    name: Summary
    needs: [prepare, create-release, manifest, trigger-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Write summary
        env:
          SERVICE_NAMES: ${{ needs.prepare.outputs.service_names }}
          SITES_ONLY: ${{ needs.prepare.outputs.sites_only }}
          VERSION: ${{ needs.prepare.outputs.version_number }}
          IMAGE_ROOT: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          {
            echo "## Release ${VERSION} complete"
            echo
            echo "Selected images were built, tested and published for native amd64 + arm64."
            echo
            echo '| Service | Image |'
            echo '|---------|-------|'
            while IFS= read -r svc; do
              echo "| ${svc} | \`${IMAGE_ROOT}/tale-${svc}:${VERSION}\` |"
            done < <(jq -r '.[]' <<< "$SERVICE_NAMES")
            echo
            if [ "$SITES_ONLY" = true ]; then
              echo 'Content-site release: platform, CLI, GitHub releases and latest tags were preserved.'
            else
              echo "CLI build triggered for \`v${VERSION}\`."
              echo
              echo '```bash'
              echo "./scripts/deploy.sh deploy v${VERSION}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
