name: Commitlint

run-name: ${{ github.event_name == 'repository_dispatch' && format('Release candidate {0}', github.event.client_payload.candidate_sha) || '' }}

on:
  merge_group:
    types: [checks_requested]
  repository_dispatch:
    types: [release-candidate]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - ci/tale664-canary-base-20261007
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && format('candidate-{0}', github.event.client_payload.candidate_sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}

jobs:
  # Only candidates need remote source validation; ordinary jobs keep their event SHA.
  candidate-source:
    if: >-
      github.event_name == 'repository_dispatch'
    name: Candidate source
    uses: ./.github/workflows/release-candidate-source.yml
    permissions:
      contents: read
    with:
      candidate: ${{ github.event_name == 'repository_dispatch' }}
      candidate_sha: ${{ github.event.client_payload.candidate_sha }}

  commitlint:
    needs: candidate-source
    name: Lint commits
    if: >-
      !cancelled() &&
      (((github.event_name == 'repository_dispatch') &&
      needs.candidate-source.result == 'success') ||
      ((github.event_name != 'repository_dispatch') &&
      needs.candidate-source.result == 'skipped')) &&
      (github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}
          # A candidate lints one commit; PR/push ranges retain full history.
          fetch-depth: ${{ github.event_name == 'repository_dispatch' && 1 || 0 }}
          # Ranges need commit messages, never historical file contents.
          filter: blob:none
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          start-turbo-cache: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          turbo-cache: 'false'

      - name: Run commitlint
        # PR: lint the branch range. Push: lint the pushed range; a forced or
        # history-less push (all-zero `before`) degrades to the last commit.
        # Candidate: lint C itself, never the workflow head H or a tag input.
        # Merge queue: lint its actual group base-to-head source range.
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ needs.candidate-source.outputs.candidate_sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            git show -s --format=%B "$CANDIDATE_SHA" | bunx commitlint --verbose
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            bunx commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if [[ ! "$GROUP_BASE" =~ ^[a-f0-9]{40}$ ]] || [[ ! "$GROUP_HEAD" =~ ^[a-f0-9]{40}$ ]] || [ "$GROUP_HEAD" != "$PUSH_SHA" ]; then
              echo "::error::Merge group must supply its exact base and head"; exit 1
            fi
            bunx commitlint --from "$GROUP_BASE" --to "$GROUP_HEAD" --verbose
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            bunx commitlint --last --verbose
          else
            bunx commitlint --from "$PUSH_BEFORE" --to "$PUSH_SHA" --verbose
          fi

  candidate-gate:
    name: Candidate gate
    needs: [candidate-source, commitlint]
    if: always() && github.event_name == 'repository_dispatch'
    uses: ./.github/workflows/release-candidate-receipt.yml
    permissions: {}
    with:
      candidate_sha: ${{ github.event.client_payload.candidate_sha }}
      workflow: .github/workflows/commitlint.yml
      jobs: ${{ toJSON(needs) }}

  # A required context must execute even when an upstream check failed/skipped.
  ci-ready:
    name: CI ready (Commitlint)
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [candidate-source, commitlint, candidate-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout verdict policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/ci-ready/action.yml
            /tools/cli/scripts/ci-ready.ts
          sparse-checkout-cone-mode: false
      - name: Evaluate native workflow
        uses: ./.github/actions/ci-ready
        with:
          workflow: commitlint
          jobs: ${{ toJSON(needs) }}
