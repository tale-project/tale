name: Update model catalog

# Weekly sync of the shipped provider model defaults from OpenRouter's public
# catalog. Refreshes capability fields, adds newly-released flagship frontier
# models, and hides superseded older versions, then opens (or updates) a PR for
# human review. The in-instance Convex cron does the same for running
# deployments; this keeps the shipped defaults current.
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: update-model-catalog
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Sync + open PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Optional PAT (`MODELS_BOT_TOKEN`) so the opened PR triggers CI;
          # falls back to GITHUB_TOKEN (whose PRs don't trigger other workflows).
          token: ${{ secrets.MODELS_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          start-turbo-cache: 'false'

      - name: Sync model catalog
        run: |
          MODEL_SYNC_BODY_PATH="${RUNNER_TEMP}/pr-body.md" \
            bun run services/platform/scripts/update-model-catalog.ts
          # Match repo formatting so the diff is clean.
          bunx oxfmt builtin-configs/providers/*.json || true

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain builtin-configs/providers)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes — nothing to do."
          fi

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MODELS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="automated/model-catalog-sync"
          TITLE="chore(models): weekly model-catalog sync"
          BODY_PATH="${RUNNER_TEMP}/pr-body.md"
          [ -f "$BODY_PATH" ] || echo "Automated weekly model-catalog sync." > "$BODY_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add builtin-configs/providers
          # --no-verify: skip any husky hooks `bun install` may have registered.
          git commit --no-verify -m "$TITLE"
          # Bot-owned branch, recreated from HEAD each run → a plain force push is
          # correct (force-with-lease can reject a first push with "stale info").
          git push --force origin "$BRANCH"

          # Idempotent label so --label never fails on a fresh repo.
          gh label create automated --color ededed \
            --description "Opened by an automation" 2>/dev/null || true

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$BODY_PATH"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "$TITLE" --body-file "$BODY_PATH" --label automated
          fi
