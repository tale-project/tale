name: Cleanup PR images

# When a PR closes (merged or otherwise), delete every GHCR container version
# whose tags all belong to `pr-{number}-sha-{full SHA}`. Shared versions with
# main, release, candidate or another PR's tags are retained. The build job pushes
# one such tag per push to a PR, so they accumulate fast without cleanup.
#
# Tags from main / merge_group runs use the `sha-…` prefix, and release
# candidates (.github/RELEASING.md) use `candidate-sha-…`; neither is deleted
# here. Manage their lifecycle separately if needed.

on:
  pull_request:
    types: [closed]

permissions:
  packages: write

concurrency:
  group: cleanup-pr-images-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delete:
    name: Delete ${{ matrix.service }} PR tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Compose-stack services. Keep in sync with build.yml (build matrix +
        # smoke/validate pull loops); tools/cli/scripts/deployment-ci.test.ts
        # fails when this list and the build matrix differ.
        service:
          [
            db,
            platform,
            proxy,
            sandbox-llm-gateway,
            sandbox,
            sandbox-egress,
            sandbox-buildkitd,
            sandbox-runtime,
          ]

    steps:
      - name: Delete PR-tagged versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SVC: ${{ matrix.service }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # GHCR package names URL-encode the slash: `tale/tale-{svc}` → `tale%2Ftale-{svc}`.
          PACKAGE="tale%2Ftale-${SVC}"
          PREFIX="pr-${PR}-sha-"
          if [[ ! "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Cleanup requires a positive pull request number'; exit 1
          fi
          TAG_PATTERN="^${PREFIX}[a-f0-9]{40}$"
          # gh-api writes its error, status included ("… (HTTP 404)"), to
          # stderr; both loops below read the status from this file.
          task_directory=$(mktemp -d)
          err_log="$task_directory/list.stderr"
          pids=()
          trap 'for pid in ${pids[@]+"${pids[@]}"}; do kill "$pid" 2>/dev/null || true; done; for pid in ${pids[@]+"${pids[@]}"}; do wait "$pid" 2>/dev/null || true; done; rm -rf "$task_directory"' EXIT

          echo "Looking up versions of ${OWNER}/${PACKAGE} tagged ${PREFIX}*"

          # Retry the listing call up to 3 times for transient 5xx / network
          # blips. An error that outlasts the retries (a 403, say) fails the
          # step rather than being silently swallowed. A 404 is not retried:
          # the matrix tracks build.yml (deployment-ci.test.ts), so the
          # package was either never pushed (a new service's first PR image)
          # or does not grant this repository Actions access. Either way
          # there is nothing this token can clean, so the job ends green with
          # a warning that names both causes: the second leaves PR tags behind.
          #
          # NOTE: build.yml currently sets `platforms: linux/amd64` and
          # `provenance: false`, so each tag corresponds to exactly one OCI
          # image manifest with no untagged children. If build.yml ever
          # switches to multi-arch or re-enables provenance attestations,
          # this filter will leak untagged child manifest versions; extend
          # with a second pass over `metadata.container.tags == []`.
          VERSION_IDS=""
          for attempt in 1 2 3; do
            if VERSION_IDS=$(gh api -H "Accept: application/vnd.github+json" \
              "/orgs/${OWNER}/packages/container/${PACKAGE}/versions" \
              --paginate \
              --jq "[.[] | select((.metadata.container.tags | length) > 0 and all(.metadata.container.tags[]; test(\"${TAG_PATTERN}\"))) | .id] | .[]" \
              2>"${err_log}"); then
              break
            fi
            cat "${err_log}" >&2
            if grep -q "HTTP 404" "${err_log}"; then
              echo "::warning::Package tale-${SVC} not found or not visible to this token (HTTP 404); nothing cleaned. Either its first image was never pushed, or this repository lost Actions access to it (package settings > Manage Actions access)."
              {
                echo "## Cleanup tale-${SVC}"
                echo ""
                echo "package tale-${SVC} was not found or is not visible to this token; no versions cleaned"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "List attempt ${attempt} failed, retrying after $((attempt * 2))s..."
              sleep $((attempt * 2))
            else
              echo "::error::Failed to list versions of ${PACKAGE} after 3 attempts"
              exit 1
            fi
          done

          if [ -z "${VERSION_IDS}" ]; then
            echo "No matching versions found for tale-${SVC}."
            {
              echo "## Cleanup tale-${SVC}"
              echo ""
              echo "No \`${PREFIX}*\` versions found — nothing to delete."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          deleted=0
          already_gone=0
          preserved=0
          failures=0
          worker_failed=false
          # Validate and deduplicate the complete listing before starting writes.
          while read -r version_id; do
            if [[ ! "$version_id" =~ ^[1-9][0-9]*$ ]]; then
              echo '::error::Package listing returned an invalid version ID'; exit 1
            fi
          done <<< "$VERSION_IDS"
          VERSION_IDS=$(awk '!seen[$0]++' <<< "$VERSION_IDS")

          clean_version() {
            trap - EXIT
            local version_id="$1"
            local error_log="$task_directory/$version_id.stderr"
            local result="$task_directory/$version_id.result"
            local still_owned
            # Tags may change between the listing and this worker. Refuse to
            # delete a newly shared version; a failed read never permits DELETE.
            if still_owned=$(gh api \
                "/orgs/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}" \
                --jq "if (.metadata.container.tags | type) != \"array\" then error(\"Missing container tags\") else (.metadata.container.tags | length > 0 and all(.[]; test(\"${TAG_PATTERN}\"))) end" \
                2>"$error_log"); then
              if [ "$still_owned" != true ]; then
                printf 'preserved\n' > "$result"
                return
              fi
            elif grep -q 'HTTP 404' "$error_log"; then
              printf 'already_gone\n' > "$result"
              return
            else
              cat "$error_log" >&2
              printf 'failed\n' > "$result"
              return
            fi

            echo "Deleting version ${version_id}..."
            if gh api -X DELETE \
                "/orgs/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}" \
                --silent 2>"$error_log"; then
              printf 'deleted\n' > "$result"
            elif grep -q 'HTTP 404' "$error_log"; then
              printf 'already_gone\n' > "$result"
            else
              cat "$error_log" >&2
              printf 'failed\n' > "$result"
            fi
          }
          # Eight service jobs share the API: at most three workers per job.
          # Every worker owns its diagnostics and is joined even after failures.
          while read -r version_id; do
            clean_version "$version_id" &
            pids+=("$!")
            if [ "${#pids[@]}" -eq 3 ]; then
              for pid in ${pids[@]+"${pids[@]}"}; do
                if ! wait "$pid"; then worker_failed=true; fi
              done
              pids=()
            fi
          done <<< "${VERSION_IDS}"
          for pid in ${pids[@]+"${pids[@]}"}; do
            if ! wait "$pid"; then worker_failed=true; fi
          done
          pids=()
          while read -r version_id; do
            case "$(cat "$task_directory/$version_id.result" 2>/dev/null || true)" in
              deleted) deleted=$((deleted + 1)) ;;
              already_gone) already_gone=$((already_gone + 1)) ;;
              preserved) preserved=$((preserved + 1)) ;;
              *) failures=$((failures + 1)) ;;
            esac
          done <<< "${VERSION_IDS}"

          {
            echo "## Cleanup tale-${SVC}"
            echo ""
            echo "- Deleted: ${deleted}"
            echo "- Already gone (404): ${already_gone}"
            echo "- Shared versions preserved: ${preserved}"
            echo "- Failures: ${failures}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${failures}" -gt 0 ] || [ "$worker_failed" = true ]; then
            echo "::error::${failures} deletion(s) failed for tale-${SVC}"
            exit 1
          fi
