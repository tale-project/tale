name: E2E

# Playwright full-app smoke suite (services/platform/e2e). Boots the real
# stack (anonymous Convex + Vite) with the hermetic fixture config and the
# mock LLM — no external services, no provider keys.
#
# Burn-in policy (issue #179): PR runs are advisory (`continue-on-error`) and
# the check is NOT required for merge; the nightly run is strict. Promote the
# PR job to a required check once the suite has proven stable for ~2 weeks.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/platform/**'
      - 'packages/ui/**'
      - '.github/workflows/e2e.yml'
      - '.github/actions/setup-turbo/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'tsconfig.base.json'
  schedule:
    # Nightly at 02:30 UTC.
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (shard ${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory during burn-in: a red E2E run annotates the PR but never blocks
    # it. Nightly and manual runs fail loudly.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    # The suite outgrew a single serial 30-min run (workers:1 against one
    # backend). Shard the specs across parallel runners so each shard finishes
    # well inside the timeout instead of being cancelled mid-run. Each shard is
    # an independent job: it boots its own hermetic stack and runs the `setup`
    # auth project before its slice. fail-fast:false so one shard's failure
    # doesn't cancel the others — we want every shard's result.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # This job only reads/tests — don't leave the GITHUB_TOKEN in git config.
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-turbo
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-python: 'false'
          start-turbo-cache: 'false'

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Cache Convex local backend
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/convex
          key: convex-backend-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            convex-backend-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: services/platform
        run: bunx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: services/platform
        run: bunx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            services/platform/playwright-report/
            services/platform/test-results/
          retention-days: 14
          if-no-files-found: ignore
