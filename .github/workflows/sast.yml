name: SAST

# Strict, blocking source-level SAST (Opengrep). Unlike the dependency scans in
# security.yml (scoped to lockfiles + main), this runs on EVERY pull request
# (any target branch) whenever source changes, so feature branches can't slip
# code past the gate. The ruleset and pinned engine live in tools/opengrep/.

run-name: ${{ github.event_name == 'repository_dispatch' && format('Release candidate {0}', github.event.client_payload.candidate_sha) || '' }}

on:
  merge_group:
    types: [checks_requested]
  repository_dispatch:
    types: [release-candidate]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 2' # Tuesday 03:00 UTC (offset from the Monday dep scan)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && format('candidate-{0}', github.event.client_payload.candidate_sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}

permissions:
  contents: read

jobs:
  # Only candidates need remote source validation; ordinary jobs keep their event SHA.
  candidate-source:
    if: >-
      github.event_name == 'repository_dispatch'
    name: Candidate source
    uses: ./.github/workflows/release-candidate-source.yml
    permissions:
      contents: read
    with:
      candidate: ${{ github.event_name == 'repository_dispatch' }}
      candidate_sha: ${{ github.event.client_payload.candidate_sha }}

  sast:
    needs: candidate-source
    name: Opengrep
    if: >-
      !cancelled() &&
      (((github.event_name == 'repository_dispatch') &&
      needs.candidate-source.result == 'success') ||
      ((github.event_name != 'repository_dispatch') &&
      needs.candidate-source.result == 'skipped')) &&
      (github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate-source.outputs.candidate_sha }}
          persist-credentials: false

      - name: Cache Opengrep binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/opengrep
          key: opengrep-${{ runner.os }}-${{ hashFiles('tools/opengrep/run.sh') }}
          restore-keys: |
            opengrep-${{ runner.os }}-

      # The blocking gate: downloads the pinned engine (cached above), runs the
      # vendored ruleset, writes SARIF, and exits non-zero on any finding.
      # Repos without the opengrep port keep this identical file and self-skip.
      - name: Run Opengrep
        env:
          OPENGREP_SARIF_OUTPUT: opengrep.sarif
        run: |
          if [ ! -f tools/opengrep/run.sh ]; then
            echo "No tools/opengrep/run.sh in this repository — skipping the SAST gate."
            exit 0
          fi
          bash tools/opengrep/run.sh

      - name: Upload SARIF
        if: always() && github.event_name != 'repository_dispatch' && hashFiles('opengrep.sarif') != ''
        # Repos without code scanning (private plans lacking Advanced
        # Security) can't receive SARIF — the gate is the scan step above.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: opengrep.sarif
          category: opengrep

      - name: Summary
        if: always()
        run: |
          echo "## Opengrep SAST" >> "$GITHUB_STEP_SUMMARY"
          echo "Vendored ruleset (tools/opengrep/config.yml). Findings fail this required check; normal runs also upload them to the Security tab under \`opengrep\`." >> "$GITHUB_STEP_SUMMARY"

  candidate-gate:
    name: Candidate gate
    needs: [candidate-source, sast]
    if: always() && github.event_name == 'repository_dispatch'
    uses: ./.github/workflows/release-candidate-receipt.yml
    permissions: {}
    with:
      candidate_sha: ${{ github.event.client_payload.candidate_sha }}
      workflow: .github/workflows/sast.yml
      jobs: ${{ toJSON(needs) }}

  # A required context must execute even when an upstream check failed/skipped.
  ci-ready:
    name: CI ready (SAST)
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [candidate-source, sast, candidate-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout verdict policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Evaluate native workflow
        uses: ./.github/actions/ci-ready
        with:
          workflow: sast
          jobs: ${{ toJSON(needs) }}
