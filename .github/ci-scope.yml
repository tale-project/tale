  - "tools/cli/scripts/release-candidate*"
  - "services/**"
  - "packages/**"
  - "configs/platform/**"
  - "patches/**"
  - "tools/**/package.json"
  - "docs/**"
  - ".github/workflows/build.yml"
  - ".github/scripts/pull-ci-images.sh"
  - "tools/cli/scripts/check-sbom-hashes.ts"
  - ".github/actions/setup-turbo/**"
  - "compose*.yml"
  - "services/platform/tests/integration/container-*"
  - "services/platform/tests/integration/static-site-test.ts"
  - "services/platform/tests/integration/lib/**"
  - ".env.test"
  - "bunfig.toml"
  - "tsconfig*.json"
  - "turbo.json"
  - ".dockerignore"
  - "package.json"
  - "bun.lock"

guard:
  - .github/release-candidate-contract.json
  - tools/cli/scripts/release-candidate*
  - .github/ci-scope.yml
  - .github/actions/ci-scope/**
  - .github/actions/ci-ready/**
  - tools/cli/scripts/ci-ready.ts
  - tools/cli/scripts/ci-ready.test.ts
  - tools/cli/scripts/ci-ready-workflows.test.ts
all:
  - "**"
added:
  - added: "**"
deleted:
  - deleted: "**"

build_image_inputs:
  - "package.json"
  - "bun.lock"
  - "bunfig.toml"
  - "patches/**"
  - "packages/**/package.json"
  - "packages/shared/**"
  - "services/**/package.json"
