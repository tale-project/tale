  - ".github/workflows/build.yml"
  - "tools/cli/scripts/check-sbom-hashes.ts"
  - ".github/actions/setup-turbo/**"
  - "turbo.json"

build_platform:
  # These four standalone probes are excluded from Docker contexts
  # and run in their own jobs. One positive extglob retains every
  # other platform path under paths-filter's default OR semantics.
  - &platform_sources "services/platform/!(tests/integration/container-web-test.ts|tests/integration/container-docs-test.ts|tests/integration/container-ui-docs-test.ts|tests/integration/container-ai-gateway-test.ts)"
  - "services/db/migrations/knowledge-db/**"
  - "packages/ui/**"
  - "packages/shared/**"
  - "configs/platform/**"

build_db:
  - "services/db/**"

build_proxy:
  - "services/proxy/**"

build_sandbox-llm-gateway:
  - "services/sandbox-llm-gateway/**"

build_web:
  - "services/web/**"
  - "services/platform/tests/integration/container-web-test.ts"
