name: Set up Tale CLI from a commit
description: Build and install the existing Tale CLI from one exact source commit for Linux or macOS Apple Silicon configuration and deployment jobs.

inputs:
  revision:
    description: Full forty-character Tale source commit; branches and mutable tags are refused.
    required: true
  linux-baseline:
    description: Build the Linux x64 executable for CPUs without AVX2 (Bun's baseline target); accepted on Linux x64 runners only.
    required: false
    default: 'false'

outputs:
  executable:
    description: Absolute path to the compiled Tale executable, also added to PATH.
    value: ${{ steps.build.outputs.executable }}

runs:
  using: composite
  steps:
    - name: Validate the source pin and runner
      shell: bash
      env:
        TALE_CLI_REVISION: ${{ inputs.revision }}
        TALE_CLI_LINUX_BASELINE: ${{ inputs.linux-baseline }}
      run: |
        set -euo pipefail
        if [[ ! "$TALE_CLI_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
          echo '::error::Tale CLI revision must be a full source commit'; exit 1
        fi
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64|Linux/ARM64|macOS/ARM64) ;;
          *) echo '::error::Tale setup requires Linux or macOS Apple Silicon'; exit 1 ;;
        esac
        # Bun's baseline target exists for x64 only: it drops the AVX2
        # requirement of the default Linux x64 executable.
        TALE_CLI_LINUX_BASELINE="${TALE_CLI_LINUX_BASELINE:-false}"
        case "$TALE_CLI_LINUX_BASELINE" in
          true|false) ;;
          *) echo '::error::Tale setup linux-baseline must be true or false'; exit 1 ;;
        esac
        if [[ "$TALE_CLI_LINUX_BASELINE" == true && "$RUNNER_OS/$RUNNER_ARCH" != Linux/X64 ]]; then
          echo '::error::Tale setup linux-baseline requires a Linux x64 runner'; exit 1
        fi

    - name: Set up the Tale build toolchain
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: '1.4.2'

    - name: Read the selected Tale source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        repository: tale-project/tale
        ref: ${{ inputs.revision }}
        path: .tale-cli-source
        persist-credentials: false

    - name: Build and expose the Tale CLI
      id: build
      shell: bash
      working-directory: .tale-cli-source
      env:
        TALE_CLI_REVISION: ${{ inputs.revision }}
        TALE_CLI_LINUX_BASELINE: ${{ inputs.linux-baseline }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$TALE_CLI_REVISION"
        test -z "$(git status --porcelain --untracked-files=all)"
        bun install --frozen-lockfile --filter @tale/cli
        # Generation records the clean source commit in the executable.
        bun run --filter @tale/cli generate
        # The backend-local provision phase runs inside the target's backend
        # container, where a compiled executable cannot resolve the backend's
        # own node_modules (postgres, better-auth) that it dynamically imports.
        # Ship an interpreted bundle beside the executable; the container's own
        # bun runs it so those imports resolve. See copyDeploymentCli / apply.
        bun run --filter @tale/cli build:backend-local
        case "$RUNNER_OS/$RUNNER_ARCH/${TALE_CLI_LINUX_BASELINE:-false}" in
          Linux/X64/true) bun run --filter @tale/cli build:linux-baseline ;;
          Linux/X64/false) bun run --filter @tale/cli build:linux ;;
          Linux/ARM64/false) bun run --filter @tale/cli build:linux-arm64 ;;
          macOS/ARM64/false) bun run --filter @tale/cli build:mac ;;
          *) echo '::error::Unsupported Tale CLI runner or linux-baseline selection'; exit 1 ;;
        esac
        if [[ "$RUNNER_OS" == macOS ]]; then
          # Seal Bun's final bytes so a standard SIP-enabled target can run it.
          codesign --remove-signature tools/cli/dist/tale
          codesign -s - tools/cli/dist/tale
          codesign --verify --strict --verbose=2 tools/cli/dist/tale
        fi
        bun run --filter @tale/cli check:bundle
        test -z "$(git status --porcelain --untracked-files=all)"
        CLI_DIRECTORY="$(pwd)/tools/cli/dist"
        "$CLI_DIRECTORY/tale" deploy prepare --help >/dev/null
        printf '%s\n' "$CLI_DIRECTORY" >> "$GITHUB_PATH"
        printf 'executable=%s/tale\n' "$CLI_DIRECTORY" >> "$GITHUB_OUTPUT"
