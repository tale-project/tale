name: Setup toolchain
description: Bun + frozen dependencies and branch-scoped Turbo task caches

inputs:
  bun-version:
    description: Bun version
    # Floor 1.4.1. Earlier Bun ran N-API addon finalizers and cleanup hooks
    # inside process.exit() and could hand a still-queued threadsafe-function
    # call a null env; rolldown (Vite 8) is such an addon. The docs client
    # build stalled on roughly one CI run in fifteen after its last build
    # output and before `vite preview` started, and the evidence places that
    # stall at the build's explicit exit; the docs Playwright webServer then
    # timed out with zero tests run. The pin is hashed into every Turbo task
    # (`globalDependencies`), so a bump reruns the cached tasks under it.
    default: '1.4.2'
  turbo-cache:
    description: Restore and save the local Turbo task cache through GitHub Actions cache
    default: 'true'
  cache-scope:
    description: Task lane shared across jobs; defaults to the calling job ID. Matrix shards need distinct scopes.
    default: ''
  # Candidate workflows run at H but load this action from their checkout C.
  # Callers pass these legacy inputs so an older C explicitly disables its
  # artifact server. This implementation ignores both; native cache needs no
  # repository token and is controlled only by turbo-cache above.
  start-turbo-cache:
    description: Deprecated compatibility input for candidates before native task caching; keep false.
    default: 'false'
  github-token:
    description: Deprecated compatibility input for older candidate actions; unused here.
    required: false

runs:
  using: composite
  steps:
    - name: Disable third-party telemetry
      shell: bash
      # Persist to the job env so every later step (turbo runs, bun install,
      # storybook builds, scarf) inherits the opt-out. DO_NOT_TRACK is the
      # cross-tool standard (consoledonottrack.com); the rest are belt-and-braces.
      run: |
        {
          echo "DO_NOT_TRACK=1"
          echo "TURBO_TELEMETRY_DISABLED=1"
          echo "STORYBOOK_DISABLE_TELEMETRY=1"
          echo "SCARF_ANALYTICS=false"
          # GitHub's cache visibility isolates PR writes from main. Never
          # read repository-wide artifacts or a remote server for task cache.
          echo "TURBO_CACHE=local:rw"
        } >> "$GITHUB_ENV"

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Restore Bun install cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-

    - name: Install JS dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Identify the checked-out cache source
      if: inputs.turbo-cache == 'true'
      id: cache-source
      shell: bash
      run: |
        set -euo pipefail
        printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # One archive per task lane instead of one API upload/download per task.
    # A prefix hit restores prior task entries; Turbo still verifies each hash.
    # The lockfile/toolchain and lane never fall back across one another.
    # Distinct workflow writers avoid a platform-only E2E archive winning
    # the same immutable key as Checks' larger build archive. Both readers
    # can reuse an archive from the same source, then from an earlier source.
    - name: Restore Turbo task cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: .turbo/cache
        key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ inputs.cache-scope || github.job }}-${{ hashFiles('bun.lock') }}-${{ steps.cache-source.outputs.revision }}-${{ github.workflow }}
        restore-keys: |
          turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ inputs.cache-scope || github.job }}-${{ hashFiles('bun.lock') }}-${{ steps.cache-source.outputs.revision }}-
          turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ inputs.cache-scope || github.job }}-${{ hashFiles('bun.lock') }}-
