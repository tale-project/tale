name: Setup toolchain
description: Bun + frozen dependencies and branch-scoped Turbo task caches

inputs:
  bun-version:
    description: Bun version
    # Floor 1.4.1. Earlier Bun ran N-API addon finalizers and cleanup hooks
    # inside process.exit() and could hand a still-queued threadsafe-function
    # call a null env; rolldown (Vite 8) is such an addon. The docs client
    # build stalled on roughly one CI run in fifteen after its last build
    # output and before `vite preview` started, and the evidence places that
    # stall at the build's explicit exit; the docs Playwright webServer then
    # timed out with zero tests run. The pin is hashed into every Turbo task
    # (`globalDependencies`), so a bump reruns the cached tasks under it.
    default: '1.4.2'
  turbo-cache:
    description: Restore and save the local Turbo task cache through GitHub Actions cache
    default: 'true'
  cache-scope:
    description: Task lane shared across jobs; defaults to the calling job ID. Matrix jobs need distinct scopes or writers.
    default: ''
  cache-writer:
    description: Archive writer within the task lane; defaults to the calling job ID. Matrix jobs sharing a scope need distinct writers.
    default: ''
  # Candidate workflows run at H but load this action from their checkout C.
  # Callers pass these legacy inputs so an older C explicitly disables its
  # artifact server. This implementation ignores both; native cache needs no
  # repository token and is controlled only by turbo-cache above.
  start-turbo-cache:
    description: Deprecated compatibility input for candidates before native task caching; keep false.
    default: 'false'
  github-token:
    description: Deprecated compatibility input for older candidate actions; unused here.
    required: false

outputs:
  node-version:
    description: Exact Node version selected from the platform image
    value: ${{ steps.node.outputs.version }}

runs:
  using: composite
  steps:
    - name: Disable third-party telemetry
      shell: bash
      # Persist to the job env so every later step (turbo runs, bun install,
      # storybook builds, scarf) inherits the opt-out. DO_NOT_TRACK is the
      # cross-tool standard (consoledonottrack.com); the rest are belt-and-braces.
      run: |
        {
          echo "DO_NOT_TRACK=1"
          echo "TURBO_TELEMETRY_DISABLED=1"
          echo "STORYBOOK_DISABLE_TELEMETRY=1"
          echo "TELEMETRY_DISABLED=1"
          echo "SCARF_ANALYTICS=false"
          # GitHub's cache visibility isolates PR writes from main. Never
          # read repository-wide artifacts or a remote server for task cache.
          echo "TURBO_CACHE=local:rw"
        } >> "$GITHUB_ENV"

    - name: Bound hosted Turbo cache history
      if: inputs.turbo-cache == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Turbo's best-effort native eviction removes the oldest archives and
        # their sidecars at run startup. This is a 512 MiB starting target,
        # not a hard limit on the outputs written during that run.
        # Never apply eviction to a developer or persistent self-hosted cache.
        if [ "${GITHUB_ACTIONS:-}" = 'true' ] && [ "${RUNNER_ENVIRONMENT:-}" = 'github-hosted' ]; then
          {
            printf 'TURBO_CACHE_DIR=%s/.turbo/cache\n' "$GITHUB_WORKSPACE"
            echo "TURBO_CACHE_MAX_SIZE=512MB"
          } >> "$GITHUB_ENV"
        fi

    # Use the runtime the shipped platform runs, rather than whichever Node
    # the hosted runner image happened to select this week.
    - name: Resolve the platform's Node
      id: node
      shell: bash
      run: |
        set -euo pipefail
        version=$(sed -n 's/^FROM node:\([0-9][0-9.]*\)-.* AS node-bin$/\1/p' services/platform/Dockerfile)
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo '::error::services/platform/Dockerfile names no exact node-bin stage version'; exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ steps.node.outputs.version }}
        package-manager-cache: false

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Identify the actual task runtime
      shell: bash
      run: |
        set -euo pipefail
        distribution="$RUNNER_OS"
        if [ -f /etc/os-release ]; then
          distribution="$(. /etc/os-release; printf '%s-%s' "$ID" "$VERSION_ID")"
        fi
        printf 'TALE_CI_RUNTIME=%s-%s-%s-%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$distribution" "$(node --version)" "$(bun --version)" >> "$GITHUB_ENV"

    # Cache downloaded packages, not node_modules. A frozen install remains
    # authoritative even when a prior lockfile supplied the package payloads.
    - name: Restore Bun install cache
      id: bun-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ~/.bun/install/cache
        # The download store carries platform-specific package builds. Keep
        # architectures apart and move the exact key with workspace manifests
        # and patches as well as the lockfile; fallback downloads are still
        # validated by the frozen install below.
        key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'services/*/package.json', 'services/sandbox-runtime/daemon/package.json', 'configs/platform/custom/skills/*/package.json', 'tools/*/package.json', 'patches/**') }}
        restore-keys: |
          bun-install-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-

    - name: Install JS dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # Save successful downloads before a later check failure can prevent the
    # job's post steps. A failed install never reaches this normal step.
    - name: Save Bun install cache
      if: steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}

    - name: Identify the checked-out cache source
      if: inputs.turbo-cache == 'true'
      id: cache-source
      shell: bash
      run: |
        set -euo pipefail
        printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # One archive per task lane instead of one API upload/download per task.
    # A prefix hit restores prior task entries; Turbo still verifies each hash.
    # The lockfile/toolchain and lane never fall back across one another.
    # Workflow and writer identities keep concurrent jobs from competing for
    # one immutable archive, including matrix jobs sharing the build lane.
    # Readers reuse the lane's archives from this source, then earlier sources.
    - name: Restore Turbo task cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: .turbo/cache
        key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ inputs.cache-scope || github.job }}-${{ hashFiles('bun.lock') }}-${{ steps.cache-source.outputs.revision }}-${{ github.workflow }}-${{ inputs.cache-writer || github.job }}
        restore-keys: |
          turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ inputs.cache-scope || github.job }}-${{ hashFiles('bun.lock') }}-${{ steps.cache-source.outputs.revision }}-
          turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ inputs.cache-scope || github.job }}-${{ hashFiles('bun.lock') }}-
