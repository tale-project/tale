name: Setup toolchain
description: Bun + deps with cache, optional Turbo remote cache server

inputs:
  bun-version:
    description: Bun version
    # Floor 1.4.1. Earlier Bun ran N-API addon finalizers and cleanup hooks
    # inside process.exit() and could hand a still-queued threadsafe-function
    # call a null env; rolldown (Vite 8) is such an addon. The docs client
    # build stalled on roughly one CI run in fifteen after its last build
    # output and before `vite preview` started, and the evidence places that
    # stall at the build's explicit exit; the docs Playwright webServer then
    # timed out with zero tests run. The pin is hashed into every Turbo task
    # (`globalDependencies`), so a bump reruns the cached tasks under it.
    default: '1.4.2'
  start-turbo-cache:
    description: Start the Turborepo GH artifacts cache server
    default: 'true'
  github-token:
    description: GitHub token for turbo cache
    required: true

runs:
  using: composite
  steps:
    - name: Disable third-party telemetry
      shell: bash
      # Persist to the job env so every later step (turbo runs, bun install,
      # storybook builds, scarf) inherits the opt-out. DO_NOT_TRACK is the
      # cross-tool standard (consoledonottrack.com); the rest are belt-and-braces.
      run: |
        {
          echo "DO_NOT_TRACK=1"
          echo "TURBO_TELEMETRY_DISABLED=1"
          echo "STORYBOOK_DISABLE_TELEMETRY=1"
          echo "SCARF_ANALYTICS=false"
        } >> "$GITHUB_ENV"

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Restore Bun install cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ inputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-${{ inputs.bun-version }}-

    - name: Install JS dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Start Turbo remote cache
      if: inputs.start-turbo-cache == 'true'
      uses: felixmosh/turborepo-gh-artifacts@118f869397261f74bc39cb8565f2d02c0ed4209f # v4
      with:
        repo-token: ${{ inputs.github-token }}
