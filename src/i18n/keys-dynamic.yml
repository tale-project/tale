# Translation-key prefixes/keys that the orphan-key test in
# `src/i18n/messages.test.ts` treats as covered. Each entry is matched as a
# prefix: `foo.bar` covers `foo.bar` and `foo.bar.<anything>`.
#
# Add an entry here only when a key is genuinely dynamic — constructed at
# runtime in ways the regex scanner cannot follow.

entries:
  # `t(theme)` in components/site/theme-switcher.tsx — the theme id
  # (`light` | `dark` | `system`) is the key, chosen from a typed union.
  - 'themeSwitcher.light'
  - 'themeSwitcher.dark'
  - 'themeSwitcher.system'
