# =============================================================================
# LOCAL DEVELOPMENT BASE STACK — NOT FOR PRODUCTION
# =============================================================================
# This is the BASE local-dev stack. It builds every image from source and runs
# that frozen build — editing host source does NOT hot-reload here (rebuild with
# `--build`). It also exposes ports that must NEVER be public (5432, 8001-8003).
#
# Three ways to run Tale locally — pick by what you're doing:
#
#   1. Host-native, fastest inner loop ...... bun run dev
#        No proxy, no real container topology; secrets auto-derived
#        (services/platform/scripts/dev-secrets.ts).
#
#   2. Full containerized stack, frozen ..... docker compose up --build
#        This file alone. Prod-shaped topology incl. proxy. Code is baked at
#        build time. Honest about secrets: needs a real .env (DB_PASSWORD etc.).
#        Use it to smoke-test "does my built image work end to end?".
#
#   3. Full stack + LIVE source (HMR) ....... bun run docker:dev   (recommended)
#        = docker compose -f compose.yml -f compose.dev.yml -f compose.docs.yml \
#            up --build
#        Adds source bind-mounts so edits hot-reload, AND ships insecure dev
#        defaults for every secret — so this path boots with ZERO .env setup.
#        (compose.docs.yml is included only to satisfy the `docs` override in
#        compose.dev.yml; the chain matches docs/.../docker-compose-reference.)
#
# For PRODUCTION, use the Tale CLI: `tale deploy`. It generates a secure compose
# inline (only 80/443 exposed) and never uses this file or compose.dev.yml.
#
# `.env` is OPTIONAL for all three (env_file `required: false` below). When
# present its values win; when absent, mode 3 fills the gaps and modes 1/2 fall
# back to their own defaults (mode 2 still hard-requires DB_PASSWORD/SITE_URL).
# =============================================================================
#
# Environment variables:
#   PULL_POLICY: 'build' (default, local dev) or 'always' (pull from GHCR)
#   VERSION: Image tag to pull (default: 'latest')

services:
  # ============================================================================
  # Tale DB (ParadeDB — pg_search + pgvector)
  # ============================================================================
  db:
    # Image from GHCR (used when PULL_POLICY=always)
    image: ghcr.io/tale-project/tale/tale-db:${VERSION:-latest}
    # Pull policy: 'build' for local dev, 'always' for production
    pull_policy: ${PULL_POLICY:-build}
    # Build configuration (used when PULL_POLICY=build)
    build:
      context: .
      dockerfile: services/db/Dockerfile
      args:
        VERSION: ${VERSION:-dev}

    # Container name
    container_name: tale-db

    # Graceful shutdown: give PostgreSQL enough time to complete
    # checkpoint + WAL flush before Docker sends SIGKILL
    stop_grace_period: 60s

    # Shared memory: ParadeDB extensions may exceed Docker's default 64MB /dev/shm
    shm_size: 256mb

    # Port mapping: host:container
    # Access PostgreSQL at localhost:5432
    ports:
      - '5432:5432'

    # Volume mounts
    # Persist database data
    volumes:
      # PostgreSQL data directory
      - db-data:/var/lib/postgresql/data
      # Backup directory (optional)
      - db-backup:/var/lib/postgresql/backup

    # Environment file (optional — see env_file note below)
    # Override DB_PASSWORD here via .env; dev defaults live in compose.dev.yml.
    env_file:
      # Optional: the stack boots without a .env. Present values win; absent
      # ones fall back to insecure dev defaults in compose.dev.yml. `tale deploy`
      # always writes a real .env, so production is unaffected.
      - path: .env
        required: false

    environment:
      # Platform DB: skip the knowledge-corpus dbmate migrations — the
      # app database (`tale_app`) is migrated by the backend at boot, not
      # by dbmate, so `migrations/db/` is empty and this role is a no-op.
      TALE_DB_ROLE: platform

    # Restart policy
    # Automatically restart the container if it crashes
    restart: unless-stopped

    # Health check
    # Gates dependent services on BOTH PostgreSQL accepting connections AND
    # the post-start init scripts having finished (they create `tale_knowledge`
    # + extensions in the background, so `pg_isready` alone races with the
    # knowledge-db dbmate startup on slow CI runners).
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-tale} -d ${POSTGRES_DB:-tale} && [ -f /tmp/.db_ready ]',
        ]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Resource limits (optional, adjust based on your needs)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 8G
    #     reservations:
    #       cpus: '2'
    #       memory: 4G

    # Logging configuration
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    # Networks
    networks:
      - internal

  # ============================================================================
  # Tale Knowledge DB (ParadeDB: pg_search + pgvector)
  # ----------------------------------------------------------------------------
  # Independent datastore for knowledge/RAG content (the `tale_knowledge`
  # database with the `private_knowledge` + `public_web` schemas). Split out
  # from `db` so the knowledge corpus — the data-residency-sensitive store —
  # can be relocated/replaced independently of the operational DB. The backend
  # connects here via `KNOWLEDGE_DATABASE_URL` (postgres.js, pooled in
  # backend/core/knowledge/pool.ts); nothing else talks to it.
  # ============================================================================
  knowledge-db:
    # Same image `db` builds. A second `build:` here makes
    # `docker compose up --build` export the tag twice in parallel and fail
    # with "image already exists" on the containerd store — `bun dev` then
    # continues without Postgres and the host backend dies on ECONNREFUSED.
    image: ghcr.io/tale-project/tale/tale-db:${VERSION:-latest}
    # Must not inherit PULL_POLICY=build: this service has no build spec.
    # `missing` uses the image `db` just produced, or pulls if nothing is local.
    pull_policy: missing

    container_name: tale-knowledge-db

    stop_grace_period: 60s
    shm_size: 256mb

    # Host port 5433 to avoid clashing with the platform db on 5432.
    ports:
      - '5433:5432'

    volumes:
      - knowledge-db-data:/var/lib/postgresql/data
      - knowledge-db-backup:/var/lib/postgresql/backup

    env_file:
      # Optional: the stack boots without a .env. Present values win; absent
      # ones fall back to insecure dev defaults in compose.dev.yml. `tale deploy`
      # always writes a real .env, so production is unaffected.
      - path: .env
        required: false

    environment:
      # Knowledge DB: apply the tale_knowledge corpus migrations
      # (services/db/migrations/knowledge-db/) at startup.
      TALE_DB_ROLE: knowledge

    restart: unless-stopped

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-tale} -d ${KNOWLEDGE_DB_NAME:-tale_knowledge} && [ -f /tmp/.db_ready ]',
        ]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 120s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - internal

  # ============================================================================
  # bgutil PO-token provider (YouTube ingestion anti-bot)
  # ============================================================================
  # Serves GVS proof-of-origin tokens to the yt-dlp bgutil plugin baked into
  # the platform image (layout: /opt/yt-dlp/plugins/bgutil/yt_dlp_plugins/…),
  # so video-link ingestion survives YouTube's "confirm you're not a bot" wall
  # on datacenter/flagged IPs — with zero operator config. Reached only by the
  # backend over the internal network (no published ports); video ingest
  # degrades gracefully (no token) if it's down, so nothing depends_on it. The
  # image tag MUST match BGUTIL_POT_VERSION in
  # services/platform/Dockerfile — bump both together.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    container_name: tale-bgutil-provider
    # External image (not built here): pull if absent.
    pull_policy: ${BGUTIL_PULL_POLICY:-missing}
    # PID 1 reaper — the provider spawns short-lived headless workers.
    init: true
    restart: unless-stopped
    # TCP liveness on the token port; no path assumption, works on any flavor.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect(4416,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - internal

  # ============================================================================
  # Tale Platform (Vite + TanStack Router SPA, served by Bun)
  # ============================================================================
  platform:
    # Image from GHCR (used when PULL_POLICY=always)
    image: ghcr.io/tale-project/tale/tale-platform:${VERSION:-latest}

    # Container name
    container_name: tale-platform
    # Pull policy: 'build' for local dev, 'always' for production
    pull_policy: ${PULL_POLICY:-build}
    # Build configuration (used when PULL_POLICY=build)
    build:
      context: .
      dockerfile: services/platform/Dockerfile
      args:
        VERSION: ${VERSION:-dev}

    # No port mapping needed - accessed via proxy at https://localhost (or your domain)
    # internally via http://platform:3000

    # The org CONFIG STORE, read-only here: `server.ts` watches it for config
    # changes (the SSE lane) and serves branding images out of it. The backend
    # tier mounts the same volume read-write — it owns every write. (The name
    # predates the Convex retirement; kept so no operator has to migrate a
    # volume for a rename.)
    volumes:
      - convex-data:/app/data:ro

    # Environment file (optional — see env_file note below)
    # Provide real secrets via .env; dev defaults live in compose.dev.yml.
    env_file:
      # Optional: the stack boots without a .env. Present values win; absent
      # ones fall back to insecure dev defaults in compose.dev.yml. `tale deploy`
      # always writes a real .env, so production is unaffected.
      - path: .env
        required: false

    # Live browser view (read-only mirror). Read here too — the sandbox spawner
    # reads the SAME var, so the two MUST stay in lockstep. Unset ⇒ default ON; set
    # SANDBOX_BROWSER_VIEW=0 (or false/no/off) to opt out. Interpolates from the
    # same root .env as the sandbox service so one value drives both. Mirrors the
    # CLI generator (create-platform-service.ts).
    environment:
      SANDBOX_BROWSER_VIEW: ${SANDBOX_BROWSER_VIEW:-}
      # Where the public `/status` page probes the application backend.
      TALE_BACKEND_URL: ${TALE_BACKEND_URL:-http://backend-api:3005}

    # Restart policy
    # Automatically restart the container if it crashes
    # Graceful shutdown: drain in-flight HTTP/SSE chat streams before SIGKILL.
    # Mirrors the CLI generator (create-platform-service.ts: 45s); without it
    # `docker compose up` gets Docker's 10s default and cuts streams mid-flight.
    stop_grace_period: 45s
    restart: unless-stopped

    # Health check — the web tier only. The /tmp/platform-ready marker is
    # written by the entrypoint once the server is up.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:3000/api/health && [ -f /tmp/platform-ready ]',
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s

    # Dependencies
    depends_on:
      db:
        condition: service_healthy
      proxy:
        condition: service_healthy

    # Resource limits (optional, adjust based on your needs)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G
    #     reservations:
    #       cpus: '1'
    #       memory: 2G

    # Logging configuration
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    # Networks
    networks:
      - internal

  # ============================================================================
  # Tale 0.5 backend (parallel build) — OPT-IN under the `backend` profile
  # ----------------------------------------------------------------------------
  # The SAME platform image, started in a different role via TALE_ROLE
  # (docker-entrypoint.sh dispatches on it). Default topology
  # is one `api` + one `worker` container; either scales independently:
  #   docker compose --profile backend up -d --scale backend-worker=3
  # (no `container_name` on these two services precisely so --scale works).
  # State lives in the `tale_app` database on the `db` service (created
  # idempotently by services/db/init-scripts/04-create-app-database.sql).
  # ============================================================================
  # Object store — the deployment's BLOB backend
  # ============================================================================
  # S3-compatible storage is the ONLY blob backend (Convex `_storage` retired
  # with the runtime), so a deployment without one refuses every upload. This
  # is the default the stack ships with; an org that brings its own bucket
  # (Settings > Data residency) is resolved BEFORE it and is unaffected. The
  # backend seeds `default/object-storage/connection.json` against this
  # service at boot — see backend/domains/object_storage/bootstrap.ts.
  #
  # Internal-only: blobs reach the browser through presigned URLs the backend
  # signs and the proxy forwards, never by exposing the store itself.
  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: missing

    container_name: tale-object-store

    # Flush in-flight multipart writes before SIGKILL.
    stop_grace_period: 30s

    command: server /data --address ':9000' --console-address ':9001'

    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-tale}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-tale_dev_object_store}
      # Presigned URLs are signed by the backend against the internal
      # endpoint; the proxy forwards them, so the store needs no public origin.
      MINIO_BROWSER: 'off'

    env_file:
      - path: .env
        required: false

    volumes:
      - object-store-data:/data

    restart: unless-stopped

    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - internal

  backend-api:
    image: ghcr.io/tale-project/tale/tale-platform:${VERSION:-latest}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: .
      dockerfile: services/platform/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    environment:
      TALE_ROLE: api
      PORT: '3005'
      # Interpolated from .env at compose level; the dev fallback mirrors
      # compose.dev.yml's DB_PASSWORD default so the opt-in profile boots on a
      # plain dev stack. Production always has a real .env (tale deploy).
      DATABASE_URL: postgresql://${POSTGRES_USER:-tale}:${DB_PASSWORD:-tale_dev_password}@db:5432/${APP_DB_NAME:-tale_app}
      TALE_CONFIG_DIR: /app/data
      # Where THIS process reaches the sandbox spawner. session_client.ts
      # defaults to localhost:8003 (host bun-dev); without the compose
      # default a container worker cannot start an agent run.
      SANDBOX_URL: ${SANDBOX_URL:-http://sandbox:8003}
      # Where a sandbox CONTAINER reaches this backend: the in-sandbox
      # connectors bridge and the live-body host-call door are served here.
      SANDBOX_HTTP_API_BASE_URL: ${SANDBOX_HTTP_API_BASE_URL:-http://backend-api:3005}
      # The bundled blob store the backend seeds the deployment default
      # against at boot. Internal address: presigned URLs are signed here and
      # forwarded by the proxy, so the store is never published directly.
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://object-store:9000}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-tale-blobs}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-tale}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-tale_dev_object_store}
      # Where the BROWSER reaches the store: the site origin, behind which the
      # proxy forwards `/<bucket>/*` verbatim. Presigned URLs are signed
      # against this, the internal endpoint above is what the backend itself
      # uses — see `browserFacing` in backend/core/lib/storage/object_store.ts.
      OBJECT_STORE_PUBLIC_ENDPOINT: ${OBJECT_STORE_PUBLIC_ENDPOINT:-${SITE_URL:-http://localhost}}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # Override the image's baked web healthcheck (port 3000) with the api port.
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3005/ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      object-store:
        condition: service_healthy
    # The entrypoint installs the SSRF egress firewall (REJECT IMDS +
    # link-local + RFC1918) before dropping privileges: this tier opens
    # sockets outside the pinned-IP fetch path (yt-dlp, ffmpeg, the crawler).
    cap_add:
      - NET_ADMIN
    # The org CONFIG STORE — the backend OWNS it (governance policies, SSO
    # connection files, provider + agent + skill trees). The web tier mounts
    # the same volume read-only.
    volumes:
      - convex-data:/app/data
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    # Dual-homed: the in-sandbox connectors bridge reaches this api directly
    # over the sandbox network (VK-authed).
    networks:
      - internal
      - sandbox

  backend-worker:
    image: ghcr.io/tale-project/tale/tale-platform:${VERSION:-latest}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: .
      dockerfile: services/platform/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    environment:
      TALE_ROLE: worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-tale}:${DB_PASSWORD:-tale_dev_password}@db:5432/${APP_DB_NAME:-tale_app}
      TALE_CONFIG_DIR: /app/data
      SANDBOX_URL: ${SANDBOX_URL:-http://sandbox:8003}
      # The worker DISPATCHES connector bodies too (automation nodes), so it
      # mints the same in-sandbox host-call URL the api does.
      SANDBOX_HTTP_API_BASE_URL: ${SANDBOX_HTTP_API_BASE_URL:-http://backend-api:3005}
      # The bundled blob store the backend seeds the deployment default
      # against at boot. Internal address: presigned URLs are signed here and
      # forwarded by the proxy, so the store is never published directly.
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://object-store:9000}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-tale-blobs}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-tale}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-tale_dev_object_store}
      # Where the BROWSER reaches the store: the site origin, behind which the
      # proxy forwards `/<bucket>/*` verbatim. Presigned URLs are signed
      # against this, the internal endpoint above is what the backend itself
      # uses — see `browserFacing` in backend/core/lib/storage/object_store.ts.
      OBJECT_STORE_PUBLIC_ENDPOINT: ${OBJECT_STORE_PUBLIC_ENDPOINT:-${SITE_URL:-http://localhost}}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # The worker exposes no HTTP; the image's baked healthcheck targets the web
    # port and would read permanently unhealthy here, so disable it. Liveness
    # is the Graphile Worker heartbeat + at-least-once job recovery.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      object-store:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    volumes:
      - convex-data:/app/data
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - internal

  # ============================================================================
  # Tale Proxy (Caddy)
  # ============================================================================
  # Single entry point for all traffic (both local dev and production)
  # Always serves over HTTPS with configurable certificate source.
  #
  # TLS Configuration (set in .env):
  #   TLS_MODE=selfsigned   - Self-signed certs (default, for development)
  #   TLS_MODE=letsencrypt  - Let's Encrypt certs (for production)
  #
  # For local development:
  #   - Run: docker compose up
  #   - Access: https://localhost (self-signed cert, browser warning expected)
  #   - To trust certs: docker exec tale-proxy caddy trust
  #
  # For production with HTTPS:
  #   - Set HOST=yourdomain.com and SITE_URL=https://yourdomain.com in .env
  #   - Set TLS_MODE=letsencrypt
  #   - Access: https://yourdomain.com (trusted Let's Encrypt cert)
  #
  proxy:
    # Image from GHCR (used when PULL_POLICY=always)
    image: ghcr.io/tale-project/tale/tale-proxy:${VERSION:-latest}
    # Pull policy: 'build' for local dev, 'always' for production
    pull_policy: ${PULL_POLICY:-build}
    # Build configuration (used when PULL_POLICY=build)
    build:
      context: .
      dockerfile: services/proxy/Dockerfile
      args:
        VERSION: ${VERSION:-dev}

    # Container name
    container_name: tale-proxy

    # Port mapping: host:container
    # Access the platform via HTTP (80) or HTTPS (443)
    ports:
      - '80:80'
      - '443:443'

    # Volume mounts
    # Persist Caddy data (certificates, etc.)
    volumes:
      # Caddy data directory for certificates and configuration
      - caddy-data:/data
      # Caddy config directory
      - caddy-config:/config

    # Environment file (optional — see env_file note below)
    # Override HOST/SITE_URL/TLS_MODE via .env; dev defaults live in compose.dev.yml.
    env_file:
      # Optional: the stack boots without a .env. Present values win; absent
      # ones fall back to insecure dev defaults in compose.dev.yml. `tale deploy`
      # always writes a real .env, so production is unaffected.
      - path: .env
        required: false

    environment:
      # The application backend. Every migrated lane routes here; the switch
      # remains an env var so an operator can point the proxy at another
      # host/port, never so the stack can fall back to a runtime that no
      # longer exists.
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend-api:3005}
      # The BLOB store, published at its own bucket path. The bucket name IS
      # the public path and is forwarded unstripped — SigV4 covers the host
      # and the path, so rewriting either breaks every presigned URL.
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-tale-blobs}
      OBJECT_STORE_UPSTREAM: ${OBJECT_STORE_UPSTREAM:-object-store:9000}

    # Restart policy
    # Automatically restart the container if it crashes
    restart: unless-stopped

    # Health check via dedicated internal port (not exposed externally)
    # Uses :2020 to avoid interfering with Caddy's ACME challenge handling on :80
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:2020/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Note: platform depends on proxy (see platform.depends_on above).
    # Caddy handles upstream unavailability gracefully.

    # Logging configuration
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    # Networks
    networks:
      internal:
        # Network alias so a container resolving the *public* HOST lands on the
        # proxy via Docker's internal DNS (hairpin NAT). For the default
        # `localhost` this alias is inert — every container's /etc/hosts pins
        # `localhost` to 127.0.0.1, which shadows Docker DNS — and that is fine:
        # the platform makes no server-side calls to its own public URL (no SSR;
        # internal traffic uses Docker service names).
        # The alias still does real work when HOST is a custom domain.
        aliases:
          - ${HOST:-localhost}

  # ============================================================================
  # Tale Sandbox Egress (tinyproxy) — HTTPS forward proxy
  # ----------------------------------------------------------------------------
  # Open egress by default: CONNECT :443 to any public host. Setting
  # SANDBOX_EGRESS_ALLOWLIST switches it to a default-deny hostname
  # allowlist. Either way this proxy is the sandbox runtime containers'
  # only outbound path, because the sandbox bridge is `internal:true`.
  # ============================================================================
  sandbox-egress:
    image: ghcr.io/tale-project/tale/tale-sandbox-egress:${VERSION:-latest}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: .
      dockerfile: services/sandbox-egress/Dockerfile
    container_name: tale-sandbox-egress
    env_file:
      # Optional: the stack boots without a .env. Present values win; absent
      # ones fall back to insecure dev defaults in compose.dev.yml. `tale deploy`
      # always writes a real .env, so production is unaffected.
      - path: .env
        required: false
    restart: unless-stopped
    # Drop the full default capability set, then add back ONLY what the
    # container provably needs (least privilege; shrinks the attack surface of
    # a NET_ADMIN-holding, internet-facing proxy). Verified live against the
    # image — a tighter set breaks the entrypoint, a looser one is wasted.
    #   NET_ADMIN     — install the iptables OUTPUT REJECT rules for IMDS
    #                   (169.254.169.254) + RFC1918 (the only hostname-
    #                   independent egress fence; fail-closed without it).
    #   DAC_OVERRIDE  — entrypoint.sh (root) touches/creates the tinyproxy log
    #                   inside /var/log/tinyproxy, which the image owns by
    #                   `nobody`; without it the touch fails Permission denied.
    #   CHOWN         — chown that log file to nobody.
    #   SETUID/SETGID — tinyproxy drops privileges to nobody after bind.
    #   NET_BIND_SERVICE — dnsmasq binds privileged port 53 to serve external
    #                   DNS to the internal-only sandbox network (dnsmasq checks
    #                   for this cap explicitly, even as root).
    # (NET_RAW / MKNOD / SETPCAP / SETFCAP / etc. are NOT needed.)
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - DAC_OVERRIDE
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    healthcheck:
      # Plain TCP-listen check: if tinyproxy is up the port answers. We
      # intentionally do NOT CONNECT-probe an external host (pypi/npm)
      # — flapping that probe against a transient upstream outage flips
      # the spawner's `depends_on: service_healthy` gate to false and
      # blocks all new sandbox launches even though the proxy itself is
      # fine. Round-2 R2-B11: aligned with the CLI generator (TCP-only)
      # so `docker compose up` and `tale start` produce identical health
      # semantics.
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 3128 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      # `sandbox` faces the runtime containers (their only outbound path,
      # since tale-sandbox-net is `--internal`). `internal` provides
      # outbound NAT — `--internal` networks can't reach the host bridge.
      # Egress peers on `internal` are NOT a meaningful new attack
      # surface: the RFC1918/IMDS iptables rules still apply, and the
      # proxy only reaches the same internet those peers already reach
      # directly via their own NAT.
      - sandbox
      - internal

  # ============================================================================
  # Tale Sandbox Spawner — thin stateless docker-run service for artifact_run
  # ----------------------------------------------------------------------------
  # Mounts /var/run/docker.sock to spawn ephemeral sibling containers per call.
  # Reachable only on the `internal` bridge by the platform/backend services;
  # joined to `sandbox` only to issue `docker run` (the runtime containers
  # themselves attach to `sandbox` for egress via tinyproxy).
  #
  # SECURITY: docker.sock = host root. Explicit threat acceptance per plan
  # "Security model". Spawner accepts only HMAC-signed typed JSON over HTTP;
  # `services/sandbox/src/docker-args.ts` validates every argv field with
  # regexes so a malformed input never reaches `docker run`. Future hardening:
  # SANDBOX_RUNTIME=runsc opt-in (gVisor), `opa-docker-authz` daemon plugin
  # for HostConfig body filtering, dockerd userns-remap.
  # ============================================================================
  sandbox:
    image: ghcr.io/tale-project/tale/tale-sandbox:${VERSION:-latest}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: .
      dockerfile: services/sandbox/Dockerfile
    container_name: tale-sandbox
    # Loopback-only port mapping. The spawner mounts /var/run/docker.sock,
    # so an unauthenticated request on this port = remote root via docker.
    # The backend reaches the spawner through the `internal` Docker network
    # (http://sandbox:8003) — the published port is only for `bun dev`
    # running the backend on the host. NEVER publish on 0.0.0.0.
    ports:
      - '127.0.0.1:8003:8003'
    env_file:
      # Optional: the stack boots without a .env. Present values win; absent
      # ones fall back to insecure dev defaults in compose.dev.yml. `tale deploy`
      # always writes a real .env, so production is unaffected.
      - path: .env
        required: false
    environment:
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runc}
      # Native docker/docker compose inside session containers. Unset here so the
      # spawner applies its tier-aware default (on for sysbox/kata, off for
      # runc/gvisor); set SANDBOX_DOCKER_IN_CONTAINER=true/false (or the
      # deployment.json sandboxRuntime section) to force it.
      SANDBOX_DOCKER_IN_CONTAINER: ${SANDBOX_DOCKER_IN_CONTAINER:-}
      SANDBOX_RUNTIME_IMAGE: ${SANDBOX_RUNTIME_IMAGE:-tale-sandbox-runtime:latest}
      # Shared cross-session docker build cache. Unset here so the spawner applies
      # its default (follows SANDBOX_DOCKER_IN_CONTAINER — on whenever DinD is on);
      # set SANDBOX_DOCKER_BUILD_CACHE=true/false (or the deployment.json
      # sandboxRuntime section) to force it. The image refs the spawner `docker
      # run`s for the shared buildkitd + its pull-through registry mirror are
      # overridable for a pinned/mirrored ref in fenced deploys. Mirrors the CLI
      # generator (create-sandbox-service.ts) — R2-B11 lockstep.
      SANDBOX_DOCKER_BUILD_CACHE: ${SANDBOX_DOCKER_BUILD_CACHE:-}
      SANDBOX_BUILDKITD_IMAGE: ${SANDBOX_BUILDKITD_IMAGE:-tale-sandbox-buildkitd:latest}
      SANDBOX_BUILDKITD_MIRROR_IMAGE: ${SANDBOX_BUILDKITD_MIRROR_IMAGE:-registry:2}
      # Live browser view (read-only mirror). Unset here so BOTH sides apply
      # their default-ON; set SANDBOX_BROWSER_VIEW=0 (or false/no/off) to opt out.
      # ONE value drives both sides — this spawner and the sandbox runtime each
      # read it directly — so they MUST share a source. It is read on
      # the platform service too (NOT a sandbox-only var like the ones above), and
      # both interpolate from the same root .env, so a single value keeps them in
      # lockstep. Mirrors the CLI generator (create-sandbox-service.ts).
      SANDBOX_BROWSER_VIEW: ${SANDBOX_BROWSER_VIEW:-}
      SANDBOX_EGRESS_NETWORK: tale-sandbox-net
      SANDBOX_EGRESS_PROXY: http://sandbox-egress:3128
    volumes:
      # The spawner needs the host docker socket to spawn sibling containers.
      # This is the security boundary — see header comment.
      - /var/run/docker.sock:/var/run/docker.sock
      # 1:1 bind: per-call workspace dirs are created here by the spawner
      # and mounted into the runtime container at the SAME host path (the
      # docker daemon resolves --mount source paths against the host fs,
      # so the spawner and the daemon must agree on the path).
      - /var/lib/tale-sandbox:/var/lib/tale-sandbox
      # Read-only deployment config so loadConfig can read the sandboxRuntime
      # tier from deployment.json (same config volume the backend/platform
      # services share).
      - ${PLATFORM_SHARED_CONFIG:-convex-data}:/app/platform-config:ro
    # Graceful shutdown: let the spawner drain in-flight executions before
    # SIGKILL. Mirrors the CLI generator (create-sandbox-service.ts: 30s);
    # without it `docker compose up` gets Docker's 10s default.
    stop_grace_period: 30s
    restart: unless-stopped
    # Resource caps mirror the CLI compose generator
    # (`tools/cli/src/lib/compose/services/create-sandbox-service.ts`). The
    # `tale start` and raw `docker compose up` paths must produce the SAME
    # operational posture; previously this file shipped without caps, so
    # operators running `docker compose up` directly got an uncapped
    # spawner — audit finding R2-B11.
    mem_limit: 512m
    pids_limit: 512
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8003/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      sandbox-egress:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - internal
      - sandbox

  # ============================================================================
  # Tale LLM Gateway (maximhq/bifrost core, OSS Apache-2.0) for sandbox AGENT SESSIONS
  # ----------------------------------------------------------------------------
  # The only path from an in-sandbox coding agent (Claude Code / OpenCode) to an
  # LLM. Dual-homed onto `internal` (platform provisions providers + mints
  # session virtual keys via the governance API) and `sandbox` (agents reach it
  # at http://sandbox-llm-gateway:8080 over the internal bridge — NOT through tinyproxy).
  #
  # Raw provider API keys live ONLY here + in the platform; the sandbox holds a
  # session-scoped `sk-bf-*` virtual key (budget + model allowlist), revoked at
  # session destroy. The platform is the source of truth for providers/models;
  # it provisions the gateway via the governance API on session create
  # (the backend's llm_gateway_admin lane: provisionProviders +
  # applyGatewayConfig).
  #
  # SECURITY: gateway auth is config-store driven (NOT env vars — the upstream
  # maximhq/bifrost core never read its old management-token / enforce-virtual-keys
  # env knobs). applyGatewayConfig() pushes, idempotently on session create:
  #   - client.enforce_auth_on_inference=true → inference rejects anything but a
  #     minted virtual key (the data-plane gate).
  #   - auth_config (admin basic-auth over /api/*) from SANDBOX_LLM_GATEWAY_ADMIN_PASSWORD
  #     — REQUIRED: the backend refuses every management call without it, so the
  #     management plane is never anonymous on the sandbox network.
  # No published port (loopback publish lives in compose.sandbox-llm-gateway.dev.yml for
  # the host bun-dev path). Built as a thin wrapper over the PINNED upstream image
  # — the project has had VK auth regressions.
  # ============================================================================
  sandbox-llm-gateway:
    image: ghcr.io/tale-project/tale/tale-sandbox-llm-gateway:${VERSION:-latest}
    build:
      context: .
      dockerfile: services/sandbox-llm-gateway/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: tale-sandbox-llm-gateway
    env_file:
      # Optional: the stack boots without a .env. Present values win; absent
      # ones fall back to insecure dev defaults in compose.dev.yml. `tale deploy`
      # always writes a real .env, so production is unaffected.
      - path: .env
        required: false
    # No gateway-read env knobs: auth + VK enforcement are config-store fields
    # the platform pushes via applyGatewayConfig() (admin creds come from the
    # platform's SANDBOX_LLM_GATEWAY_ADMIN_USERNAME / SANDBOX_LLM_GATEWAY_ADMIN_PASSWORD
    # — required on the backend, never set on the gateway container itself;
    # compose.dev.yml carries an insecure dev default for the backend tier).
    volumes:
      # SQLite config/log store (providers + minted keys + auth config survive
      # restarts). Wipe this volume to re-bootstrap auth from scratch. Volume name
      # predates the service rename (was `llm-gateway`); kept as-is to avoid an
      # otherwise-pointless data migration (the store is a derived cache the
      # platform re-provisions per session anyway).
      - llm-gateway-data:/app/data
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      # The gateway image ships busybox wget but no curl.
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      # Transitional `llm-gateway` alias: keeps the pre-rename hostname resolving
      # for one release so in-flight sandbox sessions (whose injected gateway URL
      # / NO_PROXY still say `llm-gateway`) survive the deploy that lands the
      # rename. Drop the aliases once no old-name traffic remains.
      internal:
        aliases:
          - llm-gateway
      sandbox:
        aliases:
          - llm-gateway

# ============================================================================
# Volumes
# ============================================================================
volumes:
  # Tale DB persistent storage
  db-data:
    driver: local
    # Optional: Use named volume with specific driver options
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /path/to/db/data

  # Tale DB backup storage
  db-backup:
    driver: local

  # Knowledge DB (ParadeDB) persistent storage — independently movable from db-data
  knowledge-db-data:
    driver: local
  knowledge-db-backup:
    driver: local

  # LEGACY (pre-0.3.0): platform data used to live here before the
  # split-convex transition. Today everything lives in `convex-data`; the
  # volume is retained as an unused stub so detect() in start.ts can
  # identify pre-0.3.0 deployments and produce a coherent diff. Operators
  # can delete it by hand once they're past the upgrade window.
  platform-data:
    driver: local

  # The org CONFIG STORE: the file-based configs every org owns (agents,
  # automations, connectors, providers, skills, governance policies, SSO
  # connections, branding). The backend tier writes it; the web tier reads it.
  # The name predates the Convex retirement and is KEPT so no operator has to
  # migrate a volume for a rename.
  convex-data:
    driver: local

  # The deployment's BLOB store (uploaded documents, chat attachments, audio,
  # generated media). Separate from the config store on purpose: config is
  # small, text, and diffable; blobs are large and opaque, and an operator
  # relocating one should not have to move the other.
  object-store-data:
    driver: local

  # Persistent storage for Caddy proxy data (certificates, etc.)
  caddy-data:
    driver: local

  # Persistent storage for Caddy proxy configuration
  caddy-config:
    driver: local

  # LLM gateway SQLite store (provisioned providers + minted session virtual
  # keys). Survives restarts so in-flight sessions keep working. Name predates
  # the `llm-gateway`→`sandbox-llm-gateway` service rename; kept to avoid a
  # pointless data migration (derived cache, re-provisioned per session).
  llm-gateway-data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  # Internal network for Tale services
  internal:
    driver: bridge

  # Sandbox network — internal-only bridge for artifact_run runtime containers + the
  # tinyproxy egress sidecar. The CLI (start.ts / deploy.ts via
  # ensureSandboxNetwork) pre-creates the network with `--internal --ipv6=false`
  # so it can carry both `tale-sandbox-net` and the bridge-driver flags that
  # compose's `networks:` block can't express atomically. We mark it external
  # here so compose attaches to the existing network rather than overwriting
  # its driver options.
  sandbox:
    external: true
    name: tale-sandbox-net
