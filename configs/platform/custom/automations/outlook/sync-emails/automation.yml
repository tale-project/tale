# Automation manifest — everything about the pack that is not its workflow.
# The directory path is the slug (`outlook/sync-emails`); `workflow.yml` beside
# this file is the document that runs.
name: Sync Outlook emails
description: >-
  Pull new Outlook messages into the shared Inbox on a schedule so the team can
  read, triage, and reply in one place.
icon: mail
labels:
  - Email
  - Outlook
scope: org
builtinViews:
  - id: inbox
requires:
  connectors:
    - outlook
    - conversation
triggers:
  - kind: schedule
    cron: '*/5 * * * *'
    timezone: UTC
i18n:
  de:
    name: Outlook-E-Mails synchronisieren
    description: >-
      Holt neue Outlook-Nachrichten nach Plan in den gemeinsamen Posteingang, damit
      das Team dort lesen, sichten und antworten kann.
  fr:
    name: Synchroniser les e-mails Outlook
    description: >-
      Tire les nouveaux messages Outlook dans la boîte partagée selon un planning,
      pour que l'équipe lise, trie et réponde au même endroit.
