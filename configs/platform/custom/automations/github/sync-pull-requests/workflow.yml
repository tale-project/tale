# Keeps a project's tasks in step with the open pull requests of one GitHub
# repository — all of them, or one account's, such as Renovate's. One step
# does the whole sync (task.sync_issues, a github source of type pulls): it
# reads the next batch of open pull requests from where the last run stopped,
# reads pull requests imported earlier again (the longest-unchecked first),
# writes every one into its task and saves where it stopped. The project, the
# repository, the author and label filters, the credentials and the batch
# size are the creator's answers; the platform keeps the position between
# runs.
version: 1
name: github-sync-pull-requests
description: Sync the open pull requests of a GitHub repository into a project's tasks, one batch per run, and keep the tasks made from them current.
inputs:
  type: object
  properties:
    # Every trigger-started run arrives inside the trigger wrapper
    # (docs/en/platform/automations/triggers.md).
    trigger:
      type: string
      description: Which trigger started the run; a schedule sends "schedule".
    firedAt:
      type: number
      description: Epoch-ms occurrence the schedule fired for.
nodes:
  - id: sync
    type: task.sync_issues
    input:
      projectId: the-project
      sources:
        - kind: github
          owner: your-organization
          repo: your-repository
          type: pulls
          author: ''
          labels: ''
          credential: ''
      limit: 100
      refreshLimit: 50
output: '{{ nodes.sync.output }}'
tests:
  - name: reads the repository's next batch of pull requests into the project and answers its receipt
    input:
      trigger: schedule
      firedAt: 1791000000000
    # The project, the source and the batch size are the creator's answers:
    # the test holds what any answers make of them.
    expect:
      outputIncludes:
        sources:
          - kind: github
            ok: true
            error: null
            saved: true
            drained: true
            created: 1
            retryAfter: null
        failed: 0
        rateLimited: 0
        created: 1
      effects:
        - connector: task.sync_issues
          node: sync
          inputIncludes:
            sources:
              - kind: github
                type: pulls
            refreshLimit: 50
  - name: a run that could read no source fails, so the schedule counts it
    input: {}
    failures:
      sync: 'task.sync_issues: every issue source failed'
    expect:
      failure:
        node: sync
