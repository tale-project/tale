# Mail sync, IMAP/SMTP variant.
#
# One of three provider variants of the same automation (gmail / outlook /
# imap-smtp). They stay the SAME document with the connectorSlug substituted;
# a test in lib/automations/packs.test.ts fails if they drift apart.
#
# The template's questions write the mailbox, the days a first pass reads
# back, whether Sent is read and the emails one pass reads into the sync step
# itself, so a run started by hand reads the mailbox the way a scheduled one
# does. A blank mailbox reads every connected one, each from its own position.
version: 1
name: imap-smtp-sync-emails
description: Read new IMAP email, Inbox and Sent, into the shared Inbox.
inputs:
  type: object
  properties:
    # Every trigger-started run arrives inside the trigger wrapper
    # (docs/en/platform/automations/triggers.md). A declared schema must
    # describe that wrapper, or the pack's own schedule is refused at start
    # and the trigger records `start_refused`.
    trigger:
      type: string
      description: Which trigger started the run; a schedule sends "schedule".
    firedAt:
      type: number
      description: Epoch-ms occurrence the schedule fired for.
  additionalProperties: false
nodes:
  - id: sync
    type: conversation.sync_mailbox
    input:
      connectorSlug: imap-smtp
      mailbox: ''
      backfillDays: 7
      includeSent: true
      limit: 50
output:
  listed: '{{ nodes.sync.output.listed }}'
  inbound: '{{ nodes.sync.output.inbound }}'
  mailboxes: '{{ nodes.sync.output.mailboxes }}'
tests:
  - name: a sync pass reports each mailbox it read
    input: {}
    expect:
      output:
        listed: 1
        inbound:
          created: true
          processedCount: 1
          skippedCount: 0
          conversationIds:
            - conv_mock
        mailboxes:
          - mailbox: default
            ok: true
            listed: 1
            fetched: 1
            ingested: 1
            duplicates: 0
            skipped: 0
            vanished: 0
            capped: false
