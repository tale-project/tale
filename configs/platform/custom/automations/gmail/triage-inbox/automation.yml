# Automation manifest — everything about the pack that is not its workflow.
# The directory path is the slug (`gmail/triage-inbox`); `workflow.yml` beside
# this file is the document that runs.
name: Triage the Gmail inbox
description: Reads the newest Gmail messages on a schedule and writes one digest of what came in and what needs a reply today.
icon: mail
labels:
  - Email
  - Gmail
scope: org
requires:
  integrations:
    - gmail
triggers:
  - kind: schedule
    cron: 0 */6 * * *
    timezone: UTC
i18n:
  de:
    name: Gmail-Posteingang sichten
    description: Liest regelmäßig die neuesten Gmail-Nachrichten und schreibt eine Zusammenfassung, was eingegangen ist und was heute eine Antwort braucht.
  fr:
    name: Trier la boîte de réception Gmail
    description: Lit régulièrement les nouveaux messages Gmail et rédige un résumé de ce qui est arrivé et de ce qui demande une réponse aujourd'hui.
