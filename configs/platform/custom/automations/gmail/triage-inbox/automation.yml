# Automation manifest — everything about the pack that is not its workflow.
# The directory path is the slug (`gmail/triage-inbox`); `workflow.yml` beside
# this file is the document that runs.
name: Triage the Gmail inbox
description: >-
  Triages the open Gmail conversations in the Inbox that are waiting on the team: sets their priority, records the verdict on each thread, and leaves a drafted reply where one is due for a person to send. Runs on a schedule and needs the Gmail sync automation deployed.
icon: mail
labels:
  - Email
  - Gmail
scope: org
requires:
  connectors:
    - gmail
    - conversation
triggers:
  - kind: schedule
    cron: 0 */6 * * *
    timezone: UTC
i18n:
  de:
    name: Gmail-Posteingang sichten
    description: >-
      Sichtet die offenen Gmail-Konversationen in der Inbox, die auf das Team warten: setzt ihre Priorität, hält das Urteil an jedem Thread fest und legt dort, wo eine Antwort fällig ist, einen Antwortentwurf ab, den eine Person abschickt. Läuft nach Zeitplan und braucht die bereitgestellte Gmail-Synchronisierung.
  fr:
    name: Trier la boîte de réception Gmail
    description: >-
      Trie les conversations Gmail ouvertes de la Boîte de réception qui attendent l’équipe : fixe leur priorité, note le verdict sur chaque fil et dépose un brouillon de réponse là où une réponse est due, qu’une personne enverra. S’exécute selon une planification et requiert l’automatisation de synchronisation Gmail déployée.
