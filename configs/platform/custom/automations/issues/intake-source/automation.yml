name: Import the next batch of an issue source
description: "Imports the next batch of one GitHub repository or GlitchTip project into a Tale project, from where its last saved batch stopped, and saves where this batch stopped. An import that fails saves nothing, so the next run tries the same batch again. The run's output is the receipt."
icon: list-checks
labels: [GitHub, GlitchTip, Issues]
scope: org
requires:
  connectors: [task]
i18n:
  de:
    name: Nächsten Stapel einer Issue-Quelle importieren
    description: "Importiert den nächsten Stapel eines GitHub-Repositorys oder GlitchTip-Projekts in ein Tale-Projekt, ab der Stelle, an der der zuletzt gespeicherte Stapel endete, und speichert, wo dieser Stapel endet. Ein fehlgeschlagener Import speichert nichts, sodass der nächste Lauf denselben Stapel erneut versucht. Die Ausgabe des Laufs ist der Beleg."
  fr:
    name: Importer le prochain lot d’une source d’issues
    description: "Importe le prochain lot d’un dépôt GitHub ou d’un projet GlitchTip dans un projet Tale, à partir de l’endroit où s’est arrêté le dernier lot enregistré, et enregistre où ce lot s’arrête. Un import qui échoue n’enregistre rien, si bien que l’exécution suivante réessaie le même lot. La sortie de l’exécution en est le reçu."
