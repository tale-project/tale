name: Import issues from several sources
description: "Imports the next batch of every listed GitHub repository and GlitchTip project into a Tale project, each from where its last saved batch stopped. Each source is imported on its own: one whose import fails saves nothing and is tried again next run, while the others carry on. The run's output lists one receipt per source."
icon: list-checks
labels: [GitHub, GlitchTip, Issues]
scope: org
requires:
  connectors: [task]
i18n:
  de:
    name: Issues aus mehreren Quellen importieren
    description: "Importiert den nächsten Stapel jedes aufgeführten GitHub-Repositorys und GlitchTip-Projekts in ein Tale-Projekt, jeweils ab der Stelle, an der sein zuletzt gespeicherter Stapel endete. Jede Quelle wird für sich importiert: Schlägt ihr Import fehl, speichert sie nichts und wird beim nächsten Lauf erneut versucht, während die anderen weiterlaufen. Die Ausgabe des Laufs führt für jede Quelle einen Beleg auf."
  fr:
    name: Importer les issues de plusieurs sources
    description: "Importe le prochain lot de chaque dépôt GitHub et de chaque projet GlitchTip listés dans un projet Tale, chacun à partir de l’endroit où s’est arrêté son dernier lot enregistré. Chaque source est importée séparément : celle dont l’import échoue n’enregistre rien et est réessayée à l’exécution suivante, tandis que les autres continuent. La sortie de l’exécution donne un reçu par source."
