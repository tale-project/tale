<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>a widget that binds its handler after settle is still tracked</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 24px;
      }
      nav {
        background: #222;
        color: #fff;
        padding: 12px;
      }
      /* A plain box: its ONLY component signal is the click listener bound below,
         and no id/class word matches a component-name hint. */
      #lazy {
        display: inline-block;
        margin-top: 30px;
        padding: 14px 20px;
        background: #0a7;
        color: #fff;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Main">Site</nav>
    <div id="lazy">Proceed</div>
    <script>
      // Bound ~100ms AFTER load — past the settle-time scored selection — with NO
      // DOM mutation, so only the re-score-on-listener path can pick it up.
      setTimeout(function () {
        document
          .getElementById('lazy')
          .addEventListener('click', function () {});
      }, 100);
    </script>
  </body>
</html>
