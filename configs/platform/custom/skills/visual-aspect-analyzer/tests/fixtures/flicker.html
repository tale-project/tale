<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>flicker</title>
    <style>
      #overlay {
        width: 120px;
        height: 120px;
        background: #c00;
      }
    </style>
  </head>
  <body>
    <div id="overlay"></div>
    <script>
      // Rapid visibility reversals — flicker, not a clean fade.
      let on = true;
      setInterval(() => {
        on = !on;
        document.getElementById('overlay').style.visibility = on
          ? 'visible'
          : 'hidden';
      }, 30);
    </script>
  </body>
</html>
