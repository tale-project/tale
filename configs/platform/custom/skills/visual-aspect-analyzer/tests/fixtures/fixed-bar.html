<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>fixed bar</title>
    <style>
      body {
        margin: 0;
        width: 3000px;
        height: 3000px;
      }
      #bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 50px;
        background: #0066ff;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <nav id="bar" class="navbar">fixed</nav>
    <p>scroll me on both axes</p>
  </body>
</html>
