<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>shimmer</title>
    <style>
      #gradient {
        width: 120px;
        height: 120px;
      }
    </style>
  </head>
  <body>
    <canvas id="gradient" width="120" height="120"></canvas>
    <script>
      // A geometrically static canvas whose pixels churn every frame while its
      // computed style stays constant: true dithering noise, not a colour
      // transition (the canvas's color/background never change).
      const ctx = document.getElementById('gradient').getContext('2d');
      setInterval(() => {
        const img = ctx.createImageData(120, 120);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = (Math.random() * 255) | 0;
          img.data[i] = v;
          img.data[i + 1] = v;
          img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }, 16);
    </script>
  </body>
</html>
