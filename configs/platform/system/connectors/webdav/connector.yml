# Connector — the organization's own WebDAV file store (the
# platform's `/dav/*` server). Workflow and chat actions read and write org
# files through the platform's native WebDAV module; there is no external HTTP
# to script, so every action is native-backed with a deterministic mock.
# Basic auth carries a WebDAV app password.
name: webdav
displayName: WebDAV Files
i18n:
  de:
    displayName: WebDAV-Dateien
  fr:
    displayName: Fichiers WebDAV
description: >-
  Read, write, and list files in the organization's WebDAV store — the same
  files the /dav endpoint serves.
tags:
  - Files
auth:
  - method: basic
actions:
  - name: list
    title: List folder contents
    i18n:
      de:
        title: Ordnerinhalt auflisten
      fr:
        title: Lister le contenu d’un dossier
    description: List the entries directly under a folder path.
    effects: read
    input:
      type: object
      required: [path]
      properties:
        path: { type: string, description: 'Folder path, e.g. "/reports".' }
    output: '{ entries: Array<{ path: string, name: string, isDir: boolean, size: number }>, truncated: boolean }'
    mock: |
      const base = input.path.replace(/\/+$/, '');
      return {
        entries: [
          { path: `${base}/notes.md`, name: 'notes.md', isDir: false, size: 128 },
          { path: `${base}/archive`, name: 'archive', isDir: true, size: 0 },
        ],
        truncated: false,
      };
    scenarios:
      - name: folder_with_entries
        kind: success
        description: 'The folder holds a note and a subfolder.'
        output:
          entries:
            - { path: '/reports/notes.md', name: notes.md, isDir: false, size: 128 }
            - { path: '/reports/archive', name: archive, isDir: true, size: 0 }
          truncated: false
      - name: empty_folder
        kind: empty
        description: 'The folder exists and holds nothing.'
        when: { path: '/reports/empty' }
        output: { entries: [], truncated: false }
      - name: folder_not_found
        kind: error
        description: 'No file or folder exists at the path.'
        when: { path: '/reports/missing' }
        error:
          message: 'no file or folder at "/reports/missing"'
    backend:
      kind: native
      impl: webdav.list
    exampleInput: { path: '/reports' }
  - name: read
    title: Read file
    i18n:
      de:
        title: Datei lesen
      fr:
        title: Lire un fichier
    description: Read a file's contents.
    effects: read
    input:
      type: object
      required: [path]
      properties:
        path: { type: string, description: 'File path to read.' }
    output: '{ path: string, contentType: string, content: string }'
    mock: |
      return { path: input.path, contentType: 'text/plain', content: `Mock contents of ${input.path}.` };
    scenarios:
      - name: text_file
        kind: success
        description: 'The file holds UTF-8 text, and the store records its type.'
        output: { path: '/reports/q3.md', contentType: 'text/markdown', content: 'Q3 revenue rose.' }
      - name: empty_file
        kind: empty
        description: 'The file exists and holds no text.'
        when: { path: '/reports/empty.md' }
        output: { path: '/reports/empty.md', contentType: 'text/plain', content: '' }
      - name: file_not_found
        kind: error
        description: 'No file exists at the path.'
        when: { path: '/reports/missing.md' }
        error:
          message: 'no file or folder at "/reports/missing.md"'
    backend:
      kind: native
      impl: webdav.read
    exampleInput: { path: '/reports/q3.md' }
  - name: write
    title: Write file
    i18n:
      de:
        title: Datei schreiben
      fr:
        title: Écrire un fichier
    description: Create or overwrite a file with the given contents.
    effects: write
    input:
      type: object
      required: [path, content]
      properties:
        path: { type: string, description: 'File path to write.' }
        content: { type: string, description: 'File contents (UTF-8).' }
        contentType:
          { type: string, description: 'MIME type (default text/plain).' }
    output: '{ path: string, bytesWritten: number }'
    mock: |
      return { path: input.path, bytesWritten: input.content.length };
    scenarios:
      - name: file_written
        kind: success
        description: 'The store writes the file and the action reports its size in bytes.'
        output: { path: '/reports/summary.md', bytesWritten: 9 }
      - name: legal_hold
        kind: refusal
        description: 'A legal hold covers the file, so the store refuses to change it.'
        when: { path: '/reports/held.md' }
        error:
          message: '"/reports/held.md" is under a legal hold and cannot be changed or deleted'
      - name: file_overwritten
        kind: duplicate
        description: 'The same write comes again: the store overwrites the file and answers the same record.'
        output: { path: '/reports/summary.md', bytesWritten: 9 }
    backend:
      kind: native
      impl: webdav.write
    exampleInput: { path: '/reports/summary.md', content: '# Summary' }
  - name: delete
    title: Delete file or folder
    i18n:
      de:
        title: Datei oder Ordner löschen
      fr:
        title: Supprimer un fichier ou un dossier
    description: Delete a file or folder.
    effects: write
    input:
      type: object
      required: [path]
      properties:
        path: { type: string, description: 'File or folder path to delete.' }
    output: '{ path: string, deleted: boolean }'
    mock: |
      return { path: input.path, deleted: true };
    scenarios:
      - name: file_deleted
        kind: success
        description: 'The store removes the file.'
        output: { path: '/reports/old.md', deleted: true }
      - name: legal_hold
        kind: refusal
        description: 'A legal hold covers the file, so the store refuses to delete it.'
        when: { path: '/reports/held.md' }
        error:
          message: '"/reports/held.md" is under a legal hold and cannot be changed or deleted'
      - name: already_gone
        kind: duplicate
        description: 'Nothing is at the path any more, so the store removes nothing and the action reports that.'
        when: { path: '/reports/gone.md' }
        output: { path: '/reports/gone.md', deleted: false }
    backend:
      kind: native
      impl: webdav.delete
    exampleInput: { path: '/reports/old.md' }
