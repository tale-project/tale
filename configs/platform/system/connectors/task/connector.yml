# Platform capability — the organization's task board as automation actions.
# Native-backed over the task domain's own internal mutations, so actor
# attribution (the 'workflow' sentinel), the "agents never complete work"
# invariant, and org scoping hold unchanged. `platform` auth — nothing to
# connect.
name: task
displayName: Tasks
i18n:
  de:
    displayName: Aufgaben
  fr:
    displayName: Tâches
description: >-
  Read a task, move its status, write or read its discussion comments, put
  its project agent to work, sync issue trackers into a project, and keep a
  scheduled issue import's position between occurrences — the platform's own
  task board as automation steps.
tags:
  - Platform
auth:
  - method: platform
actions:
  - name: create
    title: Create task
    i18n:
      de:
        title: Aufgabe erstellen
      fr:
        title: Créer une tâche
    description: >-
      Create a task in a project the automation is installed in — from an
      email, a form, a failed check — with its title, description, assignee,
      status, due date and labels. The assignee is a member's email or user
      id, or an agent of the project by its name or handle. One task per
      execution of the step: a retry returns the task it made. The task names
      the automation as its creator, and its events reach other automations
      as automation-made.
    effects: write
    # The task's id derives from the execution's ledger key, so repeating the
    # call returns the task already made instead of a second one.
    idempotent: true
    input:
      type: object
      required: [projectId, title]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1, description: The project id. }
        title:
          {
            type: string,
            maxLength: 10000,
            description: 'The task title; one over 200 characters is cut, ending in "…".',
          }
        description:
          {
            type: string,
            maxLength: 100000,
            description: 'Markdown; one over the board''s limit is cut.',
          }
        assignee:
          {
            type: string,
            minLength: 1,
            maxLength: 320,
            description: "A member's email or user id, or an agent of the project by its name or handle.",
          }
        status:
          {
            type: string,
            enum: [backlog, todo, in_progress],
            description: 'backlog by default.',
          }
        dueDate:
          {
            type: string,
            minLength: 1,
            maxLength: 40,
            description: 'A date such as 2026-10-17, or an ISO date and time.',
          }
        labels:
          {
            type: array,
            maxItems: 50,
            items: { type: string, minLength: 1, maxLength: 64 },
            description: 'Label names; the project''s catalog gains those it lacks when the run''s starter may edit the project, or a trigger started the run.',
          }
    output: '{ taskId: string, number: number, title: string, url: string }'
    mock: |
      const title = String(input.title ?? '').trim();
      return {
        taskId: 'tsk_mock_1',
        number: 42,
        title: title.length > 200 ? title.slice(0, 199) + '…' : title,
        url: '/dashboard/org_mock/projects/' + input.projectId + '/tasks?task=tsk_mock_1',
      };
    backend:
      kind: native
      impl: task.create
    exampleInput:
      {
        projectId: 'prj_1',
        title: 'Reply to Ada about the refund',
        assignee: 'ada@example.com',
        status: todo,
        dueDate: '2026-10-17',
        labels: [support],
      }
  - name: get
    title: Get task
    i18n:
      de:
        title: Aufgabe abrufen
      fr:
        title: Récupérer une tâche
    description: >-
      Read one task's title, status, project, external linkage, and
      description. description is the text as stored, each mention a link
      `[@Name](mention:<kind>/<id>)`; descriptionText is the same text with
      each mention as `@` and the current name of whoever it names.
      Optional agentRunId reads that exact run on this task, with its agent,
      status, current exec and timestamps only. agentRun is null when the
      requested run is unavailable; omission keeps the original task response.
    effects: read
    input:
      type: object
      required: [taskId]
      additionalProperties: false
      properties:
        taskId: { type: string, description: The task id. }
        agentRunId:
          { type: string, minLength: 1, maxLength: 200, pattern: '\S', description: 'The exact run id on this task; never selects the latest run implicitly.' }
    output: '{ taskId: string, title: string, status: string, projectId: string, externalSystem?: string, externalId?: string, externalUrl?: string, description?: string, descriptionText?: string, agentRun?: { id: string, taskId: string, agentId: string, status: string, execId: string, startedAt: number, launchedAt: number | null, settledAt: number | null } | null }'
    mock: |
      return {
        taskId: String(input.taskId),
        title: 'Document batch — 2026Q1',
        status: 'todo',
        projectId: 'proj_mock',
        externalSystem: 'acme',
        externalId: 'fld_quarter',
        externalUrl: 'fld_setup',
        ...(input.agentRunId !== undefined ? { agentRun: null } : {}),
      };
    backend:
      kind: native
      impl: task.get
    exampleInput: { taskId: 'tsk_1' }
  - name: list
    title: List tasks
    i18n:
      de:
        title: Aufgaben auflisten
      fr:
        title: Lister les tâches
    description: >-
      List a project's tasks, newest first: each one's number, title, status,
      priority, assignee, due date and creation time, with a link to it.
      Narrow it to some statuses, or to tasks created at or after a moment and
      before another (epoch milliseconds or an ISO date and time), so windows
      that follow each other never list a task twice. With order oldest the
      oldest come first, and when more match than limit, next names the last
      one listed: pass it as after, and the next listing carries on behind it
      — even past tasks created in the same millisecond. Archived tasks are left
      out. A run reads only a project its automation is installed in, or any
      project when it is installed in none, within the rights of the person
      who started it; at most 200 tasks per call, and hasMore says when more
      match.
    effects: read
    input:
      type: object
      required: [projectId]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1, description: The project id. }
        status:
          {
            type: array,
            minItems: 1,
            maxItems: 6,
            items:
              {
                type: string,
                enum: [backlog, todo, in_progress, in_review, done, cancelled],
              },
            description: Only tasks in these statuses; every status when left out.,
          }
        createdSince:
          {
            type: [number, string],
            description: 'Only tasks created at or after this moment: epoch milliseconds, or an ISO date such as 2026-10-17 or a date and time.',
          }
        createdBefore:
          {
            type: [number, string],
            description: 'Only tasks created before this moment, the same way: the end of a window, which the next window starts at.',
          }
        order:
          {
            type: string,
            enum: [newest, oldest],
            description: 'newest first (when left out) or oldest first.',
          }
        after:
          {
            type: string,
            maxLength: 300,
            description: "With order oldest: only tasks after this place, the next an earlier listing answered; '' starts from the first.",
          }
        limit:
          {
            type: integer,
            minimum: 1,
            maximum: 200,
            description: At most this many tasks; 50 when left out.,
          }
    output: '{ tasks: Array<{ taskId: string, number: number | null, title: string, status: string, priority: string | null, assignee: { type: string, id: string, name: string | null } | null, dueDate: string | null, createdAt: string, url: string }>, hasMore: boolean, next: string | null }'
    mock: |
      const statuses = Array.isArray(input.status) ? input.status : ['todo'];
      const tasks = [
        {
          taskId: 'tsk_mock_1',
          number: 7,
          title: 'Draft the launch announcement',
          status: statuses[0],
          priority: 'p1',
          assignee: { type: 'user', id: 'usr_mock_1', name: 'Mock Member' },
          dueDate: '2026-10-17',
          createdAt: '2026-10-10T08:00:00.000Z',
          url: '/dashboard/org_mock/projects/' + input.projectId + '/tasks?task=tsk_mock_1',
        },
      ];
      return { tasks: tasks.slice(0, input.limit ?? 50), hasMore: false, next: null };
    backend:
      kind: native
      impl: task.list
    exampleInput: { projectId: 'prj_1', status: [todo], limit: 20 }
  - name: update_status
    title: Change task status
    i18n:
      de:
        title: Aufgabenstatus ändern
      fr:
        title: Changer le statut de la tâche
    description: >-
      Move a task to a new status. The automation acts as the workflow actor.
      Completing is not on offer — done stays reserved for the human review
      gate, so park finished work at in_review and let a person certify it.
      Cancelling is yours to do: abandoning a card is not completing it.
      A task with open subtasks cannot go terminal until those are closed.
    effects: write
    input:
      type: object
      required: [taskId, status]
      additionalProperties: false
      properties:
        taskId: { type: string, description: The task id. }
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, cancelled]
    output: '{ ok: boolean, status: string }'
    mock: |
      return { ok: true, status: String(input.status) };
    backend:
      kind: native
      impl: task.update_status
    exampleInput: { taskId: 'tsk_1', status: 'in_progress' }
  - name: comment
    title: Comment on task
    i18n:
      de:
        title: Aufgabe kommentieren
      fr:
        title: Commenter la tâche
    description: Post a comment on the task's discussion timeline.
    effects: write
    input:
      type: object
      required: [taskId, body]
      additionalProperties: false
      properties:
        taskId: { type: string, description: The task id. }
        body: { type: string, description: Markdown comment body. }
        bodyByLocale:
          type: object
          maxProperties: 16
          additionalProperties: { type: string, minLength: 1, maxLength: 10000 }
          propertyNames: { pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
          required: [en, de, fr]
          properties:
            en: { type: string, minLength: 1, maxLength: 10000 }
            de: { type: string, minLength: 1, maxLength: 10000 }
            fr: { type: string, minLength: 1, maxLength: 10000 }
          description: Optional equivalent per-locale bodies, with en/de/fr required and additional language or language-region keys allowed. Readers select exact locale, base language, then English before falling back to body.
    output: '{ messageId: string }'
    mock: |
      return { messageId: `msg_${String(input.body ?? '').length}` };
    backend:
      kind: native
      impl: task.comment
    exampleInput: { taskId: 'tsk_1', body: 'Prepared the return.' }
  - name: list_comments
    title: List task comments
    i18n:
      de:
        title: Kommentare der Aufgabe auflisten
      fr:
        title: Lister les commentaires de la tâche
    description: >-
      Read the task's discussion comments, optionally only those newer than
      the last comment containing a marker (a delivery anchor) and only from
      certain author kinds. body is each comment as stored, each mention a
      link `[@Name](mention:<kind>/<id>)`; bodyText is the same text with each
      mention as `@` and the current name of whoever it names.
      includeIds adds each native messageId beside its author metadata; the
      default response stays unchanged. A comment body cannot supply its ID.
    effects: read
    input:
      type: object
      required: [taskId]
      additionalProperties: false
      properties:
        taskId: { type: string, description: The task id. }
        includeIds: { type: boolean, description: Include the native messageId on each comment. }
        authorTypes:
          type: array
          items: { type: string, enum: [user, agent] }
          description: Keep only these author kinds.
        afterMarker:
          type: string
          description: Only comments newer than the last one whose body or bodyText contains this text.
        limit: { type: number, description: 'Newest N comments (max 100).' }
    output: '{ count: number, truncated: boolean, comments: Array<{ messageId?: string, authorType: string, authorId: string, body: string, bodyText: string, bodyByLocale?: Record<string, string>, createdAt: number }> }'
    mock: |
      return {
        count: 1,
        truncated: false,
        comments: [
          { ...(input.includeIds === true ? { messageId: 'msg_mock_1' } : {}), authorType: 'user', authorId: 'usr_mock', body: 'Please re-check page 3.', bodyText: 'Please re-check page 3.', createdAt: 1_750_000_000_000 },
        ],
      };
    backend:
      kind: native
      impl: task.list_comments
    exampleInput: { taskId: 'tsk_1', authorTypes: [user], limit: 20 }
  - name: start_agent
    title: Start project agent
    i18n:
      de:
        title: Projektagenten starten
      fr:
        title: Lancer l’agent de projet
    description: >-
      Put the task's project agent to work, or first assign it to the agent
      named by agentId (an agent of the same project), and answer the run it
      started. The automation must be bound to the task's project, and its
      run must be started by a person who can edit that project or by an
      enabled schedule; webhook and event runs cannot start agents. The run
      answers to that person, or to the schedule (booked as automation spend,
      with no person's connector access). feedback is what the run addresses
      first. moveToInProgress (default true) moves the card to In progress and
      the finished work waits at In review, withdrawing a review still pending
      on earlier work; false leaves the card where it is and asks for no
      review, for a standing task in To do that reports on every occurrence.
      Starts nothing, without failing, when the task's live run already
      carries the work (already_running), an in-place start meets a card
      waiting for a person's review (in_review) or one already Done or
      Cancelled (closed), an open task blocks this one (blocked), or the task
      took three starts by automations and agents, ordinary automatic retries
      included, in the last hour (paused). One broker cooldown immediately
      after the same agent's HTTP 429 adds no start; consecutive cooldowns
      still count. A run the provider refused because its model is at
      capacity adds no start either. Honor the returned retryAfter and every other admission
      check. An agent working other tasks is started all the same, in a
      worker of its own; a run that finds no room waits and starts by itself,
      and waitingReason says why: org_limit (every agent worker of the
      organization is in use), host (the sandbox host is full),
      destroy_pending (its workspace is being deleted), exec_limit (its
      sandbox is still ending an earlier process) or model_capacity (its
      model is at capacity, and every run on it waits until it answers
      again). A step delivered again
      answers the run its first delivery started.
    effects: write
    input:
      type: object
      required: [taskId]
      additionalProperties: false
      properties:
        taskId: { type: string, description: The task to work on. }
        agentId:
          type: string
          description: The project agent to assign and start; the task's agent assignee when omitted.
        feedback:
          type: string
          maxLength: 10000
          description: What the run addresses first, such as the occurrence it serves or the receipts of earlier steps.
        moveToInProgress:
          type: boolean
          description: Move the card to In progress and park the result at In review (default), or leave it where it is — only under open work (Backlog, To do, In progress).
    output: '{ started: boolean, runId: string | null, taskId: string, agentId: string, reason?: "already_running" | "in_review" | "closed" | "blocked" | "paused", replayed?: boolean, waitingReason?: "org_limit" | "host" | "destroy_pending" | "exec_limit" | "model_capacity", taskStatus?: string, blockedBy?: string[], retryAfter?: number }'
    mock: |
      return {
        started: true,
        runId: 'run_mock',
        taskId: String(input.taskId),
        agentId: String(input.agentId ?? 'agent_mock'),
      };
    backend:
      kind: native
      impl: task.start_agent
    exampleInput: { taskId: 'tsk_1', feedback: 'Scheduled occurrence 2026-09-30 09:00 Europe/Zurich.' }
  - name: sync_issues
    title: Sync issues
    i18n:
      de:
        title: Issues synchronisieren
      fr:
        title: Synchroniser les issues
    description: >-
      Keep a project's tasks in step with a list of issue sources in one step:
      a GitHub repository's issues or pull requests (github), its security
      alerts (github-security), a Forgejo repository's issues or pull requests
      (forgejo), a GlitchTip project's issues (glitchtip). For each source, in
      the order listed: read the next batch of open items (limit, 100 by
      default) from where its last saved batch stopped, refresh up to
      refreshLimit (50) items imported earlier, the longest-unchecked first,
      write every item into its task, and save where the batch stopped; once
      the listing is drained, the next run starts the next pass. A new item
      becomes a task in Backlog, given the source's taskLabels; an item
      imported before refreshes its task's source snapshot (title,
      description, state) and leaves the task's own title, description,
      status, labels and assignee alone, closed upstream or not. Each alert is
      one task, and a secret is never read. Each source answers for itself in
      its receipt: one whose tracker fails does not stop the others, an item
      the tracker refuses or a task write refused is skipped and tried again
      later, and a source the tracker rate-limits stops for this run, keeps
      what it did, and is left alone until the time it named (retryAfter).
      The step fails only when every source failed, or with failOn any as
      soon as one did; a source waiting out a rate limit has not failed.
      credential names the stored connection a source is read with, by name;
      the organization's default when it is empty. Positions are kept per
      project, tracker, source (owner/repo, organization/project) and filter,
      and for forgejo and glitchtip, whose connection names the instance, per
      credential, so automations naming the same source under the same filter
      share one pass, and a source under another filter or on another
      instance keeps its own. Runs only as an automation step.
    effects: write
    # Safe to repeat: issues are written by their source identity and a
    # position moves only from the revision its run read, so a repeated sync
    # reads the next batch or writes the same tasks again, never twins.
    idempotent: true
    input:
      type: object
      required: [projectId, sources]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1, description: The project whose tasks the issues become. }
        sources:
          type: array
          minItems: 1
          maxItems: 20
          description: The issue sources, synced one after the other in the order listed.
          items:
            oneOf:
              - type: object
                required: [kind, owner, repo]
                additionalProperties: false
                properties:
                  kind: { type: string, enum: [github] }
                  owner: { type: string, minLength: 1, maxLength: 99, description: The repository's owner. }
                  repo: { type: string, minLength: 1, maxLength: 100, description: The repository's name. }
                  type: { type: string, enum: [issues, pulls], description: 'Its open issues (the default) or its open pull requests.' }
                  labels: { type: string, maxLength: 1000, description: 'Only items carrying every one of these labels, separated by commas; every open item when empty.' }
                  author: { type: string, maxLength: 100, description: 'Only the items this login opened, such as renovate[bot]; anyone''s when empty.' }
                  credential: { type: string, maxLength: 200, description: 'The GitHub connection to read with, by name; the default one when empty or left out.' }
                  taskLabels: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 50 }, description: 'Labels the tasks this source creates are given, such as source:github.' }
              - type: object
                required: [kind, owner, repo, alerts]
                additionalProperties: false
                properties:
                  kind: { type: string, enum: [github-security] }
                  owner: { type: string, minLength: 1, maxLength: 99, description: The repository's owner. }
                  repo: { type: string, minLength: 1, maxLength: 100, description: The repository's name. }
                  alerts: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { type: string, enum: [code-scanning, dependabot, secret-scanning] }, description: The kinds of security alert to read. }
                  minSeverity: { type: string, enum: [low, medium, high, critical], description: 'Only alerts at or above this severity (error counts as high, warning as medium, note as low, a secret as critical); every alert when left out.' }
                  tools: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 100 }, description: 'Only code scanning alerts from these tools, such as CodeQL; every tool when empty.' }
                  credential: { type: string, maxLength: 200, description: 'The GitHub connection to read with, by name; the default one when empty or left out.' }
                  taskLabels: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 50 }, description: 'Labels the tasks this source creates are given, such as source:security.' }
              - type: object
                required: [kind, owner, repo]
                additionalProperties: false
                properties:
                  kind: { type: string, enum: [forgejo] }
                  owner: { type: string, minLength: 1, maxLength: 99, description: The repository's owner. }
                  repo: { type: string, minLength: 1, maxLength: 100, description: The repository's name. }
                  type: { type: string, enum: [issues, pulls], description: 'Its open issues (the default) or its open pull requests.' }
                  labels: { type: string, maxLength: 1000, description: 'Only items carrying any of these labels, separated by commas; every open item when empty.' }
                  author: { type: string, maxLength: 100, description: 'Only the items this user opened, such as renovate; anyone''s when empty.' }
                  credential: { type: string, maxLength: 200, description: 'The Forgejo connection to read with, by name; the default one when empty or left out. The connection names the instance.' }
                  taskLabels: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 50 }, description: 'Labels the tasks this source creates are given, such as source:forgejo.' }
              - type: object
                required: [kind, organization, project]
                additionalProperties: false
                properties:
                  kind: { type: string, enum: [glitchtip] }
                  organization: { type: string, minLength: 1, maxLength: 100, description: The GlitchTip organization's slug. }
                  project: { type: string, minLength: 1, maxLength: 99, description: The GlitchTip project's slug. }
                  query: { type: string, maxLength: 2000, description: 'A GlitchTip search for the issues to read; is:unresolved when empty.' }
                  credential: { type: string, maxLength: 200, description: 'The GlitchTip connection to read with, by name; the default one when empty or left out.' }
                  taskLabels: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 50 }, description: 'Labels the tasks this source creates are given, such as source:glitchtip.' }
        limit: { type: integer, minimum: 1, maximum: 500, description: 'New open items read per source and run; 100 when left out.' }
        refreshLimit: { type: integer, minimum: 0, maximum: 500, description: 'Items imported earlier refreshed per source and run, the longest-unchecked first; 50 when left out, 0 for none.' }
        failOn: { type: string, enum: [all, any], description: 'When the step fails: all (the default) only when every source failed, any as soon as one did. A source waiting out a rate limit has not failed.' }
    output: '{ sources: Array<{ kind: string, source: string, filter?: string, ok: boolean, error: string | null, message?: string, status?: number, batch: number, resumed: boolean, restarted: boolean, saved: boolean, conflict: boolean, drained: boolean, discovered: number, created: number, refreshed: number, unchanged: number, skipped: number, closedUpstream: number, reopenedUpstream: number, unavailableUpstream: number, retryAfter: number | null, skippedIssues?: Array<{ externalId: string, reason: string }> }>, failed: number, rateLimited: number, created: number, refreshed: number, unchanged: number, skipped: number, closedUpstream: number }'
    mock: |
      const receipts = input.sources.map((source) => ({
        kind: source.kind,
        source: source.kind === 'glitchtip' ? source.organization + '/' + source.project : source.owner + '/' + source.repo,
        ok: true, error: null, batch: 1, resumed: false, restarted: false, saved: true, conflict: false, drained: true,
        discovered: 1, created: 1, refreshed: 0, unchanged: 0, skipped: 0,
        closedUpstream: 0, reopenedUpstream: 0, unavailableUpstream: 0, retryAfter: null,
      }));
      return { sources: receipts, failed: 0, rateLimited: 0, created: receipts.length, refreshed: 0, unchanged: 0, skipped: 0, closedUpstream: 0 };
    backend:
      kind: native
      impl: task.sync_issues
    exampleInput:
      projectId: proj_mock
      sources:
        - { kind: github, owner: example, repo: web, labels: bug, taskLabels: ['source:github'] }
        - { kind: github, owner: example, repo: web, type: pulls, author: 'renovate[bot]' }
        - { kind: github-security, owner: example, repo: web, alerts: [code-scanning, dependabot], minSeverity: high, tools: [CodeQL] }
        - { kind: forgejo, owner: example, repo: web, type: issues }
        - { kind: glitchtip, organization: example, project: web }
  - name: upsert
    title: Import issue as task
    i18n:
      de:
        title: Issue als Aufgabe importieren
      fr:
        title: Importer une issue comme tâche
    description: Import an external issue into a project's backlog, reusing its existing task on repeat imports. Keeps local status, assignee, and non-empty description. A title over 200 or a description over 20,000 UTF-16 code units is cut to that length, ending in "…"; a blank title is refused. Returns the title the task carries. Does not start an agent.
    effects: write
    input:
      type: object
      required: [projectId, externalSystem, externalId, title]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1 }
        externalSystem: { type: string, minLength: 1, maxLength: 100 }
        externalId: { type: string, minLength: 1, maxLength: 2000 }
        externalIssue: { type: object }
        # No minLength: the native refuses a blank title with the sentence
        # every task door answers, which this schema would pre-empt.
        title: { type: string, maxLength: 10000 }
        description: { type: string, maxLength: 100000 }
        externalUrl: { type: string, maxLength: 4000 }
    output: '{ taskId: string | null, created: boolean, title: string }'
    # The task domain's own cut and refusal, so a test run reports the title
    # a live run stores (platform-tasks.test.ts holds the two together). A
    # mock body can only throw: a test run reports the blank-title sentence
    # under MOCK_BODY_FAILED ("the task.upsert mock body failed: …"),
    # where a live run answers INPUT_INVALID (dispatcher.test.ts).
    mock: |
      const title = String(input.title ?? '').trim();
      if (title === '') throw new Error('The task title is empty — it takes 1 to 200 UTF-16 code units.');
      const stored = title.length <= 200 ? title : title.slice(0, new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(title).containing(199).index).trimEnd() + '…';
      return { taskId: 'task_' + String(input.externalSystem) + '_' + String(input.externalId), created: true, title: stored };
    backend:
      kind: native
      impl: task.upsert
    exampleInput: { projectId: 'proj_mock', externalSystem: github, externalId: 'octocat/demo#1', title: Example issue }
  - name: list_external_issues
    title: List imported issues
    i18n:
      de:
        title: Importierte Issues auflisten
      fr:
        title: Lister les issues importées
    description: List previously imported issue sources for this project and immutable upstream repository/project (and, for a tracker each connection names, its instance as sourceOrigin). itemKind narrows a code host's tasks to its issues or its pull requests. Oldest snapshots come first so repeated runs make progress through large boards.
    effects: read
    input:
      type: object
      required: [projectId, externalSystem]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1 }
        externalSystem: { type: string, enum: [github, github-security, forgejo, glitchtip] }
        repositoryId: { type: integer, minimum: 1 }
        sourceOrigin: { type: string }
        sourceProjectId: { type: string, minLength: 1 }
        itemKind: { type: string, enum: [issues, pulls] }
        limit: { type: integer, minimum: 1, maximum: 500 }
        legacyPrefixes: { type: array, maxItems: 2, items: { type: string, minLength: 1, maxLength: 4000 } }
    output: '{ issues: Array<{ taskId: string, externalId: string, externalIssue: object }>, hasMore: boolean }'
    mock: |
      return { issues: [], hasMore: false };
    backend:
      kind: native
      impl: task.list_external_issues
    exampleInput: { projectId: proj_mock, externalSystem: github, repositoryId: 1 }
  - name: get_import_cursor
    title: Get import position
    i18n:
      de:
        title: Importposition abrufen
      fr:
        title: Récupérer la position de l’import
    description: >-
      Where a scheduled issue import of this project's source resumes: the
      cursor its last saved batch left, so each occurrence imports one bounded
      batch from where the previous one stopped until the listing is drained.
      Pass cursor to the importer, and hand revision back to
      save_import_cursor: it is the position's opaque compare token, new after
      every saved batch, drain and restart, so it never repeats even when the
      cursor text does. Answers '' for the first batch of a pass. Reading a
      stored cursor counts an attempt; after three reads without a save (the
      batch keeps failing) the next read starts the pass over (restarted).
      Runs only as an automation step.
    effects: read
    input:
      type: object
      required: [projectId, externalSystem, source]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1 }
        externalSystem: { type: string, enum: [github, github-security, forgejo, glitchtip] }
        source:
          type: string
          minLength: 1
          maxLength: 200
          description: Your name for the listing, such as owner/repo; automations naming the same source share one pass.
    output: '{ cursor: string, revision: string, batch: number, resumed: boolean, restarted: boolean, passStartedAt: number | null, lastDrainedAt: number | null }'
    mock: |
      return { cursor: '', revision: '1', batch: 1, resumed: false, restarted: false, passStartedAt: null, lastDrainedAt: null };
    backend:
      kind: native
      impl: task.get_import_cursor
    exampleInput: { projectId: proj_mock, externalSystem: github, source: example/web }
  - name: save_import_cursor
    title: Save import position
    i18n:
      de:
        title: Importposition speichern
      fr:
        title: Enregistrer la position de l’import
    description: >-
      Record how far a scheduled issue import got: revision is the one
      get_import_cursor answered for this batch, and next the importer's
      nextCursor, or '' once the listing is drained, which completes the pass.
      Saves only while the position is still at that revision, so a failed
      import (whose run saves nothing) retries its batch next occurrence, and a
      save from any earlier revision (an overlapping run, a delayed run of a
      completed pass, a stale end of the listing) is refused and writes nothing
      (saved false, conflict true). Runs only as an automation step.
    effects: write
    input:
      type: object
      required: [projectId, externalSystem, source, revision, next]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1 }
        externalSystem: { type: string, enum: [github, github-security, forgejo, glitchtip] }
        source: { type: string, minLength: 1, maxLength: 200 }
        revision: { type: string, minLength: 1, maxLength: 40, description: The revision get_import_cursor answered for this batch. }
        next: { type: string, maxLength: 12000, description: "The importer's nextCursor; '' once the listing is drained." }
    output: '{ saved: boolean, drained: boolean, batch: number, conflict: boolean, revision: string }'
    mock: |
      return { saved: true, drained: String(input.next ?? '') === '', batch: 1, conflict: false, revision: '2' };
    backend:
      kind: native
      impl: task.save_import_cursor
    exampleInput: { projectId: proj_mock, externalSystem: github, source: example/web, revision: '1', next: '' }
  - name: upsert_issues
    title: Import issues as tasks
    i18n:
      de:
        title: Issues als Aufgaben importieren
      fr:
        title: Importer des issues comme tâches
    description: Atomically import or refresh a batch of issue snapshots. New tasks require an open source; repeat sync keeps Tale edits and status. Titles and descriptions are cut to 200 and 20,000 UTF-16 code units, ending in "…"; a blank title refuses the batch, naming the item. Returns one result per source with the title its task carries, and taskId null when a closed source has no task.
    effects: write
    input:
      type: object
      required: [projectId, issues]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1 }
        issues: { type: array, maxItems: 500, items: { type: object } }
    output: 'Array<{ taskId: string | null, created: boolean, title: string }>'
    # As `upsert`'s mock: the domain's cut, and its refusal thrown as a mock
    # failure.
    mock: |
      const graphemes = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
      const cut = (title) => title.length <= 200 ? title : title.slice(0, graphemes.segment(title).containing(199).index).trimEnd() + '…';
      return input.issues.map((issue, index) => {
        const title = String(issue.title ?? '').trim();
        if (title === '') throw new Error('issues.' + index + ': The task title is empty — it takes 1 to 200 UTF-16 code units.');
        return { taskId: 'task_' + String(issue.externalSystem) + '_' + String(issue.externalId), created: true, title: cut(title) };
      });
    backend:
      kind: native
      impl: task.upsert_issues
    exampleInput: { projectId: proj_mock, issues: [] }
