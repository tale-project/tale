# Platform capability — the organization's task board as automation actions.
# Native-backed over the task domain's own internal mutations, so actor
# attribution (the 'workflow' sentinel), the "agents never complete work"
# invariant, and org scoping hold unchanged. `platform` auth — nothing to
# connect.
name: task
displayName: Tasks
description: >-
  Read a task, move its status, and write or read its discussion comments —
  the platform's own task board as automation steps.
tags:
  - Platform
auth:
  - method: platform
actions:
  - name: get
    description: Read one task's title, status, project, and external linkage.
    effects: read
    input:
      type: object
      required: [taskId]
      additionalProperties: false
      properties:
        taskId: { type: string, description: The task id. }
    output: '{ taskId: string, title: string, status: string, projectId: string, externalSystem?: string, externalId?: string, externalUrl?: string }'
    mock: |
      return {
        taskId: String(input.taskId),
        title: 'Document batch — 2026Q1',
        status: 'todo',
        projectId: 'proj_mock',
        externalSystem: 'acme',
        externalId: 'fld_quarter',
        externalUrl: 'fld_setup',
      };
    backend:
      kind: native
      impl: task.get
    exampleInput: { taskId: 'tsk_1' }
  - name: update_status
    description: >-
      Move a task to a new status. The automation acts as the workflow actor.
      Completing is not on offer — done stays reserved for the human review
      gate, so park finished work at in_review and let a person certify it.
      Cancelling is yours to do: abandoning a card is not completing it.
      A task with open subtasks cannot go terminal until those are closed.
    effects: write
    input:
      type: object
      required: [taskId, status]
      additionalProperties: false
      properties:
        taskId: { type: string, description: The task id. }
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, cancelled]
    output: '{ ok: boolean, status: string }'
    mock: |
      return { ok: true, status: String(input.status) };
    backend:
      kind: native
      impl: task.update_status
    exampleInput: { taskId: 'tsk_1', status: 'in_progress' }
  - name: comment
    description: Post a comment on the task's discussion timeline.
    effects: write
    input:
      type: object
      required: [taskId, body]
      additionalProperties: false
      properties:
        taskId: { type: string, description: The task id. }
        body: { type: string, description: Markdown comment body. }
        bodyByLocale:
          type: object
          maxProperties: 16
          additionalProperties: { type: string, minLength: 1, maxLength: 10000 }
          propertyNames: { pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
          required: [en, de, fr]
          properties:
            en: { type: string, minLength: 1, maxLength: 10000 }
            de: { type: string, minLength: 1, maxLength: 10000 }
            fr: { type: string, minLength: 1, maxLength: 10000 }
          description: Optional equivalent per-locale bodies, with en/de/fr required and additional language or language-region keys allowed. Readers select exact locale, base language, then English before falling back to body.
    output: '{ messageId: string }'
    mock: |
      return { messageId: `msg_${String(input.body ?? '').length}` };
    backend:
      kind: native
      impl: task.comment
    exampleInput: { taskId: 'tsk_1', body: 'Prepared the return.' }
  - name: list_comments
    description: >-
      Read the task's discussion comments, optionally only those newer than
      the last comment containing a marker (a delivery anchor) and only from
      certain author kinds.
    effects: read
    input:
      type: object
      required: [taskId]
      additionalProperties: false
      properties:
        taskId: { type: string, description: The task id. }
        authorTypes:
          type: array
          items: { type: string, enum: [user, agent] }
          description: Keep only these author kinds.
        afterMarker:
          type: string
          description: Only comments newer than the last one containing this text.
        limit: { type: number, description: 'Newest N comments (max 100).' }
    output: '{ count: number, truncated: boolean, comments: Array<{ authorType: string, authorId: string, body: string, bodyByLocale?: Record<string, string>, createdAt: number }> }'
    mock: |
      return {
        count: 1,
        truncated: false,
        comments: [
          { authorType: 'user', authorId: 'usr_mock', body: 'Please re-check page 3.', createdAt: 1_750_000_000_000 },
        ],
      };
    backend:
      kind: native
      impl: task.list_comments
    exampleInput: { taskId: 'tsk_1', authorTypes: [user], limit: 20 }
  - name: upsert
    description: Import an external issue into a project's backlog, reusing its existing task on repeat imports. Keeps local status, assignee, and non-empty description. Does not start an agent.
    effects: write
    input:
      type: object
      required: [projectId, externalSystem, externalId, title]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1 }
        externalSystem: { type: string, minLength: 1, maxLength: 100 }
        externalId: { type: string, minLength: 1, maxLength: 2000 }
        externalIssue: { type: object }
        title: { type: string, minLength: 1, maxLength: 10000 }
        description: { type: string, maxLength: 100000 }
        externalUrl: { type: string, maxLength: 4000 }
    output: '{ taskId: string | null, created: boolean, title: string }'
    mock: |
      return { taskId: 'task_' + String(input.externalSystem) + '_' + String(input.externalId), created: true, title: input.title };
    backend:
      kind: native
      impl: task.upsert
    exampleInput: { projectId: 'proj_mock', externalSystem: github, externalId: 'octocat/demo#1', title: Example issue }
  - name: list_external_issues
    description: List previously imported issue sources for this project and immutable upstream repository/project. Oldest snapshots come first so repeated runs make progress through large boards.
    effects: read
    input:
      type: object
      required: [projectId, externalSystem]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1 }
        externalSystem: { type: string, enum: [github, glitchtip] }
        repositoryId: { type: integer, minimum: 1 }
        sourceOrigin: { type: string }
        sourceProjectId: { type: string, minLength: 1 }
        limit: { type: integer, minimum: 1, maximum: 500 }
        legacyPrefixes: { type: array, maxItems: 2, items: { type: string, minLength: 1, maxLength: 4000 } }
    output: '{ issues: Array<{ taskId: string, externalId: string, externalIssue: object }>, hasMore: boolean }'
    mock: |
      return { issues: [], hasMore: false };
    backend:
      kind: native
      impl: task.list_external_issues
    exampleInput: { projectId: proj_mock, externalSystem: github, repositoryId: 1 }
  - name: upsert_issues
    description: Atomically import or refresh a batch of issue snapshots. New tasks require an open source; repeat sync keeps Tale edits and status. Returns one result per source, with taskId null when a closed source has no task.
    effects: write
    input:
      type: object
      required: [projectId, issues]
      additionalProperties: false
      properties:
        projectId: { type: string, minLength: 1 }
        issues: { type: array, maxItems: 500, items: { type: object } }
    output: 'Array<{ taskId: string | null, created: boolean, title: string }>'
    mock: |
      return input.issues.map((issue) => ({ taskId: 'task_' + String(issue.externalSystem) + '_' + String(issue.externalId), created: true, title: issue.title }));
    backend:
      kind: native
      impl: task.upsert_issues
    exampleInput: { projectId: proj_mock, issues: [] }
