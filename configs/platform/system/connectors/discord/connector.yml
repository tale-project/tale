# Connector — Discord API v10. A bot token (bearer) authorizes every
# action; the platform injects it as the Authorization header, so the live bodies
# below carry only Discord's functional headers. Reads return the resource(s)
# under a named key; writes return the identifiers a caller routes on. Discord's
# status-specific failures (bad token, missing permission, rate limit) are
# surfaced as readable errors. Every mock is deterministic — same input, same
# output, no IO.
name: discord
displayName: Discord
description: Post messages and manage channels in your Discord server.
tags:
  - Messaging
allowedHosts:
  - discord.com
auth:
  # Discord authenticates bot tokens with its own `Bot` scheme; the standard
  # `Bearer` scheme is only accepted for OAuth2 access tokens.
  - method: bearer
    scheme: Bot
actions:
  - name: list_guilds
    title: List servers
    i18n:
      de:
        title: Server auflisten
      fr:
        title: Lister les serveurs
    description: List the guilds (servers) the bot is a member of.
    effects: read
    input:
      type: object
      properties:
        limit:
          type: number
          description: 'Number of guilds to return (max 200, default 50).'
        before:
          type: string
          description: 'Return guilds before this guild ID.'
        after:
          type: string
          description: 'Return guilds after this guild ID.'
    output: '{ guilds: Array<{ id: string, name: string, owner: boolean }> }'
    mock: |
      return { guilds: [{ id: '100000000000000001', name: 'Demo Server', owner: true }] };
    scenarios:
      - name: two_guilds
        kind: success
        description: 'The bot is a member of two servers, one of which it owns.'
        output:
          guilds:
            - { id: '100000000000000001', name: 'Demo Server', owner: true }
            - { id: '100000000000000002', name: 'Demo Community', owner: false }
      - name: no_guilds
        kind: empty
        description: 'The bot is a member of no server yet.'
        output:
          guilds: []
      - name: invalid_token
        kind: error
        description: 'Discord rejects the bot token with HTTP 401.'
        error:
          message: 'Discord list_guilds failed (401): authentication rejected — verify the bot token'
          status: 401
      - name: rate_limited
        kind: error
        description: 'Discord rate-limits the bot with HTTP 429.'
        error:
          message: 'Discord list_guilds failed (429): rate limited by Discord — retry later'
          status: 429
    backend:
      kind: yaml-js
      live: |
        const q = ['limit=' + Math.min(Number(input.limit) || 50, 200)];
        for (const k of ['before', 'after']) if (input[k] != null && input[k] !== '') q.push(k + '=' + encodeURIComponent(String(input[k])));
        const r = await ctx.http.get(`https://discord.com/api/v10/users/@me/guilds?${q.join('&')}`, { headers: { 'Content-Type': 'application/json' } });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Discord list_guilds failed (${r.status}): ${r.status === 401 ? 'authentication rejected — verify the bot token' : r.status === 403 ? 'permission denied — the bot lacks the required permissions' : r.status === 429 ? 'rate limited by Discord — retry later' : r.text()}`), { status: r.status });
        return { guilds: r.json() };
    exampleInput: { limit: 50 }
  - name: get_guild
    title: Get server
    i18n:
      de:
        title: Server abrufen
      fr:
        title: Récupérer un serveur
    description: Get a single guild (server) by ID.
    effects: read
    input:
      type: object
      required: [guild_id]
      properties:
        guild_id:
          type: string
          description: 'Guild (server) ID.'
    output: '{ guild: { id: string, name: string, owner_id: string, description: string | null } }'
    mock: |
      return { guild: { id: input.guild_id, name: 'Demo Server', owner_id: '200000000000000001', description: 'A mock guild.' } };
    scenarios:
      - name: guild
        kind: success
        description: 'Discord returns the server with its description.'
        output:
          guild: { id: '100000000000000001', name: 'Demo Server', owner_id: '200000000000000001', description: 'A demo server for the sales team.' }
      - name: no_description
        kind: empty
        description: 'Discord returns a server that has no description, which it answers as null.'
        output:
          guild: { id: '100000000000000002', name: 'Demo Community', owner_id: '200000000000000001', description: null }
      - name: guild_not_found
        kind: error
        description: 'Discord answers HTTP 404 for a server ID it does not know.'
        error:
          message: 'Discord get_guild failed (404): guild not found'
          status: 404
      - name: rate_limited
        kind: error
        description: 'Discord rate-limits the bot with HTTP 429.'
        error:
          message: 'Discord get_guild failed (429): rate limited by Discord — retry later'
          status: 429
    backend:
      kind: yaml-js
      live: |
        const r = await ctx.http.get(`https://discord.com/api/v10/guilds/${encodeURIComponent(input.guild_id)}`, { headers: { 'Content-Type': 'application/json' } });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Discord get_guild failed (${r.status}): ${r.status === 401 ? 'authentication rejected — verify the bot token' : r.status === 403 ? 'permission denied — the bot lacks the required permissions' : r.status === 404 ? 'guild not found' : r.status === 429 ? 'rate limited by Discord — retry later' : r.text()}`), { status: r.status });
        return { guild: r.json() };
    exampleInput: { guild_id: '100000000000000001' }
  - name: list_channels
    title: List channels
    i18n:
      de:
        title: Kanäle auflisten
      fr:
        title: Lister les salons
    description: List all channels in a guild.
    effects: read
    input:
      type: object
      required: [guild_id]
      properties:
        guild_id:
          type: string
          description: 'Guild (server) ID.'
    output: '{ channels: Array<{ id: string, name: string, type: number, position: number }> }'
    mock: |
      return { channels: [{ id: '300000000000000001', name: 'general', type: 0, position: 0 }] };
    scenarios:
      - name: two_channels
        kind: success
        description: 'The server has two text channels, in their display order.'
        output:
          channels:
            - { id: '300000000000000001', name: 'general', type: 0, position: 0 }
            - { id: '300000000000000002', name: 'release-notes', type: 0, position: 1 }
      - name: no_channels
        kind: empty
        description: 'The bot sees no channel in the server.'
        output:
          channels: []
      - name: guild_not_found
        kind: error
        description: 'Discord answers HTTP 404 for a server ID it does not know.'
        error:
          message: 'Discord list_channels failed (404): guild not found'
          status: 404
      - name: rate_limited
        kind: error
        description: 'Discord rate-limits the bot with HTTP 429.'
        error:
          message: 'Discord list_channels failed (429): rate limited by Discord — retry later'
          status: 429
    backend:
      kind: yaml-js
      live: |
        const r = await ctx.http.get(`https://discord.com/api/v10/guilds/${encodeURIComponent(input.guild_id)}/channels`, { headers: { 'Content-Type': 'application/json' } });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Discord list_channels failed (${r.status}): ${r.status === 401 ? 'authentication rejected — verify the bot token' : r.status === 403 ? 'permission denied — the bot lacks the required permissions' : r.status === 404 ? 'guild not found' : r.status === 429 ? 'rate limited by Discord — retry later' : r.text()}`), { status: r.status });
        return { channels: r.json() };
    exampleInput: { guild_id: '100000000000000001' }
  - name: list_messages
    title: List messages
    i18n:
      de:
        title: Nachrichten auflisten
      fr:
        title: Lister les messages
    description: Fetch recent messages from a channel.
    effects: read
    input:
      type: object
      required: [channel_id]
      properties:
        channel_id:
          type: string
          description: 'Channel ID.'
        limit:
          type: number
          description: 'Number of messages to return (max 100, default 50).'
        before:
          type: string
          description: 'Return messages before this message ID.'
        after:
          type: string
          description: 'Return messages after this message ID.'
        around:
          type: string
          description: 'Return messages around this message ID.'
    output: '{ messages: Array<{ id: string, content: string, author: { id: string, username: string }, timestamp: string }> }'
    mock: |
      return { messages: [{ id: '400000000000000001', content: 'Hello from the mock channel.', author: { id: '200000000000000001', username: 'demo-user' }, timestamp: '2024-01-01T00:00:00.000Z' }] };
    scenarios:
      - name: two_messages
        kind: success
        description: 'The channel holds two recent messages, from two members.'
        output:
          messages:
            - { id: '400000000000000001', content: 'Hello from the mock channel.', author: { id: '200000000000000001', username: 'demo-user' }, timestamp: '2024-01-01T00:00:00.000Z' }
            - { id: '400000000000000002', content: 'Deploy finished.', author: { id: '200000000000000002', username: 'demo-bot' }, timestamp: '2024-01-01T00:05:00.000Z' }
      - name: no_messages
        kind: empty
        description: 'The channel holds no message yet.'
        output:
          messages: []
      - name: channel_not_found
        kind: error
        description: 'Discord answers HTTP 404 for a channel ID it does not know.'
        error:
          message: 'Discord list_messages failed (404): channel not found'
          status: 404
      - name: no_read_permission
        kind: error
        description: 'Discord refuses with HTTP 403 because the bot cannot read the channel.'
        error:
          message: 'Discord list_messages failed (403): permission denied — the bot cannot read this channel'
          status: 403
    backend:
      kind: yaml-js
      live: |
        const q = ['limit=' + Math.min(Number(input.limit) || 50, 100)];
        for (const k of ['before', 'after', 'around']) if (input[k] != null && input[k] !== '') q.push(k + '=' + encodeURIComponent(String(input[k])));
        const r = await ctx.http.get(`https://discord.com/api/v10/channels/${encodeURIComponent(input.channel_id)}/messages?${q.join('&')}`, { headers: { 'Content-Type': 'application/json' } });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Discord list_messages failed (${r.status}): ${r.status === 401 ? 'authentication rejected — verify the bot token' : r.status === 403 ? 'permission denied — the bot cannot read this channel' : r.status === 404 ? 'channel not found' : r.status === 429 ? 'rate limited by Discord — retry later' : r.text()}`), { status: r.status });
        return { messages: r.json() };
    exampleInput: { channel_id: '300000000000000001', limit: 20 }
  - name: send_message
    title: Send message
    i18n:
      de:
        title: Nachricht senden
      fr:
        title: Envoyer un message
    description: Send a message to a channel.
    effects: write
    input:
      type: object
      required: [channel_id, content]
      properties:
        channel_id:
          type: string
          description: 'Channel ID.'
        content:
          type: string
          description: 'Message content text.'
        embeds:
          type: array
          description: 'Embed objects for rich formatting (also accepts a JSON string).'
    output: '{ id: string, channel_id: string, content: string }'
    mock: |
      return { id: `4000000000000${String(input.content.length).padStart(5, '0')}`, channel_id: input.channel_id, content: input.content };
    scenarios:
      - name: sent
        kind: success
        description: 'Discord posts the message and answers with the message it made.'
        output:
          id: '400000000000000003'
          channel_id: '300000000000000001'
          content: 'Deploy finished ✅'
      - name: sent_again
        kind: duplicate
        description: 'Discord does not recognize a message sent again: the same send posts a second message, with an id of its own.'
        output:
          id: '400000000000000004'
          channel_id: '300000000000000001'
          content: 'Deploy finished ✅'
      - name: no_post_permission
        kind: refusal
        description: 'Discord refuses with HTTP 403 because the bot cannot post in the channel.'
        error:
          message: 'Discord send_message failed (403): permission denied — the bot cannot post in this channel'
          status: 403
      - name: rate_limited
        kind: refusal
        description: 'Discord rate-limits the bot with HTTP 429 and refuses the post.'
        error:
          message: 'Discord send_message failed (429): rate limited by Discord — retry later'
          status: 429
    backend:
      kind: yaml-js
      live: |
        const payload = { content: input.content };
        if (input.embeds != null) {
          if (typeof input.embeds === 'string') {
            try { payload.embeds = JSON.parse(input.embeds); } catch (e) { throw new Error(`Discord send_message failed: embeds is not valid JSON (${e.message})`); }
          } else payload.embeds = input.embeds;
        }
        const r = await ctx.http.post(`https://discord.com/api/v10/channels/${encodeURIComponent(input.channel_id)}/messages`, { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Discord send_message failed (${r.status}): ${r.status === 401 ? 'authentication rejected — verify the bot token' : r.status === 403 ? 'permission denied — the bot cannot post in this channel' : r.status === 404 ? 'channel not found' : r.status === 429 ? 'rate limited by Discord — retry later' : r.text()}`), { status: r.status });
        const j = r.json();
        return { id: j.id, channel_id: j.channel_id, content: j.content };
    exampleInput:
      { channel_id: '300000000000000001', content: 'Deploy finished ✅' }
  - name: get_user
    title: Get user
    i18n:
      de:
        title: Benutzer abrufen
      fr:
        title: Récupérer un utilisateur
    description: Get a Discord user by ID.
    effects: read
    input:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          description: 'User ID.'
    output: '{ user: { id: string, username: string, global_name: string | null, bot: boolean } }'
    mock: |
      return { user: { id: input.user_id, username: 'demo-user', global_name: 'Demo User', bot: false } };
    scenarios:
      - name: user
        kind: success
        description: 'Discord returns a member user with a display name.'
        output:
          user: { id: '200000000000000001', username: 'demo-user', global_name: 'Demo User', bot: false }
      - name: no_display_name
        kind: empty
        description: 'Discord returns a bot user that has no display name, which it answers as null.'
        output:
          user: { id: '200000000000000002', username: 'demo-bot', global_name: null, bot: true }
      - name: user_not_found
        kind: error
        description: 'Discord answers HTTP 404 for a user ID it does not know.'
        error:
          message: 'Discord get_user failed (404): user not found'
          status: 404
      - name: rate_limited
        kind: error
        description: 'Discord rate-limits the bot with HTTP 429.'
        error:
          message: 'Discord get_user failed (429): rate limited by Discord — retry later'
          status: 429
    backend:
      kind: yaml-js
      live: |
        const r = await ctx.http.get(`https://discord.com/api/v10/users/${encodeURIComponent(input.user_id)}`, { headers: { 'Content-Type': 'application/json' } });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Discord get_user failed (${r.status}): ${r.status === 401 ? 'authentication rejected — verify the bot token' : r.status === 403 ? 'permission denied — the bot lacks the required permissions' : r.status === 404 ? 'user not found' : r.status === 429 ? 'rate limited by Discord — retry later' : r.text()}`), { status: r.status });
        return { user: r.json() };
    exampleInput: { user_id: '200000000000000001' }
  - name: list_members
    title: List members
    i18n:
      de:
        title: Mitglieder auflisten
      fr:
        title: Lister les membres
    description: List the members of a guild.
    effects: read
    input:
      type: object
      required: [guild_id]
      properties:
        guild_id:
          type: string
          description: 'Guild (server) ID.'
        limit:
          type: number
          description: 'Number of members to return (max 1000, default 50).'
        after:
          type: string
          description: 'Return members after this user ID.'
    output: '{ members: Array<{ user: { id: string, username: string }, nick: string | null, roles: string[] }> }'
    mock: |
      return { members: [{ user: { id: '200000000000000001', username: 'demo-user' }, nick: 'Demo', roles: ['500000000000000001'] }] };
    scenarios:
      - name: two_members
        kind: success
        description: 'The server has two members; the second has no nickname, which Discord answers as null.'
        output:
          members:
            - { user: { id: '200000000000000001', username: 'demo-user' }, nick: 'Demo', roles: ['500000000000000001'] }
            - { user: { id: '200000000000000002', username: 'demo-bot' }, nick: null, roles: [] }
      - name: no_members
        kind: empty
        description: 'The server lists no member for the bot to see.'
        output:
          members: []
      - name: missing_members_intent
        kind: error
        description: 'Discord refuses with HTTP 403 because the bot has no Server Members intent.'
        error:
          message: 'Discord list_members failed (403): permission denied — the bot needs the Server Members intent'
          status: 403
      - name: guild_not_found
        kind: error
        description: 'Discord answers HTTP 404 for a server ID it does not know.'
        error:
          message: 'Discord list_members failed (404): guild not found'
          status: 404
    backend:
      kind: yaml-js
      live: |
        const q = ['limit=' + Math.min(Number(input.limit) || 50, 1000)];
        if (input.after != null && input.after !== '') q.push('after=' + encodeURIComponent(String(input.after)));
        const r = await ctx.http.get(`https://discord.com/api/v10/guilds/${encodeURIComponent(input.guild_id)}/members?${q.join('&')}`, { headers: { 'Content-Type': 'application/json' } });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Discord list_members failed (${r.status}): ${r.status === 401 ? 'authentication rejected — verify the bot token' : r.status === 403 ? 'permission denied — the bot needs the Server Members intent' : r.status === 404 ? 'guild not found' : r.status === 429 ? 'rate limited by Discord — retry later' : r.text()}`), { status: r.status });
        return { members: r.json() };
    exampleInput: { guild_id: '100000000000000001', limit: 100 }
  - name: create_channel
    title: Create channel
    i18n:
      de:
        title: Kanal erstellen
      fr:
        title: Créer un salon
    description: Create a new channel in a guild.
    effects: write
    input:
      type: object
      required: [guild_id, name]
      properties:
        guild_id:
          type: string
          description: 'Guild (server) ID.'
        name:
          type: string
          description: 'Channel name.'
        type:
          type: integer
          description: 'Channel type: 0 = text, 2 = voice, 4 = category (default 0).'
        topic:
          type: string
          description: 'Channel topic.'
    output: '{ id: string, name: string, type: number }'
    mock: |
      return { id: `3000000000000${String(input.name.length).padStart(5, '0')}`, name: input.name, type: input.type != null ? Number(input.type) : 0 };
    scenarios:
      - name: created
        kind: success
        description: 'Discord creates the text channel and answers with it.'
        output:
          id: '300000000000000003'
          name: 'release-notes'
          type: 0
      - name: created_again
        kind: duplicate
        description: 'Discord does not recognize a channel created again: the same create makes a second channel, with an id of its own.'
        output:
          id: '300000000000000004'
          name: 'release-notes'
          type: 0
      - name: no_manage_channels
        kind: refusal
        description: 'Discord refuses with HTTP 403 because the bot lacks the Manage Channels permission.'
        error:
          message: 'Discord create_channel failed (403): permission denied — the bot needs Manage Channels'
          status: 403
      - name: rate_limited
        kind: refusal
        description: 'Discord rate-limits the bot with HTTP 429 and refuses the create.'
        error:
          message: 'Discord create_channel failed (429): rate limited by Discord — retry later'
          status: 429
    backend:
      kind: yaml-js
      live: |
        const payload = { name: input.name, type: input.type != null ? Number(input.type) : 0 };
        if (input.topic != null && input.topic !== '') payload.topic = input.topic;
        const r = await ctx.http.post(`https://discord.com/api/v10/guilds/${encodeURIComponent(input.guild_id)}/channels`, { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Discord create_channel failed (${r.status}): ${r.status === 401 ? 'authentication rejected — verify the bot token' : r.status === 403 ? 'permission denied — the bot needs Manage Channels' : r.status === 404 ? 'guild not found' : r.status === 429 ? 'rate limited by Discord — retry later' : r.text()}`), { status: r.status });
        const j = r.json();
        return { id: j.id, name: j.name, type: j.type };
    exampleInput:
      { guild_id: '100000000000000001', name: 'release-notes', type: 0 }
