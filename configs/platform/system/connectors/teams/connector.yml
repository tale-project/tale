        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Teams send_chat_message failed (${r.status}): ${r.status === 401 ? 'authentication rejected — the access token may be expired, re-authorize' : r.status === 403 ? 'permission denied — the app needs the Chat.ReadWrite scope' : r.status === 404 ? 'chat not found' : r.status === 429 ? 'rate limited by Microsoft Graph — retry later' : r.text()}`), { status: r.status });
        const j = r.json();
        return { id: j.id, chatId: j.chatId || input.chatId };
