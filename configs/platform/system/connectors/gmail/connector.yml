        title: E-Mail-Verlauf abrufen
      fr:
        title: Récupérer un fil de discussion
    description: Fetch a complete email thread (conversation) with all of its messages.
    effects: read
    input:
      type: object
      properties:
        threadId:
          type: string
          description: 'The thread ID to retrieve.'
        format:
          type: string
          description: 'Response format: full (default), metadata, or minimal.'
      required: [threadId]
    output: '{ thread: { id: string, historyId?: string, messages: Array<{ id: string, threadId: string, labelIds?: Array<string>, snippet: string, historyId?: string, internalDate?: string, sizeEstimate?: number, payload?: { partId?: string, mimeType: string, filename?: string, headers?: Array<{ name: string, value: string }>, body?: { size: number, data?: string, attachmentId?: string }, parts?: Array<object> } }> } }'
    mock: |
      return { thread: { id: input.threadId, messages: [{ id: 'msg-1', threadId: input.threadId, snippet: 'Mock message snippet.' }] } };
    scenarios:
      - name: two_messages
        kind: success
        description: 'Gmail returns the thread with its first message and a reply, oldest first.'
        output:
          thread:
            id: '18c1a2b3c4d5e6f7'
            messages:
              - { id: '18c1a2b3c4d5e6f7', threadId: '18c1a2b3c4d5e6f7', snippet: 'Your invoice INV-2026-0042 for October is attached.' }
              - { id: '18c1a2b3c4d5e6f9', threadId: '18c1a2b3c4d5e6f7', snippet: 'Thanks, the payment arrived.' }
      - name: no_replies
        kind: empty
        description: 'Gmail returns a thread that holds only the message that started it, as when nobody has replied yet.'
        output:
          thread:
            id: '18c1a2b3c4d5e6f7'
            messages:
              - { id: '18c1a2b3c4d5e6f7', threadId: '18c1a2b3c4d5e6f7', snippet: 'Your invoice INV-2026-0042 for October is attached.' }
      - name: thread_not_found
        kind: error
        description: 'Gmail answers HTTP 404, as for a thread that does not exist or was deleted.'
        when: { threadId: '18c0000000000009' }
        error:
          message: |
            Gmail get_thread failed (404): {
              "error": {
                "code": 404,
                "message": "Requested entity was not found.",
                "errors": [
                  {
                    "message": "Requested entity was not found.",
                    "domain": "global",
                    "reason": "notFound"
                  }
                ],
                "status": "NOT_FOUND"
              }
            }
          status: 404
    backend:
      kind: yaml-js
      live: |
        const fmt = input.format || 'full';
        const r = await ctx.http.get(`https://gmail.googleapis.com/gmail/v1/users/me/threads/${encodeURIComponent(input.threadId)}?format=${encodeURIComponent(fmt)}`, { headers: { Accept: 'application/json' } });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Gmail get_thread failed (${r.status}): ${r.text()}`), { status: r.status });
        return { thread: r.json() };
    exampleInput: { threadId: '18c1a2b3c4d5e6f7' }
  - name: list_drafts
    title: List drafts
    i18n:
      de:
        title: Entwürfe auflisten
      fr:
        title: Lister les brouillons
    description: List draft messages in the mailbox.
    effects: read
    input:
      type: object
      properties:
        maxResults:
          type: number
          description: 'Maximum number of drafts to return (max 500, default 25).'
        pageToken:
          type: string
          description: 'Page token from a previous list request for pagination.'
    output: '{ drafts: Array<{ id: string, message: { id: string, threadId: string } }>, nextPageToken: string }'
    mock: |
      return { drafts: [{ id: 'draft-1', message: { id: 'msg-1', threadId: 'thread-1' } }], nextPageToken: '' };
    scenarios:
      - name: two_drafts
        kind: success
        description: 'Gmail returns two drafts, a new message and a reply in an existing thread, on a single page.'
        output:
          drafts:
            - { id: r-1000000000000000001, message: { id: '18c1a2b3c4d5e6fc', threadId: '18c1a2b3c4d5e6fc' } }
            - { id: r-1000000000000000002, message: { id: '18c1a2b3c4d5e6fd', threadId: '18c1a2b3c4d5e6f7' } }
          nextPageToken: ''
      - name: no_drafts
        kind: empty
        description: 'The mailbox holds no draft, and the answer of Gmail then carries no list of drafts at all.'
        output:
          drafts: []
          nextPageToken: ''
      - name: token_expired
        kind: error
        description: 'Gmail rejects the access token with HTTP 401, as when it has expired.'
        error:
          message: |
            Gmail list_drafts failed (401): {
              "error": {
                "code": 401,
                "message": "Request had invalid authentication credentials. Expected OAuth 2 access token, login cookie or other valid authentication credential. See https://developers.google.com/identity/sign-in/web/devconsole-project.",
                "errors": [
                  {
                    "message": "Invalid Credentials",
                    "domain": "global",
                    "reason": "authError",
                    "location": "Authorization",
                    "locationType": "header"
                  }
                ],
                "status": "UNAUTHENTICATED"
              }
            }
          status: 401
    backend:
      kind: yaml-js
      live: |
        const maxResults = Math.min(input.maxResults || 25, 500);
        const q = ['maxResults=' + maxResults];
        if (input.pageToken) q.push('pageToken=' + encodeURIComponent(input.pageToken));
        const r = await ctx.http.get(`https://gmail.googleapis.com/gmail/v1/users/me/drafts?${q.join('&')}`, { headers: { Accept: 'application/json' } });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Gmail list_drafts failed (${r.status}): ${r.text()}`), { status: r.status });
        const j = r.json();
        return { drafts: j.drafts || [], nextPageToken: j.nextPageToken || '' };
    exampleInput: { maxResults: 25 }
  - name: get_attachment
    title: Download attachment
    i18n:
      de:
        title: Anhang herunterladen
      fr:
        title: Télécharger une pièce jointe
    description: Download a single email attachment by message ID and attachment ID, storing it through file storage.
    effects: read
    input:
      type: object
      properties:
        messageId:
          type: string
          description: 'The message ID containing the attachment.'
        attachmentId:
          type: string
          description: 'The attachment ID from the message payload.'
      required: [messageId, attachmentId]
    output: '{ attachment: { attachmentId: string, size: number, fileId: string, url?: string } }'
    mock: |
      return { attachment: { attachmentId: input.attachmentId, size: 1024, fileId: 'file-' + input.attachmentId, url: 'https://files.example.com/file-' + input.attachmentId } };
    scenarios:
      - name: stored
        kind: success
        description: 'Gmail returns the bytes of the attachment, a PDF of 62 bytes, which the file store keeps under a new file id.'
        output:
          attachment:
            attachmentId: ANGjdJ8AbC
            size: 62
            fileId: 's3:example-org/00000000-0000-0000-0000-000000000001'
      - name: no_link
        kind: empty
        description: 'The record with its optional member empty: the file store keeps the bytes but gives no link to fetch them by, as the platform store never does, so the output carries no url.'
        output:
          attachment:
            attachmentId: ANGjdJ8AbC
            size: 62
            fileId: 's3:example-org/00000000-0000-0000-0000-000000000001'
      - name: message_not_found
        kind: error
        description: 'Gmail answers HTTP 404, as for a message that does not exist or was deleted.'
        when: { messageId: '18c0000000000009' }
        error:
          message: |
            Gmail get_attachment failed (404): {
              "error": {
                "code": 404,
                "message": "Requested entity was not found.",
                "errors": [
                  {
                    "message": "Requested entity was not found.",
                    "domain": "global",
                    "reason": "notFound"
                  }
                ],
                "status": "NOT_FOUND"
              }
            }
          status: 404
    backend:
      kind: yaml-js
      live: |
        if (!ctx.files) throw new Error('Gmail get_attachment failed: file storage (ctx.files) is required.');
        const r = await ctx.http.get(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${encodeURIComponent(input.messageId)}/attachments/${encodeURIComponent(input.attachmentId)}`, { headers: { Accept: 'application/json' } });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Gmail get_attachment failed (${r.status}): ${r.text()}`), { status: r.status });
        const data = r.json();
        let b64 = String(data.data || '').replace(/-/g, '+').replace(/_/g, '/');
        const pad = b64.length % 4;
        if (pad === 2) b64 += '=='; else if (pad === 3) b64 += '=';
        const stored = await ctx.files.store(b64, { encoding: 'base64', contentType: 'application/octet-stream', fileName: 'attachment-' + input.attachmentId });
        return { attachment: { attachmentId: data.attachmentId || input.attachmentId, size: data.size || 0, fileId: stored.id, url: stored.url } };
    exampleInput: { messageId: '18c1a2b3c4d5e6f7', attachmentId: 'ANGjdJ8AbC' }
