# Connector — Gmail API (Google). An OAuth2 credential authorizes
# every action; the platform injects it as the Authorization header, so the live
# bodies below carry only the functional headers Gmail needs. Reads return the
# resource(s) under a named key; the send action returns the identifiers a caller
# routes on. Attachment actions store bytes through ctx.files and return a file
# reference. Every mock is deterministic — same input, same output, no IO.
name: gmail
displayName: Gmail
description: Read, send, and organize email in Gmail.
tags:
  - Email
allowedHosts:
  - gmail.googleapis.com
  - www.googleapis.com
auth:
  - method: oauth2
    authorizeUrl: https://accounts.google.com/o/oauth2/v2/auth
    tokenUrl: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly
      - https://www.googleapis.com/auth/gmail.send
      - https://www.googleapis.com/auth/gmail.labels
      - https://www.googleapis.com/auth/gmail.modify
actions:
  - name: list_messages
    title: List messages
    i18n:
      de:
        title: Nachrichten auflisten
      fr:
        title: Lister les messages
    description: List message and thread IDs from the mailbox, optionally filtered by a Gmail search query or labels. Draft messages are excluded.
    effects: read
    input:
      type: object
      properties:
        q:
          type: string
          description: 'Gmail search query (same syntax as the Gmail search box, e.g. "from:user@example.com is:unread").'
        maxResults:
          type: number
          description: 'Maximum number of messages to return (max 500, default 25).'
        pageToken:
          type: string
          description: 'Page token from a previous list request for pagination.'
        labelIds:
          type: string
          description: 'Comma-separated label IDs to filter by (e.g. "INBOX", "UNREAD", "STARRED").'
    output: '{ messages: Array<{ id: string, threadId: string }>, nextPageToken: string }'
    mock: |
      return { messages: [{ id: 'msg-1', threadId: 'thread-1' }], nextPageToken: '' };
    scenarios:
      - name: two_messages
        kind: success
        description: 'Gmail returns two unread messages, the second one in a thread an earlier message started, on a single page.'
        output:
          messages:
            - { id: '18c1a2b3c4d5e6f7', threadId: '18c1a2b3c4d5e6f7' }
            - { id: '18c1a2b3c4d5e6f8', threadId: '18c1a2b3c4d5e6f0' }
          nextPageToken: ''
      - name: no_messages
        kind: empty
        description: 'Gmail finds no message, and its answer then carries no list of messages at all.'
        output:
          messages: []
          nextPageToken: ''
      - name: token_expired
        kind: error
        description: 'Gmail rejects the access token with HTTP 401, as when it has expired.'
        error:
          message: |
            Gmail list_messages failed (401): {
              "error": {
                "code": 401,
                "message": "Request had invalid authentication credentials. Expected OAuth 2 access token, login cookie or other valid authentication credential. See https://developers.google.com/identity/sign-in/web/devconsole-project.",
                "errors": [
                  {
                    "message": "Invalid Credentials",
                    "domain": "global",
                    "reason": "authError",
                    "location": "Authorization",
                    "locationType": "header"
                  }
                ],
                "status": "UNAUTHENTICATED"
              }
            }
          status: 401
      - name: rate_limited
        kind: error
        description: 'Gmail rate-limits the mailbox with HTTP 429 and asks to wait 30 seconds, which the message names.'
        error:
          message: |
            Gmail list_messages failed (429, retry after 30s): {
              "error": {
                "code": 429,
                "message": "Rate Limit Exceeded",
                "errors": [
                  {
                    "message": "Rate Limit Exceeded",
                    "domain": "usageLimits",
                    "reason": "rateLimitExceeded"
                  }
                ],
                "status": "RESOURCE_EXHAUSTED"
              }
            }
          status: 429
    backend:
      kind: yaml-js
      live: |
        const maxResults = Math.min(input.maxResults || 25, 500);
        let query = input.q || '';
        if (query.indexOf('is:draft') === -1 && query.indexOf('label:draft') === -1) query = query ? query + ' -is:draft' : '-is:draft';
        const q = ['maxResults=' + maxResults, 'q=' + encodeURIComponent(query)];
        if (input.pageToken) q.push('pageToken=' + encodeURIComponent(input.pageToken));
        if (input.labelIds) for (const l of String(input.labelIds).split(',')) q.push('labelIds=' + encodeURIComponent(l.trim()));
        const r = await ctx.http.get(`https://gmail.googleapis.com/gmail/v1/users/me/messages?${q.join('&')}`, { headers: { Accept: 'application/json' } });
        // A wait Gmail names rides in the sentence, so a sync can report it.
        const wait = String((r.headers || {})['retry-after'] || '');
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Gmail list_messages failed (${r.status}${/^\d+$/.test(wait) ? `, retry after ${wait}s` : ''}): ${r.text()}`), { status: r.status });
        const j = r.json();
        return { messages: j.messages || [], nextPageToken: j.nextPageToken || '' };
    exampleInput: { q: 'is:unread', maxResults: 25 }
  - name: get_message
    title: Get message
    i18n:
      de:
        title: Nachricht abrufen
      fr:
        title: Récupérer un message
    description: Fetch a single email message by ID with full headers, body, and attachment metadata. Optionally download and store all attachments.
    effects: read
    input:
      type: object
      properties:
        messageId:
          type: string
          description: 'The message ID returned from list_messages or search_messages.'
        format:
          type: string
          description: 'Response format: full (default, includes parsed body), metadata (headers only), minimal (IDs only), or raw (RFC 2822).'
        includeAttachments:
          type: boolean
          description: 'When true, downloads and stores all file attachments. Each attachment is returned with a fileId and URL; one too large to carry (over 3.5 MB) is listed with truncated: true and no fileId.'
      required: [messageId]
    output: '{ message: { id: string, threadId: string, labelIds: Array<string>, snippet: string, historyId?: string, internalDate?: string, sizeEstimate?: number, payload?: { partId?: string, mimeType: string, filename?: string, headers?: Array<{ name: string, value: string }>, body?: { size: number, data?: string, attachmentId?: string }, parts?: Array<object> }, raw?: string }, attachments: Array<{ id: string, filename: string, contentType: string, size: number, fileId?: string, url?: string, truncated?: boolean }> }'
    mock: |
      return { message: { id: input.messageId, threadId: 'thread-' + input.messageId, labelIds: ['INBOX'], snippet: 'Mock message snippet.' }, attachments: [] };
    scenarios:
      - name: one_message
        kind: success
        description: 'Gmail returns the message, which starts its own thread; no attachment was asked for, so none is stored.'
        output:
          message:
            id: '18c1a2b3c4d5e6f7'
            threadId: '18c1a2b3c4d5e6f7'
            labelIds: [INBOX, UNREAD]
            snippet: 'Your invoice INV-2026-0042 for October is attached.'
          attachments: []
      - name: with_attachment
        kind: success
        description: 'Gmail returns a message with a text part and a PDF attachment, and then the attachment bytes, which the file store keeps under a new file id and without a link, as the platform store does.'
        when: { includeAttachments: true }
        output:
          message:
            id: '18c1a2b3c4d5e6f7'
            threadId: '18c1a2b3c4d5e6f7'
            labelIds: [INBOX, UNREAD]
            snippet: 'Your invoice INV-2026-0042 for October is attached.'
            payload:
              mimeType: multipart/mixed
              filename: ''
              parts:
                - { partId: '0', mimeType: text/plain, filename: '', body: { size: 25, data: U2VlIHRoZSBhdHRhY2hlZCBpbnZvaWNlLg } }
                - { partId: '1', mimeType: application/pdf, filename: invoice-2026-10.pdf, body: { attachmentId: ANGjdJ8AbC, size: 62 } }
          attachments:
            - { id: ANGjdJ8AbC, filename: invoice-2026-10.pdf, contentType: application/pdf, size: 62, fileId: 's3:example-org/00000000-0000-0000-0000-000000000001' }
      - name: no_attachments
        kind: empty
        description: 'Attachments are asked for, but Gmail returns a reply of a single text part, so nothing is stored and the list of attachments is empty.'
        when: { messageId: '18c1a2b3c4d5e6f9', includeAttachments: true }
        output:
          message:
            id: '18c1a2b3c4d5e6f9'
            threadId: '18c1a2b3c4d5e6f7'
            labelIds: [INBOX]
            snippet: 'Thanks, the payment arrived.'
            payload:
              mimeType: text/plain
              filename: ''
              body: { size: 28, data: VGhhbmtzLCB0aGUgcGF5bWVudCBhcnJpdmVkLg }
          attachments: []
      - name: message_not_found
        kind: error
        description: 'Gmail answers HTTP 404, as for a message that does not exist or was deleted.'
        when: { messageId: '18c0000000000009' }
        error:
          message: |
            Gmail get_message failed (404): {
              "error": {
                "code": 404,
                "message": "Requested entity was not found.",
                "errors": [
                  {
                    "message": "Requested entity was not found.",
                    "domain": "global",
                    "reason": "notFound"
                  }
                ],
                "status": "NOT_FOUND"
              }
            }
          status: 404
      - name: rate_limited
        kind: error
        description: 'Gmail rate-limits the mailbox with HTTP 429 and asks to wait 30 seconds, which the message names.'
        error:
          message: |
            Gmail get_message failed (429, retry after 30s): {
              "error": {
                "code": 429,
                "message": "Rate Limit Exceeded",
                "errors": [
                  {
                    "message": "Rate Limit Exceeded",
                    "domain": "usageLimits",
                    "reason": "rateLimitExceeded"
                  }
                ],
                "status": "RESOURCE_EXHAUSTED"
              }
            }
          status: 429
    backend:
      kind: yaml-js
      live: |
        const fmt = input.format || 'full';
        const h = { Accept: 'application/json' };
        const r = await ctx.http.get(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${encodeURIComponent(input.messageId)}?format=${encodeURIComponent(fmt)}`, { headers: h });
        // A wait Gmail names rides in the sentence, so a sync can report it.
        const failed = (res) => { const wait = String((res.headers || {})['retry-after'] || ''); return Object.assign(new Error(`Gmail get_message failed (${res.status}${/^\d+$/.test(wait) ? `, retry after ${wait}s` : ''}): ${res.text()}`), { status: res.status }); };
        if (!r.status || r.status >= 400) throw failed(r);
        const message = r.json();
        const attachments = [];
        if (input.includeAttachments && ctx.files && message.payload) {
          // ctx.http carries at most 5 MiB of response, and Gmail sends the bytes
          // base64url-encoded inside JSON, 4/3 their size: a larger part cannot
          // arrive, so it is listed as truncated rather than failing the message.
          const MAX_CARRIED_BYTES = 3.5 * 1024 * 1024;
          const parts = [];
          const walk = (p) => { if (!p) return; if (p.body && p.body.attachmentId) parts.push(p); if (p.parts) for (const c of p.parts) walk(c); };
          walk(message.payload);
          for (const p of parts) {
            const entry = { id: p.body.attachmentId, filename: p.filename || 'attachment', contentType: p.mimeType || 'application/octet-stream', size: (p.body && p.body.size) || 0 };
            if (entry.size > MAX_CARRIED_BYTES) { attachments.push({ ...entry, truncated: true }); continue; }
            const ar = await ctx.http.get(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${encodeURIComponent(input.messageId)}/attachments/${encodeURIComponent(p.body.attachmentId)}`, { headers: h });
            if (!ar.status || ar.status >= 400) throw failed(ar);
            let b64 = String(ar.json().data || '').replace(/-/g, '+').replace(/_/g, '/');
            const pad = b64.length % 4;
            if (pad === 2) b64 += '=='; else if (pad === 3) b64 += '=';
            const stored = await ctx.files.store(b64, { encoding: 'base64', contentType: entry.contentType, fileName: entry.filename });
            attachments.push({ ...entry, fileId: stored.id, url: stored.url });
          }
        }
        return { message, attachments };
    exampleInput: { messageId: '18c1a2b3c4d5e6f7', format: 'full' }
  - name: get_attachments
    title: Download attachments
    i18n:
      de:
        title: Anhänge herunterladen
      fr:
        title: Télécharger les pièces jointes
    description: Download every file attachment on a message and store each one. Returns a fileId and URL per attachment.
    effects: read
    input:
      type: object
      properties:
        messageId:
          type: string
          description: 'The message ID containing the attachments.'
      required: [messageId]
    output: '{ attachments: Array<{ id: string, filename: string, contentType: string, size: number, fileId?: string, url?: string, truncated?: boolean }> }'
    mock: |
      return { attachments: [{ id: 'att-1', filename: 'document.pdf', contentType: 'application/pdf', size: 1024, fileId: 'file-att-1', url: 'https://files.example.com/file-att-1' }] };
    scenarios:
      - name: two_attachments
        kind: success
        description: 'Gmail returns a message with a text part and two attachments, a PDF and a CSV file, and then the bytes of each, which the file store keeps under new file ids and without links, as the platform store does.'
        output:
          attachments:
            - { id: ANGjdJ8AbC, filename: invoice-2026-10.pdf, contentType: application/pdf, size: 62, fileId: 's3:example-org/00000000-0000-0000-0000-000000000001' }
            - { id: ANGjdJ9XyZ, filename: payments-2026-10.csv, contentType: text/csv, size: 40, fileId: 's3:example-org/00000000-0000-0000-0000-000000000002' }
      - name: too_large
        kind: success
        description: 'Gmail returns a message with a scan of 4 MiB and a CSV file: the scan is too large to carry, so it is listed as truncated and not fetched, and only the CSV file is stored.'
        when: { messageId: '18c1a2b3c4d5e6fe' }
        output:
          attachments:
            - { id: ANGjdJ7BiG, filename: scan-2026-10.pdf, contentType: application/pdf, size: 4194304, truncated: true }
            - { id: ANGjdJ9XyZ, filename: payments-2026-10.csv, contentType: text/csv, size: 40, fileId: 's3:example-org/00000000-0000-0000-0000-000000000001' }
      - name: no_attachments
        kind: empty
        description: 'Gmail returns a reply of a single text part, so nothing is stored and the list of attachments is empty.'
        when: { messageId: '18c1a2b3c4d5e6f9' }
        output:
          attachments: []
      - name: message_not_found
        kind: error
        description: 'Gmail answers HTTP 404, as for a message that does not exist or was deleted.'
        when: { messageId: '18c0000000000009' }
        error:
          message: |
            Gmail get_attachments failed (404): {
              "error": {
                "code": 404,
                "message": "Requested entity was not found.",
                "errors": [
                  {
                    "message": "Requested entity was not found.",
                    "domain": "global",
                    "reason": "notFound"
                  }
                ],
                "status": "NOT_FOUND"
              }
            }
          status: 404
    backend:
      kind: yaml-js
      live: |
        if (!ctx.files) throw new Error('Gmail get_attachments failed: file storage (ctx.files) is required.');
        const h = { Accept: 'application/json' };
        const mr = await ctx.http.get(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${encodeURIComponent(input.messageId)}?format=full`, { headers: h });
        if (!mr.status || mr.status >= 400) throw Object.assign(new Error(`Gmail get_attachments failed (${mr.status}): ${mr.text()}`), { status: mr.status });
        const message = mr.json();
        // Same ceiling as get_message: a part whose base64url JSON cannot fit
        // ctx.http's 5 MiB response is listed as truncated, not fetched.
        const MAX_CARRIED_BYTES = 3.5 * 1024 * 1024;
        const parts = [];
        const walk = (p) => { if (!p) return; if (p.body && p.body.attachmentId) parts.push(p); if (p.parts) for (const c of p.parts) walk(c); };
        walk(message.payload);
        const attachments = [];
        for (const p of parts) {
          const entry = { id: p.body.attachmentId, filename: p.filename || 'attachment', contentType: p.mimeType || 'application/octet-stream', size: (p.body && p.body.size) || 0 };
          if (entry.size > MAX_CARRIED_BYTES) { attachments.push({ ...entry, truncated: true }); continue; }
          const ar = await ctx.http.get(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${encodeURIComponent(input.messageId)}/attachments/${encodeURIComponent(p.body.attachmentId)}`, { headers: h });
          if (!ar.status || ar.status >= 400) throw Object.assign(new Error(`Gmail get_attachments failed (${ar.status}): ${ar.text()}`), { status: ar.status });
          let b64 = String(ar.json().data || '').replace(/-/g, '+').replace(/_/g, '/');
          const pad = b64.length % 4;
          if (pad === 2) b64 += '=='; else if (pad === 3) b64 += '=';
          const stored = await ctx.files.store(b64, { encoding: 'base64', contentType: entry.contentType, fileName: entry.filename });
          attachments.push({ ...entry, fileId: stored.id, url: stored.url });
        }
        return { attachments };
    exampleInput: { messageId: '18c1a2b3c4d5e6f7' }
  - name: search_messages
    title: Search messages
    i18n:
      de:
        title: Nachrichten durchsuchen
      fr:
        title: Rechercher des messages
    description: Search messages using Gmail query syntax and return the matching message and thread IDs.
    effects: read
    input:
      type: object
      properties:
        query:
          type: string
          description: 'Gmail search query (e.g. "subject:invoice after:2025/01/01 has:attachment").'
        maxResults:
          type: number
          description: 'Maximum number of results to return (max 500, default 25).'
        pageToken:
          type: string
          description: 'Page token from a previous search for pagination.'
      required: [query]
    output: '{ messages: Array<{ id: string, threadId: string }>, nextPageToken: string }'
    mock: |
      return { messages: [{ id: 'msg-1', threadId: 'thread-1' }], nextPageToken: '' };
    scenarios:
      - name: two_matches
        kind: success
        description: 'Gmail returns the two messages the query matches, on a single page.'
        output:
          messages:
            - { id: '18c1a2b3c4d5e6f7', threadId: '18c1a2b3c4d5e6f7' }
            - { id: '18c1a2b3c4d5e6fe', threadId: '18c1a2b3c4d5e6fe' }
          nextPageToken: ''
      - name: no_matches
        kind: empty
        description: 'The query matches no message, and the answer of Gmail then carries no list of messages at all.'
        output:
          messages: []
          nextPageToken: ''
      - name: token_expired
        kind: error
        description: 'Gmail rejects the access token with HTTP 401, as when it has expired.'
        error:
          message: |
            Gmail search_messages failed (401): {
              "error": {
                "code": 401,
                "message": "Request had invalid authentication credentials. Expected OAuth 2 access token, login cookie or other valid authentication credential. See https://developers.google.com/identity/sign-in/web/devconsole-project.",
                "errors": [
                  {
                    "message": "Invalid Credentials",
                    "domain": "global",
                    "reason": "authError",
                    "location": "Authorization",
                    "locationType": "header"
                  }
                ],
                "status": "UNAUTHENTICATED"
              }
            }
          status: 401
    backend:
      kind: yaml-js
      live: |
        const maxResults = Math.min(input.maxResults || 25, 500);
        const q = ['q=' + encodeURIComponent(input.query), 'maxResults=' + maxResults];
        if (input.pageToken) q.push('pageToken=' + encodeURIComponent(input.pageToken));
        const r = await ctx.http.get(`https://gmail.googleapis.com/gmail/v1/users/me/messages?${q.join('&')}`, { headers: { Accept: 'application/json' } });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Gmail search_messages failed (${r.status}): ${r.text()}`), { status: r.status });
        const j = r.json();
        return { messages: j.messages || [], nextPageToken: j.nextPageToken || '' };
    exampleInput: { query: 'subject:invoice has:attachment', maxResults: 25 }
  - name: send_message
    title: Send email
    i18n:
      de:
        title: E-Mail senden
      fr:
        title: Envoyer un e-mail
    description: Compose and send an email message via Gmail. Supports replying into a thread and sending with file attachments.
    effects: write
    input:
      type: object
      properties:
        to:
          type: string
          description: 'Recipient email address (e.g. "user@example.com").'
        subject:
          type: string
          description: 'Email subject line.'
        body:
          type: string
          description: 'Email body content.'
        cc:
          type: string
          description: 'CC recipient email address.'
        bcc:
          type: string
          description: 'BCC recipient email address.'
        contentType:
          type: string
          description: 'Body content type: "text/plain" (default) or "text/html".'
        threadId:
          type: string
          description: "Thread ID to reply into (from a previous message's threadId). Gmail groups the message into the same conversation."
        inReplyTo:
          type: string
          description: 'RFC 2822 Message-ID of the message being replied to (e.g. "<CABx...@mail.gmail.com>"). Sets the In-Reply-To MIME header.'
        references:
          type: string
          description: 'Space-separated list of Message-IDs for the References MIME header. If omitted, the inReplyTo value is used.'
        attachments:
          type: array
          description: 'Array of file attachments, each with name (string), contentType (string), and url (a file storage URL to fetch the bytes from).'
      required: [to, subject]
    output: '{ id: string, threadId: string }'
    mock: |
      const id = 'msg-' + (input.subject ? input.subject.length : 0);
      return { id, threadId: input.threadId || 'thread-' + id };
    scenarios:
      - name: sent
        kind: success
        description: 'Gmail sends the message, which starts a thread of its own, and returns its ids.'
        output:
          id: '18c1a2b3c4d5e6fa'
          threadId: '18c1a2b3c4d5e6fa'
      - name: sent_again
        kind: duplicate
        description: 'Gmail does not recognize a message sent again: the same send makes a second message, with ids of its own, in a thread of its own.'
        output:
          id: '18c1a2b3c4d5e6fb'
          threadId: '18c1a2b3c4d5e6fb'
      - name: invalid_recipient
        kind: refusal
        description: 'Gmail refuses with HTTP 400 a message whose To header names no valid address.'
        when: { to: not-an-address }
        error:
          message: |
            Gmail send_message failed (400): {
              "error": {
                "code": 400,
                "message": "Invalid To header",
                "errors": [
                  {
                    "message": "Invalid To header",
                    "domain": "global",
                    "reason": "invalidArgument"
                  }
                ],
                "status": "INVALID_ARGUMENT"
              }
            }
          status: 400
      - name: missing_scope
        kind: refusal
        description: 'Gmail refuses the send with HTTP 403 because the access token was granted without the scope to send mail.'
        error:
          message: |
            Gmail send_message failed (403): {
              "error": {
                "code": 403,
                "message": "Request had insufficient authentication scopes.",
                "errors": [
                  {
                    "message": "Insufficient Permission",
                    "domain": "global",
                    "reason": "insufficientPermissions"
                  }
                ],
                "status": "PERMISSION_DENIED"
              }
            }
          status: 403
    backend:
      kind: yaml-js
      live: |
        const enc = (t) => { let non = false; for (let i = 0; i < t.length; i++) { if (t.charCodeAt(i) > 127) { non = true; break; } } return non ? '=?UTF-8?B?' + ctx.base64Encode(t) + '?=' : t; };
        const c = (input.contentType || '').toLowerCase();
        const ct = (c === 'html' || c === 'text/html') ? 'text/html' : 'text/plain';
        const refs = input.references != null ? (Array.isArray(input.references) ? input.references.join(' ') : String(input.references)) : (input.inReplyTo || '');
        const lines = ['To: ' + input.to];
        if (input.cc) lines.push('Cc: ' + input.cc);
        if (input.bcc) lines.push('Bcc: ' + input.bcc);
        lines.push('Subject: ' + enc(input.subject));
        if (input.inReplyTo) { lines.push('In-Reply-To: ' + input.inReplyTo); lines.push('References: ' + refs); }
        lines.push('MIME-Version: 1.0');
        const attachments = Array.isArray(input.attachments) ? input.attachments : [];
        let mime;
        if (attachments.length > 0) {
          const boundary = 'tale_mixed_boundary';
          lines.push('Content-Type: multipart/mixed; boundary="' + boundary + '"');
          lines.push('');
          lines.push('--' + boundary);
          lines.push('Content-Type: ' + ct + '; charset=utf-8');
          lines.push('');
          lines.push(input.body || '');
          for (const att of attachments) {
            if (!att.url) throw new Error('Gmail send_message failed: attachment "' + (att.name || '') + '" is missing a url.');
            const fr = await ctx.http.get(att.url, { responseType: 'base64' });
            if (!fr.status || fr.status >= 400) throw Object.assign(new Error(`Gmail send_message failed to fetch attachment (${fr.status}): ${fr.text()}`), { status: fr.status });
            lines.push('--' + boundary);
            lines.push('Content-Type: ' + (att.contentType || 'application/octet-stream') + '; name="' + (att.name || 'attachment') + '"');
            lines.push('Content-Disposition: attachment; filename="' + (att.name || 'attachment') + '"');
            lines.push('Content-Transfer-Encoding: base64');
            lines.push('');
            lines.push(fr.text());
          }
          lines.push('--' + boundary + '--');
          mime = lines.join('\r\n');
        } else {
          lines.push('Content-Type: ' + ct + '; charset=utf-8');
          lines.push('');
          lines.push(input.body || '');
          mime = lines.join('\r\n');
        }
        const raw = ctx.base64Encode(mime).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        const payload = { raw };
        if (input.threadId) payload.threadId = input.threadId;
        const r = await ctx.http.post('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', { headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload) });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Gmail send_message failed (${r.status}): ${r.text()}`), { status: r.status });
        const j = r.json();
        return { id: j.id, threadId: j.threadId };
    exampleInput:
      {
        to: 'user@example.com',
        subject: 'Hello from Tale',
        body: 'This is a test message.',
      }
