# Connector — Microsoft Outlook through the Microsoft Graph v1.0 API.
# An OAuth2 credential authorizes every action; the platform injects it as the
# Authorization header, so the live bodies below carry only Graph's functional
# headers. Reads return the resource(s) under a named key plus Graph's pagination
# link; writes return the identifiers a caller routes on. Attachment actions
# store bytes through ctx.files and return a file reference. Every mock is
# deterministic — same input, same output, no IO.
name: outlook
displayName: Microsoft Outlook
description: Manage Outlook mail, calendar, and contacts.
tags:
  - Email
allowedHosts:
  - graph.microsoft.com
auth:
  - method: oauth2
    authorizeUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
    scopes:
      - Mail.Read
      - Mail.ReadWrite
      - Mail.Send
      - Calendars.Read
      - Calendars.ReadWrite
      - Contacts.Read
      - User.Read
actions:
  - name: list_messages
    description: List messages from the mailbox, newest first. Draft messages are excluded.
    effects: read
    input:
      type: object
      properties:
        top:
          type: number
          description: 'Number of messages to return (max 100, default 25).'
        skip:
          type: number
          description: 'Number of messages to skip for pagination.'
        folder:
          type: string
          description: 'Mail folder to restrict the listing to — a folder ID or a well-known name ("inbox", "sentitems", "archive").'
        filter:
          type: string
          description: 'OData $filter expression, applied on top of folder.'
        orderby:
          type: string
          description: 'OData $orderby expression (default "receivedDateTime desc").'
        select:
          type: string
          description: 'Comma-separated list of fields to return.'
        expand:
          type: string
          description: 'OData $expand expression, e.g. "attachments($select=id,name,contentType,size)" to include attachment metadata.'
        format:
          type: string
          description: 'Set to "email" to map each message onto the standard email shape (messageId, from, to, cc, bcc, subject, date, text, html, flags, headers).'
    output: '{ messages: Array<{ id: string, subject: string, from: object, receivedDateTime: string, isRead: boolean, hasAttachments: boolean }>, nextLink: string }'
    mock: |
      if (input.format === 'email') {
        return {
          messages: [{
            messageId: '<msg-1@example.com>',
            from: [{ name: 'Ada Lovelace', address: 'ada@example.com' }],
            to: [{ name: 'You', address: 'you@example.com' }],
            cc: [],
            bcc: [],
            subject: 'Quarterly report',
            date: '2025-01-15T09:00:00Z',
            text: 'The quarterly report is ready.',
            html: '',
            flags: [],
            headers: { 'message-id': '<msg-1@example.com>', 'in-reply-to': '', references: '' },
            attachments: [],
            hasAttachments: false,
            conversationId: 'conv-1',
            direction: 'inbound',
          }],
          nextLink: '',
        };
      }
      return {
        messages: [{
          id: 'msg-1',
          internetMessageId: '<msg-1@example.com>',
          subject: 'Quarterly report',
          from: { emailAddress: { name: 'Ada Lovelace', address: 'ada@example.com' } },
          toRecipients: [{ emailAddress: { name: 'You', address: 'you@example.com' } }],
          receivedDateTime: '2025-01-15T09:00:00Z',
          isRead: false,
          hasAttachments: false,
          bodyPreview: 'The quarterly report is ready.',
        }],
        nextLink: '',
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        const top = Math.min(Number(input.top) || 25, 100);
        const orderby = input.orderby ? String(input.orderby) : 'receivedDateTime desc';
        const filter = input.filter ? String(input.filter) : '';
        const draftFilter = 'isDraft eq false';
        // Graph rejects $orderby combined with a $filter on conversationId, so drop it and sort in memory.
        const clientSort = filter.indexOf('conversationId') !== -1;
        const q = ['$top=' + top];
        if (!clientSort) q.push('$orderby=' + encodeURIComponent(orderby));
        if (filter) q.push('$filter=' + encodeURIComponent(filter + ' and ' + draftFilter));
        else q.push('$filter=' + encodeURIComponent(draftFilter));
        q.push('$select=' + encodeURIComponent(input.select ? String(input.select) : 'id,internetMessageId,subject,from,toRecipients,receivedDateTime,isRead,hasAttachments,bodyPreview'));
        if (input.skip) q.push('$skip=' + encodeURIComponent(String(input.skip)));
        if (input.expand) q.push('$expand=' + encodeURIComponent(String(input.expand)));
        // The folder is a path segment, not a $filter clause: Graph resolves
        // well-known names (`sentitems`) there but never in `parentFolderId eq`,
        // and this keeps a caller's own $filter (a sync cursor) applying on top.
        const folder = input.folder ? String(input.folder) : '';
        const base = folder
          ? `https://graph.microsoft.com/v1.0/me/mailFolders/${encodeURIComponent(folder)}/messages`
          : 'https://graph.microsoft.com/v1.0/me/messages';
        const r = await ctx.http.get(`${base}?${q.join('&')}`, { headers: h });
        if (r.status === 401) throw new Error('Outlook list_messages failed: authentication expired — re-authorize the connection.');
        if (r.status === 403) throw new Error('Outlook list_messages failed: permission denied — verify the app has the required Microsoft Graph scopes.');
        if (r.status === 429) throw new Error('Outlook list_messages failed: rate limited by Microsoft Graph — retry later.');
        if (!r.status || r.status >= 400) throw new Error(`Outlook list_messages failed (${r.status}): ${r.text()}`);
        const j = r.json();
        let messages = j.value || [];
        if (input.format === 'email') {
          const me = await ctx.http.get('https://graph.microsoft.com/v1.0/me?$select=mail,userPrincipalName', { headers: h });
          const profile = me.status === 200 ? me.json() : {};
          const account = String(profile.mail || profile.userPrincipalName || '').toLowerCase();
          const addrs = (list) => (list || []).map((x) => ({ name: (x.emailAddress && x.emailAddress.name) || '', address: (x.emailAddress && x.emailAddress.address) || '' }));
          messages = messages.map((m) => {
            const from = (m.from && m.from.emailAddress) || {};
            const contentType = String((m.body && m.body.contentType) || '').toLowerCase();
            const content = (m.body && m.body.content) || '';
            return {
              messageId: m.internetMessageId || m.id || '',
              from: [{ name: from.name || '', address: from.address || '' }],
              to: addrs(m.toRecipients),
              cc: addrs(m.ccRecipients),
              bcc: addrs(m.bccRecipients),
              subject: m.subject || '',
              date: m.receivedDateTime || m.sentDateTime || '',
              text: contentType === 'text' ? content : '',
              html: contentType === 'html' ? content : '',
              flags: m.isRead ? ['\\Seen'] : [],
              headers: { 'message-id': m.internetMessageId || '', 'in-reply-to': '', references: '' },
              attachments: (m.attachments || []).filter((a) => a['@odata.type'] === '#microsoft.graph.fileAttachment').map((a) => {
                const mapped = { id: a.id, filename: a.name || 'attachment', contentType: a.contentType || 'application/octet-stream', size: a.size || 0 };
                if (a.contentId) mapped.contentId = String(a.contentId).replace(/^<|>$/g, '');
                return mapped;
              }),
              hasAttachments: !!m.hasAttachments,
              conversationId: m.conversationId || '',
              direction: account && String(from.address || '').toLowerCase() === account ? 'outbound' : 'inbound',
            };
          });
        }
        if (clientSort) {
          const field = input.format === 'email' ? 'date' : 'receivedDateTime';
          const desc = orderby.indexOf('desc') !== -1;
          messages = messages.slice().sort((a, b) => { const ta = new Date(a[field] || 0).getTime(); const tb = new Date(b[field] || 0).getTime(); return desc ? tb - ta : ta - tb; });
        }
        return { messages, nextLink: j['@odata.nextLink'] || '' };
    exampleInput: { top: 25 }
  - name: get_message
    description: Fetch a single email message by ID, optionally downloading and storing its file attachments.
    effects: read
    input:
      type: object
      properties:
        messageId:
          type: string
          description: 'The message ID returned from list_messages or search_messages.'
        includeAttachments:
          type: boolean
          description: 'When true, downloads and stores every file attachment. Each one is returned with a fileId and URL.'
      required: [messageId]
    output: '{ message: { id: string, internetMessageId: string, subject: string, from: object, receivedDateTime: string, body: { contentType: string, content: string } }, attachments: Array<{ id: string, name: string, contentType: string, size: number, fileId: string, url?: string }> }'
    mock: |
      return {
        message: {
          id: input.messageId,
          internetMessageId: `<${input.messageId}@example.com>`,
          subject: 'Quarterly report',
          from: { emailAddress: { name: 'Ada Lovelace', address: 'ada@example.com' } },
          toRecipients: [{ emailAddress: { name: 'You', address: 'you@example.com' } }],
          receivedDateTime: '2025-01-15T09:00:00Z',
          isRead: false,
          hasAttachments: false,
          body: { contentType: 'text', content: 'The quarterly report is ready.' },
        },
        attachments: [],
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        const r = await ctx.http.get(`https://graph.microsoft.com/v1.0/me/messages/${encodeURIComponent(input.messageId)}`, { headers: h });
        if (r.status === 401) throw new Error('Outlook get_message failed: authentication expired — re-authorize the connection.');
        if (r.status === 403) throw new Error('Outlook get_message failed: permission denied — verify the app has the required Microsoft Graph scopes.');
        if (r.status === 404) throw new Error(`Outlook get_message failed: message ${input.messageId} not found.`);
        if (r.status === 429) throw new Error('Outlook get_message failed: rate limited by Microsoft Graph — retry later.');
        if (!r.status || r.status >= 400) throw new Error(`Outlook get_message failed (${r.status}): ${r.text()}`);
        const message = r.json();
        const attachments = [];
        if (input.includeAttachments && message.hasAttachments && ctx.files) {
          const ar = await ctx.http.get(`https://graph.microsoft.com/v1.0/me/messages/${encodeURIComponent(message.id)}/attachments`, { headers: h });
          if (!ar.status || ar.status >= 400) throw new Error(`Outlook get_message failed to list attachments (${ar.status}): ${ar.text()}`);
          for (const a of ar.json().value || []) {
            if (a['@odata.type'] !== '#microsoft.graph.fileAttachment') continue;
            const fileName = a.name || 'attachment';
            const contentType = a.contentType || 'application/octet-stream';
            const stored = a.contentBytes
              ? await ctx.files.store(a.contentBytes, { encoding: 'base64', contentType, fileName })
              : await ctx.files.download(`https://graph.microsoft.com/v1.0/me/messages/${encodeURIComponent(message.id)}/attachments/${encodeURIComponent(a.id)}/$value`, { fileName });
            const entry = { id: a.id, name: fileName, contentType, size: a.size || 0, fileId: stored.id, url: stored.url };
            if (a.contentId) entry.contentId = String(a.contentId).replace(/^<|>$/g, '');
            attachments.push(entry);
          }
        }
        return { message, attachments };
    exampleInput: { messageId: 'AAMkAGI2THk...', includeAttachments: true }
  - name: get_attachments
    description: Download every file attachment on a message and store each one. Returns a fileId and URL per attachment.
    effects: read
    input:
      type: object
      properties:
        messageId:
          type: string
          description: 'The message ID containing the attachments. An RFC 2822 internet message ID is resolved to its Graph ID first.'
      required: [messageId]
    output: '{ attachments: Array<{ id: string, name: string, contentType: string, size: number, fileId: string, url?: string, contentId?: string }> }'
    mock: |
      return {
        attachments: [{ id: 'att-1', name: 'report.pdf', contentType: 'application/pdf', size: 2048, fileId: 'file-att-1', url: 'https://files.example.com/file-att-1' }],
      };
    backend:
      kind: yaml-js
      live: |
        if (!ctx.files) throw new Error('Outlook get_attachments failed: file storage (ctx.files) is required.');
        const h = { Accept: 'application/json' };
        let graphId = String(input.messageId);
        if (graphId.indexOf('<') !== -1 || graphId.indexOf('@') !== -1) {
          const f = encodeURIComponent(`internetMessageId eq '${graphId.replace(/'/g, "''")}'`);
          const lr = await ctx.http.get(`https://graph.microsoft.com/v1.0/me/messages?$filter=${f}&$select=id&$top=1`, { headers: h });
          if (!lr.status || lr.status >= 400) throw new Error(`Outlook get_attachments failed to resolve the internet message ID (${lr.status}): ${lr.text()}`);
          const hit = (lr.json().value || [])[0];
          if (!hit) throw new Error(`Outlook get_attachments failed: no message matches the internet message ID ${graphId}.`);
          graphId = hit.id;
        }
        const r = await ctx.http.get(`https://graph.microsoft.com/v1.0/me/messages/${encodeURIComponent(graphId)}/attachments`, { headers: h });
        if (r.status === 401) throw new Error('Outlook get_attachments failed: authentication expired — re-authorize the connection.');
        if (r.status === 403) throw new Error('Outlook get_attachments failed: permission denied — verify the app has the required Microsoft Graph scopes.');
        if (r.status === 404) throw new Error(`Outlook get_attachments failed: message ${input.messageId} not found.`);
        if (r.status === 429) throw new Error('Outlook get_attachments failed: rate limited by Microsoft Graph — retry later.');
        if (!r.status || r.status >= 400) throw new Error(`Outlook get_attachments failed (${r.status}): ${r.text()}`);
        const attachments = [];
        for (const a of r.json().value || []) {
          if (a['@odata.type'] !== '#microsoft.graph.fileAttachment') continue;
          const fileName = a.name || 'attachment';
          const contentType = a.contentType || 'application/octet-stream';
          const stored = a.contentBytes
            ? await ctx.files.store(a.contentBytes, { encoding: 'base64', contentType, fileName })
            : await ctx.files.download(`https://graph.microsoft.com/v1.0/me/messages/${encodeURIComponent(graphId)}/attachments/${encodeURIComponent(a.id)}/$value`, { fileName });
          const entry = { id: a.id, name: fileName, contentType, size: a.size || 0, fileId: stored.id, url: stored.url };
          if (a.contentId) entry.contentId = String(a.contentId).replace(/^<|>$/g, '');
          attachments.push(entry);
        }
        return { attachments };
    exampleInput: { messageId: 'AAMkAGI2THk...' }
  - name: search_messages
    description: Search the mailbox by keyword across subject, body, and sender.
    effects: read
    input:
      type: object
      properties:
        query:
          type: string
          description: 'Search keyword or phrase.'
        top:
          type: number
          description: 'Number of results to return (max 100, default 25).'
      required: [query]
    output: '{ messages: Array<{ id: string, subject: string, from: object, receivedDateTime: string, hasAttachments: boolean }>, nextLink: string }'
    mock: |
      return {
        messages: [{
          id: 'msg-1',
          internetMessageId: '<msg-1@example.com>',
          subject: `Re: ${input.query}`,
          from: { emailAddress: { name: 'Ada Lovelace', address: 'ada@example.com' } },
          receivedDateTime: '2025-01-15T09:00:00Z',
          isRead: true,
          hasAttachments: false,
          bodyPreview: `A message mentioning ${input.query}.`,
        }],
        nextLink: '',
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        const top = Math.min(Number(input.top) || 25, 100);
        const q = [
          '$top=' + top,
          '$search="' + encodeURIComponent(String(input.query)) + '"',
          '$select=id,internetMessageId,subject,from,toRecipients,receivedDateTime,isRead,hasAttachments,bodyPreview',
        ];
        const r = await ctx.http.get(`https://graph.microsoft.com/v1.0/me/messages?${q.join('&')}`, { headers: h });
        if (r.status === 401) throw new Error('Outlook search_messages failed: authentication expired — re-authorize the connection.');
        if (r.status === 403) throw new Error('Outlook search_messages failed: permission denied — verify the app has the required Microsoft Graph scopes.');
        if (r.status === 429) throw new Error('Outlook search_messages failed: rate limited by Microsoft Graph — retry later.');
        if (!r.status || r.status >= 400) throw new Error(`Outlook search_messages failed (${r.status}): ${r.text()}`);
        const j = r.json();
        return { messages: j.value || [], nextLink: j['@odata.nextLink'] || '' };
    exampleInput: { query: 'invoice', top: 25 }
  - name: send_message
    description: Send an email message, optionally with file attachments. The message is composed as a draft so its internet message ID can be returned, then sent.
    effects: write
    input:
      type: object
      properties:
        to:
          type: string
          description: 'Recipient email address, or an array of addresses.'
        subject:
          type: string
          description: 'Email subject line.'
        body:
          type: string
          description: 'Email body content.'
        contentType:
          type: string
          description: 'Body content type: "Text" (default) or "HTML".'
        cc:
          type: string
          description: 'CC recipient email address, or an array of addresses.'
        attachments:
          type: array
          description: 'Array of file attachments, each with name (string), contentType (string), and either contentBytes (base64-encoded string) or url (a file storage URL to fetch the bytes from).'
      required: [to, subject]
    output: '{ sent: boolean, messageId: string, to: Array<string>, subject: string }'
    mock: |
      const to = (Array.isArray(input.to) ? input.to : [input.to]).filter((x) => x != null && x !== '');
      return { sent: true, messageId: `<sent-${input.subject.length}@example.com>`, to, subject: input.subject };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json', 'Content-Type': 'application/json' };
        const check = (r, what) => {
          if (r.status === 401) throw new Error(`Outlook send_message failed: authentication expired during ${what} — re-authorize the connection.`);
          if (r.status === 403) throw new Error(`Outlook send_message failed: permission denied during ${what} — verify the app has the Mail.Send Microsoft Graph scope.`);
          if (r.status === 429) throw new Error(`Outlook send_message failed: rate limited by Microsoft Graph during ${what} — retry later.`);
          if (!r.status || r.status >= 400) throw new Error(`Outlook send_message failed during ${what} (${r.status}): ${r.text()}`);
        };
        const addresses = (v) => (Array.isArray(v) ? v : [v]).filter((x) => x != null && x !== '').map(String);
        const to = addresses(input.to);
        const draft = {
          subject: input.subject,
          body: { contentType: input.contentType || 'Text', content: input.body || '' },
          toRecipients: to.map((address) => ({ emailAddress: { address } })),
        };
        if (input.cc != null) draft.ccRecipients = addresses(input.cc).map((address) => ({ emailAddress: { address } }));
        const cr = await ctx.http.post('https://graph.microsoft.com/v1.0/me/messages', { headers: h, body: JSON.stringify(draft) });
        check(cr, 'draft creation');
        const created = cr.json();
        for (const att of Array.isArray(input.attachments) ? input.attachments : []) {
          let bytes = att.contentBytes;
          if (bytes == null) {
            if (!att.url) throw new Error(`Outlook send_message failed: attachment "${att.name || ''}" carries neither contentBytes nor a url.`);
            const fr = await ctx.http.get(att.url, { responseType: 'base64' });
            if (!fr.status || fr.status >= 400) throw new Error(`Outlook send_message failed to fetch attachment "${att.name || ''}" (${fr.status}): ${fr.text()}`);
            bytes = fr.text();
          }
          const payload = { '@odata.type': '#microsoft.graph.fileAttachment', name: att.name || 'attachment', contentType: att.contentType || 'application/octet-stream', contentBytes: bytes };
          const ar = await ctx.http.post(`https://graph.microsoft.com/v1.0/me/messages/${encodeURIComponent(created.id)}/attachments`, { headers: h, body: JSON.stringify(payload) });
          check(ar, 'attachment upload');
        }
        const sr = await ctx.http.post(`https://graph.microsoft.com/v1.0/me/messages/${encodeURIComponent(created.id)}/send`, { headers: h, body: '' });
        check(sr, 'send');
        return { sent: true, messageId: created.internetMessageId || '', to, subject: input.subject };
    exampleInput:
      {
        to: 'user@example.com',
        subject: 'Hello from Tale',
        body: 'This is a test message.',
      }
  - name: list_events
    description: List calendar events, earliest start first, optionally within a date range.
    effects: read
    input:
      type: object
      properties:
        startDateTime:
          type: string
          description: 'Start of the date range (ISO 8601, e.g. 2025-01-01T00:00:00). Applied only together with endDateTime.'
        endDateTime:
          type: string
          description: 'End of the date range (ISO 8601, e.g. 2025-12-31T23:59:59). Applied only together with startDateTime.'
        top:
          type: number
          description: 'Number of events to return (max 100, default 25).'
    output: '{ events: Array<{ id: string, subject: string, start: { dateTime: string, timeZone: string }, end: { dateTime: string, timeZone: string }, location: object, isAllDay: boolean }>, nextLink: string }'
    mock: |
      return {
        events: [{
          id: 'event-1',
          subject: 'Weekly sync',
          start: { dateTime: '2025-06-15T09:00:00', timeZone: 'UTC' },
          end: { dateTime: '2025-06-15T10:00:00', timeZone: 'UTC' },
          location: { displayName: 'Room 1' },
          isAllDay: false,
          bodyPreview: 'Agenda: last week, this week, blockers.',
        }],
        nextLink: '',
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        const top = Math.min(Number(input.top) || 25, 100);
        const q = [
          '$top=' + top,
          '$orderby=' + encodeURIComponent('start/dateTime'),
          '$select=id,subject,start,end,location,organizer,isAllDay,bodyPreview',
        ];
        if (input.startDateTime && input.endDateTime) {
          const from = String(input.startDateTime).replace(/'/g, "''");
          const to = String(input.endDateTime).replace(/'/g, "''");
          q.push('$filter=' + encodeURIComponent(`start/dateTime ge '${from}' and end/dateTime le '${to}'`));
        }
        const r = await ctx.http.get(`https://graph.microsoft.com/v1.0/me/events?${q.join('&')}`, { headers: h });
        if (r.status === 401) throw new Error('Outlook list_events failed: authentication expired — re-authorize the connection.');
        if (r.status === 403) throw new Error('Outlook list_events failed: permission denied — verify the app has the required Microsoft Graph scopes.');
        if (r.status === 429) throw new Error('Outlook list_events failed: rate limited by Microsoft Graph — retry later.');
        if (!r.status || r.status >= 400) throw new Error(`Outlook list_events failed (${r.status}): ${r.text()}`);
        const j = r.json();
        return { events: j.value || [], nextLink: j['@odata.nextLink'] || '' };
    exampleInput:
      {
        startDateTime: '2025-06-01T00:00:00',
        endDateTime: '2025-06-30T23:59:59',
      }
  - name: get_event
    description: Fetch a single calendar event by ID.
    effects: read
    input:
      type: object
      properties:
        eventId:
          type: string
          description: 'The calendar event ID returned from list_events.'
      required: [eventId]
    output: '{ event: { id: string, subject: string, start: { dateTime: string, timeZone: string }, end: { dateTime: string, timeZone: string }, location: object, attendees: Array<object>, isAllDay: boolean } }'
    mock: |
      return {
        event: {
          id: input.eventId,
          subject: 'Weekly sync',
          start: { dateTime: '2025-06-15T09:00:00', timeZone: 'UTC' },
          end: { dateTime: '2025-06-15T10:00:00', timeZone: 'UTC' },
          location: { displayName: 'Room 1' },
          attendees: [{ emailAddress: { name: 'Ada Lovelace', address: 'ada@example.com' }, type: 'required' }],
          isAllDay: false,
        },
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        const r = await ctx.http.get(`https://graph.microsoft.com/v1.0/me/events/${encodeURIComponent(input.eventId)}`, { headers: h });
        if (r.status === 401) throw new Error('Outlook get_event failed: authentication expired — re-authorize the connection.');
        if (r.status === 403) throw new Error('Outlook get_event failed: permission denied — verify the app has the required Microsoft Graph scopes.');
        if (r.status === 404) throw new Error(`Outlook get_event failed: event ${input.eventId} not found.`);
        if (r.status === 429) throw new Error('Outlook get_event failed: rate limited by Microsoft Graph — retry later.');
        if (!r.status || r.status >= 400) throw new Error(`Outlook get_event failed (${r.status}): ${r.text()}`);
        return { event: r.json() };
    exampleInput: { eventId: 'AAMkAGI2TG93...' }
  - name: create_event
    description: Create a calendar event, optionally with a location and attendees.
    effects: write
    input:
      type: object
      properties:
        subject:
          type: string
          description: 'Event subject/title.'
        startDateTime:
          type: string
          description: 'Start time (ISO 8601, e.g. 2025-06-15T09:00:00).'
        endDateTime:
          type: string
          description: 'End time (ISO 8601, e.g. 2025-06-15T10:00:00).'
        timeZone:
          type: string
          description: 'Time zone for the start and end times (e.g. UTC, Europe/Berlin). Defaults to UTC.'
        body:
          type: string
          description: 'Event body/description.'
        contentType:
          type: string
          description: 'Body content type: "Text" (default) or "HTML".'
        location:
          type: string
          description: 'Event location display name.'
        attendees:
          type: string
          description: 'Attendee email address, or an array of addresses. Each is invited as a required attendee.'
        isAllDay:
          type: boolean
          description: 'Whether the event covers the whole day.'
      required: [subject, startDateTime, endDateTime]
    output: '{ id: string, subject: string, start: string, end: string, webLink: string }'
    mock: |
      return {
        id: `event-${input.subject.length}`,
        subject: input.subject,
        start: input.startDateTime,
        end: input.endDateTime,
        webLink: `https://outlook.office.com/calendar/item/event-${input.subject.length}`,
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json', 'Content-Type': 'application/json' };
        const timeZone = input.timeZone || 'UTC';
        const event = {
          subject: input.subject,
          start: { dateTime: input.startDateTime, timeZone },
          end: { dateTime: input.endDateTime, timeZone },
        };
        if (input.body != null) event.body = { contentType: input.contentType || 'Text', content: input.body };
        if (input.location != null) event.location = { displayName: input.location };
        if (input.attendees != null) event.attendees = (Array.isArray(input.attendees) ? input.attendees : [input.attendees]).filter((x) => x != null && x !== '').map((address) => ({ emailAddress: { address: String(address) }, type: 'required' }));
        if (input.isAllDay) event.isAllDay = true;
        const r = await ctx.http.post('https://graph.microsoft.com/v1.0/me/events', { headers: h, body: JSON.stringify(event) });
        if (r.status === 401) throw new Error('Outlook create_event failed: authentication expired — re-authorize the connection.');
        if (r.status === 403) throw new Error('Outlook create_event failed: permission denied — verify the app has the Calendars.ReadWrite Microsoft Graph scope.');
        if (r.status === 429) throw new Error('Outlook create_event failed: rate limited by Microsoft Graph — retry later.');
        if (!r.status || r.status >= 400) throw new Error(`Outlook create_event failed (${r.status}): ${r.text()}`);
        const j = r.json();
        return {
          id: j.id,
          subject: j.subject || input.subject,
          start: (j.start && j.start.dateTime) || input.startDateTime,
          end: (j.end && j.end.dateTime) || input.endDateTime,
          webLink: j.webLink || '',
        };
    exampleInput:
      {
        subject: 'Design review',
        startDateTime: '2025-06-15T09:00:00',
        endDateTime: '2025-06-15T10:00:00',
        timeZone: 'Europe/Berlin',
      }
  - name: list_contacts
    description: List contacts from the default contacts folder, ordered by display name.
    effects: read
    input:
      type: object
      properties:
        top:
          type: number
          description: 'Number of contacts to return (max 100, default 25).'
        skip:
          type: number
          description: 'Number of contacts to skip for pagination.'
        search:
          type: string
          description: 'Match contacts whose display name, first name, or last name starts with this value.'
    output: '{ contacts: Array<{ id: string, displayName: string, givenName: string, surname: string, emailAddresses: Array<{ name: string, address: string }>, companyName: string, jobTitle: string }>, nextLink: string }'
    mock: |
      return {
        contacts: [{
          id: 'contact-1',
          displayName: 'Ada Lovelace',
          givenName: 'Ada',
          surname: 'Lovelace',
          emailAddresses: [{ name: 'Ada Lovelace', address: 'ada@example.com' }],
          businessPhones: ['+49 30 000000'],
          mobilePhone: '',
          companyName: 'Example GmbH',
          jobTitle: 'Engineer',
        }],
        nextLink: '',
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        const top = Math.min(Number(input.top) || 25, 100);
        const q = [
          '$top=' + top,
          '$orderby=displayName',
          '$select=id,displayName,givenName,surname,emailAddresses,businessPhones,mobilePhone,companyName,jobTitle',
        ];
        if (input.search) {
          const s = String(input.search).replace(/'/g, "''");
          q.push('$filter=' + encodeURIComponent(`startsWith(displayName,'${s}') or startsWith(givenName,'${s}') or startsWith(surname,'${s}')`));
        }
        if (input.skip) q.push('$skip=' + encodeURIComponent(String(input.skip)));
        const r = await ctx.http.get(`https://graph.microsoft.com/v1.0/me/contacts?${q.join('&')}`, { headers: h });
        if (r.status === 401) throw new Error('Outlook list_contacts failed: authentication expired — re-authorize the connection.');
        if (r.status === 403) throw new Error('Outlook list_contacts failed: permission denied — verify the app has the required Microsoft Graph scopes.');
        if (r.status === 429) throw new Error('Outlook list_contacts failed: rate limited by Microsoft Graph — retry later.');
        if (!r.status || r.status >= 400) throw new Error(`Outlook list_contacts failed (${r.status}): ${r.text()}`);
        const j = r.json();
        return { contacts: j.value || [], nextLink: j['@odata.nextLink'] || '' };
    exampleInput: { top: 25, search: 'Ada' }
  - name: get_contact
    description: Fetch a single contact by ID.
    effects: read
    input:
      type: object
      properties:
        contactId:
          type: string
          description: 'The contact ID returned from list_contacts.'
      required: [contactId]
    output: '{ contact: { id: string, displayName: string, givenName: string, surname: string, emailAddresses: Array<{ name: string, address: string }>, companyName: string, jobTitle: string } }'
    mock: |
      return {
        contact: {
          id: input.contactId,
          displayName: 'Ada Lovelace',
          givenName: 'Ada',
          surname: 'Lovelace',
          emailAddresses: [{ name: 'Ada Lovelace', address: 'ada@example.com' }],
          businessPhones: ['+49 30 000000'],
          mobilePhone: '',
          companyName: 'Example GmbH',
          jobTitle: 'Engineer',
        },
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        const r = await ctx.http.get(`https://graph.microsoft.com/v1.0/me/contacts/${encodeURIComponent(input.contactId)}`, { headers: h });
        if (r.status === 401) throw new Error('Outlook get_contact failed: authentication expired — re-authorize the connection.');
        if (r.status === 403) throw new Error('Outlook get_contact failed: permission denied — verify the app has the required Microsoft Graph scopes.');
        if (r.status === 404) throw new Error(`Outlook get_contact failed: contact ${input.contactId} not found.`);
        if (r.status === 429) throw new Error('Outlook get_contact failed: rate limited by Microsoft Graph — retry later.');
        if (!r.status || r.status >= 400) throw new Error(`Outlook get_contact failed (${r.status}): ${r.text()}`);
        return { contact: r.json() };
    exampleInput: { contactId: 'AAMkAGI2TGuc...' }
