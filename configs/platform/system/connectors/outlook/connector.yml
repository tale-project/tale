        output:
          emailAddress: you@example.com
      - name: no_address
        kind: empty
        description: 'Graph answers the signed-in account with neither a mail address nor a principal name, so the address is empty.'
        output:
          emailAddress: ''
      - name: refused_sign_in
        kind: error
        description: 'Graph answers HTTP 401 because the access token has expired or been revoked.'
        error:
          message: 'Outlook get_profile failed: Microsoft Graph refused the sign-in — reconnect the account, or for an app sign-in replace its client secret in Settings → Connectors.'
          status: 401
    backend:
      kind: yaml-js
      live: |
        // A named mailbox is the identity: reading another user's profile
        // would need a directory permission the mailbox grant never carries.
        if (outlookMailbox) return { emailAddress: outlookMailbox };
        const r = await ctx.http.get(`${graphRoot}?$select=mail,userPrincipalName`, { headers: { Accept: 'application/json' } });
        graphCheck('get_profile', r, { permission: 'User.Read', mailboxRoot: true });
        const j = r.json();
        return { emailAddress: String(j.mail || j.userPrincipalName || '') };
