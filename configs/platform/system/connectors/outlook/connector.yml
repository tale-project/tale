# Connector — Microsoft Outlook through the Microsoft Graph v1.0 API.
# A credential authorizes every action, signed in one of two ways: a person
# through OAuth (their own mailbox, or with `mailbox` set one they have Full
# Access to), or the organization's own app signing in as itself
# (client-credentials) on the one mailbox `mailbox` names — scoped to it in
# Exchange by RBAC for Applications. The platform injects the token as the
# Authorization header, so the live bodies below carry only Graph's functional
# headers, and every Graph path starts at `graphRoot` (the prelude):
# `/users/{mailbox}` when a mailbox is set, `/me` otherwise. Reads return the
# resource(s) under a named key plus Graph's pagination link; writes return
# the identifiers a caller routes on. Attachment actions store bytes through
# ctx.files and return a file reference. Every mock is deterministic — same
# input, same output, no IO.
name: outlook
displayName: Microsoft Outlook
description: Manage Outlook mail, calendar, and contacts.
tags:
  - Email
allowedHosts:
  - graph.microsoft.com
configFields:
  - key: mailbox
    label: Mailbox
    type: string
    requiredFor:
      - client-credentials
    # Everything the credential does belongs to its mailbox: the mail sync's
    # positions, the conversations it filed and the replies they send. So a
    # credential is added for a mailbox and keeps it; another mailbox is
    # another credential.
    fixed: true
    # Named by its address, never by an ID Graph also takes: the Inbox, the
    # composer and the mail sync tell the mailbox's own mail by it.
    format: email
    description: >-
      The address of the mailbox to work in, such as a shared mailbox like
      support@example.com. Required for an app sign-in. With an OAuth
      connection, leave it empty to use the signed-in account's own mailbox,
      or name a mailbox that account has Full Access to. Set when the
      credential is added: to work in another mailbox, add another
      credential.
    i18n:
      de:
        label: 'Postfach'
        description: 'Die Adresse des Postfachs, in dem gearbeitet wird, etwa ein freigegebenes Postfach wie support@example.com. Für eine App-Anmeldung erforderlich. Bei einer OAuth-Verbindung leer lassen, um das eigene Postfach des angemeldeten Kontos zu verwenden, oder ein Postfach angeben, auf das dieses Konto Vollzugriff hat. Wird beim Hinzufügen der Zugangsdaten festgelegt: Für ein anderes Postfach fügst du weitere Zugangsdaten hinzu.'
      fr:
        label: 'Boîte aux lettres'
        description: 'L’adresse de la boîte aux lettres dans laquelle travailler, par exemple une boîte partagée comme support@example.com. Obligatoire pour une connexion de l’app. Avec une connexion OAuth, laisse vide pour utiliser la boîte du compte connecté, ou indique une boîte à laquelle ce compte a un accès complet. Elle est fixée à l’ajout des identifiants : pour travailler dans une autre boîte, ajoute d’autres identifiants.'
  - key: fromAddress
    label: From address
    type: string
    description: >-
      The mailbox address the Inbox and the composer show, kept by Tale: the
      mailbox named above, else the signed-in account's own address.
    i18n:
      de:
        label: 'Absenderadresse'
        description: 'Die Postfachadresse, die der Posteingang und der Editor zeigen, von Tale gepflegt: das oben genannte Postfach, sonst die eigene Adresse des angemeldeten Kontos.'
      fr:
        label: 'Adresse d’expéditeur'
        description: 'L’adresse de boîte que la boîte de réception et l’éditeur affichent, tenue par Tale : la boîte indiquée ci-dessus, sinon l’adresse du compte connecté.'
auth:
  - method: oauth2
    authorizeUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
    scopes:
      - Mail.Read
      - Mail.ReadWrite
      - Mail.Send
      - Calendars.Read
      - Calendars.ReadWrite
      - Contacts.Read
      - User.Read
    # Asked only of a credential that names a mailbox — entered beside
    # Connect, or stored on the credential a Reconnect renews: a personal
    # Microsoft account cannot grant the shared-mailbox permissions.
    configScopes:
      mailbox:
        - Mail.Read.Shared
        - Mail.ReadWrite.Shared
        - Mail.Send.Shared
        - Calendars.Read.Shared
        - Calendars.ReadWrite.Shared
        - Contacts.Read.Shared
  # The organization's own single-tenant app, signing in as itself. Its
  # Microsoft Graph access comes from Exchange application roles scoped to
  # the mailbox (RBAC for Applications); `.default` asks for what was granted.
  - method: client-credentials
    tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
    scopes:
      - https://graph.microsoft.com/.default
# Shared by every live body: where its Graph calls go, and what a refusal
# means. `graphRoot` is the mailbox's Graph root — `/users/<mailbox>` when the
# credential names one (an app has no `/me`), else the signed-in account's
# `/me`. `graphCheck` throws the sentence a person can act on: a 403 on a
# named mailbox says how the mailbox is granted, a 429 names Graph's wait,
# and a 404 names the mailbox only for a call on the mailbox itself
# (`mailboxRoot`) — a message, attachment or folder Graph no longer finds
# keeps Graph's own `(404)`, which the mail sync reads as gone.
livePrelude: |
  const outlookMailbox = String((ctx.config && ctx.config.mailbox) || '').trim();
  const graphRoot = 'https://graph.microsoft.com/v1.0/' + (outlookMailbox ? 'users/' + encodeURIComponent(outlookMailbox).replace(/%40/g, '@') : 'me');
  const graphRefusal = (action, r, opts) => {
    const o = opts || {};
    const head = `Outlook ${action} failed${o.during ? ` during ${o.during}` : ''}`;
    if (r.status === 401) return new Error(`${head}: Microsoft Graph refused the sign-in — reconnect the account, or for an app sign-in replace its client secret in Settings → Connectors.`);
    if (r.status === 403) {
      const permission = o.permission || 'Mail.Read';
      if (outlookMailbox) return new Error(`${head}: Microsoft Graph denied access to the mailbox ${outlookMailbox} — an app signing in as itself needs the Exchange role "Application ${permission}" assigned with a management scope that includes this mailbox (RBAC for Applications); a person needs Full Access to the mailbox${permission === 'Mail.Send' ? ' and Send As' : ''}.`);
      return new Error(`${head}: permission denied — verify the app has the ${o.permission ? `${o.permission} Microsoft Graph scope` : 'required Microsoft Graph scopes'}.`);
    }
    if (r.status === 404 && o.notFound) return new Error(`${head}: ${o.notFound} not found.`);
    if (r.status === 404 && o.mailboxRoot && outlookMailbox) return new Error(`${head}: Microsoft Graph has no mailbox ${outlookMailbox}${o.folder ? ` or no folder "${o.folder}" in it` : ''} — add a credential with the right address in Settings → Connectors.`);
    // The wait Graph names (Retry-After, in seconds) rides in the sentence, so a sync can report it.
    if (r.status === 429) { const wait = String((r.headers || {})['retry-after'] || ''); return new Error(`${head}: rate limited by Microsoft Graph${/^\d+$/.test(wait) ? ` (retry after ${wait}s)` : ''} — retry later.`); }
    if (!r.status || r.status >= 400) return new Error(`${head} (${r.status}): ${r.text()}`);
    return null;
  };
  const graphCheck = (action, r, opts) => { const refusal = graphRefusal(action, r, opts); if (refusal) throw refusal; };
actions:
  - name: list_messages
    title: List messages
    i18n:
      de:
        title: Nachrichten auflisten
      fr:
        title: Lister les messages
    description: List messages from the mailbox, newest first. Draft messages are excluded.
    effects: read
    input:
      type: object
      properties:
        top:
          type: number
          description: 'Number of messages to return (max 1000, default 25).'
        skip:
          type: number
          description: 'Number of messages to skip for pagination.'
        folder:
          type: string
          description: 'Mail folder to restrict the listing to — a folder ID or a well-known name ("inbox", "sentitems", "archive").'
        filter:
          type: string
          description: 'OData $filter expression, applied on top of folder.'
        orderby:
          type: string
          description: 'OData $orderby expression (default "receivedDateTime desc").'
        select:
          type: string
          description: 'Comma-separated list of fields to return.'
        expand:
          type: string
          description: 'OData $expand expression, e.g. "attachments($select=id,name,contentType,size)" to include attachment metadata.'
        format:
          type: string
          description: 'Set to "email" to map each message onto the standard email shape (messageId, from, to, cc, bcc, subject, date, text, html, flags, headers).'
    output: '{ messages: Array<{ id: string, subject: string, from: object, receivedDateTime: string, isRead: boolean, hasAttachments: boolean }>, nextLink: string }'
    mock: |
      if (input.format === 'email') {
        return {
          messages: [{
            messageId: '<msg-1@example.com>',
            from: [{ name: 'Ada Lovelace', address: 'ada@example.com' }],
            to: [{ name: 'You', address: 'you@example.com' }],
            cc: [],
            bcc: [],
            subject: 'Quarterly report',
            date: '2025-01-15T09:00:00Z',
            text: 'The quarterly report is ready.',
            html: '',
            flags: [],
            headers: { 'message-id': '<msg-1@example.com>', 'in-reply-to': '', references: '' },
            attachments: [],
            hasAttachments: false,
            conversationId: 'conv-1',
            direction: 'inbound',
          }],
          nextLink: '',
        };
      }
      return {
        messages: [{
          id: 'msg-1',
          internetMessageId: '<msg-1@example.com>',
          subject: 'Quarterly report',
          from: { emailAddress: { name: 'Ada Lovelace', address: 'ada@example.com' } },
          toRecipients: [{ emailAddress: { name: 'You', address: 'you@example.com' } }],
          receivedDateTime: '2025-01-15T09:00:00Z',
          isRead: false,
          hasAttachments: false,
          bodyPreview: 'The quarterly report is ready.',
        }],
        nextLink: '',
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        // Graph's own ceiling for a page of messages.
        const top = Math.min(Number(input.top) || 25, 1000);
        const orderby = input.orderby ? String(input.orderby) : 'receivedDateTime desc';
        const filter = input.filter ? String(input.filter) : '';
        const draftFilter = 'isDraft eq false';
        // Graph rejects $orderby combined with a $filter on conversationId, so drop it and sort in memory.
        const clientSort = filter.indexOf('conversationId') !== -1;
        const q = ['$top=' + top];
        if (!clientSort) q.push('$orderby=' + encodeURIComponent(orderby));
        if (filter) q.push('$filter=' + encodeURIComponent(filter + ' and ' + draftFilter));
        else q.push('$filter=' + encodeURIComponent(draftFilter));
        q.push('$select=' + encodeURIComponent(input.select ? String(input.select) : 'id,internetMessageId,subject,from,toRecipients,receivedDateTime,isRead,hasAttachments,bodyPreview'));
        if (input.skip) q.push('$skip=' + encodeURIComponent(String(input.skip)));
        if (input.expand) q.push('$expand=' + encodeURIComponent(String(input.expand)));
        // The folder is a path segment, not a $filter clause: Graph resolves
        // well-known names (`sentitems`) there but never in `parentFolderId eq`,
        // and this keeps a caller's own $filter (a sync cursor) applying on top.
        const folder = input.folder ? String(input.folder) : '';
        const base = folder
          ? `${graphRoot}/mailFolders/${encodeURIComponent(folder)}/messages`
          : `${graphRoot}/messages`;
        const r = await ctx.http.get(`${base}?${q.join('&')}`, { headers: h });
        graphCheck('list_messages', r, { mailboxRoot: true, folder });
        const j = r.json();
        let messages = j.value || [];
        if (input.format === 'email') {
          // The mailbox's own address tells its mail from a customer's: the
          // named mailbox, else the signed-in account's.
          let account = outlookMailbox.toLowerCase();
          if (!account) {
            const me = await ctx.http.get(`${graphRoot}?$select=mail,userPrincipalName`, { headers: h });
            const profile = me.status === 200 ? me.json() : {};
            account = String(profile.mail || profile.userPrincipalName || '').toLowerCase();
          }
          const addrs = (list) => (list || []).map((x) => ({ name: (x.emailAddress && x.emailAddress.name) || '', address: (x.emailAddress && x.emailAddress.address) || '' }));
          messages = messages.map((m) => {
            const from = (m.from && m.from.emailAddress) || {};
            const contentType = String((m.body && m.body.contentType) || '').toLowerCase();
            const content = (m.body && m.body.content) || '';
            return {
              messageId: m.internetMessageId || m.id || '',
              from: [{ name: from.name || '', address: from.address || '' }],
              to: addrs(m.toRecipients),
              cc: addrs(m.ccRecipients),
              bcc: addrs(m.bccRecipients),
              subject: m.subject || '',
              date: m.receivedDateTime || m.sentDateTime || '',
              text: contentType === 'text' ? content : '',
              html: contentType === 'html' ? content : '',
              flags: m.isRead ? ['\\Seen'] : [],
              headers: { 'message-id': m.internetMessageId || '', 'in-reply-to': '', references: '' },
              attachments: (m.attachments || []).filter((a) => a['@odata.type'] === '#microsoft.graph.fileAttachment').map((a) => {
                const mapped = { id: a.id, filename: a.name || 'attachment', contentType: a.contentType || 'application/octet-stream', size: a.size || 0 };
                if (a.contentId) mapped.contentId = String(a.contentId).replace(/^<|>$/g, '');
                return mapped;
              }),
              hasAttachments: !!m.hasAttachments,
              conversationId: m.conversationId || '',
              direction: account && String(from.address || '').toLowerCase() === account ? 'outbound' : 'inbound',
            };
          });
        }
        if (clientSort) {
          const field = input.format === 'email' ? 'date' : 'receivedDateTime';
          const desc = orderby.indexOf('desc') !== -1;
          messages = messages.slice().sort((a, b) => { const ta = new Date(a[field] || 0).getTime(); const tb = new Date(b[field] || 0).getTime(); return desc ? tb - ta : ta - tb; });
        }
        return { messages, nextLink: j['@odata.nextLink'] || '' };
    exampleInput: { top: 25 }
  - name: get_message
    title: Get message
    i18n:
      de:
        title: Nachricht abrufen
      fr:
        title: Récupérer un message
    description: Fetch a single email message by ID, optionally downloading and storing its file attachments.
    effects: read
    input:
      type: object
      properties:
        messageId:
          type: string
          description: 'The message ID returned from list_messages or search_messages.'
        includeAttachments:
          type: boolean
          description: 'When true, downloads and stores every file attachment. Each one is returned with a fileId and URL.'
      required: [messageId]
    output: '{ message: { id: string, internetMessageId: string, subject: string, from: object, receivedDateTime: string, body: { contentType: string, content: string } }, attachments: Array<{ id: string, name: string, contentType: string, size: number, fileId: string, url?: string }> }'
    mock: |
      return {
        message: {
          id: input.messageId,
          internetMessageId: `<${input.messageId}@example.com>`,
          subject: 'Quarterly report',
          from: { emailAddress: { name: 'Ada Lovelace', address: 'ada@example.com' } },
          toRecipients: [{ emailAddress: { name: 'You', address: 'you@example.com' } }],
          receivedDateTime: '2025-01-15T09:00:00Z',
          isRead: false,
          hasAttachments: false,
          body: { contentType: 'text', content: 'The quarterly report is ready.' },
        },
        attachments: [],
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        // $select the threading headers (internetMessageHeaders) alongside the
        // full message projection — Graph omits internetMessageHeaders from the
        // default shape, so without this a reply carries no In-Reply-To /
        // References and threads nowhere. The field list is a superset of what
        // conversation ingest reads, so nothing the default shape carried is lost.
        const select = 'id,conversationId,internetMessageId,internetMessageHeaders,subject,bodyPreview,body,from,sender,toRecipients,ccRecipients,bccRecipients,replyTo,receivedDateTime,sentDateTime,hasAttachments,isRead,isDraft,importance';
        const r = await ctx.http.get(`${graphRoot}/messages/${encodeURIComponent(input.messageId)}?$select=${select}`, { headers: h });
        graphCheck('get_message', r, { notFound: `message ${input.messageId}` });
        const message = r.json();
        const attachments = [];
        if (input.includeAttachments && message.hasAttachments && ctx.files) {
          const ar = await ctx.http.get(`${graphRoot}/messages/${encodeURIComponent(message.id)}/attachments`, { headers: h });
          graphCheck('get_message', ar, { during: 'attachment listing' });
          for (const a of ar.json().value || []) {
            if (a['@odata.type'] !== '#microsoft.graph.fileAttachment') continue;
            const fileName = a.name || 'attachment';
            const contentType = a.contentType || 'application/octet-stream';
            const stored = a.contentBytes
              ? await ctx.files.store(a.contentBytes, { encoding: 'base64', contentType, fileName })
              : await ctx.files.download(`${graphRoot}/messages/${encodeURIComponent(message.id)}/attachments/${encodeURIComponent(a.id)}/$value`, { fileName });
            const entry = { id: a.id, name: fileName, contentType, size: a.size || 0, fileId: stored.id, url: stored.url };
            if (a.contentId) entry.contentId = String(a.contentId).replace(/^<|>$/g, '');
            attachments.push(entry);
          }
        }
        return { message, attachments };
    exampleInput: { messageId: 'AAMkAGI2THk...', includeAttachments: true }
  - name: get_attachments
    title: Download attachments
    i18n:
      de:
        title: Anhänge herunterladen
      fr:
        title: Télécharger les pièces jointes
    description: Download every file attachment on a message and store each one. Returns a fileId and URL per attachment.
    effects: read
    input:
      type: object
      properties:
        messageId:
          type: string
          description: 'The message ID containing the attachments. An RFC 2822 internet message ID is resolved to its Graph ID first.'
      required: [messageId]
    output: '{ attachments: Array<{ id: string, name: string, contentType: string, size: number, fileId: string, url?: string, contentId?: string }> }'
    mock: |
      return {
        attachments: [{ id: 'att-1', name: 'report.pdf', contentType: 'application/pdf', size: 2048, fileId: 'file-att-1', url: 'https://files.example.com/file-att-1' }],
      };
    backend:
      kind: yaml-js
      live: |
        if (!ctx.files) throw new Error('Outlook get_attachments failed: file storage (ctx.files) is required.');
        const h = { Accept: 'application/json' };
        let graphId = String(input.messageId);
        if (graphId.indexOf('<') !== -1 || graphId.indexOf('@') !== -1) {
          const f = encodeURIComponent(`internetMessageId eq '${graphId.replace(/'/g, "''")}'`);
          const lr = await ctx.http.get(`${graphRoot}/messages?$filter=${f}&$select=id&$top=1`, { headers: h });
          graphCheck('get_attachments', lr, { during: 'internet message ID lookup', mailboxRoot: true });
          const hit = (lr.json().value || [])[0];
          if (!hit) throw new Error(`Outlook get_attachments failed: no message matches the internet message ID ${graphId}.`);
          graphId = hit.id;
        }
        const r = await ctx.http.get(`${graphRoot}/messages/${encodeURIComponent(graphId)}/attachments`, { headers: h });
        graphCheck('get_attachments', r, { notFound: `message ${input.messageId}` });
        const attachments = [];
        for (const a of r.json().value || []) {
          if (a['@odata.type'] !== '#microsoft.graph.fileAttachment') continue;
          const fileName = a.name || 'attachment';
          const contentType = a.contentType || 'application/octet-stream';
          const stored = a.contentBytes
            ? await ctx.files.store(a.contentBytes, { encoding: 'base64', contentType, fileName })
            : await ctx.files.download(`${graphRoot}/messages/${encodeURIComponent(graphId)}/attachments/${encodeURIComponent(a.id)}/$value`, { fileName });
          const entry = { id: a.id, name: fileName, contentType, size: a.size || 0, fileId: stored.id, url: stored.url };
          if (a.contentId) entry.contentId = String(a.contentId).replace(/^<|>$/g, '');
          attachments.push(entry);
        }
        return { attachments };
    exampleInput: { messageId: 'AAMkAGI2THk...' }
  - name: search_messages
    title: Search messages
    i18n:
      de:
        title: Nachrichten durchsuchen
      fr:
        title: Rechercher des messages
    description: Search the mailbox by keyword across subject, body, and sender.
    effects: read
    input:
      type: object
      properties:
        query:
          type: string
          description: 'Search keyword or phrase.'
        top:
          type: number
          description: 'Number of results to return (max 100, default 25).'
      required: [query]
    output: '{ messages: Array<{ id: string, subject: string, from: object, receivedDateTime: string, hasAttachments: boolean }>, nextLink: string }'
    mock: |
      return {
        messages: [{
          id: 'msg-1',
          internetMessageId: '<msg-1@example.com>',
          subject: `Re: ${input.query}`,
          from: { emailAddress: { name: 'Ada Lovelace', address: 'ada@example.com' } },
          receivedDateTime: '2025-01-15T09:00:00Z',
          isRead: true,
          hasAttachments: false,
          bodyPreview: `A message mentioning ${input.query}.`,
        }],
        nextLink: '',
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        const top = Math.min(Number(input.top) || 25, 100);
        const q = [
          '$top=' + top,
          '$search="' + encodeURIComponent(String(input.query)) + '"',
          '$select=id,internetMessageId,subject,from,toRecipients,receivedDateTime,isRead,hasAttachments,bodyPreview',
        ];
        const r = await ctx.http.get(`${graphRoot}/messages?${q.join('&')}`, { headers: h });
        graphCheck('search_messages', r, { mailboxRoot: true });
        const j = r.json();
        return { messages: j.value || [], nextLink: j['@odata.nextLink'] || '' };
    exampleInput: { query: 'invoice', top: 25 }
  - name: send_message
    title: Send email
    i18n:
      de:
        title: E-Mail senden
      fr:
        title: Envoyer un e-mail
    description: Send an email message, optionally with file attachments. The message is composed as a draft so its internet message ID can be returned, then sent.
    effects: write
    input:
      type: object
      properties:
        to:
          type: string
          description: 'Recipient email address, or an array of addresses.'
        subject:
          type: string
          description: 'Email subject line.'
        body:
          type: string
          description: 'Email body content.'
        contentType:
          type: string
          description: 'Body content type: "Text" (default) or "HTML".'
        cc:
          type: string
          description: 'CC recipient email address, or an array of addresses.'
        attachments:
          type: array
          description: 'Array of file attachments, each with name (string), contentType (string), and either contentBytes (base64-encoded string) or url (a file storage URL to fetch the bytes from).'
      required: [to, subject]
    output: '{ sent: boolean, messageId: string, to: Array<string>, subject: string }'
    mock: |
      const to = (Array.isArray(input.to) ? input.to : [input.to]).filter((x) => x != null && x !== '');
      return { sent: true, messageId: `<sent-${input.subject.length}@example.com>`, to, subject: input.subject };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json', 'Content-Type': 'application/json' };
        // The draft and its attachments are written to the mailbox (Mail.ReadWrite); only the send itself needs Mail.Send.
        // Only the draft is created on the mailbox itself; the upload and
        // the send act on that draft.
        const check = (r, what) => graphCheck('send_message', r, { during: what, permission: what === 'send' ? 'Mail.Send' : 'Mail.ReadWrite', mailboxRoot: what === 'draft creation' });
        const addresses = (v) => (Array.isArray(v) ? v : [v]).filter((x) => x != null && x !== '').map(String);
        const to = addresses(input.to);
        const draft = {
          subject: input.subject,
          body: { contentType: input.contentType || 'Text', content: input.body || '' },
          toRecipients: to.map((address) => ({ emailAddress: { address } })),
        };
        if (input.cc != null) draft.ccRecipients = addresses(input.cc).map((address) => ({ emailAddress: { address } }));
        const cr = await ctx.http.post(`${graphRoot}/messages`, { headers: h, body: JSON.stringify(draft) });
        check(cr, 'draft creation');
        const created = cr.json();
        for (const att of Array.isArray(input.attachments) ? input.attachments : []) {
          let bytes = att.contentBytes;
          if (bytes == null) {
            if (!att.url) throw new Error(`Outlook send_message failed: attachment "${att.name || ''}" carries neither contentBytes nor a url.`);
            const fr = await ctx.http.get(att.url, { responseType: 'base64' });
            if (!fr.status || fr.status >= 400) throw new Error(`Outlook send_message failed to fetch attachment "${att.name || ''}" (${fr.status}): ${fr.text()}`);
            bytes = fr.text();
          }
          const payload = { '@odata.type': '#microsoft.graph.fileAttachment', name: att.name || 'attachment', contentType: att.contentType || 'application/octet-stream', contentBytes: bytes };
          const ar = await ctx.http.post(`${graphRoot}/messages/${encodeURIComponent(created.id)}/attachments`, { headers: h, body: JSON.stringify(payload) });
          check(ar, 'attachment upload');
        }
        const sr = await ctx.http.post(`${graphRoot}/messages/${encodeURIComponent(created.id)}/send`, { headers: h, body: '' });
        check(sr, 'send');
        return { sent: true, messageId: created.internetMessageId || '', to, subject: input.subject };
    exampleInput:
      {
        to: 'user@example.com',
        subject: 'Hello from Tale',
        body: 'This is a test message.',
      }
  - name: get_profile
    title: Get mailbox address
    i18n:
      de:
        title: Adresse des Postfachs abrufen
      fr:
        title: Récupérer l’adresse de la boîte mail
    description: The address of the connected mailbox (the mailbox the credential names, else the signed-in account's mail address, else its principal name), as the mail sync reads it to tell the mailbox's own mail from a customer's.
    effects: read
    input:
      type: object
      properties: {}
    output: '{ emailAddress: string }'
    mock: |
      return { emailAddress: 'mailbox@example.com' };
    backend:
      kind: yaml-js
      live: |
        // A named mailbox is the identity: reading another user's profile
        // would need a directory permission the mailbox grant never carries.
        if (outlookMailbox) return { emailAddress: outlookMailbox };
        const r = await ctx.http.get(`${graphRoot}?$select=mail,userPrincipalName`, { headers: { Accept: 'application/json' } });
        graphCheck('get_profile', r, { permission: 'User.Read', mailboxRoot: true });
        const j = r.json();
        return { emailAddress: String(j.mail || j.userPrincipalName || '') };
    exampleInput: {}
  - name: list_events
    title: List events
    i18n:
      de:
        title: Termine auflisten
      fr:
        title: Lister les événements
    description: List calendar events, earliest start first, optionally within a date range.
    effects: read
    input:
      type: object
      properties:
        startDateTime:
          type: string
          description: 'Start of the date range (ISO 8601, e.g. 2025-01-01T00:00:00). Applied only together with endDateTime.'
        endDateTime:
          type: string
          description: 'End of the date range (ISO 8601, e.g. 2025-12-31T23:59:59). Applied only together with startDateTime.'
        top:
          type: number
          description: 'Number of events to return (max 100, default 25).'
    output: '{ events: Array<{ id: string, subject: string, start: { dateTime: string, timeZone: string }, end: { dateTime: string, timeZone: string }, location: object, isAllDay: boolean }>, nextLink: string }'
    mock: |
      return {
        events: [{
          id: 'event-1',
          subject: 'Weekly sync',
          start: { dateTime: '2025-06-15T09:00:00', timeZone: 'UTC' },
          end: { dateTime: '2025-06-15T10:00:00', timeZone: 'UTC' },
          location: { displayName: 'Room 1' },
          isAllDay: false,
          bodyPreview: 'Agenda: last week, this week, blockers.',
        }],
        nextLink: '',
      };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        const top = Math.min(Number(input.top) || 25, 100);
        const q = [
          '$top=' + top,
          '$orderby=' + encodeURIComponent('start/dateTime'),
          '$select=id,subject,start,end,location,organizer,isAllDay,bodyPreview',
        ];
        if (input.startDateTime && input.endDateTime) {
          const from = String(input.startDateTime).replace(/'/g, "''");
          const to = String(input.endDateTime).replace(/'/g, "''");
          q.push('$filter=' + encodeURIComponent(`start/dateTime ge '${from}' and end/dateTime le '${to}'`));
        }
        const r = await ctx.http.get(`${graphRoot}/events?${q.join('&')}`, { headers: h });
        graphCheck('list_events', r, { permission: 'Calendars.Read', mailboxRoot: true });
        const j = r.json();
        return { events: j.value || [], nextLink: j['@odata.nextLink'] || '' };
    exampleInput:
      {
        startDateTime: '2025-06-01T00:00:00',
        endDateTime: '2025-06-30T23:59:59',
      }
  - name: get_event
    title: Get event
    i18n:
      de:
        title: Termin abrufen
      fr:
        title: Récupérer un événement
    description: Fetch a single calendar event by ID.
    effects: read
    input:
