          type: string
          description: 'Match contacts whose display name, first name, or last name starts with this value.'
    output: '{ contacts: Array<{ id: string, displayName: string, givenName: string, surname: string, emailAddresses: Array<{ name: string, address: string }>, businessPhones: Array<string>, mobilePhone: string | null, companyName: string, jobTitle: string }>, nextLink: string }'
    mock: |
      return {
        contacts: [{
          id: 'contact-1',
          displayName: 'Ada Lovelace',
          givenName: 'Ada',
          surname: 'Lovelace',
          emailAddresses: [{ name: 'Ada Lovelace', address: 'ada@example.com' }],
          businessPhones: ['+49 30 000000'],
          mobilePhone: '',
          companyName: 'Example GmbH',
          jobTitle: 'Engineer',
        }],
        nextLink: '',
      };
    scenarios:
      - name: two_contacts
        kind: success
        description: 'Graph returns the two contacts whose names start with the search text, ordered by display name.'
        output:
          contacts:
            - id: AAMkAGI2TGuc1
              displayName: Ada Lovelace
              givenName: Ada
              surname: Lovelace
              emailAddresses: [{ name: Ada Lovelace, address: ada@example.com }]
              businessPhones: ['+49 30 000000']
              mobilePhone: null
              companyName: Example GmbH
              jobTitle: Engineer
            - id: AAMkAGI2TGuc2
              displayName: Adam Smith
              givenName: Adam
              surname: Smith
              emailAddresses: [{ name: Adam Smith, address: adam@example.com }]
              businessPhones: []
              mobilePhone: '+49 170 0000000'
              companyName: ''
              jobTitle: ''
          nextLink: ''
      - name: no_contacts
        kind: empty
        description: 'No contact name starts with the search text, so Graph returns an empty list.'
        output:
          contacts: []
          nextLink: ''
      - name: rate_limited
        kind: error
        description: 'Graph rate-limits the listing with HTTP 429 and names a wait of 30 seconds.'
        error:
          message: 'Outlook list_contacts failed: rate limited by Microsoft Graph (retry after 30s) — retry later.'
          status: 429
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        const top = Math.min(Number(input.top) || 25, 100);
        const q = [
          '$top=' + top,
          '$orderby=displayName',
          '$select=id,displayName,givenName,surname,emailAddresses,businessPhones,mobilePhone,companyName,jobTitle',
        ];
        if (input.search) {
          const s = String(input.search).replace(/'/g, "''");
          q.push('$filter=' + encodeURIComponent(`startsWith(displayName,'${s}') or startsWith(givenName,'${s}') or startsWith(surname,'${s}')`));
        }
        if (input.skip) q.push('$skip=' + encodeURIComponent(String(input.skip)));
        const r = await ctx.http.get(`${graphRoot}/contacts?${q.join('&')}`, { headers: h });
        graphCheck('list_contacts', r, { permission: 'Contacts.Read', mailboxRoot: true });
        const j = r.json();
        return { contacts: j.value || [], nextLink: j['@odata.nextLink'] || '' };
    exampleInput: { top: 25, search: 'Ada' }
  - name: get_contact
    title: Get contact
    i18n:
      de:
        title: Kontakt abrufen
      fr:
        title: Récupérer un contact
    description: Fetch a single contact by ID.
    effects: read
    input:
      type: object
      properties:
        contactId:
          type: string
          description: 'The contact ID returned from list_contacts.'
      required: [contactId]
    output: '{ contact: { id: string, displayName: string, givenName: string, surname: string, emailAddresses: Array<{ name: string, address: string }>, businessPhones: Array<string>, mobilePhone: string | null, companyName: string, jobTitle: string } }'
    mock: |
      return {
        contact: {
          id: input.contactId,
          displayName: 'Ada Lovelace',
          givenName: 'Ada',
          surname: 'Lovelace',
          emailAddresses: [{ name: 'Ada Lovelace', address: 'ada@example.com' }],
          businessPhones: ['+49 30 000000'],
          mobilePhone: '',
          companyName: 'Example GmbH',
          jobTitle: 'Engineer',
        },
      };
    scenarios:
      - name: one_contact
        kind: success
        description: 'Graph returns the contact with its addresses, phone numbers and work details.'
        output:
          contact:
            id: AAMkAGI2TGuc
            displayName: Ada Lovelace
            givenName: Ada
            surname: Lovelace
            emailAddresses: [{ name: Ada Lovelace, address: ada@example.com }]
            businessPhones: ['+49 30 000000']
            mobilePhone: '+49 170 0000000'
            companyName: Example GmbH
            jobTitle: Engineer
      - name: sparse_contact
        kind: empty
        description: 'Graph returns a contact that holds only a name, so its addresses, phone numbers and work details are empty.'
        output:
          contact:
            id: AAMkAGI2TGud
            displayName: Grace Hopper
            givenName: Grace
            surname: Hopper
            emailAddresses: []
            businessPhones: []
            mobilePhone: null
            companyName: ''
            jobTitle: ''
      - name: not_found
        kind: error
        description: 'Graph answers HTTP 404 because no contact has this ID, so nothing is fetched.'
        error:
          message: 'Outlook get_contact failed: contact AAMkAGI2TGuc... not found.'
          status: 404
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/json' };
        const r = await ctx.http.get(`${graphRoot}/contacts/${encodeURIComponent(input.contactId)}`, { headers: h });
        graphCheck('get_contact', r, { permission: 'Contacts.Read', notFound: `contact ${input.contactId}` });
        return { contact: r.json() };
    exampleInput: { contactId: 'AAMkAGI2TGuc...' }
