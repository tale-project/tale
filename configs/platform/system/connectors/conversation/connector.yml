# Platform capability — the organization's Inbox as automation actions.
# Native-backed over the conversation ingest helpers (Message-ID idempotency,
# threading, contact find-or-create, address routing) so domain invariants stay
# in one place. `platform` auth — nothing to connect.
name: conversation
displayName: Conversations
i18n:
  de:
    displayName: Konversationen
  fr:
    displayName: Conversations
description: >-
  Pull mailbox traffic into the org Inbox and expose a one-shot sync and a
  multi-credential inbox list for scheduled mail packs.
tags:
  - Platform
  - Email
auth:
  - method: platform
actions:
  - name: sync_mailbox
    title: Sync mailboxes
    i18n:
      de:
        title: Postfächer synchronisieren
      fr:
        title: Synchroniser les boîtes mail
    description: >-
      List new messages from every active credential on the named mail
      connector, fetch each body, and ingest them into conversations (inbound
      and, for IMAP, Sent). Each credential walks from its own watermark, so a
      mailbox added later is not clipped by another mailbox's progress.
    effects: write
    input:
      type: object
      required: [connectorSlug]
      additionalProperties: false
      properties:
        connectorSlug:
          type: string
          description: Mail connector to sync (gmail, outlook, or imap-smtp).
        limit:
          type: number
          description: Max messages to ingest per folder per credential (default 25).
        includeSent:
          type: boolean
          description: Also sync the Sent folder (default true for imap-smtp).
    output: '{ listed: number, inbound: { created: boolean, processedCount: number, skippedCount: number, conversationIds: string[] }, sent?: { created: boolean, processedCount: number, skippedCount: number, conversationIds: string[] } }'
    mock: |
      return {
        listed: 1,
        inbound: {
          created: true,
          processedCount: 1,
          skippedCount: 0,
          conversationIds: ['conv_mock'],
        },
      };
    backend:
      kind: native
      impl: conversation.sync_mailbox
    exampleInput: { connectorSlug: 'imap-smtp', limit: 25 }
  - name: list_mailbox_messages
    title: List mailbox messages
    i18n:
      de:
        title: Nachrichten der Postfächer auflisten
      fr:
        title: Lister les messages des boîtes mail
    description: >-
      List the newest inbox messages from every active credential on the named
      mail connector — what triage digests over. IMAP UIDs are scoped per
      credential so ids stay unique across mailboxes.
    effects: read
    input:
      type: object
      required: [connectorSlug]
      additionalProperties: false
      properties:
        connectorSlug:
          type: string
          description: Mail connector to read (gmail, outlook, or imap-smtp).
        limit:
          type: number
          description: Max newest messages to read per credential (default 25).
    output: '{ messages: Array<Record<string, unknown>> }'
    mock: |
      const limit = typeof input.limit === 'number' ? input.limit : 25;
      if (limit <= 0) return { messages: [] };
      return {
        messages: [
          {
            id: 'mock-1',
            uid: 'mock-1',
            subject: 'Mock message 1',
            from: 'sender1@example.com',
            sentAt: 1000,
            credentialName: 'default',
          },
        ],
      };
    backend:
      kind: native
      impl: conversation.list_mailbox_messages
    exampleInput: { connectorSlug: 'imap-smtp', limit: 25 }
  - name: list_untriaged
    title: List untriaged conversations
    i18n:
      de:
        title: Nicht triagierte Konversationen auflisten
      fr:
        title: Lister les conversations à trier
    description: >-
      List the open Inbox conversations of one mail connector that are waiting
      on the team — the newest message is the customer's — and that no triage
      pass has judged since that message arrived. Newest first. Each row
      carries the customer's newest message as text (at most 4000 characters)
      and the Inbox link to the thread.
    effects: read
    input:
      type: object
      required: [connectorSlug]
      additionalProperties: false
      properties:
        connectorSlug:
          type: string
          description: The mail connector whose conversations to read (gmail, outlook, or imap-smtp).
        limit:
          type: number
          description: Max conversations to hand out in one pass (default 25, at most 100).
    output: '{ conversations: Array<{ conversationId: string, subject: string, contact: { name: string, email: string }, lastInboundAt: string, lastInboundText: string, unreadCount: number, assigned: boolean, url: string }> }'
    mock: |
      const limit = typeof input.limit === 'number' ? input.limit : 25;
      if (limit <= 0) return { conversations: [] };
      return {
        conversations: [
          {
            conversationId: 'mock',
            subject: 'Mock subject',
            contact: { name: 'Mock Sender', email: 'sender@example.com' },
            lastInboundAt: '1970-01-01T00:00:01.000Z',
            lastInboundText: 'Mock inbound message asking for an answer.',
            unreadCount: 1,
            assigned: false,
            url: '/dashboard/org/conversations/open?conversation=mock',
          },
        ],
      };
    backend:
      kind: native
      impl: conversation.list_untriaged
    exampleInput: { connectorSlug: 'gmail', limit: 25 }
  - name: record_triage
    title: Record triage
    i18n:
      de:
        title: Triage festhalten
      fr:
        title: Enregistrer le triage
    description: >-
      Record a triage pass on Inbox conversations: the verdict is stamped on
      each conversation, and its priority is set where no person has set one.
      A stamped conversation is not listed again until the customer writes
      again. Nothing is sent; a drafted reply is a separate draft_reply call.
    effects: write
    input:
      type: object
      required: [verdicts]
      additionalProperties: false
      properties:
        verdicts:
          type: array
          description: One verdict per conversation, at most 100.
          items:
            type: object
            required: [conversationId, action]
            additionalProperties: false
            properties:
              conversationId:
                type: string
              action:
                type: string
                enum: [reply, no_reply]
                description: Whether the team has to reply.
              priority:
                type: string
                enum: [low, medium, high, urgent]
                description: The Inbox priority to set when none is set yet.
              reason:
                type: string
                description: One sentence for the person who opens the thread (at most 500 characters).
    output: '{ recorded: number, prioritized: number, unknown: Array<string> }'
    mock: |
      const verdicts = Array.isArray(input.verdicts) ? input.verdicts : [];
      return { recorded: verdicts.length, prioritized: verdicts.filter((v) => v && v.priority).length, unknown: [] };
    backend:
      kind: native
      impl: conversation.record_triage
    exampleInput:
      {
        verdicts:
          [
            {
              conversationId: 'conv_1',
              action: 'reply',
              priority: 'high',
              reason: 'The customer asks for a delivery date.',
            },
          ],
      }
  - name: ingest_emails
    title: Import received emails
    i18n:
      de:
        title: Empfangene E-Mails importieren
      fr:
        title: Importer les e-mails reçus
    description: Ingest already-fetched inbound emails into conversations.
    effects: write
    input:
      type: object
      required: [emails, connectorSlug]
      additionalProperties: false
      properties:
        emails:
          description: One email or an array (provider-native or EmailType).
        connectorSlug: { type: string, description: Mail connector slug. }
        accountEmail:
          type: string
          description: Mailbox address used to classify direction when missing.
        status:
          type: string
          enum: [open, closed, archived, spam]
    output: '{ created: boolean, processedCount: number, skippedCount: number, conversationIds: string[], reason?: string }'
    mock: |
      return {
        created: true,
        processedCount: 1,
        skippedCount: 0,
        conversationIds: ['conv_mock'],
      };
    backend:
      kind: native
      impl: conversation.ingest_emails
    exampleInput:
      {
        connectorSlug: 'gmail',
        emails:
          [
            {
              messageId: 'msg-1',
              from: [{ address: 'a@b.com' }],
              to: [{ address: 'you@example.com' }],
              subject: 'Hi',
              date: '2026-01-01T00:00:00Z',
            },
          ],
      }
  - name: ingest_sent_emails
    title: Import sent emails
    i18n:
      de:
        title: Gesendete E-Mails importieren
      fr:
        title: Importer les e-mails envoyés
    description: Ingest already-fetched Sent-folder emails into conversations.
    effects: write
    input:
      type: object
      required: [emails, connectorSlug]
      additionalProperties: false
      properties:
        emails:
          description: One email or an array (provider-native or EmailType).
        connectorSlug: { type: string, description: Mail connector slug. }
        accountEmail:
          type: string
          description: Mailbox address used to classify direction when missing.
        status:
          type: string
          enum: [open, closed, archived, spam]
    output: '{ created: boolean, processedCount: number, skippedCount: number, conversationIds: string[], reason?: string }'
    mock: |
      return {
        created: false,
        processedCount: 1,
        skippedCount: 0,
        conversationIds: ['conv_mock'],
      };
    backend:
      kind: native
      impl: conversation.ingest_sent_emails
    exampleInput:
      {
        connectorSlug: 'imap-smtp',
        emails:
          [
            {
              messageId: 'msg-2',
              from: [{ address: 'you@example.com' }],
              to: [{ address: 'a@b.com' }],
              subject: 'Re: Hi',
              date: '2026-01-01T00:00:00Z',
              direction: 'outbound',
            },
          ],
      }
  - name: draft_reply
    title: Draft reply
    i18n:
      de:
        title: Antwortentwurf erstellen
      fr:
        title: Rédiger un brouillon de réponse
    description: >-
      Propose a reply on a conversation and leave it for a person. The draft
      appears in the Inbox as a pending message; sending it is a human act, and
      that send is what delivers it. Nothing reaches the customer from here.
    effects: write
    input:
      type: object
      required: [conversationId, body]
      additionalProperties: false
      properties:
        conversationId:
          type: string
          description: The conversation to draft on.
        body:
          type: string
          description: The proposed reply.
        guidelineVersion:
          type: string
          description: >-
            Which communication guidelines produced it. Analytics cannot
            attribute a later edit to a rule without knowing which were in force.
        confidence:
          type: number
          description: Model confidence in the draft, 0 to 1, when there is one.
    output: '{ approvalId: string, created: boolean }'
    mock: |
      return { approvalId: 'apr_mock_' + String(input.conversationId), created: true };
    backend:
      kind: native
      impl: conversation.draft_reply
    exampleInput:
      {
        conversationId: 'conv_123',
        body: 'Yes, we still have it in stock. Would you like us to hold one?',
      }
  - name: query_sync_cursor
    title: Get last sync time
    i18n:
      de:
        title: Zeitpunkt der letzten Synchronisierung abrufen
      fr:
        title: Récupérer l’heure de la dernière synchronisation
    description: The latest synced message timestamp for a mailbox direction.
    effects: read
    input:
      type: object
      required: [connectorSlug]
      additionalProperties: false
      properties:
        connectorSlug: { type: string, description: Mail connector slug. }
        direction:
          type: string
          enum: [inbound, outbound]
          description: Which cursor to read (default inbound).
    output: '{ since: number | null, messageId: string | null }'
    mock: |
      return { since: null, messageId: null };
    backend:
      kind: native
      impl: conversation.query_sync_cursor
    exampleInput: { connectorSlug: 'gmail', direction: 'inbound' }
