      required: [resourceId]
    output: '{ order: { id: number, name: string, total_price: string, financial_status: string, fulfillment_status: string, line_items: Array<{ id: number, title: string, quantity: number, price: string }> } }'
    mock: |
      return {
        order: {
          id: Number(input.resourceId) || 5001,
          name: '#1001',
          total_price: '49.90',
          financial_status: 'paid',
          fulfillment_status: 'fulfilled',
          line_items: [{ id: 6001, title: 'Demo product', quantity: 1, price: '49.90' }],
