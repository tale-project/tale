# Connector — Shopify Admin REST API. Every merchant serves the API
# from their own store domain, so the endpoint is per-credential: the live bodies
# build their URLs from `ctx.endpoint` (the credential's https://<store>.myshopify.com
# origin) and place the Admin API access token in Shopify's own
# X-Shopify-Access-Token header. List actions return the page's records plus the
# cursor for the next page. Every mock is deterministic — same input, same
# output, no IO.
name: shopify
displayName: Shopify
description: Sync products, customers, and orders from your Shopify store.
tags:
  - Commerce
endpointMode: per-credential
allowedHosts:
  - myshopify.com
auth:
  - method: api-key
actions:
  - name: list_products
    title: List products
    i18n:
      de:
        title: Produkte auflisten
      fr:
        title: Lister les produits
    description: List products in the store, newest first, with cursor pagination.
    effects: read
    input:
      type: object
      properties:
        limit:
          { type: number, description: 'Results per page (1-250, default 50).' }
        page_info:
          {
            type: string,
            description: "Cursor from a previous response's nextPageInfo.",
          }
        since_id:
          {
            type: string,
            description: 'Return only products with an ID greater than this value.',
          }
        created_at_min:
          {
            type: string,
            description: 'Only products created at or after this ISO 8601 timestamp.',
          }
        updated_at_min:
          {
            type: string,
            description: 'Only products updated at or after this ISO 8601 timestamp.',
          }
        status:
          {
            type: string,
            description: 'Filter by product status: active, archived, or draft.',
          }
        fields:
          {
            type: string,
            description: 'Comma-separated list of fields to return.',
          }
    output: '{ products: Array<{ id: number, title: string, handle: string, status: string, created_at: string }>, nextPageInfo: string }'
    mock: |
      return {
        products: [
          { id: 1001, title: 'Demo product', handle: 'demo-product', status: input.status || 'active', created_at: '2025-01-15T09:00:00-05:00' },
          { id: 1002, title: 'Second product', handle: 'second-product', status: input.status || 'active', created_at: '2025-01-14T09:00:00-05:00' },
        ],
        nextPageInfo: '',
      };
    scenarios:
      - name: two_products
        kind: success
        description: 'Shopify returns two products and no further page.'
        output:
          products:
            - { id: 8123456789013, title: 'Stoneware mug', handle: stoneware-mug, status: active, created_at: '2026-03-02T10:15:00-05:00' }
            - { id: 8123456789012, title: 'Linen apron', handle: linen-apron, status: active, created_at: '2026-02-27T16:40:00-05:00' }
          nextPageInfo: ''
      - name: more_pages
        kind: success
        description: 'Shopify returns two products and, in its Link header, the cursor of the next page.'
        output:
          products:
            - { id: 8123456789015, title: 'Wool throw', handle: wool-throw, status: active, created_at: '2026-03-09T11:00:00-05:00' }
            - { id: 8123456789014, title: 'Oak serving board', handle: oak-serving-board, status: active, created_at: '2026-03-06T08:45:00-05:00' }
          nextPageInfo: eyJkaXJlY3Rpb24iOiJuZXh0IiwibGFzdF9pZCI6ODEyMzQ1Njc4OTAxNH0
      - name: no_products
        kind: empty
        description: 'Shopify returns no products and no further page.'
        output:
          products: []
          nextPageInfo: ''
      - name: invalid_token
        kind: error
        description: 'Shopify does not accept the access token and answers HTTP 401.'
        error:
          message: 'Shopify list_products failed: authentication failed — verify the access token (it starts with "shpat_").'
          status: 401
      - name: rate_limited
        kind: error
        description: 'Shopify rate-limits the call with HTTP 429 and a Retry-After header.'
        error:
          message: 'Shopify list_products failed (429): {"errors":"Exceeded 2 calls per second for api client. Reduce request rates to resume uninterrupted service."}'
          status: 429
    backend:
      kind: yaml-js
      live: |
        const h = { 'X-Shopify-Access-Token': ctx.secrets.get('accessToken'), 'Content-Type': 'application/json' };
        const q = ['limit=' + Math.min(Number(input.limit) || 50, 250)];
        for (const k of ['page_info', 'since_id', 'created_at_min', 'updated_at_min', 'status', 'fields']) if (input[k] != null && input[k] !== '') q.push(k + '=' + encodeURIComponent(String(input[k])));
        const r = await ctx.http.get(`${ctx.endpoint}/admin/api/2026-01/products.json?${q.join('&')}`, { headers: h });
        if (r.status === 401) throw Object.assign(new Error('Shopify list_products failed: authentication failed — verify the access token (it starts with "shpat_").'), { status: r.status });
        if (r.status === 403) throw Object.assign(new Error('Shopify list_products failed: access denied — verify the app has the required API scopes.'), { status: r.status });
        if (r.status === 404) throw Object.assign(new Error('Shopify list_products failed: store not found — verify the store domain on this credential.'), { status: r.status });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Shopify list_products failed (${r.status}): ${r.text()}`), { status: r.status });
        const link = (r.headers && (r.headers.link || r.headers.Link)) || '';
        const next = link.split(',').filter((p) => p.indexOf('rel="next"') !== -1)[0] || '';
        const m = next.match(/page_info=([^>&]+)/);
        return { products: r.json().products || [], nextPageInfo: m ? m[1] : '' };
    exampleInput: { limit: 50, status: 'active' }
  - name: get_product
    title: Get product
    i18n:
      de:
        title: Produkt abrufen
      fr:
        title: Récupérer un produit
    description: Get a single product by ID, including its variants and images.
    effects: read
    input:
      type: object
      properties:
        resourceId:
          {
            type: string,
            description: "The product's numeric Shopify ID (e.g. '8123456789012').",
          }
      required: [resourceId]
    output: '{ product: { id: number, title: string, handle: string, status: string, variants: Array<{ id: number, title: string, price: string, sku: string }> } }'
    mock: |
      return {
        product: {
          id: Number(input.resourceId) || 1001,
          title: 'Demo product',
          handle: 'demo-product',
          status: 'active',
          variants: [{ id: 2001, title: 'Default', price: '49.90', sku: 'DEMO-1' }],
        },
      };
    scenarios:
      - name: one_product
        kind: success
        description: 'Shopify returns the product with its two variants.'
        output:
          product:
            id: 8123456789012
            title: 'Linen apron'
            handle: linen-apron
            status: active
            variants:
              - { id: 45123456789012, title: Natural, price: '34.00', sku: APRON-NAT }
              - { id: 45123456789013, title: Charcoal, price: '34.00', sku: APRON-CHA }
      - name: no_sku
        kind: empty
        description: 'Shopify returns a draft product whose only variant, the default one, has no SKU.'
        output:
          product:
            id: 8123456789012
            title: 'Linen apron'
            handle: linen-apron
            status: draft
            variants:
              - { id: 45123456789014, title: 'Default Title', price: '34.00', sku: '' }
      - name: product_not_found
        kind: error
        description: 'Shopify answers HTTP 404: no product has this id.'
        when: { resourceId: '8123456789099' }
        error:
          message: 'Shopify get_product failed: product 8123456789099 not found.'
          status: 404
      - name: invalid_token
        kind: error
        description: 'Shopify does not accept the access token and answers HTTP 401.'
        error:
          message: 'Shopify get_product failed: authentication failed — verify the access token (it starts with "shpat_").'
          status: 401
      - name: rate_limited
        kind: error
        description: 'Shopify rate-limits the call with HTTP 429 and a Retry-After header.'
        error:
          message: 'Shopify get_product failed (429): {"errors":"Exceeded 2 calls per second for api client. Reduce request rates to resume uninterrupted service."}'
          status: 429
    backend:
      kind: yaml-js
      live: |
        const h = { 'X-Shopify-Access-Token': ctx.secrets.get('accessToken'), 'Content-Type': 'application/json' };
        const r = await ctx.http.get(`${ctx.endpoint}/admin/api/2026-01/products/${encodeURIComponent(input.resourceId)}.json`, { headers: h });
        if (r.status === 401) throw Object.assign(new Error('Shopify get_product failed: authentication failed — verify the access token (it starts with "shpat_").'), { status: r.status });
        if (r.status === 403) throw Object.assign(new Error('Shopify get_product failed: access denied — verify the app has the required API scopes.'), { status: r.status });
        if (r.status === 404) throw Object.assign(new Error(`Shopify get_product failed: product ${input.resourceId} not found.`), { status: r.status });
        if (!r.status || r.status >= 400) throw Object.assign(new Error(`Shopify get_product failed (${r.status}): ${r.text()}`), { status: r.status });
        return { product: r.json().product };
    exampleInput: { resourceId: '8123456789012' }
