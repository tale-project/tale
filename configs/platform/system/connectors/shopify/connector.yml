    output: '{ customer: { id: number, email: string, first_name: string, last_name: string, orders_count: number, total_spent: string } }'
    mock: |
      return {
        customer: {
          id: Number(input.resourceId) || 3001,
          email: 'ada@example.com',
          first_name: 'Ada',
          last_name: 'Lovelace',
          orders_count: 3,
          total_spent: '149.70',
