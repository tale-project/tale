    effects: read
    input:
      type: object
      properties: {}
    output: '{ count: number }'
    mock: |
      return { count: 42 };
    backend:
      kind: yaml-js
      live: |
        const h = { 'X-Shopify-Access-Token': ctx.secrets.get('accessToken'), 'Content-Type': 'application/json' };
        const r = await ctx.http.get(`${ctx.endpoint}/admin/api/2026-01/products/count.json`, { headers: h });
        if (r.status === 401) throw new Error('Shopify count_products failed: authentication failed — verify the access token (it starts with "shpat_").');
        if (r.status === 403) throw new Error('Shopify count_products failed: access denied — verify the app has the required API scopes.');
        if (r.status === 404) throw new Error('Shopify count_products failed: store not found — verify the store domain on this credential.');
        if (!r.status || r.status >= 400) throw new Error(`Shopify count_products failed (${r.status}): ${r.text()}`);
        return { count: r.json().count || 0 };
