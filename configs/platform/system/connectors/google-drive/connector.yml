# Connector — Google Drive API v3. An OAuth2 credential (drive.readonly)
# authorizes every action; the platform injects it as the Authorization header, so
# the live bodies below carry only functional headers. list_files returns a flat file
# list under a named key (optionally recursing subfolders, with soft caps and a
# truncated flag); download_file streams one binary file into storage and returns a
# file reference. Every mock is deterministic — same input, same output, no IO.
name: google-drive
displayName: Google Drive
description: Import files from Google Drive into Tale's knowledge base.
tags:
  - Knowledge
allowedHosts:
  - www.googleapis.com
auth:
  - method: oauth2
    authorizeUrl: https://accounts.google.com/o/oauth2/v2/auth
    tokenUrl: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/drive.readonly
actions:
  - name: list_files
    title: List files
    i18n:
      de:
        title: Dateien auflisten
      fr:
        title: Lister les fichiers
    description: List files in a Google Drive folder. Pagination is handled internally — the operation returns the complete file list in one call. When recursive is true, subfolders are traversed breadth-first and each file's relative path is reported as subfolderPath.
    effects: read
    input:
      type: object
      properties:
        folderId:
          type: string
          description: 'Drive folder ID. The folder ID is the last path segment of the Drive URL (e.g. https://drive.google.com/drive/folders/<folderId>).'
        mimeTypes:
          type: array
          description: 'Mime types to include (e.g. ["application/pdf"]). Empty or omitted returns all non-folder files.'
        recursive:
          type: boolean
          description: "When true, traverse all subfolders breadth-first and return a flat list with each file's subfolderPath. Capped at 5000 files / 20 levels deep — beyond that the result is soft-truncated and truncated is set to true. Default false."
      required: [folderId]
    output: '{ files: Array<{ id: string, name: string, size: number, mimeType: string, modifiedTime: string, md5Checksum?: string, subfolderPath: string }>, truncated: boolean }'
    mock: |
      return { files: [{ id: 'file-1', name: 'document.pdf', size: 1024, mimeType: 'application/pdf', modifiedTime: '2024-01-01T00:00:00.000Z', md5Checksum: 'd41d8cd98f00b204e9800998ecf8427e', subfolderPath: '' }], truncated: false };
    scenarios:
      - name: two_files
        kind: success
        description: 'Drive lists the two files of the folder, which holds no subfolder, on a single page; neither is in a subfolder.'
        output:
          files:
            - { id: file-budget, name: budget-2026.csv, size: 1280, mimeType: text/csv, modifiedTime: '2026-10-14T09:30:00.000Z', md5Checksum: 5d41402abc4b2a76b9719d911017c592, subfolderPath: '' }
            - { id: file-minutes, name: board-minutes.pdf, size: 46, mimeType: application/pdf, modifiedTime: '2026-10-15T08:00:00.000Z', md5Checksum: 0cc175b9c0f1b6a831c399e269772661, subfolderPath: '' }
          truncated: false
      - name: nested_folders
        kind: success
        description: 'Drive lists the folder recursively: a file at its top, and one in a subfolder, which the list gives the path of. The subfolder has no size or checksum of its own, and is not listed.'
        when: { recursive: true }
        output:
          files:
            - { id: file-budget, name: budget-2026.csv, size: 1280, mimeType: text/csv, modifiedTime: '2026-10-14T09:30:00.000Z', md5Checksum: 5d41402abc4b2a76b9719d911017c592, subfolderPath: '' }
            - { id: file-q3, name: q3-summary.csv, size: 512, mimeType: text/csv, modifiedTime: '2026-10-03T10:00:00.000Z', md5Checksum: 9bb58f26192e4ba00f01e2e7b136bbd8, subfolderPath: 'Reports 2026' }
          truncated: false
      - name: no_files
        kind: empty
        description: 'Drive finds no file in the folder, and its answer carries no file at all, so the list is empty and nothing is truncated.'
        output:
          files: []
          truncated: false
      - name: token_expired
        kind: error
        description: 'Drive rejects the access token with HTTP 401, as when it has expired.'
        error:
          message: |
            Google Drive list_files failed (401): {
              "error": {
                "code": 401,
                "message": "Request had invalid authentication credentials. Expected OAuth 2 access token, login cookie or other valid authentication credential. See https://developers.google.com/identity/sign-in/web/devconsole-project.",
                "errors": [
                  {
                    "message": "Invalid Credentials",
                    "domain": "global",
                    "reason": "authError",
                    "location": "Authorization",
                    "locationType": "header"
                  }
                ],
                "status": "UNAUTHENTICATED"
              }
            }
          status: 401
      - name: rate_limited
        kind: error
        description: 'Drive rate-limits the user with HTTP 429, as when too many requests came in a short time.'
        error:
          message: |
            Google Drive list_files failed (429): {
              "error": {
                "code": 429,
                "message": "Rate Limit Exceeded",
                "errors": [
                  {
                    "message": "Rate Limit Exceeded",
                    "domain": "usageLimits",
                    "reason": "rateLimitExceeded"
                  }
                ],
                "status": "RESOURCE_EXHAUSTED"
              }
            }
          status: 429
      - name: folder_not_found
        kind: error
        description: 'Drive answers HTTP 404 for a folder ID that names no folder, as for a folder that was deleted or never shared with the account.'
        when: { folderId: folder-missing }
        error:
          message: |
            Google Drive list_files failed (404): {
              "error": {
                "code": 404,
                "message": "File not found: folder-missing.",
                "errors": [
                  {
                    "message": "File not found: folder-missing.",
                    "domain": "global",
                    "reason": "notFound"
                  }
                ],
                "status": "NOT_FOUND"
              }
            }
          status: 404
    backend:
      kind: yaml-js
      live: |
        const API = 'https://www.googleapis.com/drive/v3';
        const FOLDER_MIME = 'application/vnd.google-apps.folder';
        const FILE_CAP = 5000, DEPTH_CAP = 20;
        const esc = (v) => v.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const buildQuery = (folderId, mimeTypes, includeFolders) => {
          const parts = ["'" + esc(folderId) + "' in parents", 'trashed = false'];
          if (!includeFolders) parts.push("mimeType != '" + FOLDER_MIME + "'");
          if (mimeTypes && mimeTypes.length > 0 && !includeFolders) {
            const ors = mimeTypes.map((m) => "mimeType = '" + esc(m) + "'");
            parts.push('(' + ors.join(' or ') + ')');
          }
          return parts.join(' and ');
        };
        const listPage = async (folderId, mimeTypes, includeFolders) => {
          const q = buildQuery(folderId, mimeTypes, includeFolders);
          const fields = 'nextPageToken, files(id, name, size, mimeType, modifiedTime, md5Checksum)';
          const out = [];
          let pageToken;
          while (true) {
            const qp = ['q=' + encodeURIComponent(q), 'fields=' + encodeURIComponent(fields), 'pageSize=200'];
            if (pageToken) qp.push('pageToken=' + encodeURIComponent(pageToken));
            const r = await ctx.http.get(`${API}/files?${qp.join('&')}`, { headers: { Accept: 'application/json' } });
            if (!r.status || r.status >= 400) throw Object.assign(new Error(`Google Drive list_files failed (${r.status}): ${r.text()}`), { status: r.status });
            const data = r.json();
            for (const f of (data.files || [])) out.push(f);
            if (!data.nextPageToken) break;
            pageToken = data.nextPageToken;
          }
          return out;
        };
        const sanitize = (name) => {
          let cleaned = String(name || '').replace(/[\x00-\x1F\x7F]/g, '').replace(/[/\\?*<>:"|]/g, '_').trim().slice(0, 255);
          if (cleaned === '.' || cleaned === '..') cleaned = '_';
          return cleaned.length > 0 ? cleaned : '_';
        };
        const toOut = (raw, subfolderPath) => ({ id: raw.id, name: raw.name, size: raw.size ? parseInt(raw.size, 10) : 0, mimeType: raw.mimeType, modifiedTime: raw.modifiedTime, md5Checksum: raw.md5Checksum, subfolderPath });
        const matches = (raw, mimeTypes) => { if (!mimeTypes || mimeTypes.length === 0) return true; if (!raw.mimeType) return false; return mimeTypes.indexOf(raw.mimeType) !== -1; };
        const mimeTypes = Array.isArray(input.mimeTypes) ? input.mimeTypes : undefined;
        const recursive = input.recursive === true;
        const files = [];
        let truncated = false;
        if (!recursive) {
          const raw = await listPage(input.folderId, mimeTypes, false);
          for (const f of raw) {
            if (files.length >= FILE_CAP) { truncated = true; break; }
            files.push(toOut(f, ''));
          }
        } else {
          const visited = {};
          visited[input.folderId] = true;
          const queue = [{ folderId: input.folderId, subfolderPath: '', depth: 0 }];
          outer: while (queue.length > 0) {
            const head = queue.shift();
            const raw = await listPage(head.folderId, undefined, true);
            for (const rf of raw) {
              if (rf.mimeType === FOLDER_MIME) {
                if (visited[rf.id]) continue;
                if (head.depth + 1 > DEPTH_CAP) { truncated = true; continue; }
                visited[rf.id] = true;
                const seg = sanitize(rf.name);
                const childPath = head.subfolderPath ? head.subfolderPath + '/' + seg : seg;
                queue.push({ folderId: rf.id, subfolderPath: childPath, depth: head.depth + 1 });
              } else {
                if (!matches(rf, mimeTypes)) continue;
                if (files.length >= FILE_CAP) { truncated = true; break outer; }
                files.push(toOut(rf, head.subfolderPath));
              }
            }
          }
        }
        return { files, truncated };
    exampleInput: { folderId: '1AbCdEfGhIjKlMnOpQrStUvWxYz', recursive: false }
  - name: download_file
    title: Download file
    i18n:
      de:
        title: Datei herunterladen
      fr:
        title: Télécharger un fichier
    description: Download a single binary file by Drive fileId and store it in file storage. Native Google Workspace formats (Docs/Sheets/Slides) are not supported by this operation.
    effects: read
    input:
      type: object
      properties:
        fileId:
          type: string
          description: 'Drive file ID returned by list_files.'
        fileName:
          type: string
          description: 'Filename to use when storing the downloaded file.'
        contentType:
          type: string
          description: 'Mime type to record alongside the stored file.'
      required: [fileId, fileName]
    output: '{ fileId: string, fileName: string, contentType: string, size: number, url?: string }'
    mock: |
      return { fileId: 'file-' + input.fileId, fileName: input.fileName, contentType: input.contentType || 'application/octet-stream', size: 1024, url: 'https://files.example.com/file-' + input.fileId };
    scenarios:
      - name: stored
        kind: success
        description: 'Drive answers with the PDF bytes, which the file store keeps under a new file id, with the name the flow gave and the type Drive sent. The file store gives no link, so the output carries no url.'
        output:
          fileId: 's3:example-org/00000000-0000-0000-0000-000000000001'
          fileName: report.pdf
          contentType: application/pdf
          size: 46
      - name: no_link
        kind: empty
        description: 'The record with its optional member empty: the same stored file, with no url, which every download answers, as the file store never gives a link. A zero-byte file has no such record: the store refuses an empty blob, so it fails as an error and is not shipped here.'
        output:
          fileId: 's3:example-org/00000000-0000-0000-0000-000000000001'
          fileName: report.pdf
          contentType: application/pdf
          size: 46
      - name: file_not_found
        kind: error
        description: 'Drive answers HTTP 404 for a file ID that names no file, so the download fails as the live host raises a failed download, with the vendor status.'
        when: { fileId: file-missing, fileName: missing.pdf }
        error:
          message: 'download of missing.pdf failed (404) from www.googleapis.com'
          status: 404
      - name: native_format
        kind: error
        description: 'Drive refuses a Google Docs file with HTTP 403: a native format has no bytes to download, and only an export of it has. The live host raises the failed download with that status.'
        when: { fileId: doc-meeting-notes, fileName: meeting-notes }
        error:
          message: 'download of meeting-notes failed (403) from www.googleapis.com'
          status: 403
      - name: rate_limited
        kind: error
        description: 'Drive rate-limits the download with HTTP 429, so the live host raises the failed download with that status.'
        when: { fileId: file-busy, fileName: busy.pdf }
        error:
          message: 'download of busy.pdf failed (429) from www.googleapis.com'
          status: 429
    backend:
      kind: yaml-js
      live: |
        if (!ctx.files) throw new Error('Google Drive download_file failed: file storage (ctx.files) is required.');
        const url = `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(input.fileId)}?alt=media`;
        const stored = await ctx.files.download(url, { fileName: input.fileName });
        return { fileId: stored.id, fileName: stored.fileName, contentType: stored.contentType || input.contentType || 'application/octet-stream', size: stored.size, url: stored.url };
    exampleInput:
      { fileId: '1AbCdEfGhIjKlMnOpQrStUvWxYz', fileName: 'report.pdf' }
