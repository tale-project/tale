# Connector — Tavily web search and page extraction. The API key
# travels in the request body (Tavily's contract), not a header, so the live
# bodies read it from `ctx.secrets`; the mocks are deterministic and never
# touch the network.
name: tavily
displayName: Tavily
description: Real-time web search and page extraction for AI research.
tags:
  - Search
allowedHosts:
  - api.tavily.com
auth:
  - method: api-key
actions:
  - name: search
    description: >-
      Search the open web via Tavily. Returns top results with title, URL,
      content snippet, and score. Use 'basic' depth for quick facts,
      'advanced' for deeper research.
    effects: read
    input:
      type: object
      required: [query]
      properties:
        query:
          {
            type: string,
            description: 'Natural-language search query. Be specific.',
          }
        search_depth:
          type: string
          enum: [basic, advanced]
          description: "'basic' (cheap, broad) or 'advanced' (deeper). Default 'basic'."
        max_results:
          {
            type: number,
            description: 'Max results (1-10, capped at 5). Default 5.',
          }
        include_domains:
          {
            type: array,
            description: "Restrict to these domains (e.g. ['arxiv.org']).",
          }
        exclude_domains: { type: array, description: 'Exclude these domains.' }
        include_answer:
          { type: boolean, description: 'Also synthesise a direct answer.' }
        topic:
          type: string
          enum: [general, news]
          description: "'general' or 'news'. Use 'news' with 'days' for recency."
        days:
          {
            type: number,
            description: "For topic='news', max age of results in days.",
          }
    output: '{ answer?: string, results: Array<{ title: string, url: string, content: string, score: number }> }'
    mock: |
      return {
        results: [
          { title: `Result for ${input.query}`, url: 'https://example.com/a', content: 'A relevant snippet.', score: 0.9 },
          { title: 'Secondary source', url: 'https://example.com/b', content: 'Another snippet.', score: 0.7 },
        ],
        ...(input.include_answer ? { answer: `A synthesized answer about ${input.query}.` } : {}),
      };
    backend:
      kind: yaml-js
      live: |
        const body = { api_key: ctx.secrets.get('apiKey'), query: input.query };
        for (const k of ['search_depth', 'max_results', 'include_domains', 'exclude_domains', 'include_answer', 'topic', 'days']) {
          if (input[k] != null) body[k] = input[k];
        }
        const r = await ctx.http.post('https://api.tavily.com/search', {
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.status || r.status >= 400) throw new Error(`Tavily search failed (${r.status}): ${r.text()}`);
        const data = r.json();
        const out = { results: (data.results || []).slice(0, 5) };
        if (data.answer != null) out.answer = data.answer;
        return out;
    exampleInput:
      {
        query: 'latest advances in retrieval-augmented generation',
        search_depth: 'advanced',
      }
  - name: extract
    description: >-
      Fetch cleaned main-article text for one or more URLs. Use for deep reads
      of the most promising search results.
    effects: read
    input:
      type: object
      required: [urls]
      properties:
        urls:
          { type: array, description: 'URLs to extract (1-5, capped at 5).' }
        extract_depth:
          {
            type: string,
            enum: [basic, advanced],
            description: "'basic' or 'advanced'.",
          }
    output: '{ results: Array<{ url: string, raw_content: string }>, failed: string[] }'
    mock: |
      const urls = (input.urls || []).slice(0, 5);
      return {
        results: urls.map((u) => ({ url: u, raw_content: `Extracted article text for ${u}.` })),
        failed: [],
      };
    backend:
      kind: yaml-js
      live: |
        const body = { api_key: ctx.secrets.get('apiKey'), urls: (input.urls || []).slice(0, 5) };
        if (input.extract_depth != null) body.extract_depth = input.extract_depth;
        const r = await ctx.http.post('https://api.tavily.com/extract', {
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.status || r.status >= 400) throw new Error(`Tavily extract failed (${r.status}): ${r.text()}`);
        const data = r.json();
        return { results: data.results || [], failed: data.failed_results || [] };
    exampleInput: { urls: ['https://example.com/article'] }
