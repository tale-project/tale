# Connector — a private IMAP + SMTP mailbox, connected to
# Conversations without a Gmail/Outlook account. Both actions run through the
# platform's native mail module (IMAP fetch + SMTP send are not HTTP, so there
# is no yaml-js body); the mocks are deterministic. Basic auth carries the
# mailbox login (+ optional separate SMTP relay username/password) and the
# server/port config the native module reads.
name: imap-smtp
displayName: IMAP / SMTP Mailbox
description: >-
  Connect a private IMAP + SMTP mail server to Conversations — no Gmail or
  Outlook account required. Optional separate SMTP login for a relay
  (Resend, SendGrid, Amazon SES, …).
tags:
  - Email
configFields:
  - key: imapHost
    label: IMAP server
    type: string
    required: true
    description: Hostname of the IMAP server, e.g. imap.example.com.
  - key: imapPort
    label: IMAP port
    type: number
    default: 993
    description: IMAP port (993 for implicit TLS).
  - key: smtpHost
    label: SMTP server
    type: string
    required: true
    description: Hostname of the SMTP server, e.g. smtp.example.com.
  - key: smtpPort
    label: SMTP port
    type: number
    default: 465
    description: SMTP port (465 for implicit TLS, 587 for STARTTLS).
  - key: security
    label: Connection security
    type: string
    enum: [tls, starttls]
    default: tls
    description: >-
      Fallback when a port is not standard. Ports 465 and 993 always use
      implicit TLS; ports 587 and 143 always use STARTTLS.
  - key: sentMailbox
    label: Sent folder
    type: string
    default: Sent
    description: IMAP folder name used when reading sent mail.
  # Mirrored from the basic-auth username on create/update (and healed on
  # mailbox sync). Not shown in Settings — From and login are the same value.
  - key: fromAddress
    label: From address
    type: string
    description: >-
      Mailbox address used as Conversations From / inbox source. Set
      automatically from the login username.
auth:
  - method: basic
actions:
  - name: list_messages
    description: >-
      Fetch messages from an IMAP mailbox as standard email objects (from, to,
      subject, body, attachments). Omit mailbox for INBOX; pass `sent` to read
      the configured Sent folder. Used by the scheduled sync to import mail
      into conversations.
    effects: read
    input:
      type: object
      properties:
        since:
          {
            type: number,
            description: 'Only messages on/after this epoch-ms timestamp (the sync cursor).',
          }
        limit:
          {
            type: number,
            description: 'Max messages to return in one pass (default 25).',
          }
        mailbox:
          {
            type: string,
            description: 'IMAP folder to read. Omit for INBOX; pass `sent` for the Sent folder.',
          }
    output: '{ messages: Array<{ uid: string, from: string, subject: string, sentAt: number }> }'
    mock: |
      const limit = typeof input.limit === 'number' ? input.limit : 25;
      const count = Math.min(2, limit);
      return {
        messages: Array.from({ length: count }, (_, i) => ({
          uid: `mock-${i + 1}`,
          from: `sender${i + 1}@example.com`,
          subject: `Mock message ${i + 1}`,
          sentAt: (input.since || 0) + (i + 1) * 1000,
        })),
      };
    backend:
      kind: native
      impl: imap-smtp.list_messages
    exampleInput: { mailbox: 'INBOX', limit: 25 }
  - name: get_message
    description: >-
      Fetch one message by IMAP UID with plain/HTML body, file attachments
      (metadata plus base64 content when under 5 MiB), and threading headers
      (Message-ID, In-Reply-To, References). Omit mailbox for INBOX.
    effects: read
    input:
      type: object
      required: [uid]
      properties:
        uid: { type: string, description: 'IMAP UID from list_messages.' }
        mailbox:
          {
            type: string,
            description: 'IMAP folder to read. Omit for INBOX; pass `sent` for the Sent folder.',
          }
    output: >-
      { uid: string, email: { uid: number, messageId: string, from: Array<{ name?: string, address: string }>, to: Array<{ name?: string, address: string }>, cc: Array<{ name?: string, address: string }>, subject: string, date: string, text?: string, html?: string, flags: string[], headers: Record<string, string>, attachments?: Array<{ id: string, filename: string, contentType: string, size: number, contentId?: string, contentBase64?: string }> } }
    mock: |
      return {
        uid: String(input.uid),
        email: {
          uid: Number(input.uid) || 0,
          messageId: '<mock-' + input.uid + '@example.com>',
          from: [{ address: 'sender@example.com' }],
          to: [{ address: 'you@example.com' }],
          cc: [],
          subject: 'Mock message ' + input.uid,
          date: '1970-01-01T00:00:00.000Z',
          text: 'Mock plain body for UID ' + input.uid,
          flags: [],
          headers: {
            'message-id': '<mock-' + input.uid + '@example.com>',
            'in-reply-to': '<parent@example.com>',
            references: '<parent@example.com>',
          },
        },
      };
    backend:
      kind: native
      impl: imap-smtp.get_message
    exampleInput: { uid: '42', mailbox: 'INBOX' }
  - name: send
    description: Send an email through the configured SMTP server.
    effects: write
    input:
      type: object
      required: [to, subject]
      properties:
        to: { type: string, description: 'Recipient email address.' }
        cc:
          {
            type: string,
            description: 'Carbon-copy recipients as one address-list line (a@x, b@y).',
          }
        from:
          {
            type: string,
            description: 'Address to send as. Honoured only when it is the mailbox address or a same-domain alias on a verified (non-public) domain; otherwise the configured From applies.',
          }
        subject: { type: string, description: 'Message subject.' }
        text: { type: string, description: 'Plain-text body.' }
        html: { type: string, description: 'HTML body (optional).' }
        inReplyTo:
          {
            type: string,
            description: 'Message-ID this replies to (threading).',
          }
        references:
          type: array
          items: { type: string }
          description: 'Thread Message-ID chain (root … parent) for the References header.'
        attachments:
          type: array
          description: 'Files to attach; each streamed from its presigned URL.'
          items:
            type: object
            required: [name, url]
            properties:
              name: { type: string }
              contentType: { type: string }
              size: { type: number }
              url: { type: string }
        notificationSender:
          {
            type: boolean,
            description: 'When true, send From notification@ on the mailbox domain so system mail is distinct from conversation replies.',
          }
    output: '{ messageId: string }'
    mock: |
      return { messageId: `mock-smtp-${input.to}-${input.subject.length}` };
    backend:
      kind: native
      impl: imap-smtp.send
    exampleInput:
      { to: 'user@example.com', subject: 'Hello', text: 'Hi there.' }
