name: Tell the reviewer
description: Tells a member when a task of a project moves to In review, with a link to it.
icon: bell-ring
category: notifications
scope: project
requires:
  connectors:
    - task
    - notify
triggers:
  - kind: event
    event: task.status_changed
i18n:
  de:
    name: Reviewer benachrichtigen
    description: Benachrichtigt ein Mitglied, wenn eine Aufgabe eines Projekts in den Status „In Prüfung“ wechselt, mit einem Link dorthin.
  fr:
    name: Prévenir le relecteur
    description: >-
      Prévient un membre quand une tâche d’un projet passe à « En revue », avec un lien vers elle.
template:
  details: >-
    When a task of the project you pick moves to In review, the member you choose gets a
    message in Tale with the task's title and a link to it — in the bell, and by email when
    their notification settings send one. Other status changes send nothing.
  i18n:
    de:
      details: >-
        Wechselt eine Aufgabe des gewählten Projekts in den Status „In Prüfung“, bekommt das
        gewählte Mitglied in Tale eine Nachricht mit dem Titel der Aufgabe und einem Link dorthin —
        in der Glocke und per E-Mail, wenn seine Benachrichtigungseinstellungen eine senden. Andere
        Statuswechsel senden nichts.
    fr:
      details: >-
        Quand une tâche du projet choisi passe à « En revue », le membre choisi reçoit un message dans Tale avec le titre de la tâche et un lien vers elle — dans la cloche, et par e-mail si ses réglages de notification en envoient un. Les autres changements de statut n’envoient rien.
  steps:
    - title: Watches the project's status changes
      detail: Every status change of a task in the project you pick.
      i18n:
        de:
          title: Beobachtet die Statuswechsel im Projekt
          detail: Jeden Statuswechsel einer Aufgabe im gewählten Projekt.
        fr:
          title: Suit les changements de statut du projet
          detail: Chaque changement de statut d’une tâche du projet choisi.
    - title: Picks the moves to In review
      detail: Every other status change sends nothing.
      i18n:
        de:
          title: Reagiert auf den Wechsel zu „In Prüfung“
          detail: Andere Statuswechsel senden nichts.
        fr:
          title: Retient les passages à « En revue »
          detail: Les autres changements de statut n’envoient rien.
    - title: Tells the reviewer
      detail: A message in Tale with the task's title and a link to it, by email too when their settings send one.
      i18n:
        de:
          title: Benachrichtigt den Reviewer
          detail: Eine Nachricht in Tale mit dem Titel der Aufgabe und einem Link dorthin, auch per E-Mail, wenn seine Einstellungen eine senden.
        fr:
          title: Prévient le relecteur
          detail: Un message dans Tale avec le titre de la tâche et un lien vers elle, aussi par e-mail si ses réglages en envoient un.
  outcomes:
    - kind: sends
      text: A message to the reviewer for each task ready for review.
      i18n:
        de:
          text: Eine Nachricht an den Reviewer für jede Aufgabe, die zur Prüfung bereit ist.
        fr:
          text: Un message au relecteur pour chaque tâche prête à relire.
    - kind: never
      text: Never changes the task.
      i18n:
        de:
          text: Ändert die Aufgabe nie.
        fr:
          text: Ne modifie jamais la tâche.
  fields:
    - id: project
      kind: project
      label: Project
      description: The project whose tasks are watched.
      i18n:
        de:
          label: Projekt
          description: Das Projekt, dessen Aufgaben beobachtet werden.
        fr:
          label: Projet
          description: Le projet dont les tâches sont suivies.
    - id: reviewer
      kind: member
      label: Reviewer
      description: Who is told when a task is ready for review.
      writes:
        - node: notify
          pointer: /input/to
      i18n:
        de:
          label: Reviewer
          description: Wer benachrichtigt wird, wenn eine Aufgabe zur Prüfung bereit ist.
        fr:
          label: Relecteur
          description: Qui est prévenu quand une tâche est prête à relire.
    - id: message
      kind: text
      label: Message
      description: The words under the task's title in the message.
      default: This task is ready for your review.
      maxLength: 500
      writes:
        - node: notify
          pointer: /input/message
      i18n:
        de:
          label: Nachricht
          description: Der Text unter dem Titel der Aufgabe in der Nachricht.
          default: Diese Aufgabe ist bereit für deine Prüfung.
        fr:
          label: Message
          description: Le texte sous le titre de la tâche dans le message.
          default: Cette tâche est prête pour ta relecture.
