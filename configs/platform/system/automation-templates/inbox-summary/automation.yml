name: Summarize the inbox
description: Sends a member a summary of the inbox conversations still waiting for an answer, on a schedule.
icon: inbox
category: inbox
requires:
  connectors:
    - conversation
    - notify
triggers:
  - kind: schedule
    repeat:
      frequency: weekly
      interval: 1
      weekdays:
        - 1
        - 2
        - 3
        - 4
        - 5
      times:
        - '08:00'
    timezone: UTC
i18n:
  de:
    name: Posteingang zusammenfassen
    description: Schickt einem Mitglied nach Zeitplan eine Zusammenfassung der Konversationen im Posteingang, die noch auf eine Antwort warten.
  fr:
    name: Résumer la boîte de réception
    description: >-
      Envoie à un membre, selon un horaire, un résumé des conversations de la boîte de réception qui attendent encore une réponse.
template:
  details: >-
    On the schedule you set, the automation reads the inbox conversations of the mailbox you
    pick that still wait for an answer, and a language model summarizes them in one line each,
    most urgent first. The member you choose gets the summary as a message in Tale, with a link
    to the inbox. An empty inbox sends nothing.
  i18n:
    de:
      details: >-
        Nach dem gewählten Zeitplan liest die Automatisierung die Konversationen des gewählten
        Postfachs, die noch auf eine Antwort warten, und ein Sprachmodell fasst sie in je einer
        Zeile zusammen, die dringendste zuerst. Das gewählte Mitglied bekommt die Zusammenfassung
        als Nachricht in Tale, mit einem Link zum Posteingang. Ein leerer Posteingang sendet
        nichts.
    fr:
      details: >-
        Selon l’horaire choisi, l’automatisation lit les conversations de la boîte choisie qui attendent encore une réponse, et un modèle de langage les résume en une ligne chacune, la plus urgente d’abord. Le membre choisi reçoit le résumé comme message dans Tale, avec un lien vers la boîte de réception. Une boîte vide n’envoie rien.
  steps:
    - title: Reads the conversations waiting for an answer
      detail: Up to 25 conversations of the mailbox you pick.
      i18n:
        de:
          title: Liest die Konversationen, die auf eine Antwort warten
          detail: Bis zu 25 Konversationen des gewählten Postfachs.
        fr:
          title: Lit les conversations qui attendent une réponse
          detail: Jusqu’à 25 conversations de la boîte mail choisie.
    - title: Summarizes each one in a line
      detail: A language model writes one line per conversation, most urgent first.
      i18n:
        de:
          title: Fasst jede in einer Zeile zusammen
          detail: Ein Sprachmodell schreibt je Konversation eine Zeile, die dringendste zuerst.
        fr:
          title: Résume chacune en une ligne
          detail: Un modèle de langage écrit une ligne par conversation, la plus urgente d’abord.
    - title: Sends the summary to a member
      detail: As a message in Tale with a link to the inbox; an empty inbox sends nothing.
      i18n:
        de:
          title: Schickt die Zusammenfassung an ein Mitglied
          detail: Als Nachricht in Tale mit einem Link zum Posteingang; ein leerer Posteingang sendet nichts.
        fr:
          title: Envoie le résumé à un membre
          detail: Sous forme de message dans Tale avec un lien vers la boîte de réception ; une boîte vide n’envoie rien.
  outcomes:
    - kind: sends
      text: A summary message to the member you choose.
      i18n:
        de:
          text: Eine Zusammenfassung als Nachricht an das gewählte Mitglied.
        fr:
          text: Un message de résumé au membre choisi.
    - kind: never
      text: Never replies to or changes a conversation.
      i18n:
        de:
          text: Antwortet nie auf eine Konversation und ändert keine.
        fr:
          text: Ne répond jamais à une conversation et n’en modifie aucune.
  worksWith:
    - gmail/sync-emails
    - outlook/sync-emails
    - imap-smtp/sync-emails
  fields:
    - id: mailbox
      kind: choice
      label: Mailbox
      description: The connected mailbox whose conversations are summarized.
      options:
        - value: gmail
          label: Gmail
        - value: outlook
          label: Outlook
        - value: imap-smtp
          label: IMAP/SMTP
      writes:
        - node: inbox
          pointer: /input/connectorSlug
      i18n:
        de:
          label: Postfach
          description: Das verbundene Postfach, dessen Konversationen zusammengefasst werden.
        fr:
          label: Boîte mail
          description: La boîte mail connectée dont les conversations sont résumées.
    - id: recipient
      kind: member
      label: Send to
      description: Who gets the summary.
      writes:
        - node: notify
          pointer: /input/to
      i18n:
        de:
          label: Senden an
          description: Wer die Zusammenfassung bekommt.
        fr:
          label: Envoyer à
          description: Qui reçoit le résumé.
    - id: schedule
      kind: schedule
      label: When
      description: When the summary is sent.
      i18n:
        de:
          label: Wann
          description: Wann die Zusammenfassung gesendet wird.
        fr:
          label: Quand
          description: Quand le résumé est envoyé.
    - id: title
      kind: text
      label: Message title
      description: The title of the message the summary arrives in.
      default: Inbox summary
      maxLength: 200
      writes:
        - node: notify
          pointer: /input/title
      i18n:
        de:
          label: Titel der Nachricht
          description: Der Titel der Nachricht, in der die Zusammenfassung ankommt.
          default: Zusammenfassung des Posteingangs
        fr:
          label: Titre du message
          description: Le titre du message qui apporte le résumé.
          default: Résumé de la boîte de réception
