# Every morning, the tasks created in the project during the 24 hours
# before the run are sent to a member as one message, a line each, with a
# link to the project's tasks. A day without new tasks sends nothing. It
# only reads the project.
version: 1
name: task-digest
description: Send a member the tasks created in a project during the last day.
inputs:
  type: object
  properties:
    # Every trigger-started run arrives inside the trigger wrapper
    # (docs/en/platform/automations/triggers.md).
    trigger:
      type: string
      description: Which trigger started the run; a schedule sends "schedule".
    firedAt:
      type: number
      description: Epoch-ms occurrence the schedule fired for.
nodes:
  - id: window
    type: transform
    input:
      firedAt: '{{ input.firedAt }}'
      projectId: the-project
    code: |
      // A scheduled run looks back from the moment it was due; a run
      // started by hand, from now.
      const now = typeof input.firedAt === 'number' ? input.firedAt : Date.now();
      return {
        since: now - 24 * 60 * 60 * 1000,
        link: `/projects/${input.projectId}/tasks`,
      };

  - id: tasks
    type: task.list
    input:
      projectId: the-project
      createdSince: '{{ nodes.window.output.since }}'
      limit: 50

  - id: digest
    type: transform
    input:
      tasks: '{{ nodes.tasks.output.tasks }}'
      more: '{{ nodes.tasks.output.hasMore }}'
    code: |
      const tasks = Array.isArray(input.tasks) ? input.tasks : [];
      const lines = tasks.map((task) => {
        const number = typeof task.number === 'number' ? `#${task.number} · ` : '';
        const who = task.assignee && task.assignee.name ? ` · ${task.assignee.name}` : '';
        return `${number}${task.title}${who}`;
      });
      if (input.more === true) lines.push('…');
      return { count: tasks.length, message: lines.join('\n') };

  - id: notify
    type: notify.member
    when: '{{ nodes.digest.output.count > 0 }}'
    input:
      to:
        - run-starter
      title: New tasks
      message: '{{ nodes.digest.output.message }}'
      link: '{{ nodes.window.output.link }}'
output:
  count: '{{ nodes.digest.output.count }}'
tests:
  - name: the day's new tasks reach the member in one message
    input:
      trigger: schedule
      firedAt: 1791000000000
    expect:
      output:
        count: 1
      # The recipient, the title and the project are the creator's answers.
      effects:
        - connector: notify.member
          node: notify
          inputIncludes:
            message: '#7 · Draft the launch announcement · Mock Member'
  - name: a run started by hand looks back from now
    input: {}
    expect:
      output:
        count: 1
  - name: a day without new tasks sends nothing
    input:
      trigger: schedule
      firedAt: 1791000000000
    mocks:
      tasks:
        tasks: []
        hasMore: false
    expect:
      output:
        count: 0
      effects:
        - connector: notify.member
          node: notify
          absent: true
