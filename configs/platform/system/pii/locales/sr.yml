    - ул.
    - булевар
    - трг
  poBoxKeywords:
    - Поштански фах
    - PO Box
  floorKeywords:
    - спрат
    - стан
  countryNames:
    - Србија
    - Serbia
    - RS
  countryPostcodePrefixes: []
