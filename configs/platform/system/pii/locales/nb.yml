# PII locale dataset — detection vocabulary for the locale-aware built-in
# patterns (phone/CVC context keywords, address forms, national-ID specs,
# date-of-birth vocabulary). Converted from the reference engine's typed
# dataset; values are frozen — extend deliberately, never trim.
locale: nb
name: Norwegian Bokmål
scripts:
  - latn
countries:
  - NO
phoneContextKeywords:
  - telefon
  - mobiltelefon
  - mobil
  - nummer
  - tlf.
  - tlf
  - tel.
  - tel
cvcContextKeywords:
  - sikkerhetskode
  - cvc
  - cvv
  - cv2
address:
  forms:
    - glued-suffix
    - po-box
  postcodeForm: continental
  postcodeRegex: \d{4}
  streetSuffixGlued:
    - gate
    - gata
    - veien
    - vegen
    - plassen
    - allé
  poBoxKeywords:
    - Postboks
    - PB.
  floorKeywords:
    - etasje
    - leilighet
    - leil.
  countryNames:
    - Norge
    - Norway
    - NO
  countryPostcodePrefixes: []
  requireUppercase: true
nationalIds:
  - id: no-fodselsnummer
    name: Norwegian Fødselsnummer
    pattern: \b\d{6}\s?\d{5}\b
    replacement: '[NO_ID]'
dateOfBirth:
  monthsLong:
    - januar
    - februar
    - mars
    - april
    - mai
    - juni
    - juli
    - august
    - september
    - oktober
    - november
    - desember
  monthsShort:
    - jan.
    - feb.
    - mars
    - apr.
    - mai
    - jun.
    - jul.
    - aug.
    - sep.
    - okt.
    - nov.
    - des.
  contextKeywords:
    - født den
    - født
    - fødselsdag
    - fødselsdato
