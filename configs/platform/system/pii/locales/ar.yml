# PII locale dataset — detection vocabulary for the locale-aware built-in
# patterns (phone/CVC context keywords, address forms, national-ID specs,
# date-of-birth vocabulary). Converted from the reference engine's typed
# dataset; values are frozen — extend deliberately, never trim.
locale: ar
name: Arabic
scripts:
  - arab
countries:
  - SA
  - EG
  - AE
  - MA
  - DZ
  - TN
  - JO
  - LB
  - SY
  - IQ
  - KW
  - QA
  - BH
  - OM
  - YE
  - LY
  - SD
phoneContextKeywords:
  - هاتف
  - جوال
  - رقم الجوال
  - موبايل
  - رقم الهاتف
  - tel.
  - tel
cvcContextKeywords:
  - رمز الأمان
  - cvc
  - cvv
  - cv2
address:
  forms:
    - inverted
    - po-box
  postcodeForm: continental
  postcodeRegex: \d{5}
  streetKeywordsInverted:
    - شارع
    - طريق
    - حي
    - ميدان
    - ساحة
  houseNumberMarkers:
    - رقم
    - no.
    - n°
  poBoxKeywords:
    - ص.ب.
    - صندوق بريد
    - P.O. Box
  floorKeywords:
    - شقة
    - طابق
    - دور
    - مكتب
  countryNames:
    - السعودية
    - مصر
    - الإمارات
    - المغرب
    - الجزائر
    - تونس
    - الأردن
    - لبنان
    - Saudi Arabia
    - Egypt
    - UAE
    - Morocco
  countryPostcodePrefixes: []
  requireUppercase: false
nationalIds:
  - id: sa-national-id
    name: Saudi National ID
    pattern: \b[12]\d{9}\b
    replacement: '[SA_ID]'
  - id: eg-national-id
    name: Egyptian National ID
    pattern: \b[23]\d{13}\b
    replacement: '[EG_ID]'
dateOfBirth:
  monthsLong:
    - يناير
    - فبراير
    - مارس
    - أبريل
    - مايو
    - يونيو
    - يوليو
    - أغسطس
    - سبتمبر
    - أكتوبر
    - نوفمبر
    - ديسمبر
    - كانون الثاني
    - شباط
    - آذار
    - نيسان
    - أيار
    - حزيران
    - تموز
    - آب
    - أيلول
    - تشرين الأول
    - تشرين الثاني
    - كانون الأول
  contextKeywords:
    - تاريخ الميلاد
    - مواليد
    - ولد في
    - ولدت في
    - الميلاد
