# PII locale dataset — detection vocabulary for the locale-aware built-in
# patterns (phone/CVC context keywords, address forms, national-ID specs,
# date-of-birth vocabulary). Converted from the reference engine's typed
# dataset; values are frozen — extend deliberately, never trim.
locale: sl
name: Slovenian
scripts:
  - latn
countries:
  - SI
phoneContextKeywords:
  - telefon
  - mobilni telefon
  - številka
  - tel.
  - tel
cvcContextKeywords:
  - varnostna koda
  - cvc
  - cvv
  - cv2
address:
  forms:
    - inverted
    - po-box
  postcodeForm: continental
  postcodeRegex: \d{4}
  requireUppercase: true
  streetKeywordsInverted:
    - Ulica
    - Cesta
    - Trg
    - Pot
  poBoxKeywords:
    - P.P.
    - Poštni predal
  floorKeywords:
    - nadstropje
    - stanovanje
  countryNames:
    - Slovenija
    - Slovenia
    - SI
  countryPostcodePrefixes: []
nationalIds: []
dateOfBirth:
  monthsLong:
    - januarja
    - februarja
    - marca
    - aprila
    - maja
    - junija
    - julija
    - avgusta
    - septembra
    - oktobra
    - novembra
    - decembra
  monthsShort:
    - jan.
    - feb.
    - mar.
    - apr.
    - maj
    - jun.
    - jul.
    - avg.
    - sep.
    - okt.
    - nov.
    - dec.
  contextKeywords:
    - rojen
    - rojena
    - datum rojstva
    - roj.
