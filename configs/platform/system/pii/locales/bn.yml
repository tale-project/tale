# PII locale dataset — detection vocabulary for the locale-aware built-in
# patterns (phone/CVC context keywords, address forms, national-ID specs,
# date-of-birth vocabulary). Converted from the reference engine's typed
# dataset; values are frozen — extend deliberately, never trim.
locale: bn
name: Bengali
scripts:
  - beng
  - latn
countries:
  - BD
  - IN
phoneContextKeywords:
  - ফোন
  - মোবাইল
  - নম্বর
  - tel.
  - tel
cvcContextKeywords:
  - নিরাপত্তা কোড
  - cvc
  - cvv
  - cv2
address:
  forms:
    - standard
    - po-box
  postcodeForm: continental
  postcodeRegex: \d{4}
  requireUppercase: true
  streetKeywordsStandard:
    - Road
    - Rd.
    - Lane
    - Street
    - St.
    - Sarani
  poBoxKeywords:
    - P.O. Box
    - PO Box
  floorKeywords:
    - Floor
    - Apartment
    - Flat
  countryNames:
    - বাংলাদেশ
    - Bangladesh
    - India
    - BD
    - IN
  countryPostcodePrefixes: []
nationalIds: []
dateOfBirth:
  monthsLong:
    - জানুয়ারি
    - ফেব্রুয়ারি
    - মার্চ
    - এপ্রিল
    - মে
    - জুন
    - জুলাই
    - আগস্ট
    - সেপ্টেম্বর
    - অক্টোবর
    - নভেম্বর
    - ডিসেম্বর
  contextKeywords:
    - জন্ম তারিখ
    - জন্মদিন
    - জন্ম
