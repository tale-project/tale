# PII locale dataset — detection vocabulary for the locale-aware built-in
# patterns (phone/CVC context keywords, address forms, national-ID specs,
# date-of-birth vocabulary). Converted from the reference engine's typed
# dataset; values are frozen — extend deliberately, never trim.
locale: uk
name: Ukrainian
scripts:
  - cyrl
countries:
  - UA
phoneContextKeywords:
  - телефон
  - мобільний
  - моб.
  - тел.
  - тел
  - номер
cvcContextKeywords:
  - код безпеки
  - cvc
  - cvv
  - cv2
address:
  forms:
    - inverted
    - po-box
  postcodeForm: continental
  postcodeRegex: \d{5}
  streetKeywordsInverted:
    - вулиця
    - вул.
    - проспект
    - просп.
    - пр.
    - провулок
    - пров.
    - площа
    - пл.
    - бульвар
    - бул.
  houseNumberMarkers:
    - буд.
    - будинок
    - №
  poBoxKeywords:
    - а/с
    - абонентська скринька
  floorKeywords:
    - кв.
    - квартира
    - поверх
    - пов.
  countryNames:
    - Україна
    - Ukraine
    - UA
  countryPostcodePrefixes: []
  requireUppercase: false
nationalIds:
  - id: ua-inn
    name: Ukrainian Tax ID (ІПН)
    pattern: \b\d{10}\b
    replacement: '[UA_INN]'
dateOfBirth:
  monthsLong:
    - січня
    - лютого
    - березня
    - квітня
    - травня
    - червня
    - липня
    - серпня
    - вересня
    - жовтня
    - листопада
    - грудня
  monthsShort:
    - січ.
    - лют.
    - бер.
    - квіт.
    - трав.
    - черв.
    - лип.
    - серп.
    - вер.
    - жовт.
    - лист.
    - груд.
  contextKeywords:
    - народився
    - народилася
    - дата народження
    - нар.
