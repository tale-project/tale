# PII locale dataset — detection vocabulary for the locale-aware built-in
# patterns (phone/CVC context keywords, address forms, national-ID specs,
# date-of-birth vocabulary). Converted from the reference engine's typed
# dataset; values are frozen — extend deliberately, never trim.
locale: da
name: Danish
scripts:
  - latn
countries:
  - DK
phoneContextKeywords:
  - telefon
  - mobiltelefon
  - mobil
  - nummer
  - tlf.
  - tlf
  - tel.
  - tel
cvcContextKeywords:
  - sikkerhedskode
  - cvc
  - cvv
  - cv2
address:
  forms:
    - glued-suffix
    - po-box
  postcodeForm: continental
  postcodeRegex: \d{4}
  streetSuffixGlued:
    - gade
    - vej
    - vænge
    - stræde
    - plads
    - boulevard
    - allé
  poBoxKeywords:
    - Postboks
  floorKeywords:
    - sal
    - etage
    - lejlighed
    - lejl.
  countryNames:
    - Danmark
    - Denmark
    - DK
  countryPostcodePrefixes: []
  requireUppercase: true
nationalIds:
  - id: dk-cpr
    name: Danish CPR
    pattern: \b\d{6}-?\d{4}\b
    replacement: '[CPR]'
dateOfBirth:
  monthsLong:
    - januar
    - februar
    - marts
    - april
    - maj
    - juni
    - juli
    - august
    - september
    - oktober
    - november
    - december
  monthsShort:
    - jan.
    - feb.
    - mar.
    - apr.
    - maj
    - jun.
    - jul.
    - aug.
    - sep.
    - okt.
    - nov.
    - dec.
  contextKeywords:
    - født den
    - født
    - fødselsdag
    - fødselsdato
