# PII locale dataset — detection vocabulary for the locale-aware built-in
# patterns (phone/CVC context keywords, address forms, national-ID specs,
# date-of-birth vocabulary). Converted from the reference engine's typed
# dataset; values are frozen — extend deliberately, never trim.
locale: et
name: Estonian
scripts:
  - latn
countries:
  - EE
phoneContextKeywords:
  - telefon
  - mobiil
  - number
  - tel.
  - tel
cvcContextKeywords:
  - turvakood
  - cvc
  - cvv
  - cv2
address:
  forms:
    - glued-suffix
    - standalone-suffix
    - po-box
  postcodeForm: continental
  postcodeRegex: \d{5}
  requireUppercase: true
  streetSuffixGlued:
    - tee
    - tn
    - põik
    - plats
    - allee
    - väljak
  poBoxKeywords:
    - Postkast
    - Pk
  floorKeywords:
    - korter
    - korrus
  countryNames:
    - Eesti
    - Estonia
    - EE
  countryPostcodePrefixes: []
nationalIds: []
dateOfBirth:
  monthsLong:
    - jaanuar
    - veebruar
    - märts
    - aprill
    - mai
    - juuni
    - juuli
    - august
    - september
    - oktoober
    - november
    - detsember
  contextKeywords:
    - sünnikuupäev
    - sünniaeg
    - sündinud
