# PII locale dataset — detection vocabulary for the locale-aware built-in
# patterns (phone/CVC context keywords, address forms, national-ID specs,
# date-of-birth vocabulary). Converted from the reference engine's typed
# dataset; values are frozen — extend deliberately, never trim.
locale: el
name: Greek
scripts:
  - grek
countries:
  - GR
  - CY
phoneContextKeywords:
  - τηλέφωνο
  - κινητό
  - αριθμός
  - τηλ.
  - τηλ
  - κιν.
cvcContextKeywords:
  - κωδικός ασφαλείας
  - cvc
  - cvv
  - cv2
address:
  forms:
    - inverted
    - standard
    - po-box
  postcodeForm: continental
  postcodeRegex: \d{3}\s?\d{2}
  streetKeywordsInverted:
    - Οδός
    - Λεωφόρος
    - Λεωφ.
    - Πλατεία
    - Πλ.
  houseNumberMarkers:
    - αρ.
    - no.
  poBoxKeywords:
    - Τ.Θ.
    - Ταχ. Θυρίδα
  floorKeywords:
    - όροφος
    - ορ.
    - διαμέρισμα
  countryNames:
    - Ελλάδα
    - Greece
    - Κύπρος
    - Cyprus
    - GR
    - CY
  countryPostcodePrefixes: []
  requireUppercase: false
nationalIds:
  - id: gr-amka
    name: Greek AMKA (Social Security)
    pattern: \b\d{11}\b
    checksum: luhn
    replacement: '[AMKA]'
dateOfBirth:
  monthsLong:
    - Ιανουαρίου
    - Φεβρουαρίου
    - Μαρτίου
    - Απριλίου
    - Μαΐου
    - Ιουνίου
    - Ιουλίου
    - Αυγούστου
    - Σεπτεμβρίου
    - Οκτωβρίου
    - Νοεμβρίου
    - Δεκεμβρίου
  contextKeywords:
    - ημερομηνία γέννησης
    - γεννήθηκε
    - γέννηση
