# PII locale dataset — detection vocabulary for the locale-aware built-in
# patterns (phone/CVC context keywords, address forms, national-ID specs,
# date-of-birth vocabulary). Converted from the reference engine's typed
# dataset; values are frozen — extend deliberately, never trim.
locale: ms
name: Malay
scripts:
  - latn
countries:
  - MY
  - BN
phoneContextKeywords:
  - telefon
  - no telefon
  - bimbit
  - tel.
  - tel
cvcContextKeywords:
  - kod keselamatan
  - cvc
  - cvv
  - cv2
address:
  forms:
    - inverted
    - standard
    - po-box
  postcodeForm: continental
  postcodeRegex: \d{5}
  requireUppercase: true
  streetKeywordsInverted:
    - Jalan
    - Jln.
    - Lorong
    - Lrg.
    - Persiaran
    - Lebuh
  poBoxKeywords:
    - Peti Surat
    - PO Box
  floorKeywords:
    - Tingkat
    - Aras
  countryNames:
    - Malaysia
    - Brunei
    - MY
    - BN
  countryPostcodePrefixes: []
nationalIds: []
dateOfBirth:
  monthsLong:
    - Januari
    - Februari
    - Mac
    - April
    - Mei
    - Jun
    - Julai
    - Ogos
    - September
    - Oktober
    - November
    - Disember
  contextKeywords:
    - tarikh lahir
    - lahir
    - dilahirkan
  monthsShort:
    - Jan.
    - Feb.
    - Mac
    - Apr.
    - Mei
    - Jun.
    - Jul.
    - Ogos
    - Sep.
    - Okt.
    - Nov.
    - Dis.
