# Built-in PII pattern. `impl: native` — the wide-net regex below is the
# data knob; range/compression checks run through a validator in the pii
# plugin (lib/pii/patterns/ip-address.ts). Private/reserved ranges are
# intentionally masked too: internal topology is PII.
#
# The middle alternative takes an IPv6 address that ends in `::`
# (`2001:db8:abcd:12::`, `fe80::%eth0`). It comes before the general one,
# which needs a group after its last colon and so would hand the validator
# only the cut-off `2001:db8:abcd:12`. The validator accepts `::`, `d::`
# and `e::` too, so the middle alternative starts its first group at a word
# boundary and allows no letter, digit, `_` or colon right after it:
# `std::vector`, `Feed::new()` and an rST `Example::` stay unmasked.
name: ipAddress
description: >-
  IPv4 dotted-quad and IPv6 (including compressed and IPv4-mapped forms,
  with optional %zone identifiers) addresses, post-validated so version
  numbers and other dotted digit runs do not match.
replacement: '[IP_ADDRESS]'
impl: native
regex:
  source: '\b(?:\d{1,3}\.){3}\d{1,3}\b|\b(?:[0-9a-fA-F]{1,4}:){1,7}:(?:%[A-Za-z0-9_.~-]{1,32})?(?![\w:])|(?:[0-9a-fA-F]{0,4}:){2,7}(?:(?:\d{1,3}\.){3}\d{1,3}|[0-9a-fA-F]{1,4})(?:%[A-Za-z0-9_.~-]{1,32})?'
  flags: g
