# Built-in PII pattern. `impl: native` — the numeric-date regex below is the
# data knob; year/day plausibility validators plus the locale-composed
# textual-date regexes (month names, CJK year/month/day markers from the
# locale datasets) live in the pii plugin
# (lib/pii/patterns/date-of-birth.ts).
name: dateOfBirth
description: >-
  Dates of birth — numeric forms (12.03.1980, 1980-03-12) detected
  locale-independently by the regex below, textual forms ("born on March 28,
  1998", "geboren am 12. März 1980", "1998年9月28日生") composed from each
  enabled locale's date-of-birth vocabulary. A year-plausibility gate
  (1900..current+1) rejects phone numbers and random digit runs. A numeric
  date with a two-digit year (12.03.80) counts only right after one of the
  enabled locales' date-of-birth keywords ("DOB: 12.03.80", "Geburtsdatum:
  12.03.80"); on its own it passes, like a version or section number.
replacement: '[DATE_OF_BIRTH]'
impl: native
regex:
  source: '(?<!\w)(?:\d{1,2}[./—–-]\d{1,2}[./—–-]\d{2,4}|\d{4}[./—–-]\d{1,2}[./—–-]\d{1,2})(?=[T\s,;.)\]]|$|[^\w])'
  flags: g
