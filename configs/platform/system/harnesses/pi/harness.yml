# Sandbox harness — Pi, driven through the tale-pi-run wrapper (prompt +
# per-exec config as one JSON object on stdin, staged to disk before the CLI
# starts — process lists leak argv, and a prompt starting with '-' would
# parse as a flag). Its bring-your-own backend is commonly OpenRouter-style
# and speaks the catalog's vendor-prefixed ids, so refs resolve in the
# catalog dialect.
#
# The wrapper stages the config files into a private per-exec
# PI_CODING_AGENT_DIR, then pipes the prompt into the CLI's stdin (Pi's
# native headless prompt source). The MCP servers (the browser and the
# capability bridge, which carries every workspace tool) are staged as
# <agentDir>/mcp.json, the user-level file Pi reads without asking for
# project trust. Instructions are staged as
# <agentDir>/APPEND_SYSTEM.md — auto-discovered and APPENDED to Pi's default
# system prompt without replacing it (SYSTEM.md would replace it and drop
# the defaults). Pi has NO native web tools (built-in tools: read, bash,
# edit, write, grep, find, ls) and no interactive-question tool, so there is
# nothing to deny for managed runs; additionalDirs needs no wiring either —
# Pi's file tools are not cwd-scoped. No fallback and no turn cap — the
# pinned CLI has neither flag; the runaway backstop is the platform runner.
#
# The exec section is interpreted by lib/harnesses/exec-builder.ts; the
# golden fixtures in lib/harnesses/fixtures/exec/pi.json pin the built execs
# against the pinned CLI version below.
slug: pi
displayName: Pi
credentialPolicy:
  managed: true
  byo: true
credentialEnvKeys:
  - OPENROUTER_API_KEY
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
  - GEMINI_API_KEY
  - TALE_GATEWAY_TOKEN
gatewayWire: openai-chat
modelIdDialect: catalog
promptTransport: stdin-ndjson
capabilities:
  planMode: false
  steering: false
  mcp: true
  resume: true
parser: pi-jsonl
exec:
  bin: tale-pi-run
  argv:
    - args: ['--workdir', '${workdir}']
    # Pi keeps the system prompt in the session as named sections, re-reads
    # the staged APPEND_SYSTEM.md every process and stores what changed as a
    # section update ahead of the new turn; the request carries the newest
    # value of each section. So a resumed session reads this exec's
    # instructions. Observed on 1.0.1 against a local stand-in for the chat
    # API.
    - resume: { flag: '--resume', instructions: current }
    # Managed: pin the staged gateway provider so model resolution never
    # wanders into Pi's built-in catalog (its default provider is google).
    # byo: the caller-resolved catalog id (or raw ref) resolves against Pi's
    # own registry with the user's credentials.
    - model:
        flag: '--model'
        managedPrefixArgs: ['--provider', 'tale-gateway']
  stdin:
    mode: json-envelope
    envelope:
      - prompt: {}
      # Staged as <agentDir>/settings.json. Default-on install telemetry
      # pings home; a sandbox turn must not.
      - doc:
          key: settings
          fragments:
            - set:
                enableInstallTelemetry: false
      - instructions: { key: system_prompt }
      # MANAGED: OpenAI-compatible route on the platform gateway, wired as a
      # Pi custom provider in a staged models.json. The session key rides
      # `$TALE_GATEWAY_TOKEN` env interpolation (Pi's models.json value
      # resolution), never the staged JSON itself (the staged file may get
      # logged).
      - doc:
          key: models
          when: [managed]
          fragments:
            - set:
                providers:
                  tale-gateway:
                    baseUrl: '${gateway.baseUrl}/openai/v1'
                    api: openai-completions
                    apiKey: $TALE_GATEWAY_TOKEN
            # The model's context window as the catalog knows it. Pi takes
            # 128,000 tokens for a model it does not know, caps each request's
            # output at that window minus its estimate of the conversation
            # (one token at least) and compacts only near it: a conversation
            # past ~124,000 tokens of a larger model got one-token answers and
            # ended without a report. An unknown window leaves the key out.
            - when: [model]
              set:
                providers:
                  tale-gateway:
                    models:
                      - id: '${model}'
                        contextWindow: { $number: '${model.contextWindow}' }
      # Staged as <agentDir>/mcp.json (stdio: command/args/env — Pi's MCP
      # server config). Pi offers a server's tools to the model only with
      # `exposure: direct`: its default keeps them inside its code-mode
      # scripts, where an agent told to call the workspace tools by name
      # never finds them. The bridge token rides `${TALE_GATEWAY_TOKEN}`,
      # which Pi resolves from its own environment when it starts the server
      # (its stdio servers inherit that environment), so the staged file
      # never holds the key. No call timeout: Pi asks every call for progress,
      # and the bridge's reports on a long one (an image generation) restart
      # Pi's 60 s timer.
      - doc:
          key: mcp
          fragments:
            - mcpServers:
                path: mcpServers
                serverShape: command-args
                bridgeEnvField: env
                bridgeEnv:
                  TALE_CONNECTORS_URL: '${bridgeUrl}'
                  TALE_CONNECTORS_TOKEN: '${TALE_GATEWAY_TOKEN}'
                serverFields:
                  exposure: direct
  env:
    managed:
      TALE_GATEWAY_TOKEN: '${gateway.token}'
