# Static model catalog for the openai connector — flagship reasoning models
# plus the everyday chat workhorse, in the vendor's own model ids. Pricing is
# cents per million tokens.
- id: gpt-5.5
  provider: openai
  tags:
    - chat
  supportsTools: true
  supportsVision: true
  reasoning:
    knob: effort
    # Probed 2026-08-14 via the provider's own 400: "Function tools with
    # reasoning_effort are not supported for gpt-5.5 in /v1/chat/completions.
    # To use function tools, use /v1/responses or set reasoning_effort to
    # 'none'." — chat always carries tools, so every turn (Default step AND
    # sticky effort picks) must send none; the picker offers no levels.
    off: none
    toolsRequireOff: true
  # Vendor model page: 1,050,000-token context, 128,000-token output.
  contextWindow: 1050000
  maxOutputTokens: 128000
  pricing:
    inputCentsPerMillion: 500
    outputCentsPerMillion: 3000
- id: gpt-5.5-pro
  provider: openai
  tags:
    - chat
  supportsTools: true
  supportsVision: true
  reasoning:
    knob: effort
    # Family behavior (see gpt-5.5 above); the pro tier may turn out to be
    # served on /v1/responses only — a 404 here means repoint, not retune.
    off: none
    toolsRequireOff: true
  contextWindow: 400000
  maxOutputTokens: 128000
  pricing:
    inputCentsPerMillion: 3000
    outputCentsPerMillion: 18000
# The chat-tuned variant ships under the vendor's rolling "-latest" alias —
# the bare id 404s ("The model `gpt-5.3-chat` does not exist…", probed
# 2026-08-14). Non-reasoning: takes max_completion_tokens AND a custom
# temperature.
- id: gpt-5.3-chat-latest
  provider: openai
  tags:
    - chat
  supportsTools: true
  supportsVision: true
  contextWindow: 128000
  maxOutputTokens: 16384
  pricing:
    inputCentsPerMillion: 175
    outputCentsPerMillion: 1400
# The 5.6 frontier trio — ids, sizes, and prices from the vendor's model
# catalog page (sol $5/$30, terra $2/$12, luna $0.20/$1.20 per million;
# 1.05M context / 128K output each). The page frames them as Responses-API
# models, but /v1/chat/completions serves them too — its parameter 400
# ("Function tools with reasoning_effort are not supported for gpt-5.6-sol…")
# proves the route and names the restriction, so all three declare
# off + toolsRequireOff. Codex variants are Responses-only and NOT listed;
# gpt-5.6-luna-pro exists only in the openrouter catalog, not here.
