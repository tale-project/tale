# Static model catalog for the openai connector — flagship reasoning models
# plus the everyday chat workhorse, in the vendor's own model ids. Pricing is
# cents per million tokens.
- id: gpt-5.5
  provider: openai
  tags:
    - chat
  supportsTools: true
  supportsVision: true
  reasoning:
    knob: effort
  contextWindow: 400000
  maxOutputTokens: 128000
  pricing:
    inputCentsPerMillion: 500
    outputCentsPerMillion: 3000
- id: gpt-5.5-pro
  provider: openai
  tags:
    - chat
  supportsTools: true
  supportsVision: true
  reasoning:
    knob: effort
  contextWindow: 400000
  maxOutputTokens: 128000
  pricing:
    inputCentsPerMillion: 3000
    outputCentsPerMillion: 18000
- id: gpt-5.3-chat
  provider: openai
  tags:
    - chat
  supportsTools: true
  supportsVision: true
  contextWindow: 128000
  maxOutputTokens: 16384
  pricing:
    inputCentsPerMillion: 175
    outputCentsPerMillion: 1400
# Text-to-speech: powers "Read replies aloud" / "Speak out loud". The context
# window is nominal — synthesis takes character-capped requests, not context.
- id: gpt-4o-mini-tts
  provider: openai
  tags:
    - text-to-speech
  supportsTools: false
  supportsVision: false
  contextWindow: 2000
  tts:
    defaultVoice: alloy
    voicesByLocale:
      en: alloy
      de: onyx
      fr: nova
    audioFormat: mp3
    centsPerMillionCharacters: 1200
# Transcription: powers browser dictation's server fallback and audio/video
# attachment transcription, both through `/audio/transcriptions`. Without an
# entry carrying this tag `resolveTranscriptionModel` finds nothing and every
# upload fails `NO_TRANSCRIPTION_MODEL` — the capability exists only because
# it is declared here, exactly as with the embedding widths below.
#
# whisper-1 rather than the gpt-4o-transcribe family: the request asks for
# `response_format=verbose_json` and the paragraphizer needs the per-segment
# timestamps it returns, which the newer transcribe models do not serve.
# Pricing is per audio MINUTE, which this catalog's per-token schema cannot
# express — so it is omitted and the ledger records minutes at a zero cost
# estimate. The context window is nominal: transcription takes a file.
- id: whisper-1
  provider: openai
  tags:
    - transcription
  supportsTools: false
  supportsVision: false
  contextWindow: 2000
# Embedding model — the everyday knowledge-indexing workhorse. 1536 native
# dimensions, under pgvector's HNSW index limit.
- id: text-embedding-3-small
  provider: openai
  tags:
    - embedding
  supportsTools: false
  supportsVision: false
  contextWindow: 8191
  pricing:
    inputCentsPerMillion: 2
    outputCentsPerMillion: 0
  embedding:
    dimensions: 1536
    recommended: true
