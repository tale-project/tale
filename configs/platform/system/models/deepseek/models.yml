# Static model catalog for the deepseek connector. DeepSeek's native API
# serves two ids — `deepseek-flash` (the current Flash generation:
# DeepSeek-V4.1-Flash since 2026-09-10, with native image input) and
# `deepseek-v4-pro` (DeepSeek-V4-Pro-0813) — each with thinking (the
# default) and non-thinking via the effort knob; `off: none` carries over
# from the V4 entries: the endpoint and its control surface are unchanged.
# The previous-generation `deepseek-v4-flash` / `deepseek-v4-flash-vision-exp`
# were retired on 2026-09-10 (temporarily routed to V4.1 Flash, so a stale
# pin still answers until DeepSeek drops the route); `deepseek-chat` /
# `deepseek-reasoner` stopped resolving on 2026-07-24. Capability facts and
# pricing (cents per million tokens) match the official API listing as of
# 2026-09-20. DeepSeek bills by time of day: the figures below are the PEAK
# rates (01:00–04:00 and 06:00–10:00 UTC, Monday–Friday, Chinese public
# holidays excluded); every other hour is billed at half of them — a
# time-of-day discount the gateway cannot express, so the peak figure is
# the conservative one.
# Prompt-cache HIT prices (`cacheReadCentsPerMillion`) added 2026-09-20 from the
# same listing — peak rates again (flash $0.006/M, pro $0.044/M); DeepSeek bills
# no cache write. A Claude Code turn is mostly cache hits, so without this
# figure the gateway billed such a turn ~7× the vendor's own invoice.
- id: deepseek-flash
  provider: deepseek
  tags:
    - chat
    - vision
  supportsTools: true
  supportsVision: true
  reasoning:
    knob: effort
    off: none
  contextWindow: 1048576
  maxOutputTokens: 384000
  pricing:
    inputCentsPerMillion: 30
    outputCentsPerMillion: 120
    cacheReadCentsPerMillion: 0.6
- id: deepseek-v4-pro
  provider: deepseek
  tags:
    - chat
  supportsTools: true
  supportsVision: false
  reasoning:
    knob: effort
    off: none
  contextWindow: 1048576
  maxOutputTokens: 384000
  pricing:
    inputCentsPerMillion: 132
    outputCentsPerMillion: 396
    cacheReadCentsPerMillion: 4.4
