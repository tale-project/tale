# Curated DEFAULT catalog for the openrouter connector — the flagship
# models of the top-10 vendors on OpenRouter, captured from the live
# listing on 2026-07-21 through the platform normalizer. The live
# openrouter-api fetch is merged OVER this set (fetched entries win by
# id); on a cold fetch failure these defaults serve alone, so an
# air-gapped install still gets a working model picker.
