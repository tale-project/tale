# Curated DEFAULT catalog for the openrouter connector — the flagship
# models of the top-10 vendors on OpenRouter, captured from the live
# listing on 2026-07-21 through the platform normalizer. The live
# openrouter-api fetch is merged OVER this set (fetched entries win by
# id); on a cold fetch failure these defaults serve alone, so an
# air-gapped install still gets a working model picker.
# `reasoning.off` is the probe-verified way to switch thinking off for the
# Default effort step, checked 2026-08-13 against the live endpoints through
# the gateway: `none` where the endpoint disables reasoning outright,
# `minimal` where it answered "Reasoning is mandatory ... cannot be disabled"
# (gemini-3.x, grok-4.x, kimi-k2.7-code). Entries without `off` were not
# probe-verifiable; they keep the omit-the-parameter behavior.
# `reasoning.knob` follows the CONNECTOR'S WIRE, not the model family: this
# connector is apiFormat openai, so every entry here — the Claude ones
# included — takes `reasoning_effort`. A `budget-tokens` knob would name a
# parameter an OpenAI-compatible body cannot spell, and the pick would reach
# the endpoint as nothing at all.
# Prompt-cache prices (`cacheRead` = `pricing.input_cache_read`, `cacheWrite` =
# `pricing.input_cache_write`) captured from the live listing on 2026-09-20; the
# live fetch refreshes them the same way it refreshes the input/output pair.
- id: anthropic/claude-sonnet-5
  provider: openrouter
  tags:
    - chat
    - vision
  supportsTools: true
  supportsVision: true
  reasoning:
    knob: effort
  contextWindow: 1000000
  maxOutputTokens: 128000
  pricing:
    inputCentsPerMillion: 200
    outputCentsPerMillion: 1000
    cacheReadCentsPerMillion: 20
    cacheWriteCentsPerMillion: 250
