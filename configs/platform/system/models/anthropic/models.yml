# Haiku 4.5 takes no effort parameter and reasons only through a manual
# `thinking.budget_tokens` budget, whose tool-use turns must replay the
# signed thinking blocks — a replay the chat lane does not do yet. Until it
# does, the entry declares no knob: the picker shows no effort section and
# the turn samples at the model's own default.
- id: claude-haiku-4-5
  provider: anthropic
  tags:
    - chat
  supportsTools: true
  supportsVision: true
  contextWindow: 200000
  maxOutputTokens: 64000
  pricing:
    inputCentsPerMillion: 100
    outputCentsPerMillion: 500
    cacheReadCentsPerMillion: 10
    cacheWriteCentsPerMillion: 125
