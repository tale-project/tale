# AI provider connector — Moonshot AI (the Kimi model family), on its
# OpenAI-compatible platform API. Static model catalog (models/moonshot/models.yml).
#
# The subscription method is Kimi's coding-plan key: it rides Moonshot's
# Anthropic-compatible endpoint for agentic coding tools only, so it forces
# sandboxed execution on the claude-code harness and never serves direct API
# calls.
name: moonshot
displayName: Moonshot AI (Kimi)
apiFormat: openai
baseUrl: https://api.moonshot.ai/v1
# Sandbox coding harnesses that speak the Anthropic wire to the gateway
# (Claude Code) ride Moonshot's native Anthropic-compatible endpoint on the
# direct (api-key/env) lane as well, so the gateway passes Anthropic through
# instead of down-converting Anthropic→OpenAI. Documented for standard
# platform API keys at https://platform.kimi.ai/docs/guide/claude-code-kimi
# (`ANTHROPIC_BASE_URL=https://api.moonshot.ai/anthropic`) — the same base the
# coding-plan subscription below rides. Declared from the vendor docs; not
# live-probed from this platform yet.
harnessEndpoint:
  baseUrl: https://api.moonshot.ai/anthropic
  apiFormat: anthropic
catalog:
  source: static
embedding: unknown
auth:
  - method: api-key
  - method: env
  - method: subscription-key
    baseUrl: https://api.moonshot.ai/anthropic
    apiFormat: anthropic
    constraints:
      execution: sandbox
      harness: claude-code
