# AI provider connector — Anthropic's own API (Messages wire shape). Static
# model catalog (models/anthropic.yml). Besides key-based auth, a Claude
# subscription can be attached through an OAuth token broker; that credential
# only works inside the vendor's own CLI, so it forces sandbox execution with
# the claude-code harness (enforced by the execution-resolution case split).
name: anthropic
displayName: Anthropic
apiFormat: anthropic
baseUrl: https://api.anthropic.com
catalog:
  source: static
auth:
  - method: api-key
  - method: env
  - method: subscription-broker
    constraints:
      execution: sandbox
      harness: claude-code
