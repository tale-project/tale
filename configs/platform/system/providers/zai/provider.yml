# AI provider connector — Z.ai (Zhipu's international brand, the GLM model
# family). Direct API traffic rides the vendor's OpenAI-compatible CODING
# base, which carries its API version IN THE PATH (the gateway appends
# `/chat/completions` verbatim via its request path overrides). The coding
# base serves BOTH credential shapes: a GLM Coding Plan key draws on its
# plan quota there, while the general `/api/paas/v4` base bills the API
# balance instead — a plan key with no API balance gets 429 "Insufficient
# balance" on the general base (verified 2026-08-26). The vendor's former
# `/api/openai/v1` alias no longer exists upstream (404).
# Static model catalog (models/zai/models.yml).
#
# The subscription method is the GLM Coding Plan: a static plan key that
# only serves agentic coding traffic through Z.ai's Anthropic-compatible
# endpoint, so it forces sandboxed execution on the claude-code harness and
# never serves direct API calls. That endpoint silently DROPS image content
# blocks for every model — even explicitly-requested vision models answer
# blind (verified 2026-08-26) — declared below as `imageInputs: dropped` so
# serving refuses an image-bearing turn on this lane (or tells the agent it
# cannot see) instead of letting the images vanish. Vision-dependent turns
# must ride the direct lane; the plan key itself is accepted on the direct
# base too.
#
# No `harnessEndpoint` on purpose: the same Anthropic-compatible door would
# serve the direct lane's Claude Code turns natively (no Anthropic→OpenAI
# down-conversion), but its image-dropping behaviour is not modelled for a
# harness endpoint — a vision-capable model would answer blind with a 200,
# and the direct lane's vision polyfill only arms for text-only models. Until
# a harness endpoint can declare `imageInputs: dropped` and force the
# polyfill, Claude Code stays on the OpenAI coding base here, where Z.ai
# does not enforce DeepSeek's reasoning replay.
name: zai
displayName: Z.ai (GLM)
apiFormat: openai
baseUrl: https://api.z.ai/api/coding/paas/v4
catalog:
  source: static
embedding: unknown
auth:
  - method: api-key
  - method: env
  - method: subscription-key
    baseUrl: https://api.z.ai/api/anthropic
    apiFormat: anthropic
    imageInputs: dropped
    constraints:
      execution: sandbox
      harness: claude-code
