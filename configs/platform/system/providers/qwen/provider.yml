# AI provider connector — Qwen (Alibaba Cloud Model Studio / DashScope,
# international endpoint) via its OpenAI compatible-mode path. Static model
# catalog (models/qwen/models.yml).
#
# The Qwen Code CLI is available as a sandbox HARNESS with these same
# credentials (its own hosted OAuth free tier was discontinued 2026-04-15,
# so the CLI authenticates with a DashScope API key like every other
# caller) — there is no separate subscription method here.
name: qwen
displayName: Qwen (Alibaba)
apiFormat: openai
baseUrl: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
catalog:
  source: static
auth:
  - method: api-key
  - method: env
