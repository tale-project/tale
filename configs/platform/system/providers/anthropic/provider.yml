# AI provider connector — Anthropic's own API (Messages wire shape). Static
# model catalog (models/anthropic/models.yml). Besides key-based auth, a Claude
# subscription can be attached as a pasted OAuth token or through an OAuth
# token broker; either credential only works inside the vendor's own CLI, so it
# forces sandbox execution with the claude-code harness (enforced by the
# execution-resolution case split).
name: anthropic
displayName: Anthropic
apiFormat: anthropic
baseUrl: https://api.anthropic.com
catalog:
  source: static
# No embedding model: "Anthropic does not offer its own embedding model."
# (https://platform.claude.com/docs/en/build-with-claude/embeddings, read
# 2026-09-27; the page points to Voyage AI instead). The embedding form
# refuses this provider at the point of choosing.
embedding: unsupported
auth:
  - method: api-key
  - method: env
  # A pasted Claude OAuth token (for example from `claude setup-token`): the
  # static counterpart of the broker below. It rides the CLI's OAuth channel,
  # not the bearer channel a coding-plan key uses.
  - method: subscription-key
    targetEnvVar: CLAUDE_CODE_OAUTH_TOKEN
    constraints:
      execution: sandbox
      harness: claude-code
  - method: subscription-broker
    constraints:
      execution: sandbox
      harness: claude-code
