  - name: list_commits
    description: List commits for a repository.
    effects: read
    input:
      type: object
      properties:
        owner:
          {
            type: string,
            description: 'Repository owner (user or organization).',
          }
        repo: { type: string, description: 'Repository name.' }
        per_page: { type: number, description: 'Results per page (max 100).' }
        page: { type: number, description: 'Page number for pagination.' }
        sha:
          {
            type: string,
            description: 'Branch name or commit SHA to list commits from.',
          }
      required: [owner, repo]
    output: '{ commits: Array<{ sha: string, message: string, author: string, html_url: string }> }'
    mock: |
      return { commits: [{ sha: 'commitsha1', message: 'Initial commit', author: 'octocat', html_url: `https://github.com/${input.owner}/${input.repo}/commit/commitsha1` }] };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Tale' };
        const q = [];
        for (const k of ['per_page', 'page', 'sha']) if (input[k] != null && input[k] !== '') q.push(k + '=' + encodeURIComponent(String(input[k])));
        const qs = q.length ? '?' + q.join('&') : '';
        const r = await ctx.http.get(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/commits${qs}`, { headers: h });
        if (!r.status || r.status >= 400) throw new Error(`GitHub list_commits failed (${r.status}): ${r.text()}`);
        return { commits: r.json() };
    exampleInput: { owner: 'octocat', repo: 'hello-world' }
  - name: search_code
    description: Search for code across GitHub repositories.
    effects: read
    input:
      type: object
      properties:
        q:
          {
            type: string,
            description: 'Search query (supports GitHub qualifiers like repo:, language:, path:).',
          }
        per_page: { type: number, description: 'Results per page (max 100).' }
        page: { type: number, description: 'Page number for pagination.' }
      required: [q]
    output: '{ total_count: number, items: Array<{ name: string, path: string, repository: string, html_url: string }> }'
    mock: |
      return { total_count: 1, items: [{ name: 'index.ts', path: 'src/index.ts', repository: 'octocat/hello-world', html_url: 'https://github.com/octocat/hello-world/blob/main/src/index.ts' }] };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Tale' };
        const q = ['q=' + encodeURIComponent(String(input.q))];
        for (const k of ['per_page', 'page']) if (input[k] != null && input[k] !== '') q.push(k + '=' + encodeURIComponent(String(input[k])));
        const r = await ctx.http.get(`https://api.github.com/search/code?${q.join('&')}`, { headers: h });
        if (!r.status || r.status >= 400) throw new Error(`GitHub search_code failed (${r.status}): ${r.text()}`);
        const j = r.json();
        return { total_count: j.total_count, items: j.items };
    exampleInput: { q: 'addEventListener repo:octocat/hello-world' }
