# Integration connector — GitHub REST API. A personal access token (bearer)
# authorizes every action; the platform injects it as the Authorization header,
# so the live bodies below only carry GitHub's functional headers. Reads return
# the resource(s) under a named key; writes return the identifiers a caller
# routes on. Every mock is deterministic — same input, same output, no IO.
name: github
displayName: GitHub
description: Manage repositories, issues, and pull requests on GitHub.
tags:
  - Developer
allowedHosts:
  - api.github.com
auth:
  - method: bearer
actions:
  - name: list_repos
    description: List repositories for the authenticated user.
    effects: read
    input:
      type: object
      properties:
        per_page: { type: number, description: 'Results per page (max 100).' }
        page: { type: number, description: 'Page number for pagination.' }
        sort:
          {
            type: string,
            description: 'Sort field: created, updated, pushed, or full_name.',
          }
        visibility:
          {
            type: string,
            description: 'Filter by visibility: all, public, or private.',
          }
    output: '{ repos: Array<{ id: number, name: string, full_name: string, private: boolean }> }'
    mock: |
      return { repos: [{ id: 1, name: 'demo-repo', full_name: 'octocat/demo-repo', private: false }] };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Tale' };
        const q = [];
        for (const k of ['per_page', 'page', 'sort', 'visibility']) if (input[k] != null && input[k] !== '') q.push(k + '=' + encodeURIComponent(String(input[k])));
        const qs = q.length ? '?' + q.join('&') : '';
        const r = await ctx.http.get(`https://api.github.com/user/repos${qs}`, { headers: h });
        if (!r.status || r.status >= 400) throw new Error(`GitHub list_repos failed (${r.status}): ${r.text()}`);
        return { repos: r.json() };
    exampleInput: { visibility: 'all', per_page: 20 }
  - name: get_repo
    description: Get a single repository by owner and name.
    effects: read
    input:
      type: object
      properties:
        owner:
          {
            type: string,
            description: 'Repository owner (user or organization).',
          }
        repo: { type: string, description: 'Repository name.' }
      required: [owner, repo]
    output: '{ repo: { id: number, name: string, full_name: string, private: boolean, default_branch: string } }'
    mock: |
      return { repo: { id: 1, name: input.repo, full_name: `${input.owner}/${input.repo}`, private: false, default_branch: 'main' } };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Tale' };
        const r = await ctx.http.get(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}`, { headers: h });
        if (!r.status || r.status >= 400) throw new Error(`GitHub get_repo failed (${r.status}): ${r.text()}`);
        return { repo: r.json() };
    exampleInput: { owner: 'octocat', repo: 'hello-world' }
  - name: list_issues
    description: List issues for a repository.
    effects: read
    input:
      type: object
      properties:
        owner:
          {
            type: string,
            description: 'Repository owner (user or organization).',
          }
        repo: { type: string, description: 'Repository name.' }
        state:
          {
            type: string,
            description: 'Filter by state: open, closed, or all.',
          }
        per_page: { type: number, description: 'Results per page (max 100).' }
        page: { type: number, description: 'Page number for pagination.' }
        labels:
          {
            type: string,
            description: 'Comma-separated list of label names to filter by.',
          }
        sort:
          {
            type: string,
            description: 'Sort field: created, updated, or comments.',
          }
        direction: { type: string, description: 'Sort direction: asc or desc.' }
      required: [owner, repo]
    output: '{ issues: Array<{ number: number, title: string, state: string, html_url: string }> }'
    mock: |
      return { issues: [{ number: 1, title: 'Example issue', state: input.state || 'open', html_url: `https://github.com/${input.owner}/${input.repo}/issues/1` }] };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Tale' };
        const q = [];
        for (const k of ['state', 'per_page', 'page', 'labels', 'sort', 'direction']) if (input[k] != null && input[k] !== '') q.push(k + '=' + encodeURIComponent(String(input[k])));
        const qs = q.length ? '?' + q.join('&') : '';
        const r = await ctx.http.get(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/issues${qs}`, { headers: h });
        if (!r.status || r.status >= 400) throw new Error(`GitHub list_issues failed (${r.status}): ${r.text()}`);
        return { issues: r.json() };
    exampleInput: { owner: 'octocat', repo: 'hello-world', state: 'open' }
  - name: get_issue
    description: Get a single issue by number.
    effects: read
    input:
      type: object
      properties:
        owner:
          {
            type: string,
            description: 'Repository owner (user or organization).',
          }
        repo: { type: string, description: 'Repository name.' }
        issue_number: { type: number, description: 'Issue number.' }
      required: [owner, repo, issue_number]
    output: '{ issue: { number: number, title: string, state: string, body: string, html_url: string } }'
    mock: |
      return { issue: { number: input.issue_number, title: 'Example issue', state: 'open', body: 'Mock issue body.', html_url: `https://github.com/${input.owner}/${input.repo}/issues/${input.issue_number}` } };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Tale' };
        const r = await ctx.http.get(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/issues/${encodeURIComponent(input.issue_number)}`, { headers: h });
        if (!r.status || r.status >= 400) throw new Error(`GitHub get_issue failed (${r.status}): ${r.text()}`);
        return { issue: r.json() };
    exampleInput: { owner: 'octocat', repo: 'hello-world', issue_number: 1 }
  - name: create_issue
    description: Create a new issue in a repository.
    effects: write
    input:
      type: object
      properties:
        owner:
          {
            type: string,
            description: 'Repository owner (user or organization).',
          }
        repo: { type: string, description: 'Repository name.' }
        title: { type: string, description: 'Issue title.' }
        body:
          {
            type: string,
            description: 'Issue body content (Markdown supported).',
          }
        labels: { type: array, description: 'Array of label names to apply.' }
        assignees: { type: array, description: 'Array of usernames to assign.' }
      required: [owner, repo, title]
    output: '{ number: number, url: string }'
    mock: |
      const number = 1 + (input.title.length % 999);
      return { number, url: `https://github.com/${input.owner}/${input.repo}/issues/${number}` };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json', 'User-Agent': 'Tale' };
        const payload = { title: input.title };
        if (input.body != null) payload.body = input.body;
        if (input.labels != null) payload.labels = input.labels;
        if (input.assignees != null) payload.assignees = input.assignees;
        const r = await ctx.http.post(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/issues`, { headers: h, body: JSON.stringify(payload) });
        if (!r.status || r.status >= 400) throw new Error(`GitHub create_issue failed (${r.status}): ${r.text()}`);
        const j = r.json();
        return { number: j.number, url: j.html_url };
    exampleInput:
      { owner: 'octocat', repo: 'hello-world', title: 'Something is broken' }
  - name: list_pull_requests
    description: List pull requests for a repository.
    effects: read
    input:
      type: object
      properties:
        owner:
          {
            type: string,
            description: 'Repository owner (user or organization).',
          }
        repo: { type: string, description: 'Repository name.' }
        head:
          {
            type: string,
            description: 'Filter by head branch in the form user:ref-name.',
          }
        base:
          {
            type: string,
            description: 'Filter by base branch name (e.g. main).',
          }
        state:
          {
            type: string,
            description: 'Filter by state: open, closed, or all.',
          }
        per_page: { type: number, description: 'Results per page (max 100).' }
        page: { type: number, description: 'Page number for pagination.' }
        sort:
          {
            type: string,
            description: 'Sort field: created, updated, popularity, or long-running.',
          }
        direction: { type: string, description: 'Sort direction: asc or desc.' }
      required: [owner, repo]
    output: '{ pull_requests: Array<{ number: number, title: string, state: string, html_url: string }> }'
    mock: |
      return { pull_requests: [{ number: 1, title: 'Example pull request', state: input.state || 'open', html_url: `https://github.com/${input.owner}/${input.repo}/pull/1` }] };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Tale' };
        const q = [];
        for (const k of ['head', 'base', 'state', 'per_page', 'page', 'sort', 'direction']) if (input[k] != null && input[k] !== '') q.push(k + '=' + encodeURIComponent(String(input[k])));
        const qs = q.length ? '?' + q.join('&') : '';
        const r = await ctx.http.get(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/pulls${qs}`, { headers: h });
        if (!r.status || r.status >= 400) throw new Error(`GitHub list_pull_requests failed (${r.status}): ${r.text()}`);
        return { pull_requests: r.json() };
    exampleInput: { owner: 'octocat', repo: 'hello-world', state: 'open' }
  - name: get_pull_request
    description: Get a single pull request by number.
    effects: read
    input:
      type: object
      properties:
        owner:
          {
            type: string,
            description: 'Repository owner (user or organization).',
          }
        repo: { type: string, description: 'Repository name.' }
        pull_number: { type: number, description: 'Pull request number.' }
      required: [owner, repo, pull_number]
    output: '{ pull_request: { number: number, title: string, state: string, merged: boolean, html_url: string } }'
    mock: |
      return { pull_request: { number: input.pull_number, title: 'Example pull request', state: 'open', merged: false, html_url: `https://github.com/${input.owner}/${input.repo}/pull/${input.pull_number}` } };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Tale' };
        const r = await ctx.http.get(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/pulls/${encodeURIComponent(input.pull_number)}`, { headers: h });
        if (!r.status || r.status >= 400) throw new Error(`GitHub get_pull_request failed (${r.status}): ${r.text()}`);
        return { pull_request: r.json() };
    exampleInput: { owner: 'octocat', repo: 'hello-world', pull_number: 1 }
  - name: create_pull_request
    description: Create a new pull request in a repository.
    effects: write
    input:
      type: object
      properties:
        owner:
          {
            type: string,
            description: 'Repository owner (user or organization).',
          }
        repo: { type: string, description: 'Repository name.' }
        title: { type: string, description: 'Pull request title.' }
        head:
          {
            type: string,
            description: 'The branch (or user:branch) containing the changes.',
          }
        base: { type: string, description: 'The branch to merge changes into.' }
        body:
          {
            type: string,
            description: 'Pull request body content (Markdown supported).',
          }
      required: [owner, repo, title, head, base]
    output: '{ number: number, url: string }'
    mock: |
      const number = 1 + (input.title.length % 999);
      return { number, url: `https://github.com/${input.owner}/${input.repo}/pull/${number}` };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json', 'User-Agent': 'Tale' };
        const payload = { title: input.title, head: input.head, base: input.base };
        if (input.body != null) payload.body = input.body;
        const r = await ctx.http.post(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/pulls`, { headers: h, body: JSON.stringify(payload) });
        if (!r.status || r.status >= 400) throw new Error(`GitHub create_pull_request failed (${r.status}): ${r.text()}`);
        const j = r.json();
        return { number: j.number, url: j.html_url };
    exampleInput:
      {
        owner: 'octocat',
        repo: 'hello-world',
        title: 'Add feature',
        head: 'feature-branch',
        base: 'main',
      }
  - name: merge_pull_request
    description: Merge a pull request into its base branch.
    effects: write
    input:
      type: object
      properties:
        owner:
          {
            type: string,
            description: 'Repository owner (user or organization).',
          }
        repo: { type: string, description: 'Repository name.' }
        pull_number: { type: number, description: 'Pull request number.' }
        merge_method:
          {
            type: string,
            description: 'merge | squash | rebase (defaults to merge).',
          }
        commit_title:
          { type: string, description: 'Title for the merge commit.' }
        commit_message:
          {
            type: string,
            description: 'Extra detail appended to the merge commit message.',
          }
      required: [owner, repo, pull_number]
    output: '{ merged: boolean, sha: string, message: string }'
    mock: |
      return { merged: true, sha: `mergedsha${input.pull_number}`, message: 'Pull Request successfully merged' };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json', 'User-Agent': 'Tale' };
        const payload = {};
        if (input.merge_method != null) payload.merge_method = input.merge_method;
        if (input.commit_title != null) payload.commit_title = input.commit_title;
        if (input.commit_message != null) payload.commit_message = input.commit_message;
        const r = await ctx.http.put(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/pulls/${encodeURIComponent(input.pull_number)}/merge`, { headers: h, body: JSON.stringify(payload) });
        if (!r.status || r.status >= 400) throw new Error(`GitHub merge_pull_request failed (${r.status}): ${r.text()}`);
        return r.json();
    exampleInput:
      {
        owner: 'octocat',
        repo: 'hello-world',
        pull_number: 1,
        merge_method: 'squash',
      }
  - name: get_pull_request_files
    description: List the files changed in a pull request (filename, status, additions, deletions, patch).
    effects: read
    input:
      type: object
      properties:
        owner: { type: string, description: 'Repository owner.' }
        repo: { type: string, description: 'Repository name.' }
        pull_number: { type: number, description: 'Pull request number.' }
        per_page: { type: number, description: 'Results per page (max 100).' }
        page: { type: number, description: 'Page number.' }
      required: [owner, repo, pull_number]
    output: '{ files: Array<{ filename: string, status: string, additions: number, deletions: number, patch: string }> }'
    mock: |
      return { files: [{ filename: 'README.md', status: 'modified', additions: 3, deletions: 1, patch: '@@ -1 +1 @@' }] };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Tale' };
        const q = [];
        for (const k of ['per_page', 'page']) if (input[k] != null && input[k] !== '') q.push(k + '=' + encodeURIComponent(String(input[k])));
        const qs = q.length ? '?' + q.join('&') : '';
        const r = await ctx.http.get(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/pulls/${encodeURIComponent(input.pull_number)}/files${qs}`, { headers: h });
        if (!r.status || r.status >= 400) throw new Error(`GitHub get_pull_request_files failed (${r.status}): ${r.text()}`);
        return { files: r.json() };
    exampleInput: { owner: 'octocat', repo: 'hello-world', pull_number: 1 }
  - name: get_pull_request_diff
    description: Get the raw unified diff for a pull request.
    effects: read
    input:
      type: object
      properties:
        owner: { type: string, description: 'Repository owner.' }
        repo: { type: string, description: 'Repository name.' }
        pull_number: { type: number, description: 'Pull request number.' }
      required: [owner, repo, pull_number]
    output: '{ diff: string }'
    mock: |
      return { diff: `diff --git a/README.md b/README.md\n@@ -1 +1 @@\n-old\n+new` };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github.diff', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Tale' };
        const r = await ctx.http.get(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/pulls/${encodeURIComponent(input.pull_number)}`, { headers: h });
        if (!r.status || r.status >= 400) throw new Error(`GitHub get_pull_request_diff failed (${r.status}): ${r.text()}`);
        return { diff: r.text() };
    exampleInput: { owner: 'octocat', repo: 'hello-world', pull_number: 1 }
  - name: create_pull_request_review
    description: Submit a review on a pull request (APPROVE, REQUEST_CHANGES, or COMMENT) with an optional body and inline comments.
    effects: write
    input:
      type: object
      properties:
        owner: { type: string, description: 'Repository owner.' }
        repo: { type: string, description: 'Repository name.' }
        pull_number: { type: number, description: 'Pull request number.' }
        event:
          { type: string, description: 'APPROVE | REQUEST_CHANGES | COMMENT.' }
        body:
          {
            type: string,
            description: 'Overall review summary (Markdown). Required for REQUEST_CHANGES and COMMENT.',
          }
        commit_id:
          {
            type: string,
            description: 'SHA the review applies to (defaults to latest).',
          }
        comments:
          {
            type: array,
            description: 'Inline review comments [{ path, line, body }].',
          }
      required: [owner, repo, pull_number, event]
    output: '{ id: number, state: string, html_url: string }'
    mock: |
      return { id: 1 + (input.event.length % 999), state: input.event === 'APPROVE' ? 'APPROVED' : 'COMMENTED', html_url: `https://github.com/${input.owner}/${input.repo}/pull/${input.pull_number}#pullrequestreview-1` };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json', 'User-Agent': 'Tale' };
        const payload = { event: input.event };
        if (input.body != null) payload.body = input.body;
        if (input.comments != null) payload.comments = input.comments;
        if (input.commit_id != null) payload.commit_id = input.commit_id;
        const r = await ctx.http.post(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/pulls/${encodeURIComponent(input.pull_number)}/reviews`, { headers: h, body: JSON.stringify(payload) });
        if (!r.status || r.status >= 400) throw new Error(`GitHub create_pull_request_review failed (${r.status}): ${r.text()}`);
        const j = r.json();
        return { id: j.id, state: j.state, html_url: j.html_url };
    exampleInput:
      {
        owner: 'octocat',
        repo: 'hello-world',
        pull_number: 1,
        event: 'APPROVE',
      }
  - name: create_pull_request_review_comment
    description: Add a single inline comment on a line of a pull request diff.
    effects: write
    input:
      type: object
      properties:
        owner: { type: string, description: 'Repository owner.' }
        repo: { type: string, description: 'Repository name.' }
        pull_number: { type: number, description: 'Pull request number.' }
        body: { type: string, description: 'Comment body (Markdown).' }
        commit_id: { type: string, description: 'SHA the comment applies to.' }
        path: { type: string, description: 'File path the comment is on.' }
        line: { type: number, description: 'Line number in the diff.' }
        side: { type: string, description: 'LEFT or RIGHT.' }
        start_line:
          { type: number, description: 'Start line for a multi-line comment.' }
      required: [owner, repo, pull_number, body, commit_id, path]
    output: '{ id: number, html_url: string }'
    mock: |
      return { id: 1 + (input.body.length % 999), html_url: `https://github.com/${input.owner}/${input.repo}/pull/${input.pull_number}#discussion_r1` };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json', 'User-Agent': 'Tale' };
        const payload = { body: input.body, commit_id: input.commit_id, path: input.path };
        if (input.line != null) payload.line = input.line;
        if (input.side != null) payload.side = input.side;
        if (input.start_line != null) payload.start_line = input.start_line;
        const r = await ctx.http.post(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/pulls/${encodeURIComponent(input.pull_number)}/comments`, { headers: h, body: JSON.stringify(payload) });
        if (!r.status || r.status >= 400) throw new Error(`GitHub create_pull_request_review_comment failed (${r.status}): ${r.text()}`);
        const j = r.json();
        return { id: j.id, html_url: j.html_url };
    exampleInput:
      {
        owner: 'octocat',
        repo: 'hello-world',
        pull_number: 1,
        body: 'Nit: rename this.',
        commit_id: 'abc123',
        path: 'src/index.ts',
      }
  - name: list_issue_comments
    description: List comments on an issue or pull request conversation.
    effects: read
    input:
      type: object
      properties:
        owner: { type: string, description: 'Repository owner.' }
        repo: { type: string, description: 'Repository name.' }
        issue_number:
          { type: number, description: 'Issue or pull request number.' }
        per_page: { type: number, description: 'Results per page (max 100).' }
        page: { type: number, description: 'Page number.' }
      required: [owner, repo, issue_number]
    output: '{ comments: Array<{ id: number, body: string, user: string, html_url: string }> }'
    mock: |
      return { comments: [{ id: 1, body: 'Mock comment.', user: 'octocat', html_url: `https://github.com/${input.owner}/${input.repo}/issues/${input.issue_number}#issuecomment-1` }] };
    backend:
      kind: yaml-js
      live: |
        const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Tale' };
        const q = [];
        for (const k of ['per_page', 'page']) if (input[k] != null && input[k] !== '') q.push(k + '=' + encodeURIComponent(String(input[k])));
        const qs = q.length ? '?' + q.join('&') : '';
        const r = await ctx.http.get(`https://api.github.com/repos/${encodeURIComponent(input.owner)}/${encodeURIComponent(input.repo)}/issues/${encodeURIComponent(input.issue_number)}/comments${qs}`, { headers: h });
        if (!r.status || r.status >= 400) throw new Error(`GitHub list_issue_comments failed (${r.status}): ${r.text()}`);
        return { comments: r.json() };
