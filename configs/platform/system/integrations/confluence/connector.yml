# Integration connector — Confluence Cloud, for importing spaces into the
# knowledge base. Each credential names its own Atlassian site, so the live
# bodies build every URL from `ctx.endpoint` (the credential's https origin)
# rather than a fixed host; the REST root is always `<origin>/wiki/rest/api`.
# Basic auth carries the account email + an API token, injected as the
# Authorization header.
name: confluence
displayName: Confluence
description: Import Confluence Cloud pages into Tale's knowledge base.
tags:
  - Knowledge
endpointMode: per-credential
allowedHosts:
  - atlassian.net
auth:
  - method: basic
actions:
  - name: list_pages
    description: >-
      List a Confluence space's pages. Cursor pagination is handled internally
      (soft-capped; `truncated: true` beyond the cap). Archived pages are
      reported as ids only so that archiving a page never deletes the document
      it produced — only pages absent from both passes are genuinely gone.
    effects: read
    input:
      type: object
      required: [spaceKey]
      properties:
        spaceKey:
          type: string
          description: >-
            Space key — the <KEY> segment in
            https://<site>.atlassian.net/wiki/spaces/<KEY>.
        label:
          type: string
          description: >-
            Optional label to filter pages (CQL `label`). Leave empty to sync
            every page in the space.
    output: '{ pages: Array<{ id: string, title: string, version: number, modifiedAt?: string, spaceKey?: string, ancestorPath: string, hasChildren: boolean, folderSubPath: string, webUrl?: string }>, archivedIds: string[], truncated: boolean }'
    mock: |
      const space = input.spaceKey;
      const parent = { id: 'mock-1', title: 'Handbook', version: 3, spaceKey: space, ancestorPath: '', hasChildren: true, folderSubPath: 'Handbook' };
      const child = { id: 'mock-2', title: 'Onboarding', version: 1, spaceKey: space, ancestorPath: 'Handbook', hasChildren: false, folderSubPath: 'Handbook' };
      return { pages: [parent, child], archivedIds: [], truncated: false };
    backend:
      kind: yaml-js
      live: |
        const PAGE_LIMIT = 100;
        const MAX_LIST_PAGES = 40;
        const apiBase = ctx.endpoint + '/wiki/rest/api';

        const cqlEscape = (v) => String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
        let cql = 'space="' + cqlEscape(input.spaceKey) + '" and type=page';
        if (input.label) cql += ' and label="' + cqlEscape(input.label) + '"';

        const sanitize = (name) => {
          let cleaned = String(name || '')
            .replace(/[\x00-\x1F\x7F]/g, '')
            .replace(/[/\\?*<>:"|]/g, '_')
            .trim()
            .slice(0, 255);
          if (cleaned.length > 0) {
            const last = cleaned.charCodeAt(cleaned.length - 1);
            if (last >= 0xd800 && last <= 0xdfff) cleaned = cleaned.slice(0, -1);
          }
          if (cleaned === '.' || cleaned === '..') cleaned = '_';
          return cleaned.length > 0 ? cleaned : '_';
        };

        // Follow `_links.next` until exhausted or the request cap is hit. `next`
        // is relative to `_links.base` (which already carries the "/wiki"
        // prefix) — resolving it against apiBase would double "/rest/api".
        const paginate = async (startUrl) => {
          const results = [];
          let base;
          let truncated = false;
          let fetched = 0;
          let url = startUrl;
          while (true) {
            const r = await ctx.http.get(url, { headers: { Accept: 'application/json' } });
            if (!r.status || r.status >= 400) throw new Error(`Confluence list_pages failed (${r.status}): ${r.text()}`);
            const data = r.json();
            const page = Array.isArray(data.results) ? data.results : [];
            if (base === undefined && data._links) base = data._links.base;
            for (const item of page) results.push(item);
            fetched++;
            const next = data._links ? data._links.next : undefined;
            if (!next) break;
            if (fetched >= MAX_LIST_PAGES) { truncated = true; break; }
            url = base ? base + next : ctx.endpoint + '/wiki' + next;
          }
          return { results, base, truncated };
        };

        const current = await paginate(
          apiBase + '/content/search?cql=' + encodeURIComponent(cql) +
          '&expand=version,ancestors,space&limit=' + PAGE_LIMIT,
        );

        // A page is a container (renders as a folder) exactly when it is an
        // ancestor of another page in the set.
        const parentIds = {};
        for (const r of current.results) {
          const anc = Array.isArray(r.ancestors) ? r.ancestors : [];
          for (const a of anc) if (a && a.id) parentIds[a.id] = true;
        }

        const pages = current.results.map((r) => {
          const anc = Array.isArray(r.ancestors) ? r.ancestors : [];
          const ancestorPath = anc.map((a) => sanitize(a && a.title ? a.title : '')).join('/');
          const hasChildren = !!(r.id && parentIds[r.id]);
          const selfSegment = sanitize(r.title);
          const folderSubPath = hasChildren
            ? (ancestorPath ? ancestorPath + '/' + selfSegment : selfSegment)
            : ancestorPath;
          return {
            id: r.id,
            title: r.title,
            version: r.version && r.version.number ? r.version.number : 0,
            modifiedAt: r.version ? r.version.when : undefined,
            spaceKey: r.space ? r.space.key : undefined,
            ancestorPath,
            hasChildren,
            folderSubPath,
            webUrl: current.base && r._links && r._links.webui ? current.base + r._links.webui : undefined,
          };
        });

        // CQL has no `status` field (it 400s); archived pages are reachable
        // only through the cqlcontext parameter.
        const archived = await paginate(
          apiBase + '/content/search?cql=' + encodeURIComponent(cql) +
          '&cqlcontext=' + encodeURIComponent(JSON.stringify({ contentStatuses: ['archived'] })) +
          '&limit=' + PAGE_LIMIT,
        );

        return {
          pages,
          archivedIds: archived.results.map((r) => r.id),
          truncated: current.truncated || archived.truncated,
        };
    exampleInput: { spaceKey: 'ENG' }
  - name: get_page
    description: >-
      Fetch a single page's rendered content by pageId, convert it to plain
      text, and store it as a text/plain file.
    effects: read
    input:
      type: object
      required: [pageId, title]
      properties:
        pageId:
          {
            type: string,
            description: 'Confluence page ID returned by list_pages.',
          }
        title:
          {
            type: string,
            description: 'Page title to use when storing the converted text.',
          }
    output: '{ file: { id: string, fileName: string, contentType: string, size: number } }'
    mock: |
      const text = `Mock contents of Confluence page ${input.pageId}.`;
      return {
        file: {
          id: `mock-file-${input.pageId}`,
          fileName: `${input.title}.txt`,
          contentType: 'text/plain',
          size: text.length,
        },
      };
    backend:
      kind: yaml-js
      live: |
        const url = ctx.endpoint + '/wiki/rest/api/content/' + encodeURIComponent(input.pageId) +
          '?expand=body.export_view,body.storage';
        const r = await ctx.http.get(url, { headers: { Accept: 'application/json' } });

        // A page listed in one run can be deleted, archived, or restricted
        // before it is fetched. These surface as clear skips so the caller's
        // continue-on-error moves to the next page instead of aborting the
        // batch or creating an empty document.
        if (r.status === 404 || r.status === 410) {
          throw new Error(`Confluence page ${input.pageId} no longer exists (deleted between listing and fetch) — skipping.`);
        }
        if (r.status === 403) {
          throw new Error(`Confluence page ${input.pageId} is restricted for this account — skipping.`);
        }
        if (!r.status || r.status >= 400) throw new Error(`Confluence get_page failed (${r.status}): ${r.text()}`);

        const body = r.json().body || {};
        const html = (body.export_view && body.export_view.value) || (body.storage && body.storage.value) || '';
        const text = html
          .replace(/<br\s*\/?>/gi, '\n')
          .replace(/<\/p>/gi, '\n\n')
          .replace(/<[^>]+>/g, '')
          .replace(/&nbsp;/g, ' ')
          .replace(/&amp;/g, '&')
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"')
          .replace(/\n{3,}/g, '\n\n')
          .trim();

        const file = await ctx.files.store(text, {
          encoding: 'utf-8',
          contentType: 'text/plain',
          fileName: input.title + '.txt',
        });
        return { file };
    exampleInput: { pageId: '123456', title: 'Onboarding' }
