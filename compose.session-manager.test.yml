# =============================================================================
# Tale Session Manager — Container test overrides
# =============================================================================
# Override compose.session-manager.yml with a non-conflicting port for CI smoke
# / image-validation tests. Unlike the sites' overrides it adds no .env.test:
# that is the platform's test environment (database passwords, API keys) and
# the manager has no use for it. The test helper still passes it as --env-file.
#
# Usage:
#   docker compose -f compose.session-manager.yml -f compose.session-manager.test.yml --env-file .env.test -p tale-session-manager-test up -d --build
#   docker compose -f compose.session-manager.yml -f compose.session-manager.test.yml --env-file .env.test -p tale-session-manager-test down -v

services:
  session-manager:
    # Not the stack's own name: a manager you run for real keeps it.
    container_name: tale-session-manager-test

    # Compose appends the ports of an override to the base file's. Replaced
    # here, or the test would also publish 3004, where a running manager sits.
    # The `!override` tag needs Docker Compose 2.24.4 or newer (an older one
    # stops with "unknown tag").
    ports: !override
      - '127.0.0.1:13004:3004'

    environment:
      # The server refuses every Host it does not know except on /api/health.
      SESSION_MANAGER_ALLOWED_HOSTS: localhost:13004,127.0.0.1:13004

    # As soon as it starts, the server fetches the Camoufox browser (624 MB)
    # and the GeoIP database from GitHub in the background. The test needs
    # neither, and must neither spend that bandwidth nor depend on the network.
    # api.github.com is the first thing both downloads ask: pointed at the
    # container's own loopback, each is refused five times, five seconds apart,
    # and gives up with nothing transferred (about 25 s for the browser, then
    # about 25 s for the database). The server stays up and healthy, and
    # /api/meta reports the failed install, which the probes do not read.
    extra_hosts:
      - 'api.github.com=127.0.0.1'
