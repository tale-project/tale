# Host bun-dev overrides: this file is applied ONLY when Convex + Vite run on the
# host (via services/platform/scripts/dev.ts), never by the fully-dockerized dev
# command (docker compose -f compose.yml -f compose.dev.yml -f compose.docs.yml).
# It carries the deltas that only make sense when the host owns the backend.
#
# 1) Publish Bifrost's management/data port on loopback so the host-running
#    Convex (bun dev) can mint/revoke session virtual keys. compose.yml publishes
#    no Bifrost port by design (prod posture). Pair with
#    BIFROST_URL=http://127.0.0.1:8080 in services/platform/.env.local (synced
#    into the Convex deployment env).
#
# 2) Drop rag/crawler's dependency on the dockerized convex. Those services only
#    depend on it to wait for it to SEED the shared convex-data volume with a
#    deployment.json (external knowledge-Postgres routing). In host bun-dev the
#    backend is the host Convex (SQLite under .convex/local) — it does NOT write
#    that docker volume — and with no deployment.json present rag/crawler fall
#    back to the bundled db (see services/rag/docker-entrypoint.sh). Removing the
#    edge stops compose from pulling up a redundant convex container alongside
#    the host one. `!override` REPLACES the base depends_on map (a merge can't
#    remove the convex key). NOT done in compose.dev.yml on purpose: the
#    fully-dockerized dev path still needs convex to seed the volume first.
#
# Usage (host bun-dev appends this automatically; manual equivalent):
#   docker compose -f compose.yml -f compose.dev.yml -f compose.docs.yml \
#     -f compose.bifrost-dev.yml up -d
services:
  bifrost:
    ports:
      - '127.0.0.1:8080:8080'

  rag:
    depends_on: !override
      db:
        condition: service_healthy

  crawler:
    depends_on: !override
      db:
        condition: service_healthy
